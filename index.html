<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Avatar AI</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#070910;
    --panel:#0d111d;
    --panel2:#111827;
    --line:#253047;
    --cyan:#00eaff;
    --violet:#8b5cf6;
    --pink:#ff3cac;
    --green:#27f5a0;
    --text:#e9f4ff;
    --muted:#8090a8;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    background:
      radial-gradient(circle at 20% 10%,rgba(0,234,255,.08),transparent 30%),
      radial-gradient(circle at 85% 20%,rgba(139,92,246,.09),transparent 35%),
      #070910;
}

.app{
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr) 380px;
    gap:12px;
    padding:12px;
}

.stage{
    position:relative;
    min-width:0;
    min-height:0;
    border:1px solid rgba(0,234,255,.15);
    border-radius:24px;
    overflow:hidden;
    background:#05070d;
    box-shadow:
        inset 0 0 60px rgba(0,0,0,.65),
        0 0 40px rgba(0,234,255,.04);
}

#avatarCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

.hud{
    position:absolute;
    left:18px;
    right:18px;
    top:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.brand{
    padding:9px 13px;
    border:1px solid rgba(0,234,255,.22);
    border-radius:12px;
    background:rgba(5,9,17,.65);
    backdrop-filter:blur(12px);
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.brand b{
    color:var(--cyan);
    letter-spacing:2px;
    font-size:12px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border:1px solid rgba(39,245,160,.2);
    border-radius:20px;
    background:rgba(5,9,17,.65);
    backdrop-filter:blur(12px);
    font-size:11px;
    color:#b7c7da;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px var(--green);
}

.subtitle{
    position:absolute;
    left:7%;
    right:7%;
    bottom:25px;
    min-height:48px;
    padding:12px 18px;
    text-align:center;
    border-radius:15px;
    border:1px solid rgba(0,234,255,.15);
    background:rgba(4,7,14,.72);
    backdrop-filter:blur(15px);
    color:#f1f7ff;
    font-size:14px;
    line-height:1.45;
    box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.panel{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    border:1px solid rgba(139,92,246,.16);
    border-radius:24px;
    overflow:hidden;
    background:
      linear-gradient(145deg,rgba(17,24,39,.96),rgba(7,10,18,.98));
    box-shadow:
      inset 1px 1px 0 rgba(255,255,255,.025),
      0 20px 50px rgba(0,0,0,.35);
}

.panel-head{
    padding:18px;
    border-bottom:1px solid var(--line);
}

.panel-head h1{
    margin:0;
    font-size:18px;
    letter-spacing:.3px;
}

.panel-head p{
    margin:5px 0 0;
    color:var(--muted);
    font-size:11px;
}

.chat{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.chat::-webkit-scrollbar{
    width:4px;
}

.chat::-webkit-scrollbar-thumb{
    background:#26334b;
    border-radius:10px;
}

.msg{
    max-width:88%;
    padding:11px 13px;
    border-radius:16px;
    font-size:13px;
    line-height:1.4;
    animation:msgIn .25s ease;
}

.msg.user{
    align-self:flex-end;
    background:linear-gradient(135deg,#164e63,#123047);
    border:1px solid rgba(0,234,255,.18);
}

.msg.avatar{
    align-self:flex-start;
    background:#111827;
    border:1px solid rgba(139,92,246,.15);
}

@keyframes msgIn{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:none}
}

.controls{
    padding:14px;
    border-top:1px solid var(--line);
    background:rgba(4,7,14,.45);
}

textarea{
    width:100%;
    height:90px;
    resize:none;
    outline:none;
    border:1px solid #26334b;
    border-radius:16px;
    padding:13px;
    color:var(--text);
    background:#090e18;
    font:13px/1.45 inherit;
    box-shadow:inset 0 2px 12px rgba(0,0,0,.3);
}

textarea:focus{
    border-color:rgba(0,234,255,.5);
    box-shadow:
      0 0 0 2px rgba(0,234,255,.05),
      inset 0 2px 12px rgba(0,0,0,.3);
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:9px;
}

button{
    border:0;
    outline:none;
    cursor:pointer;
    color:white;
    border-radius:13px;
    min-height:43px;
    padding:0 13px;
    font-weight:700;
    font-size:12px;
    transition:.18s ease;
}

button:active{
    transform:scale(.97);
}

.speak{
    background:linear-gradient(135deg,#00a9bd,#006dff);
    box-shadow:0 7px 25px rgba(0,174,255,.18);
}

.stop{
    background:#171d2a;
    border:1px solid #2b3850;
}

.share{
    display:none;
    margin-top:8px;
    width:100%;
    background:linear-gradient(135deg,#12b76a,#087f52);
}

.share.show{
    display:block;
}

.progress-wrap{
    margin-top:10px;
    height:5px;
    overflow:hidden;
    border-radius:10px;
    background:#1a2333;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));
    box-shadow:0 0 15px rgba(0,234,255,.7);
    transition:width .08s linear;
}

.meta{
    margin-top:7px;
    display:flex;
    justify-content:space-between;
    color:#63728b;
    font-size:10px;
}

@media(max-width:850px){
    .app{
        grid-template-columns:1fr;
        grid-template-rows:55vh 45vh;
        padding:7px;
        gap:7px;
    }

    .panel{
        border-radius:18px;
    }

    .stage{
        border-radius:18px;
    }

    .panel-head{
        padding:10px 13px;
    }

    .panel-head h1{
        font-size:15px;
    }

    .chat{
        padding:9px 12px;
    }

    textarea{
        height:62px;
    }

    .controls{
        padding:9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <section class="stage">
        <canvas id="avatarCanvas"></canvas>

        <div class="hud">
            <div class="brand">
                <b>NEON AVATAR</b>
            </div>

            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">READY</span>
            </div>
        </div>

        <div class="subtitle" id="subtitle">
            Salam! Mən sizin 3D avatar köməkçinizəm.
        </div>
    </section>

    <aside class="panel">

        <div class="panel-head">
            <h1>Avatar Chat</h1>
            <p>Speech • Viseme • Gesture • Video</p>
        </div>

        <div class="chat" id="chat">
            <div class="msg avatar">
                Salam! Mən mətninizi danışa, dodaq hərəkətlərini sinxronlaşdıra və jestlərlə müşayiət edə bilərəm.
            </div>
        </div>

        <div class="controls">

            <textarea
                id="message"
                maxlength="1200"
                placeholder="Avatarın deməsini istədiyiniz mətni yazın..."
            ></textarea>

            <div class="actions">
                <button class="speak" id="speakBtn">
                    ▶ DANIŞDIR + VİDEO
                </button>

                <button class="stop" id="stopBtn">
                    ■ DAYANDIR
                </button>
            </div>

            <button class="share" id="shareBtn">
                WhatsApp ilə Göndər
            </button>

            <div class="progress-wrap">
                <div class="progress" id="progress"></div>
            </div>

            <div class="meta">
                <span id="recordState">Video hazır deyil</span>
                <span id="counter">0 / 1200</span>
            </div>

        </div>
    </aside>

</div>

<script>
"use strict";

/* =========================================================
   BASIC DOM
========================================================= */

const canvas = document.getElementById("avatarCanvas");
const subtitle = document.getElementById("subtitle");
const chat = document.getElementById("chat");
const message = document.getElementById("message");
const speakBtn = document.getElementById("speakBtn");
const stopBtn = document.getElementById("stopBtn");
const shareBtn = document.getElementById("shareBtn");
const progress = document.getElementById("progress");
const statusText = document.getElementById("statusText");
const recordState = document.getElementById("recordState");
const counter = document.getElementById("counter");
const statusDot = document.getElementById("statusDot");

message.addEventListener("input",()=>{
    counter.textContent = message.value.length + " / 1200";
});

/* =========================================================
   THREE.JS SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070d);

scene.fog = new THREE.FogExp2(0x05070d,0.035);

const camera = new THREE.PerspectiveCamera(
    34,
    1,
    .1,
    100
);

camera.position.set(0,1.25,6.8);

const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:false,
    preserveDrawingBuffer:false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

/* =========================================================
   LIGHTING
========================================================= */

const ambient = new THREE.AmbientLight(0x8ea4c8,.8);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff,2.4);
keyLight.position.set(-3,5,5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = .1;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -4;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x4488ff,1.15);
fillLight.position.set(4,2,2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x00eaff,2.6);
rimLight.position.set(0,4,-5);
scene.add(rimLight);

/* =========================================================
   MATERIALS
========================================================= */

function mat(color,rough=.45,metal=.05){
    return new THREE.MeshStandardMaterial({
        color,
        roughness:rough,
        metalness:metal
    });
}

const skin = mat(0xd89b78,.65,0);
const skinDark = mat(0x9d6048,.7,0);
const shirt = mat(0x101b30,.5,.35);
const shirt2 = mat(0x16284a,.45,.35);
const black = mat(0x050609,.3,.15);
const eyeWhite = mat(0xf5f8ff,.18,0);
const irisMat = mat(0x26e8ff,.15,.4);
const mouthDark = mat(0x210b12,.8,0);
const lipMat = mat(0x9e4053,.45,.05);

/* =========================================================
   AVATAR ROOT
========================================================= */

const avatar = new THREE.Group();
avatar.position.y = -1.45;
scene.add(avatar);

/* =========================================================
   TORSO
========================================================= */

const torso = new THREE.Group();
avatar.add(torso);

const torsoMesh = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.05,1.35,12,32),
    shirt
);

torsoMesh.scale.set(1.18,.95,.72);
torsoMesh.position.y = -.25;
torsoMesh.castShadow = true;
torsoMesh.receiveShadow = true;
torso.add(torsoMesh);

const collar = new THREE.Mesh(
    new THREE.TorusGeometry(.36,.075,12,32),
    shirt2
);

collar.rotation.x = Math.PI/2;
collar.position.set(0,.52,.63);
collar.scale.set(1.25,.8,1);
collar.castShadow = true;
torso.add(collar);

/* =========================================================
   NECK
========================================================= */

const neck = new THREE.Group();
neck.position.y = .75;
torso.add(neck);

const neckMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(.36,.43,.75,32),
    skinDark
);

neckMesh.castShadow = true;
neck.add(neckMesh);

/* =========================================================
   HEAD
========================================================= */

const head = new THREE.Group();
head.position.set(0,1.43,.05);
neck.add(head);

const skull = new THREE.Mesh(
    new THREE.SphereGeometry(1.02,48,32),
    skin
);

skull.scale.set(.93,1.12,.86);
skull.castShadow = true;
skull.receiveShadow = true;
head.add(skull);

/* ears */

function createEar(side){
    const ear = new THREE.Mesh(
        new THREE.SphereGeometry(.22,24,16),
        skin
    );

    ear.scale.set(.48,1,.55);
    ear.position.set(side*.9,.03,0);
    ear.castShadow = true;

    head.add(ear);
}

createEar(-1);
createEar(1);

/* =========================================================
   HAIR
========================================================= */

const hair = new THREE.Mesh(
    new THREE.SphereGeometry(1.02,32,20,0,Math.PI*2,0,Math.PI*.48),
    black
);

hair.scale.set(.96,.95,.9);
hair.position.y = .42;
hair.rotation.x = -.05;
head.add(hair);

/* =========================================================
   EYES
========================================================= */

const eyes = [];

function createEye(side){

    const eyeGroup = new THREE.Group();

    eyeGroup.position.set(side*.36,.23,.79);

    const white = new THREE.Mesh(
        new THREE.SphereGeometry(.185,24,18),
        eyeWhite
    );

    white.scale.set(1,.78,.6);
    white.castShadow = true;
    eyeGroup.add(white);

    const iris = new THREE.Mesh(
        new THREE.SphereGeometry(.095,20,16),
        irisMat
    );

    iris.position.set(0,0,.145);
    eyeGroup.add(iris);

    const pupil = new THREE.Mesh(
        new THREE.SphereGeometry(.044,16,12),
        black
    );

    pupil.position.set(0,0,.22);
    eyeGroup.add(pupil);

    head.add(eyeGroup);
    eyes.push({
        group:eyeGroup,
        white,
        iris,
        pupil,
        side
    });
}

createEye(-1);
createEye(1);

/* =========================================================
   EYEBROWS
========================================================= */

const brows = [];

function createBrow(side){

    const brow = new THREE.Mesh(
        new THREE.BoxGeometry(.32,.065,.07),
        black
    );

    brow.position.set(side*.36,.51,.83);
    brow.rotation.z = side*.08;

    head.add(brow);
    brows.push(brow);
}

createBrow(-1);
createBrow(1);

/* =========================================================
   NOSE
========================================================= */

const nose = new THREE.Mesh(
    new THREE.SphereGeometry(.16,20,20),
    skinDark
);

nose.scale.set(.7,1.45,.8);
nose.position.set(0,-.02,.88);
head.add(nose);

/* =========================================================
   MOUTH SYSTEM
========================================================= */

const mouth = new THREE.Group();
mouth.position.set(0,-.40,.82);
head.add(mouth);

const jaw = new THREE.Group();
jaw.position.y = 0;
mouth.add(jaw);

const mouthCavity = new THREE.Mesh(
    new THREE.SphereGeometry(.34,32,20),
    mouthDark
);

mouthCavity.scale.set(1,.42,.3);
mouthCavity.position.z = .02;
jaw.add(mouthCavity);

/* teeth */

const teeth = new THREE.Mesh(
    new THREE.BoxGeometry(.48,.12,.08),
    eyeWhite
);

teeth.position.set(0,.08,.28);
teeth.visible = false;
jaw.add(teeth);

/* upper lip */

const upperLip = new THREE.Mesh(
    new THREE.SphereGeometry(.24,24,16),
    lipMat
);

upperLip.scale.set(1.65,.27,.32);
upperLip.position.set(0,.045,.31);
upperLip.castShadow = true;
mouth.add(upperLip);

/* lower lip */

const lowerLip = new THREE.Mesh(
    new THREE.SphereGeometry(.23,24,16),
    lipMat
);

lowerLip.scale.set(1.65,.30,.32);
lowerLip.position.set(0,-.065,.32);
lowerLip.castShadow = true;
mouth.add(lowerLip);

/* mouth corners */

const cornerL = new THREE.Mesh(
    new THREE.SphereGeometry(.065,16,12),
    lipMat
);

const cornerR = cornerL.clone();

cornerL.position.set(-.38,-.005,.31);
cornerR.position.set(.38,-.005,.31);

mouth.add(cornerL,cornerR);

/* =========================================================
   ARMS / HAND HIERARCHY
========================================================= */

function createArm(side){

    const shoulder = new THREE.Group();
    shoulder.position.set(side*1.02,.2,0);
    torso.add(shoulder);

    const upper = new THREE.Group();
    shoulder.add(upper);

    const upperMesh = new THREE.Mesh(
        new THREE.CapsuleGeometry(.20,.72,8,16),
        shirt2
    );

    upperMesh.position.y = -.38;
    upperMesh.castShadow = true;
    upper.add(upperMesh);

    const elbow = new THREE.Group();
    elbow.position.y = -.78;
    upper.add(elbow);

    const fore = new THREE.Mesh(
        new THREE.CapsuleGeometry(.17,.65,8,16),
        skin
    );

    fore.position.y = -.34;
    fore.castShadow = true;
    elbow.add(fore);

    const hand = new THREE.Group();
    hand.position.y = -.72;
    elbow.add(hand);

    const palm = new THREE.Mesh(
        new THREE.SphereGeometry(.19,20,16),
        skin
    );

    palm.scale.set(.85,1.25,.65);
    palm.castShadow = true;
    hand.add(palm);

    return {
        shoulder,
        upper,
        elbow,
        hand
    };
}

const leftArm = createArm(-1);
const rightArm = createArm(1);

/* =========================================================
   BACKGROUND
========================================================= */

const floor = new THREE.Mesh(
    new THREE.CircleGeometry(8,64),
    new THREE.MeshStandardMaterial({
        color:0x070b14,
        roughness:.9,
        metalness:.05
    })
);

floor.rotation.x = -Math.PI/2;
floor.position.y = -2.55;
floor.receiveShadow = true;
scene.add(floor);

const ring = new THREE.Mesh(
    new THREE.TorusGeometry(2.4,.012,12,100),
    new THREE.MeshBasicMaterial({
        color:0x00eaff,
        transparent:true,
        opacity:.32
    })
);

ring.rotation.x = Math.PI/2;
ring.position.y = -2.53;
scene.add(ring);

/* =========================================================
   ANIMATION STATE
========================================================= */

const clock = new THREE.Clock();

let speaking = false;
let recording = false;
let destroyed = false;

let currentViseme = "REST";
let targetViseme = "REST";

let mouthOpen = 0;
let targetMouthOpen = 0;

let blinkValue = 0;
let blinkTarget = 0;

let gestureIntensity = 0;
let targetGestureIntensity = 0;

let speechStart = 0;
let speechDuration = 1;

let recorder = null;
let recordedChunks = [];
let recordedBlob = null;
let recordedUrl = null;

let currentUtterance = null;

/* =========================================================
   VISeme ENGINE
========================================================= */

const visemes = {
    A:{open:.72,width:1.12,lower:-.16,upper:.035},
    E:{open:.48,width:1.35,lower:-.09,upper:.02},
    I:{open:.32,width:1.30,lower:-.06,upper:.015},
    O:{open:.68,width:.92,lower:-.13,upper:.025},
    U:{open:.45,width:.82,lower:-.10,upper:.02},
    M:{open:.06,width:1.05,lower:-.02,upper:.015},
    P:{open:.05,width:1.0,lower:-.02,upper:.015},
    B:{open:.08,width:1.0,lower:-.025,upper:.015},
    F:{open:.22,width:1.08,lower:-.055,upper:.01},
    S:{open:.18,width:1.28,lower:-.04,upper:.02},
    L:{open:.28,width:1.18,lower:-.055,upper:.02},
    REST:{open:.04,width:1,lower:0,upper:0}
};

function classifyViseme(ch){

    ch = ch.toUpperCase();

    if(/[AƏÁÀ]/.test(ch)) return "A";
    if(/[EƏ]/.test(ch)) return "E";
    if(/[İI]/.test(ch)) return "I";
    if(/[OÖ]/.test(ch)) return "O";
    if(/[UÜ]/.test(ch)) return "U";

    if(/[MMP]/.test(ch)) return "M";
    if(ch==="B") return "B";
    if(/[FV]/.test(ch)) return "F";
    if(/[SZŞÇJ]/.test(ch)) return "S";
    if(/[LR]/.test(ch)) return "L";

    return "REST";
}

function getSpeechCharacter(){

    if(!speaking || !currentUtterance) return "REST";

    const text = currentUtterance.text || "";

    if(!text.length) return "REST";

    const elapsed = performance.now() - speechStart;

    const ratio = Math.max(
        0,
        Math.min(1,elapsed/speechDuration)
    );

    const approximateIndex = Math.min(
        text.length-1,
        Math.floor(ratio*text.length)
    );

    let ch = text[approximateIndex] || "";

    if(ch===" " || /[,.!?;:]/.test(ch)){
        return "REST";
    }

    return classifyViseme(ch);
}

/* =========================================================
   BLINK
========================================================= */

let nextBlink = performance.now()+2500;

function updateBlink(now){

    if(now > nextBlink && blinkTarget===0){
        blinkTarget = 1;
        nextBlink = now + 2800 + Math.random()*3500;
    }

    if(blinkTarget===1 && blinkValue>.94){
        blinkTarget = 0;
    }

    blinkValue +=
        (blinkTarget-blinkValue)*
        Math.min(1,clock.getDelta()*13);
}

/* =========================================================
   PROCEDURAL ANIMATION
========================================================= */

function animateAvatar(now){

    const t = now*.001;

    /* breathing */

    const breath =
        Math.sin(t*1.8)*.035 +
        Math.sin(t*.7)*.012;

    torsoMesh.scale.y =
        .95 + breath;

    /* head idle */

    const speakingHead =
        speaking ? Math.sin(t*8.2)*.012 : 0;

    head.rotation.y =
        Math.sin(t*.55)*.025 +
        speakingHead;

    head.rotation.z =
        Math.sin(t*.73)*.012;

    head.position.y =
        1.43 + Math.sin(t*1.4)*.018;

    /* blink */

    const eyeScale =
        Math.max(.06,1-blinkValue*.94);

    eyes.forEach(e=>{
        e.white.scale.y = .78*eyeScale;
        e.iris.scale.y = eyeScale;
        e.pupil.scale.y = eyeScale;
    });

    /* eyebrows */

    brows[0].rotation.z =
        -.08 - gestureIntensity*.08;

    brows[1].rotation.z =
        .08 + gestureIntensity*.08;

    /* speaking gesture */

    targetGestureIntensity = speaking ? 1 : 0;

    gestureIntensity +=
        (targetGestureIntensity-gestureIntensity)*.08;

    const g = gestureIntensity;

    leftArm.shoulder.rotation.z =
        -.10 + Math.sin(t*2.1)*.10*g;

    rightArm.shoulder.rotation.z =
        .10 - Math.sin(t*2.1+1.1)*.10*g;

    leftArm.upper.rotation.x =
        Math.sin(t*2.7)*.16*g;

    rightArm.upper.rotation.x =
        Math.sin(t*2.7+1.2)*.16*g;

    leftArm.elbow.rotation.z =
        -.15 + Math.sin(t*3.2+1)*.18*g;

    rightArm.elbow.rotation.z =
        .15 + Math.sin(t*3.2)*.18*g;

    leftArm.hand.position.z =
        Math.sin(t*2.1)*.15*g;

    rightArm.hand.position.z =
        Math.cos(t*2.0)*.15*g;

    /* more expressive gesture on speech */

    if(speaking){

        const emphasis =
            Math.pow(
                Math.max(0,Math.sin(t*5.5)),
                3
            );

        leftArm.shoulder.rotation.x =
            -.16*emphasis;

        rightArm.shoulder.rotation.x =
            -.16*emphasis;

        head.rotation.x =
            Math.sin(t*3.1)*.025;
    }

    /* viseme */

    targetViseme = getSpeechCharacter();

    const data =
        visemes[targetViseme] ||
        visemes.REST;

    targetMouthOpen =
        data.open;

    mouthOpen +=
        (targetMouthOpen-mouthOpen)*.22;

    jaw.rotation.x =
        mouthOpen*.34;

    jaw.position.y =
        -mouthOpen*.025;

    mouthCavity.scale.y =
        .42 + mouthOpen*.22;

    upperLip.scale.x =
        1.65*data.width;

    lowerLip.scale.x =
        1.65*data.width;

    upperLip.position.y =
        .045 + data.upper;

    lowerLip.position.y =
        -.065 + data.lower;

    cornerL.position.x =
        -.38*data.width;

    cornerR.position.x =
        .38*data.width;

    teeth.visible =
        speaking && mouthOpen>.38;

    teeth.scale.y =
        .7 + mouthOpen*.35;

    /* eye movement */

    eyes.forEach((e,i)=>{

        const look =
            Math.sin(t*.8+i*.4)*.025;

        e.iris.position.x = look;
        e.pupil.position.x = look;
    });

    /* floor ring */

    ring.rotation.z = t*.15;
    ring.material.opacity =
        .25 + Math.sin(t*2)*.05;
}

/* =========================================================
   RENDER LOOP
========================================================= */

function resize(){

    const rect =
        canvas.getBoundingClientRect();

    const w =
        Math.max(1,rect.width);

    const h =
        Math.max(1,rect.height);

    renderer.setSize(w,h,false);

    camera.aspect = w/h;
    camera.updateProjectionMatrix();
}

window.addEventListener("resize",resize);

resize();

let lastFrame = performance.now();

function render(now){

    if(destroyed) return;

    const dt =
        Math.min(.05,(now-lastFrame)/1000);

    lastFrame = now;

    animateAvatar(now);

    renderer.render(scene,camera);

    updateProgress();

    requestAnimationFrame(render);
}

requestAnimationFrame(render);

/* =========================================================
   SPEECH VOICE
========================================================= */

function chooseVoice(){

    const voices =
        speechSynthesis.getVoices();

    if(!voices.length) return null;

    const preferred = [
        "az-AZ",
        "tr-TR",
        "ru-RU",
        "en-US"
    ];

    for(const lang of preferred){

        const v =
            voices.find(x=>
                x.lang.toLowerCase()===
                lang.toLowerCase()
            );

        if(v) return v;
    }

    const az =
        voices.find(x=>
            x.lang.toLowerCase().startsWith("az")
        );

    return az || voices[0];
}

speechSynthesis.onvoiceschanged = ()=>{
    chooseVoice();
};

/* =========================================================
   TEXT TIMING
========================================================= */

function estimateSpeechDuration(text){

    const clean =
        text.trim();

    const words =
        clean ?
        clean.split(/\s+/).length :
        1;

    /*
      SpeechSynthesis does not expose exact timing.
      This estimate keeps the viseme animation synchronized
      approximately with normal speaking speed.
    */

    const base =
        Math.max(
            1.2,
            words / 2.25
        );

    return base*1000;
}

/* =========================================================
   CHAT
========================================================= */

function addMessage(text,type){

    const div =
        document.createElement("div");

    div.className =
        "msg " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}

/* =========================================================
   RECORDER
========================================================= */

function getSupportedMime(){

    const types = [
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
    ];

    for(const type of types){

        if(
            typeof MediaRecorder !== "undefined" &&
            MediaRecorder.isTypeSupported(type)
        ){
            return type;
        }
    }

    return "";
}

function startRecording(){

    if(!canvas.captureStream){
        recordState.textContent =
            "Canvas recording dəstəklənmir";
        return false;
    }

    if(typeof MediaRecorder==="undefined"){
        recordState.textContent =
            "MediaRecorder dəstəklənmir";
        return false;
    }

    const stream =
        canvas.captureStream(30);

    const mime =
        getSupportedMime();

    try{

        recorder =
            mime ?
            new MediaRecorder(
                stream,
                {
                    mimeType:mime,
                    videoBitsPerSecond:5000000
                }
            ) :
            new MediaRecorder(stream);

    }catch(error){

        console.error(error);

        recordState.textContent =
            "Recorder başlatılmadı";

        return false;
    }

    recordedChunks = [];

    recorder.ondataavailable = e=>{

        if(e.data && e.data.size>0){
            recordedChunks.push(e.data);
        }
    };

    recorder.onstop = ()=>{

        if(recordedUrl){
            URL.revokeObjectURL(recordedUrl);
        }

        const finalType =
            recorder.mimeType ||
            "video/webm";

        recordedBlob =
            new Blob(
                recordedChunks,
                {type:finalType}
            );

        recordedUrl =
            URL.createObjectURL(recordedBlob);

        recording = false;

        recordState.textContent =
            "Video hazır • " +
            Math.round(recordedBlob.size/1024) +
            " KB";

        shareBtn.classList.add("show");
        statusText.textContent = "READY";
        statusDot.style.background =
            "var(--green)";

        progress.style.width="100%";
    };

    recorder.start(250);

    recording = true;

    recordState.textContent =
        "Video yazılır...";

    shareBtn.classList.remove("show");

    return true;
}

function stopRecording(){

    if(
        recorder &&
        recorder.state !== "inactive"
    ){
        recorder.stop();
    }
}

/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

    if(!speaking){

        if(!recording){
            return;
        }

        return;
    }

    const elapsed =
        performance.now()-speechStart;

    const p =
        Math.max(
            0,
            Math.min(
                100,
                elapsed/speechDuration*100
            )
        );

    progress.style.width =
        p.toFixed(1)+"%";
}

/* =========================================================
   SPEECH
========================================================= */

function stopEverything(){

    speaking = false;

    try{
        speechSynthesis.cancel();
    }catch(e){}

    currentUtterance = null;

    targetViseme = "REST";
    targetMouthOpen = 0;

    subtitle.textContent =
        "Danışıq dayandırıldı.";

    statusText.textContent =
        "READY";

    statusDot.style.background =
        "var(--green)";

    if(recorder){
        stopRecording();
    }
}

function speakText(text){

    if(!text.trim()) return;

    if(!("speechSynthesis" in window)){

        alert(
            "Bu brauzerdə SpeechSynthesis dəstəklənmir."
        );

        return;
    }

    stopEverything();

    addMessage(text,"user");

    subtitle.textContent = text;

    const utter =
        new SpeechSynthesisUtterance(text);

    currentUtterance = utter;

    const voice =
        chooseVoice();

    if(voice){
        utter.voice = voice;
        utter.lang = voice.lang;
    }else{
        utter.lang = "az-AZ";
    }

    utter.rate = .92;
    utter.pitch = 1.0;
    utter.volume = 1;

    speechStart =
        performance.now();

    speechDuration =
        estimateSpeechDuration(text);

    speaking = true;

    statusText.textContent =
        "SPEAKING";

    statusDot.style.background =
        "var(--cyan)";

    progress.style.width="0%";

    const started =
        startRecording();

    /*
      Recording failure does NOT prevent speech.
    */

    utter.onstart = ()=>{

        speaking = true;

        speechStart =
            performance.now();

        statusText.textContent =
            "SPEAKING";
    };

    utter.onboundary = event=>{

        /*
          boundary events are used as a stronger timing
          signal when the browser exposes them.
        */

        if(
            typeof event.charIndex === "number" &&
            text.length>0
        ){

            const ratio =
                event.charIndex/text.length;

            speechStart =
                performance.now() -
                ratio*speechDuration;
        }
    };

    utter.onerror = event=>{

        console.warn(
            "Speech synthesis:",
            event.error
        );

        speaking = false;

        subtitle.textContent =
            "Speech xətası baş verdi.";

        statusText.textContent =
            "ERROR";

        statusDot.style.background =
            "#ff4d6d";

        stopRecording();
    };

    utter.onend = ()=>{

        speaking = false;

        targetViseme = "REST";
        targetMouthOpen = 0;

        subtitle.textContent =
            text;

        statusText.textContent =
            "READY";

        statusDot.style.background =
            "var(--green)";

        /*
          Give MediaRecorder a moment to flush
          its final frame.
        */

        setTimeout(()=>{
            stopRecording();
        },180);
    };

    try{

        speechSynthesis.speak(utter);

    }catch(error){

        console.error(error);

        speaking = false;

        stopRecording();

        alert(
            "SpeechSynthesis işə salınmadı."
        );
    }
}

/* =========================================================
   BUTTONS
========================================================= */

speakBtn.addEventListener("click",()=>{

    const text =
        message.value.trim();

    if(!text){

        message.focus();
        return;
    }

    speakText(text);
});

stopBtn.addEventListener("click",()=>{
    stopEverything();
});

message.addEventListener("keydown",e=>{

    if(
        e.key==="Enter" &&
        !e.shiftKey
    ){

        e.preventDefault();

        speakBtn.click();
    }
});

/* =========================================================
   WEB SHARE / WHATSAPP
========================================================= */

async function shareVideo(){

    if(!recordedBlob){
        return;
    }

    const filename =
        "neon-avatar-" +
        Date.now() +
        ".webm";

    const file =
        new File(
            [recordedBlob],
            filename,
            {type:recordedBlob.type}
        );

    /*
      Android Chrome can share the actual file
      through Web Share when file sharing is supported.
    */

    if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({files:[file]})
    ){

        try{

            await navigator.share({
                title:"Neon Avatar",
                text:"3D Avatar videosu",
                files:[file]
            });

            return;

        }catch(error){

            if(error.name==="AbortError"){
                return;
            }

            console.warn(
                "Web Share failed:",
                error
            );
        }
    }

    /*
      Fallback:
      download/open video. WhatsApp can then receive
      the saved WebM file manually.
    */

    if(recordedUrl){

        const a =
            document.createElement("a");

        a.href = recordedUrl;
        a.download = filename;

        document.body.appendChild(a);
        a.click();
        a.remove();

        recordState.textContent =
            "Video yadda saxlanıldı — WhatsApp-da əlavə edin.";
    }
}

shareBtn.addEventListener(
    "click",
    shareVideo
);

/* =========================================================
   INITIAL STATE
========================================================= */

window.addEventListener("load",()=>{

    resize();

    setTimeout(()=>{

        const intro =
            "Salam! Mətninizi yazın və DANIŞDIR düyməsinə basın.";

        subtitle.textContent = intro;

    },300);

});

/* =========================================================
   PAGE VISIBILITY EDGE CASE
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(document.hidden && speaking){

            /*
              Do not destroy recording automatically.
              SpeechSynthesis behavior is browser dependent.
            */

            statusText.textContent =
                "BACKGROUND";
        }

        if(!document.hidden && speaking){

            statusText.textContent =
                "SPEAKING";
        }
    }
);

/* =========================================================
   SAFETY / CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        destroyed = true;

        try{
            speechSynthesis.cancel();
        }catch(e){}

        if(
            recorder &&
            recorder.state!=="inactive"
        ){
            recorder.stop();
        }

        if(recordedUrl){
            URL.revokeObjectURL(recordedUrl);
        }
    }
);

</script>
