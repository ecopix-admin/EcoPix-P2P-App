</div><script>

/* =========================================================
   LIVEAZ — WEBRTC LOCAL LIVE ENGINE
   ========================================================= */

let stream = null;
let cameraEnabled = true;
let micEnabled = true;
let frontCamera = true;
let followed = false;
let chatEnabled = true;
let soundEnabled = true;
let likeNumber = 1200;
let viewerNumber = 27;

const video =
    document.getElementById("video");

const startScreen =
    document.getElementById("startScreen");

const cameraOff =
    document.getElementById("cameraOff");

const messages =
    document.getElementById("messages");

const chatInput =
    document.getElementById("chatInput");

const hearts =
    document.getElementById("hearts");

/* =========================================================
   START LIVE
   ========================================================= */

async function startLive(){

    try{

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:
                        frontCamera
                        ? "user"
                        : "environment",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:1920
                    }
                },

                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                }

            });

        video.srcObject = stream;

        if(frontCamera){
            video.classList.add("videoMirror");
        }

        startScreen.style.display = "none";

        addMessage(
            "LiveAZ",
            "Canlı yayım başladı! 🎉"
        );

        addMessage(
            "Sistem",
            "Kamera və mikrofon aktivdir."
        );

        showToast(
            "Canlı yayım başladı"
        );

        startViewerSimulation();

    }catch(error){

        console.error(error);

        showToast(
            "Kamera/mikrofon icazəsi verilmədi."
        );

    }

}

/* =========================================================
   CAMERA
   ========================================================= */

async function switchCamera(){

    if(!stream){
        showToast("Əvvəlcə canlıya başlayın.");
        return;
    }

    frontCamera = !frontCamera;

    stream.getTracks().forEach(
        track => track.stop()
    );

    try{

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:
                        frontCamera
                        ? "user"
                        : "environment",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:1920
                    }
                },

                audio:{
                    echoCancellation:true,
                    noiseSuppression:true
                }

            });

        video.srcObject = stream;

        if(frontCamera){
            video.classList.add("videoMirror");
        }else{
            video.classList.remove("videoMirror");
        }

        showToast(
            frontCamera
            ? "Ön kamera"
            : "Arxa kamera"
        );

    }catch(e){

        showToast(
            "Kamera dəyişdirilə bilmədi."
        );

    }

}

/* =========================================================
   CAMERA ON/OFF
   ========================================================= */

function toggleCamera(){

    if(!stream){
        showToast("Əvvəlcə canlıya başlayın.");
        return;
    }

    cameraEnabled = !cameraEnabled;

    stream.getVideoTracks().forEach(
        track => {
            track.enabled =
                cameraEnabled;
        }
    );

    cameraOff.classList.toggle(
        "show",
        !cameraEnabled
    );

    showToast(
        cameraEnabled
        ? "Kamera aktivdir"
        : "Kamera söndürülüb"
    );

}

/* =========================================================
   MICROPHONE
   ========================================================= */

function toggleMic(){

    if(!stream){
        showToast("Əvvəlcə canlıya başlayın.");
        return;
    }

    micEnabled = !micEnabled;

    stream.getAudioTracks().forEach(
        track => {
            track.enabled =
                micEnabled;
        }
    );

    showToast(
        micEnabled
        ? "Mikrofon aktivdir"
        : "Mikrofon söndürülüb"
    );

}

/* =========================================================
   HEARTS
   ========================================================= */

function sendHeart(){

    likeNumber++;

    document.getElementById("likes")
        .textContent =
        formatNumber(likeNumber);

    createHeart();

}

function createHeart(){

    const heart =
        document.createElement("div");

    heart.className = "heart";

    const heartTypes =
        ["❤️","💗","💖","💕","💓"];

    heart.textContent =
        heartTypes[
            Math.floor(
                Math.random() *
                heartTypes.length
            )
        ];

    heart.style.left =
        (20 + Math.random()*80) + "px";

    heart.style.setProperty(
        "--x",
        ((Math.random()*120)-60)+"px"
    );

    heart.style.setProperty(
        "--r",
        ((Math.random()*60)-30)+"deg"
    );

    heart.style.animationDuration =
        (1.8 + Math.random()*1.3)+"s";

    hearts.appendChild(heart);

    setTimeout(
        ()=>heart.remove(),
        3500
    );

}

/* Double tap */

let lastTap = 0;

document.getElementById("app")
.addEventListener("touchend",function(e){

    const now =
        Date.now();

    if(
        now-lastTap < 300 &&
        e.target === video
    ){
        sendHeart();
        sendHeart();
    }

    lastTap = now;

});

/* =========================================================
   CHAT FILTER
   ========================================================= */

const bannedWords = [

    "spam",
    "scam",
    "porno",
    "fuck",
    "idiot"

];

function containsBadWord(text){

    const normalized =
        text
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s]/gu," ");

    return bannedWords.some(
        word =>
        normalized.includes(word)
    );

}

/* =========================================================
   SEND MESSAGE
   ========================================================= */

function sendMessage(){

    if(!chatEnabled){
        return;
    }

    let text =
        chatInput.value.trim();

    if(!text){
        return;
    }

    if(containsBadWord(text)){

        showToast(
            "Mesaj filtr tərəfindən bloklandı."
        );

        chatInput.value = "";

        return;
    }

    addMessage(
        "Siz",
        text
    );

    chatInput.value = "";

}

/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(
    username,
    text
){

    const message =
        document.createElement("div");

    message.className =
        "msg";

    const safeUser =
        escapeHTML(username);

    const safeText =
        escapeHTML(text);

    message.innerHTML =
        `<b>${safeUser}</b>${safeText}`;

    messages.appendChild(message);

    while(messages.children.length > 12){
        messages.firstChild.remove();
    }

    messages.scrollTop =
        messages.scrollHeight;

}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =========================================================
   SHARE
   ========================================================= */

async function shareLive(){

    const shareData = {

        title:"LiveAZ",

        text:
        "LiveAZ canlı yayımına qoşul!",

        url:
        window.location.href

    };

    try{

        if(
            navigator.share
        ){

            await navigator.share(
                shareData
            );

        }else{

            await navigator.clipboard.writeText(
                window.location.href
            );

            showToast(
                "Canlı linki kopyalandı."
            );

        }

    }catch(e){}

}

/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2200
        );

}

/* =========================================================
   FORMAT NUMBERS
   ========================================================= */

function formatNumber(number){

    if(number >= 1000000){

        return (
            number/1000000
        ).toFixed(1)+"M";

    }

    if(number >= 1000){

        return (
            number/1000
        ).toFixed(1)+"K";

    }

    return String(number);

}
