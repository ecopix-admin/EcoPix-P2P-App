<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZingKey Messenger</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #ff3b6b;
            --accent-blue: #00d2ff;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --chat-in: #334155;
            --chat-out: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #090d16;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HEADER */
        .header {
            padding: 12px 16px;
            background: var(--panel-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            box-shadow: 0 0 10px rgba(255,59,107,0.4);
        }

        /* NAVIGATION TABS */
        .tabs {
            display: flex;
            background: var(--panel-bg);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        /* VIEW CONTAINER */
        .view {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .view.active {
            display: flex;
        }

        /* CHAT LIST & CONTACTS */
        .list-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }

        .list-item:hover {
            background: rgba(255,255,255,0.02);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .item-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ACTIVE CHAT WINDOW */
        .chat-header {
            padding: 10px 16px;
            background: var(--panel-bg);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.4;
            position: relative;
        }

        .bubble.in {
            align-self: flex-start;
            background: var(--chat-in);
            border-bottom-left-radius: 2px;
        }

        .bubble.out {
            align-self: flex-end;
            background: var(--chat-out);
            border-bottom-right-radius: 2px;
        }

        .bubble img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }

        .translation-tag {
            font-size: 10px;
            opacity: 0.8;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* INPUT AREA */
        .chat-input-bar {
            padding: 10px;
            background: var(--panel-bg);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 8px 14px;
            color: var(--text);
            outline: none;
            font-size: 13px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
        }

        .send-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* AUTH MODAL */
        .auth-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            background: var(--panel-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-blue));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- AUTH MODAL -->
    <div class="auth-overlay" id="authModal">
        <div class="auth-card">
            <div class="brand" style="justify-content: center; margin-bottom: 16px;">
                <div class="brand-icon">Z</div>
                <h2>ZingKey Messenger</h2>
            </div>
            <p style="font-size: 12px; color: var(--text-muted); text-align: center;">Nömrənizlə daxil olun</p>
            <input type="text" class="auth-input" id="authName" placeholder="Adınız">
            <input type="tel" class="auth-input" id="authPhone" placeholder="+994XX1234567">
            <button class="auth-btn" onclick="registerUser()">Daxil Ol</button>
        </div>
    </div>

    <!-- MAIN HEADER -->
    <div class="header">
        <div class="brand">
            <div class="brand-icon">Z</div>
            <div style="font-size: 16px; font-weight: 800;">ZingKey</div>
        </div>
        <div style="font-size: 11px; color: var(--accent-blue);" id="currentUserLabel">...</div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('chatsTab', this)">ÇATLAR</div>
        <div class="tab-btn" onclick="switchTab('contactsTab', this)">KONTAKTLAR</div>
        <div class="tab-btn" onclick="switchTab('settingsTab', this)">TƏNZİMLƏMƏLƏR</div>
    </div>

    <!-- CHATS LIST VIEW -->
    <div class="view active" id="chatsTab">
        <div id="chatsListContainer"></div>
    </div>

    <!-- CONTACTS VIEW -->
    <div class="view" id="contactsTab">
        <div style="padding: 10px;">
            <button class="auth-btn" style="padding: 8px; font-size: 12px;" onclick="syncContacts()">Kontaktları Sinxronlaşdır</button>
        </div>
        <div id="contactsListContainer"></div>
    </div>

    <!-- SETTINGS VIEW -->
    <div class="view" id="settingsTab" style="padding: 16px;">
        <h3>Avto-Tərcümə Ayarları</h3>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 6px;">Mesajlar gələrkən seçilən dilə çevriləcək:</p>
        <select class="auth-input" id="targetLanguage">
            <option value="az">Azərbaycan Dili</option>
            <option value="en" selected>İngilis Dili</option>
            <option value="ru">Rus Dili</option>
            <option value="tr">Türk Dili</option>
            <option value="ar">Ərəb Dili</option>
        </select>
        <hr style="border-color: rgba(255,255,255,0.05); margin: 15px 0;">
        <button class="auth-btn" style="background: #334155;" onclick="logout()">Hesabdan Çıx</button>
    </div>

    <!-- ACTIVE CHAT VIEW -->
    <div class="view" id="activeChatView" style="position: absolute; top:0; left:0; width:100%; height:100%; background: #090d16; z-index: 50;">
        <div class="chat-header">
            <button class="back-btn" onclick="closeChat()">✕</button>
            <div class="avatar" id="activeChatAvatar">?</div>
            <div>
                <div style="font-size: 14px; font-weight: 700;" id="activeChatName">User</div>
                <div style="font-size: 10px; color: var(--accent-blue);" id="activeChatPhone">...</div>
            </div>
        </div>

        <div class="chat-box" id="chatMessagesBox"></div>

        <div class="chat-input-bar">
            <button class="icon-btn" onclick="triggerImageUpload()">📷</button>
            <button class="icon-btn" id="micBtn" onclick="toggleVoiceRecognition()">🎙️</button>
            <input type="text" class="input-field" id="messageInput" placeholder="Mesaj yazın...">
            <button class="send-btn" onclick="sendMessage()">➤</button>
            <input type="file" id="fileUploadInput" style="display: none;" accept="image/*" onchange="uploadImage(this)">
        </div>
    </div>
</div>

<script>
    // ** DIQQƏT: Google Apps Script Web App URL-inizi buraya daxil edin **
    const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";
    
    // ** Cloudinary Unsigned Upload Config **
    const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/YOUR_CLOUD_NAME/image/upload";
    const CLOUDINARY_UPLOAD_PRESET = "YOUR_UNSIGNED_PRESET";

    let currentUser = JSON.parse(localStorage.getItem('zingkey_user')) || null;
    let activeTargetUser = null;
    let recognition = null;
    let isListening = false;

    window.onload = () => {
        if(currentUser) {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('currentUserLabel').innerText = currentUser.name;
            loadContacts();
        }
        setupSpeechRecognition();
    };

    function switchTab(tabId, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // REGISTRATION
    function registerUser() {
        const name = document.getElementById('authName').value.trim();
        const phone = document.getElementById('authPhone').value.trim();
        if(!name || !phone) return alert("Ad və nömrəni daxil edin!");

        currentUser = { name, phone };
        
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'register', name, phone })
        }).then(res => res.json()).then(data => {
            localStorage.setItem('zingkey_user', JSON.stringify(currentUser));
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('currentUserLabel').innerText = currentUser.name;
            loadContacts();
        });
    }

    // SYNC CONTACTS (WEB CONTACTS API OR MOCK)
    async function syncContacts() {
        if ('contacts' in navigator && 'ContactsManager' in window) {
            try {
                const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                const phones = contacts.flatMap(c => c.tel);
                fetchRegisteredContacts(phones);
            } catch (e) {
                console.log("Contact picker cancelled");
            }
        } else {
            alert("Veb Kontakt API bu brauzerdə dəstəklənmir. Baza yüklənir...");
            fetchRegisteredContacts([]);
        }
    }

    function fetchRegisteredContacts(contactNumbers) {
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'getContacts', phone: currentUser.phone })
        }).then(res => res.json()).then(data => {
            renderContacts(data.users || []);
        });
    }

    function loadContacts() {
        fetchRegisteredContacts([]);
    }

    function renderContacts(users) {
        const container = document.getElementById('contactsListContainer');
        container.innerHTML = '';
        users.forEach(u => {
            if(u.phone === currentUser.phone) return;
            const item = document.createElement('div');
            item.className = 'list-item';
            item.onclick = () => openChat(u);
            item.innerHTML = `
                <div class="avatar">${u.name[0]}</div>
                <div class="item-info">
                    <div class="item-title">${u.name}</div>
                    <div class="item-sub">${u.phone}</div>
                </div>
            `;
            container.appendChild(item);
        });
    }

    // CHAT MANAGEMENT
    function openChat(user) {
        activeTargetUser = user;
        document.getElementById('activeChatName').innerText = user.name;
        document.getElementById('activeChatPhone').innerText = user.phone;
        document.getElementById('activeChatAvatar').innerText = user.name[0];
        document.getElementById('activeChatView').style.display = 'flex';
        fetchMessages();
    }

    function closeChat() {
        document.getElementById('activeChatView').style.display = 'none';
        activeTargetUser = null;
    }

    function sendMessage(imageUrl = null) {
        const textInput = document.getElementById('messageInput');
        const text = textInput.value.trim();
        if(!text && !imageUrl) return;

        const targetLang = document.getElementById('targetLanguage').value;

        const payload = {
            action: 'sendMessage',
            sender: currentUser.phone,
            receiver: activeTargetUser.phone,
            message: text,
            imageUrl: imageUrl || '',
            targetLang: targetLang
        };

        appendMessageBubble(text, 'out', '', imageUrl);
        textInput.value = '';

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(data => {
            console.log("Message Sent", data);
        });
    }

    function fetchMessages() {
        if(!activeTargetUser) return;
        const targetLang = document.getElementById('targetLanguage').value;

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'getMessages',
                user1: currentUser.phone,
                user2: activeTargetUser.phone,
                targetLang: targetLang
            })
        }).then(res => res.json()).then(data => {
            const box = document.getElementById('chatMessagesBox');
            box.innerHTML = '';
            (data.messages || []).forEach(m => {
                const type = m.sender === currentUser.phone ? 'out' : 'in';
                appendMessageBubble(m.text, type, m.translated, m.imageUrl);
            });
        });
    }

    function appendMessageBubble(text, type, translatedText = '', imageUrl = '') {
        const box = document.getElementById('chatMessagesBox');
        const bubble = document.createElement('div');
        bubble.className = `bubble ${type}`;
        
        let content = text ? `<div>${text}</div>` : '';
        if(imageUrl) content += `<img src="${imageUrl}">`;
        if(translatedText && translatedText !== text) {
            content += `<div class="translation-tag">🌐 ${translatedText}</div>`;
            speakText(translatedText); // Voice Output (TTS)
        }

        bubble.innerHTML = content;
        box.appendChild(bubble);
        box.scrollTop = box.scrollHeight;
    }

    // CLOUDINARY UPLOAD
    function triggerImageUpload() {
        document.getElementById('fileUploadInput').click();
    }

    function uploadImage(fileInput) {
        const file = fileInput.files[0];
        if(!file) return;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        fetch(CLOUDINARY_URL, { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.secure_url) sendMessage(data.secure_url);
        });
    }

    // WEB SPEECH API (STT & TTS)
    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'az-AZ';

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('messageInput').value = spokenText;
                toggleVoiceRecognition();
            };

            recognition.onerror = () => toggleVoiceRecognition();
        }
    }

    function toggleVoiceRecognition() {
        if(!recognition) return alert("Səs tanıma bu brauzerdə dəstəklənmir.");
        const btn = document.getElementById('micBtn');
        if(!isListening) {
            recognition.start();
            isListening = true;
            btn.style.color = '#ff3b6b';
        } else {
            recognition.stop();
            isListening = false;
            btn.style.color = '#00d2ff';
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    }

    function logout() {
        localStorage.removeItem('zingkey_user');
        location.reload();
    }
</script>
</body>
</html>
