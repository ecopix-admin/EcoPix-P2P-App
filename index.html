<!DOCTYPE html>
<!--
  // FIXED BLACK SCREEN BUG:
  // blob URL for local, compressed dataURL for Gun, IDB fallback,
  // publishBtn bound, i18n auto-detect, TikTok-first, Explore grid,
  // P2P persistent.
-->
<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>GeyimDəyiş P2P Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --nav:68px;
  --header:60px;
  --bg:#000;
  --surface:#111;
  --surface2:#181818;
  --border:rgba(255,255,255,.12);
  --text:#fff;
  --muted:#aaa;
  --accent:#fff;
  --green:#25D366;
  --danger:#ff3b30;
  --shadow:0 10px 40px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{overscroll-behavior:none}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

#app{
  position:fixed;
  inset:0;
  background:#000;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:var(--header);
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.62),transparent);
}
.topbar>*{pointer-events:auto}
.brand{
  font-weight:800;
  font-size:18px;
  letter-spacing:-.5px;
  text-shadow:0 2px 8px #000;
}
.top-actions{display:flex;gap:8px}
.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.42);
  color:#fff;
  display:grid;
  place-items:center;
  backdrop-filter:blur(10px);
}
.icon-btn:active{transform:scale(.94)}

#feed,
#favoritesFeed{
  position:absolute;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
}
#favoritesFeed{display:none}

.feed-item{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  background:#000;
  overflow:hidden;
}

.media-scroll{
  position:absolute;
  inset:0;
  display:flex;
  width:100%;
  height:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.media-scroll::-webkit-scrollbar{display:none}

.media-page{
  position:relative;
  flex:0 0 100%;
  width:100%;
  height:100%;
  scroll-snap-align:center;
  overflow:hidden;
  background:#000;
}
.media-page img,
.media-page video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#000;
}

.media-placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  color:#777;
  background:
    radial-gradient(circle at 50% 45%,#151515 0,#050505 55%,#000 100%);
}
.media-placeholder span{
  font-size:12px;
  color:#666;
}

.media-shade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:48%;
  pointer-events:none;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.92) 0%,
    rgba(0,0,0,.62) 30%,
    rgba(0,0,0,.08) 78%,
    transparent 100%
  );
}

.media-dots{
  position:absolute;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:5px;
  z-index:12;
}
.media-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:rgba(255,255,255,.4);
}
.media-dot.active{
  width:18px;
  border-radius:10px;
  background:#fff;
}

.sound-btn{
  position:absolute;
  top:72px;
  right:12px;
  z-index:14;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.42);
  color:#fff;
  display:grid;
  place-items:center;
  backdrop-filter:blur(10px);
}

.item-info{
  position:absolute;
  left:12px;
  right:84px;
  bottom:76px;
  z-index:15;
  pointer-events:none;
}
.author-row{
  display:flex;
  align-items:center;
  gap:10px;
  pointer-events:auto;
}
.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  border:1px solid rgba(255,255,255,.28);
}
.avatar-fallback{
  display:grid;
  place-items:center;
  font-weight:700;
  background:#222;
}
.author-name{
  font-weight:700;
  font-size:14px;
  max-width:190px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.item-title{
  font-size:20px;
  font-weight:800;
  margin-top:9px;
  letter-spacing:-.5px;
}
.item-want{
  margin-top:4px;
  font-size:13px;
  color:#ddd;
}
.item-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}
.chip{
  padding:5px 9px;
  border-radius:20px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  font-size:11px;
  color:#eee;
}
.item-desc{
  margin-top:7px;
  font-size:12px;
  color:#ccc;
  line-height:1.4;
  max-width:95%;
}

.side-actions{
  position:absolute;
  right:10px;
  bottom:125px;
  z-index:25;
  display:flex;
  flex-direction:column;
  gap:13px;
  align-items:center;
}
.action{
  width:48px;
  border:0;
  background:none;
  color:#fff;
  padding:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  text-shadow:0 2px 7px #000;
}
.action .circle{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
}
.action small{
  font-size:10px;
  font-weight:600;
}
.action.liked svg{fill:#ff3040;color:#ff3040}
.action.faved svg{fill:#ffd60a;color:#ffd60a}

.whatsapp{
  position:absolute;
  right:12px;
  bottom:98px;
  width:50px;
  height:50px;
  z-index:30;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#25D366;
  color:#fff;
  box-shadow:0 5px 18px rgba(0,0,0,.45);
  border:2px solid rgba(255,255,255,.8);
}
.whatsapp:active{transform:scale(.94)}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:var(--nav);
  z-index:100;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr 1fr;
  padding:5px 8px env(safe-area-inset-bottom,0);
  background:rgba(0,0,0,.94);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
}
.nav-btn{
  border:0;
  background:none;
  color:#888;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9px;
  font-weight:600;
}
.nav-btn.active{color:#fff}
.nav-add{
  justify-self:center;
  align-self:center;
  width:50px;
  height:38px;
  border-radius:12px;
  background:#fff;
  color:#000;
  display:grid;
  place-items:center;
}
.nav-btn:active{transform:scale(.94)}

#exploreGrid{
  position:absolute;
  inset:0;
  padding-top:var(--header);
  padding-bottom:var(--nav);
  overflow-y:auto;
  display:none;
  background:#000;
}
.explore-head{
  height:50px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
}
.search-box{
  flex:1;
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#141414;
  color:#fff;
  padding:0 13px;
  outline:none;
}
.search-box:focus{border-color:#555}
.search-button{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#222;
  color:#fff;
  display:grid;
  place-items:center;
}
.explore-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}
.grid-card{
  position:relative;
  aspect-ratio:1;
  overflow:hidden;
  background:#111;
}
.grid-card img,
.grid-card video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.grid-video-icon{
  position:absolute;
  top:8px;
  right:8px;
  z-index:3;
  filter:drop-shadow(0 2px 5px #000);
}
.grid-empty{
  grid-column:1/-1;
  min-height:40vh;
  display:grid;
  place-items:center;
  color:#777;
  font-size:13px;
  text-align:center;
  padding:30px;
}

.drawer-backdrop{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.7);
  display:none;
}
.drawer{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:min(86vw,360px);
  background:#0c0c0c;
  transform:translateX(-100%);
  transition:transform .25s ease;
  box-shadow:20px 0 50px rgba(0,0,0,.5);
  overflow-y:auto;
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid var(--border);
}
.drawer-brand{font-weight:800;font-size:18px}
.menu{
  padding:8px;
}
.menu-item{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#ddd;
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 12px;
  text-align:left;
}
.menu-item:hover{background:#181818}
.menu-item .status-dot{margin-left:auto}
.menu-section{
  color:#666;
  font-size:11px;
  text-transform:uppercase;
  padding:16px 12px 7px;
  letter-spacing:.7px;
}
.lang-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:0 5px 10px;
}
.lang-btn{
  border:1px solid var(--border);
  background:#151515;
  color:#aaa;
  height:37px;
  border-radius:9px;
  font-size:11px;
  font-weight:700;
}
.lang-btn.active{
  background:#fff;
  color:#000;
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#777;
  display:inline-block;
}
.status-dot.online{background:#25D366;box-shadow:0 0 9px #25D366}
.status-dot.offline{background:#ff3b30}

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(100%,680px);
  max-height:92dvh;
  overflow-y:auto;
  background:#101010;
  border:1px solid var(--border);
  border-radius:22px 22px 0 0;
  box-shadow:var(--shadow);
  padding:17px;
}
.modal.center{
  border-radius:20px;
  max-height:88dvh;
}
.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}
.modal-title{
  font-size:20px;
  font-weight:800;
}
.close-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  background:#222;
  color:#fff;
  display:grid;
  place-items:center;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.field{margin-bottom:10px}
.field.full{grid-column:1/-1}
.field label{
  display:block;
  font-size:11px;
  color:#aaa;
  margin:0 0 6px 2px;
}
.field input,
.field textarea,
.field select{
  width:100%;
  background:#191919;
  border:1px solid #292929;
  color:#fff;
  border-radius:11px;
  outline:none;
  padding:11px 12px;
}
.field input:focus,
.field textarea:focus{border-color:#555}
.field textarea{min-height:82px;resize:vertical}
.profile-upload{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:13px;
}
.big-avatar-preview{
  width:66px;
  height:66px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}
.file-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid #333;
  background:#1c1c1c;
  color:#fff;
  min-height:42px;
  padding:0 12px;
  border-radius:11px;
  font-size:12px;
  font-weight:600;
}
.file-label input{display:none}
.media-selectors{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.selected-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,80px);
  gap:8px;
  margin-top:10px;
}
.selected-media{
  width:80px;
  height:80px;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  background:#181818;
}
.selected-media img,
.selected-media video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.remove-media{
  position:absolute;
  top:4px;
  right:4px;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  color:#fff;
  display:grid;
  place-items:center;
}
.primary-btn{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#000;
  font-weight:800;
  margin-top:7px;
}
.secondary-btn{
  width:100%;
  min-height:44px;
  border:1px solid #333;
  border-radius:12px;
  background:#191919;
  color:#fff;
}
.help-text{
  color:#777;
  font-size:10px;
  line-height:1.4;
  margin-top:7px;
}

.comments-panel{
  position:fixed;
  left:0;
  right:0;
  bottom:var(--nav);
  z-index:220;
  max-height:45%;
  transform:translateY(110%);
  transition:transform .22s ease;
  background:#111;
  border-radius:20px 20px 0 0;
  border:1px solid var(--border);
  box-shadow:0 -20px 50px rgba(0,0,0,.5);
  display:flex;
  flex-direction:column;
}
.comments-panel.open{transform:translateY(0)}
.comments-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 15px;
  border-bottom:1px solid var(--border);
}
.comments-list{
  overflow-y:auto;
  padding:8px 14px;
  flex:1;
}
.comment{
  display:flex;
  gap:9px;
  padding:9px 0;
}
.comment .avatar{width:30px;height:30px}
.comment-body{min-width:0;flex:1}
.comment-author{font-size:11px;font-weight:700}
.comment-text{font-size:12px;color:#ddd;margin-top:3px;line-height:1.35}
.comment-tools{display:flex;gap:12px;margin-top:5px}
.comment-tool{
  border:0;
  background:none;
  color:#777;
  font-size:10px;
  padding:0;
}
.comment-reply{
  margin-left:39px;
  padding:5px 0;
  border-left:1px solid #333;
  padding-left:10px;
}
.comment-form{
  display:flex;
  gap:7px;
  padding:8px;
  border-top:1px solid var(--border);
}
.comment-input{
  flex:1;
  min-width:0;
  height:42px;
  background:#1b1b1b;
  color:#fff;
  border:1px solid #2c2c2c;
  border-radius:11px;
  padding:0 11px;
  outline:none;
}
.comment-send{
  width:42px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
}

.profile-screen{
  position:fixed;
  inset:0;
  z-index:160;
  display:none;
  background:#000;
  overflow-y:auto;
  padding-top:var(--header);
  padding-bottom:var(--nav);
}
.profile-head{
  padding:20px 15px;
  display:flex;
  gap:16px;
  align-items:center;
}
.profile-big-avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}
.profile-details{flex:1;min-width:0}
.profile-name{
  font-size:21px;
  font-weight:800;
}
.profile-count{
  margin-top:5px;
  color:#999;
  font-size:12px;
}
.profile-wa{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:9px;
  color:#25D366;
  font-size:12px;
}
.profile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}
.profile-grid-card{
  aspect-ratio:1;
  background:#111;
  overflow:hidden;
  position:relative;
}
.profile-grid-card img,
.profile-grid-card video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.legal-body{
  color:#ccc;
  line-height:1.65;
  font-size:13px;
}
.legal-body h3{
  color:#fff;
  margin:18px 0 7px;
  font-size:14px;
}
.legal-body p{margin:8px 0}
.legal-body ul{padding-left:20px}
.legal-body li{margin:5px 0}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(var(--nav) + 18px);
  transform:translate(-50%,20px);
  z-index:500;
  background:#fff;
  color:#000;
  padding:10px 15px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.no-feed{
  position:absolute;
  inset:0;
  display:none;
  place-items:center;
  text-align:center;
  padding:40px;
  color:#777;
}
.no-feed.show{display:grid}

@media(max-width:480px){
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
}
</style>
</head>

<body>
<div id="app">

  <header class="topbar">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">
      <i data-lucide="menu"></i>
    </button>
    <div class="brand">GeyimDəyiş</div>
    <div class="top-actions">
      <button class="icon-btn" id="topSearchBtn" type="button" aria-label="Search">
        <i data-lucide="search"></i>
      </button>
    </div>
  </header>

  <main id="feed"></main>
  <main id="favoritesFeed"></main>

  <section id="exploreGrid">
    <div class="explore-head">
      <input id="searchInput" class="search-box" type="search" data-i18n-placeholder="search_placeholder">
      <button id="searchBtn" class="search-button" type="button">
        <i data-lucide="search"></i>
      </button>
    </div>
    <div id="grid" class="explore-grid"></div>
  </section>

  <div id="noFeed" class="no-feed">
    <div>
      <i data-lucide="package-search" width="40" height="40"></i>
      <p id="noFeedText"></p>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="navHome" type="button">
      <i data-lucide="house"></i>
      <span data-i18n="home"></span>
    </button>
    <button class="nav-btn" id="navExplore" type="button">
      <i data-lucide="layout-grid"></i>
      <span data-i18n="explore"></span>
    </button>
    <button class="nav-btn" id="publishBtn" type="button" onclick="publishItem()">
      <span class="nav-add"><i data-lucide="plus"></i></span>
    </button>
    <button class="nav-btn" id="navFavorites" type="button">
      <i data-lucide="star"></i>
      <span data-i18n="favorites"></span>
    </button>
    <button class="nav-btn" id="navProfile" type="button">
      <i data-lucide="user-round"></i>
      <span data-i18n="profile"></span>
    </button>
  </nav>

function t(key){
  return (i18n[currentLang] && i18n[currentLang][key]) ||
         i18n.en[key] ||
         key;
}

/* ============================================================
   BASIC HELPERS
============================================================ */
function $(id){
  return document.getElementById(id);
}

function uid(prefix='id'){
  return prefix + '_' +
    Date.now().toString(36) + '_' +
    Math.random().toString(36).slice(2,10);
}

function safeJsonParse(value,fallback){
  try{
    return value ? JSON.parse(value) : fallback;
  }catch(e){
    console.warn('JSON parse failed',e);
    return fallback;
  }
}

function normalizeText(value){
  return String(value ?? '')
    .toLocaleLowerCase(currentLang)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function safeUrl(value){
  if(!value) return '';
  const s=String(value);
  if(
    s.startsWith('blob:') ||
    s.startsWith('data:image/') ||
    s.startsWith('data:video/')
  ) return s;
  return '';
}

function formatNumber(n){
  return new Intl.NumberFormat(currentLang).format(Number(n)||0);
}

function timeAgo(ts){
  const diff=Math.max(0,Date.now()-Number(ts||Date.now()));
  const min=Math.floor(diff/60000);
  const hour=Math.floor(min/60);
  const day=Math.floor(hour/24);

  if(min<1) return t('now');
  if(hour<1) return `${min} ${t('minutes')}`;
  if(day<1) return `${hour} ${t('hours')}`;
  return `${day} ${t('days')}`;
}

function normalizeTags(tags){
  if(Array.isArray(tags)) return tags.filter(Boolean).map(String);
  if(typeof tags==='string'){
    return tags.split(/[,\s]+/).map(x=>x.trim()).filter(Boolean);
  }
  return [];
}

function normalizeItem(item){
  if(!item || !item.id) return null;

  const normalized={
    id:String(item.id),
    u:String(item.u || uid('user')),
    av:String(item.av || ''),
    name:String(item.name || t('unknown')),
    item:String(item.item || ''),
    want:String(item.want || ''),
    wa:String(item.wa || ''),
    brand:String(item.brand || ''),
    size:String(item.size || ''),
    desc:String(item.desc || ''),
    tags:normalizeTags(item.tags),
    media:Array.isArray(item.media) ? item.media.map(normalizeMedia).filter(Boolean) : [],
    ts:Number(item.ts || Date.now()),
    likes:Number(item.likes || 0)
  };

  return normalized;
}

function normalizeMedia(m){
  if(!m) return null;
  return {
    id:String(m.id || uid('media')),
    type:String(m.type || 'image').startsWith('video') ? 'video' : 'image',
    mime:String(m.mime || ''),
    name:String(m.name || ''),
    src:String(m.src || ''),
    dataUrl:String(m.dataUrl || ''),
    localBlob:!!m.localBlob
  };
}

/* ============================================================
   INDEXEDDB
============================================================ */
function openDB(){
  if(dbPromise) return dbPromise;

  dbPromise=new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){
      reject(new Error('IndexedDB unavailable'));
      return;
    }

    const req=indexedDB.open(DB_NAME,DB_VERSION);

    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(MEDIA_STORE)){
        db.createObjectStore(MEDIA_STORE,{keyPath:'id'});
      }
    };

    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });

  return dbPromise;
}

async function putMediaBlob(record){
  try{
    const db=await openDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(MEDIA_STORE,'readwrite');
      tx.objectStore(MEDIA_STORE).put(record);
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>reject(tx.error);
    });
  }catch(e){
    console.warn('IDB put failed',e);
    return false;
  }
}

async function getMediaBlob(id){
  if(!id) return null;

  try{
    const db=await openDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(MEDIA_STORE,'readonly');
      const req=tx.objectStore(MEDIA_STORE).get(id);
      req.onsuccess=()=>resolve(req.result || null);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){
    console.warn('IDB get failed',e);
    return null;
  }
}

async function deleteMediaBlob(id){
  if(!id) return;
  try{
    const db=await openDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(MEDIA_STORE,'readwrite');
      tx.objectStore(MEDIA_STORE).delete(id);
      tx.oncomplete=resolve;
      tx.onerror=()=>reject(tx.error);
    });
  }catch(e){
    console.warn('IDB delete failed',e);
  }
}

/* ============================================================
   MEDIA
============================================================ */
function mediaToRecord(file){
  return new Promise(async(resolve)=>{
    const id=uid('media');
    const previewUrl=URL.createObjectURL(file);

    try{
      await putMediaBlob({
        id,
        blob:file,
        type:file.type.startsWith('video/')?'video':'image',
        name:file.name
      });

      if(file.type.startsWith('image/')){
        compressImage(file,800,.7).then(dataUrl=>{
          resolve({
            id,
            type:'image',
            mime:file.type,
            name:file.name,
            src:previewUrl,
            dataUrl,
            localBlob:true
          });
        }).catch(()=>{
          resolve({
            id,
            type:'image',
            mime:file.type,
            name:file.name,
            src:previewUrl,
            dataUrl:'',
            localBlob:true
          });
        });
      }else{
        /*
          Video is kept as original Blob locally in IDB.
          Gun receives no huge original video dataURL.
          This prevents localStorage/Gun from being flooded.
        */
        resolve({
          id,
          type:'video',
          mime:file.type,
          name:file.name,
          src:previewUrl,
          dataUrl:'',
          localBlob:true
        });
      }
    }catch(e){
      console.warn('mediaToRecord failed',e);
      resolve({
        id,
        type:file.type.startsWith('video/')?'video':'image',
        mime:file.type,
        name:file.name,
        src:previewUrl,
        dataUrl:'',
        localBlob:true
      });
    }
  });
}

function compressImage(file,maxWidth=800,quality=.7){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);

    img.onload=()=>{
      try{
        const scale=Math.min(1,maxWidth/img.naturalWidth);
        const width=Math.max(1,Math.round(img.naturalWidth*scale));
        const height=Math.max(1,Math.round(img.naturalHeight*scale));

        const canvas=document.createElement('canvas');
        canvas.width=width;
        canvas.height=height;

        const ctx=canvas.getContext('2d',{alpha:false});
        if(!ctx){
          URL.revokeObjectURL(url);
          reject(new Error('Canvas unavailable'));
          return;
        }

        ctx.drawImage(img,0,0,width,height);
        const dataUrl=canvas.toDataURL('image/jpeg',quality);

        URL.revokeObjectURL(url);
        resolve(dataUrl);
      }catch(e){
        URL.revokeObjectURL(url);
        reject(e);
      }
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error('Image load failed'));
    };

    img.src=url;
  });
}

async function ensureMediaSrc(item){
  if(!item || !Array.isArray(item.media)) return item;

  for(const media of item.media){
    if(!media) continue;

    /*
      A blob URL from a previous page load is not durable.
      On boot we always attempt IDB for blob: references.
    */
    if(media.src && media.src.startsWith('blob:') && media.localBlob){
      const record=await getMediaBlob(media.id);

      if(record && record.blob instanceof Blob){
        try{
          media.src=URL.createObjectURL(record.blob);
          continue;
        }catch(e){
          console.warn('Could not create objectURL',e);
        }
      }

      if(media.dataUrl){
        media.src=media.dataUrl;
        continue;
      }

      media.src='';
      continue;
    }

    if(!media.src){
      const record=await getMediaBlob(media.id);

      if(record && record.blob instanceof Blob){
        try{
          media.src=URL.createObjectURL(record.blob);
          continue;
        }catch(e){
          console.warn('Could not create objectURL',e);
        }
      }

      if(media.dataUrl){
        media.src=media.dataUrl;
      }
    }
  }

  return item;
}

async function seedVisibleMedia(item){
  if(!item) return;
  await ensureMediaSrc(item);
  renderVisibleItemMedia(item);
}

function renderVisibleItemMedia(item){
  const node=document.querySelector(`[data-item-id="${CSS.escape(item.id)}"]`);
  if(!node) return;

  const pages=node.querySelectorAll('.media-page');
  item.media.forEach((media,index)=>{
    const page=pages[index];
    if(!page) return;

    const mediaEl=page.querySelector('img,video');
    const placeholder=page.querySelector('.media-placeholder');

    if(media.src){
      if(mediaEl && mediaEl.src!==media.src){
        mediaEl.src=media.src;
      }
      if(placeholder) placeholder.style.display='none';
    }else{
      if(mediaEl) mediaEl.removeAttribute('src');
      if(placeholder) placeholder.style.display='flex';
    }
  });

  lucide.createIcons();
}

/* ============================================================
   LOCAL STORAGE
============================================================ */
function serializeFeedLight(){
  return feedData.map(item=>({
    ...item,
    media:(item.media||[]).map(m=>({
      id:m.id,
      type:m.type,
      mime:m.mime,
      name:m.name,
      /*
        CRITICAL:
        Do NOT put huge local original blobs/data URLs into localStorage.
        Keep only compressed image dataUrl.
      */
      src:(m.dataUrl && m.dataUrl.length < 700000)
        ? m.dataUrl
        : (m.src && m.src.startsWith('data:') && m.src.length < 700000 ? m.src : ''),
      dataUrl:(m.dataUrl && m.dataUrl.length < 700000) ? m.dataUrl : '',
      localBlob:!!m.localBlob
    }))
  }));
}

function saveLocal(){
  try{
    localStorage.setItem(FEED_KEY,JSON.stringify(serializeFeedLight()));
  }catch(e){
    /*
      NEVER:
        src = ""
      and NEVER blank the rendered feed.

      If quota is reached, keep the in-memory feed and media URLs.
      Try progressively lighter persistence.
    */
    console.warn('localStorage quota/error while saving feed',e);

    try{
      const lightweight=feedData.map(item=>({
        id:item.id,
        u:item.u,
        av:item.av,
        name:item.name,
        item:item.item,
        want:item.want,
        wa:item.wa,
        brand:item.brand,
        size:item.size,
        desc:item.desc,
        tags:item.tags,
        ts:item.ts,
        likes:item.likes,
        media:(item.media||[]).map(m=>({
          id:m.id,
          type:m.type,
          mime:m.mime,
          name:m.name,
          src:'',
          dataUrl:'',
          localBlob:true
        }))
      }));

      localStorage.setItem(FEED_KEY,JSON.stringify(lightweight));
    }catch(e2){
      console.warn('lightweight localStorage save also failed',e2);
    }
  }

  try{
    localStorage.setItem(FAV_KEY,JSON.stringify(favs));
  }catch(e){
    console.warn('Could not save favorites',e);
  }

  try{
    localStorage.setItem(COMMENTS_KEY,JSON.stringify(commentsData));
  }catch(e){
    console.warn('Could not save comments',e);
  }

  try{
    if(myProfile){
      localStorage.setItem(PROFILE_KEY,JSON.stringify(myProfile));
    }
  }catch(e){
    console.warn('Could not save profile',e);
  }
}

async function loadLocal(){
  const raw=safeJsonParse(localStorage.getItem(FEED_KEY),[]);
  feedData=Array.isArray(raw)
    ? raw.map(normalizeItem).filter(Boolean)
    : [];

  favs=safeJsonParse(localStorage.getItem(FAV_KEY),[]);
  if(!Array.isArray(favs)) favs=[];

  commentsData=safeJsonParse(localStorage.getItem(COMMENTS_KEY),{});
  if(!commentsData || typeof commentsData!=='object') commentsData={};

  myProfile=safeJsonParse(localStorage.getItem(PROFILE_KEY),null);

  feedData.sort((a,b)=>b.ts-a.ts);

  /*
    Rehydrate durable media from IndexedDB.
    This is intentionally awaited before initial render.
  */
  for(const item of feedData){
    await ensureMediaSrc(item);
  }
}

   GUN
============================================================ */
function initGun(){
  if(typeof Gun==='undefined'){
    console.warn('Gun.js unavailable');
    updateStatus(false);
    return;
  }

  try{
    gun=Gun({
      peers:GUN_PEERS,
      localStorage:false,
      radisk:true
    });

    gunReady=true;
    updateStatus(navigator.onLine);

    loadGun();
  }catch(e){
    console.warn('Gun init failed',e);
    gunReady=false;
    updateStatus(false);
  }
}

function gunPayload(item){
  return {
    id:item.id,
    u:item.u,
    av:item.av,
    name:item.name,
    item:item.item,
    want:item.want,
    wa:item.wa,
    brand:item.brand,
    size:item.size,
    desc:item.desc,
    tags:item.tags,
    media:(item.media||[]).map(m=>({
      id:m.id,
      type:m.type,
      mime:m.mime,
      name:m.name,
      /*
        Images: compressed dataURL.
        Videos: no original blob/dataURL.
      */
      src:m.dataUrl || (
        m.src && m.src.startsWith('data:') && m.src.length<700000
          ? m.src
          : ''
      )
    })),
    ts:item.ts,
    likes:item.likes
  };
}

function persist(item){
  if(!item) return;

  saveLocal();

  if(!gunReady || !gun) return;

  try{
    gun
      .get('geyimdeyis')
      .get('feed')
      .get(item.id)
      .put(gunPayload(item));
  }catch(e){
    console.warn('Gun persist failed',e);
  }
}

function loadGun(){
  if(!gunReady || !gun) return;

  try{
    gun
      .get('geyimdeyis')
      .get('feed')
      .map()
      .once(data=>{
        if(!data || !data.id) return;

        const incoming=normalizeItem(data);
        if(!incoming) return;

        const existingIndex=feedData.findIndex(x=>x.id===incoming.id);

        if(existingIndex===-1){
          feedData.push(incoming);
        }else{
          /*
            Prefer locally hydrated media if Gun only contains
            compressed/empty media information.
          */
          const existing=feedData[existingIndex];

          incoming.media=incoming.media.map(m=>{
            const local=existing.media.find(x=>x.id===m.id);
            return {
              ...m,
              src:local && local.src ? local.src : m.src,
              dataUrl:m.src || (local ? local.dataUrl : '')
            };
          });

          feedData[existingIndex]={
            ...existing,
            ...incoming,
            media:incoming.media
          };
        }

        feedData.sort((a,b)=>b.ts-a.ts);

        ensureMediaSrc(incoming).then(()=>{
          saveLocal();

          if(currentFilter){
            doSearch(currentFilter);
          }else if(currentView==='home'){
            renderFeed();
          }else if(currentView==='explore'){
            renderExplore();
          }
        });
      });
  }catch(e){
    console.warn('Gun load failed',e);
  }
}

/* ============================================================
   SEEDER
============================================================ */
function setupSeeder(){
  if(observer) observer.disconnect();

  observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting || entry.intersectionRatio<.65) return;

      const id=entry.target.getAttribute('data-item-id');
      const item=feedData.find(x=>x.id===id);

      if(!item) return;

      if(!seededIds.has(id)){
        seededIds.add(id);
        persist(item);
        seedVisibleMedia(item);
      }else{
        seedVisibleMedia(item);
      }
    });
  },{threshold:[.65]});

  document.querySelectorAll('.feed-item').forEach(el=>{
    observer.observe(el);
  });
}

setInterval(()=>{
  if(!gunReady || !gun) return;

  feedData
    .slice()
    .sort((a,b)=>b.ts-a.ts)
    .slice(0,20)
    .forEach(item=>persist(item));
},30000);

   RENDER MEDIA
============================================================ */
function mediaHtml(media,index){
  const src=safeUrl(media.src || media.dataUrl);
  const label=media.type==='video' ? t('video') : t('image');

  let mediaElement='';

  if(src){
    if(media.type==='video'){
      mediaElement=
        `<video
          src="${escapeHtml(src)}"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          controlslist="nodownload"
          disablepictureinpicture
        ></video>`;
    }else{
      mediaElement=
        `<img
          src="${escapeHtml(src)}"
          alt="${escapeHtml(label)}"
          loading="${index===0?'eager':'lazy'}"
          draggable="false"
        >`;
    }
  }else{
    mediaElement=
      `<div class="media-placeholder">
        <i data-lucide="image-off" width="44" height="44"></i>
        <span>${escapeHtml(t('media'))}</span>
      </div>`;
  }

  return `<div class="media-page" data-media-index="${index}">
    ${mediaElement}
  </div>`;
}

function avatarHtml(item,large=false){
  const size=large?96:38;

  if(item.av){
    return `<img
      class="${large?'profile-big-avatar':'avatar'}"
      src="${escapeHtml(item.av)}"
      alt=""
      style="width:${size}px;height:${size}px"
    >`;
  }

function whatsappUrl(number,itemId){

    `GeyimDəyiş P2P: ${location.origin}${location.pathname}#item=${encodeURIComponent(itemId)}`
  );

  return `https://wa.me/${phone}?text=${text}`;
}

/* ============================================================
   FEED RENDER
============================================================ */
function getFilteredFeed(){
  if(!currentFilter) return feedData;

  const q=normalizeText(currentFilter);

  return feedData.filter(item=>{
    const searchable=[
      item.brand,
      item.size,
      ...(item.tags||[]),
      item.name,
      item.item,
      item.want,
      item.desc,
      item.wa
    ].join(' ');

    return normalizeText(searchable).includes(q);
  });
}

async function renderFeed(list=getFilteredFeed(),container=$('feed')){
  if(!container) return;

  container.innerHTML=list.map(renderItem).join('');
  currentFeedContainer=container;

  const noFeed=$('noFeed');

  if(!list.length){
    noFeed.classList.add('show');
    $('noFeedText').textContent=
      currentFilter ? t('no_results') : t('first_ad');
  }else{
    noFeed.classList.remove('show');
  }

  lucide.createIcons();

  /*
    Rehydrate media after DOM insertion.
    Important: never clear src as a fallback.
  */
  for(const item of list){
    await ensureMediaSrc(item);
    renderVisibleItemMedia(item);
  }

  setupMediaScrollListeners(container);
  setupSeeder();
  autoplayVisibleVideos();
}

function setupMediaScrollListeners(container){
  container.querySelectorAll('.media-scroll').forEach(scroller=>{
    scroller.addEventListener('scroll',()=>{
      const pages=[...scroller.querySelectorAll('.media-page')];
      if(!pages.length) return;

      const center=scroller.scrollLeft + scroller.clientWidth/2;

      let best=0;
      let distance=Infinity;

      pages.forEach((page,i)=>{
        const pageCenter=page.offsetLeft+page.offsetWidth/2;
        const d=Math.abs(pageCenter-center);

        if(d<distance){
          distance=d;
          best=i;
        }
      });

      const dots=scroller.closest('.feed-item')?.querySelectorAll('.media-dot');

      dots?.forEach((dot,i)=>{
        dot.classList.toggle('active',i===best);
      });
    },{passive:true});
  });
}

function autoplayVisibleVideos(){
  document.querySelectorAll('.feed-item video').forEach(video=>{
    video.muted=mutedGlobal;

    const rect=video.getBoundingClientRect();
    const visible=rect.bottom>0 && rect.top<window.innerHeight;

    if(visible){
      video.play().catch(()=>{});
    }else{
      video.pause();
    }
  });
}

/* ============================================================
   LIKES / FAVORITES
============================================================ */
function isLiked(item){
  const key='liked_'+item.id;
  return localStorage.getItem(key)==='1';
}

function toggleLike(id){
  const item=feedData.find(x=>x.id===id);
  if(!item) return;

  const key='liked_'+id;
  const already=localStorage.getItem(key)==='1';

  if(already){
    item.likes=Math.max(0,item.likes-1);
    localStorage.removeItem(key);
  }else{
    item.likes++;
    localStorage.setItem(key,'1');
  }

  persist(item);

  refreshRenderedItem(item);
}

function isFav(item){
  return favs.includes(item.id);
}

function toggleFav(id){
  const item=feedData.find(x=>x.id===id);
  if(!item) return;

  if(favs.includes(id)){
    favs=favs.filter(x=>x!==id);
  }else{
    favs.push(id);
  }

  saveLocal();

  if(currentView==='favorites'){
    renderFeed(feedData.filter(x=>favs.includes(x.id)),$('favoritesFeed'));
  }else{
    refreshRenderedItem(item);
  }
}

function refreshRenderedItem(item){
  const node=document.querySelector(`[data-item-id="${CSS.escape(item.id)}"]`);
  if(!node) return;

  const replacement=document.createElement('div');
  replacement.innerHTML=renderItem(item).trim();
  const fresh=replacement.firstElementChild;

  node.replaceWith(fresh);

  lucide.createIcons();
  setupMediaScrollListeners(currentFeedContainer || $('feed'));
  setupSeeder();
}

async function shareItem(id){

  const shareData={
    title:'GeyimDəyiş P2P',
    text:item ? `${item.name}: ${item.item}` : 'GeyimDəyiş P2P',
    url:url.toString()
  };

  try{

      await navigator.share(shareData);
      return;
    }

    await navigator.clipboard.writeText(url.toString());
    showToast(t('copied'));
  }catch(e){
    try{
      await navigator.clipboard.writeText(url.toString());
      showToast(t('copied'));
    }catch(e2){
      console.warn('Share/copy failed',e2);
    }
  }
}

function ensureCommentName(){
  let name=myProfile?.name || '';

  if(!name){
    name=prompt(t('choose_name'),'');
    if(!name || !name.trim()){
      return null;
    }

    name=name.trim();

    myProfile={
      ...(myProfile||{}),
      u:myProfile?.u || uid('user'),
      name
    };

    localStorage.setItem('p2p-user-id',myProfile.u);
    saveLocal();
  }

  return name;
}

function sendComment(){
  if(!currentCommentsItem) return;

  const input=$('commentInput');
  const text=input.value.trim();

  if(!text) return;

  const name=ensureCommentName();
  if(!name) return;

  if(!commentsData[currentCommentsItem]){
    commentsData[currentCommentsItem]=[];
  }

  commentsData[currentCommentsItem].push({
    id:uid('comment'),
    u:myProfile?.u || uid('user'),
    av:myProfile?.av || '',
    name,
    text,
    ts:Date.now(),
    replies:[]
  });

  input.value='';
  saveLocal();
  renderComments(currentCommentsItem);
  refreshRenderedItem(feedData.find(x=>x.id===currentCommentsItem));
}

function replyToComment(itemId,commentId){
  const text=prompt(t('reply'),'');
  if(!text || !text.trim()) return;

  const name=ensureCommentName();
  if(!name) return;

  const arr=commentsData[itemId]||[];
  const comment=arr.find(x=>x.id===commentId);

  if(!comment) return;

  if(!Array.isArray(comment.replies)) comment.replies=[];

  comment.replies.push({
    id:uid('reply'),
    u:myProfile?.u || uid('user'),
    av:myProfile?.av || '',
    name,
    text:text.trim(),
    ts:Date.now()
  });

  saveLocal();
  renderComments(itemId);
}

/* ============================================================

============================================================ */
function addSelectedFiles(files){
  [...files].forEach(file=>{
    if(!file) return;

    if(file.size>25*1024*1024){
      alert(t('file_too_large'));
      return;
    }

    const type=file.type.startsWith('video/')?'video':'image';

    if(
      !file.type.startsWith('image/') &&
      !file.type.startsWith('video/')
    ) return;

    const previewUrl=URL.createObjectURL(file);

    selectedMedia.push({
      file,
      previewUrl,
      type
    });
  });

  renderSelectedMedia();
}

function renderSelectedMedia(){
  const grid=$('selectedGrid');
  if(!grid) return;

  grid.innerHTML=selectedMedia.map((m,index)=>`
    <div class="selected-media">
      ${m.type==='video'
        ? `<video src="${escapeHtml(m.previewUrl)}" muted></video>`
        : `<img src="${escapeHtml(m.previewUrl)}" alt="">`}
      <button class="remove-media" type="button" data-remove-media="${index}">
        <i data-lucide="x" width="14"></i>
      </button>
    </div>
  `).join('');

  grid.querySelectorAll('[data-remove-media]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const index=Number(btn.dataset.removeMedia);
      const media=selectedMedia[index];

      if(media?.previewUrl){
        URL.revokeObjectURL(media.previewUrl);
      }

      selectedMedia.splice(index,1);
      renderSelectedMedia();
    });
  });

  lucide.createIcons();
}

function resetUploadForm(){
  selectedMedia.forEach(m=>{
    if(m.previewUrl) URL.revokeObjectURL(m.previewUrl);
  });

  selectedMedia=[];

  $('uploadForm')?.reset();
  $('selectedGrid').innerHTML='';
  $('avatarPreview').removeAttribute('src');

  if(myProfile){
    $('nameIn').value=myProfile.name||'';
    $('waIn').value=myProfile.wa||'';
  }
}

async function publishItem(){
  const name=$('nameIn')?.value.trim();
  const item=$('itemIn')?.value.trim();
  const want=$('wantIn')?.value.trim();
  const wa=$('waIn')?.value.trim();
  const brand=$('brandIn')?.value.trim();
  const size=$('sizeIn')?.value.trim();
  const desc=$('descIn')?.value.trim();
  const tags=normalizeTags($('tagsIn')?.value || '');

  if(!name){
    alert(t('enter_name'));
    return;
  }

  if(!item){
    alert(t('enter_item'));
    return;
  }

  if(!wa){
    alert(t('enter_wa'));
    return;
  }

  if(!selectedMedia.length){
    alert(t('add_at_least_one_media'));
    return;
  }

  for(const selected of selectedMedia){
    if(selected.file.size>25*1024*1024){
      alert(t('file_too_large'));
      return;
    }
  }

  /*
    Create persistent profile identity.
    Profile is only required when publishing.
  */
  let u=myProfile?.u || localStorage.getItem('p2p-user-id') || uid('user');

  let av=myProfile?.av || '';

  const avatarFile=$('avIn')?.files?.[0];

  if(avatarFile){
    if(avatarFile.size>25*1024*1024){
      alert(t('file_too_large'));
      return;
    }

    try{
      av=await compressImage(avatarFile,400,.75);
    }catch(e){
      console.warn('Avatar compression failed',e);
    }
  }

  myProfile={
    u,
    name,
    wa,
    av
  };

  localStorage.setItem('p2p-user-id',u);
  localStorage.setItem(PROFILE_KEY,JSON.stringify(myProfile));

  const media=[];

  /*
    Local:
      URL.createObjectURL(file)
    Durable:
      original Blob -> IndexedDB
    P2P:
      compressed image dataURL -> Gun
  */
  for(const selected of selectedMedia){
    const record=await mediaToRecord(selected.file);
    media.push(record);
  }

  const newItem=normalizeItem({
    id:uid('item'),
    u,
    av,
    name,
    item,
    want,
    wa,
    brand,
    size,
    desc,
    tags,
    media,
    ts:Date.now(),
    likes:0
  });

  feedData.unshift(newItem);
  feedData.sort((a,b)=>b.ts-a.ts);

  /*
    persist() intentionally keeps local objectURL in memory
    while Gun receives only compressed image data.
  */
  persist(newItem);

  closeModal('uploadModal');
  resetUploadForm();

  currentFilter='';
  currentView='home';

  $('feed').style.display='block';
  $('favoritesFeed').style.display='none';
  $('exploreGrid').style.display='none';
  $('profileScreen').style.display='none';

  setNavActive('navHome');

  await renderFeed(feedData,$('feed'));

  const node=document.querySelector(`[data-item-id="${CSS.escape(newItem.id)}"]`);
  node?.scrollIntoView({block:'start'});

  location.hash='item='+encodeURIComponent(newItem.id);
}

/* ============================================================
   DRAWER
============================================================ */
function openDrawer(){
  $('drawerBackdrop').style.display='block';
  requestAnimationFrame(()=>{
    $('drawer').classList.add('open');
  });
}

function closeDrawer(){
  $('drawer').classList.remove('open');

  setTimeout(()=>{
    $('drawerBackdrop').style.display='none';
  },250);
}

/* ============================================================
   LANGUAGE
============================================================ */
function applyI18n(){
  document.documentElement.lang=currentLang;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    el.textContent=t(key);
  });

  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.placeholder=t(el.dataset.i18nPlaceholder);
  });

  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.lang===currentLang);
  });

  $('commentInput').placeholder=t('write_comment');
  $('noFeedText').textContent=currentFilter?t('no_results'):t('first_ad');

  lucide.createIcons();
}

function setLang(lang){
  if(!SUPPORTED_LANGS.includes(lang)) lang='en';

  currentLang=lang;
  localStorage.setItem(LANG_KEY,lang);

  applyI18n();

  /*
    Re-render every dynamic surface without page reload.
  */
  if(currentView==='home'){
    renderFeed(getFilteredFeed(),$('feed'));
  }else if(currentView==='explore'){
    renderExplore(getFilteredFeed());
  }else if(currentView==='favorites'){
    renderFeed(feedData.filter(x=>favs.includes(x.id)),$('favoritesFeed'));
  }

  if(currentCommentsItem){
    renderComments(currentCommentsItem);
  }

  if(currentProfileUser){
    openProfile(currentProfileUser);
  }
}

/* ============================================================
   STATUS
============================================================ */
function updateStatus(online){
  const dot=$('statusDot');
  if(!dot) return;

  dot.classList.toggle('online',!!online);
  dot.classList.toggle('offline',!online);
  dot.title=online?t('p2p_online'):t('p2p_offline');
}

/* ============================================================
   TOAST
============================================================ */
function showToast(message){
  const toast=$('toast');
  if(!toast) return;

  clearTimeout(toastTimer);

  toast.textContent=message;
  toast.classList.add('show');

  toastTimer=setTimeout(()=>{
    toast.classList.remove('show');
  },1800);
}

/* ============================================================
   EVENT DELEGATION
============================================================ */
function bindFeedActions(){
  document.addEventListener('click',async event=>{
    const action=event.target.closest('[data-action]');

    if(!action) return;

    const type=action.dataset.action;
    const id=action.dataset.id;

    if(type==='like'){
      toggleLike(id);
    }

    if(type==='favorite'){
      toggleFav(id);
    }

    if(type==='comments'){
      openComments(id);
    }

    if(type==='share'){
      shareItem(id);
    }

    if(type==='profile'){
      openProfile(action.dataset.user);
    }

    if(type==='sound'){
      mutedGlobal=!mutedGlobal;

      document.querySelectorAll('video').forEach(video=>{
        video.muted=mutedGlobal;
      });

      document.querySelectorAll('[data-action="sound"]').forEach(btn=>{
        btn.innerHTML=
          `<i data-lucide="${mutedGlobal?'volume-x':'volume-2'}"></i>`;
      });

      lucide.createIcons();
    }
  });
}

/* ============================================================
   VISIBILITY / MEDIA PAUSE
============================================================ */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    document.querySelectorAll('video').forEach(v=>v.pause());
  }else{
    autoplayVisibleVideos();
  }
});

window.addEventListener('scroll',()=>{
  autoplayVisibleVideos();
},{passive:true});

/* ============================================================
   HASH
============================================================ */
function handleHash(){
  const match=location.hash.match(/^#item=(.+)$/);

  if(!match) return;

  try{
    const id=decodeURIComponent(match[1]);
    setTimeout(()=>{
      if(feedData.some(x=>x.id===id)){
        openItemInFeed(id);
      }
    },150);
  }catch(e){
    console.warn('Invalid hash',e);
  }
}

window.addEventListener('hashchange',handleHash);

/* ============================================================
   EVENTS
============================================================ */
function bindEvents(){
  $('menuBtn')?.addEventListener('click',openDrawer);
  $('closeDrawer')?.addEventListener('click',closeDrawer);

  $('drawerBackdrop')?.addEventListener('click',event=>{
    if(event.target===$('drawerBackdrop')) closeDrawer();
  });

  $('drawerHome')?.addEventListener('click',()=>{
    closeDrawer();
    showHome();
  });

  $('drawerExplore')?.addEventListener('click',()=>{
    closeDrawer();
    showExplore();
  });

  $('drawerAbout')?.addEventListener('click',()=>{
    closeDrawer();
    showLegal('about');
  });

  $('drawerHow')?.addEventListener('click',()=>{
    closeDrawer();
    showLegal('how');
  });

  $('drawerPrivacy')?.addEventListener('click',()=>{
    closeDrawer();
    showLegal('privacy');
  });

  $('drawerTerms')?.addEventListener('click',()=>{
    closeDrawer();
    showLegal('terms');
  });

  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      setLang(btn.dataset.lang);
    });
  });

  $('navHome')?.addEventListener('click',showHome);
  $('navExplore')?.addEventListener('click',showExplore);
  $('navFavorites')?.addEventListener('click',showFavorites);
  $('navProfile')?.addEventListener('click',showProfile);

  /*
    CRITICAL BUG FIX:
    Explicit publishBtn listener.
  */
  $('publishBtn')?.addEventListener('click',e=>{
    e.preventDefault();

    if(myProfile){
      $('nameIn').value=myProfile.name||'';
      $('waIn').value=myProfile.wa||'';
      $('avatarPreview').src=myProfile.av||'';
    }else{
      $('nameIn').value='';
      $('waIn').value='';
    }

    openModal('uploadModal');
  });

  $('uploadForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    publishItem();
  });

  $('realPublishBtn')?.addEventListener('click',e=>{
    e.preventDefault();
    publishItem();
  });

  $('imgIn')?.addEventListener('change',e=>{
    addSelectedFiles(e.target.files);
    e.target.value='';
  });

  $('vidIn')?.addEventListener('change',e=>{
    addSelectedFiles(e.target.files);
    e.target.value='';
  });

  $('avIn')?.addEventListener('change',async e=>{
    const file=e.target.files?.[0];
    if(!file) return;

    if(file.size>25*1024*1024){
      alert(t('file_too_large'));
      return;
    }

    try{
      const dataUrl=await compressImage(file,400,.75);
      $('avatarPreview').src=dataUrl;
    }catch(err){
      console.warn('Avatar preview failed',err);
    }
  });

  $('closeComments')?.addEventListener('click',()=>{
    $('commentsPanel').classList.remove('open');
    currentCommentsItem=null;
  });

  $('commentForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    sendComment();
  });

  $('searchBtn')?.addEventListener('click',()=>{
    doSearch($('searchInput').value);
  });

  $('searchInput')?.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      doSearch(e.target.value);
    }
  });

  $('topSearchBtn')?.addEventListener('click',()=>{
    showExplore();
    setTimeout(()=>{
      $('searchInput')?.focus();
    },100);
  });

  window.addEventListener('online',()=>{
    updateStatus(true);
  });

  window.addEventListener('offline',()=>{
    updateStatus(false);
  });
}

/* ============================================================
   BOOT
============================================================ */
async function boot(){
  try{
    applyI18n();
    bindEvents();
    bindFeedActions();

    updateStatus(navigator.onLine);

    await loadLocal();

    /*
      Direct TikTok-first boot:
      NO forced profile popup.
    */
    currentView='home';
    currentFilter='';

    await renderFeed(feedData,$('feed'));

    initGun();

    handleHash();

    lucide.createIcons();
  }catch(e){
    console.error('Boot failed',e);

    /*
      Even if storage fails, keep the app alive.
      Never intentionally black out the feed.
    */
    feedData=[];
    renderFeed([],$('feed'));
  }
}

document.addEventListener('DOMContentLoaded',boot);
</script>
