<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AzGram</title>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{height:52px;background:#111;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #222}
header b{font-size:18px}
header input{width:52%;background:#222;border:0;border-radius:20px;padding:8px 12px;color:#fff;outline:none}
main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;display:none;flex-direction:column}
.page.active{display:flex}
#feed{overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
.slide{height:100%;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
.slide img,.slide video{width:100%;height:100%;object-fit:cover}
.ov{position:absolute;bottom:0;left:0;right:0;padding:14px 12px 24px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.btns{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:14px}
.b{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.chatlist{flex:1;overflow:auto;padding-bottom:60px}
.citem{padding:10px 12px;border-bottom:1px solid #151515;display:flex;gap:10px}
.citem img{width:40px;height:40px;border-radius:50%}
.inputbar{height:54px;background:#111;display:flex;gap:8px;padding:8px;border-top:1px solid #222}
.inputbar input{flex:1;background:#222;border:0;border-radius:20px;padding:0 14px;color:#fff;outline:none}
.inputbar button{background:#fff;color:#000;border:0;border-radius:20px;padding:0 16px;font-weight:700}
nav{height:54px;background:#111;display:flex;border-top:1px solid #222}
nav button{flex:1;background:0;border:0;color:#777;font-size:11px}
nav button.active{color:#fff;font-weight:700}
.ad{position:absolute;top:60px;left:10px;background:#ffcc00;color:#000;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700}
</style>
</head>
<body>
<header><b>AZGRAM</b><input id="q" placeholder="Axtar #baku" oninput="search(this.value)"></header>
<main>
<div id="p-msg" class="page active"><div id="chatList" class="chatlist"></div><div class="inputbar"><input id="msgIn" placeholder="Mesaj yaz..."><button onclick="sendMsg()">Göndər</button></div></div>
<div id="p-feed" class="page"><div id="feed" style="flex:1"></div><div class="inputbar"><input id="stIn" placeholder="Status yaz #baku"><button onclick="postStatus()">Paylaş</button><input type="file" id="f" accept="image/*,video/*" style="display:none"></div></div>
<div id="p-search" class="page"><div id="sRes" style="padding:10px;overflow:auto"></div></div>
</main>
<nav>
<button class="active" onclick="go('p-msg',this)">💬<br>Mesaj</button>
<button onclick="go('p-feed',this)">▶️<br>Status</button>
<button onclick="go('p-search',this)">🔍<br>Axtar</button>
</nav>
<script>
const gun = Gun(['https://gun-manhattan.herokuapp.com/gun','https://gun-us.herokuapp.com/gun']);
const statuses = gun.get('azgram_v3_status');
const messages = gun.get('azgram_v3_msg');
let myName = localStorage.getItem('ag_name') || ('User'+Math.floor(Math.random()*9000));
localStorage.setItem('ag_name', myName);
let allStatus = [];
function go(id,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function sendMsg(){let v=document.getElementById('msgIn').value.trim();if(!v) return;messages.set({user:myName,text:v,time:Date.now()});document.getElementById('msgIn').value='';}
messages.map().on((d,id)=>{if(!d||!d.text) return;if(document.getElementById('m-'+id)) return;let div=document.createElement('div');div.id='m-'+id;div.className='citem';div.innerHTML=`<img src="https://i.pravatar.cc/100?u=${d.user}"><div><b>${d.user}</b><div style="color:#ccc">${d.text}</div></div>`;document.getElementById('chatList').appendChild(div);document.getElementById('chatList').scrollTop=99999;});
function postStatus(){let t=document.getElementById('stIn').value.trim();if(!t) return alert('Status yaz');let file=document.getElementById('f').files[0];if(file){let r=new FileReader();r.onload=e=>{saveStatus(t,e.target.result)};r.readAsDataURL(file);}else{saveStatus(t,'https://picsum.photos/seed/'+Date.now()+'/720/1280');}}
function saveStatus(text,src){statuses.set({user:myName,text:text,src:src,likes:0,time:Date.now()});document.getElementById('stIn').value='';document.getElementById('f').value='';}
statuses.map().on((d,id)=>{if(!d||!d.text) return;if(allStatus.find(x=>x._id==id)) return;allStatus.push({_id:id,...d});render();});
function render(filter=''){let list=[...allStatus];if(filter) list=list.filter(s=>(s.text+s.user).toLowerCase().includes(filter.toLowerCase()));list.sort((a,b)=>(b.likes*5-(Date.now()-b.time)/3600000)-(a.likes*5-(Date.now()-a.time)/3600000));let feed=document.getElementById('feed');feed.innerHTML='';list.forEach((s,i)=>{let ad=(i+1)%4==0?'<div class="ad">REKLAM</div>':'';let d=document.createElement('div');d.className='slide';let isVid=s.src&&s.src.startsWith('data:video');d.innerHTML=`${ad}${isVid?`<video src="${s.src}" loop muted playsinline></video>`:`<img src="${s.src}">`}<div class="btns"><div class="b" onclick="like('${s._id}')">❤️<br><small style="font-size:10px">${s.likes||0}</small></div></div><div class="ov"><b>@${s.user}</b><div>${s.text}</div></div>`;feed.appendChild(d);});feed.querySelectorAll('video').forEach(v=>{v.play().catch(()=>{});});}
function like(id){let s=allStatus.find(x=>x._id==id);if(!s) return;statuses.get(id).put({likes:(s.likes||0)+1});s.likes=(s.likes||0)+1;render(document.getElementById('q').value);}
function search(v){if(v){go('p-search',document.querySelectorAll('nav button')[2]);let list=allStatus.filter(s=>(s.text+s.user).toLowerCase().includes(v.toLowerCase()));let h=`<div style="color:#888">${list.length} nəticə</div>`;list.forEach(s=>{h+=`<div style="padding:10px;border-bottom:1px solid #222"><b>@${s.user}</b> ${s.text} - ${s.likes||0} bəyəni</div>`});document.getElementById('sRes').innerHTML=h;render(v);}else{render('');}}
document.getElementById('stIn').addEventListener('click',()=>document.getElementById('f').click());
</script>
</body>
 </html>
