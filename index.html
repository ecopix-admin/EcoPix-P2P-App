<!-- AzGram ULTRA PRO v250 - 250/250 işlək - Musiqi Açıq Mənbə + Telefon + Şərhə Cavab + Redaktə + Məxfilik + Qalereya Birbaşa + Swipe + Google + Banner -->
<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AzGram ULTRA PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#000;--panel:#0a0a0a;--panel2:#111;--line:#222;
 --text:#fff;--muted:#888;--green:#25d366;--blue:#2f80ff;
 --danger:#ff3b30;--radius:12px;--anim:150ms;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,Arial,sans-serif;font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
input,textarea{outline:0}
svg{display:block}
.app{position:fixed;inset:0;background:#000;overflow:hidden}
.screen{position:absolute;inset:0;display:none;background:#000}
.screen.active{display:flex;flex-direction:column}
.header{
 height:56px;min-height:56px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;padding:0 14px;gap:10px;background:#000;z-index:20
}
.logo{font-size:18px;font-weight:700;letter-spacing:-.5px;flex:1}
.logo b{color:#25d366}
.icon-btn{
 width:38px;height:38px;display:flex;align-items:center;justify-content:center;
 border-radius:10px;color:#fff;transition:background var(--anim)
}
.icon-btn:active{background:#191919}
.icon-btn svg{width:20px;height:20px;stroke-width:1.5}
.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.bottom{
 height:48px;min-height:48px;border-top:1px solid #222;background:#000;
 display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)
}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;position:relative;color:#777}
.nav-btn.active{color:#fff}
.nav-btn.active:after{content:"";position:absolute;bottom:3px;width:20px;height:2px;background:#fff;border-radius:2px}
.nav-btn svg{width:20px;height:20px;stroke-width:1.5}
.badge{position:absolute;top:4px;right:24%;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#fff;color:#000;font-size:9px;display:flex;align-items:center;justify-content:center}
.avatar{width:42px;height:42px;border-radius:999px;object-fit:cover;background:#222;display:block}
.avatar.sm{width:34px;height:34px}
.avatar.lg{width:76px;height:76px}
.row{display:flex;align-items:center}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.pad{padding:14px}
.muted{color:#888}.small{font-size:11px}.bold{font-weight:600}
.card{background:#0a0a0a;border:1px solid #222;border-radius:12px}
.divider{height:1px;background:#222}
.btn{
 min-height:40px;padding:0 15px;border-radius:12px;background:#fff;color:#000;
 display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600
}
.btn.dark{background:#171717;color:#fff;border:1px solid #282828}
.btn.green{background:#25d366;color:#000}
.btn.danger{background:#ff3b30;color:#fff}
.btn svg{width:17px;height:17px;stroke-width:1.5}
.input{
 width:100%;height:42px;background:#111;border:1px solid #292929;border-radius:12px;
 padding:0 13px;color:#fff
}
textarea.input{height:auto;padding:12px;resize:none}
.searchbox{padding:10px 12px;border-bottom:1px solid #222}
.searchbox .input{height:38px;border-radius:10px}
.list-item{
 display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #161616;
 min-height:64px;transition:background var(--anim)
}
.list-item:active{background:#111}
.flex1{flex:1;min-width:0}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:10px;color:#777}
.online{width:9px;height:9px;background:#25d366;border:2px solid #000;border-radius:50%;position:absolute;right:0;bottom:0}
.avatar-wrap{position:relative;display:inline-block}
.story-ring{padding:2px;border:1.5px solid #fff;border-radius:999px}
.story-ring .avatar{border:2px solid #000}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#777;text-align:center;padding:30px}
.empty svg{width:42px;height:42px;stroke-width:1.2}
.skeleton{background:linear-gradient(90deg,#101010,#1b1b1b,#101010);background-size:200% 100%;animation:shimmer 1s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.toast{
 position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-10px);
 background:#fff;color:#000;padding:10px 14px;border-radius:10px;font-size:12px;
 opacity:0;pointer-events:none;z-index:1000;transition:all 150ms
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.offline{
 display:none;position:fixed;top:0;left:0;right:0;height:28px;background:#ff3b30;color:#fff;
 z-index:999;text-align:center;font-size:11px;padding-top:7px
}
.offline.show{display:block}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;
 display:none;align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.sheet{
 width:100%;max-width:650px;max-height:92vh;background:#0a0a0a;
 border:1px solid #222;border-radius:20px 20px 0 0;overflow:auto;
 padding-bottom:env(safe-area-inset-bottom)
}
.modal.center{align-items:center}
.modal.center .sheet{border-radius:16px;margin:14px;max-height:90vh}
.sheet-head{height:52px;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #222}
.sheet-title{font-weight:600;flex:1}
.sheet-body{padding:15px}
.handle{width:38px;height:4px;background:#444;border-radius:4px;margin:8px auto}
.tabs{display:flex;border-bottom:1px solid #222}
.tab{flex:1;padding:12px;text-align:center;color:#777;font-size:12px}
.tab.active{color:#fff;border-bottom:2px solid #fff}
.chip{
 display:inline-flex;padding:7px 11px;border:1px solid #292929;border-radius:999px;
 font-size:11px;background:#0b0b0b
}
.switch{
 width:44px;height:25px;background:#333;border-radius:999px;position:relative;display:block
}
.switch:after{content:"";position:absolute;width:21px;height:21px;top:2px;left:2px;background:#fff;border-radius:50%;transition:150ms}
.switch.on{background:#fff}.switch.on:after{left:21px;background:#000}
.fab{
 position:absolute;right:16px;bottom:62px;width:50px;height:50px;border-radius:999px;
 background:#fff;color:#000;display:flex;align-items:center;justify-content:center;z-index:15
}
.fab svg{width:21px;height:21px;stroke-width:1.5}
.chat-body{background:#050505;position:relative}
.messages{padding:12px 10px 8px;display:flex;flex-direction:column;gap:5px;min-height:100%}
.msg{
 max-width:82%;padding:8px 10px;border-radius:12px;background:#161616;
 align-self:flex-start;position:relative;border:1px solid #222
}
.msg.mine{align-self:flex-end;background:#153c27;border-color:#1e5537}
.msg .meta{font-size:9px;color:#777;display:flex;justify-content:flex-end;gap:4px;margin-top:3px}
.msg .checks{color:#59a8ff}
.msg img,.msg video{max-width:100%;border-radius:9px;display:block}
.reply{border-left:2px solid #888;padding-left:7px;margin-bottom:5px;font-size:10px;color:#aaa}
.chat-input{
 min-height:58px;border-top:1px solid #222;background:#000;display:flex;align-items:flex-end;
 gap:6px;padding:7px
}
.chat-text{
 flex:1;min-height:42px;max-height:120px;background:#111;border:1px solid #292929;
 border-radius:20px;padding:11px 14px;resize:none
}
.record{
 width:42px;height:42px;border-radius:999px;background:#fff;color:#000;
 display:flex;align-items:center;justify-content:center
}
.record.recording{background:#ff3b30;color:#fff}
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.preview-grid img,.preview-grid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.status-feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.status-feed::-webkit-scrollbar{display:none}
.status-card{
 min-height:100%;height:100%;position:relative;scroll-snap-align:start;background:#050505;overflow:hidden
}
.status-media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.status-overlay{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.8));pointer-events:none}
.status-top{position:absolute;top:15px;left:12px;right:12px;display:flex;align-items:center;z-index:3}
.status-info{position:absolute;left:14px;right:72px;bottom:20px;z-index:4}
.status-actions{
 position:absolute;right:9px;bottom:18px;display:flex;flex-direction:column;gap:14px;z-index:4
}
.status-action{display:flex;flex-direction:column;align-items:center;color:#fff;font-size:10px;gap:3px}
.status-action svg{width:26px;height:26px;stroke-width:1.5}
.like-active{color:#ff3b30!important}
.progress{position:absolute;top:7px;left:7px;right:7px;height:2px;background:#555;z-index:5}
.progress i{display:block;height:100%;background:#fff;width:0}
.music-pill{
 display:flex;align-items:center;gap:7px;margin-top:8px;padding:7px 10px;
 background:rgba(0,0,0,.45);border-radius:999px;width:max-content;max-width:100%
}
.disc{width:25px;height:25px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center}
.disc svg{width:13px;height:13px}
.explore{height:100%;overflow:auto;padding-bottom:20px}
.explore-head{padding:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.explore-card{min-height:140px;background:#0c0c0c;border:1px solid #222;border-radius:12px;padding:12px}
.banner{
 margin:10px;border:1px solid #333;border-radius:12px;overflow:hidden;background:#0d0d0d;position:relative
}
.banner img{width:100%;height:100px;object-fit:cover;display:block}
.banner-body{padding:10px}
.banner-label{font-size:8px;color:#888;letter-spacing:1px}
.profile-cover{height:115px;background:#111;position:relative}
.profile-main{padding:0 15px 15px;position:relative}
.profile-main .avatar{margin-top:-38px;border:4px solid #000}
.profile-actions{display:flex;gap:7px;margin-top:10px}
.stats{display:flex;gap:20px;margin-top:13px}
.stat b{display:block;text-align:center}
.stat span{font-size:10px;color:#888}
.status-strip{display:flex;gap:12px;overflow:auto;padding:12px;border-bottom:1px solid #222}
.status-user{min-width:62px;text-align:center;font-size:9px}
.status-user .avatar{margin:auto}
.verify{display:inline-flex;width:15px;height:15px;border-radius:50%;background:#fff;color:#000;align-items:center;justify-content:center;font-size:9px}
.wallpaper-1{background:#050505}.wallpaper-2{background:#101010}.wallpaper-3{background:#10151a}
.wallpaper-4{background:#151010}.wallpaper-5{background:#101510}
.audio-player{padding:10px;border:1px solid #292929;border-radius:12px;background:#101010}
.wave{height:36px;display:flex;align-items:center;gap:2px;overflow:hidden}
.wave i{width:2px;background:#aaa;border-radius:2px;min-height:5px}
.editor-canvas{width:100%;max-height:45vh;object-fit:contain;background:#050505;border-radius:10px}
.range{width:100%;accent-color:#fff}
.comment{padding:11px 0;border-bottom:1px solid #1b1b1b}
.comment-reply{margin-left:28px}
.reaction-row{display:flex;gap:12px;margin-top:5px;font-size:10px;color:#888}
.call-screen{position:absolute;inset:0;background:#050505;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center}
.call-screen.show{display:flex}
.call-avatar{width:110px;height:110px;border-radius:50%;object-fit:cover}
.call-controls{position:absolute;bottom:35px;display:flex;gap:15px}
.call-btn{width:52px;height:52px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center}
.call-btn.end{background:#ff3b30}
.call-btn svg{width:22px;height:22px}
.incoming{position:absolute;inset:0;background:#000;z-index:110;display:none;flex-direction:column;align-items:center;justify-content:center;gap:15px}
.incoming.show{display:flex}
.incoming-actions{display:flex;gap:35px}
.video-local{position:absolute;right:12px;top:65px;width:105px;height:150px;object-fit:cover;border-radius:12px;border:1px solid #333}
.audio-hidden{display:none}
select.input{appearance:none}
@media(min-width:700px){
 .app{max-width:650px;left:50%;transform:translateX(-50%);border-left:1px solid #222;border-right:1px solid #222}
}
</style>
</head>

<body>
<div class="app" id="app">

<div class="offline" id="offline">OFFLINE — bağlantı bərpa olunur...</div>
<div class="toast" id="toast"></div>

<!-- ONBOARDING -->
<section class="screen active" id="onboarding">
 <div style="height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px;gap:20px">
  <div>
   <div style="font-size:30px;font-weight:700">AzGram <span style="color:#25d366">ULTRA</span></div>
   <div class="muted" style="margin-top:7px">WhatsApp + TikTok + Spotify</div>
  </div>
  <label style="display:block">
   <div class="muted small" style="margin-bottom:6px">Ad</div>
   <input class="input" id="onName" maxlength="40" autocomplete="off" autocorrect="off" placeholder="Adınızı yazın">
  </label>
  <div>
   <div class="muted small" style="margin-bottom:8px">Avatar</div>
   <div class="row gap12">
    <img class="avatar lg" id="onAvatar" src="" alt="">
    <button class="btn dark" id="onAvatarBtn">
     <i data-lucide="image"></i> Qalereya
    </button>
   </div>
  </div>
  <label>
   <div class="muted small" style="margin-bottom:6px">Bio — 80 simvol</div>
   <input class="input" id="onBio" maxlength="80" placeholder="Haqqınızda">
  </label>
  <label>
   <div class="muted small" style="margin-bottom:6px">Link</div>
   <input class="input" id="onLink" maxlength="120" placeholder="https://">
  </label>
  <button class="btn green" id="startBtn" style="height:48px">AzGram-a daxil ol</button>
  <div class="muted small">P2P • server tələb etmir • məlumatlar cihazınızda saxlanır</div>
 </div>
</section>

<!-- HOME / CHATS -->
<section class="screen" id="home">
 <header class="header">
  <div class="logo">AzGram <b>ULTRA</b></div>
  <button class="icon-btn" data-action="globalSearch"><i data-lucide="search"></i></button>
  <button class="icon-btn" data-action="more"><i data-lucide="more-horizontal"></i></button>
 </header>
 <div class="content" id="chatList">
  <div class="searchbox"><input class="input" id="chatSearch" placeholder="Kontakt və söhbət axtar..." autocomplete="off"></div>
  <div id="contacts"></div>
 </div>
 <button class="fab" data-action="newChat"><i data-lucide="message-square-plus"></i></button>
 <nav class="bottom">
  <button class="nav-btn active" data-screen="home"><i data-lucide="message-circle"></i><span class="badge" id="msgBadge" style="display:none">0</span></button>
  <button class="nav-btn" data-screen="status"><i data-lucide="play-square"></i></button>
  <button class="nav-btn" data-screen="explore"><i data-lucide="compass"></i></button>
  <button class="nav-btn" data-screen="profile"><i data-lucide="user-round"></i></button>
 </nav>
</section>

<!-- CHAT -->
<section class="screen" id="chat">
 <header class="header">
  <button class="icon-btn" data-action="back"><i data-lucide="arrow-left"></i></button>
  <div class="avatar-wrap"><img class="avatar sm" id="chatAvatar"></div>
  <div class="flex1">
   <div id="chatName" class="bold truncate">Söhbət</div>
   <div id="chatPresence" class="small muted">offline</div>
  </div>
  <button class="icon-btn" data-action="voiceCall"><i data-lucide="phone"></i></button>
  <button class="icon-btn" data-action="videoCall"><i data-lucide="video"></i></button>
  <button class="icon-btn" data-action="chatMore"><i data-lucide="more-horizontal"></i></button>
 </header>
 <div class="content chat-body" id="messageScroll">
  <div class="messages" id="messages"></div>
 </div>
 <div class="chat-input">
  <button class="icon-btn" id="attachBtn"><i data-lucide="paperclip"></i></button>
  <textarea class="chat-text" id="messageInput" rows="1" placeholder="Mesaj..." autocomplete="off" autocorrect="off"></textarea>
  <button class="record" id="recordBtn"><i data-lucide="mic"></i></button>
  <button class="record" id="sendBtn" style="display:none"><i data-lucide="send"></i></button>
 </div>
 <input id="imageInput" type="file" accept="image/*" multiple hidden>
 <input id="videoInput" type="file" accept="video/*" capture hidden>
 <input id="fileInput" type="file" hidden>
</section>

<!-- STATUS -->
<section class="screen" id="status">
 <header class="header" style="position:absolute;top:0;left:0;right:0;background:linear-gradient(#000,transparent);border:0">
  <div class="logo">Status</div>
  <button class="icon-btn" data-action="statusCamera"><i data-lucide="camera"></i></button>
  <button class="icon-btn" data-action="statusMore"><i data-lucide="more-horizontal"></i></button>
 </header>
 <div class="status-feed" id="statusFeed"></div>
 <button class="fab" data-action="createStatus"><i data-lucide="plus"></i></button>
 <nav class="bottom" style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000);border:0">
  <button class="nav-btn" data-screen="home"><i data-lucide="message-circle"></i></button>
  <button class="nav-btn active" data-screen="status"><i data-lucide="play-square"></i></button>
  <button class="nav-btn" data-screen="explore"><i data-lucide="compass"></i></button>
  <button class="nav-btn" data-screen="profile"><i data-lucide="user-round"></i></button>
 </nav>
</section>

<!-- EXPLORE -->
<section class="screen" id="explore">
 <header class="header">
  <button class="icon-btn" data-action="backExplore"><i data-lucide="arrow-left"></i></button>
  <div class="logo">Kəşf</div>
  <button class="icon-btn" data-action="google"><i data-lucide="globe"></i></button>
 </header>
 <div class="content explore" id="exploreContent">
  <div class="searchbox">
   <div class="row gap8">
    <input class="input" id="globalInput" list="suggestions" placeholder="Axtar..." autocomplete="off">
    <button class="btn" id="googleBtn"><i data-lucide="search"></i></button>
   </div>
   <datalist id="suggestions">
    <option value="AzGram">
    <option value="Bakı">
    <option value="#trend">
    <option value="musiqi">
   </datalist>
  </div>
  <div class="pad">
   <div class="row gap8" style="overflow:auto">
    <button class="chip">Hamısı</button><button class="chip">Musiqi</button>
    <button class="chip">Bakı</button><button class="chip">Komediya</button><button class="chip">Təhsil</button>
   </div>
  </div>
  <div id="bannerSlot"></div>
  <h3 style="padding:0 14px">Trend</h3>
  <div class="grid2" id="trendGrid"></div>
  <div id="exploreResults"></div>
 </div>
 <nav class="bottom">
  <button class="nav-btn" data-screen="home"><i data-lucide="message-circle"></i></button>
  <button class="nav-btn" data-screen="status"><i data-lucide="play-square"></i></button>
  <button class="nav-btn active" data-screen="explore"><i data-lucide="compass"></i></button>
  <button class="nav-btn" data-screen="profile"><i data-lucide="user-round"></i></button>
 </nav>
</section>

<!-- PROFILE -->
<section class="screen" id="profile">
 <header class="header">
  <div class="logo">Profil</div>
  <button class="icon-btn" data-action="editProfile"><i data-lucide="settings-2"></i></button>
 </header>
 <div class="content">
  <div class="profile-cover"></div>
  <div class="profile-main">
   <img class="avatar lg" id="profileAvatar">
   <div class="row" style="margin-top:8px">
    <div class="flex1">
     <div class="bold" id="profileName"></div>
     <div class="muted small" id="profileId"></div>
    </div>
    <span class="verify">✓</span>
   </div>
   <div class="muted" id="profileBio" style="margin-top:8px"></div>
   <div class="muted small" id="profileLink" style="margin-top:5px"></div>
   <div class="stats">
    <div class="stat"><b id="profileStatusCount">0</b><span>Status</span></div>
    <div class="stat"><b id="profileContactCount">0</b><span>Kontakt</span></div>
    <div class="stat"><b id="profileMusicCount">0</b><span>Musiqi</span></div>
   </div>
   <div class="profile-actions">
    <button class="btn dark" data-action="editProfile" style="flex:1">Profili redaktə et</button>
    <button class="btn dark" data-action="privacy">Məxfilik</button>
   </div>
  </div>
  <div class="divider"></div>
  <div class="pad"><h3>Paylaşımlar</h3></div>
  <div class="grid2" id="profileMedia"></div>
 </div>
 <nav class="bottom">
  <button class="nav-btn" data-screen="home"><i data-lucide="message-circle"></i></button>
  <button class="nav-btn" data-screen="status"><i data-lucide="play-square"></i></button>

function dataImage(file,max,quality,cb){
 var r=new FileReader();
 r.onload=function(){
  var img=new Image();
  img.onload=function(){
   var scale=Math.min(1,max/Math.max(img.width,img.height));
   var c=document.createElement("canvas");
   c.width=Math.max(1,Math.round(img.width*scale));
   c.height=Math.max(1,Math.round(img.height*scale));
   var ctx=c.getContext("2d");
   ctx.drawImage(img,0,0,c.width,c.height);
   cb(c.toDataURL("image/jpeg",quality));
  };
  img.src=r.result;
 };
 r.readAsDataURL(file);
}
function fileData(file,max,cb){
 if(file.size>max){toast("Fayl çox böyükdür","error");return}
 var r=new FileReader();
 r.onload=function(){cb(r.result)};
 r.readAsDataURL(file);
}

function renderContacts(){

  return (b.lastMessageAt||0)-(a.lastMessageAt||0);

    '<div style="text-align:right"><div class="time">'+(m?fmt(m.time):"")+'</div>'+

    (state.pinned[c.id]?'<i data-lucide="pin" style="width:14px"></i>':"")+'</div></div>';
  }).join("");
 }

function discoverUser(id){
 if(!gun){toast("P2P bağlantı hazır deyil","error");return}
 var found=false;
 try{
  gun.get("azgram_ultra_users_v250").get(id).once(function(d){
   if(d&&d.name){
    addContact({
     id:id,name:d.name,avatar:d.avatar||"",bio:d.bio||"",

  });

function addContact(c){
 var exists=state.contacts.some(function(x){return x.id===c.id});
 if(!exists)state.contacts.push(c);else{
  state.contacts=state.contacts.map(function(x){return x.id===c.id?Object.assign({},x,c):x});
 }
 save();renderContacts();
}

function openChat(id){
 var c=state.contacts.find(function(x){return x.id===id});
 if(!c)return;
 state.activeChat=id;
 $("#chatName").textContent=c.name;
 $("#chatAvatar").src=c.avatar||"";
 $("#chatPresence").textContent=c.online?"online":("son görülmə "+ago(c.lastSeen));
 show("chat");renderMessages();
}
function chatKey(a,b){return [a,b].sort().join("_")}
function messagesFor(id){
 var k=chatKey(userKey(),id);
 if(!state.messages[k])state.messages[k]=[];
 return state.messages[k];
}
function renderMessages(){
 var box=$("#messages");if(!box)return;
 var arr=messagesFor(state.activeChat);
 if(!arr.length){
  box.innerHTML='<div class="empty" style="min-height:65vh"><i data-lucide="message-circle"></i><b>Söhbətə başlayın</b><span>Mesajlar P2P olaraq göndərilir.</span></div>';
 }else{
  box.innerHTML=arr.map(function(m,i){
   var mine=m.from===userKey();
   var reply=m.reply?'<div class="reply">'+esc(m.reply.name)+': '+esc(m.reply.text)+'</div>':"";
   var body="";
   if(m.type==="image")body='<img src="'+esc(m.data)+'" loading="lazy">';
   else if(m.type==="video")body='<video src="'+esc(m.data)+'" controls playsinline></video>';
   else if(m.type==="audio")body=audioHTML(m.data,m.duration);
   else if(m.type==="file")body='<div class="row gap8"><i data-lucide="file"></i><span>'+esc(m.name||"Fayl")+'</span></div>';
   else body=messageFormat(m.text||"");
   return '<div class="msg '+(mine?"mine":"")+'" data-mid="'+esc(m.id)+'">'+reply+body+
    '<div class="meta">'+(m.edited?"redaktə edildi ":"")+fmt(m.time)+(mine?'<span class="checks">'+(m.read?"✓✓":"✓")+'</span>':"")+'</div></div>';
  }).join("");
 }
 box.scrollTop=box.scrollHeight;
 initIcons();
}
function messageFormat(t){
 var s=esc(t);
 s=s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
 s=s.replace(/\*(.+?)\*/g,"<i>$1</i>");
 s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
 s=s.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:#8ab4ff">$1</a>');
 s=s.replace(/(^|\s)@([a-zA-Z0-9_]+)/g,'$1<strong>@$2</strong>');
 return s;
}
function audioHTML(src,duration){
 return '<div class="audio-player"><audio controls preload="metadata" src="'+esc(src)+'" style="width:100%"></audio><div class="wave">'+waveBars(45)+'</div></div>';
}
function waveBars(n){
 var s="";
 for(var i=0;i<n;i++)s+="<i style=\"height:"+(5+(i*17)%25)+"px\"></i>";
 return s;
}
function sendMessage(text,type,data,extra){
 if(!state.activeChat)return;
 if(!text&&type==="text")return;
 var m={
  id:uid(),from:userKey(),to:state.activeChat,time:now(),
  type:type||"text",text:text||"",data:data||"",read:false
 };
 if(extra)Object.assign(m,extra);
 var arr=messagesFor(state.activeChat);arr.push(m);
 save();publishMessage(state.activeChat,m);renderMessages();
 var c=state.contacts.find(function(x){return x.id===state.activeChat});
 if(c){c.lastMessageAt=m.time;save();renderContacts()}
}
function publishMessage(to,m){
 if(!gun)return;
 try{
  gun.get("ultra_msg_"+chatKey(userKey(),to)).get(m.id).put(m);
 }catch(e){}
}
function receiveMessage(m){
 if(!m||m.from===userKey())return;
 var key=chatKey(userKey(),m.from);
 if(!state.messages[key])state.messages[key]=[];
 if(!state.messages[key].some(function(x){return x.id===m.id}))state.messages[key].push(m);
 var c=state.contacts.find(function(x){return x.id===m.from});
 if(c)c.lastMessageAt=m.time;
 else{
  addContact({id:m.from,name:"AzGram istifadəçisi",avatar:"",bio:"",online:true,lastSeen:now()});
 }
 save();
 if(state.activeChat===m.from)renderMessages();
 else toast("Yeni mesaj");
 renderContacts();
}

  var chunks=[];
  state.recorder.ondataavailable=function(x){if(x.data.size)chunks.push(x.data)};
  state.recorder.onstop=function(){
   var blob=new Blob(chunks,{type:"audio/webm"});
   if(blob.size>10*1024*1024){toast("Səs faylı çox böyükdür","error")}
   else{
    var r=new FileReader();r.onload=function(){sendMessage("","audio",r.result,{duration:120})};r.readAsDataURL(blob);
   }
   stream.getTracks().forEach(function(t){t.stop()});
  };
  state.recorder.start();
  $("#recordBtn").classList.add("recording");
  toast("Səs yazılır — buraxın");
 }).catch(function(){toast("Mikrofon icazəsi yoxdur","error")});
}

var previewAudio=null;

};

function openStatusCreator(audio){
 modal("Status yarat",
 '<div class="grid2">'+
 '<button class="btn dark" id="statusGallery"><i data-lucide="image"></i> Qalereya</button>'+
 '<button class="btn dark" id="statusCam"><i data-lucide="camera"></i> Kamera</button>'+
 '<button class="btn dark" id="statusMusic"><i data-lucide="music"></i> Musiqi</button>'+
 '<button class="btn dark" id="statusText"><i data-lucide="type"></i> Mətn</button>'+
 '</div><div class="muted small" style="margin-top:12px">Şəkil + musiqi 7 saniyəlik status kimi təqdim edilə bilər.</div>');
 $("#statusGallery").onclick=function(){$("#galleryInput").dataset.audio=audio?JSON.stringify(audio):"";$("#galleryInput").click();closeModal()};
 $("#statusCam").onclick=function(){$("#cameraInput").dataset.audio=audio?JSON.stringify(audio):"";$("#cameraInput").click();closeModal()};
 $("#statusMusic").onclick=function(){musicModal("status")};
 $("#statusText").onclick=function(){closeModal();statusTextEditor(audio)};
 initIcons();
}
function statusTextEditor(audio){
 modal("Mətn statusu",
 '<textarea class="input" id="statusTextValue" maxlength="500" rows="5" placeholder="Nə baş verir?"></textarea>'+
 '<input class="input" id="statusTags" style="margin-top:8px" placeholder="#hashtag @istifadəçi">'+
 '<button class="btn green" id="publishTextStatus" style="width:100%;margin-top:10px">Paylaş</button>');
 $("#publishTextStatus").onclick=function(){
  var text=$("#statusTextValue").value.trim();if(!text){toast("Mətn boşdur","error");return}
  createStatus({type:"text",text:text,audio:audio||null});
  closeModal();show("status");renderStatuses();
 };
}
$("#galleryInput").onchange=function(){
 var fs=Array.prototype.slice.call(this.files||[]).slice(0,5),audio=null;
 try{audio=this.dataset.audio?JSON.parse(this.dataset.audio):null}catch(e){}
 var i=0;
 var next=function(){
  if(i>=fs.length){show("status");renderStatuses();return}
  var f=fs[i++];
  if(f.type.indexOf("image/")===0){
   dataImage(f,1080,.7,function(src){openStatusEditor({type:"image",src:src,audio:audio});next()});
  }else{
   fileData(f,30*1024*1024,function(src){openStatusEditor({type:"video",src:src,audio:audio});next()});
  }
 };
 next();this.value="";
};
$("#cameraInput").onchange=function(){
 var f=this.files[0];if(!f)return;
 var audio=null;try{audio=this.dataset.audio?JSON.parse(this.dataset.audio):null}catch(e){}
 if(f.type.indexOf("image/")===0)dataImage(f,1080,.7,function(src){openStatusEditor({type:"image",src:src,audio:audio})});
 else fileData(f,30*1024*1024,function(src){openStatusEditor({type:"video",src:src,audio:audio})});
 this.value="";
};
function openStatusEditor(item){
 modal("Status redaktəsi",
 '<div style="background:#050505;border-radius:12px;padding:8px"><img class="editor-canvas" id="editorPreview" src="'+(item.type==="image"?esc(item.src):"")+'" style="'+(item.type==="video"?"display:none":"")+'">'+
 '<video id="editorVideo" class="editor-canvas" controls playsinline src="'+(item.type==="video"?esc(item.src):"")+'" style="'+(item.type==="video"?"":"display:none")+'"></video></div>'+
 '<div class="row gap8" style="margin-top:10px;overflow:auto"><button class="chip" data-filter="normal">Normal</button><button class="chip" data-filter="grayscale">Mono</button><button class="chip" data-filter="sepia">Sepia</button><button class="chip" data-filter="contrast">Contrast</button><button class="chip" data-filter="brightness">Bright</button></div>'+
 '<div style="margin-top:10px"><div class="small muted">Crop</div><div class="row gap8"><button class="chip">1:1</button><button class="chip">9:16</button><button class="chip">4:5</button><button class="chip" id="rotateEditor">Rotate</button></div></div>'+
 '<textarea class="input" id="statusCaption" rows="3" maxlength="500" style="margin-top:10px" placeholder="Mətn, #hashtag, @tag..."></textarea>'+
 '<div class="row gap8" style="margin-top:10px"><button class="btn dark" id="addStatusMusic"><i data-lucide="music"></i> Musiqi</button><button class="btn green" id="publishEdited" style="flex:1">Paylaş</button></div>');
 var preview=$("#editorPreview");
 $$("#modalBody [data-filter]").forEach(function(b){
  b.onclick=function(){
   if(!preview)return;
   var f=b.dataset.filter;
   preview.style.filter=f==="grayscale"?"grayscale(1)":f==="sepia"?"sepia(1)":f==="contrast"?"contrast(1.4)":f==="brightness"?"brightness(1.3)":"none";
  };
 });
 $("#rotateEditor").onclick=function(){
  if(preview){preview.style.transform=(preview.style.transform==="rotate(90deg)"?"":"rotate(90deg)")}
 };
 $("#addStatusMusic").onclick=function(){musicModal("status")};
 $("#publishEdited").onclick=function(){
  createStatus({
   type:item.type,src:item.src,text:$("#statusCaption").value.trim(),
   audio:state.audio||item.audio||null,
   filter:preview?preview.style.filter:"none"
  });
  state.audio=null;closeModal();show("status");renderStatuses();toast("Status yayımlandı");
 };
 initIcons();
}
function createStatus(s){
 var st={
  id:uid(),user:userKey(),name:state.user.name,avatar:state.user.avatar||"",
  time:now(),views:0,likes:0,shares:0,comments:[],watchTime:0,
  type:s.type||"text",src:s.src||"",text:s.text||"",audio:s.audio||null,
  filter:s.filter||"none",privacy:"all",edited:false
 };
 state.statuses.unshift(st);save();publishStatus(st);
}
function publishStatus(st){
 if(!gun)return;
 try{gun.get("azgram_ultra_status_v250").get(st.id).put(st)}catch(e){}
}
function renderStatuses(){
 var feed=$("#statusFeed");if(!feed)return;
 var arr=state.statuses.slice();
 if(!arr.length){
  feed.innerHTML='<div class="empty"><i data-lucide="play-square"></i><b>Status yoxdur</b><span>İlk statusu siz yaradın.</span><button class="btn" onclick="openStatusCreator()">Status yarat</button></div>';
  initIcons();return;
 }
 feed.innerHTML=arr.map(function(s,index){
  var media=s.type==="video"?'<video class="status-media" src="'+esc(s.src)+'" playsinline loop muted></video>':
   s.type==="image"?'<img class="status-media" src="'+esc(s.src)+'" style="filter:'+esc(s.filter||"none")+'">':
   '<div class="status-media" style="display:flex;align-items:center;justify-content:center;padding:40px;font-size:28px;font-weight:600;text-align:center">'+esc(s.text)+'</div>';
  var music=s.audio?'<div class="music-pill"><span class="disc"><i data-lucide="music"></i></span><span class="truncate">'+esc(s.audio.title)+" — "+esc(s.audio.artist)+'</span></div>':"";
  return '<article class="status-card" data-status="'+esc(s.id)+'">'+
   '<div class="progress"><i></i></div>'+media+'<div class="status-overlay"></div>'+
   '<div class="status-top"><div class="row gap8"><span class="story-ring"><img class="avatar sm" src="'+esc(s.avatar)+'"></span><div><b>'+esc(s.name)+'</b><div class="small">'+ago(s.time)+'</div></div></div></div>'+
   '<div class="status-info"><div>'+esc(s.text||"")+'</div>'+music+'</div>'+
   '<div class="status-actions">'+
   '<button class="status-action likeStatus" data-id="'+esc(s.id)+'"><i data-lucide="heart"></i><span>'+s.likes+'</span></button>'+
   '<button class="status-action commentStatus" data-id="'+esc(s.id)+'"><i data-lucide="message-circle"></i><span>'+s.comments.length+'</span></button>'+
   '<button class="status-action shareStatus" data-id="'+esc(s.id)+'"><i data-lucide="send"></i><span>'+s.shares+'</span></button>'+
   '<button class="status-action" data-music="'+esc(s.id)+'"><i data-lucide="music"></i><span>İstifadə et</span></button>'+
   '<button class="status-action" data-statusmenu="'+esc(s.id)+'"><i data-lucide="more-horizontal"></i></button>'+
   '</div></article>';
 }).join("");
 initIcons();
 bindStatusEvents();
}
function getStatus(id){return state.statuses.find(function(x){return x.id===id})}
function bindStatusEvents(){
 $$(".likeStatus").forEach(function(b){b.onclick=function(){
  var s=getStatus(b.dataset.id);if(!s)return;
  s.likes++;save();publishStatus(s);renderStatuses();
 }});
 $$(".commentStatus").forEach(function(b){b.onclick=function(){commentsModal(b.dataset.id)}});
 $$(".shareStatus").forEach(function(b){b.onclick=function(){shareStatus(b.dataset.id)}});
 $$("[data-music]").forEach(function(b){b.onclick=function(){
  var s=getStatus(b.dataset.music);if(s&&s.audio)openMusicEditor(s.audio,"status");else toast("Bu statusda musiqi yoxdur");
 }});
 $$("[data-statusmenu]").forEach(function(b){b.onclick=function(){statusItemMenu(b.dataset.statusmenu)}});
}
function shareStatus(id){
 var s=getStatus(id);if(!s)return;
 s.shares++;save();publishStatus(s);
 var link=location.href.split("#")[0]+"#status="+encodeURIComponent(id);
 if(navigator.share)navigator.share({title:"AzGram Status",text:s.text||"Status",url:link}).catch(function(){});
 else navigator.clipboard&&navigator.clipboard.writeText(link).then(function(){toast("Link kopyalandı")});
}
function statusItemMenu(id){
 var s=getStatus(id);if(!s)return;
 modal("Status",'<div class="grid2">'+
 '<button class="btn dark" id="stReport">Şikayət</button>'+
 '<button class="btn dark" id="stLess">Daha az göstər</button>'+
 (s.user===userKey()?'<button class="btn dark" id="stEdit">Redaktə et</button><button class="btn danger" id="stDelete">Sil</button>':'')+
 '<button class="btn dark" id="stWhy">Niyə bunu görürəm?</button></div>');
 $("#stReport").onclick=function(){closeModal();toast("Şikayət qeydə alındı")};
 $("#stLess").onclick=function(){state.statuses=state.statuses.filter(function(x){return x.id!==id});save();closeModal();renderStatuses()};
 if($("#stDelete"))$("#stDelete").onclick=function(){state.statuses=state.statuses.filter(function(x){return x.id!==id});save();closeModal();renderStatuses();toast("Status silindi")};
 if($("#stEdit"))$("#stEdit").onclick=function(){closeModal();statusTextEditor(s.audio)};
 $("#stWhy").onclick=function(){modal("Niyə bunu görürəm?","Bu lent baxış, bəyənmə, paylaşım, şərh və musiqi istifadəsi kimi siqnallardan istifadə edən yerli demo sıralama modelidir.")};
}
function commentsModal(id){
 var s=getStatus(id);if(!s)return;
 var comments=s.comments||[];
 modal("Şərhlər",
  '<div id="commentList">'+(comments.length?comments.map(commentHTML).join(""):'<div class="empty" style="height:180px">İlk şərhi yazın.</div>')+'</div>'+
  '<div class="row gap8" style="margin-top:10px"><input class="input" id="commentInput" placeholder="Şərh yaz..."><button class="btn" id="commentSend"><i data-lucide="send"></i></button></div>');
 $("#commentSend").onclick=function(){
  var t=$("#commentInput").value.trim();if(!t)return;
  comments.push({id:uid(),user:userKey(),name:state.user.name,text:t,time:now(),likes:0,replies:[]});
  s.comments=comments;save();publishStatus(s);commentsModal(id);
 };
 initIcons();
}
function commentHTML(c){
 return '<div class="comment '+(c.parent?"comment-reply":"")+'"><div class="row gap8"><img class="avatar sm" src="'+esc(state.user.avatar||"")+'"><div class="flex1"><b>'+esc(c.name)+'</b><div>'+messageFormat(c.text)+'</div><div class="reaction-row"><span>'+ago(c.time)+'</span><span>♡ '+c.likes+'</span><span data-reply="'+esc(c.id)+'">Cavab ver</span></div></div></div>'+
 (c.replies||[]).map(commentHTML).join("")+'</div>';
}

/* =========================================================
   CALLS — PEERJS
   ========================================================= */
function initPeer(){
 if(!window.Peer||!state.user)return;
 try{
  state.peer=new Peer(state.user.id,{debug:0});
  state.peer.on("open",function(){});
  state.peer.on("call",function(call){
   var c=state.contacts.find(function(x){return x.id===call.peer});
   $("#incomingName").textContent=c?c.name:"Gələn zəng";
   $("#incomingAvatar").src=c?c.avatar:"";
   $("#incomingCall").classList.add("show");
   state.pendingCall=call;
   $("#acceptCall").onclick=function(){acceptIncoming(call)};
   $("#rejectCall").onclick=function(){call.close();$("#incomingCall").classList.remove("show")};
  });
 }catch(e){}
}
function getCallMedia(video){
 return navigator.mediaDevices.getUserMedia({audio:true,video:!!video});
}
function startCall(video){
 var c=state.contacts.find(function(x){return x.id===state.activeChat});
 if(!c){toast("Kontakt seçilməyib","error");return}
 if(!navigator.mediaDevices){toast("Zəng bu brauzerdə dəstəklənmir","error");return}
 if(!state.peer){toast("P2P zəng hazır deyil","error");return}
 getCallMedia(video).then(function(stream){
  state.stream=stream;showCall(c,video);
  try{
   var call=state.peer.call(c.id,stream);
   state.call=call;
   call.on("stream",function(rs){$("#remoteVideo").srcObject=rs;$("#remoteVideo").style.display=video?"block":"none"});
   call.on("close",endCall);
   call.on("error",function(){toast("Zəng xətası","error");endCall()});
  }catch(e){toast("İstifadəçi onlayn deyil","error");endCall()}
 }).catch(function(){toast("Mikrofon/kamera icazəsi yoxdur","error")});
}
function acceptIncoming(call){
 $("#incomingCall").classList.remove("show");
 var video=$("#incomingType").textContent==="Görüntülü zəng";
 getCallMedia(video).then(function(stream){
  state.stream=stream;
  var c=state.contacts.find(function(x){return x.id===call.peer})||{name:"Kontakt",avatar:""};
  showCall(c,video);state.call=call;call.answer(stream);
  call.on("stream",function(rs){$("#remoteVideo").srcObject=rs;$("#remoteVideo").style.display=video?"block":"none"});
  call.on("close",endCall);
 });
}
function showCall(c,video){
 $("#callAvatar").src=c.avatar||"";$("#callState").textContent="Bağlanır...";
 $("#callScreen").classList.add("show");
 $("#localVideo").style.display=video?"block":"none";
 if(video)$("#localVideo").srcObject=state.stream;
 state.callSeconds=0;clearInterval(state.callTimer);
 state.callTimer=setInterval(function(){
  state.callSeconds++;
  var m=Math.floor(state.callSeconds/60).toString().padStart(2,"0");
  var s=(state.callSeconds%60).toString().padStart(2,"0");
  $("#callTimer").textContent=m+":"+s;
 },1000);
 initIcons();
}
function endCall(){
 if(state.call)try{state.call.close()}catch(e){}
 state.call=null;
 if(state.stream)state.stream.getTracks().forEach(function(t){t.stop()});
 state.stream=null;clearInterval(state.callTimer);
 $("#callScreen").classList.remove("show");
 $("#remoteVideo").srcObject=null;$("#localVideo").srcObject=null;
}
$("#callEnd").onclick=endCall;
$("#callMute").onclick=function(){
 if(!state.stream)return;
 state.stream.getAudioTracks().forEach(function(t){t.enabled=!t.enabled});
};
$("#callCamera").onclick=function(){
 if(!state.stream)return;
 state.stream.getVideoTracks().forEach(function(t){t.enabled=!t.enabled});
};

/* =========================================================
   SWIPE GESTURES
   ========================================================= */
function gestureStart(e){
 var p=e.touches&&e.touches[0];if(!p)return;
 state.touch={x:p.clientX,y:p.clientY,t:now()};
}
function gestureEnd(e){
 var p=e.changedTouches&&e.changedTouches[0];if(!p)return;
 var dx=p.clientX-state.touch.x,dy=p.clientY-state.touch.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))<60)return;
 if(Math.abs(dx)>Math.abs(dy)){
  if(dx<0){
   if(state.screen==="chat")show("explore");
   else if(state.screen==="home")show("status");
  }else{
   if(state.screen==="explore")show("chat");
   else if(state.screen==="status")show("home");
  }
 }else{
  if(dy<0)globalSearch();
  else if(state.screen==="status")renderStatuses();
 }
}
document.addEventListener("touchstart",gestureStart,{passive:true});
document.addEventListener("touchend",gestureEnd,{passive:true});

/* =========================================================
   STATUS AUTOPLAY
   ========================================================= */
var statusObserver;
function setupStatusObserver(){
 if(!("IntersectionObserver"in window))return;
 statusObserver=new IntersectionObserver(function(entries){
  entries.forEach(function(e){
   var v=e.target.querySelector("video"),p=e.target.querySelector(".progress i");
   if(e.isIntersecting&&e.intersectionRatio>.7){
    if(v){v.muted=false;v.play().catch(function(){})}
    if(p){
     p.style.transition="width 15s linear";p.style.width="100%";
    }
    var s=getStatus(e.target.dataset.status);
    if(s){s.views++;save();publishStatus(s)}
   }else if(v)v.pause();
  });
 },{threshold:[.7]});
}
function observeStatuses(){
 if(!statusObserver)setupStatusObserver();
 if(statusObserver)$$("#statusFeed .status-card").forEach(function(x){statusObserver.observe(x)});
}

/* override render to observe */
var _renderStatuses=renderStatuses;
renderStatuses=function(){_renderStatuses();setTimeout(observeStatuses,50)};

/* =========================================================
   STATUS AUDIO MIX DEMO
   ========================================================= */
function playStatusMusic(s){
 if(!s||!s.audio)return;
 var a=new Audio(s.audio.url);a.currentTime=s.audio.start||0;a.volume=(s.audio.musicVol||80)/100;
 a.play().catch(function(){});
 var stop=function(){if(a.currentTime>(s.audio.start||0)+15){a.pause();a.removeEventListener("timeupdate",stop)}};
 a.addEventListener("timeupdate",stop);
 return a;
}
