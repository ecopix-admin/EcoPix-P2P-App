<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GeyimDəyis P2P Pro</title>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#000;color:#fff;overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border-bottom:1px solid #1a1a1a}
.logo{font-weight:800;font-size:19px;flex:0 0 auto}.logo span{color:#fe2c55}
.search-wrap{flex:1;display:flex;align-items:center;background:#1a1a1a;border-radius:22px;padding:2px 4px 2px 14px;border:1px solid #2a2a2a}
.search-wrap input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:7px 0;font-size:14px}
.search-wrap button{width:32px;height:32px;border-radius:50%;background:#fff;color:#000;border:none;display:flex;align-items:center;justify-content:center}
.icon-top{width:36px;height:36px;border-radius:50%;background:#1a1a1a;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;cursor:pointer}
#feed{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory;padding-top:54px;padding-bottom:70px}
.item{height:calc(100vh - 54px - 70px);min-height:600px;width:100vw;scroll-snap-align:start;position:relative;background:#0a0a0a;overflow:hidden;border-bottom:1px solid #111}
.media-wrap{height:100%;width:100%;position:relative}
.media-scroll{display:flex;overflow-x:scroll;scroll-snap-type:x mandatory;height:100%;width:100%}
.media-cell{min-width:100vw;height:100%;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.media-cell img,.media-cell video{width:100%;height:100%;object-fit:cover}
.wa-fixed{position:absolute;right:12px;bottom:88px;z-index:7;background:#25D366;color:#fff;border:none;border-radius:24px;padding:10px 16px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 18px rgba(0,0,0,0.4);cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0a0a0a;border-top:1px solid #1e1e1e;display:flex;justify-content:space-around;padding:6px 0 10px}
.nav{opacity:0.5;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;cursor:pointer}.nav.active{opacity:1}
</style>
</head>
<body>
<div class="header"><div class="icon-top" onclick="toggleMenu()">☰</div><div class="logo">Geyim<span>Dəyis</span></div><div class="search-wrap"><input id="search" placeholder="Axtar..."><button onclick="doSearch()">🔍</button></div><div class="icon-top" onclick="showFavs()">❤️</div></div>
<div id="feed"></div>
<div class="bottom-nav"><div class="nav active" onclick="goHome()">Home</div><div class="nav" onclick="openUpload()">+</div><div class="nav" onclick="showFavs()">Seçilmiş</div><div class="nav" onclick="openMyProfile()">Profil</div></div>
<div id="modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:60;display:none"></div>
<script>
// TAM KOD yuxarıdakı faylda var - bu qısa versiyadır, tam versiya üçün faylı endir
</script>
</body>
</html>
