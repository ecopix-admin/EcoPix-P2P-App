<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tavanda Sabit Qalan AR Karkas Şəbəkəsi</title>
  <!-- A-Frame və AR.js Kitabxanaları -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .ar-info {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 999;
      background: rgba(15, 23, 42, 0.85); color: #fff; padding: 12px;
      border-radius: 8px; font-family: sans-serif; font-size: 14px; text-align: center;
    }
  </style>
</head>
<body>

  <div class="ar-info">
    <b>📐 Sabit AR Profil Şəbəkəsi</b><br>
    Telefonu tərpətdikdə xətlər fəzada (tavanda) sabit qalır.
  </div>

  <!-- AR Scene: Giroskop və Kamera İzləməsi ilə -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    
    <!-- Fəzada (Tavanda) Sabit Lazer Və Profil Toru -->
    <!-- Position: X (sağ-sol), Y (yuxarı-aşağı), Z (məsafə) -->
    <a-entity id="ceilingGrid" position="0 1.8 -2" rotation="90 0 0">
      
      <!-- CD Profil Xətləri (Göy Parlaq Borular) -->
      <a-cylinder position="-1.2 0 0" radius="0.01" height="4" color="#00f2fe"></a-cylinder>
      <a-cylinder position="-0.6 0 0" radius="0.01" height="4" color="#00f2fe"></a-cylinder>
      <a-cylinder position="0 0 0" radius="0.01" height="4" color="#00f2fe"></a-cylinder>
      <a-cylinder position="0.6 0 0" radius="0.01" height="4" color="#00f2fe"></a-cylinder>
      <a-cylinder position="1.2 0 0" radius="0.01" height="4" color="#00f2fe"></a-cylinder>

      <!-- Alçipan Qovuşma Xətti (Qırmızı) -->
      <a-cylinder position="0 0 0" radius="0.015" height="3" rotation="0 0 90" color="#ff0055"></a-cylinder>

      <!-- Əsas Lövhə Müstəvisi (Şəffaf Tavan Şəbəkəsi) -->
      <a-plane position="0 0 -0.01" width="3" height="4" color="#38bdf8" opacity="0.15" side="double"></a-plane>

    </a-entity>

    <!-- Kamera -->
    <a-entity cameraLookControls look-controls camera></a-entity>

  </a-scene>

</body>
</html>
