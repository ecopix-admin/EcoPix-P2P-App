<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b10">
<title>LinguaKey — Smart Keyboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --accent:#ff3b6b;
    --accent2:#ff6688;
    --bg:#090b10;
    --panel:#11151d;
    --key:#202631;
    --text:#ffffff;
    --muted:#858e9d;
}

body{
    background:#050608;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    height:100vh;
    overflow:hidden;
}

.app{
    width:100%;
    max-width:480px;
    height:100vh;
    margin:auto;
    background:var(--bg);
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #202631;
    background:#0d1016;
}

.logoArea{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:40px;
    height:40px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    box-shadow:0 7px 25px #ff3b6b33;
}

.title{
    font-size:18px;
    font-weight:800;
}

.subtitle{
    color:#7f8998;
    font-size:10px;
    margin-top:2px;
}

.online{
    font-size:10px;
    color:#72df92;
}

.dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#5de07e;
    margin-right:4px;
}

/* LANGUAGE */

.language{
    margin:10px 12px;
    height:45px;
    border:1px solid #282f3a;
    background:#131820;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
}

.lang{
    font-size:12px;
    font-weight:700;
}

.swap{
    width:34px;
    height:32px;
    border-radius:10px;
    background:#242b36;
    color:#fff;
    border:1px solid #363f4d;
    font-size:17px;
}

/* CHAT */

.chat{
    flex:1;
    overflow:auto;
    padding:10px 14px;
}

.contact{
    text-align:center;
    margin:4px 0 15px;
}

.avatar{
    width:50px;
    height:50px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#ff8a5c,#ff3972);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
}

.contactName{
    margin-top:6px;
    font-size:14px;
    font-weight:700;
}

.contactLang{
    color:#788291;
    font-size:10px;
    margin-top:2px;
}

.message{
    max-width:82%;
    margin-bottom:13px;
}

.incoming{
    margin-right:auto;
}

.outgoing{
    margin-left:auto;
}

.bubble{
    padding:12px 14px;
    border-radius:17px;
    font-size:14px;
    line-height:1.4;
}

.incoming .bubble{
    background:#181e27;
    border:1px solid #252e3a;
    border-bottom-left-radius:5px;
}

.outgoing .bubble{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-bottom-right-radius:5px;
}

.translated{
    color:#8fe7a8;
    font-size:10px;
    padding:5px 4px 0;
}

.time{
    color:#66707e;
    font-size:9px;
    text-align:right;
    margin-top:4px;
}

/* SMART SUGGESTIONS */

.suggestions{
    padding:7px 11px;
    display:flex;
    gap:7px;
    overflow-x:auto;
    border-top:1px solid #202631;
    background:#0d1219;
}

.suggestion{
    flex:none;
    border:1px solid #303947;
    background:#171d26;
    color:#e6e9ee;
    border-radius:12px;
    padding:8px 11px;
    font-size:11px;
}

.suggestion.ai{
    border-color:var(--accent);
    color:#fff;
}

/* INPUT */

.inputArea{
    background:#0c1118;
    padding:8px 10px;
}

.inputRow{
    display:flex;
    gap:8px;
    align-items:flex-end;
}

textarea{
    flex:1;
    min-height:46px;
    max-height:90px;
    resize:none;
    border-radius:15px;
    border:1px solid #303845;
    background:#181f29;
    color:#fff;
    outline:none;
    padding:12px;
    font-size:14px;
}

textarea:focus{
    border-color:var(--accent);
}

.mic{
    width:46px;
    height:46px;
    border-radius:14px;
    border:1px solid #303845;
    background:#1a212c;
    color:#fff;
    font-size:19px;
}

.send{
    width:46px;
    height:46px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;
    font-size:19px;
}

/* TOOLBAR */

.toolbar{
    height:45px;
    display:flex;
    align-items:center;
    gap:7px;
    overflow-x:auto;
    margin-top:7px;
}

.tool{
    flex:none;
    height:34px;
    padding:0 11px;
    border-radius:10px;
    background:#181e27;
    color:#cbd1da;
    border:1px solid #2b3440;
    font-size:11px;
}

.tool.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
}

/* KEYBOARD */

.keyboard{
    background:#10151d;
    padding:7px 4px 5px;
    border-top:1px solid #242b35;
}

.row{
    display:flex;
    gap:4px;
    margin-bottom:5px;
}

.key{
    flex:1;
    height:39px;
    border:0;
    border-radius:8px;
    background:var(--key);
    color:#f1f3f6;
    font-size:14px;
    font-weight:500;
    box-shadow:0 2px 0 #12161c;
}

.key:active{
    transform:scale(.94);
}

.special{
    flex:1.45;
}

.space{
    flex:4;
}

.translate{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    font-weight:800;
}

/* THEME MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal.show{
    display:flex;
}

.themePanel{
    width:100%;
    max-width:480px;
    background:#11161e;
    border-radius:24px 24px 0 0;
    padding:18px;
    border:1px solid #29313d;
}

.handle{
    width:40px;
    height:4px;
    border-radius:5px;
    background:#414a57;
    margin:0 auto 16px;
}

.panelTitle{
    font-size:18px;
    font-weight:800;
    margin-bottom:4px;
}

.panelSub{
    font-size:11px;
    color:#7e8998;
    margin-bottom:15px;
}

.themes{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.theme{
    height:78px;
    border-radius:16px;
    border:1px solid #303947;
    background:#1a2029;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:12px;
}

.themeIcon{
    font-size:28px;
}

.theme.selected{
    border:2px solid var(--accent);
}

.close{
    width:100%;
    margin-top:15px;
    height:45px;
    border-radius:13px;
    border:0;
    background:#242b36;
    color:#fff;
    font-weight:700;
}

/* CARD THEME EFFECTS */

body.cardTheme .key{
    border-radius:6px;
    background:#f4f2ed;
    color:#171717;
    font-family:Georgia,serif;
    font-weight:700;
}

body.cardTheme .keyboard{
    background:#181818;
}

body.cardTheme .translate{
    color:#fff;
    background:#111;
}

body.heartTheme .key{
    border-radius:13px;
    background:linear-gradient(145deg,#351420,#221018);
    border:1px solid #6d2940;
}

body.spadeTheme .key{
    background:linear-gradient(145deg,#20242c,#12151a);
    border-radius:6px;
}

body.diamondTheme .key{
    transform:skewX(-1deg);
    border-radius:4px;
    background:linear-gradient(145deg,#21141a,#171116);
    border:1px solid #6e2938;
}

body.clubTheme .key{
    border-radius:18px;
    background:linear-gradient(145deg,#16241d,#101814);
    border:1px solid #285239;
}

body.neonTheme .key{
    background:#10151d;
    border:1px solid var(--accent);
    box-shadow:0 0 8px #ff3b6b33;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:250px;
    transform:translateX(-50%) translateY(15px);
    background:#f2f4f7;
    color:#111;
    padding:10px 15px;
    border-radius:12px;
    font-size:11px;
    font-weight:800;
    opacity:0;
    pointer-events:none;
    transition:.2s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(min-width:600px){
    body{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .app{
        height:850px;
        max-height:96vh;
        border-radius:25px;
        overflow:hidden;
        border:1px solid #252d38;
        box-shadow:0 30px 100px #000;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logoArea">
        <div class="logo" id="logo">♥</div>

        <div>
            <div class="title">LinguaKey</div>
            <div class="subtitle">Smart Translation Keyboard</div>
        </div>
    </div>

    <div class="online">
        <span class="dot"></span>ACTIVE
    </div>

</header>

<div class="language">

    <div class="lang">
        🇦🇿 Azərbaycan
    </div>

    <button class="swap" onclick="swapLanguage()">⇄</button>

    <div class="lang" id="targetLang">
        🇬🇧 English
    </div>

</div>

<div class="chat" id="chat">

    <div class="contact">
        <div class="avatar">J</div>
        <div class="contactName">James Wilson</div>
        <div class="contactLang">🇬🇧 English</div>
    </div>

    <div class="message incoming">

        <div class="bubble">
            Hi! Are you coming home tonight?
        </div>

        <div class="translated">
            🇦🇿 Salam! Bu axşam evə gəlirsən?
        </div>

        <div class="time">
            20:14 ✓✓
        </div>

    </div>

    <div class="message outgoing">

        <div class="bubble">
            Bəli, bir azdan gəlirəm.
        </div>

        <div class="translated">
            🇬🇧 Yes, I'll be home soon.
        </div>

        <div class="time">
            20:15 ✓✓
        </div>

    </div>

</div>

<!-- SMART REPLIES -->

<div class="suggestions">

    <button class="suggestion ai"
    onclick="useSuggestion('Bəli, gəlirəm.')">
        🤖 Bəli, gəlirəm.
    </button>

    <button class="suggestion"
    onclick="useSuggestion('Bir az gecikəcəyəm.')">
        Bir az gecikəcəyəm.
    </button>

    <button class="suggestion"
    onclick="useSuggestion('10 dəqiqəyə gəlirəm.')">
        10 dəqiqəyə gəlirəm.
    </button>

    <button class="suggestion"
    onclick="useSuggestion('İndi məşğulam.')">
        İndi məşğulam.
    </button>

</div>

<!-- INPUT -->

<div class="inputArea">

    <div class="inputRow">

        <button class="mic" onclick="voiceDemo()">🎤</button>

        <textarea
            id="input"
            placeholder="Azərbaycan dilində yaz..."
            oninput="liveTranslate()"
        ></textarea>

        <button class="send" onclick="send()">➤</button>

    </div>

    <div class="toolbar">

        <button class="tool active" onclick="openThemes()">
            🎨 Tema
        </button>

        <button class="tool" onclick="translate()">
            🌐 Tərcümə
        </button>

        <button class="tool" onclick="showToast('🤖 Ağıllı cavablar aktivdir')">
            🤖 Cavablar
        </button>

        <button class="tool" onclick="showToast('⚡ Hazır cümlələr')">
            ⚡ Hazır
        </button>

        <button class="tool" onclick="showToast('🧠 Şəxsi yaddaş aktivdir')">
            🧠 Yaddaş
        </button>

    </div>

</div>

<!-- KEYBOARD -->

<div class="keyboard">

    <div class="row">

        <button class="key" onclick="key('Q')">Q</button>
        <button class="key" onclick="key('W')">W</button>
        <button class="key" onclick="key('E')">E</button>
        <button class="key" onclick="key('R')">R</button>
        <button class="key" onclick="key('T')">T</button>
        <button class="key" onclick="key('Y')">Y</button>
        <button class="key" onclick="key('U')">U</button>
        <button class="key" onclick="key('I')">I</button>
        <button class="key" onclick="key('O')">O</button>
        <button class="key" onclick="key('P')">P</button>

    </div>

    <div class="row">

        <button class="key" onclick="key('A')">A</button>
        <button class="key" onclick="key('S')">S</button>
        <button class="key" onclick="key('D')">D</button>
        <button class="key" onclick="key('F')">F</button>
        <button class="key" onclick="key('G')">G</button>
        <button class="key" onclick="key('H')">H</button>
        <button class="key" onclick="key('J')">J</button>
        <button class="key" onclick="key('K')">K</button>
        <button class="key" onclick="key('L')">L</button>

    </div>

    <div class="row">

        <button class="key special">⇧</button>

        <button class="key" onclick="key('Z')">Z</button>
        <button class="key" onclick="key('X')">X</button>
        <button class="key" onclick="key('C')">C</button>
        <button class="key" onclick="key('V')">V</button>
        <button class="key" onclick="key('B')">B</button>
        <button class="key" onclick="key('N')">N</button>
        <button class="key" onclick="key('M')">M</button>

        <button class="key special" onclick="backspace()">⌫</button>

    </div>

    <div class="row">

        <button class="key special" onclick="openThemes()">♥</button>

        <button class="key space" onclick="key(' ')">
            space
        </button>

        <button class="key translate" onclick="translate()">
            🌐 EN
        </button>

        <button class="key special" onclick="send()">
            ➤
        </button>

    </div>

</div>

</div>

<!-- THEME SELECTOR -->

<div class="modal" id="themeModal">

    <div class="themePanel">

        <div class="handle"></div>

        <div class="panelTitle">
            Klaviatura görünüşü
        </div>

        <div class="panelSub">
            Öz üslubunu seç
        </div>

        <div class="themes">

            <button class="theme selected"
            onclick="setTheme('heart','♥','❤️')">

                <span class="themeIcon">♥</span>
                Ürək

            </button>

            <button class="theme"
            onclick="setTheme('spade','♠','♠️')">

                <span class="themeIcon">♠</span>
                Pik

            </button>

            <button class="theme"
            onclick="setTheme('diamond','♦','♦️')">

                <span class="themeIcon">♦</span>
                Karo

            </button>

            <button class="theme"
            onclick="setTheme('club','♣','♣️')">

                <span class="themeIcon">♣</span>
                Tref

            </button>

            <button class="theme"
            onclick="setTheme('card','🃏','🃏')">

                <span class="themeIcon">🃏</span>
                Kart

            </button>

            <button class="theme"
            onclick="setTheme('neon','⚡','⚡')">

                <span class="themeIcon">⚡</span>
                Neon

            </button>

            <button class="theme"
            onclick="setTheme('classic','⌨','⌨')">

                <span class="themeIcon">⌨</span>
                Classic

            </button>

            <button class="theme"
            onclick="setTheme('heart','💗','💗')">

                <span class="themeIcon">💗</span>
                Love

            </button>

        </div>

        <button class="close" onclick="closeThemes()">
            Hazırdır
        </button>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>

const translations = {

    "Bəli, gəlirəm.":
        "Yes, I'm coming.",

    "Bir az gecikəcəyəm.":
        "I'll be a little late.",

    "10 dəqiqəyə gəlirəm.":
        "I'll be there in 10 minutes.",

    "İndi məşğulam.":
        "I'm busy right now.",

    "Salam, necəsən?":
        "Hi, how are you?",

    "Haradasan?":
        "Where are you?",

    "Gələndə çörək al.":
        "Buy bread when you come.",

    "Mən yoldayam.":
        "I'm on my way.",

    "Axşam danışarıq.":
        "We'll talk tonight."

};

let direction = "EN";

function key(letter){

    const input = document.getElementById("input");

    input.value += letter;

    input.focus();

    liveTranslate();

}

function backspace(){

    const input = document.getElementById("input");

    input.value = input.value.slice(0,-1);

    input.focus();

    liveTranslate();

}

function liveTranslate(){

    const text = document.getElementById("input").value;

    if(text){

        let result = translations[text];

        if(!result)
            result = "→ " + text;

        document.getElementById("targetLang").innerHTML =
            direction === "EN"
            ? "🇬🇧 English"
            : "🇷🇺 Русский";

    }

}

function translate(){

    const input = document.getElementById("input");

    const text = input.value.trim();

    if(!text){

        showToast("Əvvəlcə mesaj yaz");

        return;

    }

    let result = translations[text];

    if(!result)
        result = text;

    input.value = result;

    showToast("🌐 Tərcümə edildi");

}

function send(){

    const input = document.getElementById("input");

    const text = input.value.trim();

    if(!text){

        showToast("Mesaj yaz");

        return;

    }

    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message outgoing";

    const translated =
        translations[text] ||
        text;

    message.innerHTML = `

        <div class="bubble">
            ${escapeHTML(text)}
        </div>

        <div class="translated">
            🇬🇧 ${escapeHTML(translated)}
        </div>

        <div class="time">
            indi ✓✓
        </div>

    `;

    chat.appendChild(message);

    input.value = "";

    chat.scrollTop = chat.scrollHeight;

    savePhrase(text);

    showToast("✓ Tərcümə olunaraq göndərildi");

}

function useSuggestion(text){

    document.getElementById("input").value = text;

    liveTranslate();

}

function savePhrase(text){

    let phrases =
        JSON.parse(localStorage.getItem("linguaPhrases") || "[]");

    if(!phrases.includes(text)){

        phrases.unshift(text);

        phrases =
            phrases.slice(0,30);

        localStorage.setItem(
            "linguaPhrases",
            JSON.stringify(phrases)
        );

    }

}

function swapLanguage(){

    direction =
        direction === "EN"
        ? "RU"
        : "EN";

    document.getElementById("targetLang").innerHTML =
        direction === "EN"
        ? "🇬🇧 English"
        : "🇷🇺 Русский";

    showToast(
        direction === "EN"
        ? "🇬🇧 English"
        : "🇷🇺 Русский"
    );

}

function openThemes(){

    document
        .getElementById("themeModal")
        .classList.add("show");

}

function closeThemes(){

    document
        .getElementById("themeModal")
        .classList.remove("show");

}

function setTheme(theme,icon,toastIcon){

    document.body.classList.remove(
        "heartTheme",
        "spadeTheme",
        "diamondTheme",
        "clubTheme",
        "cardTheme",
        "neonTheme"
    );

    if(theme !== "classic"){

        document.body.classList.add(
            theme + "Theme"
        );

    }

    document.getElementById("logo").textContent =
        icon;

    document.querySelectorAll(".theme")
        .forEach(t =>
            t.classList.remove("selected")
        );

    event.currentTarget.classList.add("selected");

    localStorage.setItem(
        "linguaTheme",
        theme
    );

    showToast(
        toastIcon + " Tema seçildi"
    );

}

function voiceDemo(){

    if(
        !("webkitSpeechRecognition" in window) &&
        !("SpeechRecognition" in window)
    ){

        showToast(
            "🎤 Bu brauzerdə səs tanıma dəstəklənmir"
        );

        return;

    }

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    const recognition =
        new SpeechRecognition();

    recognition.lang = "az-AZ";

    recognition.interimResults = false;

    recognition.onstart = function(){

        showToast("🎤 Danışırsınız...");

    };

    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;

        document.getElementById("input").value =
            text;

        liveTranslate();

    };

    recognition.onerror = function(){

        showToast("Səs tanınmadı");

    };

    recognition.start();

}

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    setTimeout(
        () => toast.classList.remove("show"),
        1800
    );

}

function escapeHTML(str){

    return str
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* LOAD SAVED THEME */

const savedTheme =
    localStorage.getItem("linguaTheme");

if(savedTheme){

    document.body.classList.remove(
        "heartTheme",
        "spadeTheme",
        "diamondTheme",
        "clubTheme",
        "cardTheme",
        "neonTheme"
    );

    if(savedTheme !== "classic"){

        document.body.classList.add(
            savedTheme + "Theme"
        );

    }

    const icons = {
        heart:"♥",
        spade:"♠",
        diamond:"♦",
        club:"♣",
        card:"🃏",
        neon:"⚡",
        classic:"⌨"
    };

    document.getElementById("logo").textContent =
        icons[savedTheme] || "♥";

}

</script>

</body>
