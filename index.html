<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eşitmə Dəstəyi və Canlı Mətn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.8rem; color: #4CAF50; margin-bottom: 8px; }
        p.subtitle { color: #aaa; font-size: 0.95rem; }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        #startBtn { background-color: #2196F3; color: white; }
        #startBtn.active { background-color: #f44336; }
        #clearBtn { background-color: #333; color: #ccc; }

        .lang-select {
            padding: 10px;
            border-radius: 8px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            font-size: 1rem;
        }

        .text-box {
            flex: 1;
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 16px;
            padding: 25px;
            font-size: 2rem;
            line-height: 1.5;
            overflow-y: auto;
            max-height: 50vh;
            word-wrap: break-word;
        }

        .interim { color: #888; font-style: italic; }
        .final { color: #ffffff; }

        .status-bar {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #ff9800;
        }
    </style>
</head>
<body>

    <header>
        <h1>Eşitmə Asistenti</h1>
        <p class="subtitle">Danışığı canlı mətnə çevirən və səs gücləndirən alət</p>
    </header>

    <div class="controls">
        <select id="langSelect" class="lang-select">
            <option value="az-AZ" selected>Azərbaycan dili</option>
            <option value="tr-TR">Türkçe</option>
            <option value="en-US">English</option>
            <option value="ru-RU">Русский</option>
        </select>
        <button id="startBtn">Dinləməni Başlat</button>
        <button id="clearBtn">Təmizlə</button>
    </div>

    <div class="text-box" id="textBox">
        <span class="final" id="finalText"></span>
        <span class="interim" id="interimText"></span>
    </div>

    <div class="status-bar" id="statusText">Sistemi başlatmaq üçün düyməyə sıxın...</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const clearBtn = document.getElementById('clearBtn');
    const langSelect = document.getElementById('langSelect');
    const finalTextEl = document.getElementById('finalText');
    const interimTextEl = document.getElementById('interimText');
    const statusText = document.getElementById('statusText');
    const textBox = document.getElementById('textBox');

    let recognition;
    let isListening = false;
    let audioCtx, gainNode, filterNode, microphone;

    // Web Speech API Dəstəyi Yoxlanılır
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        statusText.innerText = "Xəbərdarlıq: Brauzeriniz Speech Recognition API-ni dəstəkləmir (Google Chrome tövsiyə olunur).";
        startBtn.disabled = true;
    } else {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            statusText.innerText = "Dinlənilir... Mikrofon aktivdir.";
            statusText.style.color = "#4CAF50";
        };

        recognition.onerror = (event) => {
            statusText.innerText = "Xəta baş verdi: " + event.error;
            statusText.style.color = "#f44336";
        };

        recognition.onend = () => {
            if (isListening) {
                // Avtomatik dayanarsa yenidən başladırıq (fasiləsiz işləməsi üçün)
                recognition.start();
            } else {
                statusText.innerText = "Dinləmə dayandırıldı.";
                statusText.style.color = "#ff9800";
            }
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTextEl.innerText += event.results[i][0].transcript + ' ';
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            interimTextEl.innerText = interimTranscript;
            textBox.scrollTop = textBox.scrollHeight; // Avtomatik aşağı skrol
        };
    }

    // Audio Gücləndirici (Qulaqlıq üçün səs filtrasiyası)
    async function startAudioAmplifier() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true }
            });

            microphone = audioCtx.createMediaStreamSource(stream);
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 2.5; // Səsi 2.5 dəfə gücləndirir

            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = "peaking";
            filterNode.frequency.value = 2500; // İnsan nitqi tezliyini qaldırır
            filterNode.gain.value = 8;

            microphone.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);
        } catch (e) {
            console.log("Audio Amplifier aktiv olunmadı:", e.message);
        }
    }

    // Düymə idarələri
    startBtn.addEventListener('click', () => {
        if (!isListening) {
            recognition.lang = langSelect.value;
            recognition.start();
            startAudioAmplifier();
            isListening = true;
            startBtn.innerText = "Dayandır";
            startBtn.classList.add('active');
        } else {
            isListening = false;
            recognition.stop();
            if (audioCtx) audioCtx.close();
            startBtn.innerText = "Dinləməni Başlat";
            startBtn.classList.remove('active');
        }
    });

    clearBtn.addEventListener('click', () => {
        finalTextEl.innerText = '';
        interimTextEl.innerText = '';
    });
</script>
</body>
</html>
