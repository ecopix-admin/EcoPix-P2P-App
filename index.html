<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>SEEIT — Show Me</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050507;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
}
body{position:relative}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#08090c;
}

#shade{
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.65),transparent 24%),
    linear-gradient(to top,rgba(0,0,0,.8),transparent 45%);
  pointer-events:none;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:calc(15px + env(safe-area-inset-top)) 18px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:5;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{color:#72f5b0}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.12);
  padding:8px 12px;
  border-radius:30px;
  backdrop-filter:blur(14px);
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
}

.dot.active{
  background:#5cff9d;
  box-shadow:0 0 12px #5cff9d;
}

.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(78vw,420px);
  aspect-ratio:1;
  border-radius:32px;
  border:1px solid rgba(255,255,255,.35);
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.05),
    0 0 40px rgba(114,245,176,.12);
  pointer-events:none;
}

.corner{
  position:absolute;
  width:32px;
  height:32px;
  border-color:#fff;
  border-style:solid;
}

.c1{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:15px 0 0 0}
.c2{top:-2px;right:-2px;border-width:3px 3px 0 0;border-radius:0 15px 0 0}
.c3{bottom:-2px;left:-2px;border-width:0 0 3px 3px;border-radius:0 0 0 15px}
.c4{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 15px 0}

.scan{
  position:absolute;
  left:7%;
  right:7%;
  top:10%;
  height:2px;
  background:#72f5b0;
  box-shadow:0 0 16px #72f5b0;
  opacity:.8;
  animation:scan 2.8s linear infinite;
}

@keyframes scan{
  0%{top:8%}
  50%{top:92%}
  100%{top:8%}
}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  z-index:5;
}

.result{
  width:min(620px,100%);
  margin:auto;
  background:rgba(7,8,11,.76);
  border:1px solid rgba(255,255,255,.14);
  border-radius:25px;
  padding:15px;
  backdrop-filter:blur(22px);
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  transition:.25s;
}

.result.hidden{
  opacity:0;
  transform:translateY(25px);
  pointer-events:none;
}

.resultTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.resultTitle strong{
  font-size:21px;
  letter-spacing:-.5px;
}

.conf{
  font-size:12px;
  color:#72f5b0;
}

.sub{
  color:#aeb3bd;
  font-size:13px;
  margin-bottom:14px;
}

.tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.tag{
  padding:7px 10px;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  color:#ddd;
  font-size:12px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.btn{
  border:0;
  border-radius:15px;
  padding:13px 10px;
  font-weight:800;
  color:#fff;
  background:rgba(255,255,255,.1);
  cursor:pointer;
}

.btn.primary{
  background:#72f5b0;
  color:#07100b;
}

.controls{
  display:flex;
  justify-content:center;
  gap:13px;
  margin-top:12px;
}

.round{
  width:55px;
  height:55px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.52);
  color:white;
  font-size:21px;
  backdrop-filter:blur(14px);
  cursor:pointer;
}

.round.main{
  width:68px;
  height:68px;
  background:#fff;
  color:#000;
  font-size:27px;
}

#loading{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:20;
  background:#050507;
  transition:.4s;
}

#loading.hide{
  opacity:0;
  pointer-events:none;
}

.spinner{
  width:48px;
  height:48px;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:#72f5b0;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:18px;
}

@keyframes spin{to{transform:rotate(360deg)}}

.loadTitle{
  font-size:21px;
  font-weight:900;
}

.loadText{
  color:#969ba5;
  font-size:13px;
  margin-top:7px;
  text-align:center;
  max-width:300px;
  line-height:1.5;
}

#file{
  display:none;
}

#message{
  position:absolute;
  top:82px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.1);
  border-radius:15px;
  padding:10px 14px;
  font-size:12px;
  color:#ddd;
  backdrop-filter:blur(15px);
  opacity:0;
  transition:.25s;
  pointer-events:none;
}

#message.show{opacity:1}

@media(max-width:420px){
  .center{width:82vw}
  .resultTitle strong{font-size:18px}
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>
<div id="shade"></div>

<div id="loading">
  <div class="spinner"></div>
  <div class="loadTitle">SEEIT AI hazırlanır</div>
  <div class="loadText">
    Açıq mənbəli görmə modeli yüklənir.
    İlk dəfə bir qədər vaxt tələb edə bilər.
  </div>
</div>

<div id="message"></div>

<div class="top">
  <div class="logo">SEE<span>IT</span></div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">AI hazırlanır</span>
  </div>
</div>

<div class="center">
  <div class="corner c1"></div>
  <div class="corner c2"></div>
  <div class="corner c3"></div>
  <div class="corner c4"></div>
  <div class="scan"></div>
</div>

<div class="bottom">

  <div class="result hidden" id="result">

    <div class="resultTitle">
      <strong id="mainLabel">Analiz edilir...</strong>
      <span class="conf" id="confidence">--</span>
    </div>

    <div class="sub" id="description">
      Kameranı obyektə tut.
    </div>

    <div class="tags" id="tags"></div>

    <div class="actions">
      <button class="btn primary" id="shopBtn">
        🛒 Məhsulu axtar
      </button>

      <button class="btn" id="imageSearchBtn">
        🔎 Şəkillərdə axtar
      </button>
    </div>

  </div>

  <div class="controls">

    <button class="round" id="gallery">
      🖼️
    </button>

    <button class="round main" id="analyze">
      ◉
    </button>

    <button class="round" id="flip">
      🔄
    </button>

  </div>

</div>

<input type="file" id="file" accept="image/*">

<script type="module">

import { pipeline, env }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";

/* ----------------------------------------------------
   CONFIG
---------------------------------------------------- */

env.allowLocalModels = false;
env.useBrowserCache = true;

const MODEL = "Xenova/clip-vit-base-patch32";

/*
  CLIP-i konkret məhsul bazası kimi təqdim etmirik.
  Bu etiketlər real AI modelinə verilir.
*/
const LABELS = [

  "a pair of running shoes",
  "a pair of sneakers",
  "a pair of basketball shoes",
  "a pair of football boots",
  "a pair of hiking shoes",
  "a pair of leather shoes",
  "a pair of formal dress shoes",
  "a pair of casual shoes",
  "a pair of boots",
  "a pair of sandals",
  "a pair of slippers",

  "Nike sneakers",
  "Adidas sneakers",
  "Puma sneakers",
  "New Balance sneakers",
  "Jordan sneakers",
  "Converse sneakers",
  "Vans sneakers",
  "Reebok sneakers",

  "a black shoe",
  "a white shoe",
  "a red shoe",
  "a blue shoe",
  "a green shoe",
  "a colorful shoe",

  "a modern sneaker",
  "a vintage sneaker",
  "a luxury shoe",
  "a sports shoe"
];

/* ----------------------------------------------------
   DOM
---------------------------------------------------- */

const video = document.getElementById("camera");
const loading = document.getElementById("loading");
const statusText = document.getElementById("statusText");
const dot = document.getElementById("dot");

const result = document.getElementById("result");
const mainLabel = document.getElementById("mainLabel");
const confidence = document.getElementById("confidence");
const description = document.getElementById("description");
const tags = document.getElementById("tags");

const analyzeBtn = document.getElementById("analyze");
const galleryBtn = document.getElementById("gallery");
const flipBtn = document.getElementById("flip");
const fileInput = document.getElementById("file");

const shopBtn = document.getElementById("shopBtn");
const imageSearchBtn = document.getElementById("imageSearchBtn");

const message = document.getElementById("message");

let classifier = null;
let stream = null;
let facingMode = "environment";
let lastResult = null;
let analyzing = false;

/* ----------------------------------------------------
   MESSAGE
---------------------------------------------------- */

let messageTimer;

function showMessage(text){

  message.textContent = text;
  message.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer = setTimeout(()=>{
    message.classList.remove("show");
  },2600);
}

/* ----------------------------------------------------
   CAMERA
---------------------------------------------------- */

async function startCamera(){

  try{

    if(stream){
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:{
          ideal:facingMode
        },
        width:{
          ideal:1280
        },
        height:{
          ideal:720
        }
      },

      audio:false

    });

    video.srcObject = stream;

    dot.classList.add("active");
    statusText.textContent = "Kamera aktiv";

  }catch(error){

    console.error(error);

    statusText.textContent = "Kamera açılmadı";

    showMessage(
      "Kameraya icazə verilmədi. Brauzerdə kamera icazəsini aç."
    );
  }
}

/* ----------------------------------------------------
   AI MODEL
---------------------------------------------------- */

async function loadAI(){

  try{

    statusText.textContent = "AI yüklənir";

    /*
      WebGPU dəstəklənirsə istifadə olunur.
      Alınmasa WASM/CPU fallback işləyəcək.
    */

    let device = "wasm";

    if("gpu" in navigator){
      device = "webgpu";
    }

    classifier = await pipeline(
      "zero-shot-image-classification",
      MODEL,
      {
        device,
        dtype: device === "webgpu" ? "q4" : "q8"
      }
    );

    statusText.textContent = "AI hazır";
    dot.classList.add("active");

    loading.classList.add("hide");

    showMessage(
      "Hazırdır. Ayaqqabını çərçivəyə gətir."
    );

    await startCamera();

  }catch(error){

    console.error(error);

    loading.querySelector(".loadTitle").textContent =
      "AI yüklənmədi";

    loading.querySelector(".loadText").textContent =
      "İnternet bağlantısını yoxla və səhifəni yenilə.";

  }
}

/* ----------------------------------------------------
   CAPTURE CAMERA FRAME
---------------------------------------------------- */

function captureFrame(){

  const canvas = document.createElement("canvas");

  const maxWidth = 768;

  const ratio = video.videoHeight / video.videoWidth;

  canvas.width = maxWidth;
  canvas.height = Math.round(maxWidth * ratio);

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas;
}

/* ----------------------------------------------------
   IMAGE ANALYSIS
---------------------------------------------------- */

async function analyzeImage(source){

  if(!classifier){
    showMessage("AI hələ hazır deyil.");
    return;
  }

  if(analyzing){
    return;
  }

  analyzing = true;

  analyzeBtn.textContent = "…";

  statusText.textContent = "Görüntü analiz edilir";

  try{

    /*
      REAL MODEL INFERENCE.
      Burada saxta nəticə yoxdur.
    */

    const output = await classifier(
      source,
      LABELS,
      {
        topk:6
      }
    );

    console.log("AI RESULT:",output);

    if(!output || !output.length){
      throw new Error("No AI result");
    }

    const best = output[0];

    lastResult = best;

    displayResult(output);

  }catch(error){

    console.error(error);

    showMessage(
      "Şəkil analiz edilə bilmədi."
    );

  }finally{

    analyzing = false;

    analyzeBtn.textContent = "◉";

    statusText.textContent = "AI hazır";

  }
}

/* ----------------------------------------------------
   RESULT UI
---------------------------------------------------- */

function cleanLabel(label){

  return label
    .replace(/^a pair of /i,"")
    .replace(/^a /i,"")
    .replace(/^an /i,"")
    .trim();
}

function displayResult(output){

  const best = output[0];

  const label = cleanLabel(best.label);

  const percent = Math.round(best.score * 100);

  mainLabel.textContent =
    label.charAt(0).toUpperCase() + label.slice(1);

  confidence.textContent =
    percent + "% AI uyğunluğu";

  description.textContent =
    "Görüntü açıq mənbəli CLIP modeli ilə analiz edildi.";

  tags.innerHTML = "";

  output.slice(0,5).forEach(item=>{

    const el = document.createElement("div");

    el.className = "tag";

    el.textContent =
      `${cleanLabel(item.label)} · ${Math.round(item.score*100)}%`;

    tags.appendChild(el);

  });

  result.classList.remove("hidden");

  showMessage(
    "AI nəticəni tapdı."
  );
}

/* ----------------------------------------------------
   PRODUCT SEARCH
---------------------------------------------------- */

function getSearchTerm(){

  if(!lastResult){
    return "shoes";
  }

  return cleanLabel(lastResult.label);
}

shopBtn.onclick = ()=>{

  const q = encodeURIComponent(
    getSearchTerm()
  );

  /*
    Bu real axtarışdır.
    Saxta məhsul kartları yaratmırıq.
  */

  window.open(
    "https://www.google.com/search?tbm=shop&q=" + q,
    "_blank"
  );
};

imageSearchBtn.onclick = ()=>{

  const q = encodeURIComponent(
    getSearchTerm()
  );

  window.open(
    "https://www.google.com/search?tbm=isch&q=" + q,
    "_blank"
  );
};

/* ----------------------------------------------------
   ANALYZE CAMERA
---------------------------------------------------- */

analyzeBtn.onclick = async ()=>{

  if(!video.videoWidth){

    showMessage("Kamera görüntüsü hələ hazır deyil.");

    return;
  }

  const frame = captureFrame();

  await analyzeImage(frame);
};

/* ----------------------------------------------------
   GALLERY
---------------------------------------------------- */

galleryBtn.onclick = ()=>{

  fileInput.click();

};

fileInput.onchange = async ()=>{

  const file = fileInput.files[0];

  if(!file){
    return;
  }

  const image = new Image();

  image.onload = async ()=>{

    await analyzeImage(image);

    URL.revokeObjectURL(image.src);

  };

  image.src = URL.createObjectURL(file);

};

/* ----------------------------------------------------
   CAMERA SWITCH
---------------------------------------------------- */

flipBtn.onclick = async ()=>{

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";

  await startCamera();

};

/* ----------------------------------------------------
   START
---------------------------------------------------- */

loadAI();

</script>

</body>
</html>
