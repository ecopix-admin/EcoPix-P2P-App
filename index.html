<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>VIRTUAL PRO — AI Talking Avatar</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050609;
  font-family:Inter,Arial,sans-serif;
  color:white;
}

body{
  position:fixed;
  inset:0;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#182133 0%,#080a0f 45%,#030405 100%);
}

#scene{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* ---------- TOP UI ---------- */

.top{
  position:absolute;
  left:0;
  right:0;
  top:0;
  padding:
    calc(env(safe-area-inset-top) + 14px)
    16px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:20;
  pointer-events:none;
}

.brand{
  pointer-events:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:21px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:
    0 10px 35px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
}

.brandText b{
  display:block;
  font-size:13px;
  letter-spacing:2px;
}

.brandText span{
  display:block;
  font-size:9px;
  opacity:.5;
  letter-spacing:1.5px;
  margin-top:3px;
}

.topActions{
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.iconBtn{
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  background:rgba(0,0,0,.28);
  color:#fff;
  font-size:17px;
  backdrop-filter:blur(20px);
}

/* ---------- AVATAR INFO ---------- */

.avatarInfo{
  position:absolute;
  z-index:10;
  left:18px;
  bottom:164px;
  pointer-events:none;
  transition:.3s;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  border-radius:20px;
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(16px);
  font-size:10px;
  color:#bfc7d4;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#39ff9b;
  box-shadow:0 0 12px #39ff9b;
}

.name{
  margin-top:9px;
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}

.role{
  opacity:.48;
  font-size:11px;
  margin-top:3px;
}

/* ---------- SUBTITLE ---------- */

.subtitle{
  position:absolute;
  z-index:12;
  left:50%;
  transform:translateX(-50%);
  bottom:145px;
  width:min(88%,680px);
  text-align:center;
  pointer-events:none;
}

.subtitleText{
  display:inline-block;
  padding:8px 15px;
  border-radius:16px;
  background:rgba(0,0,0,.34);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  font-size:14px;
  line-height:1.45;
  text-shadow:0 2px 12px #000;
}

/* ---------- BOTTOM ---------- */

.bottom{
  position:absolute;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  padding:
    10px 14px
    calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(
    to top,
    rgba(3,4,6,.97),
    rgba(3,4,6,.72),
    transparent
  );
}

.inputRow{
  display:flex;
  gap:8px;
  max-width:800px;
  margin:auto;
}

#textInput{
  min-width:0;
  flex:1;
  height:52px;
  border:none;
  outline:none;
  color:white;
  padding:0 17px;
  border-radius:18px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(25px);
  font-size:14px;
}

#textInput::placeholder{
  color:rgba(255,255,255,.4);
}

.speakBtn{
  width:58px;
  height:52px;
  border:none;
  border-radius:18px;
  color:white;
  font-size:20px;
  background:linear-gradient(135deg,#246bff,#7a42ff);
  box-shadow:
    0 8px 28px rgba(73,82,255,.35);
}

.speakBtn:active{
  transform:scale(.94);
}

.shareRow{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:8px;
}

.smallBtn{
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  background:rgba(255,255,255,.06);
  padding:8px 13px;
  border-radius:13px;
  font-size:10px;
  backdrop-filter:blur(15px);
}

/* ---------- RECORDING ---------- */

.rec{
  position:absolute;
  z-index:25;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  align-items:center;
  gap:7px;
  padding:7px 12px;
  border-radius:20px;
  background:rgba(255,30,60,.15);
  border:1px solid rgba(255,60,80,.3);
  font-size:10px;
  backdrop-filter:blur(15px);
}

.rec.show{
  display:flex;
}

.recDot{
  width:7px;
  height:7px;
  background:#ff334f;
  border-radius:50%;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{opacity:.25}
}

/* ---------- TAP TO TALK ---------- */

.tapHint{
  position:absolute;
  z-index:9;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:.25;
  font-size:10px;
  letter-spacing:2px;
  transition:opacity .5s;
}

.tapHint.hide{
  opacity:0;
}

/* ---------- LANDSCAPE ---------- */

@media(min-width:800px){
  .avatarInfo{
    bottom:125px;
    left:30px;
  }

  .subtitle{
    bottom:105px;
  }

  .bottom{
    padding-bottom:20px;
  }
}
</style>
</head>

<body>

<div id="app">

<canvas id="scene"></canvas>

<div class="top">
  <div class="brand">
    <div class="logo">✦</div>
    <div class="brandText">
      <b>VIRTUAL PRO</b>
      <span>AI DIGITAL HUMAN</span>
    </div>
  </div>

  <div class="topActions">
    <button class="iconBtn" id="fullscreen">⛶</button>
  </div>
</div>

<div class="rec" id="rec">
  <div class="recDot"></div>
  RECORDING
</div>

<div class="avatarInfo">
  <div class="status">
    <span class="dot"></span>
    ONLINE · READY
  </div>

  <div class="name">Virtual Pro</div>
  <div class="role">AI Football Presenter</div>
</div>

<div class="subtitle">
  <span class="subtitleText" id="subtitle"></span>
</div>

<div class="tapHint" id="tapHint">
  TAP AVATAR TO SPEAK
</div>

<div class="bottom">

  <div class="inputRow">

    <input
      id="textInput"
      type="text"
      autocomplete="off"
      placeholder="Avatarın danışacağı mətni yaz..."
    >

    <button class="speakBtn" id="speak">
      🎙
    </button>

  </div>

  <div class="shareRow">
    <button class="smallBtn" id="recordBtn">
      🎥 Video
    </button>

    <button class="smallBtn" id="shareBtn">
      📤 WhatsApp / Paylaş
    </button>

    <button class="smallBtn" id="stopBtn">
      ■ Stop
    </button>
  </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* ============================================================
   VIRTUAL PRO
   SINGLE FILE 3D DIGITAL HUMAN
   ============================================================ */

const canvas = document.getElementById("scene");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  alpha:false,
  preserveDrawingBuffer:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070b);

const camera = new THREE.PerspectiveCamera(
  38,
  innerWidth/innerHeight,
  .1,
  100
);

camera.position.set(0,1.75,5.7);

const clock = new THREE.Clock();

/* ============================================================
   LIGHTING
   ============================================================ */

const ambient = new THREE.HemisphereLight(
  0x9bb8ff,
  0x090b10,
  1.8
);

scene.add(ambient);

const key = new THREE.DirectionalLight(
  0xffffff,
  3.1
);

key.position.set(-3,5,4);
key.castShadow=true;

key.shadow.mapSize.width=1024;
key.shadow.mapSize.height=1024;

scene.add(key);

const rim = new THREE.DirectionalLight(
  0x5e83ff,
  3
);

rim.position.set(4,3,-4);
scene.add(rim);

const warm = new THREE.PointLight(
  0xff9b6b,
  2.2,
  8
);

warm.position.set(-3,2,2);
scene.add(warm);

/* ============================================================
   MATERIALS
   ============================================================ */

function mat(color,rough=.55,metal=0){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal
  });
}

const skin = mat(0xb87857,.72);
const skinDark = mat(0x8c4d38,.8);
const hairMat = mat(0x171311,.72);
const white = mat(0xf0f0ed,.42);
const black = mat(0x090b10,.3);
const shirtMat = mat(0x11151d,.42);
const pantsMat = mat(0x080b11,.7);

/* ============================================================
   AVATAR ROOT
   ============================================================ */

const avatar = new THREE.Group();
avatar.position.y = -1.65;
scene.add(avatar);

const torso = new THREE.Group();
torso.position.y=2.0;
avatar.add(torso);

/* ============================================================
   TORSO
   ============================================================ */

const chestGeo = new THREE.SphereGeometry(1,32,24);
chestGeo.scale(.92,1.08,.52);

const chest = new THREE.Mesh(chestGeo,shirtMat);
chest.castShadow=true;
torso.add(chest);

/* neck */

const neck = new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.31,.5,24),
  skin
);

neck.position.y=1.05;
neck.castShadow=true;
torso.add(neck);

/* ============================================================
   HEAD
   ============================================================ */

const head = new THREE.Group();
head.position.y=3.02;
torso.add(head);

/* skull */

const skullGeo = new THREE.SphereGeometry(1,48,36);
skullGeo.scale(.76,.91,.70);

const skull = new THREE.Mesh(skullGeo,skin);
skull.castShadow=true;
head.add(skull);

/* jaw */

const jaw = new THREE.Group();
jaw.position.set(0,-.24,.03);
head.add(jaw);

const jawGeo = new THREE.SphereGeometry(.67,40,24);
jawGeo.scale(1,.48,.78);

const jawMesh = new THREE.Mesh(jawGeo,skin);
jawMesh.castShadow=true;
jaw.add(jawMesh);

/* ============================================================
   HAIR
   ============================================================ */

const hair = new THREE.Mesh(
  new THREE.SphereGeometry(.78,32,22,0,Math.PI*2,0,Math.PI*.48),
  hairMat
);

hair.scale.set(1.01,1.05,1);
hair.position.y=.28;
head.add(hair);

/* side hair */

for(let side of [-1,1]){
  const h = new THREE.Mesh(
    new THREE.SphereGeometry(.18,18,14),
    hairMat
  );

  h.scale.set(.75,2.3,.8);
  h.position.set(side*.67,.02,-.02);
  head.add(h);
}

/* ============================================================
   EYES
   ============================================================ */

function createEye(side){

  const group = new THREE.Group();

  group.position.set(side*.29,.10,.635);

  const whiteEye = new THREE.Mesh(
    new THREE.SphereGeometry(.115,24,18),
    white
  );

  whiteEye.scale.z=.5;
  group.add(whiteEye);

  const iris = new THREE.Mesh(
    new THREE.SphereGeometry(.055,20,16),
    mat(0x35281d,.3)
  );

  iris.position.z=.075;
  group.add(iris);

  const pupil = new THREE.Mesh(
    new THREE.SphereGeometry(.025,16,12),
    black
  );

  pupil.position.z=.105;
  group.add(pupil);

  const lid = new THREE.Mesh(
    new THREE.SphereGeometry(.13,20,10,0,Math.PI*2,0,Math.PI*.42),
    skin
  );

  lid.scale.set(1.05,.7,.35);
  lid.position.y=.04;
  lid.visible=false;

  group.add(lid);

  head.add(group);

  return {
    group,
    lid,
    iris,
    pupil
  };
}

const eyeL=createEye(-1);
const eyeR=createEye(1);

/* ============================================================
   EYEBROWS
   ============================================================ */

function brow(side){

  const b = new THREE.Mesh(
    new THREE.BoxGeometry(.27,.045,.06),
    hairMat
  );

  b.position.set(side*.29,.29,.63);
  b.rotation.z=side*.12;
  head.add(b);

  return b;
}

const browL=brow(-1);
const browR=brow(1);

/* ============================================================
   NOSE
   ============================================================ */

const nose = new THREE.Mesh(
  new THREE.ConeGeometry(.12,.38,20),
  skinDark
);

nose.rotation.x=Math.PI/2;
nose.position.set(0,.0,.72);
head.add(nose);

/* ============================================================
   MOUTH SYSTEM
   ============================================================ */

const mouth = new THREE.Group();

mouth.position.set(0,-.28,.70);
head.add(mouth);

/* upper lip */

const upperLip = new THREE.Mesh(
  new THREE.SphereGeometry(.17,24,12),
  skinDark
);

upperLip.scale.set(1.4,.35,.32);
upperLip.position.y=.025;
mouth.add(upperLip);

/* lower lip */

const lowerLip = new THREE.Mesh(
  new THREE.SphereGeometry(.18,24,12),
  skinDark
);

lowerLip.scale.set(1.45,.35,.35);
lowerLip.position.y=-.045;
mouth.add(lowerLip);

/* teeth */

const teeth = new THREE.Mesh(
  new THREE.BoxGeometry(.28,.08,.035),
  white
);

teeth.position.z=.045;
teeth.visible=false;
mouth.add(teeth);

/* mouth cavity */

const cavity = new THREE.Mesh(
  new THREE.SphereGeometry(.17,24,16),
  black
);

cavity.scale.set(1.5,.65,.3);
cavity.position.z=.025;
mouth.add(cavity);

/* ============================================================
   SHOULDERS / ARMS
   ============================================================ */

function capsule(length,radius,material){

  const g=new THREE.CapsuleGeometry(
    radius,
    length,
    8,
    16
  );

  const m=new THREE.Mesh(g,material);
  m.castShadow=true;

  return m;
}

function createArm(side){

  const shoulder=new THREE.Group();
  shoulder.position.set(side*.9,2.35,0);
  torso.add(shoulder);

  const upper=capsule(.72,.17,shirtMat);
  upper.position.y=-.38;
  shoulder.add(upper);

  const elbow=new THREE.Group();
  elbow.position.y=-.72;
  shoulder.add(elbow);

  const fore=capsule(.67,.145,skin);
  fore.position.y=-.34;
  elbow.add(fore);

  const hand=new THREE.Mesh(
    new THREE.SphereGeometry(.18,20,16),
    skin
  );

  hand.scale.set(.8,1.15,.7);
  hand.position.y=-.7;
  elbow.add(hand);

  return {
    shoulder,
    elbow,
    hand
  };
}

const leftArm=createArm(-1);
const rightArm=createArm(1);

/* ============================================================
   WAIST + LEGS
   ============================================================ */

const waist=new THREE.Mesh(
  new THREE.CylinderGeometry(.52,.63,.42,28),
  pantsMat
);

waist.position.y=.75;
torso.add(waist);

function leg(side){

  const g=new THREE.Group();
  g.position.set(side*.34,.35,0);
  avatar.add(g);

  const thigh=capsule(.82,.22,pantsMat);
  thigh.position.y=-.48;
  g.add(thigh);

  const shin=capsule(.78,.18,pantsMat);
  shin.position.y=-1.3;
  g.add(shin);

  const shoe=new THREE.Mesh(
    new THREE.SphereGeometry(.22,24,16),
    black
  );

  shoe.scale.set(1.45,.65,1.9);
  shoe.position.set(0,-1.78,.12);
  g.add(shoe);

  return g;
}

const legL=leg(-1);
const legR=leg(1);

/* ============================================================
   GROUND
   ============================================================ */

const ground=new THREE.Mesh(
  new THREE.CircleGeometry(5,64),
  new THREE.MeshStandardMaterial({
    color:0x06080c,
    roughness:.82,
    metalness:.15
  })
);

ground.rotation.x=-Math.PI/2;
ground.position.y=-3.05;
ground.receiveShadow=true;
scene.add(ground);

/* glow ring */

const ring=new THREE.Mesh(
  new THREE.RingGeometry(1.3,1.35,64),
  new THREE.MeshBasicMaterial({
    color:0x315fff,
    transparent:true,
    opacity:.32,
    side:THREE.DoubleSide
  })
);

ring.rotation.x=-Math.PI/2;
ring.position.y=-3.03;
scene.add(ring);

/* ============================================================
   FACE ANIMATION
   ============================================================ */

let speaking=false;
let speechStarted=0;
let speechEnd=0;
let currentText="";
let visemeIndex=0;

let blinkTimer=0;
let nextBlink=2+Math.random()*4;

function blink(){

  eyeL.lid.visible=true;
  eyeR.lid.visible=true;

  setTimeout(()=>{
    eyeL.lid.visible=false;
    eyeR.lid.visible=false;
  },100);
}

/* ============================================================
   VISEMES
   ============================================================ */

function getViseme(ch){

  ch=ch.toLowerCase();

  if("aə".includes(ch)) return "A";
  if("oö".includes(ch)) return "O";
  if("eə".includes(ch)) return "E";
  if("uü".includes(ch)) return "U";
  if("bmp".includes(ch)) return "M";
  if("fv".includes(ch)) return "F";

  return "REST";
}

function applyViseme(v,amount){

  let open=.015;

  if(v==="A") open=.16*amount;
  if(v==="O") open=.13*amount;
  if(v==="E") open=.075*amount;
  if(v==="U") open=.09*amount;
  if(v==="M") open=.015;
  if(v==="F") open=.035*amount;

  jaw.rotation.x=-open*.75;

  upperLip.scale.y=.35+open*.8;
  lowerLip.scale.y=.35+open*.8;

  mouth.scale.x=1+Math.sin(amount*Math.PI)*.04;

  teeth.visible=amount>.35 && open>.04;
}

/* ============================================================
   SPEAKING GESTURES
   ============================================================ */

function animateBody(t){

  const breath=Math.sin(t*1.4)*.018;

  chest.scale.y=1+breath;
  torso.position.y=2+breath;

  if(speaking){

    const wave=Math.sin(t*5.2);

    head.rotation.y=
      Math.sin(t*1.15)*.035;

    head.rotation.z=
      Math.sin(t*.9)*.018;

    leftArm.shoulder.rotation.z=
      -.15 + Math.sin(t*2.1)*.08;

    rightArm.shoulder.rotation.z=
      .15 - Math.sin(t*2.1)*.08;

    leftArm.elbow.rotation.z=
      -.12 + Math.sin(t*3.0)*.12;

    rightArm.elbow.rotation.z=
      .12 - Math.sin(t*2.7)*.15;

    leftArm.hand.rotation.z=
      Math.sin(t*4)*.2;

    rightArm.hand.rotation.z=
      Math.sin(t*4.3)*.2;

    browL.rotation.z=
      -.12+Math.sin(t*2)*.03;

    browR.rotation.z=
      .12-Math.sin(t*2)*.03;

  }else{

    head.rotation.y=
      Math.sin(t*.45)*.025;

    head.rotation.z=
      Math.sin(t*.35)*.01;

    leftArm.shoulder.rotation.z=
      -.15+Math.sin(t*.8)*.015;

    rightArm.shoulder.rotation.z=
      .15-Math.sin(t*.8)*.015;

    leftArm.elbow.rotation.z=-.1;
    rightArm.elbow.rotation.z=.1;
  }
}

/* ============================================================
   SPEECH SYNTHESIS
   ============================================================ */

const input=document.getElementById("textInput");
const speakBtn=document.getElementById("speak");
const subtitle=document.getElementById("subtitle");

let utterance=null;

function chooseVoice(){

  const voices=speechSynthesis.getVoices();

  return voices.find(v=>/az|tr|ru|en/i.test(v.lang))
      || voices[0];
}

function speakText(text){

  if(!text.trim()) return;

  speechSynthesis.cancel();

  currentText=text;

  subtitle.textContent=text;

  utterance=new SpeechSynthesisUtterance(text);

  const voice=chooseVoice();

  if(voice){
    utterance.voice=voice;
    utterance.lang=voice.lang;
  }else{
    utterance.lang="az-AZ";
  }

  utterance.rate=.91;
  utterance.pitch=.92;
  utterance.volume=1;

  utterance.onstart=()=>{

    speaking=true;
    speechStarted=performance.now()/1000;

    startRecording();

    document.getElementById("tapHint")
      .classList.add("hide");
  };

  utterance.onend=()=>{

    speaking=false;
    applyViseme("REST",0);

    setTimeout(()=>{
      if(recorder && recorder.state==="recording"){
        recorder.stop();
      }
    },500);
  };

  utterance.onerror=()=>{

    speaking=false;
    applyViseme("REST",0);
  };

  speechSynthesis.speak(utterance);
}

/* ============================================================
   CLICK
   ============================================================ */

speakBtn.onclick=()=>{

  const text=input.value.trim();

  if(text){
    speakText(text);
  }else{
    speakText(
      "Salam! Mən Virtual Pro adlı süni intellekt avatarıyam. Mən sizin yazdığınız mətnləri danışan animasiya şəklinə çevirə bilirəm."
    );
  }
};

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    speakBtn.click();
  }
});

/* ============================================================
   TAP AVATAR
   ============================================================ */

canvas.addEventListener("pointerup",()=>{

  if(speaking) return;

  const text=input.value.trim();

  if(text){
    speakText(text);
  }else{
    speakText(
      "Salam! Mən hazıram. Aşağıdakı xanaya mətn yazın və mən onu danışan animasiyaya çevirim."
    );
  }
});

/* ============================================================
   RECORDING
   ============================================================ */

let recorder=null;
let chunks=[];
let recordedBlob=null;

function startRecording(){

  if(recorder && recorder.state==="recording") return;

  try{

    const stream=canvas.captureStream(30);

    recorder=new MediaRecorder(
      stream,
      {
        mimeType:
          MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
          ? "video/webm;codecs=vp9"
          : "video/webm"
      }
    );

    chunks=[];

    recorder.ondataavailable=e=>{
      if(e.data.size>0) chunks.push(e.data);
    };

    recorder.onstop=()=>{

      recordedBlob=new Blob(
        chunks,
        {type:"video/webm"}
      );

      document.getElementById("rec")
        .classList.remove("show");
    };

    recorder.start();

    document.getElementById("rec")
      .classList.add("show");

  }catch(e){

    console.log("Recorder:",e);

  }
}

function stopRecording(){

  if(recorder && recorder.state==="recording"){
    recorder.stop();
  }

  speechSynthesis.cancel();
  speaking=false;
}

document.getElementById("recordBtn").onclick=()=>{

  if(speaking){
    stopRecording();
  }else{
    startRecording();
  }

};

document.getElementById("stopBtn").onclick=()=>{
  stopRecording();
};

/* ============================================================
   SHARE
   ============================================================ */

document.getElementById("shareBtn").onclick=async()=>{

  if(!recordedBlob){

    if(currentText){

      const shareText=
        "Virtual Pro AI Avatar\n\n"+
        currentText;

      if(navigator.share){

        await navigator.share({
          title:"Virtual Pro",
          text:shareText
        });

      }else{

        alert(
          "Əvvəlcə avatarı danışdırın və videonu yaradın."
        );

      }

    }else{

      alert(
        "Əvvəlcə avatarı danışdırın."
      );

    }

    return;
  }

  const file=new File(
    [recordedBlob],
    "virtual-pro.webm",
    {type:"video/webm"}
  );

  try{

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){

      await navigator.share({
        title:"Virtual Pro",
        text:"AI Talking Avatar",
        files:[file]
      });

    }else{

      const url=URL.createObjectURL(recordedBlob);

      const a=document.createElement("a");
      a.href=url;
      a.download="virtual-pro.webm";
      a.click();

      setTimeout(()=>{
        URL.revokeObjectURL(url);
      },3000);

      alert(
        "Video telefonunuza yadda saxlanıldı. WhatsApp və digər sosial şəbəkələrdən göndərə bilərsiniz."
      );
    }

  }catch(e){
    console.log(e);
  }
};

/* ============================================================
   FULLSCREEN
   ============================================================ */

document.getElementById("fullscreen").onclick=()=>{

  if(!document.fullscreenElement){

    document.documentElement.requestFullscreen?.();

  }else{

    document.exitFullscreen?.();

  }
};

/* ============================================================
   ANIMATION LOOP
   ============================================================ */

function animate(){

  requestAnimationFrame(animate);

  const t=clock.getElapsedTime();

  animateBody(t);

  /* blinking */

  blinkTimer+=clock.getDelta();

  if(t>nextBlink){

    blink();

    nextBlink=
      t+2.2+Math.random()*4.5;
  }

  /* lipsync approximation */

  if(speaking && currentText){

    const elapsed=
      performance.now()/1000-speechStarted;

    const charRate=.085;

    const index=
      Math.floor(elapsed/charRate);

    const ch=
      currentText[index % currentText.length] || "";

    const v=getViseme(ch);

    const strength=
      .45+
      Math.abs(Math.sin(t*18))*.55;

    applyViseme(v,strength);

  }else{

    applyViseme("REST",0);
  }

  /* subtle camera movement */

  camera.position.x=
    Math.sin(t*.18)*.035;

  camera.position.y=
    1.75+
    Math.sin(t*.42)*.012;

  camera.lookAt(
    0,
    .85,
    0
  );

  ring.material.opacity=
    .22+
    Math.sin(t*1.7)*.06;

  renderer.render(scene,camera);
}

animate();

/* ============================================================
   RESIZE
   ============================================================ */

addEventListener("resize",()=>{

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

});

/* ============================================================
   LOAD VOICES
   ============================================================ */

speechSynthesis.onvoiceschanged=()=>{
  speechSynthesis.getVoices();
};

</script>
