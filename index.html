<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA - Müasir Musiqi & Video Platforması</title>
  <!-- Lucide İkonlar Kitabxanası -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(23, 31, 50, 0.7);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
    }

    .logo i { color: var(--accent); }

    .admin-btn {
      background: var(--border);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      transition: 0.2s;
    }

    .admin-btn:hover { background: rgba(255, 255, 255, 0.15); }

    /* Əsas Məzmun */
    main {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 24px;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 16px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: 0.2s;
    }

    .card:hover .play-overlay { opacity: 1; }

    .play-btn-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-artist {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Aşağı Sabit Pleyer Barı */
    .mini-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: rgba(15, 22, 36, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      cursor: pointer;
    }

    .mini-info {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 30%;
    }

    .mini-img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }

    .mini-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .control-btn:hover { color: var(--accent); }

    .play-main {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 50%;
      color: white !important;
    }

    /* Modal (Yarı Ekran Pleyer) */
    .player-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .player-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg-main);
      width: 100%;
      max-width: 650px;
      height: 85vh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 24px;
    }

    .player-modal.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .media-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    .media-container media-element, video, img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Proqres Barlari */
    .progress-area {
      width: 100%;
      margin: 15px 0;
    }

    .progress-bar {
      height: 6px;
      width: 100%;
      background: var(--border);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 10px;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Şərh & Bəyənmə Paneli */
    .action-bar {
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .action-btn.active { color: #ef4444; }

    .comments-section {
      flex: 1;
    }

    .comment-input-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .comment-input-wrap input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      outline: none;
    }

    .comment-input-wrap button {
      background: var(--accent);
      border: none;
      color: white;
      padding: 0 16px;
      border-radius: 12px;
      cursor: pointer;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-item {
      background: var(--bg-card);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
    }

    .comment-user {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 2px;
    }

    /* Admin Modal */
    .admin-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .admin-form {
      background: var(--bg-main);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .admin-form input, .admin-form select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      color: var(--text);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i data-lucide="disc-3"></i> AURA MUSIC
    </div>
    <button class="admin-btn" onclick="openAdmin()">
      <i data-lucide="shield-check"></i> Admin Paneli
    </button>
  </header>

  <main>
    <div class="section-title"><i data-lucide="music"></i> Audio Treklər</div>
    <div class="grid" id="audio-grid"></div>

    <div class="section-title"><i data-lucide="video"></i> Video Kliplər</div>
    <div class="grid" id="video-grid"></div>
  </main>

  <!-- Sabit Aşağı Mini Pleyer -->
  <div class="mini-player" id="mini-player" onclick="openFullPlayer()">
    <div class="mini-info">
      <img id="mini-img" src="" class="mini-img" alt="">
      <div>
        <div id="mini-title" class="card-title">Mahnı seçilməyib</div>
        <div id="mini-artist" class="card-artist">-</div>
      </div>
    </div>
    <div class="mini-controls" onclick="event.stopPropagation()">
      <button class="control-btn" onclick="prevTrack()"><i data-lucide="skip-back"></i></button>
      <button class="control-btn play-main" onclick="togglePlay()"><i data-lucide="play" id="mini-play-icon"></i></button>
      <button class="control-btn" onclick="nextTrack()"><i data-lucide="skip-forward"></i></button>
    </div>
  </div>

  <!-- Yarı Ekran Əsas Pleyer Modalı -->
  <div class="player-modal" id="player-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span style="font-weight: 600; color: var(--text-muted)">İNDİ OXUNUR</span>
        <button class="control-btn" onclick="closeFullPlayer()"><i data-lucide="chevron-down"></i></button>
      </div>

      <div class="media-container" id="media-wrap">
        <!-- İnteqrasiya edilmiş Media kontenti (Audio Şəkli və ya Video) -->
      </div>

      <div style="text-align: center; margin-bottom: 10px;">
        <h2 id="modal-title">-</h2>
        <p id="modal-artist" style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">-</p>
      </div>

      <!-- Proqres Bar & Vaxt -->
      <div class="progress-area">
        <div class="progress-bar" onclick="seek(event)">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-stamps">
          <span id="curr-time">0:00</span>
          <span id="dur-time">0:00</span>
        </div>
      </div>

      <!-- İdarəetmə Düymələri -->
      <div class="mini-controls" style="justify-content: center; gap: 24px; margin-bottom: 20px;">
        <button class="control-btn" onclick="rewind(10)"><i data-lucide="rotate-ccw"></i></button>
        <button class="control-btn" onclick="prevTrack()"><i data-lucide="skip-back"></i></button>
        <button class="control-btn play-main" style="width: 56px; height: 56px;" onclick="togglePlay()"><i data-lucide="play" id="modal-play-icon"></i></button>
        <button class="control-btn" onclick="nextTrack()"><i data-lucide="skip-forward"></i></button>
        <button class="control-btn" onclick="forward(10)"><i data-lucide="rotate-cw"></i></button>
      </div>

      <!-- Interaktiv Bölmə -->
      <div class="action-bar">
        <button class="action-btn" id="like-btn" onclick="toggleLike()">
          <i data-lucide="heart"></i> <span id="like-count">0</span>
        </button>
        <button class="action-btn" onclick="shareTrack()">
          <i data-lucide="share-2"></i> Paylaş
        </button>
      </div>

      <!-- Şərh Bölməsi -->
      <div class="comments-section">
        <div class="comment-input-wrap">
          <input type="text" id="comment-input" placeholder="Fikrini bildir...">
          <button onclick="addComment()">Yaz</button>
        </div>
        <div class="comment-list" id="comment-list"></div>
      </div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="admin-modal" id="admin-modal">
    <div class="admin-form">
      <h3>Yeni Məzmun Əlavə Et</h3>
      <input type="text" id="adm-title" placeholder="Başlıq">
      <input type="text" id="adm-artist" placeholder="İfaçı">
      <select id="adm-type">
        <option value="audio">Audio (MP3)</option>
        <option value="video">Video (MP4)</option>
      </select>
      <input type="text" id="adm-url" placeholder="Media URL (.mp3 / .mp4)">
      <input type="text" id="adm-cover" placeholder="Örtük Şəkli URL">
      <button class="action-btn" style="background: var(--accent); color:white; justify-content:center; padding:10px;" onclick="saveMedia()">Əlavə Et</button>
      <button class="action-btn" style="justify-content:center;" onclick="closeAdmin()">Bağla</button>
    </div>
  </div>

  <audio id="main-audio"></audio>

  <script>
    // Initial 10 Simulyasiya Mediası
    let playlist = [
      { id: 1, title: "Denize Su Döktüm", artist: "Şamxal", type: "audio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", cover: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500", likes: 142, comments: ["Möhtəşəm bəstədir!", "Səsi çox dərindir."] },
      { id: 2, title: "Xəzər Küleyi", artist: "Aura Band", type: "audio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", cover: "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=500", likes: 89, comments: ["Bunu çox bəyəndim."] },
      { id: 3, title: "Gecə Fısıltısı", artist: "Röya & Dəniz", type: "audio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500", likes: 210, comments: [] },
      { id: 4, title: "Sonsuz Yol", artist: "Kamran", type: "audio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500", likes: 45, comments: [] },
      { id: 5, title: "Sakitlik", artist: "Nigar", type: "audio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", cover: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=500", likes: 78, comments: [] },
      { id: 6, title: "Dəniz Dalğaları Canlı", artist: "Studio Live", type: "video", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", cover: "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=500", likes: 320, comments: ["Görüntü əladır."] },
      { id: 7, title: "Acoustic Session Klip", artist: "Şamxal", type: "video", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4", cover: "https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=500", likes: 195, comments: [] },
      { id: 8, title: "Bakı Gecələri Visualizer", artist: "Aura", type: "video", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500", likes: 512, comments: [] },
      { id: 9, title: "Instrumental Mood", artist: "Orxan", type: "video", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4", cover: "https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=500", likes: 88, comments: [] },
      { id: 10, title: "Sunset Waves", artist: "Nature Sounds", type: "video", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyances.mp4", cover: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500", likes: 640, comments: [] }
    ];

    let currentIndex = -1;
    let isPlaying = false;
    const audio = document.getElementById('main-audio');

    // UI Render olunması
    function render() {
      const audioGrid = document.getElementById('audio-grid');
      const videoGrid = document.getElementById('video-grid');
      audioGrid.innerHTML = '';
      videoGrid.innerHTML = '';

      playlist.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => playTrack(index);

        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${item.cover}" alt="${item.title}">
            <div class="card-badge"><i data-lucide="${item.type === 'video' ? 'video' : 'music'}"></i> ${item.type.toUpperCase()}</div>
            <div class="play-overlay">
              <div class="play-btn-circle"><i data-lucide="play"></i></div>
            </div>
          </div>
          <div class="card-title">${item.title}</div>
          <div class="card-artist">${item.artist}</div>
        `;

        if (item.type === 'audio') audioGrid.appendChild(card);
        else videoGrid.appendChild(card);
      });
      lucide.createIcons();
    }

    function playTrack(index) {
      currentIndex = index;
      const track = playlist[currentIndex];
      isPlaying = true;

      // Mini player update
      document.getElementById('mini-title').innerText = track.title;
      document.getElementById('mini-artist').innerText = track.artist;
      document.getElementById('mini-img').src = track.cover;

      // Modal player update
      document.getElementById('modal-title').innerText = track.title;
      document.getElementById('modal-artist').innerText = track.artist;
      document.getElementById('like-count').innerText = track.likes;

      const mediaWrap = document.getElementById('media-wrap');
      mediaWrap.innerHTML = '';

      if (track.type === 'video') {
        audio.pause();
        mediaWrap.innerHTML = `<video id="active-video" src="${track.url}" controls style="width:100%; height:100%;"></video>`;
        const video = document.getElementById('active-video');
        video.play();
        video.onended = () => nextTrack();
      } else {
        mediaWrap.innerHTML = `<img src="${track.cover}" style="width:100%; height:100%; object-fit:cover;">`;
        audio.src = track.url;
        audio.play();
      }

      updatePlayIcons(true);
      renderComments();
    }

    function togglePlay() {
      if (currentIndex === -1) return playTrack(0);
      const track = playlist[currentIndex];

      if (track.type === 'video') {
        const video = document.getElementById('active-video');
        if (video) {
          if (video.paused) { video.play(); isPlaying = true; }
          else { video.pause(); isPlaying = false; }
        }
      } else {
        if (audio.paused) { audio.play(); isPlaying = true; }
        else { audio.pause(); isPlaying = false; }
      }
      updatePlayIcons(isPlaying);
    }

    function updatePlayIcons(playing) {
      const icon = playing ? 'pause' : 'play';
      document.getElementById('mini-play-icon').setAttribute('data-lucide', icon);
      document.getElementById('modal-play-icon').setAttribute('data-lucide', icon);
      lucide.createIcons();
    }

    function nextTrack() {
      if (currentIndex < playlist.length - 1) playTrack(currentIndex + 1);
      else playTrack(0);
    }

    function prevTrack() {
      if (currentIndex > 0) playTrack(currentIndex - 1);
    }

    function rewind(sec) {
      if (playlist[currentIndex]?.type === 'audio') audio.currentTime -= sec;
    }

    function forward(sec) {
      if (playlist[currentIndex]?.type === 'audio') audio.currentTime += sec;
    }

    audio.ontimeupdate = () => {
      if (playlist[currentIndex]?.type === 'audio') {
        const perc = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progress-fill').style.width = (perc || 0) + '%';
        document.getElementById('curr-time').innerText = formatTime(audio.currentTime);
        document.getElementById('dur-time').innerText = formatTime(audio.duration || 0);
      }
    };

    audio.onended = () => nextTrack();

    function formatTime(sec) {
      let m = Math.floor(sec / 60);
      let s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function seek(e) {
      if (playlist[currentIndex]?.type === 'audio') {
        const bar = e.currentTarget;
        const clickX = e.offsetX;
        const width = bar.clientWidth;
        audio.currentTime = (clickX / width) * audio.duration;
      }
    }

    // Modal aç/bağla
    function openFullPlayer() { document.getElementById('player-modal').classList.add('active'); }
    function closeFullPlayer() { document.getElementById('player-modal').classList.remove('active'); }

    // Interaktivlik
    function toggleLike() {
      if (currentIndex === -1) return;
      playlist[currentIndex].likes++;
      document.getElementById('like-count').innerText = playlist[currentIndex].likes;
    }

    function shareTrack() {
      if (currentIndex === -1) return;
      const track = playlist[currentIndex];
      const shareUrl = `${window.location.href}?track=${track.id}`;
      navigator.clipboard.writeText(`Dinlə: "${track.title} - ${track.artist}" yerləşdiyi sayt: ${shareUrl}`);
      alert("Keçid kopyalandı! Artıq birbaşa daxil olub dinləyə bilərlər.");
    }

    function renderComments() {
      const list = document.getElementById('comment-list');
      list.innerHTML = '';
      if (currentIndex === -1) return;

      playlist[currentIndex].comments.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `<div class="comment-user">Qonaq</div><div>${c}</div>`;
        list.appendChild(item);
      });
    }

    function addComment() {
      const input = document.getElementById('comment-input');
      if (!input.value.trim() || currentIndex === -1) return;
      playlist[currentIndex].comments.push(input.value.trim());
      input.value = '';
      renderComments();
    }

    // Admin bölməsi
    function openAdmin() {
      const pass = prompt("Admin Şifrəsini Daxil Edin:");
      if (pass === "1234") document.getElementById('admin-modal').style.display = 'flex';
      else alert("Yanlış Şifrə!");
    }

    function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }

    function saveMedia() {
      const title = document.getElementById('adm-title').value;
      const artist = document.getElementById('adm-artist').value;
      const type = document.getElementById('adm-type').value;
      const url = document.getElementById('adm-url').value;
      const cover = document.getElementById('adm-cover').value || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500';

      if (!title || !url) return alert("Məlumatları tam doldurun!");

      playlist.unshift({
        id: Date.now(),
        title, artist, type, url, cover, likes: 0, comments: []
      });

      render();
      closeAdmin();
      alert("Yeni media əlavə olundu!");
    }

    // İlkin yükləmə
    render();
    lucide.createIcons();
  </script>
</body>
</html>
