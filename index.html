function openDB(){

}

 const ms=x.media||[],av=safeMedia(x.av)||`data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#222"/><text x="100" y="125" text-anchor="middle" font-size="90" fill="white">${esc((x.name||"G").charAt(0))}</text></svg>`)}`;
 const slides=ms.length?ms.map(m=>`<div class="media-slide">${mediaHtml(m)}</div>`).join(""):`<div class="media-slide"><div class="media-placeholder"><i data-lucide="image-off"></i><strong>${esc(t("media_missing"))}</strong></div></div>`;
 return `<article class="feed-item" data-id="${esc(x.id)}">
 <div class="media-scroll" data-scroll="${esc(x.id)}">${slides}</div><div class="top-gradient"></div><div class="gradient"></div>
 ${ms.length>1?`<div class="dots">${ms.map((_,i)=>`<span class="dot ${i?"":"active"}"></span>`).join("")}</div>`:""}
 <button class="sound" data-sound="${esc(x.id)}" type="button"><i data-lucide="${state.mute?"volume-x":"volume-2"}"></i></button>
 <div class="info"><div class="author"><img class="avatar" src="${av}" alt=""><button class="author-name" data-profile="${esc(x.u)}" type="button">${esc(x.name)}</button><span style="color:#aaa;font-size:12px">· ${esc(timeAgo(x.ts))}</span></div>
 <h2 class="title">${esc(x.item)}</h2><div class="want">${esc(t("wants"))}: ${esc(x.want)}</div>${x.desc?`<p class="desc">${esc(x.desc)}</p>`:""}<div class="tags">${(x.tags||[]).slice(0,8).map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</div></div>
 <div class="actions"><button class="action ${liked(x.id)?"liked":""}" data-like="${esc(x.id)}" type="button"><i data-lucide="heart"></i><span class="count">${count(x.likes)}</span></button>
 <button class="action" data-comment="${esc(x.id)}" type="button"><i data-lucide="message-circle"></i><span class="count">${commentsCount(x.id)}</span></button>
 <button class="action ${fav(x.id)?"fav":""}" data-fav="${esc(x.id)}" type="button"><i data-lucide="star"></i></button>
 <button class="action" data-share="${esc(x.id)}" type="button"><i data-lucide="share-2"></i></button></div></article>`
}
function render(){
 document.querySelectorAll("[data-i18n]").forEach(x=>x.textContent=t(x.dataset.i18n));document.querySelectorAll("[data-i18n-placeholder]").forEach(x=>x.placeholder=t(x.dataset.i18nPlaceholder));
 document.querySelectorAll(".lang-btn").forEach(x=>x.classList.toggle("active",x.dataset.lang===lang));updateStatus();
 if(state.mode==="explore"){show("explore");renderExplore();return}
 if(state.mode==="profile"){show("profile");return}
 show("feed");
 let arr=state.feed;if(state.mode==="favorites")arr=arr.filter(x=>fav(x.id));if(state.filter)arr=arr.filter(x=>searchable(x).includes(norm(state.filter)));
 $("feed").innerHTML=arr.length?arr.map(renderItem).join(""):`<div class="feed-item"><div class="media-placeholder"><i data-lucide="package-open"></i><strong>${esc(state.filter?t("no_results"):t("first_ad"))}</strong></div></div>`;
 icons();bindFeed();initSeeder();arr.forEach(async x=>{await ensureMediaSrc(x);refreshItem(x)});updateWA()
}
function refreshItem(x){const r=document.querySelector(`[data-id="${CSS.escape(x.id)}"]`);if(!r)return;const s=r.querySelector(`[data-scroll="${CSS.escape(x.id)}"]`);if(!s)return;s.innerHTML=(x.media||[]).map(m=>`<div class="media-slide">${mediaHtml(m)}</div>`).join("");icons();applyVideos(r)}
function show(id){$("feed").style.display=id==="feed"?"block":"none";$("explore").style.display=id==="explore"?"block":"none";$("profile").style.display=id==="profile"?"block":"none";["navHome","navExplore","navFav","navProfile"].forEach(a=>$(a)?.classList.remove("active"));if(id==="feed")$("navHome").classList.add("active");if(id==="explore")$("navExplore").classList.add("active");if(state.mode==="favorites")$("navFav").classList.add("active");if(id==="profile")$("navProfile").classList.add("active")}

function bindFeed(){
 document.querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));
 document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));
 document.querySelectorAll("[data-comment]").forEach(b=>b.onclick=()=>openComments(b.dataset.comment));
 document.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>shareItem(b.dataset.share));
 document.querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>openProfile(b.dataset.profile));
 document.querySelectorAll("[data-sound]").forEach(b=>b.onclick=()=>toggleSound());
 document.querySelectorAll(".media-scroll").forEach(s=>s.onscroll=()=>{const r=s.closest(".feed-item"),i=Math.round(s.scrollLeft/Math.max(1,s.clientWidth));r.querySelectorAll(".dot").forEach((d,n)=>d.classList.toggle("active",n===i))});
 applyVideos();updateWA()
}
function applyVideos(root=document){root.querySelectorAll("video").forEach(v=>{v.muted=state.mute;const p=v.play();p?.catch(()=>{})})}
function toggleSound(){state.mute=!state.mute;applyVideos();render()}
function toggleLike(id){const x=state.feed.find(a=>a.id===id);if(!x)return;const i=state.likes.indexOf(id);if(i>=0){state.likes.splice(i,1);x.likes=Math.max(0,x.likes-1)}else{state.likes.push(id);x.likes++;}persist(x);render()}
function toggleFav(id){const i=state.favs.indexOf(id);if(i>=0)state.favs.splice(i,1);else state.favs.push(id);saveLocal();render()}

function updateWA(){
 const b=$("waFloat");if(state.mode!=="home"||!b)return b?.classList.add("hidden");
 const els=[...document.querySelectorAll(".feed-item")];if(!els.length)return b.classList.add("hidden");
 const center=$("feed").scrollTop+$("feed").clientHeight/2;let best=els[0],d=Infinity;
 els.forEach(e=>{const q=Math.abs(e.offsetTop+e.offsetHeight/2-center);if(q<d){d=q;best=e}});
 const x=state.feed.find(a=>a.id===best.dataset.id);const u=x&&waUrl(x);if(!u)return b.classList.add("hidden");b.href=u;b.classList.remove("hidden")
}
$("feed").addEventListener("scroll",()=>{updateWA();applyVisibleVideos()},{passive:true});
function applyVisibleVideos(){document.querySelectorAll("#feed video").forEach(v=>{const r=v.getBoundingClientRect(),ok=r.top<innerHeight*.78&&r.bottom>innerHeight*.22;if(ok){v.muted=state.mute;v.play()?.catch(()=>{})}else v.pause()})}

function renderExplore(){
 $("exploreGrid").innerHTML=state.feed.map(x=>{const m=x.media?.[0],s=safeMedia(m?.src||m?.dataUrl);return `<button class="cell" data-open="${esc(x.id)}" type="button">${s?(video(m)?`<video src="${s}" muted playsinline preload="metadata"></video><i class="video-icon" data-lucide="play"></i>`:`<img src="${s}" alt="">`):`<div class="media-placeholder"><i data-lucide="image-off"></i></div>`}</button>`}).join("")||`<div style="grid-column:1/-1;padding:50px;text-align:center;color:#777">${esc(t("no_results"))}</div>`;
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openItemInFeed(b.dataset.open));icons();state.feed.forEach(async x=>{await ensureMediaSrc(x)})
}
function openItemInFeed(id){state.mode="home";state.filter="";render();history.replaceState(null,"",`#item=${encodeURIComponent(id)}`);requestAnimationFrame(()=>document.querySelector(`[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({block:"start",behavior:"instant"}))}
function handleHash(){const m=location.hash.match(/^#item=(.+)$/);if(m)openItemInFeed(decodeURIComponent(m[1]))}

function searchable(x){return norm([x.brand,x.size,...(x.tags||[]),x.name,x.item,x.want,x.desc,x.wa].join(" "))}
function search(q){state.filter=q.trim();state.mode="home";renderSearchResults(state.feed.filter(x=>searchable(x).includes(norm(q))))}
function renderSearchResults(a){$("searchResults").innerHTML=a.length?a.map(x=>{const m=x.media?.[0],s=safeMedia(m?.src||m?.dataUrl);return `<button class="search-result" data-open="${esc(x.id)}" type="button"><div class="thumb">${s?(video(m)?`<video src="${s}" muted></video>`:`<img src="${s}" alt="">`):""}</div><div><strong>${esc(x.item)}</strong><div style="color:#999">${esc(x.name)}</div><div style="color:#777">${esc(x.brand)} ${esc(x.size)}</div></div></button>`}).join(""):`<div style="padding:50px;text-align:center;color:#777">${esc(t("no_results"))}</div>`;document.querySelectorAll(".search-results [data-open]").forEach(b=>b.onclick=()=>{$("search").classList.remove("open");openItemInFeed(b.dataset.open)});icons()}

function openProfile(uid){const a=state.feed.filter(x=>x.u===uid);if(!a.length)return;state.mode="profile";show("profile");const x=a[0];$("profile").innerHTML=`<div class="profile-top"><img class="big-avatar" src="${safeMedia(x.av)||'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='}"><div class="profile-name">${esc(x.name)}</div><a class="profile-wa" href="${waUrl(x)}" target="_blank">${esc(x.wa)}</a><div style="color:#888;margin-top:5px">${a.length} ${esc(t("items"))}</div></div><div class="profile-grid">${a.map(y=>{const m=y.media?.[0],s=safeMedia(m?.src||m?.dataUrl);return `<button class="profile-cell" data-open="${esc(y.id)}" type="button">${s?(video(m)?`<video src="${s}" muted></video>`:`<img src="${s}" alt="">`):`<div class="media-placeholder"><i data-lucide="image-off"></i></div>`}</button>`}).join("")}</div>`;document.querySelectorAll("#profile [data-open]").forEach(b=>b.onclick=()=>openItemInFeed(b.dataset.open));icons()}

function ownProfile(){if(!state.profile){openUpload();return}const a=state.feed.filter(x=>x.u===state.profile.u);if(a.length)return openProfile(state.profile.u);state.mode="profile";show("profile");$("profile").innerHTML=`<div class="profile-top"><img class="big-avatar" src="${safeMedia(state.profile.av)||'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='}"><div class="profile-name">${esc(state.profile.name)}</div><a class="profile-wa" href="${waUrl(state.profile)}" target="_blank">${esc(state.profile.wa||"")}</a></div>`}

function openComments(id){state.commentId=id;$("commentBackdrop").classList.add("open");$("comments").classList.add("open");renderComments()}
function closeComments(){state.commentId=null;$("commentBackdrop").classList.remove("open");$("comments").classList.remove("open")}
function ensureCommentProfile(){if(state.profile?.name)return true;const n=prompt(t("enter_name"));if(!n?.trim())return false;state.profile={u:uid("user"),name:n.trim(),av:"",wa:""};saveLocal();return true}
function renderComments(){const a=state.comments[state.commentId]||[];$("commentList").innerHTML=a.length?a.map((c,i)=>`<div class="comment-row"><img class="comment-avatar" src="${safeMedia(c.av)||'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='}"><div class="comment-body"><div class="comment-author">${esc(c.name)}</div><div class="comment-text">${esc(c.text)}</div><div class="comment-meta">${esc(timeAgo(c.ts))} · <button data-reply="${i}" style="background:none;color:#aaa;padding:0">${esc(t("reply"))}</button></div>${(c.replies||[]).map(r=>`<div class="comment-row"><img class="comment-avatar" src="${safeMedia(r.av)||'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='}"><div class="comment-body"><div class="comment-author">${esc(r.name)}</div><div class="comment-text">${esc(r.text)}</div></div></div>`).join("")}</div></div>`).join(""):`<div style="padding:40px;text-align:center;color:#777">${esc(t("no_comments"))}</div>`;document.querySelectorAll("[data-reply]").forEach(b=>b.onclick=()=>reply(Number(b.dataset.reply)))}
function sendComment(){const text=$("commentInput").value.trim();if(!text||!state.commentId)return;if(!ensureCommentProfile())return;(state.comments[state.commentId]??=[]).push({u:state.profile.u,av:state.profile.av||"",name:state.profile.name,text,ts:Date.now(),replies:[]});$("commentInput").value="";saveLocal();renderComments()}
function reply(i){if(!ensureCommentProfile())return;const text=prompt(t("reply"));if(!text?.trim())return;const c=state.comments[state.commentId]?.[i];if(!c)return;(c.replies??=[]).push({u:state.profile.u,av:state.profile.av||"",name:state.profile.name,text:text.trim(),ts:Date.now()});saveLocal();renderComments()}

async function shareItem(id){const x=state.feed.find(a=>a.id===id);if(!x)return;const url=`${location.origin}${location.pathname}#item=${encodeURIComponent(id)}`;try{if(navigator.share)return await navigator.share({title:`GeyimDəyiş — ${x.item}`,text:x.want,url});await navigator.clipboard.writeText(url);toast(t("copied_link"))}catch(e){try{await navigator.clipboard.writeText(url);toast(t("copied_link"))}catch(_){toast(t("copied"))}}}

function openDrawer(){$("drawer").classList.add("open");$("drawerBackdrop").classList.add("open")}
function closeDrawer(){$("drawer").classList.remove("open");$("drawerBackdrop").classList.remove("open")}
const info={
 about:["about",`<p>GeyimDəyiş P2P Pro istifadəçilərin geyim və əşyaları birbaşa barter etməsi üçün brauzer əsaslı P2P platformadır.</p><h3>${t("no_central_server")}</h3><p>Məlumatların bir hissəsi brauzerdə, IndexedDB-də və Gun relay/peer şəbəkəsində saxlanır.</p><h3>${t("intermediary")}</h3><p>Platforma istifadəçilər arasında texniki vasitəçidir; barter müqaviləsinin tərəfi deyil.</p>`],
 how:["how_to_use",`<ol><li>Ana səhifədə şaquli sürüşdür.</li><li>Sağ düymələrdən bəyənmə, şərh, favorit və paylaş istifadə et.</li><li>WhatsApp ilə elan sahibinə yaz.</li><li>+ düyməsi ilə profil məlumatlarını və media fayllarını daxil et.</li><li>Kəşf bölməsində grid görünüşündən istifadə et.</li><li>Profil adına toxunaraq digər elanlara bax.</li></ol>`],
 privacy:["privacy",`<h3>Məlumat modeli</h3><p>Mərkəzi marketplace bazası yoxdur. Məlumat brauzerdə + Gun relay/peers üzərindən replikasiya oluna bilər.</p><h3>Telefon</h3><p>WhatsApp nömrəsi digər istifadəçilərə görünə bilər; satış/reklam məqsədilə kommersiyalaşdırılmır.</p><h3>Silinmə</h3><p>${t("right_delete")} ${t("replicated_copies")} Replikasiya olunmuş nüsxələr təxminən 24–72 saat və ya daha uzun müddət qala bilər.</p><h3>Hüquqi çərçivə</h3><p>İstifadəçi yerləşdirdiyi məzmun və əşyaya görə məsuldur. Azərbaycan Respublikasının Mülki Məcəlləsinin 1096-cı maddəsi və informasiya qanunvericiliyi nəzərə alınmalıdır.</p><h3>${t("user_responsibility")||"İstifadəçi məsuliyyəti"}</h3><p>${t("fake_stolen_illegal")}</p>`],
 terms:["terms",`<h3>${t("prohibited")}</h3><ul><li>Saxta, oğurlanmış və qanunsuz məhsullar.</li><li>Fırıldaqçılıq və kimliyin saxtalaşdırılması.</li><li>Müəllif hüququnu pozan material.</li><li>Təhdid, təqib və qanunsuz davranış.</li></ul><h3>${t("safety")}</h3><p>İctimai yerdə görüşmək və məhsulu fiziki yoxlamaq tövsiyə olunur.</p><h3>P2P məhdudiyyəti</h3><p>Peer/relay əlçatanlığı, gecikmə və replikasiya platformadan kənar infrastrukturdan asılı ola bilər.</p><h3>${t("copyright")}</h3><p>İstifadəçi paylaşdığı mediaya hüququ olduğunu təsdiq edir.</p><h3>${t("age_limit")}</h3><p>Minimum yaş 16-dır.</p>`]
};
function openInfo(k){$("infoTitle").textContent=t(info[k][0]);$("infoBody").innerHTML=info[k][1];$("infoModal").classList.add("open");closeDrawer();icons()}

function openUpload(){$("uploadModal").classList.add("open");icons()}
function resetUpload(){state.selected.forEach(x=>{if(blobUrl(x.previewUrl))try{URL.revokeObjectURL(x.previewUrl)}catch(e){}});state.selected=[];$("uploadForm").reset();$("selectedGrid").innerHTML=""}
function parseTags(v){return String(v||"").split(/[,\s]+/).filter(Boolean).map(x=>x.startsWith("#")?x:"#"+x).slice(0,30)}
async function avatarData(f){return f?compress(f,400,.78):""}
function addFiles(list,type){[...(list||[])].forEach(f=>{if(f.size>APP.max){alert(t("file_too_large"));return}state.selected.push({file:f,previewUrl:URL.createObjectURL(f),type})});renderSelected()}
function renderSelected(){$("selectedGrid").innerHTML=state.selected.map((x,i)=>`<div class="selected-item">${x.type==="video"?`<video src="${x.previewUrl}" muted></video>`:`<img src="${x.previewUrl}" alt="">`}<button class="remove" type="button" data-remove="${i}"><i data-lucide="x"></i></button></div>`).join("");icons()}
async function publishItem(){
 const name=$("nameIn")?.value.trim(),item=$("itemIn")?.value.trim(),want=$("wantIn")?.value.trim(),wa=$("waIn")?.value.trim();
 if(!name){alert(t("enter_name"));return}if(!item){alert(t("enter_item"));return}if(!wa){alert(t("enter_wa"));return}if(!state.selected.length){alert(t("add_at_least_one_media"));return}
 if(wa.replace(/\D/g,"").length<8){alert(t("invalid_phone"));return}
 const btn=$("publishSubmit");try{
  btn.disabled=true;
  const avFile=$("avIn")?.files?.[0],av=avFile?await avatarData(avFile):(state.profile?.av||"");
  state.profile={u:state.profile?.u||uid("user"),av,name,wa};localStorage.setItem(APP.profileKey,JSON.stringify(state.profile));
  const media=[];for(const x of state.selected)media.push(await mediaToRecord(x));
  const x=normalizeItem({id:uid("item"),u:state.profile.u,av,name,item,want,wa,brand:$("brandIn").value.trim(),size:$("sizeIn").value.trim(),desc:$("descIn").value.trim(),tags:parseTags($("tagsIn").value),media,ts:Date.now(),likes:0});
  state.feed.unshift(x);persist(x);closeModal("uploadModal");resetUpload();state.mode="home";state.filter="";render();$("feed").scrollTo({top:0,behavior:"instant"});toast(t("published"))
 }catch(e){console.error(e);alert(e.message||"Publish failed")}finally{btn.disabled=false;btn.textContent=t("send_to_p2p")}
}
function closeModal(id){$(id)?.classList.remove("open")}

function bind(){
 $("menuBtn").onclick=openDrawer;$("drawerClose").onclick=closeDrawer;$("drawerBackdrop").onclick=closeDrawer;
 $("searchOpen").onclick=()=>{$("search").classList.add("open");$("searchInput").focus()};$("searchClose").onclick=()=>{$("search").classList.remove("open")};
 $("searchForm").onsubmit=e=>{e.preventDefault();search($("searchInput").value)};$("searchInput").oninput=()=>search($("searchInput").value);
 $("navHome").onclick=()=>{state.mode="home";state.filter="";render()};$("navExplore").onclick=()=>{state.mode="explore";state.filter="";render()};$("navFav").onclick=()=>{state.mode="favorites";state.filter="";render()};$("navProfile").onclick=ownProfile;
 $("publishBtn")?.addEventListener("click",e=>{e.preventDefault();publishItem()});
 $("uploadForm").onsubmit=e=>{e.preventDefault();publishItem()};
 $("imgIn").onchange=e=>{addFiles(e.target.files,"image");e.target.value=""};$("vidIn").onchange=e=>{addFiles(e.target.files,"video");e.target.value=""};
 $("selectedGrid").onclick=e=>{const b=e.target.closest("[data-remove]");if(!b)return;const i=+b.dataset.remove,x=state.selected[i];if(x&&blobUrl(x.previewUrl))URL.revokeObjectURL(x.previewUrl);state.selected.splice(i,1);renderSelected()};
 $("commentForm").onsubmit=e=>{e.preventDefault();sendComment()};$("commentClose").onclick=closeComments;$("commentBackdrop").onclick=closeComments;
 document.querySelectorAll(".lang-btn").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
 document.querySelectorAll("[data-info]").forEach(b=>b.onclick=()=>openInfo(b.dataset.info));
 document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
 document.querySelectorAll(".modal-bg").forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove("open")});
 addEventListener("online",updateStatus);addEventListener("offline",updateStatus);addEventListener("hashchange",handleHash);
 document.addEventListener("visibilitychange",()=>{if(document.hidden)document.querySelectorAll("video").forEach(v=>v.pause());else applyVideos()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();closeComments();$("search").classList.remove("open");document.querySelectorAll(".modal-bg.open").forEach(x=>x.classList.remove("open"))}})
}

function boot(){
 document.documentElement.lang=lang;document.querySelectorAll("[data-i18n]").forEach(x=>x.textContent=t(x.dataset.i18n));document.querySelectorAll("[data-i18n-placeholder]").forEach(x=>x.placeholder=t(x.dataset.i18nPlaceholder));document.querySelectorAll(".lang-btn").forEach(x=>x.classList.toggle("active",x.dataset.lang===lang));
 loadLocal();state.mode="home";render();bind();icons();initGun();updateStatus();handleHash()
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else boot();
</script>
