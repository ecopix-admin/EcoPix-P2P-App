<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UstaMap — Xəritə Üzrə Canlı Usta və Texnika Elanları</title>
    
    <!-- Leaflet CSS (Açıq Qaynaqlı Xəritə Kitabxanası) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome İkonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* Xəritə Konteyneri */
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Üst Axtarış və Filter Paneli */
        .top-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .filter-tags {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tag-btn {
            background: #f0f2f5;
            border: 1px solid #dcdfe6;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tag-btn.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }

        /* Düymələr Barı (Sağ Aşağı) */
        .action-buttons {
            position: absolute;
            bottom: 25px;
            right: 15px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-main {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(40,167,69,0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-locate {
            background: #ffffff;
            color: #333;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-left: auto;
        }

        /* Profil / Detal Kartı (Modal/Sheet) */
        .profile-card {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: white;
            z-index: 2000;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.25);
            transition: bottom 0.3s ease-in-out;
            max-height: 80vh;
            overflow-y: auto;
        }

        .profile-card.open {
            bottom: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .card-close {
            background: #f0f2f5;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .contact-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-call {
            flex: 1;
            background: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-whatsapp {
            flex: 1;
            background: #25D366;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .portfolio-grid img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Form Modal (Elan Əlavə Et) */
        .form-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .form-content {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Axtarış və Filter Paneli -->
    <div class="top-panel">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Küçə, rayon və ya xidmət axtarın..." onkeyup="filterMarkers()">
        </div>
        <div class="filter-tags">
            <button class="tag-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-border-all"></i> Hamısı</button>
            <button class="tag-btn" onclick="filterCategory('usta', this)"><i class="fa-solid fa-helmet-safety"></i> Ustalar</button>
            <button class="tag-btn" onclick="filterCategory('texnika', this)"><i class="fa-solid fa-truck-monster"></i> Xüsusi Texnika</button>
            <button class="tag-btn" onclick="filterCategory('dukan', this)"><i class="fa-solid fa-store"></i> Material Dükanları</button>
        </div>
    </div>

    <!-- Xəritə -->
    <div id="map"></div>

    <!-- Aşağı Düymələr -->
    <div class="action-buttons">
        <button class="btn-locate" onclick="locateUser()" title="Mənim Yerim"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="btn-main" onclick="openFormModal()"><i class="fa-solid fa-plus"></i> Elan Yerləşdir</button>
    </div>

    <!-- Profil Detal Pəncərəsi (Modal) -->
    <div class="profile-card" id="profileCard">
        <div class="card-header">
            <div>
                <h3 id="cardName">Usta Adı</h3>
                <span id="cardCategory" style="color: #666; font-size: 13px;">Kateqoriya</span>
            </div>
            <button class="card-close" onclick="closeProfileCard()">✕</button>
        </div>
        <p id="cardDescription" style="font-size: 14px; color: #444; margin-bottom: 10px;">Təsvir məlumatı daxil ediləcək.</p>
        <p style="font-size: 13px; color: #888;"><i class="fa-solid fa-location-dot"></i> <span id="cardAddress">Bakı ş.</span></p>
        
        <div class="contact-btns">
            <a href="#" id="callBtn" class="btn-call"><i class="fa-solid fa-phone"></i> Zəng Et</a>
            <a href="#" id="waBtn" target="_blank" class="btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
        </div>

        <h4 style="margin-top: 15px; font-size: 14px;">Gördüyü İşlər (Portfolio)</h4>
        <div class="portfolio-grid" id="portfolioGrid">
            <!-- Şəkillər JavaScript ilə yüklənir -->
        </div>
    </div>

    <!-- Elan Yerləşdirmə Formu (Modal) -->
    <div class="form-modal" id="formModal">
        <div class="form-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Xəritədə Elan Yarat</h3>
                <button class="card-close" onclick="closeFormModal()">✕</button>
            </div>
            <form id="addListingForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label>Adınız / Obyektin Adı</label>
                    <input type="text" id="formName" placeholder="Məs: Şamxal Usta (Alçipan)" required>
                </div>
                <div class="form-group">
                    <label>Kateqoriya</label>
                    <select id="formCategory" required>
                        <option value="usta">Usta (Alçipan, Şpatlyovka, Malyar və s.)</option>
                        <option value="texnika">Xüsusi Texnika (Kran, Evakuator və s.)</option>
                        <option value="dukan">Tikinti Materialı Dükanı</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Əlaqə Nömrəsi</label>
                    <input type="tel" id="formPhone" placeholder="0501234567" required>
                </div>
                <div class="form-group">
                    <label>Ünvan / Ərazi</label>
                    <input type="text" id="formAddress" placeholder="Məs: Nərimanov r., Təbriz küç." required>
                </div>
                <div class="form-group">
                    <label>Xidmət Haqqında Ətraflı</label>
                    <textarea id="formDesc" rows="3" placeholder="Gördüyünüz işlər haqqında qısa məlumat..." required></textarea>
                </div>
                <p style="font-size: 12px; color: #d9534f; margin-bottom: 10px;">
                    * Qeyd: Elan saxlanıldıqdan sonra xəritədə cari mərkəz nöqtəsinə əlavə olunacaq.
                </p>
                <button type="submit" class="btn-main" style="width: 100%; justify-content: center;">Elanı Yayınla</button>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Xəritənin İlkin Başladılması (Bakı mərkəzli)
        const map = L.map('map', { zoomControl: false }).setView([40.4092617, 49.8670924], 12);

        // OpenStreetMap Şəbəkə Qatı (Açıq Qaynaq)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Zoom düyməsini sağ tərəfə əlavə edək
        L.control.zoom({ position: 'topright' }).addTo(map);

        // 2. Nümunə Bazada Olan Elan Məlumatları (Canlı Baza Əvəzi)
        let listings = [
            {
                id: 1,
                name: "Usta Şamxal (Alçipan və Şpatlyovka)",
                category: "usta",
                phone: "0501234567",
                address: "Nizami rayonu, Neftçilər",
                desc: "Alçipan tavanlar, fiqurlar, şpatlyovka və malyar işləri yüksək peşəkarlıqla görülür.",
                lat: 40.4150,
                lng: 49.9100,
                images: [
                    "https://images.unsplash.com/photo-1581094794329-c8112a89af12?w=200",
                    "https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=200"
                ]
            },
            {
                id: 2,
                name: "Kran İcarəsi (25 Tonluq)",
                category: "texnika",
                phone: "0559876543",
                address: "Nərimanov r., Təbriz küç.",
                desc: "24/7 Avtokran xidməti. Şəhər və rayonlara sifariş qəbul olunur.",
                lat: 40.4000,
                lng: 49.8700,
                images: [
                    "https://images.unsplash.com/photo-1541888946425-d0fbb186a5b3?w=200"
                ]
            },
            {
                id: 3,
                name: "EuroHome Tikinti Materialları Dükanı",
                category: "dukan",
                phone: "0123456789",
                address: "Xətai r., Babək pr.",
                desc: "Sement, gips, alçipan profilləri, boyalar və hər növ tikinti ləvazimatları.",
                lat: 40.3800,
                lng: 49.8900,
                images: [
                    "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=200"
                ]
            }
        ];

        let activeMarkers = [];
        let currentFilter = 'all';

        // Xüsusi İkon Rəngləri Yaratmaq
        function createCustomIcon(category) {
            let color = '#007bff'; // Usta (Mavi)
            let iconClass = 'fa-helmet-safety';

            if (category === 'texnika') {
                color = '#f39c12'; // Texnika (Qızılı/Sarı)
                iconClass = 'fa-truck-monster';
            } else if (category === 'dukan') {
                color = '#28a745'; // Dükan (Yaşıl)
                iconClass = 'fa-store';
            }

            return L.divIcon({
                className: 'custom-pin',
                html: `<div style="background-color: ${color}; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 3px 8px rgba(0,0,0,0.4); border: 2px solid white;">
                        <i class="fa-solid ${iconClass}"></i>
                       </div>`,
                iconSize: [36, 36],
                iconAnchor: [18, 18]
            });
        }

        // 3. Markerləri Xəritəyə Düzmək
        function renderMarkers() {
            // Əvvəlki markerləri təmizlə
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];

            const searchText = document.getElementById('searchInput').value.toLowerCase();

            listings.forEach(item => {
                const matchesCategory = (currentFilter === 'all' || item.category === currentFilter);
                const matchesSearch = item.name.toLowerCase().includes(searchText) || 
                                      item.address.toLowerCase().includes(searchText) ||
                                      item.desc.toLowerCase().includes(searchText);

                if (matchesCategory && matchesSearch) {
                    const marker = L.marker([item.lat, item.lng], { icon: createCustomIcon(item.category) }).addTo(map);
                    
                    marker.on('click', () => {
                        openProfileCard(item);
                    });

                    activeMarkers.push(marker);
                }
            });
        }

        // 4. Profil Kartını Açmaq
        function openProfileCard(item) {
            document.getElementById('cardName').innerText = item.name;
            document.getElementById('cardCategory').innerText = item.category.toUpperCase();
            document.getElementById('cardDescription').innerText = item.desc;
            document.getElementById('cardAddress').innerText = item.address;

            document.getElementById('callBtn').href = `tel:${item.phone}`;
            document.getElementById('waBtn').href = `https://wa.me/${item.phone.replace(/[^0-9]/g, '')}`;

            const portfolioGrid = document.getElementById('portfolioGrid');
            portfolioGrid.innerHTML = '';
            
            if (item.images && item.images.length > 0) {
                item.images.forEach(imgUrl => {
                    const img = document.createElement('img');
                    img.src = imgUrl;
                    portfolioGrid.appendChild(img);
                });
            } else {
                portfolioGrid.innerHTML = '<p style="font-size:12px; color:#999; grid-column: 1/-1;">Şəkil əlavə edilməyib.</p>';
            }

            document.getElementById('profileCard').classList.add('open');
        }

        function closeProfileCard() {
            document.getElementById('profileCard').classList.remove('open');
        }

        // 5. Axtarış və Kateqoriya Filterləri
        function filterCategory(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMarkers();
        }

        function filterMarkers() {
            renderMarkers();
        }

        // 6. Canlı Geolokasiya (İstifadəçinin Yeri)
        function locateUser() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    map.setView([lat, lng], 14);

                    L.circle([lat, lng], { radius: 200, color: '#007bff' }).addTo(map);
                    L.marker([lat, lng]).addTo(map).bindPopup("Sizin Mövqeyiniz").openPopup();
                }, () => {
                    alert("Geolokasiya icazəsi verilmədi və ya dəstəklənmir.");
                });
            }
        }

        // 7. Yeni Elan Əlavə Etmə Modalı
        function openFormModal() {
            document.getElementById('formModal').style.display = 'flex';
        }

        function closeFormModal() {
            document.getElementById('formModal').style.display = 'none';
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const center = map.getCenter();

            const newListing = {
                id: listings.length + 1,
                name: document.getElementById('formName').value,
                category: document.getElementById('formCategory').value,
                phone: document.getElementById('formPhone').value,
                address: document.getElementById('formAddress').value,
                desc: document.getElementById('formDesc').value,
                lat: center.lat,
                lng: center.lng,
                images: ["https://images.unsplash.com/photo-1581094794329-c8112a89af12?w=200"]
            };

            listings.push(newListing);
            renderMarkers();
            closeFormModal();
            document.getElementById('addListingForm').reset();

            alert("Təbriklər! Elanınız xəritədə cari mərkəz nöqtəsinə əlavə olundu.");
        }

        // Başlanğıcda markerləri çək
        renderMarkers();
    </script>
</body>
</html>
