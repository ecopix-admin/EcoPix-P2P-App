<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<meta name="description" content="AzChat - P2P Social Messenger">
<title>AzChat P2P</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b141a;
  --panel:#111b21;
  --panel2:#202c33;
  --line:#26343c;
  --text:#e9edef;
  --muted:#8696a0;
  --green:#00a884;
  --green2:#06cf9c;
  --danger:#ef4444;
  --bubble:#005c4b;
  --bubble2:#202c33;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}
.topbar{
  height:62px;
  min-height:62px;
  display:flex;
  align-items:center;
  padding:0 12px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  gap:10px;
}
.brand{
  font-size:20px;
  font-weight:800;
  letter-spacing:.3px;
  color:#fff;
  flex:1;
}
.brand span{color:var(--green)}
.iconbtn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.iconbtn:active{background:#26343c}
.layout{
  flex:1;
  min-height:0;
  display:flex;
}
.sidebar{
  width:360px;
  max-width:100%;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
}
.search{
  padding:9px 12px;
  border-bottom:1px solid var(--line);
}
.searchbox{
  height:40px;
  border-radius:9px;
  background:var(--panel2);
  display:flex;
  align-items:center;
  padding:0 12px;
}
.searchbox span{
  color:var(--muted);
  margin-right:8px;
}
.searchbox input{
  width:100%;
  border:0;
  outline:0;
  color:var(--text);
  background:transparent;
}
.contactlist{
  overflow:auto;
  flex:1;
}
.contact{
  height:70px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 12px;
  border-bottom:1px solid rgba(255,255,255,.03);
}
.contact:active{background:#202c33}
.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  overflow:hidden;
  background:#26343c;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-weight:700;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.contactmain{
  min-width:0;
  flex:1;
}
.contactname{
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.contactname b{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.contacttime{
  color:var(--muted);
  font-size:12px;
}
.preview{
  color:var(--muted);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:3px;
}
.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.025) 0 1px,transparent 2px),
    radial-gradient(circle at 80% 70%,rgba(255,255,255,.02) 0 1px,transparent 2px),
    var(--bg);
  background-size:34px 34px;
}
.chathead{
  height:62px;
  min-height:62px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:6px 10px;
  gap:9px;
}
.back{
  display:none;
}
.chatinfo{
  flex:1;
  min-width:0;
}
.chatname{
  font-weight:700;
}
.status{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}
.messages{
  flex:1;
  overflow:auto;
  padding:15px 5%;
}
.empty{
  margin:auto;
  text-align:center;
  max-width:330px;
  color:var(--muted);
}
.empty h2{color:var(--text)}
.msg{
  max-width:min(75%,520px);
  margin:5px 0;
  padding:7px 9px 5px;
  border-radius:8px;
  background:var(--bubble2);
  word-break:break-word;
  position:relative;
  box-shadow:0 1px 1px rgba(0,0,0,.15);
}
.msg.me{
  margin-left:auto;
  background:var(--bubble);
}
.msgtext{
  white-space:pre-wrap;
  line-height:1.4;
}
.msgmeta{
  font-size:10px;
  color:#b7c5ca;
  text-align:right;
  margin-top:3px;
}
.composer{
  min-height:62px;
  background:var(--panel);
  border-top:1px solid var(--line);
  padding:9px;
  display:flex;
  gap:7px;
  align-items:flex-end;
}
.composer textarea{
  flex:1;
  resize:none;
  min-height:42px;
  max-height:120px;
  border:0;
  outline:0;
  background:var(--panel2);
  color:var(--text);
  border-radius:21px;
  padding:11px 15px;
}
.round{
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}
.round:active{transform:scale(.94)}
.emptychat{
  margin:auto;
  text-align:center;
  color:var(--muted);
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px;
}
.modal.show{display:flex}
.sheet{
  width:min(500px,100%);
  max-height:90dvh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}
.sheet h2{
  margin:0 0 15px;
}
.field{
  margin-bottom:13px;
}
.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:6px;
}
.field input,.field textarea,.field select{
  width:100%;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.btn{
  padding:11px 15px;
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
}
.btn.primary{
  background:var(--green);
  color:white;
}
.btn.danger{
  background:#5d2020;
  color:#ffb4b4;
}
.profilePreview{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding:10px 0 16px;
}
.bigavatar{
  width:90px;
  height:90px;
  border-radius:50%;
  overflow:hidden;
  background:var(--panel2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:800;
}
.bigavatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.idbox{
  width:100%;
  padding:12px;
  border:1px dashed var(--green);
  border-radius:10px;
  background:rgba(0,168,132,.06);
  text-align:center;
  word-break:break-all;
}
.qrwrap{
  background:#fff;
  padding:14px;
  border-radius:16px;
  width:max-content;
  margin:12px auto;
}
#qrCanvas{
  display:block;
  width:260px;
  height:260px;
  image-rendering:pixelated;
}
.qrtext{
  background:var(--panel2);
  border-radius:10px;
  padding:10px;
  word-break:break-all;
  font-size:12px;
  color:var(--muted);
}
.tabs{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}
.tab{
  flex:1;
  padding:10px;
  border-radius:9px;
  background:var(--panel2);
  color:var(--muted);
}
.tab.active{
  background:var(--green);
  color:#fff;
}
.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:300;
  background:#26343c;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  transition:.2s;
  max-width:90%;
  text-align:center;
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
.setup{
  position:fixed;
  inset:0;
  z-index:500;
  background:var(--bg);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.setup.show{display:flex}
.setupbox{
  width:min(440px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:25px;
}
.logo{
  width:72px;
  height:72px;
  border-radius:22px;
  background:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 15px;
  font-size:30px;
  font-weight:900;
}
.hidden{display:none!important}
.qrscan{
  width:100%;
  aspect-ratio:1;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  position:relative;
}
.qrscan video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.scanline{
  position:absolute;
  left:10%;
  right:10%;
  top:50%;
  height:2px;
  background:var(--green);
  box-shadow:0 0 15px var(--green);
}
@media(max-width:720px){
  .sidebar{
    width:100%;
  }
  .chat{
    display:none;
  }
  .chat.mobile{
    display:flex;
    position:absolute;
    inset:0;
    z-index:20;
  }
  .back{display:flex}
  .layout{position:relative}
  .messages{padding:12px 3%}
  .msg{max-width:85%}
}
</style>
</head>

<script>
/* =========================================================
   AZCHAT
   LOCAL QR + P2P FOUNDATION
   ========================================================= */

const $ = id => document.getElementById(id);

const DB_NAME = "AZCHAT_LOCAL_DB";
const DB_VERSION = 1;

let db;
let profile = null;
let contacts = [];
let chats = {};
let currentContact = null;
let peer = null;
let currentCall = null;
let localStream = null;
let scanStream = null;
let scanTimer = null;


/* =========================================================
   TOAST
   ========================================================= */

function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(el._t);

  el._t = setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}


/* =========================================================
   INDEXED DB
   ========================================================= */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request = indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = e => {

      const database = e.target.result;

      if(!database.objectStoreNames.contains("data")){
        database.createObjectStore("data");
      }

    };

    request.onsuccess = e => {

      db = e.target.result;

      resolve(db);

    };

    request.onerror = () => reject(request.error);

  });

}


function dbGet(key){

  return new Promise(resolve=>{

    const tx = db.transaction("data","readonly");

    const store = tx.objectStore("data");

    const req = store.get(key);

    req.onsuccess = ()=>resolve(req.result);

    req.onerror = ()=>resolve(null);

  });

}


function dbSet(key,value){

  return new Promise((resolve,reject)=>{

    const tx = db.transaction("data","readwrite");

    tx.objectStore("data").put(value,key);

    tx.oncomplete = ()=>resolve();

    tx.onerror = ()=>reject(tx.error);

  });

}


/* =========================================================
   CRYPTO RANDOM ID
   ========================================================= */

function makeID(){

  const bytes = new Uint8Array(8);

  crypto.getRandomValues(bytes);

  let str = "";

  for(const b of bytes){

    str += b.toString(16).padStart(2,"0");

  }

  return "AZ-" + str.toUpperCase();

}


/* =========================================================
   PROFILE
   ========================================================= */

async function loadData(){

  profile = await dbGet("profile");

  contacts = await dbGet("contacts") || [];

  chats = await dbGet("chats") || {};

}


async function saveAll(){

  await dbSet("profile",profile);

  await dbSet("contacts",contacts);

  await dbSet("chats",chats);

}


function renderProfile(){

  if(!profile)return;

  $("profileName").textContent = profile.name;

  $("profileId").textContent = profile.id;

  setAvatar(
    $("profileAvatar"),
    profile.avatar,
    profile.name
  );

}


function setAvatar(element,src,name){

  element.innerHTML = "";

  if(src){

    const img = document.createElement("img");

    img.src = src;

    element.appendChild(img);

  }else{

    element.textContent =
      (name || "?").trim().charAt(0).toUpperCase();

  }

}


function readImage(file){

  return new Promise(resolve=>{

    if(!file){

      resolve("");

      return;

    }

    const reader = new FileReader();

    reader.onload = ()=>resolve(reader.result);

    reader.readAsDataURL(file);

  });

}

function renderContacts(filter=""){

  const list = $("contactList");

  list.innerHTML = "";

  const f = filter.toLowerCase();

  const result = contacts.filter(c =>

    c.name.toLowerCase().includes(f) ||

    c.id.toLowerCase().includes(f)

  );

  if(!result.length){

    const empty = document.createElement("div");

    empty.style.padding = "30px 20px";

    empty.style.textAlign = "center";

    empty.style.color = "var(--muted)";

    empty.innerHTML = `

      <div style="font-size:35px;margin-bottom:10px">＋</div>

      <div>Hələ kontakt yoxdur</div>

      <button class="btn primary"
        style="margin-top:12px"
        onclick="openAdd()">
        Kontakt əlavə et
      </button>

    `;

    list.appendChild(empty);

    return;

  }

  for(const c of result){

    const row = document.createElement("div");

    row.className = "contact";

    row.onclick = ()=>openChat(c.id);

    const av = document.createElement("div");

    av.className = "avatar";

    setAvatar(av,c.avatar,c.name);

    const main = document.createElement("div");

    main.className = "contactmain";

    const top = document.createElement("div");

    top.className = "contactname";

    const b = document.createElement("b");

    b.textContent = c.name;

    const time = document.createElement("span");

    time.className = "contacttime";

    const messages = chats[c.id] || [];

    if(messages.length){

      time.textContent =
        new Date(messages[messages.length-1].time)
        .toLocaleTimeString([],{
          hour:"2-digit",
          minute:"2-digit"
        });

    }

    top.append(b,time);

    const preview = document.createElement("div");

    preview.className = "preview";

    preview.textContent =
      messages.length
      ? messages[messages.length-1].text || "Media"
      : c.id;

    main.append(top,preview);

    row.append(av,main);

    list.appendChild(row);

  }

}

function openChat(id){

  currentContact =
    contacts.find(c=>c.id===id);

  if(!currentContact)return;

  $("chatName").textContent =
    currentContact.name;

  $("chatStatus").textContent =
    currentContact.id;

  setAvatar(
    $("chatAvatar"),
    currentContact.avatar,
    currentContact.name
  );

  renderMessages();

  $("chat").classList.add("mobile");

}


function renderMessages(){

  const box = $("messages");

  box.innerHTML = "";

  if(!currentContact){

    box.innerHTML = `

      <div class="emptychat">

        <h2>AzChat</h2>

        <div>Kontakt seçin.</div>

      </div>

    `;

    return;

  }

  const arr =
    chats[currentContact.id] || [];

  if(!arr.length){

    box.innerHTML = `

      <div class="emptychat">

        <div style="font-size:35px">✦</div>

        <div>Hələ mesaj yoxdur.</div>

      </div>

    `;

    return;

  }

  for(const m of arr){

    const el = document.createElement("div");

    el.className =
      "msg " + (m.from===profile.id ? "me":"");

    const text = document.createElement("div");

    text.className="msgtext";

    text.textContent=m.text || "";

    const meta = document.createElement("div");

    meta.className="msgmeta";

    meta.textContent =
      new Date(m.time)
      .toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
      }) +
      (m.from===profile.id ? " ✓✓":"");

    el.append(text,meta);

    box.appendChild(el);

  }

  box.scrollTop=box.scrollHeight;

}


async function sendMessage(){

  if(!currentContact){

    toast("Əvvəl kontakt seçin");

    return;

  }

  const input = $("messageInput");

  const text = input.value.trim();

  if(!text)return;

  if(!chats[currentContact.id]){

    chats[currentContact.id]=[];

  }

  const message = {

    id:crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now()+"-"+Math.random(),

    from:profile.id,

    to:currentContact.id,

    text:text,

    time:Date.now()

  };

  chats[currentContact.id].push(message);

  await saveAll();

  renderMessages();

  renderContacts();

  input.value="";

  input.style.height="42px";

  sendP2P(message);

}


function sendP2P(message){

  try{

    if(peer &&
       peer.connections &&
       peer.connections[currentContact.id] &&
       peer.connections[currentContact.id][0]){

      const conn =
        peer.connections[currentContact.id][0];

      if(conn.open){

        conn.send({

          type:"message",

          message:message

        });

      }

    }

  }catch(e){

    console.log("P2P send:",e);

  }

}

   PEERJS
   ========================================================= */

function loadPeerJS(){

  return new Promise(resolve=>{

    if(window.Peer){

      resolve();

      return;

    }

    const script =
      document.createElement("script");

    script.src =
      "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";

    script.onload=resolve;

    script.onerror=()=>{

      toast("P2P kitabxanası yüklənmədi");

      resolve();

    };

    document.head.appendChild(script);

  });

}


async function initPeer(){

  await loadPeerJS();

  if(!window.Peer)return;

  try{

    peer = new Peer(profile.id,{
      debug:0,
      config:{
        iceServers:[
          {urls:"stun:stun.l.google.com:19302"},
          {urls:"stun:stun.cloudflare.com:3478"}
        ]
      }
    });

    peer.on("open",id=>{

      console.log("P2P ID:",id);

    });

    peer.on("connection",conn=>{

      setupConnection(conn);

    });

    peer.on("call",call=>{

      incomingCall(call);

    });

    peer.on("error",e=>{

      console.log("Peer error",e);

    });

  }catch(e){

    console.log(e);

  }

}


function connectTo(id){

  if(!peer)return;

  try{

    const conn =
      peer.connect(id,{
        reliable:true
      });

    setupConnection(conn);

  }catch(e){

    toast("P2P bağlantı xətası");

  }

}


function setupConnection(conn){

  conn.on("open",()=>{

    conn.send({

      type:"hello",

      profile:{

        id:profile.id,

        name:profile.name,

        avatar:profile.avatar

      }

    });

  });

  conn.on("data",async data=>{

    if(!data)return;

    if(data.type==="hello"){

      const p=data.profile;

      if(p && p.id && p.id!==profile.id){

        const exists =
          contacts.find(c=>c.id===p.id);

        if(!exists){

          contacts.unshift({

            id:p.id,

            name:p.name || p.id,

            avatar:p.avatar || "",

            created:Date.now()

          });

          await saveAll();

          renderContacts();

        }

      }

    }

    if(data.type==="message"){

      const m=data.message;

      if(!m)return;

      if(!chats[m.from]){

        chats[m.from]=[];

      }

      chats[m.from].push(m);

      await saveAll();

      if(currentContact &&
         currentContact.id===m.from){

        renderMessages();

      }

      renderContacts();

      showNotification(
        m.from,
        m.text
      );

    }

  });

  conn.on("close",()=>{});

}


/* =========================================================
   QR ENGINE
   =========================================================

   Bu QR sistemi xarici server/API istifadə etmir.

   QR məlumatı əvvəlcə UTF-8 byte-lara çevrilir.
   Sonra QR Code Model 2, byte mode,
   error correction M istifadə olunur.

   Bu, profil məlumatını serverə göndərmədən
   brauzerin daxilində QR yaratmağa imkan verir.
   ========================================================= */

const QR = (()=>{

  const EXP = new Array(512);
  const LOG = new Array(256);

  let initialized=false;

  function initGF(){

    if(initialized)return;

    let x=1;

    for(let i=0;i<255;i++){

      EXP[i]=x;

      LOG[x]=i;

      x<<=1;

      if(x&0x100)x^=0x11d;

    }

    for(let i=255;i<512;i++){

      EXP[i]=EXP[i-255];

    }

    initialized=true;

  }


  function mul(a,b){

    if(a===0 || b===0)return 0;

    return EXP[LOG[a]+LOG[b]];

  }


  function polyMul(p,q){

    const r=
      new Array(p.length+q.length-1).fill(0);

    for(let i=0;i<p.length;i++){

      for(let j=0;j<q.length;j++){

        r[i+j]^=mul(p[i],q[j]);

      }

    }

    return r;

  }


  function generator(n){

    let g=[1];

    let a=1;

    for(let i=0;i<n;i++){

      g=polyMul(g,[1,a]);

      a=mul(a,2);

    }

    return g;

  }


  function ecc(data,n){

    const g=generator(n);

    const res=
      data.concat(new Array(n).fill(0));

    for(let i=0;i<data.length;i++){

      const factor=res[i];

      if(factor){

        for(let j=0;j<g.length;j++){

          res[i+j]^=mul(g[j],factor);

        }

      }

    }

    return res.slice(data.length);

  }


  const EC_M = {

    1:{total:26,data:16,ecc:10,blocks:1},

    2:{total:44,data:28,ecc:16,blocks:1},

    3:{total:70,data:44,ecc:26,blocks:1},

    4:{total:100,data:64,ecc:18,blocks:2},

    5:{total:134,data:86,ecc:24,blocks:2},

    6:{total:172,data:108,ecc:16,blocks:4},

    7:{total:196,data:124,ecc:18,blocks:4},

    8:{total:242,data:154,ecc:22,blocks:4},

    9:{total:292,data:182,ecc:22,blocks:5},

    10:{total:346,data:216,ecc:26,blocks:5}

  };


  function bytesToBits(bytes){

    const bits=[];

    for(const b of bytes){

      for(let i=7;i>=0;i--){

        bits.push((b>>i)&1);

      }

    }

    return bits;

  }


  function bitsToBytes(bits){

    const out=[];

    for(let i=0;i<bits.length;i+=8){

      let x=0;

      for(let j=0;j<8;j++){

        x=(x<<1)|(bits[i+j]||0);

      }

      out.push(x);

    }

    return out;

  }


  function makeData(text,version){

    const encoder=new TextEncoder();

    const bytes=[...encoder.encode(text)];

    const info=EC_M[version];

    const capacity=info.data;

    const maxBytes=capacity-2;

    const use=bytes.slice(0,maxBytes);

    const bits=[];

    // byte mode 0100

    bits.push(0,1,0,0);

    const len=use.length;

    for(let i=7;i>=0;i--){

      bits.push((len>>i)&1);

    }

    bits.push(...bytesToBits(use));

    const target=capacity*8;

    while(bits.length<target){

      bits.push(0);

    }

    const data=bitsToBytes(bits);

    for(let i=0;i<data.length;i++){

      if(data[i]===0 && i>=2){

        // padding handled below

      }

    }

    const pad=[0xec,0x11];

    let pi=0;

    while(data.length<capacity){

      data.push(pad[pi++%2]);

    }

    return data.slice(0,capacity);

  }


  function maskBit(mask,r,c){

    switch(mask){

      case 0:return (r+c)%2===0;

      case 1:return r%2===0;

      case 2:return c%3===0;

      case 3:return (r+c)%3===0;

      case 4:return (Math.floor(r/2)+Math.floor(c/3))%2===0;

      case 5:return (r*c)%2+(r*c)%3===0;

      case 6:return ((r*c)%2+(r*c)%3)%2===0;

      case 7:return ((r*c)%3+(r+c)%2)%2===0;

    }

    return false;

  }


  function formatBits(mask){

    const G=0x537;

    let data=(0x00<<3)|mask;

    let v=data<<10;

    for(let i=14;i>=10;i--){

      if((v>>i)&1){

        v^=G<<(i-10);

      }

    }

    return ((data<<10)|v)^0x5412;

  }


  function bchTypeInfo(data){

    let d=data<<10;

    const g=0x537;

    for(let i=14;i>=10;i--){

      if((d>>i)&1){

        d^=g<<(i-10);

      }

    }

    return ((data<<10)|d)^0x5412;

  }


  function bchTypeNumber(data){

    let d=data<<12;

    const g=0x1f25;

    for(let i=17;i>=12;i--){

      if((d>>i)&1){

        d^=g<<(i-12);

      }

    }

    return (data<<12)|d;

  }


  function makeMatrix(version,data,mask){

    const n=version*4+17;

    const m=
      Array.from({length:n},()=>Array(n).fill(null));

    function setFinder(r,c){

      for(let dr=-1;dr<=7;dr++){

        for(let dc=-1;dc<=7;dc++){

          const rr=r+dr;
          const cc=c+dc;

          if(rr<0||rr>=n||cc<0||cc>=n)continue;

          const on =
            dr>=0&&dr<=6&&dc>=0&&dc<=6 &&
            (
              dr===0||dr===6||
              dc===0||dc===6||
              (dr>=2&&dr<=4&&dc>=2&&dc<=4)
            );

          m[rr][cc]=on;

        }

      }

    }

    setFinder(0,0);

    setFinder(n-7,0);

    setFinder(0,n-7);


    for(let i=8;i<n-8;i++){

      if(m[6][i]===null)m[6][i]=i%2===0;

      if(m[i][6]===null)m[i][6]=i%2===0;

    }


    const alignment={

      2:[6,18],

      3:[6,22],

      4:[6,26],

      5:[6,30],

      6:[6,34],

      7:[6,22,38],

      8:[6,24,42],

      9:[6,26,46],

      10:[6,28,50]

    };

    if(version>=2){

      const pos=alignment[version];

      for(const r of pos){

        for(const c of pos){

          if(m[r][c]!==null)continue;

          for(let dr=-2;dr<=2;dr++){

            for(let dc=-2;dc<=2;dc++){

              m[r+dr][c+dc]=
                Math.max(Math.abs(dr),Math.abs(dc))!==1;

            }

          }

        }

      }

    }


    // Dark module

    m[n-8][8]=true;


    // Reserve format areas

    for(let i=0;i<9;i++){

      if(m[i][8]===null)m[i][8]=false;

      if(m[8][i]===null)m[8][i]=false;

    }

    for(let i=0;i<8;i++){

      if(m[n-1-i][8]===null)m[n-1-i][8]=false;

      if(m[8][n-1-i]===null)m[8][n-1-i]=false;

    }


    const bits=formatBits(mask);

    for(let i=0;i<15;i++){

      const bit=((bits>>i)&1)!==0;

      let r,c;

      if(i<6){

        r=i;

        c=8;

      }else if(i<8){

        r=i+1;

        c=8;

      }else{

        r=n-15+i;

        c=8;

      }

      m[r][c]=bit;

    }

    for(let i=0;i<15;i++){

      const bit=((bits>>i)&1)!==0;

      let r,c;

      if(i<8){

        r=8;

        c=n-i-1;

      }else if(i<9){

        r=8;

        c=15-i;

      }else{

        r=8;

        c=15-i-1;

      }

      m[r][c]=bit;

    }


    // Data

    const allBits=bytesToBits(data);

    let k=0;

    let row=n-1;

    let inc=-1;

    let col=n-1;

    while(col>0){

      if(col===6)col--;

      while(true){

        for(let j=0;j<2;j++){

          const c=col-j;

          if(m[row][c]===null){

            let bit=k<allBits.length
              ? allBits[k++]
              : 0;

            if(maskBit(mask,row,c))bit^=1;

            m[row][c]=!!bit;

          }

        }

        row+=inc;

        if(row<0 || row>=n){

          row-=inc;

          inc=-inc;

          break;

        }

      }

      col-=2;

    }

    return m;

  }


  function penalty(m){

    const n=m.length;

    let p=0;

    for(let r=0;r<n;r++){

      let run=1;

      for(let c=1;c<n;c++){

        if(m[r][c]===m[r][c-1]){

          run++;

        }else{

          if(run>=5)p+=3+run-5;

          run=1;

        }

      }

      if(run>=5)p+=3+run-5;

    }

    for(let c=0;c<n;c++){

      let run=1;

      for(let r=1;r<n;r++){

        if(m[r][c]===m[r-1][c]){

          run++;

        }else{

          if(run>=5)p+=3+run-5;

          run=1;

        }

      }

      if(run>=5)p+=3+run-5;

    }

    for(let r=0;r<n-1;r++){

      for(let c=0;c<n-1;c++){

        const a=m[r][c];

        if(
          m[r+1][c]===a &&
          m[r][c+1]===a &&
          m[r+1][c+1]===a
        )p+=3;

      }

    }

    return p;

  }


  function generate(text){

    initGF();

    let version=1;

    for(let v=1;v<=10;v++){

      const max=EC_M[v].data-2;

      const bytes=
        [...new TextEncoder().encode(text)];

      if(bytes.length<=max){

        version=v;

        break;

      }

      version=v;

    }

    const info=EC_M[version];

    const data=makeData(text,version);

    const ec=ecc(data,info.ecc);

    const codewords=data.concat(ec);

    let best=null;

    let bestScore=Infinity;

    for(let mask=0;mask<8;mask++){

      const matrix=
        makeMatrix(version,codewords,mask);

      const score=penalty(matrix);

      if(score<bestScore){

        bestScore=score;

        best=matrix;

      }

    }

    return best;

  }


  function draw(canvas,text){

    const matrix=generate(text);

    const n=matrix.length;

    canvas.width=n;

    canvas.height=n;

    const ctx=canvas.getContext("2d");

    ctx.imageSmoothingEnabled=false;

    ctx.fillStyle="#fff";

    ctx.fillRect(0,0,n,n);

    ctx.fillStyle="#000";

    for(let y=0;y<n;y++){

      for(let x=0;x<n;x++){

        if(matrix[y][x]){

          ctx.fillRect(x,y,1,1);

        }

      }

    }

  }

  return {draw};

})();

function downloadCanvas(canvas,name){

  canvas.toBlob(blob=>{

    if(!blob)return;

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;

    a.download=name;

    a.click();

    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },1000);

  },"image/png");

}


async function shareCanvas(canvas){

  canvas.toBlob(async blob=>{

    if(!blob)return;

    const file=new File(
      [blob],
      "azchat-qr.png",
      {type:"image/png"}
    );

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){

      try{

        await navigator.share({

          title:"AzChat QR",

          files:[file]

        });

        return;

      }catch(e){}

    }

    downloadCanvas(canvas,"azchat-qr.png");

  },"image/png");

}


function parseQRText(text){

  try{

    const data=JSON.parse(text);

    if(
      data &&
      data.app==="AzChat" &&
      data.id
    ){

      $("friendId").value=data.id;

      $("friendName").value=data.name || data.id;

      closeScanner();

      $("scannerModal").classList.remove("show");

      $("addModal").classList.add("show");

      toast("QR məlumatı oxundu");

      return true;

    }

  }catch(e){}

  if(/^AZ-[A-Z0-9]+$/i.test(text.trim())){

    $("friendId").value=text.trim().toUpperCase();

    closeScanner();

    $("scannerModal").classList.remove("show");

    $("addModal").classList.add("show");

    toast("P2P ID oxundu");

    return true;

  }

  return false;

}

async function openScanner(){

  $("scannerModal").classList.add("show");

  $("scanStatus").textContent=
    "Kamera açılır...";

  try{

    scanStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });

    $("scanVideo").srcObject=scanStream;

    await $("scanVideo").play();

    if("BarcodeDetector" in window){

      startBarcodeDetector();

    }else{

      $("scanStatus").textContent=
        "Bu brauzer daxili QR oxunu dəstəkləmir. Chrome-un son versiyasını istifadə edin.";

    }

  }catch(e){

    $("scanStatus").textContent=
      "Kameraya icazə verilmədi və ya kamera əlçatan deyil.";

  }

}


async function startBarcodeDetector(){

  let detector;

  try{

    detector =
      new BarcodeDetector({
        formats:["qr_code"]
      });

  }catch(e){

    $("scanStatus").textContent=
      "QR oxuyucu dəstəklənmir.";

    return;

  }

  clearInterval(scanTimer);

  scanTimer=setInterval(async()=>{

    if(
      !$("scanVideo").videoWidth ||
      $("scannerModal").classList.contains("show")===false
    )return;

    try{

      const codes=
        await detector.detect($("scanVideo"));

      if(codes.length){

        const value=codes[0].rawValue;

        if(parseQRText(value)){

          clearInterval(scanTimer);

        }

      }

    }catch(e){}

  },300);

}


function closeScanner(){

  clearInterval(scanTimer);

  scanTimer=null;

  if(scanStream){

    scanStream.getTracks().forEach(t=>t.stop());

    scanStream=null;

  }

  $("scanVideo").srcObject=null;

  $("scannerModal").classList.remove("show");

}


/* =========================================================
   NOTIFICATIONS
   ========================================================= */

async function showNotification(title,text){

  if(
    "Notification" in window &&
    Notification.permission==="granted"
  ){

    try{

      new Notification(title || "AzChat",{
        body:text || "Yeni mesaj"
      });

    }catch(e){}

  }

}


async function requestNotifications(){

  if(!("Notification" in window)){

    toast("Bu brauzer bildirişləri dəstəkləmir");

    return;

  }

  const result =
    await Notification.requestPermission();

  toast(
    result==="granted"
      ? "Bildirişlər aktivdir"
      : "Bildiriş icazəsi verilmədi"
  );

}


/* =========================================================
   PROFILE EDIT
   ========================================================= */

function openEdit(){

  $("editName").value=profile.name;

  $("editModal").classList.add("show");

}


async function saveProfile(){

  const name=
    $("editName").value.trim();

  if(!name){

    toast("Ad boş ola bilməz");

    return;

  }

  profile.name=name;

  const file=
    $("editAvatarFile").files[0];

  if(file){

    profile.avatar=
      await readImage(file);

  }

  await saveAll();

  renderProfile();

  renderContacts();

  if(currentContact){

    const c=
      contacts.find(x=>x.id===currentContact.id);

    if(c){

      currentContact=c;

    }

  }

  $("editModal").classList.remove("show");

  toast("Profil yeniləndi");

}


/* =========================================================
   CALL
   ========================================================= */

async function startCall(video=false){

  if(!currentContact){

    toast("Kontakt seçin");

    return;

  }

  if(!peer){

    toast("P2P hələ hazır deyil");

    return;

  }

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio:true,

        video:video

      });

    $("localVideo").srcObject=localStream;

    $("callModal").classList.add("show");

    const call =
      peer.call(
        currentContact.id,
        localStream
      );

    currentCall=call;

    call.on("stream",stream=>{

      $("remoteVideo").srcObject=stream;

    });

    call.on("close",endCall);

    call.on("error",()=>{

      toast("Zəng bağlantısı kəsildi");

      endCall();

    });

  }catch(e){

    toast("Mikrofon/kamera icazəsi lazımdır");

  }

}


async function incomingCall(call){

  const ok =
    confirm("Gələn P2P zəng. Qəbul edirsiniz?");

  if(!ok){

    try{call.close()}catch(e){}

    return;

  }

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio:true,

        video:true

      });

    $("localVideo").srcObject=localStream;

    $("callModal").classList.add("show");

    currentCall=call;

    call.answer(localStream);

    call.on("stream",stream=>{

      $("remoteVideo").srcObject=stream;

    });

    call.on("close",endCall);

  }catch(e){

    toast("Kamera/mikrofon açıla bilmədi");

  }

}


function endCall(){

  try{

    if(currentCall){

      currentCall.close();

    }

  }catch(e){}

  currentCall=null;

  if(localStream){

    localStream.getTracks().forEach(t=>t.stop());

    localStream=null;

  }

  $("localVideo").srcObject=null;

  $("remoteVideo").srcObject=null;

  $("callModal").classList.remove("show");

}


function toggleMute(){

  if(!localStream)return;

  const track=
    localStream.getAudioTracks()[0];

  if(!track)return;

  track.enabled=!track.enabled;

  $("muteBtn").textContent=
    track.enabled ? "Mikrofon" : "Mikrofon bağlı";

}


function toggleCamera(){

  if(!localStream)return;

  const track=
    localStream.getVideoTracks()[0];

  if(!track)return;

  track.enabled=!track.enabled;

  $("cameraBtn").textContent=
    track.enabled ? "Kamera" : "Kamera bağlı";

}


/* =========================================================
   EXPORT / WIPE
   ========================================================= */

async function exportData(){

  const data={

    version:1,

    profile:profile,

    contacts:contacts,

    chats:chats,

    exported:new Date().toISOString()

  };

  const blob=
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "azchat-backup.json";

  a.click();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);

}


async function wipeData(){

  const ok=
    confirm(
      "Bütün lokal AzChat məlumatları silinsin?"
    );

  if(!ok)return;

  indexedDB.deleteDatabase(DB_NAME);

  localStorage.clear();

  location.reload();

}
