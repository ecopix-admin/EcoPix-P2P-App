<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AZAvatar — Danışan Avatar</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
  background:#050507;
  color:#fff;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:520px;
  height:100dvh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%,#34205c 0%,transparent 35%),
    linear-gradient(160deg,#07070a,#101018 55%,#050507);
}

/* HEADER */

.header{
  position:absolute;
  z-index:20;
  top:0;
  left:0;
  width:100%;
  padding:17px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:900;
  font-size:21px;
  letter-spacing:-.8px;
}

.logo span{
  color:#9d7cff;
}

.pro{
  font-size:11px;
  padding:7px 11px;
  border-radius:20px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.13);
  color:#d8ccff;
}

/* STAGE */

.stage{
  position:absolute;
  top:64px;
  left:12px;
  right:12px;
  bottom:205px;
  border-radius:30px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,rgba(145,99,255,.38),transparent 35%),
    linear-gradient(145deg,#17131f,#07080d);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    0 30px 80px rgba(0,0,0,.5),
    inset 0 0 80px rgba(255,255,255,.03);
}

/* canvas preview */

#preview{
  width:100%;
  height:100%;
  display:block;
}

/* UPLOAD */

.upload{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:15px;
  z-index:5;
  cursor:pointer;
}

.uploadIcon{
  width:76px;
  height:76px;
  border-radius:25px;
  display:grid;
  place-items:center;
  font-size:33px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 50px #0008;
}

.uploadTitle{
  font-size:19px;
  font-weight:800;
}

.uploadSub{
  font-size:12px;
  color:#999;
}

#fileInput{
  display:none;
}

/* EFFECT LABEL */

.liveBadge{
  position:absolute;
  top:17px;
  left:17px;
  z-index:8;
  padding:7px 10px;
  border-radius:20px;
  background:#0008;
  backdrop-filter:blur(10px);
  font-size:10px;
  letter-spacing:.5px;
  color:#ddd;
}

/* WORD */

.wordPreview{
  position:absolute;
  z-index:9;
  left:50%;
  top:44%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  font-size:22px;
  font-weight:900;
  text-align:center;
  text-shadow:0 3px 20px #000;
}

/* CONTROLS */

.controls{
  position:absolute;
  left:12px;
  right:12px;
  bottom:0;
  height:195px;
  padding:12px 5px 15px;
  z-index:20;
}

.inputBox{
  width:100%;
  display:flex;
  gap:8px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:6px;
  backdrop-filter:blur(18px);
}

textarea{
  flex:1;
  height:47px;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:white;
  padding:13px;
  font-size:14px;
  font-family:inherit;
}

textarea::placeholder{
  color:#777;
}

.send{
  width:48px;
  border:0;
  border-radius:14px;
  background:#8e6cff;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.templates{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:9px 0;
  scrollbar-width:none;
}

.templates::-webkit-scrollbar{
  display:none;
}

.template{
  flex:0 0 auto;
  padding:8px 12px;
  border-radius:20px;
  background:#ffffff0d;
  border:1px solid #ffffff12;
  color:#bbb;
  font-size:11px;
}

.avatarRow{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.avatarRow::-webkit-scrollbar{
  display:none;
}

.avatar{
  flex:0 0 auto;
  padding:9px 13px;
  border-radius:15px;
  background:#ffffff08;
  border:1px solid #ffffff10;
  color:#aaa;
  font-size:11px;
}

.avatar.active{
  background:#8e6cff22;
  border-color:#8e6cff;
  color:white;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:9px;
}

.mainBtn{
  flex:1;
  height:48px;
  border:0;
  border-radius:16px;
  font-size:14px;
  font-weight:800;
  color:white;
  background:linear-gradient(135deg,#8f70ff,#6545dc);
  box-shadow:0 12px 30px #7456ff33;
}

.recordBtn{
  width:54px;
  border:1px solid #ffffff15;
  border-radius:16px;
  background:#ffffff0a;
  color:white;
  font-size:20px;
}

/* recording */

.recording{
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    box-shadow:0 0 0 8px #ff304422;
  }
}

/* SHARE */

.sharePanel{
  position:absolute;
  z-index:50;
  left:15px;
  right:15px;
  bottom:15px;
  padding:15px;
  border-radius:22px;
  background:#15151dcc;
  border:1px solid #ffffff16;
  backdrop-filter:blur(25px);
  display:none;
}

.sharePanel.show{
  display:block;
}

.shareTitle{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.shareButtons{
  display:flex;
  gap:8px;
}

.shareBtn{
  flex:1;
  height:42px;
  border:0;
  border-radius:13px;
  background:#ffffff0d;
  color:white;
}

.closeShare{
  margin-top:9px;
  width:100%;
  height:34px;
  border:0;
  border-radius:12px;
  background:#ffffff08;
  color:#999;
}

/* TOAST */

.toast{
  position:absolute;
  z-index:100;
  left:50%;
  bottom:215px;
  transform:translateX(-50%) translateY(15px);
  padding:10px 15px;
  background:#19191f;
  border:1px solid #ffffff15;
  border-radius:20px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">AZ<span>Avatar</span></div>
    <div class="pro">CREATE • SHARE • VIRAL</div>
  </div>

  <div class="stage">

    <canvas id="preview"></canvas>

    <div class="liveBadge">● AVATAR STUDIO</div>

    <div class="upload" id="uploadArea">
      <div class="uploadIcon">＋</div>
      <div class="uploadTitle">Şəklini əlavə et</div>
      <div class="uploadSub">Selfie və ya portret seç</div>
    </div>

  </div>

  <div class="controls">

    <div class="inputBox">
      <textarea id="message"
        maxlength="120"
        placeholder="Avatarın nə desin? Məsələn: Salam! Səni görməyə çox şadam ❤️"></textarea>

      <button class="send" onclick="playAvatar()">▶</button>
    </div>

    <div class="templates">
      <button class="template" onclick="setText('Salam! Səni görməyə çox şadam ❤️')">❤️ Salam</button>
      <button class="template" onclick="setText('Ad günün mübarək! 🎂🎉')">🎂 Ad günü</button>
      <button class="template" onclick="setText('Səni gözləyirəm! 😎')">😎 Gözləyirəm</button>
      <button class="template" onclick="setText('Bu gün əla gün olacaq! 🔥')">🔥 Motivasiya</button>
      <button class="template" onclick="setText('Mənə bax! 😂')">😂 Gülməli</button>
    </div>

    <div class="avatarRow">
      <button class="avatar active" data-style="cinema">🎬 Cinema</button>
      <button class="avatar" data-style="football">⚽ Football</button>
      <button class="avatar" data-style="king">👑 King</button>
      <button class="avatar" data-style="hero">🦸 Hero</button>
      <button class="avatar" data-style="robot">🤖 Robot</button>
    </div>

    <div class="buttons">
      <button class="mainBtn" onclick="playAvatar()">✨ AVATARI DANIŞDIR</button>
      <button class="recordBtn" id="recordBtn" onclick="recordVideo()">●</button>
    </div>

  </div>

  <div class="sharePanel" id="sharePanel">
    <div class="shareTitle">🎉 Video hazırdır</div>

    <div class="shareButtons">
      <button class="shareBtn" onclick="shareVideo()">📤 Paylaş</button>
      <button class="shareBtn" onclick="downloadVideo()">⬇️ Yadda saxla</button>
    </div>

    <button class="closeShare" onclick="closeShare()">Bağla</button>
  </div>

  <div class="toast" id="toast"></div>

  <input id="fileInput" type="file" accept="image/*">

</div>

<script>

const canvas = document.getElementById("preview");
const ctx = canvas.getContext("2d");

const fileInput = document.getElementById("fileInput");
const uploadArea = document.getElementById("uploadArea");
const messageInput = document.getElementById("message");
const toast = document.getElementById("toast");

let image = null;
let currentStyle = "cinema";
let speaking = false;
let currentWords = [];
let wordIndex = 0;
let wordStart = 0;
let lastVideoBlob = null;
let recorder = null;
let chunks = [];

let animationStart = 0;

canvas.width = 720;
canvas.height = 1280;


/* =========================
   IMAGE UPLOAD
========================= */

uploadArea.onclick = () => fileInput.click();

fileInput.onchange = e => {

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {

    image = new Image();

    image.onload = () => {

      uploadArea.style.display = "none";

      showToast("Şəkil əlavə edildi ✓");

      draw();

    };

    image.src = reader.result;

  };

  reader.readAsDataURL(file);

};


/* =========================
   TEXT
========================= */

function setText(text){

  messageInput.value = text;

  playAvatar();

}


/* =========================
   STYLE
========================= */

document.querySelectorAll(".avatar").forEach(btn => {

  btn.onclick = () => {

    document.querySelectorAll(".avatar")
      .forEach(x => x.classList.remove("active"));

    btn.classList.add("active");

    currentStyle = btn.dataset.style;

    draw();

  };

});

   START SPEECH
========================= */
