<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>ARWORLD — Spatial Social</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
background:#070b12;
color:#eef5ff;
font-family:Inter,system-ui,Arial,sans-serif;
overflow:hidden
}

button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}

.app{
height:100vh;
display:flex;
flex-direction:column
}

header{
height:62px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
background:#080d16;
border-bottom:1px solid #20304a;
z-index:30
}

.logo{
font-weight:950;
letter-spacing:.08em;
font-size:17px
}

.logo i{
color:#51d8ff;
font-style:normal
}

.headbtn,.btn{
background:#111c2d;
border:1px solid #2a3d59;
border-radius:12px;
padding:10px 12px
}

.primary{
background:linear-gradient(135deg,#0daed7,#705cf2);
border:0
}

.main{
position:relative;
flex:1;
min-height:0
}

.view{
position:absolute;
inset:0;
display:none
}

.view.on{
display:block
}

/* CAMERA */

#camera{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
background:#020509
}

#shade{
position:absolute;
inset:0;
background:
linear-gradient(
#0009,
transparent 25%,
transparent 72%,
#000b
);
pointer-events:none
}

.top{
position:absolute;
top:12px;
left:12px;
right:12px;
display:flex;
justify-content:space-between;
z-index:4
}

.status{
padding:8px 11px;
background:#07101dd9;
border:1px solid #31445f;
border-radius:99px;
font-size:11px
}

.reticle{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(72vw,390px);
height:min(72vw,390px);
border:1px solid #51d8ff80;
border-radius:28px;
box-shadow:0 0 0 9999px #0002;
pointer-events:none
}

.reticle:before,
.reticle:after{
content:"";
position:absolute;
width:35px;
height:35px;
border:3px solid #51d8ff
}

.reticle:before{
left:-2px;
top:-2px;
border-right:0;
border-bottom:0;
border-radius:18px 0 0
}

.reticle:after{
right:-2px;
bottom:-2px;
border-left:0;
border-top:0;
border-radius:0 0 18px
}

/* AR OBJECT */

.arobj{
position:absolute;
transform:translate(-50%,-50%);
min-width:165px;
max-width:250px;
padding:11px 12px;
border:1px solid #51d8ff77;
border-radius:15px;
background:#07101de8;
backdrop-filter:blur(12px);
box-shadow:0 12px 35px #0009;
cursor:pointer
}

.arobj b{
font-size:13px
}

.arobj small{
display:block;
color:#a9bad1;
margin-top:4px
}

.arobj em{
display:block;
color:#51d8ff;
font-style:normal;
font-size:10px;
margin-top:6px
}

/* PANELS */

.panel{
position:absolute;
left:10px;
right:10px;
bottom:10px;
max-height:82%;
overflow:auto;
background:#09111ff5;
border:1px solid #263954;
border-radius:22px;
padding:16px;
z-index:20;
backdrop-filter:blur(18px);
display:none
}

.panel.on{
display:block
}

.handle{
width:42px;
height:4px;
background:#51627c;
border-radius:8px;
margin:0 auto 12px
}

.field{
margin:9px 0
}

.field label{
font-size:11px;
color:#9badc5;
display:block;
margin-bottom:5px
}

.field input,
.field textarea,
.field select{
width:100%;
background:#07101d;
border:1px solid #263954;
color:#fff;
border-radius:11px;
padding:11px;
outline:0
}

.field textarea{
min-height:82px;
resize:vertical
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.full{
width:100%
}

/* NAVIGATION */

.nav{
height:70px;
display:flex;
justify-content:space-around;
align-items:center;
background:#080d16;
border-top:1px solid #20304a;
z-index:30
}

.nav button{
background:0;
border:0;
color:#8092ad;
font-size:10px;
display:flex;
flex-direction:column;
align-items:center;
gap:3px
}

.nav button b{
font-size:20px
}

.nav button.on{
color:#51d8ff
}

.fab{
width:52px!important;
height:52px;
border-radius:17px!important;
background:
linear-gradient(
135deg,
#51d8ff,
#725cf2
)!important;
color:white!important;
font-size:26px!important
}

/* MAP */

.searchbar{
position:absolute;
z-index:10;
top:12px;
left:12px;
right:12px;
display:flex;
gap:7px
}

.searchbar input{
flex:1;
background:#07101de8;
border:1px solid #2a3d59;
color:white;
border-radius:14px;
padding:12px
}

.results{
position:absolute;
z-index:11;
top:60px;
left:12px;
right:12px;
max-height:45%;
overflow:auto;
background:#09111ff5;
border:1px solid #263954;
border-radius:15px;
display:none
}

.results.on{
display:block
}

.result{
padding:12px;
border-bottom:1px solid #1d2a3e
}

.result small{
display:block;
color:#93a6c0;
margin-top:4px
}

#map{
position:absolute;
inset:0
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
background:#0b1524;
color:#fff
}

/* FEED */

.feed{
padding:14px;
overflow:auto
}

.post{
background:#0b1524;
border:1px solid #243650;
border-radius:20px;
overflow:hidden;
margin-bottom:14px
}

.post img,
.post video{
width:100%;
display:block;
max-height:430px;
object-fit:cover;
background:#020509
}

.body{
padding:13px
}

.meta{
font-size:10px;
color:#8ea1bb;
margin-top:5px
}

.desc{
font-size:13px;
line-height:1.5;
margin-top:8px;
white-space:pre-wrap
}

/* PROFILE */

.profile{
padding:16px;
overflow:auto
}

.card{
background:#0b1524;
border:1px solid #243650;
border-radius:20px;
padding:17px
}

.avatar{
width:72px;
height:72px;
border-radius:23px;
background:
linear-gradient(
135deg,
#51d8ff,
#725cf2
);
display:grid;
place-items:center;
font-size:28px;
font-weight:900
}

.row{
display:flex;
gap:12px;
align-items:center
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:15px 0
}

.stat{
background:#101d30;
border-radius:13px;
padding:10px;
text-align:center
}

.stat b{
display:block;
font-size:18px
}

.stat small{
color:#8fa1ba
}

.empty{
text-align:center;
padding:35px 12px;
color:#8497b2
}

.muted{
color:#91a4bf;
font-size:12px
}

.toast{
position:fixed;
z-index:100;
left:50%;
bottom:82px;
transform:translate(-50%,20px);
background:#09111f;
border:1px solid #334763;
border-radius:13px;
padding:10px 14px;
font-size:12px;
opacity:0;
transition:.2s;
pointer-events:none
}

.toast.show{
opacity:1;
transform:translate(-50%,0)
}

#detailMedia,
#detailVideo{
display:none;
width:100%;
max-height:300px;
object-fit:contain;
border-radius:13px;
background:#020509
}

h2,h3{
margin:0 0 8px
}

@media(min-width:800px){

.panel{
left:auto;
width:440px;
right:18px;
bottom:76px
}

.nav{
height:64px
}

}
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

"use strict";


/* ============================
   ARWORLD LOCAL ENGINE
============================ */

const DB_NAME="ARWORLD_DATABASE";

const STORE="posts";

const PSTORE="profile";

let db;

let posts=[];

let profile={
name:"AR Explorer",
bio:"Real dünya üçün rəqəmsal profil"
};

let pos=null;

let heading=null;

let stream=null;

let map=null;

let markers=[];

let file=null;


function $(id){
return document.getElementById(id);
}


/* ============================
   SECURITY
============================ */

function esc(s){

return String(s??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m]));

}


/* ============================
   ICONS
============================ */

function icon(type){

return({

profile:"👤",
text:"📝",
image:"📷",
video:"🎥",
car:"🚗",
business:"🏪",
tourism:"🏔️",
warning:"⚠️",
service:"🔧"

}[type]||"📍");

}


/* ============================
   TOAST
============================ */

function toast(message){

const t=$("toast");

t.textContent=message;

t.classList.add("show");

clearTimeout(window.__toast);

window.__toast=setTimeout(()=>{

t.classList.remove("show");

},2600);

}


/* ============================
   INDEXED DB
============================ */

function openDB(){

return new Promise((resolve,reject)=>{

const request=
indexedDB.open(DB_NAME,1);

request.onupgradeneeded=e=>{

const database=e.target.result;

if(!database.objectStoreNames.contains(STORE)){

database.createObjectStore(
STORE,
{keyPath:"id"}
);

}

if(!database.objectStoreNames.contains(PSTORE)){

database.createObjectStore(
PSTORE,
{keyPath:"id"}
);

}

};


request.onsuccess=e=>{

db=e.target.result;

resolve();

};

request.onerror=()=>reject(request.error);

});

}


function tx(store,mode,fn){

return new Promise((resolve,reject)=>{

const transaction=
db.transaction(store,mode);

const objectStore=
transaction.objectStore(store);

const request=fn(objectStore);

request.onsuccess=()=>{
resolve(request.result);
};

request.onerror=()=>{
reject(request.error);
};

});

}


/* ============================
   LOAD
============================ */

async function load(){

posts=
await tx(
STORE,
"readonly",
s=>s.getAll()
);

const p=
await tx(
PSTORE,
"readonly",
s=>s.get("me")
);

if(p){

profile=p.data;

}

ui();

feed();

}


/* ============================
   SAVE
============================ */

async function put(post){

await tx(
STORE,
"readwrite",
s=>s.put(post)
);

await load();

}


/* ============================
   VIEW
============================ */

function show(id){

document
.querySelectorAll(".view")
.forEach(x=>x.classList.remove("on"));

$(id).classList.add("on");


document
.querySelectorAll(".nav button[data-v]")
.forEach(b=>{

b.classList.toggle(
"on",
b.dataset.v===id
);

});


closePanels();


if(id==="mapView"){

setTimeout(initMap,80);

}

if(id==="feed"){

feed();

}

if(id==="profile"){

ui();

}

if(id==="ar"&&!stream){

startAR();

}

}


/* ============================
   PANELS
============================ */

function closePanels(){

document
.querySelectorAll(".panel")
.forEach(x=>x.classList.remove("on"));

}


function openCreate(){

closePanels();

$("create").classList.add("on");

if(pos){

$("lat").value=
pos.lat.toFixed(7);

$("lng").value=
pos.lng.toFixed(7);

}

}


function openMapSearch(){

show("mapView");

setTimeout(
()=>$("search").focus(),
100
);

}


/* ============================
   CAMERA + GPS
============================ */

async function startAR(){

try{

stream=
await navigator.mediaDevices.getUserMedia({

video:{

facingMode:{
ideal:"environment"
},

width:{
ideal:1920
},

height:{
ideal:1080

}

},

audio:false

});

$("camera").srcObject=stream;

}catch(e){

toast(
"Kamera üçün HTTPS və icazə lazımdır. GitHub Pages istifadə edin."
);

}


if(navigator.geolocation){

navigator.geolocation.watchPosition(

p=>{

pos={

lat:p.coords.latitude,

lng:p.coords.longitude,

acc:p.coords.accuracy

};


$("gps").textContent=
"GPS ±"+Math.round(
p.coords.accuracy
)+"m";


if(!$("lat").value){

$("lat").value=
pos.lat.toFixed(7);

$("lng").value=
pos.lng.toFixed(7);

}


renderAR();

if(map){

drawMap();

}

},

()=>{

$("gps").textContent=
"GPS icazəsi yoxdur";

},

{

enableHighAccuracy:true,

maximumAge:2000,

timeout:10000

}

);

}


/* ============================
   COMPASS
============================ */

if("DeviceOrientationEvent" in window){

let activate=()=>{

window.addEventListener(
"deviceorientationabsolute",
orient,
true
);

};

try{

if(
typeof DeviceOrientationEvent.requestPermission===
"function"
){

DeviceOrientationEvent
.requestPermission()
.then(x=>{

if(x==="granted"){

activate();

}

})
.catch(activate);

}else{

activate();

}

}catch(e){

activate();

}

}


renderAR();

}


/* ============================
   ORIENTATION
============================ */

function orient(e){

let h=null;


if(
typeof e.webkitCompassHeading===
"number"
){

h=e.webkitCompassHeading;

}

else if(
typeof e.alpha==="number"
){

h=(360-e.alpha)%360;

}


if(h!=null){

heading=h;

$("heading").textContent=
"Kompas "+Math.round(h)+"°";

renderAR();

}

}


/* ============================
   GEO MATH
============================ */

const rad=
x=>x*Math.PI/180;


function dist(a,b){

const R=6371000;

const d1=
rad(b.lat-a.lat);

const d2=
rad(b.lng-a.lng);

const x=
Math.sin(d1/2)**2+
Math.cos(rad(a.lat))*
Math.cos(rad(b.lat))*
Math.sin(d2/2)**2;

return 2*R*
Math.asin(
Math.sqrt(x)
);

}


function bear(a,b){

const y=
Math.sin(
rad(b.lng-a.lng)
)*
Math.cos(
rad(b.lat)
);

const x=
Math.cos(rad(a.lat))*
Math.sin(rad(b.lat))
-
Math.sin(rad(a.lat))*
Math.cos(rad(b.lat))*
Math.cos(
rad(b.lng-a.lng)
);

return(
Math.atan2(y,x)*
180/Math.PI+
360
)%360;

}


function fd(n){

return n<1000
?
Math.round(n)+" m"
:
(n/1000).toFixed(1)+" km";

}


/* ============================
   AR RENDER
============================ */

function renderAR(){

const box=$("arObjects");

box.innerHTML="";

if(!pos)return;


posts

.filter(p=>

p.lat!=null&&
p.lng!=null&&
(!p.expiresAt||
p.expiresAt>Date.now())

)

.forEach(p=>{

const d=
dist(pos,p);


if(
d>
Number(p.radius||300)
)return;


let x=50;


if(heading!=null){

let delta=
(
bear(pos,p)
-heading+
540
)%360-180;

x=
50+
delta/55*42;

}


x=
Math.max(
8,
Math.min(92,x)
);


let y=
38+
Math.min(
35,
d/
Math.max(
1,
Number(p.radius||300)
)*35
);


const el=
document.createElement("div");


el.className="arobj";


el.style.left=
x+"%";

el.style.top=
y+"%";


el.innerHTML=`

<b>
${icon(p.type)}
${esc(p.title)}
</b>

<small>
${fd(d)}
•
${esc(p.author||"AR Explorer")}
</small>

<em>
Detallara bax →
</em>

`;


el.onclick=
()=>detail(p.id);


box.appendChild(el);

});

}


/* ============================
   CURRENT GPS
============================ */

function useGPS(){

if(pos){

$("lat").value=
pos.lat.toFixed(7);

$("lng").value=
pos.lng.toFixed(7);

toast(
"Cari GPS əlavə edildi"
);

return;

}


navigator.geolocation?.getCurrentPosition(

p=>{

pos={

lat:p.coords.latitude,

lng:p.coords.longitude

};

useGPS();

},

()=>toast(
"GPS icazəsi yoxdur"
),

{
enableHighAccuracy:true
}

);

}


/* ============================
   MEDIA PREVIEW
============================ */

$("media").onchange=e=>{

file=
e.target.files?.[0]||null;

$("imgPrev").style.display="none";

$("vidPrev").style.display="none";


if(!file)return;


const url=
URL.createObjectURL(file);


if(
file.type.startsWith("video/")
){

$("vidPrev").src=url;

$("vidPrev").style.display=
"block";

}else{

$("imgPrev").src=url;

$("imgPrev").style.display=
"block";

}

};


/* ============================
   FILE -> DATA
============================ */

function dataURL(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=()=>
resolve(reader.result);

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* ============================
   CREATE AR OBJECT
============================ */

async function savePost(){

const title=
$("title").value.trim();

const lat=
+$("lat").value;

const lng=
+$("lng").value;


if(
!title||
!Number.isFinite(lat)||
!Number.isFinite(lng)
){

toast(
"Başlıq və düzgün koordinat tələb olunur"
);

return;

}


if(
file&&
file.size>
25*1024*1024
){

toast(
"Demo üçün media 25 MB-dan kiçik olmalıdır"
);

return;

}


let media=null;


if(file){

media={

type:file.type,

name:file.name,

data:
await dataURL(file)

};

}


const hours=
+$("expiry").value;


const post={

id:
crypto.randomUUID?
crypto.randomUUID():
Date.now()+"_"+Math.random(),

title,

type:
$("type").value,

desc:
$("desc").value.trim(),

lat,

lng,

radius:
Math.max(
10,
+$("radius").value||300
),

phone:
$("phone").value.trim(),

media,

author:
profile.name,

createdAt:
Date.now(),

expiresAt:
hours?
Date.now()+
hours*3600000:
0

};


await put(post);


file=null;

$("media").value="";

$("title").value="";

$("desc").value="";

$("phone").value="";

closePanels();

toast(
"AR obyekt koordinata ilə yadda saxlanıldı"
);

renderAR();

if(map){

drawMap();

}

}


/* ============================
   FEED MEDIA
============================ */

function mediaHTML(p){

if(!p.media)return"";


if(
p.media.type.startsWith("video/")
){

return`

<video
src="${p.media.data}"
controls
playsinline
preload="metadata">
</video>

`;

}


return`

<img
src="${p.media.data}"
loading="lazy">

`;

}


/* ============================
   FEED
============================ */

function feed(){

const list=
$("feedList");

list.innerHTML="";


const arr=
posts

.filter(p=>
!p.expiresAt||
p.expiresAt>Date.now()
)

.sort(
(x,y)=>
y.createdAt-x.createdAt
);


if(!arr.length){

list.innerHTML=`

<div class="empty">

<b>
Hələ paylaşım yoxdur
</b>

＋ ilə ilk AR obyektini yerləşdir.

</div>

`;

return;

}


arr.forEach(p=>{

const e=
document.createElement("article");

e.className="post";


e.innerHTML=`

${mediaHTML(p)}

<div class="body">

<b>
${icon(p.type)}
${esc(p.title)}
</b>

<div class="meta">

${esc(p.author||"AR Explorer")}

•

${new Date(
p.createdAt
).toLocaleString("az-AZ")}

•

${p.lat.toFixed(5)},
${p.lng.toFixed(5)}

</div>


${
p.desc?
`
<div class="desc">
${esc(p.desc)}
</div>
`
:""
}


<div
style="
margin-top:10px;
display:flex;
gap:7px">

<button
class="btn"
data-open="${p.id}">
AR-da aç
</button>

<button
class="btn"
data-route="${p.id}">
🧭 Marşrut
</button>

</div>

</div>

`;


list.appendChild(e);

});


list
.querySelectorAll("[data-open]")
.forEach(b=>{

b.onclick=
()=>detail(b.dataset.open);

});


list
.querySelectorAll("[data-route]")

()=>route(
posts.find(
p=>p.id===b.dataset.route
)
);

/* ============================
   DETAIL
============================ */

function detail(id){

const p=
posts.find(x=>x.id===id);

if(!p)return;


closePanels();


$("dtitle").textContent=
icon(p.type)+" "+p.title;


$("dmeta").textContent=
`${p.author||"AR Explorer"} • ${
pos?fd(dist(pos,p)):"GPS yoxdur"
} • ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`;


$("ddesc").textContent=
p.desc||"";


$("detailMedia").style.display=
"none";

$("detailVideo").style.display=
"none";


if(
p.media?.type.startsWith("video/")
){

$("detailVideo").src=
p.media.data;

$("detailVideo").style.display=
"block";

}

else if(p.media){

$("detailMedia").src=
p.media.data;

$("detailMedia").style.display=
"block";

}


$("call").style.display=
p.phone?
"block":
"none";


$("call").onclick=()=>{

location.href=
"tel:"+p.phone;

};


$("route").onclick=()=>route(p);


$("detail").classList.add("on");

}


/* ============================
   ROUTE
============================ */

function route(p){

if(!p)return;

window.open(

"https://www.google.com/maps/dir/?api=1&destination="+
encodeURIComponent(
p.lat+","+p.lng
),

"_blank"

);

}


/* ============================
   MAP
============================ */

function initMap(){

if(!map){

map=
L.map("map")
.setView(

pos?
[pos.lat,pos.lng]:
[40.4093,49.8671],

pos?
16:
11

);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:
"© OpenStreetMap contributors"

}

).addTo(map);

}


drawMap();

}


/* ============================
   DRAW MAP
============================ */

function drawMap(){

if(!map)return;


markers.forEach(
m=>map.removeLayer(m)
);

markers=[];


if(pos){

markers.push(

L.marker(
[pos.lat,pos.lng]
)

.addTo(map)

.bindPopup(
"📍 Siz buradasınız"
)

);

}


posts

.filter(p=>

p.lat!=null&&
(!p.expiresAt||
p.expiresAt>Date.now())

)

.forEach(p=>{

const m=

L.marker(
[p.lat,p.lng]
)

.addTo(map)

.bindPopup(`

<b>
${icon(p.type)}
${esc(p.title)}
</b>

<br>

<small>
${esc(p.desc||"")}
</small>

<br>

<button
onclick="detail('${p.id}')">
Ətraflı
</button>

`);

markers.push(m);

});

}


/* ============================
   SEARCH
============================ */

function searchPosts(){

const q=
$("search")
.value
.trim()
.toLowerCase();


const box=
$("results");


if(!q){

box.classList.remove("on");

return;

}


const found=
posts.filter(p=>

(
p.title+
" "+
p.desc+
" "+
p.type+
" "+
p.author
)
.toLowerCase()
.includes(q)

);


if(!found.length){

box.innerHTML=
'<div class="result">Nəticə yoxdur.</div>';

}

else{

box.innerHTML=
found
.slice(0,40)
.map(p=>`

<div
class="result"
onclick="focusPost('${p.id}')">

<b>
${icon(p.type)}
${esc(p.title)}
</b>

<small>
${esc(p.desc||"")}
•
${p.lat.toFixed(5)},
${p.lng.toFixed(5)}
</small>

</div>

`)
.join("");

}


box.classList.add("on");

}


/* ============================
   FOCUS
============================ */

function focusPost(id){

const p=
posts.find(
x=>x.id===id
);

$("results")
.classList.remove("on");


if(map){

map.setView(
[p.lat,p.lng],
18
);

}


detail(id);

}


$("search").addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

searchPosts();

}

});
