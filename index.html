<style>

:root{
  --bg:#000;

  --surface2:#111;

*{box-sizing:border-box}
html,body{

button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
button:active{transform:scale(.96)}
.hidden{display:none!important}

.app{height:100dvh;background:#000;position:relative}
.header{

  background:linear-gradient(#000,rgba(0,0,0,.85),transparent);
}
.icon-btn{
  width:42px;height:42px;border-radius:50%;

.icon-btn svg{width:21px;height:21px}
.logo{

.search{

}

}

.feed{
  height:100dvh;overflow-y:auto;overflow-x:hidden;

}
.feed::-webkit-scrollbar{display:none}

<script>
"use strict";

/* ============================================================
   GeyimDəyis P2P Pro
   Client-side / Gun.js / IndexedDB / localStorage
   ============================================================ */

const APP_VERSION = "p2p-v4";
const FEED_KEY = "p2p-feed-v4";
const FAV_KEY = "p2p-favs-v4";
const PROFILE_KEY = "myProfile";
const COMMENTS_KEY = "comments-v4";

let feedData = [];
let currentFilter = "";
let selectedMedia = [];
let currentCommentsItem = null;
let observer = null;
let db = null;
let gun = null;
let connected = false;

/* ---------- UTILITIES ---------- */

const $ = id => document.getElementById(id);

function uid(prefix="id"){
  return prefix + "_" + Date.now().toString(36) + "_" +
    Math.random().toString(36).slice(2,10);
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function normalize(value){
  return String(value ?? "").toLocaleLowerCase("az-AZ").trim();
}

function tagsArray(value){
  return String(value ?? "")
    .split(/[\s,]+/)
    .map(x => x.trim().replace(/^#/,""))
    .filter(Boolean)
    .slice(0,50);
}

function formatNumber(n){
  return Number(n || 0).toLocaleString("az-AZ");
}

function timeAgo(ts){
  const diff = Math.max(0,Date.now()-Number(ts||Date.now()));
  const m = Math.floor(diff/60000);
  if(m<1) return "indi";
  if(m<60) return m+" dəq";
  const h = Math.floor(m/60);
  if(h<24) return h+" saat";
  const d = Math.floor(h/24);
  return d+" gün";
}

function myProfile(){
  try{

/* ---------- INDEXEDDB ---------- */

function openDB(){
  return new Promise((resolve,reject)=>{
    if(db){resolve(db);return}
    const request=indexedDB.open("geyimdeyis-p2p",1);

    request.onupgradeneeded=e=>{
      const database=e.target.result;
      if(!database.objectStoreNames.contains("medias")){
        database.createObjectStore("medias",{keyPath:"id"});
      }
    };
    request.onsuccess=e=>{
      db=e.target.result;
      resolve(db);
    };
    request.onerror=()=>reject(request.error);
  });
}

async function saveMediaBlob(id,file){
  try{
    const database=await openDB();
    return new Promise((resolve,reject)=>{
      const tx=database.transaction("medias","readwrite");
      tx.objectStore("medias").put({
        id,
        blob:file,
        type:file.type,
        name:file.name || ""
      });
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error);
    });
  }catch(e){
    console.warn("IDB media save:",e);
  }
}

async function getMediaBlob(id){
  try{
    const database=await openDB();
    return new Promise(resolve=>{
      const tx=database.transaction("medias","readonly");
      const req=tx.objectStore("medias").get(id);
      req.onsuccess=()=>resolve(req.result || null);
      req.onerror=()=>resolve(null);
    });
  }catch(e){return null}
}

/* ---------- FILE -> DATA URL ---------- */

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/*
  Gun can gossip strings/objects, not arbitrary Blob objects.
  Small/medium media are therefore serialized as data URLs so a
  peer can reconstruct them. IndexedDB remains the local durable
  media cache.
*/
async function mediaToRecord(file,ownerId){
  const id=ownerId+"_"+uid("media");

  await saveMediaBlob(id,file);

  let dataUrl="";
  try{
    dataUrl=await fileToDataURL(file);
  }catch(e){}

  return {
    id,
    type:file.type.startsWith("video/") ? "video" : "image",
    mime:file.type,
    name:file.name || "",
    src:dataUrl
  };
}

/* ---------- LOCAL PERSISTENCE ---------- */

function saveLocal(){
  try{
    localStorage.setItem(FEED_KEY,JSON.stringify(feedData));
  }catch(e){
    /*
      Browsers have localStorage quotas. If large media cause quota
      exhaustion, metadata is retained and IndexedDB remains the
      local media cache.
    */
    try{
      const lightweight=feedData.map(item=>({
        ...item,
        media:(item.media||[]).map(m=>({
          id:m.id,type:m.type,mime:m.mime,name:m.name,src:""
        }))
      }));
      localStorage.setItem(FEED_KEY,JSON.stringify(lightweight));
    }catch(err){
      console.warn("local persistence quota reached");
    }
  }
}

function loadLocal(){
  try{
    const raw=localStorage.getItem(FEED_KEY);
    if(!raw)return [];
    const parsed=JSON.parse(raw);
    return Array.isArray(parsed)?parsed:[];
  }catch(e){return []}
}

function persist(item){
  saveLocal();

  if(!gun || !item)return;

  try{
    /*
      Each item is written under its stable ID.
      Gun's graph propagation lets connected peers gossip it.
    */
    gun.get("geyimdeyis").get("feed").get(item.id).put({
      id:item.id,
      u:item.u,
      av:item.av || "",
      name:item.name || "",
      item:item.item || "",
      want:item.want || "",
      wa:item.wa || "",
      brand:item.brand || "",
      size:item.size || "",
      desc:item.desc || "",
      tags:item.tags || [],
      media:item.media || [],
      ts:item.ts || Date.now(),
      likes:item.likes || 0
    });
  }catch(e){
    console.warn("Gun persist:",e);
  }
}

function loadGun(){
  if(!gun)return;

  try{
    gun.get("geyimdeyis").get("feed").map().once(data=>{
      if(!data || !data.id)return;

      const normalized={
        ...data,
        tags:Array.isArray(data.tags)
          ?data.tags
          :typeof data.tags==="object"
            ?Object.values(data.tags)
            :tagsArray(data.tags),
        media:Array.isArray(data.media)
          ?data.media
          :typeof data.media==="object"
            ?Object.values(data.media)
            :[]
      };

      const index=feedData.findIndex(x=>x.id===normalized.id);

      if(index===-1){
        feedData.push(normalized);
      }else{
        feedData[index]={...feedData[index],...normalized};
      }

      feedData.sort((a,b)=>(b.ts||0)-(a.ts||0));
      saveLocal();

      if(!currentFilter) renderFeed();
      else doSearch(currentFilter,false);
    });
  }catch(e){
    console.warn("Gun load:",e);
  }
}

/* ---------- COMMENTS ---------- */

function getComments(){
  try{return JSON.parse(localStorage.getItem(COMMENTS_KEY)||"{}")}
  catch(e){return {}}
}

function saveComments(obj){
  localStorage.setItem(COMMENTS_KEY,JSON.stringify(obj));
}

function commentData(itemId){
  const all=getComments();
  return Array.isArray(all[itemId])?all[itemId]:[];
}

function publishComment(itemId,comment){
  const all=getComments();
  if(!Array.isArray(all[itemId]))all[itemId]=[];
  all[itemId].push(comment);
  saveComments(all);

  if(gun){
    try{
      gun.get("geyimdeyis").get("comments").get(itemId)
        .get(comment.ts+"_"+comment.u).put(comment);
    }catch(e){}
  }
}

/* ---------- MEDIA PREVIEW ---------- */

function resetSelectedMedia(){
  selectedMedia.forEach(x=>{
    if(x.previewUrl){
      try{URL.revokeObjectURL(x.previewUrl)}catch(e){}
    }
  });
  selectedMedia=[];
  renderSelectedMedia();
}

function addFiles(files){
  [...files].forEach(file=>{
    if(!file.type.startsWith("image/") &&
       !file.type.startsWith("video/"))return;

    const previewUrl=URL.createObjectURL(file);
    selectedMedia.push({
      file,
      previewUrl,
      type:file.type.startsWith("video/")?"video":"image"
    });
  });
  renderSelectedMedia();
}

function renderSelectedMedia(){
  const grid=$("selectedGrid");
  if(!grid)return;

  grid.innerHTML="";

  selectedMedia.forEach((m,i)=>{
    const box=document.createElement("div");
    box.className="selected";

    if(m.type==="video"){
      box.innerHTML=`
        <video src="${m.previewUrl}" muted playsinline></video>
        <button type="button" data-remove="${i}">
          <i data-lucide="x"></i>
        </button>`;
    }else{
      box.innerHTML=`
        <img src="${m.previewUrl}" alt="">
        <button type="button" data-remove="${i}">
          <i data-lucide="x"></i>
        </button>`;
    }

    grid.appendChild(box);
  });

  grid.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.onclick=()=>{
      const i=Number(btn.dataset.remove);
      const old=selectedMedia[i];
      if(old?.previewUrl){
        try{URL.revokeObjectURL(old.previewUrl)}catch(e){}
      }
      selectedMedia.splice(i,1);
      renderSelectedMedia();
    };
  });

  renderIcons();
}

/* ---------- UPLOAD ---------- */

async function publishItem(){
  const name=$("nameIn").value.trim();
  const item=$("itemIn").value.trim();
  const want=$("wantIn").value.trim();
  const wa=$("waIn").value.replace(/[^\d+]/g,"");
  const brand=$("brandIn").value.trim();
  const size=$("sizeIn").value.trim();
  const desc=$("descIn").value.trim();
  const tags=tagsArray($("tagsIn").value);

  if(!name){
    alert("Adınızı daxil edin.");
    $("nameIn").focus();
    return;
  }

  if(!item){
    alert("Nəyi dəyişdirdiyinizi yazın.");
    $("itemIn").focus();
    return;
  }

  if(!wa){
    alert("WhatsApp nömrəsini daxil edin.");
    $("waIn").focus();
    return;
  }

  if(!selectedMedia.length){
    alert("Ən azı bir şəkil və ya video əlavə edin.");
    return;
  }

  const btn=$("publishBtn");
  btn.disabled=true;
  btn.textContent="Hazırlanır...";

  try{
    let profile=myProfile();

    let avatar=profile.av || "";
    const avFile=$("avIn").files[0];

    if(avFile){
      avatar=await fileToDataURL(avFile);
    }

    profile={
      ...profile,
      u:profile.u || uid("user"),
      name,
      wa,
      av:avatar
    };
    saveProfile(profile);

    const itemId=uid("item");

    const media=[];
    for(const selected of selectedMedia){
      const rec=await mediaToRecord(selected.file,itemId);
      media.push(rec);
    }

    const record={
      id:itemId,
      u:profile.u,
      av:avatar,
      name,
      item,
      want,
      wa,
      brand,
      size,
      desc,
      tags,
      media,
      ts:Date.now(),
      likes:0
    };

    feedData.unshift(record);
    feedData.sort((a,b)=>b.ts-a.ts);

    persist(record);
    saveLocal();

    closeModal("uploadModal");
    resetUploadForm();

    currentFilter="";
    $("searchInput").value="";
    renderFeed();
    scrollTopFeed();

  }catch(e){
    console.error(e);
    alert("Elan hazırlanarkən xəta baş verdi.");
  }finally{
    btn.disabled=false;
    btn.innerHTML=`
      <i data-lucide="radio-tower" style="width:17px;vertical-align:-3px"></i>
      P2P şəbəkəyə göndər`;
    renderIcons();
  }
}

function resetUploadForm(){
  [
    "nameIn","itemIn","wantIn","waIn","brandIn",
    "sizeIn","descIn","tagsIn"
  ].forEach(id=>$(id).value="");

  $("avIn").value="";
  $("imgIn").value="";
  $("vidIn").value="";
  $("avatarPreview").src="";
  resetSelectedMedia();
}

$("imgIn").addEventListener("change",e=>addFiles(e.target.files));
$("vidIn").addEventListener("change",e=>addFiles(e.target.files));

$("avIn").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;
  $("avatarPreview").src=URL.createObjectURL(file);
});

/* ---------- SEARCH ---------- */

function searchableText(x){
  return [
    x.brand,x.size,x.tags,x.name,x.item,x.want,
    x.desc,x.wa
  ].join(" ");
}

function doSearch(value=$("searchInput").value,scroll=true){
  currentFilter=normalize(value);

  if(scroll){
    renderFeed();
    scrollTopFeed();
  }else{
    renderFeed();
  }
}

function filteredFeed(){
  let arr=[...feedData];

  if(currentFilter){
    arr=arr.filter(item=>{
      const text=normalize(searchableText(item));
      return text.includes(currentFilter);
    });
  }

  return arr.sort((a,b)=>(b.ts||0)-(a.ts||0));
}

/* ---------- FEED RENDER ---------- */

function mediaHtml(item){
  const media=Array.isArray(item.media)?item.media:[];

  if(!media.length){
    return `<div class="media-slide">
      <div class="media-placeholder"><i data-lucide="image-off"></i></div>
    </div>`;
  }

  return media.map((m,i)=>{
    if(m.type==="video"){
      return `
      <div class="media-slide">
        <video
          class="feed-video"
          data-media-id="${esc(m.id)}"
          src="${esc(m.src||"")}"
          ${i===0?"autoplay":""}
          muted
          loop
          playsinline
          preload="metadata"
          controlslist="nodownload">
        </video>
      </div>`;
    }

    return `
      <div class="media-slide">
        <img
          loading="${i===0?"eager":"lazy"}"
          src="${esc(m.src||"")}"
          data-media-id="${esc(m.id)}"
          alt="${esc(item.item||"Geyim")}">
      </div>`;
  }).join("");
}

function renderFeed(){
  const feed=$("feed");
  const arr=filteredFeed();

  if(!arr.length){
    feed.innerHTML=`
      <section class="empty">
        <i data-lucide="${currentFilter?"search-x":"shirt"}"></i>
        <strong>${currentFilter?"Nəticə tapılmadı":"Hələ elan yoxdur"}</strong>
        <p>${currentFilter
          ?"Başqa söz, marka, ölçü və ya tag ilə axtarın."
          :"İlk barter elanını yerləşdirin və P2P şəbəkəyə qoşulun."
        }</p>
        ${!currentFilter
          ?`<button class="primary" style="max-width:250px" onclick="openModal('uploadModal')">
              <i data-lucide="plus"></i> Elan yerləşdir
            </button>`:""}
      </section>`;
    renderIcons();
    return;
  }

  feed.innerHTML=arr.map(item=>{
    const tags=Array.isArray(item.tags)?item.tags:tagsArray(item.tags);
    const comments=commentData(item.id).length;
    const liked=isFav(item.id);

    return `
    <section class="feed-item" data-id="${esc(item.id)}">
      <div class="media-scroll">
        ${mediaHtml(item)}
      </div>

      ${item.media?.length>1
        ?`<div class="media-dots">
          ${item.media.map((_,i)=>
            `<span class="media-dot ${i===0?"active":""}"></span>`
          ).join("")}
        </div>`:""}

      <button class="sound-btn" data-sound="${esc(item.id)}">
        <i data-lucide="volume-x"></i><span>Səs</span>
      </button>

      <div class="feed-gradient"></div>

      <div class="actions">
        <button class="action ${liked?"liked":""}"
          data-like="${esc(item.id)}" aria-label="Bəyən">
          <i data-lucide="heart" ${liked?'fill="currentColor"':""}></i>
          <span class="action-count">${formatNumber(item.likes||0)}</span>
        </button>

        <button class="action"
          data-comment="${esc(item.id)}" aria-label="Şərhlər">
          <i data-lucide="message-square"></i>
          <span class="action-count">${formatNumber(comments)}</span>
        </button>

        <button class="action"
          data-share="${esc(item.id)}" aria-label="Paylaş">
          <i data-lucide="share-2"></i>
        </button>
      </div>

      <div class="overlay">
        <div class="author" data-profile="${esc(item.u)}">
          <img class="avatar" src="${esc(item.av||"")}" alt=""
               onerror="this.style.display='none'">
          <div>
            <div class="author-name">${esc(item.name||"İstifadəçi")}</div>
            <div class="author-wa">${esc(item.wa||"")} · ${timeAgo(item.ts)}</div>
          </div>
        </div>

        <div class="description">${esc(item.desc||item.item)}</div>

        <div class="want">
          <strong>Dəyişirəm:</strong> ${esc(item.item)}
          ${item.want?`<br><strong>İstəyirəm:</strong> ${esc(item.want)}`:""}
        </div>

        <div class="tags">
          ${tags.map(t=>
            `<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`
          ).join("")}
        </div>
      </div>

      <a class="whatsapp"
         href="https://wa.me/${encodeURIComponent(String(item.wa||"").replace(/\D/g,""))}"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="WhatsApp">
        <i data-lucide="message-circle"></i>
      </a>
    </section>`;
  }).join("");

  bindFeedEvents();
  setupFeedObserver();
  renderIcons();
}

function bindFeedEvents(){
  $("feed").querySelectorAll("[data-like]").forEach(btn=>{
    btn.onclick=()=>toggleFav(btn.dataset.like);
  });

  $("feed").querySelectorAll("[data-comment]").forEach(btn=>{
    btn.onclick=()=>openComments(btn.dataset.comment);
  });

  $("feed").querySelectorAll("[data-share]").forEach(btn=>{
    btn.onclick=()=>shareItem(btn.dataset.share);
  });

  $("feed").querySelectorAll("[data-profile]").forEach(el=>{
    el.onclick=()=>openProfile(el.dataset.profile);
  });

  $("feed").querySelectorAll("[data-tag]").forEach(btn=>{
    btn.onclick=()=>{
      $("searchInput").value="#"+btn.dataset.tag;
      doSearch(btn.dataset.tag);
    };
  });

  $("feed").querySelectorAll("[data-sound]").forEach(btn=>{
    btn.onclick=()=>{
      const section=btn.closest(".feed-item");
      const videos=section.querySelectorAll("video");
      const anyMuted=[...videos].some(v=>v.muted);

      videos.forEach(v=>{
        v.muted=!anyMuted;
        if(!v.muted){
          v.volume=.8;
          v.play().catch(()=>{});
        }
      });

      btn.innerHTML=anyMuted
        ?`<i data-lucide="volume-2"></i><span>Səs</span>`
        :`<i data-lucide="volume-x"></i><span>Səs</span>`;
      renderIcons();
    };
  });

  $("feed").querySelectorAll(".media-scroll").forEach(scroller=>{
    scroller.addEventListener("scroll",()=>{
      const width=scroller.clientWidth;
      const index=Math.round(scroller.scrollLeft/width);
      const dots=scroller.parentElement.querySelectorAll(".media-dot");
      dots.forEach((d,i)=>d.classList.toggle("active",i===index));
    },{passive:true});
  });
}

/* ---------- INTERSECTION / SEEDER ---------- */

function setupFeedObserver(){
  if(observer)observer.disconnect();

  observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const section=entry.target;
      const id=section.dataset.id;
      const item=feedData.find(x=>x.id===id);

      if(entry.isIntersecting && entry.intersectionRatio>=.65){
        /*
          Every viewer becomes a seeder by re-publishing the item
          currently visible in the local Gun graph.
        */
        if(item){
          persist(item);
          seedVisibleMedia(item);
        }

        section.querySelectorAll("video").forEach(v=>{
          v.muted=true;
          v.play().catch(()=>{});
        });
      }else{
        section.querySelectorAll("video").forEach(v=>v.pause());
      }
    });
  },{threshold:[0,.65,.9]});

  document.querySelectorAll(".feed-item").forEach(x=>observer.observe(x));
}

async function seedVisibleMedia(item){
  /*
    If a media source is missing locally, try IndexedDB.
    This keeps the browser's own durable media cache usable
    even after an object URL has expired.
  */
  if(!item.media)return;

  for(const media of item.media){
    if(media.src)continue;
    const cached=await getMediaBlob(media.id);
    if(cached?.blob){
      try{
        media.src=URL.createObjectURL(cached.blob);
      }catch(e){}
    }
  }
}

/* ---------- LIKES / FAVORITES ---------- */

function toggleFav(id){
  const favs=getFavs();
  const index=favs.indexOf(id);

  if(index>=0)favs.splice(index,1);
  else favs.push(id);

  setFavs(favs);

  const item=feedData.find(x=>x.id===id);
  if(item){
    item.likes=Math.max(0,Number(item.likes||0)+(index>=0?-1:1));
    persist(item);
  }

  renderFeed();
}

function renderFavorites(){
  const favs=getFavs();
  if(!favs.length){
    currentFilter="";
    $("searchInput").value="";
    renderFeed();
    return;
  }

  const arr=feedData
    .filter(x=>favs.includes(x.id))
    .sort((a,b)=>b.ts-a.ts);

  const old=currentFilter;
  currentFilter="";

  const original=filteredFeed;
  const tempFeed=feedData;
  feedData=arr;
  renderFeed();
  feedData=tempFeed;
  currentFilter=old;
}

/* ---------- SHARE ---------- */

async function shareItem(id){
  const item=feedData.find(x=>x.id===id);
  if(!item)return;

  const url=location.href.split("#")[0]+"#item="+encodeURIComponent(id);
  const text=
    `GeyimDəyis barter elanı\n`+
    `${item.name||"İstifadəçi"} — ${item.item||"Geyim"}\n`+
    `İstəyir: ${item.want||"Barter"}\n`;

  if(navigator.share){
    try{
      await navigator.share({
        title:"GeyimDəyis — barter elanı",
        text,
        url
      });
      return;
    }catch(e){
      if(e?.name==="AbortError")return;
    }
  }

  try{
    await navigator.clipboard.writeText(text+url);
    alert("Paylaşım linki kopyalandı.");
  }catch(e){
    prompt("Linki kopyalayın:",url);
  }
}

/* ---------- COMMENTS ---------- */

function openComments(itemId){
  currentCommentsItem=itemId;
  const item=feedData.find(x=>x.id===itemId);

  $("commentTitle").textContent=
    `Şərhlər · ${commentData(itemId).length}`;

  renderComments(itemId);
  $("commentBox").classList.add("open");
  $("commentInput").focus();
}

function closeComments(){
  $("commentBox").classList.remove("open");
  currentCommentsItem=null;
}

function renderComments(itemId){
  const list=$("commentsList");
  const comments=commentData(itemId);

  if(!comments.length){
    list.innerHTML=`
      <div style="text-align:center;color:#666;padding:30px 10px;font-size:12px">
        Hələ şərh yoxdur. İlk şərhi siz yazın.
      </div>`;
    renderIcons();
    return;
  }

  list.innerHTML=comments.map((c,i)=>`
    <div class="comment">
      <div class="comment-main">
        <img class="comment-avatar" src="${esc(c.av||"")}" alt=""
             onerror="this.style.display='none'">
        <div>
          <div class="comment-user">
            ${esc(c.u||"İstifadəçi")}
            <span style="color:#666;font-weight:400"> · ${timeAgo(c.ts)}</span>
          </div>
          <div class="comment-text">${esc(c.text)}</div>
        </div>
      </div>

      <div class="comment-actions">
        <button data-reply="${i}">Cavabla</button>
      </div>

      ${(c.replies||[]).map(r=>`
        <div class="reply">
          <div class="comment-user">${esc(r.u||"İstifadəçi")}</div>
          <div class="comment-text">${esc(r.text)}</div>
        </div>
      `).join("")}
    </div>
  `).join("");

  list.querySelectorAll("[data-reply]").forEach(btn=>{
    btn.onclick=()=>replyToComment(itemId,Number(btn.dataset.reply));
  });

  renderIcons();
}

function sendComment(){
  const text=$("commentInput").value.trim();
  if(!text || !currentCommentsItem)return;

  const profile=myProfile();

  const comment={
    u:profile.name||"İstifadəçi",
    av:profile.av||"",
    text,
    ts:Date.now(),
    replies:[]
  };

  publishComment(currentCommentsItem,comment);
  $("commentInput").value="";
  renderComments(currentCommentsItem);

  const item=feedData.find(x=>x.id===currentCommentsItem);
  if(item)renderFeed();
}

function replyToComment(itemId,index){
  const answer=prompt("Rəyə cavabınız:");
  if(!answer || !answer.trim())return;

  const all=getComments();
  const comments=all[itemId]||[];
  if(!comments[index])return;

  const profile=myProfile();

  if(!Array.isArray(comments[index].replies)){
    comments[index].replies=[];
  }

  comments[index].replies.push({
    u:profile.name||"İstifadəçi",
    text:answer.trim()
  });

  all[itemId]=comments;
  saveComments(all);

  if(gun){
    try{
      gun.get("geyimdeyis").get("comments")
        .get(itemId).get(comments[index].ts+"_"+comments[index].u)
        .put(comments[index]);
    }catch(e){}
  }

  renderComments(itemId);
}

/* ---------- PROFILE ---------- */

function openProfile(userId){
  const profileItems=feedData.filter(x=>x.u===userId);
  const first=profileItems[0] || {};
  const profile=userId===myProfile().u ? myProfile() : first;

  const avatar=profile.av||"";
  const name=profile.name||first.name||"İstifadəçi";
  const wa=profile.wa||first.wa||"";

  $("profileContent").innerHTML=`
    <div class="profile-center">
      <img class="big-avatar" src="${esc(avatar)}" alt=""
           onerror="this.style.display='none'">
      <div class="profile-name">${esc(name)}</div>
      <div class="profile-phone">${esc(wa)}</div>
      <div class="profile-count">${profileItems.length} elan</div>

      ${wa?`
        <a class="profile-wa"
           href="https://wa.me/${encodeURIComponent(String(wa).replace(/\D/g,""))}"
           target="_blank" rel="noopener noreferrer">
          <i data-lucide="message-circle"></i>
          WhatsApp
        </a>`:""}
    </div>

    <div class="profile-grid">
      ${profileItems.map(item=>{
        const m=item.media?.[0];
        if(!m)return `<div class="profile-item"></div>`;
        return m.type==="video"
          ?`<div class="profile-item">
              <video src="${esc(m.src||"")}" muted playsinline></video>
            </div>`
          :`<div class="profile-item">
              <img src="${esc(m.src||"")}" loading="lazy" alt="">
            </div>`;
      }).join("")}
    </div>
  `;

  openModal("profileModal");
  renderIcons();
}

function handleHash(){
  const hash=location.hash;
  if(!hash.startsWith("#item="))return;

  const id=decodeURIComponent(hash.substring(6));
  const index=filteredFeed().findIndex(x=>x.id===id);

  if(index>=0){
    const node=$("feed").querySelectorAll(".feed-item")[index];
    node?.scrollIntoView({behavior:"smooth"});
  }
}

/* ---------- STARTUP ---------- */

async function boot(){
  try{await openDB()}catch(e){}

  feedData=loadLocal();
  feedData.sort((a,b)=>(b.ts||0)-(a.ts||0));

  const profile=myProfile();

  if(profile.av){
    $("avatarPreview").src=profile.av;
  }

  renderFeed();
  updateP2PStatus();
  loadGun();
  renderIcons();

  setTimeout(handleHash,500);
}

/* ---------- PERIODIC P2P SEED ---------- */

setInterval(()=>{
  if(!navigator.onLine || !gun)return;

  /*
    Re-seed a bounded number of newest records so an active browser
    participates in gossip without creating an uncontrolled write loop.
  */
  feedData.slice(0,20).forEach(item=>{
    try{
      gun.get("geyimdeyis").get("feed").get(item.id).put({
        id:item.id,
        u:item.u,
        av:item.av||"",
        name:item.name||"",
        item:item.item||"",
        want:item.want||"",
        wa:item.wa||"",
        brand:item.brand||"",
        size:item.size||"",
        desc:item.desc||"",
        tags:item.tags||[],
        media:item.media||[],
        ts:item.ts||0,
        likes:item.likes||0
      });
    }catch(e){}
  });
},30000);
