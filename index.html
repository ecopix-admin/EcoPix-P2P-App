<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Avatar Messencer Prototipi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 65vh;
            position: relative;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            background: #1e293b;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .subtitle-box {
            min-height: 40px;
            background: #334155;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 15px;
            color: #38bdf8;
            text-align: center;
            word-wrap: break-word;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 16px;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            background: #0284c7;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="chat-container">
        <div class="subtitle-box" id="subtitles">Mesajınızı daxil edin və "Göndər" düyməsini basın...</div>
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Mesajı bura yazın (məs: Salam, xoş gəldiniz!)..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">Göndər</button>
        </div>
    </div>

    <script>
        // --- 1. Three.js 3D Səhnəsinin Qurulması ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // İşıqlandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(2, 4, 3);
        scene.add(dirLight);

        // --- 2. 3D Avatar (Stylized Head & Mouth Model) Yaradılması ---
        const avatarGroup = new THREE.Group();

        // Baş
        const headGeo = new THREE.SphereGeometry(0.8, 32, 32);
        headGeo.scale(1, 1.2, 0.9);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.3 });
        const head = new THREE.Mesh(headGeo, headMat);
        avatarGroup.add(head);

        // Gözlər
        const eyeGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });

        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.28, 0.2, 0.72);
        avatarGroup.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.28, 0.2, 0.72);
        avatarGroup.add(rightEye);

        // Ağız (Lipsync üçün animasiya olunan hissə)
        const mouthGeo = new THREE.RingGeometry(0.05, 0.15, 32);
        const mouthMat = new THREE.MeshBasicMaterial({ color: 0xc0392b, side: THREE.DoubleSide });
        const mouth = new THREE.Mesh(mouthGeo, mouthMat);
        mouth.position.set(0, -0.3, 0.75);
        avatarGroup.add(mouth);

        scene.add(avatarGroup);

        // --- 3. Lipsync və Danışıq Məntiqi ---
        let isSpeaking = false;
        let audioAudioContext = null;

        function animateMouthAndBody() {
            requestAnimationFrame(animateMouthAndBody);

            const time = Date.now() * 0.003;

            if (isSpeaking) {
                // Ağız açılıb-bağlanması (Səsə uyğun variasiyalı)
                const mouthOpenScaleY = 0.5 + Math.abs(Math.sin(time * 12)) * 1.8;
                const mouthOpenScaleX = 0.8 + Math.abs(Math.cos(time * 8)) * 0.5;
                mouth.scale.set(mouthOpenScaleX, mouthOpenScaleY, 1);

                // Başın danışarkən hərəkət etməsi (Gestures)
                avatarGroup.rotation.y = Math.sin(time * 3) * 0.15;
                avatarGroup.rotation.x = Math.cos(time * 4) * 0.08;
                avatarGroup.position.y = Math.sin(time * 5) * 0.05;
            } else {
                // Təbii gözləmə halı (Idle animation)
                mouth.scale.set(1, 0.2, 1);
                avatarGroup.rotation.y = Math.sin(time * 0.8) * 0.05;
                avatarGroup.rotation.x = 0;
                avatarGroup.position.y = Math.sin(time * 1.5) * 0.02;
            }

            renderer.render(scene, camera);
        }

        animateMouthAndBody();

        // --- 4. Web Speech API (Text-To-Speech) İnreqrasiyası ---
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const subtitles = document.getElementById('subtitles');
            const sendBtn = document.getElementById('sendBtn');
            const text = input.value.trim();

            if (!text) return;

            subtitles.innerText = `💬 "${text}"`;
            input.value = '';
            sendBtn.disabled = true;

            if ('speechSynthesis' in window) {
                // Əvvəlki nitqi saxlayırıq
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                
                // Mümkünsə Azərbaycan dilini, yoxdursa standart dili seçir
                const voices = window.speechSynthesis.getVoices();
                const azVoice = voices.find(v => v.lang.includes('az') || v.lang.includes('tr'));
                if (azVoice) utterance.voice = azVoice;

                utterance.rate = 1;
                utterance.pitch = 1;

                utterance.onstart = () => {
                    isSpeaking = true;
                };

                utterance.onend = () => {
                    isSpeaking = false;
                    sendBtn.disabled = false;
                    subtitles.innerText = 'Mesaj oxundu. Yenisini yazın...';
                };

                utterance.onerror = () => {
                    isSpeaking = false;
                    sendBtn.disabled = false;
                };

                window.speechSynthesis.speak(utterance);
            } else {
                alert("Brauzeriniz Speech Synthesis dəstəkləmir.");
                sendBtn.disabled = false;
            }
        }

        // Enter düyməsi ilə göndərmək üçün
        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Ekran ölçüsü dəyişdikdə 3D canvas-ı uyğunlaşdırmaq
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
