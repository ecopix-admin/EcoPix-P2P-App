<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090b10">
<title>LinguaKey — Professional Smart Keyboard Engine</title>

<style>
:root {
    --accent: #ff3b6b;
    --accent-glow: rgba(255, 59, 107, 0.35);
    --bg: #090b10;
    --surface: #11151d;
    --surface-border: #202631;
    --key-bg: #1c222d;
    --key-active: #2a3342;
    --key-special: #141a24;
    --text-main: #f1f3f6;
    --text-muted: #858e9d;
    --success: #5de07e;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

body {
    background: #040507;
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
    position: relative;
}

/* HEADER */
.header {
    height: 60px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--surface-border);
    background: rgba(13, 16, 22, 0.8);
    backdrop-filter: blur(10px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #ff6688);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 15px var(--accent-glow);
}

.brand-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.3px;
}

.brand-subtitle {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 500;
}

.engine-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--success);
    font-weight: 600;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
}

/* LANG BAR */
.lang-selector {
    margin: 10px 14px;
    height: 42px;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
}

.lang-badge {
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
}

.swap-btn {
    width: 32px;
    height: 28px;
    border-radius: 8px;
    background: #1c222d;
    color: var(--text-main);
    border: 1px solid var(--surface-border);
    font-size: 14px;
    cursor: pointer;
    transition: var(--transition);
}

.swap-btn:active {
    transform: rotate(180deg) scale(0.9);
}

/* CHAT */
.chat-viewport {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
}

.chat-viewport::-webkit-scrollbar {
    width: 4px;
}
.chat-viewport::-webkit-scrollbar-thumb {
    background: var(--surface-border);
    border-radius: 4px;
}

.msg {
    max-width: 85%;
    display: flex;
    flex-direction: column;
}

.msg.in { align-self: flex-start; }
.msg.out { align-self: flex-end; }

.bubble {
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
}

.msg.in .bubble {
    background: #161b24;
    border: 1px solid var(--surface-border);
    border-bottom-left-radius: 4px;
}

.msg.out .bubble {
    background: linear-gradient(135deg, var(--accent), #ff527b);
    color: #fff;
    border-bottom-right-radius: 4px;
}

.sub-text {
    font-size: 11px;
    margin-top: 4px;
    opacity: 0.8;
}

.msg.in .sub-text { color: var(--success); }
.msg.out .sub-text { color: rgba(255, 255, 255, 0.85); text-align: right; }

.meta {
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 3px;
}
.msg.out .meta { text-align: right; }

/* SUGGESTIONS */
.suggest-bar {
    padding: 6px 12px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    background: #0c0f15;
    border-top: 1px solid var(--surface-border);
}

.suggest-bar::-webkit-scrollbar { display: none; }

.chip {
    flex: none;
    border: 1px solid var(--surface-border);
    background: #141923;
    color: var(--text-main);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: var(--transition);
}

.chip.ai {
    border-color: var(--accent);
    background: rgba(255, 59, 107, 0.1);
}

.chip:active { transform: scale(0.95); }

/* INPUT CONTROLS */
.input-panel {
    background: var(--surface);
    padding: 8px 12px;
    border-top: 1px solid var(--surface-border);
}

.input-wrapper {
    display: flex;
    gap: 8px;
    align-items: flex-end;
}

textarea {
    flex: 1;
    height: 44px;
    max-height: 100px;
    resize: none;
    border-radius: var(--radius-md);
    border: 1px solid var(--surface-border);
    background: #090b10;
    color: var(--text-main);
    outline: none;
    padding: 11px;
    font-size: 14px;
    font-family: inherit;
    transition: var(--transition);
}

textarea:focus {
    border-color: var(--accent);
}

.action-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    border: 1px solid var(--surface-border);
    background: var(--key-bg);
    color: var(--text-main);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.action-btn.send-btn {
    background: linear-gradient(135deg, var(--accent), #ff527b);
    border: none;
    box-shadow: 0 4px 12px var(--accent-glow);
}

.action-btn:active { transform: scale(0.92); }

/* TOOLBAR */
.tools-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 8px;
}
.tools-row::-webkit-scrollbar { display: none; }

.t-btn {
    flex: none;
    height: 30px;
    padding: 0 10px;
    border-radius: 8px;
    background: var(--key-special);
    color: var(--text-muted);
    border: 1px solid var(--surface-border);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
}

.t-btn.active {
    background: rgba(255, 59, 107, 0.15);
    border-color: var(--accent);
    color: var(--accent);
}

/* KEYBOARD LAYOUT */
.keyboard {
    background: #090b10;
    padding: 6px 4px 10px;
    border-top: 1px solid var(--surface-border);
}

.row {
    display: flex;
    gap: 3px;
    margin-bottom: 5px;
    justify-content: center;
}

.key {
    flex: 1;
    height: 42px;
    max-width: 44px;
    border: 0;
    border-radius: 6px;
    background: var(--key-bg);
    color: var(--text-main);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 3px 0 #000;
    transition: background 0.1s, transform 0.05s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.key:active {
    background: var(--key-active);
    transform: translateY(2px);
    box-shadow: 0 1px 0 #000;
}

.key.sp {
    background: var(--key-special);
    flex: 1.4;
    max-width: 60px;
    font-size: 13px;
}

.key.space-key {
    flex: 4;
    max-width: none;
}

.key.tr-key {
    background: linear-gradient(135deg, var(--accent), #ff527b);
    font-weight: 700;
    font-size: 12px;
    flex: 1.8;
    max-width: 80px;
}

/* THEMES ENGINE OVERRIDES */
body.theme-neon .key { border: 1px solid var(--accent); box-shadow: 0 0 5px var(--accent-glow); }
body.theme-classic .key { background: #e3e6eb; color: #111; box-shadow: 0 2px 0 #a0a5b0; }
body.theme-classic .keyboard { background: #c5cb3; }

/* TOAST */
.toast {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: #fff;
    color: #000;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: var(--transition);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 1000;
}

.toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

@media(min-width: 600px) {
    .app {
        height: 850px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--surface-border);
    }
}
</style>
Head>
<body>

<div class="app">

    <header class="header">
        <div class="brand">
            <div class="brand-icon" id="appIcon">♥</div>
            <div>
                <div class="brand-title">LinguaKey</div>
                <div class="brand-subtitle">v2.4 Engine Active</div>
            </div>
        </div>
        <div class="engine-status">
            <span class="status-dot"></span> LIVE API
        </div>
    </header>

    <div class="lang-selector">
        <div class="lang-badge" id="sourceLangLbl">🇦🇿 Azərbaycan</div>
        <button class="swap-btn" id="btnSwap">⇄</button>
        <div class="lang-badge" id="targetLangLbl">🇬🇧 English</div>
    </div>

    <div class="chat-viewport" id="chatViewport">
        <div class="msg in">
            <div class="bubble">Hello! How can I assist you with your project today?</div>
            <div class="sub-text">🇦🇿 Salam! Bu gün layihənizdə sizə necə kömək edə bilərəm?</div>
            <div class="meta">10:00 AM</div>
        </div>
    </div>

    <div class="suggest-bar" id="suggestBar">
        <button class="chip ai" data-text="Bəli, tamamilə razıyam.">🤖 Bəli, tamamilə razıyam.</button>
        <button class="chip" data-text="Bir az sonra baxacağam.">Bir az sonra baxacağam.</button>
        <button class="chip" data-text="Zəhmət olmasa təfərrüatları yazın.">Zəhmət olmasa təfərrüatları yazın.</button>
    </div>

    <div class="input-panel">
        <div class="input-wrapper">
            <button class="action-btn" id="btnMic">🎤</button>
            <textarea id="txtInput" placeholder="Mesaj yazın..."></textarea>
            <button class="action-btn send-btn" id="btnSend">➤</button>
        </div>
        <div class="tools-row">
            <button class="t-btn active" id="btnToggleTheme">🎨 Temalar</button>
            <button class="t-btn" id="btnAutoTr">🌐 Avto Tərcümə: AÇIQ</button>
            <button class="t-btn" id="btnClearChat">🗑️ Təmizlə</button>
        </div>
    </div>

    <!-- AZERBAIJANI ALPHABET KEYBOARD -->
    <div class="keyboard" id="keyboard">
        <div class="row">
            <button class="key">Q</button><button class="key">Ü</button><button class="key">E</button>
            <button class="key">R</button><button class="key">T</button><button class="key">Y</button>
            <button class="key">U</button><button class="key">İ</button><button class="key">O</button>
            <button class="key">P</button><button class="key">Ö</button><button class="key">Ğ</button>
        </div>
        <div class="row">
            <button class="key">A</button><button class="key">S</button><button class="key">D</button>
            <button class="key">F</button><button class="key">G</button><button class="key">H</button>
            <button class="key">J</button><button class="key">K</button><button class="key">L</button>
            <button class="key">I</button><button class="key">Ə</button>
        </div>
        <div class="row">
            <button class="key sp" id="btnShift">⇧</button>
            <button class="key">Z</button><button class="key">X</button><button class="key">C</button>
            <button class="key">V</button><button class="key">B</button><button class="key">N</button>
            <button class="key">M</button><button class="key">Ç</button><button class="key">Ş</button>
            <button class="key sp" id="btnBack">⌫</button>
        </div>
        <div class="row">
            <button class="key sp">123</button>
            <button class="key space-key" id="btnSpace">space</button>
            <button class="key tr-key" id="btnTranslate">TRANSLATE</button>
            <button class="key sp" id="btnQuickSend">➤</button>
        </div>
    </div>

</div>

<div class="toast" id="toast">Bildiriş</div>

<script>
/**
 * LinguaKey Modular Core Architecture
 * Scalable architecture with Speech, Translation Engine, and State Management.
 */

class TranslationEngine {
    constructor() {
        this.cache = new Map();
    }

    async translate(text, fromLang, toLang) {
        if (!text.trim()) return '';
        const key = `${fromLang}|${toLang}|${text}`;
        if (this.cache.has(key)) return this.cache.get(key);

        try {
            // Free Public API Integration (MyMemory Translation API)
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`;
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.responseData && data.responseData.translatedText) {
                const result = data.responseData.translatedText;
                this.cache.set(key, result);
                return result;
            }
            return text;
        } catch (err) {
            console.error('Translation Engine Error:', err);
            return text; // Fallback
        }
    }
}

class AppState {
    constructor() {
        this.sourceLang = 'az';
        this.targetLang = 'en';
        this.isShift = false;
        this.autoTranslate = true;
        this.themes = ['default', 'neon', 'classic'];
        this.currentThemeIdx = 0;
    }

    swapLanguages() {
        const temp = this.sourceLang;
        this.sourceLang = this.targetLang;
        this.targetLang = temp;
    }
}

class UIController {
    constructor(state, engine) {
        this.state = state;
        this.engine = engine;
        
        // DOM Cache
        this.input = document.getElementById('txtInput');
        this.chat = document.getElementById('chatViewport');
        this.toastEl = document.getElementById('toast');
        this.srcLangLbl = document.getElementById('sourceLangLbl');
        this.trgLangLbl = document.getElementById('targetLangLbl');
        
        this.initEvents();
    }

    initEvents() {
        // Keyboard Keys Mapping
        document.getElementById('keyboard').addEventListener('click', (e) => {
            const btn = e.target.closest('.key');
            if (!btn) return;

            const txt = btn.textContent.trim();

            if (txt === '⌫') {
                this.input.value = this.input.value.slice(0, -1);
            } else if (txt === 'space') {
                this.input.value += ' ';
            } else if (txt === '⇧') {
                this.toggleShift();
            } else if (txt === 'TRANSLATE') {
                this.handleManualTranslate();
            } else if (txt === '➤') {
                this.sendMessage();
            } else if (txt !== '123') {
                this.input.value += txt;
            }
            this.input.focus();
        });

        // Functional Controls
        document.getElementById('btnSend').onclick = () => this.sendMessage();
        document.getElementById('btnSwap').onclick = () => this.handleSwap();
        document.getElementById('btnMic').onclick = () => this.handleVoiceInput();
        document.getElementById('btnClearChat').onclick = () => this.clearChat();
        document.getElementById('btnToggleTheme').onclick = () => this.rotateTheme();

        // Suggestions
        document.getElementById('suggestBar').addEventListener('click', (e) => {
            if (e.target.classList.contains('chip')) {
                this.input.value = e.target.dataset.text;
            }
        });
    }

    toggleShift() {
        this.state.isShift = !this.state.isShift;
        const keys = document.querySelectorAll('.key:not(.sp)');
        keys.forEach(k => {
            k.textContent = this.state.isShift ? k.textContent.toLowerCase() : k.textContent.toUpperCase();
        });
    }

    async handleSwap() {
        this.state.swapLanguages();
        const map = { 'az': '🇦🇿 Azərbaycan', 'en': '🇬🇧 English', 'ru': '🇷🇺 Русский' };
        this.srcLangLbl.textContent = map[this.state.sourceLang] || this.state.sourceLang;
        this.trgLangLbl.textContent = map[this.state.targetLang] || this.state.targetLang;
        this.showToast('Dillər dəyişdirildi');
    }

    async handleManualTranslate() {
        const val = this.input.value.trim();
        if (!val) return this.showToast('Lütfən mətn daxil edin');

        this.showToast('Tərcümə olunur...');
        const result = await this.engine.translate(val, this.state.sourceLang, this.state.targetLang);
        this.input.value = result;
    }

    async sendMessage() {
        const val = this.input.value.trim();
        if (!val) return;

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        // Render Outgoing User Msg
        const msgNode = document.createElement('div');
        msgNode.className = 'msg out';
        msgNode.innerHTML = `
            <div class="bubble">${this.escapeHTML(val)}</div>
            <div class="sub-text">Yüklənir...</div>
            <div class="meta">${time} ✓</div>
        `;
        this.chat.appendChild(msgNode);
        this.input.value = '';
        this.chat.scrollTop = this.chat.scrollHeight;

        // Async Translate API Process
        const translation = await this.engine.translate(val, this.state.sourceLang, this.state.targetLang);
        const langFlag = this.state.targetLang === 'en' ? '🇬🇧' : '🇦🇿';
        msgNode.querySelector('.sub-text').textContent = `${langFlag} ${translation}`;
    }

    handleVoiceInput() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return this.showToast('Səs tanıma dəstəklənmir');

        const rec = new Speech();
        rec.lang = this.state.sourceLang === 'az' ? 'az-AZ' : 'en-US';
        rec.onstart = () => this.showToast('Dinlənilir...');
        rec.onresult = (e) => {
            this.input.value = e.results[0][0].transcript;
        };
        rec.onerror = () => this.showToast('Səs anlaşılamadı');
        rec.start();
    }

    rotateTheme() {
        document.body.classList.remove('theme-neon', 'theme-classic');
        this.state.currentThemeIdx = (this.state.currentThemeIdx + 1) % this.state.themes.length;
        const theme = this.state.themes[this.state.currentThemeIdx];
        
        if (theme !== 'default') {
            document.body.classList.add(`theme-${theme}`);
        }
        this.showToast(`Tema: ${theme.toUpperCase()}`);
    }

    clearChat() {
        this.chat.innerHTML = '';
        this.showToast('Çat təmizləndi');
    }

    showToast(msg) {
        this.toastEl.textContent = msg;
        this.toastEl.classList.add('visible');
        setTimeout(() => this.toastEl.classList.remove('visible'), 2000);
    }

    escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
}

// Global Initialization
document.addEventListener('DOMContentLoaded', () => {
    const state = new AppState();
    const engine = new TranslationEngine();
    window.app = new UIController(state, engine);
});
</script>
</body>
