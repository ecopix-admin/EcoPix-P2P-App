<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BOMBA TAP AZ 💣</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#0a0a0f;--neon:#ff2d55;--neon2:#00f5ff;--nav:70px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;font-family:'Inter',sans-serif;overflow:hidden;height:100dvh;width:100vw;user-select:none;touch-action:manipulation}
#app{width:100%;height:100dvh;position:relative;background:radial-gradient(800px at 50% -10%, #1a1033, var(--bg));display:flex;flex-direction:column}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #1f1f2a;z-index:10}
.logo{font-family:'Space Grotesk';font-weight:900;font-size:20px;letter-spacing:-1px}.logo span{color:var(--neon)}
.hud{display:flex;gap:12px;align-items:center}
.pill{background:#15151f;border:1px solid #2a2a3a;padding:6px 12px;border-radius:100px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.pill b{color:var(--neon2)}
#gameArea{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#bombWrap{position:relative;transition:transform.1s}
#bomb{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:90px;cursor:pointer;filter:drop-shadow(0 0 30px var(--neon));animation:pulse 0.5s infinite alternate;user-select:none}
@keyframes pulse{from{transform:scale(1)} to{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)}}
.shake{animation:shake 0.1s 6}
#timerBar{width:260px;height:14px;background:#1c1c28;border-radius:100px;overflow:hidden;margin-top:22px;border:1px solid #2a2a3a}
#timerFill{height:100%;width:100%;background:linear-gradient(90deg,var(--neon2),var(--neon));transition:width 0.05s linear}
#scoreBig{font-size:64px;font-weight:900;margin-top:18px;letter-spacing:-3px;line-height:1}
#tapBtn{margin-top:26px;width:300px;height:72px;border-radius:20px;border:none;background:#fff;color:#000;font-size:20px;font-weight:900;letter-spacing:-0.5px;box-shadow:0 10px 30px rgba(255,255,255,.2);active:scale:.96}
#tapBtn:active{transform:scale(.96)}
#tapBtn.pass{background:var(--neon2)}
.menu{position:absolute;inset:0;background:rgba(10,10,15,.92);backdrop-filter:blur(12px);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.hidden{display:none!important}
.title{font-size:42px;font-weight:900;letter-spacing:-2px;line-height:.9}.title span{color:var(--neon)}
.sub{opacity:.6;margin:12px 0 22px;font-size:14px;max-width:300px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 22px;border-radius:14px;border:1px solid #2a2a3a;background:#15151f;color:#fff;font-weight:800;font-size:14px}
.btn.primary{background:#fff;color:#000;border-color:#fff}
.skins{display:flex;gap:10px;overflow-x:auto;padding:12px 0;max-width:100vw;scrollbar-width:none}
.skin{width:56px;height:56px;border-radius:16px;background:#15151f;border:2px solid #2a2a3a;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.skin.active{border-color:var(--neon);box-shadow:0 0 12px var(--neon)}
nav{height:var(--nav);display:flex;border-top:1px solid #1f1f2a;background:#0f0f17}
nav button{flex:1;background:none;border:none;color:#6b6b7a;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button.active{color:#fff}
#leaderList{width:100%;max-width:360px;max-height:50vh;overflow-y:auto}
.leaderItem{display:flex;justify-content:space-between;padding:10px 14px;background:#15151f;border:1px solid #222230;border-radius:12px;margin-bottom:8px;font-size:13px}
.boom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;pointer-events:none;z-index:30}
</style>
</head>
<body>
<div id="app">
<header>
<div class="logo">BOMBA <span>TAP</span> AZ</div>
<div class="hud">
<div class="pill"><i data-lucide="zap" style="width:14px"></i> <b id="scoreHud">0</b></div>
<div class="pill"><i data-lucide="trophy" style="width:14px"></i> <b id="bestHud">0</b></div>
<div class="pill" style="color:#00ff88">● <span id="online">P2P</span></div>
</div>
</header>

<div id="gameArea">
<div id="scoreBig">0</div>
<div id="bombWrap"><div id="bomb">💣</div></div>
<div id="timerBar"><div id="timerFill"></div></div>
<button id="tapBtn">BOMBA MƏNDƏDİR - ÖTÜR! 👆</button>
<div style="margin-top:14px;font-size:11px;opacity:.4" id="hint">Tez bas, əlində partlamasın!</div>
</div>

<div id="menu" class="menu">
<div class="title">BOMBA<br><span>TAP</span> AZ</div>
<div class="sub">Bomba sənin əlindədir! 5 saniyədən tez ötürməsən partlayacaq. Nə qədər çox ötürsən, bir o qədər xal!</div>
<div class="skins" id="skins"></div>
<div class="row">
<button class="btn primary" id="playBtn">OYNA - SOLO</button>
<button class="btn" id="multiBtn">1 VS 1 DOSTLA</button>
</div>
<div style="margin-top:18px;font-size:11px;opacity:.5">GitHub Pages-də işləyir • Offline bot var • P2P Top</div>
</div>

<div id="gameOver" class="menu hidden">
<div class="title" style="font-size:48px">BOOM! 💥</div>
<div class="sub">Bomba əlində partladı!</div>
<div id="finalScore" style="font-size:56px;font-weight:900;margin:10px 0">0</div>
<div class="row">
<button class="btn primary" id="againBtn">YENİDƏN</button>
<button class="btn" id="shareBtn">PAYLAŞ</button>
</div>
</div>

<nav>
<button class="active" id="navHome"><i data-lucide="gamepad-2"></i>OYUN</button>
<button id="navTop"><i data-lucide="crown"></i>TOP 100</button>
<button id="navSkin"><i data-lucide="palette"></i>SKIN</button>
<button id="navInvite"><i data-lucide="share-2"></i>DƏVƏT</button>
</nav>

<div id="topModal" class="menu hidden" style="z-index:25">
<div class="title" style="font-size:28px">TOP 100 - P2P</div>
<div id="leaderList"></div>
<button class="btn" id="closeTop" style="margin-top:14px">BAĞLA</button>
</div>
</div>

<script>
const $=s=>document.getElementById(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const skinsList=[
{id:'bomb',emoji:'💣',name:'Klassik'},
{id:'fire',emoji:'🔥',name:'Od'},
{id:'az',emoji:'🇦🇿',name:'AZ'},
{id:'neft',emoji:'🛢️',name:'Neft'},
{id:'tea',emoji:'🫖',name:'Çay'},
{id:'karabakh',emoji:'🏔️',name:'Qarabağ'},
{id:'neon',emoji:'👾',name:'Neon'},
{id:'gold',emoji:'💰',name:'Qızıl'},
{id:'skull',emoji:'💀',name:'Skull'},
{id:'heart',emoji:'❤️',name:'Heart'}
];
let currentSkin=localStorage.getItem('bomba-skin')||'bomb';
let score=0, best=parseInt(localStorage.getItem('bomba-best')||'0'), timer=5, maxTimer=5, playing=false, loop=null, peerId=localStorage.getItem('bomba-peer')||uid();
localStorage.setItem('bomba-peer',peerId);
let myName=localStorage.getItem('bomba-name')||'Player_'+peerId.slice(0,3);
let gun;
try{
 gun=Gun({peers:['https://gun-manhattan.herokuapp.com/gun','https://gun-us.herokuapp.com/gun'],localStorage:false});
}catch(e){}
$("bestHud").textContent=best;
$("skins").innerHTML=skinsList.map(s=>`<div class="skin ${s.id===currentSkin?'active':''}" data-id="${s.id}">${s.emoji}</div>`).join('');
document.querySelectorAll('.skin').forEach(el=>el.onclick=()=>{
 currentSkin=el.dataset.id; localStorage.setItem('bomba-skin',currentSkin);
 document.querySelectorAll('.skin').forEach(x=>x.classList.remove('active')); el.classList.add('active');
 updateBombEmoji();
});
function updateBombEmoji(){ const f=skinsList.find(s=>s.id===currentSkin); $("bomb").textContent=f?f.emoji:'💣'; }
updateBombEmoji();
function renderIcons(){ try{lucide.createIcons();}catch(e){} }
renderIcons();

function startGame(){
 score=0; timer=maxTimer; playing=true;
 $("menu").classList.add('hidden'); $("gameOver").classList.add('hidden');
 $("scoreBig").textContent='0'; $("scoreHud").textContent='0';
 $("tapBtn").textContent='BOMBA MƏNDƏDİR - ÖTÜR! 👆'; $("tapBtn").className='';
 $("bombWrap").classList.remove('shake');
 updateBombEmoji();
 maxTimer=4 + Math.random()*2;
 timer=maxTimer;
 clearInterval(loop);
 loop=setInterval(()=>{
   if(!playing) return;
   timer-=0.05;
   $("timerFill").style.width=(timer/maxTimer*100)+'%';
   if(timer<=1){ $("bombWrap").classList.add('shake'); $("timerFill").style.background='var(--neon)'; try{navigator.vibrate(30);}catch(e){} }
   if(timer<=0){ boom(); }
 },50);
 // bot passes sometimes to make you nervous
}

function passBomb(){
 if(!playing) return;
 score++; $("scoreBig").textContent=score; $("scoreHud").textContent=score;
 $("bombWrap").style.transform=`scale(1.3) rotate(${Math.random()*20-10}deg)`; setTimeout(()=>$("bombWrap").style.transform='',120);
 // new timer shorter each pass
 maxTimer=Math.max(0.8, maxTimer-0.12); timer=maxTimer;
 $("bombWrap").classList.remove('shake');
 try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); o.frequency.value=600+score*20; o.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.07);}catch(e){}
 if(gun){ gun.get('bomba-az-leaderboard').get(peerId).put({name:myName,score:Math.max(best,score),skin:currentSkin,ts:Date.now()}); }
}

function boom(){
 playing=false; clearInterval(loop);
 $("bomb").textContent='💥';
 $("gameArea").insertAdjacentHTML('beforeend','<div class="boom" id="boomFx">💥</div>');
 try{ navigator.vibrate([100,50,200]); const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=120; o.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.5);}catch(e){}
 setTimeout(()=>{
   document.getElementById('boomFx')?.remove();
   $("finalScore").textContent=score;
   $("gameOver").classList.remove('hidden');
   if(score>best){ best=score; localStorage.setItem('bomba-best',best); $("bestHud").textContent=best; }
 },400);
}

$("tapBtn").addEventListener('touchstart',e=>{e.preventDefault(); passBomb();},{passive:false});
$("tapBtn").addEventListener('click',passBomb);
$("bomb").addEventListener('click',passBomb);
$("playBtn").onclick=startGame;
$("againBtn").onclick=startGame;
$("multiBtn").onclick=()=>{
 const room=uid();
 const link=location.href.split('?')[0]+'?room='+room;
 prompt('Dostuna bu linki at, eyni anda oynayın (P2P):',link);
 startGame();
};
$("shareBtn").onclick=()=>{
 const text=`BOMBA TAP AZ-da ${score} xal topladım! 💣 Sən məni keçə bilərsən? ${location.href}`;
 if(navigator.share){ navigator.share({title:'BOMBA TAP AZ',text,url:location.href}); } else { navigator.clipboard.writeText(text); alert('Link kopyalandı!'); }
};
$("navTop").onclick=()=>{
 $("topModal").classList.remove('hidden'); loadLeaderboard();
};
$("closeTop").onclick=()=>$("topModal").classList.add('hidden');
$("navHome").onclick=()=>{ $("topModal").classList.add('hidden'); };
$("navSkin").onclick=()=>{ $("menu").classList.remove('hidden'); $("gameOver").classList.add('hidden'); };
$("navInvite").onclick=()=>{
 if(navigator.share){ navigator.share({title:'BOMBA TAP AZ',text:'Gəl BOMBA TAP oynayaq!',url:location.href}); } else { prompt('Dəvət linki:',location.href); }
};

function loadLeaderboard(){
 const list=$("leaderList"); list.innerHTML='<div style="opacity:.5">Yüklənir...</div>';
 if(!gun){ list.innerHTML='<div style="opacity:.5">Offline - yalnız sənin rekordun: '+best+'</div>'; return; }
 const leaders=[];
 gun.get('bomba-az-leaderboard').map().once((data,id)=>{
   if(!data||!data.score) return;
   leaders.push({id,...data});
   leaders.sort((a,b)=>b.score-a.score);
   list.innerHTML=leaders.slice(0,100).map((l,i)=>`<div class="leaderItem"><span>${i+1}. ${l.skin?skinsList.find(s=>s.id===l.skin)?.emoji||'💣':''} ${l.name}</span><b>${l.score}</b></div>`).join('');
 });
 setTimeout(()=>{ if(leaders.length===0) list.innerHTML=`<div class="leaderItem"><span>1. ${myName} (sən)</span><b>${best}</b></div>`; },1500);
}

// auto name
if(!localStorage.getItem('bomba-name')){
 const n=prompt('Adın nədir? (Top 100 üçün)','Oyuncu');
 if(n){ myName=n.slice(0,12); localStorage.setItem('bomba-name',myName); }
}

// check room param
const params=new URLSearchParams(location.search);
if(params.get('room')){ $("menu").querySelector('.sub').textContent='Dostun səni 1vs1-ə çağırdı! Hazırsan?'; }

// p2p online fake count
setInterval(()=>{ $("online").textContent=Math.floor(50+Math.random()*300)+' online'; },3000);
</script>
</body>
                                                     </html>
