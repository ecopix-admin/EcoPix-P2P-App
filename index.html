<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>ARWORLD — Spatial Social</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#050a12;
  --panel:#0b1422;
  --panel2:#101d2d;
  --line:#263b57;
  --text:#f4f7fb;
  --muted:#9eacc0;
  --cyan:#45dcff;
  --blue:#328dff;
  --purple:#7658ff;
  --green:#42df91;
  --red:#ff526d;
  --nav:78px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#050a12;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  color:white;
  border:0;
  touch-action:manipulation;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
}

/* =====================================================
   HEADER
===================================================== */

.header{
  position:absolute;
  z-index:100;
  top:0;
  left:0;
  right:0;
  height:78px;
  padding:
    max(8px,env(safe-area-inset-top))
    16px 8px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(4,9,17,.94);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(16px);
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:.4px;
}

.logo span{
  color:var(--cyan);
}

.headerBtns{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:51px;
  height:51px;
  border-radius:17px;
  background:#0c1828;
  border:1px solid #253a56;
  font-size:22px;
}

/* =====================================================
   AR CAMERA
===================================================== */

#arView{
  position:absolute;
  inset:0;
  background:#000;
}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.cameraShade{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
  linear-gradient(
    to bottom,
    rgba(0,0,0,.42),
    transparent 27%,
    transparent 72%,
    rgba(0,0,0,.50)
  );
}

/* =====================================================
   STATUS
===================================================== */

.status{
  position:absolute;
  z-index:40;
  top:92px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.statusItem{
  background:rgba(7,18,31,.84);
  border:1px solid #29415e;
  border-radius:24px;
  padding:12px 15px;
  font-size:13px;
  backdrop-filter:blur(12px);
}

/* =====================================================
   AR CROSSHAIR
===================================================== */

.crosshair{
  position:absolute;
  z-index:15;
  left:50%;
  top:50%;
  width:44px;
  height:44px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:.35;
}

.crosshair:before,
.crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
}

.crosshair:before{
  width:2px;
  height:44px;
  left:21px;
  top:0;
}

.crosshair:after{
  height:2px;
  width:44px;
  left:0;
  top:21px;
}

/* =====================================================
   AR OBJECTS
===================================================== */

#arObjects{
  position:absolute;
  z-index:25;
  inset:78px 0 var(--nav) 0;
  pointer-events:none;
}

.arObject{
  position:absolute;
  width:min(270px,68vw);
  transform:translate(-50%,-50%);
  padding:13px;
  border-radius:19px;
  background:rgba(6,15,27,.92);
  border:1px solid rgba(69,220,255,.55);
  box-shadow:
    0 12px 40px rgba(0,0,0,.48),
    0 0 30px rgba(69,220,255,.07);
  backdrop-filter:blur(15px);
  pointer-events:auto;
  will-change:left,top,transform;
}

.arObject.stable{
  animation:none;
}

.arName{
  font-weight:900;
  font-size:17px;
}

.arType{
  color:var(--cyan);
  font-size:12px;
  margin-top:4px;
}

.arBio{
  color:#d3dce8;
  font-size:12px;
  line-height:1.35;
  margin-top:7px;
}

.arDistance{
  color:#aabbd0;
  font-size:12px;
  margin-top:8px;
}

.arOpen{
  width:100%;
  min-height:42px;
  margin-top:9px;
  border-radius:12px;
  background:#14283e;
  border:1px solid #2c4665;
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottomNav{
  position:absolute;
  z-index:500;
  left:0;
  right:0;
  bottom:0;
  height:var(--nav);
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(4,9,17,.97);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav{
  width:20%;
  height:70px;
  background:transparent;
  color:#7889a3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.nav.active{
  color:var(--cyan);
}

.navIcon{
  font-size:22px;
}

.navText{
  font-size:10px;
}

.add{
  width:66px;
  height:55px;
  margin-top:-13px;
  border-radius:22px;
  background:linear-gradient(110deg,#1dbbea,#7358ff);
  font-size:34px;
  box-shadow:0 9px 30px rgba(55,130,255,.35);
}

/* =====================================================
   VIEWS
===================================================== */

.view{
  position:absolute;
  inset:0;
  display:none;
  background:var(--bg);
}

.view.active{
  display:block;
}

.page{
  position:absolute;
  inset:78px 0 var(--nav) 0;
  overflow-y:auto;
  padding:18px 15px 35px;
}

.pageTitle{
  font-size:25px;
  font-weight:900;
  margin-bottom:17px;
}

/* =====================================================
   MAP
===================================================== */

#map{
  position:absolute;
  inset:78px 0 var(--nav) 0;
}

/* =====================================================
   CARDS
===================================================== */

.card{
  background:#0c1726;
  border:1px solid #233953;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:14px;
}

.cardBody{
  padding:15px;
}

.cardTitle{
  font-size:19px;
  font-weight:900;
}

.cardMeta{
  color:var(--cyan);
  font-size:12px;
  margin-top:5px;
}

.cardText{
  color:#cbd5e2;
  line-height:1.45;
  font-size:14px;
  margin-top:9px;
}

.mediaGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:4px;
  background:#000;
}

.mediaGrid img,
.mediaGrid video{
  width:100%;
  height:170px;
  object-fit:cover;
  display:block;
}

/* =====================================================
   PROFILE
===================================================== */

.profileBox{
  background:#0c1726;
  border:1px solid #233953;
  border-radius:23px;
  padding:20px;
}

.avatar{
  width:78px;
  height:78px;
  border-radius:50%;
  background:linear-gradient(135deg,#1cc6ed,#7658ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  font-weight:900;
}

.profileName{
  font-size:25px;
  font-weight:900;
  margin-top:14px;
}

.username{
  color:var(--cyan);
  margin-top:4px;
}

.profileBio{
  color:#c7d1df;
  line-height:1.5;
  margin-top:13px;
}

.profileArticle{
  color:#c7d1df;
  line-height:1.6;
  white-space:pre-wrap;
  margin-top:18px;
}

.socialRow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.social{
  padding:10px 13px;
  border-radius:13px;
  background:#14253a;
  border:1px solid #2b4461;
  font-size:13px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.64);
  backdrop-filter:blur(5px);
  display:none;
  align-items:flex-end;
  pointer-events:none;
}

.modal.show{
  display:flex;
  pointer-events:auto;
}

.sheet{
  width:min(100%,700px);
  max-height:82dvh;
  background:
    linear-gradient(
      180deg,
      #0d1828,
      #09121f
    );
  border:1px solid #29415f;
  border-bottom:0;
  border-radius:28px 28px 0 0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 -20px 80px rgba(0,0,0,.65);
}

.sheetHead{
  flex:0 0 auto;
  position:relative;
  padding:13px 58px 13px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.handle{
  width:42px;
  height:5px;
  border-radius:10px;
  background:#46586e;
  margin:0 auto 10px;
}

.sheetTitle{
  font-size:20px;
  font-weight:900;
}

.close{
  position:absolute;
  right:13px;
  top:13px;
  width:45px;
  height:45px;
  border-radius:15px;
  background:#17263a;
  border:1px solid #2b4360;
  font-size:24px;
}

.sheetBody{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:16px 17px;
  -webkit-overflow-scrolling:touch;
}

.sheetFoot{
  flex:0 0 auto;
  padding:10px 17px 14px;
  border-top:1px solid rgba(255,255,255,.08);
  background:#091321;
}

/* =====================================================
   FORM
===================================================== */

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  color:#a7b6ca;
  font-size:13px;
  margin-bottom:7px;
}

.input,
.select,
.textarea{
  width:100%;
  min-height:54px;
  border-radius:16px;
  border:1px solid #2a4260;
  background:#07111e;
  color:white;
  outline:none;
  padding:0 15px;
  font-size:16px;
}

.textarea{
  min-height:105px;
  padding:13px 15px;
  resize:none;
}

.input:focus,
.select:focus,
.textarea:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(69,220,255,.07);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.button{
  min-height:53px;
  border-radius:16px;
  background:#14253a;
  border:1px solid #2b4462;
  font-weight:800;
  padding:0 13px;
}

.button:active{
  transform:scale(.98);
}

.primary{
  width:100%;
  min-height:60px;
  border-radius:18px;
  background:linear-gradient(105deg,#17bce9,#7358ff);
  font-size:17px;
  font-weight:900;
}

.locationRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.fileActions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}

.fileAction{
  min-height:52px;
  border-radius:14px;
  background:#13243a;
  border:1px solid #2a435f;
  font-size:12px;
  font-weight:800;
}

.fileInput{
  display:none;
}

.selectedMedia{
  margin-top:9px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.selectedMedia img,
.selectedMedia video{
  width:100%;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  background:#000;
}

/* =====================================================
   DETAIL / SPATIAL PROFILE
===================================================== */

.detailMedia{
  width:100%;
  border-radius:18px;
  max-height:320px;
  object-fit:cover;
  background:#000;
}

.detailName{
  font-size:26px;
  font-weight:900;
  margin-top:15px;
}

.detailUsername{
  color:var(--cyan);
  margin-top:4px;
}

.detailBio{
  color:#cbd5e1;
  line-height:1.5;
  margin-top:13px;
}

.detailArticle{
  color:#cbd5e1;
  line-height:1.65;
  white-space:pre-wrap;
  margin-top:17px;
}

.detailButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:18px;
}

/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;
  z-index:5000;
  left:50%;
  bottom:calc(var(--nav) + 14px);
  transform:translate(-50%,20px);
  width:max-content;
  max-width:90%;
  padding:13px 17px;
  border-radius:15px;
  background:#102036;
  border:1px solid #2c4562;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =====================================================
   LOADING
===================================================== */

#loading{
  position:fixed;
  inset:0;
  z-index:6000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(2,7,12,.75);
  backdrop-filter:blur(5px);
}

#loading.show{
  display:flex;
}

.loader{
  padding:22px;
  border-radius:20px;
  background:#0d1c2e;
  border:1px solid #29415e;
  text-align:center;
}

.spinner{
  width:38px;
  height:38px;
  border-radius:50%;
  border:4px solid #243b55;
  border-top-color:var(--cyan);
  animation:spin .8s linear infinite;
  margin:auto auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =====================================================
   SEARCH
===================================================== */

.search{
  position:absolute;
  z-index:150;
  top:88px;
  left:15px;
  right:15px;
  display:none;
}

.search.show{
  display:block;
}

.search input{
  width:100%;
  height:55px;
  border-radius:17px;
  border:1px solid #2a4563;
  background:rgba(7,16,29,.96);
  color:white;
  padding:0 17px;
  outline:none;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:500px){

  .grid2{
    grid-template-columns:1fr 1fr;
  }

  .sheet{
    max-height:80dvh;
  }

}

@media(max-height:700px){

  .sheet{
    max-height:74dvh;
  }

  .sheetBody{
    padding-top:10px;
  }

  .field{
    margin-bottom:9px;
  }

}
</style>
</head>

<body>

<div id="app">

<!-- =====================================================
     AR CAMERA
===================================================== -->

<section id="arView">

  <video
    id="camera"
    autoplay
    muted
    playsinline>
  </video>

  <div class="cameraShade"></div>

  <div class="status">
    <div class="statusItem" id="gpsStatus">
      GPS gözlənilir...
    </div>

    <div class="statusItem" id="compassStatus">
      Kompas --°
    </div>
  </div>

  <div class="crosshair"></div>

  <div id="arObjects"></div>

  <div class="search" id="searchBox">
    <input
      id="searchInput"
      placeholder="ARWORLD-də axtar...">
  </div>

</section>


<!-- =====================================================
     MAP
===================================================== -->

<section id="mapView" class="view">
  <div id="map"></div>
</section>


<!-- =====================================================
     FEED
===================================================== -->

<section id="feedView" class="view">

  <div class="page">

    <div class="pageTitle">
      Yaxınlıqdakı dünya
    </div>

    <div id="feedList"></div>

  </div>

</section>


<!-- =====================================================
     MY PROFILE
===================================================== -->

<section id="profileView" class="view">

  <div class="page">

    <div class="pageTitle">
      Mənim profilim
    </div>

    <div class="profileBox">

      <div class="avatar"
           id="myAvatar">
        A
      </div>

      <div class="profileName"
           id="myName">
        ARWORLD istifadəçisi
      </div>

      <div class="username"
           id="myUsername">
        @arworld
      </div>

      <div class="profileBio"
           id="myBio">
        Fiziki dünyada rəqəmsal iz burax.
      </div>

      <button
        class="button"
        style="width:100%;margin-top:18px"
        id="editMyProfile">
        ✏️ Profili redaktə et
      </button>

    </div>

  </div>

</section>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="logo">
    AR<span>WORLD</span>
  </div>

  <div class="headerBtns">

    <button
      class="iconBtn"
      id="searchBtn">
      ⌕
    </button>

    <button
      class="iconBtn"
      id="refreshBtn">
      ↻
    </button>

  </div>

</header>


<!-- =====================================================
     CREATE SPATIAL PROFILE
===================================================== -->

<div class="modal" id="createModal">

  <div class="sheet">

    <div class="sheetHead">

      <div class="handle"></div>

      <div class="sheetTitle">
        🌍 Dünyaya yerləşdir
      </div>

      <button
        class="close"
        id="closeCreate">
        ×
      </button>

    </div>


    <div class="sheetBody">

      <!-- TYPE -->

      <div class="field">

        <label>
          Bu nədir?
        </label>

        <select
          id="objectType"
          class="select">

          <option value="person">
            👤 Şəxsi profil
          </option>

          <option value="business">
            🏪 Biznes / mağaza
          </option>

          <option value="service">
            🛠️ Usta / xidmət
          </option>

          <option value="car">
            🚗 Avtomobil
          </option>

          <option value="place">
            📍 Məkan
          </option>

          <option value="tourism">
            🏔️ Turizm
          </option>

          <option value="event">
            🎉 Tədbir
          </option>

          <option value="warning">
            ⚠️ Xəbərdarlıq
          </option>

          <option value="information">
            ℹ️ Məlumat
          </option>

        </select>

      </div>


      <!-- NAME -->

      <div class="field">

        <label>
          Ad / başlıq
        </label>

        <input
          id="objectName"
          class="input"
          placeholder="Məsələn: Şamxal Təmir Tikinti">

      </div>


      <!-- USERNAME -->

      <div class="field">

        <label>
          İstifadəçi adı
        </label>

        <input
          id="objectUsername"
          class="input"
          placeholder="@istifadeci">

      </div>


      <!-- BIO -->

      <div class="field">

        <label>
          Qısa bio
        </label>

        <textarea
          id="objectBio"
          class="textarea"
          placeholder="Özünüzü və ya obyektinizi qısa təqdim edin..."></textarea>

      </div>


      <!-- ARTICLE -->

      <div class="field">

        <label>
          📖 Haqqında / məqalə
        </label>

        <textarea
          id="objectArticle"
          class="textarea"
          style="min-height:145px"
          placeholder="Burada özünüz, biznesiniz, xidmətiniz, məkanınız və s. haqqında geniş məlumat yaza bilərsiniz..."></textarea>

      </div>


      <!-- PHONE -->

      <div class="field">

        <label>
          Telefon
        </label>

        <input
          id="objectPhone"
          class="input"
          type="tel"
          placeholder="+994 50 000 00 00">

      </div>


      <!-- WHATSAPP -->

      <div class="field">

        <label>
          WhatsApp
        </label>

        <input
          id="objectWhatsapp"
          class="input"
          type="tel"
          placeholder="+994500000000">

      </div>


      <!-- SOCIAL -->

      <div class="field">

        <label>
          Sosial şəbəkə / sayt
        </label>

        <input
          id="objectSocial"
          class="input"
          placeholder="Instagram, TikTok, sayt və s.">

      </div>


      <!-- LOCATION -->

      <div class="field">

        <label>
          📍 Dəqiq yerləşmə
        </label>

        <div class="grid2">

          <input
            id="objectLat"
            class="input"
            type="number"
            step="any"
            placeholder="Latitude">

          <input
            id="objectLng"
            class="input"
            type="number"
            step="any"
            placeholder="Longitude">

        </div>

      </div>


      <div class="locationRow">

        <button
          class="button"
          id="currentGPS">
          📍 Cari GPS
        </button>

        <button
          class="button"
          id="pickMap">
          🗺️ Xəritə
        </button>

      </div>


      <!-- RADIUS -->

      <div class="field"
           style="margin-top:13px">

        <label>
          Görünmə radiusu
        </label>

        <select
          id="objectRadius"
          class="select">

          <option value="50">
            50 metr
          </option>

          <option value="100">
            100 metr
          </option>

          <option value="300" selected>
            300 metr
          </option>

          <option value="500">
            500 metr
          </option>

          <option value="1000">
            1 km
          </option>

          <option value="5000">
            5 km
          </option>

        </select>

      </div>


      <!-- MEDIA -->

      <div class="field">

        <label>
          📸 Şəkil və video
        </label>

        <div class="fileActions">

          <button
            class="fileAction"
            id="galleryBtn">
            🖼️ Qalereya
          </button>

          <button

function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const req =
        indexedDB.open(
          "ARWORLD_SPATIAL_V3",
          1
        );

      req.onupgradeneeded =
        e=>{

          const d =
            e.target.result;

          if(
            !d.objectStoreNames.contains(
              "objects"
            )
          ){

            d.createObjectStore(
              "objects",
              {keyPath:"id"}
            );

          }

          if(
            !d.objectStoreNames.contains(
              "profile"
            )
          ){

            d.createObjectStore(
              "profile",
              {keyPath:"id"}
            );

          }

        };

      req.onsuccess =
        e=>{

          db =
            e.target.result;

          resolve();

        };

      req.onerror =
        ()=>{
          reject(req.error);
        };

    }
  );

}

/* =====================================================
   GPS — STABILIZED
===================================================== */

function startGPS(){

  if(!navigator.geolocation){

    toast("GPS dəstəklənmir.");

    return;

  }


  navigator.geolocation.watchPosition(

    pos=>{

      const lat =
        pos.coords.latitude;

      const lng =
        pos.coords.longitude;

      gpsAccuracy =
        pos.coords.accuracy;


      /*
        Qəfil GPS sıçrayışlarını
        dərhal ekrana tətbiq etmirik.
      */

      if(
        smoothLat !== null &&
        smoothLng !== null
      ){

        const jump =
          distanceMeters(
            smoothLat,
            smoothLng,
            lat,
            lng
          );

        /*
          GPS bir anda 80+ metr sıçrayırsa
          onu səhv ölçü kimi qəbul edirik.
        */

        if(
          jump >
          Math.max(
            80,
            gpsAccuracy * 4
          )
        ){

          return;

        }

      }


      /*
        Güclü low-pass filter.
        GPS hərəkət etdikcə yavaş-yavaş
        yeni mövqeyə keçir.
      */

      if(smoothLat === null){

        smoothLat = lat;
        smoothLng = lng;

      }else{

        const alpha =
          gpsAccuracy <= 8
            ? 0.18
            : 0.08;

        smoothLat =
          smoothLat +
          (lat-smoothLat)*alpha;

        smoothLng =
          smoothLng +
          (lng-smoothLng)*alpha;

      }


      userLat =
        smoothLat;

      userLng =
        smoothLng;


      $("gpsStatus").textContent =
        "GPS ±" +
        Math.round(gpsAccuracy || 0) +
        "m";


      updateAR();

      updateMap();

    },

    error=>{

      $("gpsStatus").textContent =
        "GPS icazəsi lazımdır";

    },

    {
      enableHighAccuracy:true,
      maximumAge:1500,
      timeout:15000
    }

  );

}


/* =====================================================
   COMPASS — STABILIZED
===================================================== */

function startCompass(){

  window.addEventListener(
    "deviceorientationabsolute",
    orientationHandler,
    true
  );

  window.addEventListener(
    "deviceorientation",
    orientationHandler,
    true
  );

}


function circularDifference(a,b){

  return (
    (a-b+540)%360
  )-180;

}


function orientationHandler(e){

  let h = null;


  if(
    typeof e.webkitCompassHeading ===
    "number"
  ){

    h =
      e.webkitCompassHeading;

  }else if(
    typeof e.alpha ===
    "number"
  ){

    h =
      360-e.alpha;

  }


  if(h === null)
    return;


  h =
    (h+360)%360;


  rawHeading = h;


  /*
    Kompasın qəfil 5-20 dərəcə
    sıçramasını yumşaldırıq.
  */

  const diff =
    circularDifference(
      h,
      smoothHeading
    );


  /*
    Çox kiçik sensor dəyişmələrini
    tamamilə nəzərə almırıq.
  */

  if(
    Math.abs(diff) < 0.8
  ){

    return;

  }


  /*
    Yavaş keçid.
    Obyektlər ekranda əsə-əsə
    hərəkət etməsin.
  */

  const alpha =
    Math.abs(diff) > 25
      ? 0.20
      : 0.07;


  smoothHeading =
    (
      smoothHeading +
      diff * alpha +
      360
    ) % 360;


  $("compassStatus").textContent =
    "Kompas " +
    Math.round(smoothHeading) +
    "°";


  updateAR();

}


/* =====================================================
   GEO
===================================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1*Math.PI/180;

  const p2 =
    lat2*Math.PI/180;

  const dp =
    (lat2-lat1)*Math.PI/180;

  const dl =
    (lon2-lon1)*Math.PI/180;

  const a =
    Math.sin(dp/2)**2 +
    Math.cos(p1)*
    Math.cos(p2)*
    Math.sin(dl/2)**2;

  return (
    2*R*
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


function bearingTo(
  lat1,
  lon1,
  lat2,
  lon2
){

  const p1 =
    lat1*Math.PI/180;

  const p2 =
    lat2*Math.PI/180;

  const dl =
    (lon2-lon1)*Math.PI/180;

  const y =
    Math.sin(dl)*
    Math.cos(p2);

  const x =
    Math.cos(p1)*
    Math.sin(p2) -
    Math.sin(p1)*
    Math.cos(p2)*
    Math.cos(dl);

  return (
    Math.atan2(y,x)*
    180/Math.PI+
    360
  )%360;

}


function angleDiff(a,b){

  return (
    (a-b+540)%360
  )-180;

}


/* =====================================================
   AR RENDER — STABLE
===================================================== */

function updateAR(){

  const container =
    $("arObjects");

  if(!container)
    return;


  if(
    userLat === null ||
    userLng === null
  ){

    container.innerHTML = "";

    return;

  }


  const visible =
    spatialObjects.filter(
      obj=>{

        const d =
          distanceMeters(
            userLat,
            userLng,
            obj.lat,
            obj.lng
          );

        return d <=
          Number(obj.radius || 300);

      }
    );


  /*
    DOM elementlərini hər GPS/kompas
    dəyişməsində silib yenidən yaratmırıq.
    Bu, titrəmənin əsas səbəblərindən
    birini aradan qaldırır.
  */

  const existing =
    new Map();

  [...container.children]
    .forEach(el=>{
      existing.set(
        el.dataset.id,
        el
      );
    });


  const used =
    new Set();


  visible.forEach(obj=>{

    const distance =
      distanceMeters(
        userLat,
        userLng,
        obj.lat,
        obj.lng
      );


    const bearing =
      bearingTo(
        userLat,
        userLng,
        obj.lat,
        obj.lng
      );


    const diff =
      angleDiff(
        bearing,
        smoothHeading
      );


    /*
      Görüş bucağı.
    */

    if(
      Math.abs(diff)>78
    ){

      const old =
        existing.get(obj.id);

      if(old)
        old.style.display =
          "none";

      return;

    }


    let card =
      existing.get(obj.id);


    if(!card){

      card =
        document.createElement(
          "div"
        );

      card.className =
        "arObject stable";

      card.dataset.id =
        obj.id;

      card.innerHTML = `

        <div class="arName"></div>

        <div class="arType"></div>

        <div class="arBio"></div>

        <div class="arDistance"></div>

        <button class="arOpen">
          PROFİLİ AÇ
        </button>

      `;

      card.querySelector(
        ".arOpen"
      ).onclick =
        ()=>{
          openDetail(obj);
        };

      container.appendChild(card);

    }


    card.style.display =
      "block";


    /*
      Ekranda üfüqi yerləşmə.
    */

    const x =
      50 +
      diff/78*42;


    /*
      Uzaq obyekt bir qədər
      yuxarıda görünür.
    */

    const radius =
      Number(obj.radius || 300);

    const normalized =
      Math.min(
        1,
        distance/
        Math.max(radius,1)
      );


    const y =
      43 +
      normalized*18;


    /*
      CSS transform sabit qalır.
      Sadəcə left/top dəyişir.
    */

    card.style.left =
      x+"%";

    card.style.top =
      y+"%";


    card.querySelector(
      ".arName"
    ).textContent =
      obj.name;


    card.querySelector(
      ".arType"
    ).textContent =
      typeName(obj.type);


    card.querySelector(
      ".arBio"
    ).textContent =
      (obj.bio || "")
        .slice(0,90);


    card.querySelector(
      ".arDistance"
    ).textContent =
      Math.round(distance)+" m · "+
      Math.round(bearing)+"°";


    used.add(obj.id);

  });


  existing.forEach(
    (el,id)=>{

      if(!used.has(id)){

        el.remove();

      }

    }
  );

}

  files.forEach(
    file=>{

        !file.type.startsWith("image/") &&
        !file.type.startsWith("video/")

        return;


      /*
        Local prototip üçün fayl limiti.
      */

      if(
        file.size >
        15*1024*1024
      ){

        toast(
          file.name+
          " 15 MB-dan böyükdür."
        );

        return;

      }


      if(
        selectedFiles.length>=6
      ){

        toast(
          "Maksimum 6 media faylı."
        );

        return;

      }


      selectedFiles.push(file);

    }
  );


  renderSelectedMedia();

}


function renderSelectedMedia(){

  const box =
    $("selectedMedia");

  box.innerHTML = "";


  selectedFiles.forEach(
    file=>{

      const url =
        URL.createObjectURL(file);


      let el;


      if(
        file.type.startsWith("video/")
      ){

        el =
          document.createElement(
            "video"
          );

        el.controls = true;

      }else{

        el =
          document.createElement(
            "img"
          );

      }


      el.src =
        url;

      box.appendChild(el);

    }
  );

}


function filesToData(files){

  return Promise.all(
    files.map(
      file=>
        new Promise(
          resolve=>{

            const reader =
              new FileReader();

            reader.onload =
              ()=>{
                resolve({

                  data:
                    reader.result,

                  type:
                    file.type,

                  name:
                    file.name

                });
              };

            reader.readAsDataURL(
              file
            );

          }
        )
    )
  );

}

  ){

    toast(
      "📍 Əvvəlcə dəqiq yer seçin."
    );

    return;

  }


  loading(
    true,
    "Media hazırlanır..."
  );


  try{

    const media =
      await filesToData(
        selectedFiles
      );


    const object = {

      id:
        "spatial_"+Date.now()+
        "_"+
        Math.random()
        .toString(36)
        .slice(2),

      type,

      name,

      username,

      bio,

      article,

      phone,

      whatsapp,

      social,

      lat,

      lng,

      radius,

      media,

      author:
        myProfile.name,

      createdAt:
        Date.now()

    };


    await saveObject(
      object
    );


    spatialObjects.push(
      object
    );


    $("createModal")
      .classList.remove("show");


    loading(false);


    updateAR();

    renderFeed();

    renderMapMarkers();


    toast(
      "🌍 Profil dəqiq koordinata yerləşdirildi."
    );


  }catch(e){

    console.error(e);

    loading(false);

    toast(
      "Yerləşdirmə zamanı xəta baş verdi."
    );

  }

}


/* =====================================================
   DETAIL SPATIAL PROFILE
===================================================== */

function openDetail(obj){

  const body =
    $("detailBody");

  let mediaHTML = "";


  if(
    obj.media &&
    obj.media.length
  ){

    mediaHTML =
      `<div class="mediaGrid">`+
      obj.media
      .map(
        m=>{

          if(
            m.type.startsWith("video/")
          ){

            return `
              <video
                controls
                playsinline
                src="${m.data}">
              </video>
            `;

          }

          return `
            <img
              src="${m.data}">
          `;

        }
      )
      .join("")+
      `</div>`;

  }


  let buttons = "";


  if(obj.phone){

    buttons += `
      <button
        class="button primary"
        onclick="window.location.href='tel:${obj.phone}'">
        ☎️ Zəng
      </button>
    `;

  }


  if(obj.whatsapp){

    const number =
      obj.whatsapp
        .replace(/\D/g,"");

    buttons += `
      <button
        class="button"
        onclick="window.open(
          'https://wa.me/${number}',
          '_blank'
        )">
        💬 WhatsApp
      </button>
    `;

  }


  buttons += `
    <button
      class="button"
      onclick="openRoute(
        ${obj.lat},
        ${obj.lng}
      )">
      🧭 Marşrut
    </button>
  `;


  if(obj.social){

    buttons += `
      <button
        class="button"
        onclick="openSocial('${escapeHTML(obj.social)}')">
        🔗 Sosial / sayt
      </button>
    `;

  }


  body.innerHTML = `

    ${mediaHTML}

    <div class="detailName">
      ${escapeHTML(obj.name)}
    </div>

    <div class="detailUsername">
      ${escapeHTML(obj.username || "")}
    </div>

    <div style="margin-top:8px;color:#45dcff;font-size:13px">
      ${typeName(obj.type)}
    </div>

    <div class="detailBio">
      ${escapeHTML(obj.bio || "")}
    </div>

    ${
      obj.article
      ?
      `
      <div class="detailArticle">
        ${escapeHTML(obj.article)}
      </div>
      `
      :
      ""
    }

    <div style="
      margin-top:15px;
      color:#8fa1b7;
      font-size:12px">

      📍 ${Number(obj.lat).toFixed(7)},
      ${Number(obj.lng).toFixed(7)}

    </div>

    <div class="detailButtons">
      ${buttons}
    </div>

  `;


  $("detailModal")
    .classList.add("show");

}


$("closeDetail")
.addEventListener(
  "click",
  ()=>{
    $("detailModal")
      .classList.remove("show");
  }
);


window.openRoute =
function(lat,lng){

  const url =
    "https://www.google.com/maps/dir/?api=1&destination="+
    encodeURIComponent(
      lat+","+lng
    );

  window.open(
    url,
    "_blank"
  );

};


window.openSocial =
function(url){

  if(
    !/^https?:\/\//i.test(url)
  ){

    url =
      "https://"+
      url;

  }

  window.open(
    url,
    "_blank"
  );

};


/* =====================================================
   FEED
===================================================== */

function renderFeed(){

  const list =
    $("feedList");

  list.innerHTML = "";


  if(!spatialObjects.length){

    list.innerHTML = `

      <div class="profileBox">

        <div style="font-size:45px">
          🌍
        </div>

        <h3>
          Dünya hələ boşdur
        </h3>

        <div class="profileBio">
          ＋ düyməsinə bas və ilk
          spatial profilini yerləşdir.
        </div>

      </div>

    `;

    return;

  }


  [...spatialObjects]
    .sort(
      (a,b)=>
        b.createdAt-a.createdAt
    )
    .forEach(
      obj=>{

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "card";


        let media = "";

        if(
          obj.media &&
          obj.media.length
        ){

          media =
            `<div class="mediaGrid">`+
            obj.media
            .slice(0,4)
            .map(
              m=>

              m.type.startsWith("video/")
              ?
              `<video
                muted
                src="${m.data}">
              </video>`
              :
              `<img
                src="${m.data}">`

            )
            .join("")+
            `</div>`;

        }


        card.innerHTML = `

          ${media}

          <div class="cardBody">

            <div class="cardTitle">
              ${escapeHTML(obj.name)}
            </div>

            <div class="cardMeta">
              ${typeName(obj.type)}
            </div>

            <div class="cardText">
              ${escapeHTML(obj.bio || "")}
            </div>

            <button
              class="button"
              style="width:100%;margin-top:13px">
              🌍 Spatial profilə bax
            </button>

          </div>

        `;


        card.querySelector(
          "button"
        ).onclick =
          ()=>{
            openDetail(obj);
          };


        list.appendChild(card);

      }
    );

}


/* =====================================================
   MAP
===================================================== */

function initMap(){

  if(map)
    return;


  map =
    L.map("map")
      .setView(
        [
          userLat || 40.4093,
          userLng || 49.8671
        ],
        15
      );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);


  map.on(
    "click",
    mapPickHandler
  );


  renderMapMarkers();

}


function renderMapMarkers(){

  if(!map)
    return;


  markers.forEach(
    m=>m.remove()
  );

  markers = [];


  spatialObjects.forEach(
    obj=>{

      const marker =
        L.marker([
          obj.lat,
          obj.lng
        ]).addTo(map);


      marker.bindPopup(`

        <b>
          ${escapeHTML(obj.name)}
        </b>

        <br>

        ${typeName(obj.type)}

        <br><br>

        <button
          onclick="openMapObject('${obj.id}')">
          Profilə bax
        </button>

      `);


      markers.push(marker);

    }
  );


  if(
    userLat !== null &&
    userLng !== null
  ){

    const me =
      L.circleMarker(
        [
          userLat,
          userLng
        ],
        {
          radius:8,
          color:"#45dcff",
          fillColor:"#45dcff",
          fillOpacity:.9
        }
      ).addTo(map);


    me.bindPopup(
      "📍 Sizin mövqeyiniz"
    );


    markers.push(me);

  }

}


window.openMapObject =
function(id){

  const obj =
    spatialObjects.find(
      x=>x.id===id
    );

  if(obj)
    openDetail(obj);

};


function updateMap(){

  if(!map)
    return;

}


/* =====================================================
   NAVIGATION
===================================================== */

function switchView(view){

  activeView =
    view;


  $("arView").style.display =
    view==="ar"
      ? "block"
      : "none";


  document
    .querySelectorAll(".view")
    .forEach(
      v=>{
        v.classList.remove(
          "active"
        );
      }
    );


  if(view==="map"){

    $("mapView")
      .classList.add("active");


    setTimeout(
      ()=>{

        initMap();

        map.invalidateSize();

      },
      100
    );

  }


  if(view==="feed"){

    $("feedView")
      .classList.add("active");

    renderFeed();

  }


  if(view==="profile"){

    $("profileView")
      .classList.add("active");

  }


  document
    .querySelectorAll(
      ".nav[data-view]"
    )
    .forEach(
      n=>{

        n.classList.toggle(
          "active",
          n.dataset.view===view
        );

      }
    );


  if(view==="ar")
    updateAR();

}


document
.querySelectorAll(
  ".nav[data-view]"
)
.forEach(
  btn=>{

    btn.onclick =
      ()=>{
        switchView(
          btn.dataset.view
        );
      };

  }
);

   MY PROFILE

function updateMyProfile(){

  $("myName").textContent =
    myProfile.name;

  $("myUsername").textContent =
    myProfile.username;

  $("myBio").textContent =
    myProfile.bio;

  $("myAvatar").textContent =
    (
      myProfile.name ||
      "A"
    ).charAt(0)
     .toUpperCase();

}


$("editMyProfile")
.onclick =
()=>{

  $("myNameInput").value =
    myProfile.name;

  $("myUsernameInput").value =
    myProfile.username;

  $("myBioInput").value =
    myProfile.bio;

  $("profileModal")
    .classList.add("show");

};


$("closeProfile")
.onclick =
()=>{

  $("profileModal")
    .classList.remove("show");

};


$("saveMyProfile")
.onclick =
async()=>{

  myProfile.name =
    $("myNameInput")
      .value
      .trim() ||
    "ARWORLD istifadəçisi";

  myProfile.username =
    $("myUsernameInput")
      .value
      .trim() ||
    "@arworld";

      .value
      .trim();


  await saveProfile();

  updateMyProfile();

    .classList.remove("show");


  toast(

  );

};


/* =====================================================
   SEARCH
===================================================== */

$("searchBtn")
.onclick =
()=>{

  $("searchBox")
    .classList.toggle("show");

  if(
    $("searchBox")
      .classList.contains("show")
  ){

    $("searchInput")
      .focus();

  }

};


$("searchInput")
.oninput =
()=>{

  const q =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();


  const found =
    spatialObjects.filter(
      obj=>
        obj.name
          .toLowerCase()
          .includes(q) ||

        (obj.bio||"")
          .toLowerCase()
          .includes(q) ||

        (obj.article||"")
          .toLowerCase()
          .includes(q)
    );


  if(!q){

    updateAR();

    return;

  }


  const old =
    $("arObjects");

  old.innerHTML = "";


  found.forEach(
    obj=>{

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "arObject stable";

      card.style.left =
        "50%";

      card.style.top =
        "45%";


      card.innerHTML = `

        <div class="arName">
          ${escapeHTML(obj.name)}
        </div>

        <div class="arType">
          ${typeName(obj.type)}
        </div>

        <div class="arBio">
          ${escapeHTML(obj.bio||"")}
        </div>

        <button class="arOpen">
          PROFİLİ AÇ
        </button>

      `;


      card.querySelector(
        ".arOpen"
      ).onclick =
        ()=>{
          openDetail(obj);
        };


      old.appendChild(card);

    }
  );

};

   INITIALIZATION

async function init(){

  try{

    await openDB();


    const saved =
      await loadProfile();


    if(saved){

      myProfile =
        saved;

    }


    spatialObjects =
      await loadObjects();


    updateMyProfile();

    renderFeed();

    startGPS();

    startCompass();

    startCamera();


  }catch(e){

    console.error(e);

    toast(
      "ARWORLD başladılarkən xəta baş verdi."
    );

  }

}


document.addEventListener(

);
