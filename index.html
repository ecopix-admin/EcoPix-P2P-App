<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dualinqo World - Multi-Language Learning</title>
  <style>
    :root {
      --primary: #58cc02;
      --primary-dark: #46a302;
      --secondary: #1cb0f6;
      --accent: #ff4b4b;
      --gold: #ffc800;
      --purple: #ce82ff;
      --bg: #f7f9fa;
      --card-bg: #ffffff;
      --text: #3c3c3c;
      --text-sub: #777777;
      --border: #e5e5e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; height: 100vh; overflow: hidden; }

    #app { width: 100%; max-width: 480px; height: 100%; background: var(--card-bg); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

    /* TOP BAR */
    header { height: 60px; border-bottom: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; z-index: 10; }
    .stat-item { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
    .stat-icon { font-size: 18px; }

    /* NAV BAR */
    nav { height: 60px; border-top: 2px solid var(--border); display: flex; justify-content: space-around; align-items: center; background: #fff; z-index: 10; }
    .nav-btn { border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); font-size: 11px; font-weight: 700; cursor: pointer; width: 25%; }
    .nav-btn.active { color: var(--primary); }
    .nav-btn span { font-size: 20px; }

    /* MAIN CONTENT AREA */
    main { flex: 1; overflow-y: auto; position: relative; padding-bottom: 20px; scroll-behavior: smooth; }
    .page { display: none; padding: 16px; height: 100%; }
    .page.active { display: block; }

    /* MAP PAGE */
    .unit-card { background: var(--primary); color: #fff; padding: 16px; border-radius: 16px; margin-bottom: 24px; text-align: center; font-weight: bold; box-shadow: 0 4px 0 var(--primary-dark); }
    .map-container { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 10px 0; }
    .stage-btn { width: 70px; height: 70px; border-radius: 50%; border: none; background: #e5e5e5; color: #a0a0a0; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; box-shadow: 0 6px 0 #ccc; transition: transform 0.1s; }
    .stage-btn.unlocked { background: var(--primary); color: #fff; box-shadow: 0 6px 0 var(--primary-dark); }
    .stage-btn.completed { background: var(--gold); color: #fff; box-shadow: 0 6px 0 #d6a800; }
    .stage-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #999; }
    .stage-btn .crown { position: absolute; top: -10px; font-size: 16px; }

    /* QUIZ PAGE */
    #quiz-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 100; display: none; flex-direction: column; padding: 16px; }
    .quiz-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    .progress-bar { flex: 1; height: 12px; background: var(--border); border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    .close-btn { border: none; background: none; font-size: 24px; cursor: pointer; color: var(--text-sub); }

    .question-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; text-align: center; }
    .audio-btn { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin: 0 auto 20px auto; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .option-btn { border: 2px solid var(--border); border-bottom-width: 4px; padding: 16px; border-radius: 12px; background: #fff; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
    .option-btn.selected { border-color: var(--secondary); background: #ddf4ff; }

    /* WORD BANK */
    .word-bank-target { min-height: 60px; border-bottom: 2px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; margin-bottom: 20px; }
    .word-bank-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .word-chip { border: 2px solid var(--border); border-bottom-width: 4px; padding: 10px 14px; border-radius: 10px; background: #fff; font-weight: bold; cursor: pointer; }

    /* QUIZ FOOTER */
    .quiz-footer { margin-top: auto; padding-top: 16px; border-top: 2px solid var(--border); }
    .btn-main { width: 100%; padding: 16px; border: none; border-radius: 14px; background: var(--primary); color: white; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 var(--primary-dark); }
    .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--primary-dark); }

    /* SETTINGS MODAL */
    .settings-group { margin-bottom: 20px; }
    .settings-group label { font-weight: bold; display: block; margin-bottom: 8px; }
    .settings-group select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--border); font-size: 16px; }

    /* OVERLAY ALERTS */
    .feedback-banner { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; display: none; flex-direction: column; gap: 12px; z-index: 110; }
    .feedback-banner.correct { background: #d7ffb8; color: #46a302; }
    .feedback-banner.incorrect { background: #ffdfe0; color: #ea2b2b; }
  </style>
</head>
<body>

<div id="app">
  <!-- TOP STATUS BAR -->
  <header>
    <div class="stat-item"><span class="stat-icon">🔥</span><span id="txt-streak">0</span></div>
    <div class="stat-item"><span class="stat-icon">⚡</span><span id="txt-xp">0</span></div>
    <div class="stat-item"><span class="stat-icon">💎</span><span id="txt-gems">100</span></div>
    <div class="stat-item"><span class="stat-icon">❤️</span><span id="txt-hearts">5</span></div>
  </header>

  <!-- MAIN PAGES AREA -->
  <main>
    <!-- PAGE 1: MAP -->
    <div id="page-map" class="page active">
      <div class="unit-card" id="unit-header">Bölmə 1: A1 Əsaslar</div>
      <button class="btn-main" onclick="toggleUnlockAll()" style="margin-bottom: 16px; background: var(--secondary); box-shadow: 0 4px 0 #1899d6;" id="btn-unlock-all">🔓 Bütün Etapları Aç / Bağla</button>
      <div class="map-container" id="map-tree"></div>
    </div>

    <!-- PAGE 2: LEAGUE -->
    <div id="page-league" class="page">
      <h2 style="text-align: center; margin-bottom: 16px;" id="lbl-league">🏆 Tunc Liqası</h2>
      <div id="league-list"></div>
    </div>

    <!-- PAGE 3: SHOP -->
    <div id="page-shop" class="page">
      <h2 style="text-align: center; margin-bottom: 16px;" id="lbl-shop">🛒 Mağaza</h2>
      <div style="border: 2px solid var(--border); padding: 16px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h4 id="lbl-refill-hearts">Can Bərpası (❤️ 5)</h4>
          <p style="font-size: 12px; color: var(--text-sub);" id="lbl-refill-desc">Canlarınızı tam doldurun</p>
        </div>
        <button class="btn-main" style="width: auto; padding: 8px 16px;" onclick="buyHearts()">💎 50</button>
      </div>
    </div>

    <!-- PAGE 4: PROFILE & SETTINGS -->
    <div id="page-profile" class="page">
      <h2 style="text-align: center; margin-bottom: 16px;" id="lbl-profile">👤 Profil və Ayarlar</h2>
      
      <div class="settings-group">
        <label id="lbl-learn-lang">Öyrənmək İstədiyiniz Dil:</label>
        <select id="select-target-lang" onchange="changeTargetLanguage(this.value)">
          <option value="en">İngilis dili (English)</option>
          <option value="de">Alman dili (Deutsch)</option>
          <option value="zh">Çin dili (中文)</option>
          <option value="tr">Türk dili (Türkçe)</option>
        </select>
      </div>

      <div class="settings-group">
        <label id="lbl-ui-lang">Tətbiq Arayüz Dili (Interface Language):</label>
        <select id="select-ui-lang" onchange="changeUILanguage(this.value)">
          <option value="az">Azərbaycan dili</option>
          <option value="en">English</option>
          <option value="tr">Türkçe</option>
          <option value="de">Deutsch</option>
          <option value="ru">Русский</option>
        </select>
      </div>
    </div>
  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav>
    <button class="nav-btn active" onclick="showPage('map', this)"><span>🗺️</span><span id="nav-map">Xəritə</span></button>
    <button class="nav-btn" onclick="showPage('league', this)"><span>🏆</span><span id="nav-league">Liqa</span></button>
    <button class="nav-btn" onclick="showPage('shop', this)"><span>🛒</span><span id="nav-shop">Mağaza</span></button>
    <button class="nav-btn" onclick="showPage('profile', this)"><span>👤</span><span id="nav-profile">Profil</span></button>
  </nav>

  <!-- QUIZ MODAL OVERLAY -->
  <div id="quiz-page">
    <div class="quiz-header">
      <button class="close-btn" onclick="closeQuiz()">✕</button>
      <div class="progress-bar"><div class="progress-fill" id="quiz-progress"></div></div>
      <div class="stat-item">❤️ <span id="quiz-hearts">5</span></div>
    </div>

    <div id="quiz-body" style="flex: 1; display: flex; flex-direction: column; justify-content: center;"></div>

    <div class="quiz-footer">
      <button class="btn-main" id="btn-check" onclick="checkAnswer()">YOXLAYIN</button>
    </div>

    <div class="feedback-banner" id="feedback-banner">
      <h3 id="feedback-title">Əla!</h3>
      <p id="feedback-msg"></p>
      <button class="btn-main" onclick="nextQuestion()">DAVAM ET</button>
    </div>
  </div>
</div>

<script>
  // --- TRANSLATION DICTIONARY FOR UI ---
  const UI_DICT = {
    az: { map: "Xəritə", league: "Liqa", shop: "Mağaza", profile: "Profil", check: "YOXLAYIN", continue: "DAVAM ET", correct: "Əla!", incorrect: "Səhvdir!", unlockAll: "🔓 Bütün Etapları Aç / Bağla", refillHearts: "Can Bərpası (❤️ 5)", refillDesc: "Canlarınızı tam doldurun", learnLang: "Öyrənmək İstədiyiniz Dil:", uiLang: "Tətbiq Arayüz Dili:" },
    en: { map: "Map", league: "League", shop: "Shop", profile: "Profile", check: "CHECK", continue: "CONTINUE", correct: "Awesome!", incorrect: "Incorrect!", unlockAll: "🔓 Unlock / Lock All Stages", refillHearts: "Refill Hearts (❤️ 5)", refillDesc: "Full heart restoration", learnLang: "Language to Learn:", uiLang: "Interface Language:" },
    tr: { map: "Harita", league: "Lig", shop: "Mağaza", profile: "Profil", check: "KONTROL ET", continue: "DEVAM ET", correct: "Harika!", incorrect: "Yanlış!", unlockAll: "🔓 Tüm Aşama Kilitlerini Aç / Kapat", refillHearts: "Can Yenileme (❤️ 5)", refillDesc: "Canlarınızı fulleyin", learnLang: "Öğrenmek İstediğiniz Dil:", uiLang: "Uygulama Dili:" },
    de: { map: "Karte", league: "Liga", shop: "Shop", profile: "Profil", check: "PRÜFEN", continue: "WEITER", correct: "Super!", incorrect: "Falsch!", unlockAll: "🔓 Alle Stufen Freischalten", refillHearts: "Herzen auffüllen (❤️ 5)", refillDesc: "Herzen komplett aufladen", learnLang: "Sprache lernen:", uiLang: "Oberflächensprache:" },
    ru: { map: "Карта", league: "Лига", shop: "Магазин", profile: "Профиль", check: "ПРОВЕРИТЬ", continue: "ПРОДОЛЖИТЬ", correct: "Отлично!", incorrect: "Неверно!", unlockAll: "🔓 Разблокировать все этапы", refillHearts: "Восстановление жизней (❤️ 5)", refillDesc: "Полное восстановление", learnLang: "Изучаемый язык:", uiLang: "Язык интерфейса:" }
  };

  // --- QUESTION GENERATOR DATA BANKS ---
  const DATA_BANKS = {
    en: [
      { q: "Hello", a: "Salam", options: ["Salam", "Sağol", "Su", "Çörək"] },
      { q: "Water", a: "Su", options: ["Su", "Süd", "Ət", "Masa"] },
      { q: "Thank you", a: "Təşəkkür edirəm", options: ["Təşəkkür edirəm", "Xahiş edirəm", "Bəli", "Xeyr"] },
      { q: "I drink water", a: ["Mən", "su", "içirəm"], type: "wordbank", pool: ["Mən", "su", "içirəm", "çörək", "yəyirəm"] }
    ],
    de: [
      { q: "Hallo", a: "Salam", options: ["Salam", "Sağol", "Təşəkkürlər", "Su"] },
      { q: "Wasser", a: "Su", options: ["Su", "Süd", "Çörək", "Bəli"] },
      { q: "Ich trinke Wasser", a: ["Mən", "su", "içirəm"], type: "wordbank", pool: ["Mən", "su", "içirəm", "çay", "əlma"] }
    ],
    zh: [
      { q: "你好 (Nǐ hǎo)", a: "Salam", options: ["Salam", "Sağol", "Bəli", "Su"] },
      { q: "水 (Shuǐ)", a: "Su", options: ["Su", "Çay", "Çörək", "Masa"] }
    ],
    tr: [
      { q: "Merhaba", a: "Salam", options: ["Salam", "Sağol", "Təşəkkür", "Bəli"] },
      { q: "Su", a: "Su", options: ["Su", "Çay", "Süd", "Masa"] }
    ]
  };

  // --- STATE MANAGEMENT ---
  let state = {
    streak: 1,
    xp: 0,
    gems: 100,
    hearts: 5,
    currentStage: 1,
    maxUnlockedStage: 1,
    forceUnlockAll: false,
    uiLang: "az",
    targetLang: "en"
  };

  // Load state from localStorage
  const savedState = localStorage.getItem('duo_master_state');
  if (savedState) state = { ...state, ...JSON.parse(savedState) };

  function saveState() {
    localStorage.setItem('duo_master_state', JSON.stringify(state));
    updateTopBar();
  }

  function updateTopBar() {
    document.getElementById('txt-streak').innerText = state.streak;
    document.getElementById('txt-xp').innerText = state.xp;
    document.getElementById('txt-gems').innerText = state.gems;
    document.getElementById('txt-hearts').innerText = state.hearts;
  }

  // --- NAVIGATION ---
  function showPage(pageId, btnEl) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`page-${pageId}`).classList.add('active');
    if(btnEl) btnEl.classList.add('active');
  }

  // --- UI LANGUAGE & DICTIONARY UPDATE ---
  function changeUILanguage(langKey) {
    state.uiLang = langKey;
    saveState();
    applyTranslations();
  }

  function changeTargetLanguage(targetKey) {
    state.targetLang = targetKey;
    saveState();
    renderMap();
  }

  function applyTranslations() {
    const dict = UI_DICT[state.uiLang] || UI_DICT.az;
    document.getElementById('nav-map').innerText = dict.map;
    document.getElementById('nav-league').innerText = dict.league;
    document.getElementById('nav-shop').innerText = dict.shop;
    document.getElementById('nav-profile').innerText = dict.profile;
    document.getElementById('btn-check').innerText = dict.check;
    document.getElementById('btn-unlock-all').innerText = dict.unlockAll;
    document.getElementById('lbl-refill-hearts').innerText = dict.refillHearts;
    document.getElementById('lbl-refill-desc').innerText = dict.refillDesc;
    document.getElementById('lbl-learn-lang').innerText = dict.learnLang;
    document.getElementById('lbl-ui-lang').innerText = dict.uiLang;
    document.getElementById('select-ui-lang').value = state.uiLang;
    document.getElementById('select-target-lang').value = state.targetLang;
  }

  // --- MAP RENDER (1000 STAGES) ---
  function renderMap() {
    const tree = document.getElementById('map-tree');
    tree.innerHTML = '';

    for (let i = 1; i <= 1000; i++) {
      const isUnlocked = state.forceUnlockAll || i <= state.maxUnlockedStage;
      const isCompleted = i < state.maxUnlockedStage;

      const btn = document.createElement('button');
      btn.className = `stage-btn ${isUnlocked ? 'unlocked' : ''} ${isCompleted ? 'completed' : ''}`;
      
      // Horizontal zig-zag offset
      const offset = Math.sin(i) * 50;
      btn.style.transform = `translateX(${offset}px)`;

      btn.innerHTML = `${isCompleted ? '★' : (isUnlocked ? i : '🔒')}`;
      if (isUnlocked) {
        btn.onclick = () => startQuiz(i);
      }
      tree.appendChild(btn);
    }
  }

  function toggleUnlockAll() {
    state.forceUnlockAll = !state.forceUnlockAll;
    saveState();
    renderMap();
  }

  // --- QUIZ LOGIC ---
  let currentQuizStage = 1;
  let currentQuestionIdx = 0;
  let quizQuestions = [];
  let selectedOption = null;
  let selectedWordBank = [];

  function startQuiz(stageNum) {
    if (state.hearts <= 0) {
      alert("Canınız bitib! Mağazadan bərpa edin.");
      return;
    }
    currentQuizStage = stageNum;
    currentQuestionIdx = 0;
    
    // Generate questions for this stage
    quizQuestions = generateQuestionsForStage(stageNum);
    
    document.getElementById('quiz-page').style.display = 'flex';
    document.getElementById('quiz-hearts').innerText = state.hearts;
    renderQuestion();
  }

  function generateQuestionsForStage(stage) {
    const bank = DATA_BANKS[state.targetLang] || DATA_BANKS.en;
    // Repeat and randomize items to make a 3-question lesson
    let list = [];
    for(let i=0; i<3; i++) {
      let item = bank[Math.floor(Math.random() * bank.length)];
      list.push(item);
    }
    return list;
  }

  function renderQuestion() {
    const q = quizQuestions[currentQuestionIdx];
    const body = document.getElementById('quiz-body');
    body.innerHTML = '';

    // Update progress bar
    const progress = ((currentQuestionIdx) / quizQuestions.length) * 100;
    document.getElementById('quiz-progress').style.width = `${progress}%`;

    selectedOption = null;
    selectedWordBank = [];

    const title = document.createElement('div');
    title.className = 'question-title';
    title.innerText = `"${q.q}" tərcüməsi nədir?`;
    body.appendChild(title);

    // Audio Button
    const audioBtn = document.createElement('button');
    audioBtn.className = 'audio-btn';
    audioBtn.innerHTML = '🔊 Tələffüzü Dinlə';
    audioBtn.onclick = () => speakText(q.q, state.targetLang);
    body.appendChild(audioBtn);

    if (q.type === 'wordbank') {
      // Word Bank UI
      const targetDiv = document.createElement('div');
      targetDiv.className = 'word-bank-target';
      targetDiv.id = 'wb-target';
      body.appendChild(targetDiv);

      const poolDiv = document.createElement('div');
      poolDiv.className = 'word-bank-pool';
      q.pool.forEach(word => {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerText = word;
        chip.onclick = () => {
          selectedWordBank.push(word);
          chip.style.visibility = 'hidden';
          updateWordBankTarget();
        };
        poolDiv.appendChild(chip);
      });
      body.appendChild(poolDiv);
    } else {
      // Multiple Choice Options
      const grid = document.createElement('div');
      grid.className = 'options-grid';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedOption = opt;
        };
        grid.appendChild(btn);
      });
      body.appendChild(grid);
    }
  }

  function updateWordBankTarget() {
    const targetDiv = document.getElementById('wb-target');
    targetDiv.innerHTML = '';
    selectedWordBank.forEach((w, idx) => {
      const chip = document.createElement('div');
      chip.className = 'word-chip';
      chip.innerText = w;
      chip.onclick = () => {
        selectedWordBank.splice(idx, 1);
        updateWordBankTarget();
        // re-enable in pool if needed
      };
      targetDiv.appendChild(chip);
    });
  }

  function speakText(text, lang) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'en' ? 'en-US' : (lang === 'de' ? 'de-DE' : 'tr-TR');
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkAnswer() {
    const q = quizQuestions[currentQuestionIdx];
    let isCorrect = false;

    if (q.type === 'wordbank') {
      isCorrect = JSON.stringify(selectedWordBank) === JSON.stringify(q.a);
    } else {
      isCorrect = selectedOption === q.a;
    }

    const banner = document.getElementById('feedback-banner');
    const dict = UI_DICT[state.uiLang] || UI_DICT.az;

    if (isCorrect) {
      banner.className = 'feedback-banner correct';
      document.getElementById('feedback-title').innerText = dict.correct;
      document.getElementById('feedback-msg').innerText = "Əla cavab verdiniz!";
    } else {
      banner.className = 'feedback-banner incorrect';
      document.getElementById('feedback-title').innerText = dict.incorrect;
      document.getElementById('feedback-msg').innerText = `Doğru cavab: ${Array.isArray(q.a) ? q.a.join(' ') : q.a}`;
      state.hearts = Math.max(0, state.hearts - 1);
      document.getElementById('quiz-hearts').innerText = state.hearts;
      saveState();
    }
    banner.style.display = 'flex';
  }

  function nextQuestion() {
    document.getElementById('feedback-banner').style.display = 'none';
    currentQuestionIdx++;

    if (currentQuestionIdx >= quizQuestions.length) {
      // Stage Complete
      alert("Təbriklər! Etap Tamamlandı. +10 XP");
      state.xp += 10;
      if (currentQuizStage === state.maxUnlockedStage) {
        state.maxUnlockedStage++;
      }
      saveState();
      closeQuiz();
      renderMap();
    } else {
      renderQuestion();
    }
  }

  function closeQuiz() {
    document.getElementById('quiz-page').style.display = 'none';
  }

  function buyHearts() {
    if (state.gems >= 50) {
      state.gems -= 50;
      state.hearts = 5;
      saveState();
      alert("Canlarınız tamamlandı!");
    } else {
      alert("Kifayət qədər ləl-cavahiriniz (💎) yoxdur.");
    }
  }

  // INITIALIZATION
  updateTopBar();
  applyTranslations();
  renderMap();
</script>
</body>
</html>
