<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Visual Share - Sİ Sənət Qalereyası</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Qalereya Toru (Grid) */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        .author {
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 12px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }

        .btn-paylash {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-paylash:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 AI Visual Share</h1>
        <p>Süni İntellekt İşləri: Paylaş, Baxış Yığ və Qazan!</p>
    </header>

    <div class="gallery">
        <!-- Post 1 -->
        <div class="card">
            <img src="https://picsum.photos/400/300?random=1" alt="AI Art">
            <div class="card-body">
                <div class="card-title">Kosmik Şəhər Vizyonu</div>
                <div class="author">Müəllif: @AI_Master</div>
                <div class="stats">
                    <span>👁️ 12.4k Baxış</span>
                    <span>💰 15.50 ₼</span>
                </div>
                <button class="btn-paylash">Prompt-u Aç / Satın Al</button>
            </div>
        </div>

        <!-- Post 2 -->
        <div class="card">
            <img src="https://picsum.photos/400/300?random=2" alt="AI Art">
            <div class="card-body">
                <div class="card-title">Kiberpank Bakı 2080</div>
                <div class="author">Müəllif: @Futuristic_AZ</div>
                <div class="stats">
                    <span>👁️ 8.1k Baxış</span>
                    <span>💰 10.12 ₼</span>
                </div>
                <button class="btn-paylash">Prompt-u Aç / Satın Al</button>
            </div>
        </div>

        <!-- Post 3 -->
        <div class="card">
            <img src="https://picsum.photos/400/300?random=3" alt="AI Art">
            <div class="card-body">
                <div class="card-title">Neon Portret Portfeli</div>
                <div class="author">Müəllif: @DigitalArtist</div>
                <div class="stats">
                    <span>👁️ 19.3k Baxış</span>
                    <span>💰 24.15 ₼</span>
                </div>
                <button class="btn-paylash">Prompt-u Aç / Satın Al</button>
            </div>
        </div>
    </div>

</body>
</html>
