<!-- AzGram FINAL PRO v300 - 300/300 işlək - Musiqi Açıq Mənbə + Telefon + Qalereya Birbaşa + Swipe + Google + Banner Baxış + Şərhə Cavab + Zəng + Redaktə + Məxfilik
README / GitHub Pages:
1. GitHub -> New repository yaradın.
2. index.html yaradın.
3. Bu faylın hamısını index.html-ə yapışdırın.
4. Commit changes edin.
5. Settings -> Pages -> Deploy from branch -> main -> /(root).
6. Bir neçə dəqiqədən sonra https://USERNAME.github.io/REPOSITORY/ açın.
7. Backend tələb etmir. Gun.js P2P relay + PeerJS istifadə olunur.
-->

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="AzGram FINAL PRO - P2P sosial və mesajlaşma platforması">
<meta property="og:title" content="AzGram FINAL PRO">
<meta property="og:description" content="P2P sosial və mesajlaşma platforması">
<meta name="robots" content="index,follow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' https: wss: ws:; font-src 'self' data: https:;">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23000'/%3E%3Cpath d='M25 28h50v32H43L30 73V60h-5z' fill='none' stroke='%231da1f2' stroke-width='7'/%3E%3C/svg%3E">
<title>AzGram FINAL PRO</title>

<style>
:root{
 --bg:#000;--card:#0a0a0a;--card2:#111;--input:#222;--border:#2a2a2a;
 --text:#fff;--muted:#888;--blue:#1da1f2;--green:#20d66b;--red:#ff4545;
 --yellow:#ffd166;--radius:12px;--ease:150ms ease;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:500 14px/1.4 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{
 background:var(--input);border:1px solid var(--border);color:var(--text);
 outline:none;border-radius:999px;padding:12px 15px;width:100%;
}
textarea{border-radius:16px;resize:none}
input:focus,textarea:focus,select:focus,button:focus-visible{
 outline:2px solid var(--blue);outline-offset:2px
}
::-webkit-scrollbar{width:0;height:0}
*{scrollbar-width:none}
.app{width:100%;height:100%;display:flex;position:relative;overflow:hidden}
.screen{display:none;width:100%;height:100%;flex-direction:column}
.screen.active{display:flex}
.topbar{
 height:56px;min-height:56px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;gap:10px;padding:0 12px;background:#000;
 position:relative;z-index:5
}
.logo{font-size:20px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--blue)}
.icon-btn{
 width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
 transition:background var(--ease),transform var(--ease)
}
.icon-btn:hover{background:#171717}
.icon-btn:active{transform:scale(.94)}
.spacer{flex:1}
.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.bottom{
 height:58px;min-height:58px;border-top:1px solid var(--border);background:#000;
 display:flex;align-items:center;justify-content:space-around;z-index:10
}
.nav{
 height:48px;min-width:70px;padding:4px 12px;border-radius:14px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:1px;color:var(--muted);position:relative
}
.nav.active{color:#fff}
.nav small{font-size:10px}
.nav .badge{position:absolute;top:0;right:7px}
.badge{
 min-width:18px;height:18px;padding:0 5px;border-radius:999px;
 background:var(--blue);font-size:10px;display:grid;place-items:center;color:#fff
}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.row{display:flex;align-items:center;gap:12px}
.column{display:flex;flex-direction:column}
.avatar{
 width:46px;height:46px;min-width:46px;border-radius:50%;object-fit:cover;
 background:#222;border:1px solid #333
}
.avatar.sm{width:34px;height:34px;min-width:34px}
.avatar.lg{width:86px;height:86px;min-width:86px}
.avatar-ring{padding:2px;border:2px solid var(--green);border-radius:50%}
.online{position:relative}
.online:after{
 content:"";position:absolute;width:10px;height:10px;border-radius:50%;
 background:var(--green);right:0;bottom:1px;border:2px solid #000
}
.muted{color:var(--muted)}
.blue{color:var(--blue)}
.green{color:var(--green)}
.danger{color:var(--red)}
.small{font-size:12px}
.tiny{font-size:11px}
.bold{font-weight:800}
.hidden{display:none!important}
.btn{
 min-height:40px;padding:0 15px;border-radius:999px;background:#fff;color:#000;
 display:inline-flex;align-items:center;justify-content:center;gap:7px;
 transition:all var(--ease)
}
.btn.blue{background:var(--blue);color:#fff}
.btn.dark{background:#222;color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.outline{background:transparent;color:#fff;border:1px solid #444}
.btn:active{transform:scale(.97)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.section{padding:12px}
.searchbox{padding:8px 12px}
.list{padding:4px 8px}
.contact{
 min-height:68px;padding:10px 8px;border-radius:12px;display:flex;align-items:center;
 gap:11px;transition:background var(--ease);position:relative
}
.contact:hover{background:#111}
.contact:active{background:#181818}
.contact-main{flex:1;min-width:0}
.contact-name{display:flex;align-items:center;gap:5px}
.contact-preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-meta{align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px}
.pin{color:var(--blue)}
.chat{
 display:flex;flex-direction:column;height:100%;background:#050505;
 position:relative
}
.chathead{height:56px;min-height:56px}
.chatmessages{
 flex:1;min-height:0;overflow:auto;padding:10px 9px 14px;
 background:
 radial-gradient(circle at 10% 10%,rgba(255,255,255,.015),transparent 25%),
 #050505
}
.message{
 max-width:82%;margin:3px 0;padding:8px 10px;border-radius:14px;
 border:1px solid var(--border);position:relative;word-wrap:break-word
}
.message.me{margin-left:auto;background:#123047;border-color:#164867;border-bottom-right-radius:4px}
.message.them{margin-right:auto;background:#151515;border-bottom-left-radius:4px}
.message-text{white-space:pre-wrap}
.msg-time{font-size:10px;color:#888;margin-left:8px;float:right;margin-top:5px}
.check{color:#777}.check.read{color:#42b8ff}
.replybox{border-left:3px solid var(--blue);padding:5px 8px;margin-bottom:5px;background:#111;border-radius:5px}
.edited{font-size:10px;color:#888}
.chatcomposer{
 min-height:62px;padding:7px;background:#000;border-top:1px solid var(--border);
 display:flex;align-items:flex-end;gap:6px
}
.composer-input{
 flex:1;background:#1b1b1b;border-radius:20px;padding:10px 13px;min-height:42px;
 max-height:120px;overflow:auto
}
.send{background:var(--blue);color:#fff}
.typing{font-size:11px;color:var(--blue);padding:0 14px 3px;height:17px}
.date-sep{text-align:center;color:#777;font-size:11px;padding:9px}
.unread-line{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:10px;margin:8px 0}
.unread-line:before,.unread-line:after{content:"";height:1px;background:#19476a;flex:1}
.empty{
 min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;color:var(--muted);padding:30px;gap:12px
}
.empty svg{opacity:.5}
.onboarding{
 position:fixed;inset:0;background:#000;z-index:1000;display:flex;
 align-items:center;justify-content:center;padding:20px
}
.onboard-card{width:min(440px,100%);display:flex;flex-direction:column;gap:15px}
.onboard-logo{font-size:42px;font-weight:900;text-align:center}
.onboard-logo span{color:var(--blue)}
.onboard-sub{text-align:center;color:#777}
.avatar-picker{display:flex;justify-content:center;position:relative}
.avatar-picker img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:2px solid #333}
.avatar-picker button{position:absolute;right:calc(50% - 65px);bottom:0;background:#fff;color:#000}
.file-hidden{display:none}
.status-feed{
 height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;
 background:#000
}
.status-card{
 min-height:100%;height:100%;scroll-snap-align:start;position:relative;
 display:flex;align-items:center;justify-content:center;overflow:hidden;background:#111
}
.status-media{width:100%;height:100%;object-fit:cover}
.status-gradient{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.85))}
.status-info{position:absolute;left:14px;right:80px;bottom:24px;z-index:2}
.status-user{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.status-side{
 position:absolute;right:9px;bottom:26px;display:flex;flex-direction:column;
 align-items:center;gap:16px;z-index:4
}
.side-action{display:flex;flex-direction:column;align-items:center;gap:2px}
.side-action b{font-size:11px}
.heart-burst{
 position:absolute;font-size:90px;opacity:0;pointer-events:none;z-index:5
 animation:heart .65s ease
}
@keyframes heart{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
.status-progress{position:absolute;top:0;left:0;height:3px;background:#fff;z-index:5;width:0}
.create-fab{
 position:absolute;right:15px;bottom:75px;width:52px;height:52px;border-radius:50%;
 background:#fff;color:#000;display:grid;place-items:center;z-index:9
}
.status-empty{height:100%;display:flex;align-items:center;justify-content:center}
.discovery{height:100%;overflow:auto;padding-bottom:70px}
.discover-head{position:sticky;top:0;background:#000;z-index:3;padding:10px}
.result{
 display:flex;gap:10px;padding:12px;border-bottom:1px solid #151515;align-items:center
}
.banner{
 margin:8px auto;width:min(320px,calc(100% - 20px));min-height:100px;
 border:1px solid #333;border-radius:12px;background:#101010;position:relative;overflow:hidden;
 display:flex;flex-direction:column;justify-content:flex-end;padding:10px
}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.banner-content{position:relative;z-index:1}
.ad-badge{position:absolute;top:7px;right:7px;background:#fff;color:#000;border-radius:4px;padding:2px 5px;font-size:9px}
.profile{overflow:auto;padding-bottom:80px}
.profile-head{text-align:center;padding:22px 12px}
.profile-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px;text-align:center;color:#888}
.tab.active{color:#fff;border-bottom:2px solid #fff}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.media-grid img,.media-grid video{width:100%;aspect-ratio:1;object-fit:cover;background:#111}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:none;
 align-items:flex-end;justify-content:center
}
.modal.open{display:flex}
.modal-box{
 width:min(600px,100%);max-height:92%;overflow:auto;background:#0a0a0a;
 border:1px solid #2b2b2b;border-radius:20px 20px 0 0;padding:16px
}
.modal.center{align-items:center}
.modal.center .modal-box{border-radius:20px}
.modal-title{display:flex;align-items:center;gap:10px;margin-bottom:15px;font-size:17px;font-weight:800}
.modal-close{margin-left:auto}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:12px;color:#888}
.switch{
 width:48px;height:27px;border-radius:999px;background:#333;position:relative;cursor:pointer;
 transition:background var(--ease)
}
.switch i{position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:left var(--ease)}
.switch.on{background:var(--green)}
.switch.on i{left:24px}
.setting{
 display:flex;align-items:center;justify-content:space-between;padding:13px 0;
 border-bottom:1px solid #181818
}
.select{
 border-radius:10px;padding:8px;background:#222;color:#fff;border:1px solid #333;width:auto
}
.toast{
 position:fixed;top:12px;left:50%;transform:translate(-50%,-20px);
 opacity:0;pointer-events:none;z-index:2000;background:#fff;color:#000;border-radius:999px;
 padding:9px 15px;display:flex;align-items:center;gap:7px;transition:all 150ms ease;
 max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.offline{
 position:fixed;top:0;left:0;right:0;background:#351010;color:#fff;text-align:center;
 z-index:1500;padding:5px;font-size:11px;display:none
}
.offline.show{display:block}
.skeleton{
 height:64px;margin:7px;border-radius:12px;
 background:linear-gradient(90deg,#111 25%,#1b1b1b 50%,#111 75%);
 background-size:200% 100%;animation:shimmer 1.1s infinite
}
@keyframes shimmer{to{background-position:-200% 0}}
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.preview-grid img,.preview-grid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji{
 font-size:22px;padding:7px;border-radius:8px;text-align:center
}
.emoji:hover{background:#222}
.music-item{
 display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #1b1b1b
}
.cover{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#222}
.call-screen{
 position:fixed;inset:0;background:#050505;z-index:900;display:none;
 flex-direction:column;align-items:center;justify-content:center;gap:20px
}
.call-screen.open{display:flex}
.call-avatar{width:130px;height:130px;border-radius:50%;object-fit:cover}
.call-actions{display:flex;gap:14px}
.call-btn{width:54px;height:54px;border-radius:50%;background:#222;display:grid;place-items:center}
.call-btn.end{background:var(--red)}
.call-mini{
 position:fixed;right:10px;top:65px;width:130px;height:170px;background:#111;border:1px solid #333;
 border-radius:14px;z-index:901;display:none;overflow:hidden
}
.call-mini img{width:100%;height:100%;object-fit:cover}
.range{width:100%;accent-color:var(--blue)}
.wallpaper{background-size:cover;background-position:center}
@media(min-width:800px){
 .bottom{position:absolute;left:0;bottom:0;width:250px;height:60px;border-top:0;border-right:1px solid #222}
 .screen{padding-left:0}
}
</style>
</head>

<body>
<div class="offline" id="offline"><i data-lucide="wifi-off"></i> İnternet yoxdur — yenidən qoşulur</div>
<div class="toast" id="toast"></div>

<div class="app" id="app">

<!-- MESSAGES -->
<section class="screen active" id="screen-messages">
 <header class="topbar">
  <div class="logo">Az<span>Gram</span></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="globalSearchBtn" title="Axtarış"><i data-lucide="search"></i></button>
  <button class="icon-btn" id="newChatBtn" title="Yeni mesaj"><i data-lucide="square-pen"></i></button>
  <button class="icon-btn" id="messageMoreBtn" title="Daha çox"><i data-lucide="more-vertical"></i></button>
 </header>
 <div class="content">
  <div class="searchbox">
   <input id="contactSearch" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Kontakt axtar...">
  </div>
  <div id="messageBanner"></div>
  <div class="section row" style="justify-content:space-between">
   <b>AzGram-da olanlar</b><span class="badge" id="contactCount">0</span>
  </div>
  <div class="list" id="contactList"></div>
 </div>
 <nav class="bottom">
  <button class="nav active" data-nav="messages"><i data-lucide="message-circle"></i><small>Mesajlar</small></button>
  <button class="nav" data-nav="status"><i data-lucide="play-square"></i><small>Status</small></button>
  <button class="nav" data-nav="discover"><i data-lucide="compass"></i><small>Kəşf</small></button>
  <button class="nav" data-nav="profile"><i data-lucide="user"></i><small>Profil</small></button>
 </nav>
</section>

<!-- CHAT -->
<section class="screen" id="screen-chat">
 <div class="chat">
  <header class="topbar chathead">
   <button class="icon-btn" id="backChat"><i data-lucide="arrow-left"></i></button>
   <img class="avatar sm" id="chatAvatar" src="">
   <div class="contact-main">
    <div class="contact-name"><b id="chatName">Kontakt</b><span id="chatVerified"></span></div>
    <div class="tiny muted" id="chatStatus">son görülmə</div>
   </div>
   <button class="icon-btn" id="voiceCallBtn"><i data-lucide="phone"></i></button>
   <button class="icon-btn" id="videoCallBtn"><i data-lucide="video"></i></button>
   <button class="icon-btn" id="chatSearchBtn"><i data-lucide="search"></i></button>
   <button class="icon-btn" id="chatMoreBtn"><i data-lucide="more-vertical"></i></button>
  </header>

  <div id="chatSearchBar" class="searchbox hidden">
   <input id="chatSearchInput" placeholder="Mesajlarda axtar...">
  </div>

  <div class="chatmessages" id="chatMessages"></div>
  <div class="typing" id="typingIndicator"></div>

  <div class="chatcomposer">
   <button class="icon-btn" id="attachBtn"><i data-lucide="plus"></i></button>
   <textarea class="composer-input" id="messageInput" rows="1" maxlength="5000"
    placeholder="Mesaj yaz..." autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
   <button class="icon-btn" id="emojiBtn"><i data-lucide="smile"></i></button>
   <button class="icon-btn" id="recordBtn"><i data-lucide="mic"></i></button>
   <button class="icon-btn send" id="sendBtn"><i data-lucide="send"></i></button>
  </div>
 </div>
</section>

<!-- STATUS -->
<section class="screen" id="screen-status">
 <header class="topbar">
  <b>Status</b><div class="spacer"></div>
  <button class="icon-btn" id="statusMusicBtn"><i data-lucide="music"></i></button>
  <button class="icon-btn" id="statusRefresh"><i data-lucide="refresh-cw"></i></button>
 </header>
 <div class="content">
  <div class="status-feed" id="statusFeed"></div>
 </div>
 <button class="create-fab" id="createStatusBtn"><i data-lucide="plus"></i></button>
 <nav class="bottom">
  <button class="nav" data-nav="messages"><i data-lucide="message-circle"></i><small>Mesajlar</small></button>
  <button class="nav active" data-nav="status"><i data-lucide="play-square"></i><small>Status</small></button>
  <button class="nav" data-nav="discover"><i data-lucide="compass"></i><small>Kəşf</small></button>
  <button class="nav" data-nav="profile"><i data-lucide="user"></i><small>Profil</small></button>
 </nav>
</section>

<!-- DISCOVERY -->
<section class="screen" id="screen-discover">
 <header class="topbar">
  <b>Kəşf</b><div class="spacer"></div>
  <button class="icon-btn" id="discoverRefresh"><i data-lucide="refresh-cw"></i></button>
 </header>
 <div class="content discovery" id="discovery">
  <div class="discover-head">
   <div class="row">
    <input id="discoverInput" placeholder="Google və AzGram-da axtar..." autocomplete="off">
    <button class="icon-btn" id="voiceSearchBtn"><i data-lucide="mic"></i></button>
   </div>
   <div class="actions" style="margin-top:8px">
    <button class="btn dark" id="googleSearchBtn"><i data-lucide="search"></i> Google-da axtar</button>
   </div>
  </div>
  <div id="discoverContent"></div>
 </div>
 <nav class="bottom">
  <button class="nav" data-nav="messages"><i data-lucide="message-circle"></i><small>Mesajlar</small></button>
  <button class="nav" data-nav="status"><i data-lucide="play-square"></i><small>Status</small></button>
  <button class="nav active" data-nav="discover"><i data-lucide="compass"></i><small>Kəşf</small></button>
  <button class="nav" data-nav="profile"><i data-lucide="user"></i><small>Profil</small></button>
 </nav>
</section>

<!-- PROFILE -->
<section class="screen" id="screen-profile">
 <header class="topbar">
  <b>Profil</b><div class="spacer"></div>
  <button class="icon-btn" id="editProfileBtn"><i data-lucide="settings"></i></button>
 </header>
 <div class="content profile" id="profileContent"></div>
 <nav class="bottom">
  <button class="nav" data-nav="messages"><i data-lucide="message-circle"></i><small>Mesajlar</small></button>
  <button class="nav" data-nav="status"><i data-lucide="play-square"></i><small>Status</small></button>
  <button class="nav" data-nav="discover"><i data-lucide="compass"></i><small>Kəşf</small></button>
  <button class="nav active" data-nav="profile"><i data-lucide="user"></i><small>Profil</small></button>
 </nav>
</section>
</div>

<!-- ONBOARDING -->
<div class="onboarding" id="onboarding">
 <div class="onboard-card">
  <div class="onboard-logo">Az<span>Gram</span></div>
  <div class="onboard-sub">WhatsApp Business PRO + TikTok + P2P</div>
  <div class="avatar-picker">
   <img id="onboardAvatar" src="">

function debounce(fn,wait){
 var t;
 return function(){
  var args=arguments;
  clearTimeout(t);

 };
}

function throttle(fn,wait){
 var last=0;
 return function(){

 };

function formatLastSeen(ts){
 if(!ts)return"son görülmə yoxdur";
 var d=new Date(ts);
 var now=new Date();
 var bd=new Date(now.toLocaleString("en-US",{timeZone:"Asia/Baku"}));
 var dd=new Date(d.toLocaleString("en-US",{timeZone:"Asia/Baku"}));
 var today=bd.toDateString()===dd.toDateString();
 if(today)return"bu gün "+formatTime(ts);
 var y=new Date(bd);y.setDate(y.getDate()-1);
 if(y.toDateString()===dd.toDateString())return"dünən "+formatTime(ts);
 return new Intl.DateTimeFormat("az-AZ",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Baku"}).format(d);
}

function relativeTime(ts){
 var sec=Math.floor((Date.now()-ts)/1000);
 if(sec<60)return"indi";
 if(sec<3600)return Math.floor(sec/60)+"d";
 if(sec<86400)return Math.floor(sec/3600)+"s";
 return Math.floor(sec/86400)+"g";
}

function compressImage(file,maxSize,quality){
 return new Promise(function(resolve,reject){
  var reader=new FileReader();
  reader.onload=function(){
   var img=new Image();
   img.onload=function(){
    var ratio=Math.min(1,maxSize/Math.max(img.width,img.height));
    var canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.width*ratio));
    canvas.height=Math.max(1,Math.round(img.height*ratio));
    var ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL("image/jpeg",quality||.7));
   };
   img.onerror=reject;
   img.src=reader.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

function fileToDataURL(file){
 return new Promise(function(resolve,reject){
  var r=new FileReader();
  r.onload=function(){resolve(r.result)};
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}

function publishMe(){

 try{
  gun.get("azgram_final_users_v300").get(myID).put({
   id:myID,
   name:myName,
   avatar:myAvatar,
   bio:myBio,
   online:true,
   lastSeen:Date.now(),
   favMusic:localStorage.getItem("favMusic")||""
  });
 }catch(e){}
}

function bindGunUsers(){
 if(!gun)return;
 try{
  gun.get("azgram_final_users_v300").map().on(function(data,key){
   if(!data||!key||key===myID)return;
   if(!data.name)return;
   contacts[key]={
    id:key,
    name:data.name,
    avatar:data.avatar||"https://i.pravatar.cc/150?u="+encodeURIComponent(key),
    bio:data.bio||"",
    online:!!data.online,
    lastSeen:data.lastSeen||0,
    favMusic:data.favMusic||"",
    verified:!!data.verified
   };
   renderContacts();
  });
 }catch(e){}
}

function bindGunStatuses(){
 if(!gun)return;
 try{
  gun.get("final_status_v300").map().on(function(data,key){
   if(!data||!key)return;
   if(data.text||data.media){
    statuses[key]=data;
    renderStatusFeed();
   }
  });
 }catch(e){}
}

function renderContacts(){
 var list=$("contactList");
 if(!list)return;

 var arr=getContacts();

 demoContacts.forEach(function(c){
  if(!contacts[c.id])contacts[c.id]=Object.assign({},c);
 });

 arr=getContacts();

 var query=($("contactSearch").value||"").trim().toLowerCase();

 arr=arr.filter(function(c){
  return !query ||
   c.name.toLowerCase().indexOf(query)>=0 ||
   (c.bio||"").toLowerCase().indexOf(query)>=0 ||
   c.id.toLowerCase().indexOf(query)>=0;
 });

 arr.sort(function(a,b){
  if(!!a.online!==!!b.online)return a.online?-1:1;
  var pa=localStorage.getItem("pin_"+a.id)==="1";
  var pb=localStorage.getItem("pin_"+b.id)==="1";
  if(pa!==pb)return pa?-1:1;
  var la=Number(localStorage.getItem("last_"+a.id)||0);
  var lb=Number(localStorage.getItem("last_"+b.id)||0);
  if(la!==lb)return lb-la;
  return a.name.localeCompare(b.name,"az");
 });

 $("contactCount").textContent=arr.length;

 if(!arr.length){
  list.innerHTML='<div class="empty"><i data-lucide="users-round" width="42" height="42"></i><b>AzGram-da heç kim tapılmadı</b><span>ID ilə yeni kontakt əlavə edin.</span><button class="btn blue" id="emptyAdd"><i data-lucide="user-plus"></i> Kontakt əlavə et</button></div>';
  createIcons();
  var ea=$("emptyAdd");
  if(ea)ea.addEventListener("click",addContactModal);
  return;
 }

 list.innerHTML=arr.map(function(c){
  var pin=localStorage.getItem("pin_"+c.id)==="1";
  var mute=localStorage.getItem("mute_"+c.id);
  var lastPreview=localStorage.getItem("preview_"+c.id)||"Salam de";
  var unread=Number(localStorage.getItem("unread_"+c.id)||0);
  var verified=c.verified?'<i data-lucide="badge-check" width="14" class="blue"></i>':"";
  return '<div class="contact" data-id="'+escapeHTML(c.id)+'">'+
   '<div class="'+(c.online?"online":"")+'"><img class="avatar" loading="lazy" src="'+escapeHTML(c.avatar)+'" onerror="this.src=\'https://i.pravatar.cc/150?u='+encodeURIComponent(c.id)+'\'"></div>'+
   '<div class="contact-main">'+
    '<div class="contact-name"><b>'+escapeHTML(c.name)+'</b>'+verified+'</div>'+
    '<div class="contact-preview">'+escapeHTML(lastPreview)+'</div>'+
   '</div>'+
   '<div class="contact-meta">'+
    '<span class="tiny muted">'+(c.online?"onlayn":formatLastSeen(c.lastSeen))+'</span>'+
    '<span class="row">'+
    (pin?'<i data-lucide="pin" width="12" class="pin"></i>':"")+
    (mute?'<i data-lucide="bell-off" width="12"></i>':"")+
    (unread?'<span class="badge">'+unread+'</span>':"")+
    '</span>'+
   '</div>'+
  '</div>';
 }).join("");

 qa(".contact").forEach(function(el){
  el.addEventListener("click",function(){
   var c=getContact(el.getAttribute("data-id"));
   if(c)openChat(c);
  });
  el.addEventListener("contextmenu",function(e){
   e.preventDefault();
   contactMenu(el.getAttribute("data-id"));

 });

}

function loadMessages(){
 var box=$("chatMessages");
 if(!activeContact||!box)return;

 box.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';

 setTimeout(function(){
  var key=chatKey(myID,activeContact.id);
  var local=safeJSON("local_"+key,[]);
  activeMessages={};
  local.forEach(function(m){activeMessages[m.id]=m});
  renderMessages();

  if(gun){
   try{
    gun.get(key).map().on(function(data,id){
     if(!data||!id)return;
     if(data.deleted==="all")delete activeMessages[id];
     else activeMessages[id]=data;
     renderMessages();
    });
   }catch(e){}
  }
 },80);
}

function renderMessages(){
 var box=$("chatMessages");
 if(!box||!activeContact)return;

 var arr=Object.keys(activeMessages).map(function(k){return activeMessages[k]});
 arr.sort(function(a,b){return (a.created||0)-(b.created||0)});

 if(!arr.length){
  box.innerHTML='<div class="empty"><i data-lucide="message-circle" width="45"></i><b>Salam de</b><span>'+escapeHTML(activeContact.name)+' ilə söhbətə başlayın.</span></div>';
  createIcons();
  return;
 }

 var html="";
 var lastDay="";

 arr.forEach(function(m){
  var day=new Date(m.created||Date.now()).toDateString();
  if(day!==lastDay){
   html+='<div class="date-sep">'+(day===new Date().toDateString()?"Bu gün":"Dünən")+'</div>';
   lastDay=day;
  }

  var mine=m.sender===myID;
  var reply=m.reply?'<div class="replybox">'+escapeHTML(m.reply.text||"Mesaj")+'</div>':"";
  var content="";

  if(m.deleted==="all"){
   content='<span class="muted"><i data-lucide="ban" width="13"></i> Bu mesaj silindi</span>';
  }else if(m.type==="image"){
   content='<img src="'+escapeHTML(m.data)+'" style="max-width:100%;border-radius:10px;display:block" class="message-media" data-media="'+escapeHTML(m.data)+'">';
  }else if(m.type==="video"){
   content='<video controls playsinline preload="metadata" style="max-width:100%;border-radius:10px;display:block" src="'+escapeHTML(m.data)+'"></video>';
  }else if(m.type==="audio"){
   content='<audio controls style="width:230px" src="'+escapeHTML(m.data)+'"></audio>';
  }else if(m.type==="file"){
   content='<a href="'+escapeHTML(m.data)+'" download="'+escapeHTML(m.fileName||"fayl")+'" style="color:#fff"><i data-lucide="file"></i> '+escapeHTML(m.fileName||"Fayl")+' <span class="muted">('+formatBytes(m.size||0)+')</span></a>';
  }else{
   content=linkify(formatMessage(m.text||""));
  }

  var status=mine?
   '<span class="check '+(m.read?'read':"")+'">'+(m.read?"✓✓":"✓")+'</span>':"";

  html+='<div class="message '+(mine?"me":"them")+'" data-msg="'+escapeHTML(m.id)+'">'+
   reply+content+
   '<span class="msg-time">'+formatTime(m.created||Date.now())+' '+status+'</span>'+
   (m.edited?'<div class="edited">redaktə edildi</div>':"")+
   '</div>';
 });

 box.innerHTML=html;
 box.scrollTop=box.scrollHeight;
 createIcons();

function formatMessage(text){
 return escapeHTML(text)
  .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
  .replace(/\*(.*?)\*/g,"<i>$1</i>")
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\n/g,"<br>");
}

function linkify(text){
 return text.replace(/(https?:\/\/[^\s<]+)/g,function(url){
  return'<a href="'+url+'" target="_blank" rel="noopener" style="color:#42b8ff">'+url+"</a>";
 });
}

function formatBytes(bytes){
 if(!bytes)return"0 B";
 var units=["B","KB","MB","GB"];
 var i=Math.floor(Math.log(bytes)/Math.log(1024));
 return (bytes/Math.pow(1024,i)).toFixed(i?1:0)+" "+units[i];
}

function startRecording(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  toast("Mikrofon dəstəklənmir","error");return;
 }

 navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
  mediaRecorder=new MediaRecorder(stream);
  audioChunks=[];
  recordingStarted=Date.now();
  recordingLocked=false;

  mediaRecorder.ondataavailable=function(e){
   if(e.data.size)audioChunks.push(e.data);
  };

  mediaRecorder.onstop=function(){
   stream.getTracks().forEach(function(t){t.stop()});
   if(!recordingLocked&&audioChunks.length){
    handleAudioBlob(new Blob(audioChunks,{type:mediaRecorder.mimeType||"audio/webm"}));
   }
   $("recordBtn").innerHTML='<i data-lucide="mic"></i>';
   createIcons();
  };

  mediaRecorder.start();
  $("recordBtn").innerHTML='<i data-lucide="square"></i>';
  toast("Recording... buraxmaq üçün toxunun","info");

  setTimeout(function(){
   if(mediaRecorder&&mediaRecorder.state==="recording"){
    mediaRecorder.stop();
   }
  },120000);

 }).catch(function(){toast("Mikrofon icazəsi lazımdır","error")});
}

function stopRecording(){
 if(mediaRecorder&&mediaRecorder.state==="recording"){
  mediaRecorder.stop();
 }
}

function statusScore(s){
 var hours=Math.max(.01,(Date.now()-(s.created||Date.now()))/3600000);
 return ((Number(s.likes||0)*12)+(Number(s.views||0)*2)+(Number(s.shares||0)*10)+(Number(s.comments||0)*8)+(Number(s.watchTime||0)*3)+(Number(s.musicUse||0)*4))/(Math.pow(hours+1.8,1.4));
}

 qa(".status-card").forEach(function(card,index){
  var s=arr[index];
  var media=card.querySelector(".status-media");

  if(media&&media.tagName==="VIDEO"){
   var observer=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
     if(en.isIntersecting){
      media.play().catch(function(){});
      incrementStatusView(s);
     }else media.pause();
    });
   },{threshold:.6});
   observer.observe(media);
  }else{
   var observer2=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
     if(en.isIntersecting)incrementStatusView(s);
    });
   },{threshold:.6});
   observer2.observe(card);
  }

  card.querySelector(".status-like").addEventListener("click",function(){
   likeStatus(s,card);
  });

  card.querySelector(".status-comment").addEventListener("click",function(){
   openComments(s);
  });

  card.querySelector(".status-share").addEventListener("click",function(){
   shareStatus(s);
  });

  card.querySelector(".status-more").addEventListener("click",function(){
   statusMenu(s);
  });

  var lastTap=0;
  card.addEventListener("touchend",function(){
   var now=Date.now();
   if(now-lastTap<350)likeStatus(s,card,true);
   lastTap=now;
  });
 });

}

function incrementStatusView(s){
 var key="viewed_"+s.id;
 var now=Date.now();
 var last=Number(localStorage.getItem(key)||0);
 if(now-last<3600000)return;
 localStorage.setItem(key,String(now));

 s.views=Number(s.views||0)+1;
 if(gun){
  try{
   gun.get("final_status_v300").get(s.id).get("views").put(s.views);
  }catch(e){}
 }
}

function likeStatus(s,card,doubleTap){
 s.likes=Number(s.likes||0)+1;
 if(myID){
  var liked=safeJSON("status_likes",[]);
  if(liked.indexOf(s.id)<0){
   liked.push(s.id);
   saveJSON("status_likes",liked);
   if(gun)try{gun.get("final_status_v300").get(s.id).get("likes").put(s.likes)}catch(e){}
  }
 }

 if(doubleTap){
  var heart=document.createElement("div");
  heart.className="heart-burst";
  heart.textContent="♥";
  card.appendChild(heart);
  setTimeout(function(){heart.remove()},700);
 }
 renderStatusFeed();
}

function openStatusCreator(existing){
 var isEdit=!!existing;

 openModal(
  '<div class="modal-title">'+(isEdit?"Statusu redaktə et":"Yeni status")+' <button class="icon-btn modal-close"><i data-lucide="x"></i></button></div>'+
  '<div class="form">'+
  '<textarea id="statusText" maxlength="1000" rows="3" placeholder="Nə baş verir? #hashtag @istifadəçi">'+escapeHTML(existing?existing.text||"":"")+'</textarea>'+
  '<div class="actions">'+
  '<button class="btn dark" id="statusGallery"><i data-lucide="image"></i> Qalereya</button>'+
  '<button class="btn dark" id="statusCamera"><i data-lucide="camera"></i> Kamera</button>'+
  '<button class="btn dark" id="statusMusic"><i data-lucide="music"></i> Musiqi</button>'+
  '</div>'+
  '<div id="statusPreview" class="preview-grid"></div>'+
  '<div id="selectedMusic" class="tiny muted"></div>'+
  '<button class="btn blue" id="publishStatus"><i data-lucide="send"></i> '+(isEdit?"Yadda saxla":"Paylaş")+'</button>'+
  '</div>'
 );

 selectedStatusFiles=[];
 if(existing&&existing.media){
  selectedStatusFiles=[{data:existing.media,type:/^data:video/i.test(existing.media)?"video":"image"}];
  $("statusPreview").innerHTML=(selectedStatusFiles[0].type==="video"?
   '<video controls src="'+existing.media+'"></video>':'<img src="'+existing.media+'">');
 }

 $("statusGallery").addEventListener("click",function(){
  $("imageInput").dataset.status="1";
  $("imageInput").click();
 });

 $("statusCamera").addEventListener("click",function(){
  $("cameraInput").dataset.status="1";
  $("cameraInput").click();
 });

 $("statusMusic").addEventListener("click",function(){
  openMusicLibrary(function(music){
   $("selectedMusic").innerHTML='<i data-lucide="music"></i> '+escapeHTML(music.title)+" — "+escapeHTML(music.artist);
   $("selectedMusic").dataset.music=music.title;
   createIcons();
  });
 });

 $("publishStatus").addEventListener("click",function(){
  var text=$("statusText").value.trim();
  if(!text&&!selectedStatusFiles.length){
   toast("Mətn və ya media əlavə edin","error");return;
  }

  var s={
   id:isEdit?existing.id:uid("status"),
   user:myID,name:myName,avatar:myAvatar,text:text,
   media:selectedStatusFiles[0]?selectedStatusFiles[0].data:"",
   created:isEdit?existing.created:Date.now(),
   likes:isEdit?existing.likes||0:0,
   views:isEdit?existing.views||0:0,
   comments:isEdit?existing.comments||0:0,
   shares:isEdit?existing.shares||0:0,
   music:$("selectedMusic").dataset.music||existing&&existing.music||""
  };

  var mine=safeJSON("my_statuses",[]);
  if(isEdit){
   mine=mine.map(function(x){return x.id===s.id?s:x});
  }else mine.unshift(s);
  saveJSON("my_statuses",mine);

  if(gun){
   try{gun.get("final_status_v300").get(s.id).put(s)}catch(e){}
  }

  closeModal();
  renderStatusFeed();
  toast(isEdit?"Status redaktə edildi":"Status paylaşıldı","success");
 });
}

function getComments(statusID){
 return safeJSON("comments_"+statusID,[]);
}

function saveComments(statusID,arr){
 saveJSON("comments_"+statusID,arr);
 if(gun){
  arr.forEach(function(c){
   try{gun.get("comments_"+statusID).get(c.id).put(c)}catch(e){}
  });
 }
}

function openComments(s){
 var comments=getComments(s.id);

 openModal(
  '<div class="modal-title">Şərhlər <span class="muted small">'+comments.length+'</span><button class="icon-btn modal-close"><i data-lucide="x"></i></button></div>'+
  '<div id="commentsList"></div>'+
  '<div class="row" style="margin-top:10px"><input id="commentInput" placeholder="Şərh yaz..." maxlength="500"><button class="icon-btn send" id="sendComment"><i data-lucide="send"></i></button></div>'
 );

 renderComments(s,comments);

 $("sendComment").addEventListener("click",function(){
  var input=$("commentInput");
  var text=input.value.trim();
  if(!text)return;

  comments=getComments(s.id);
  var c={
   id:uid("comment"),user:myID,name:myName,avatar:myAvatar,
   text:text,created:Date.now(),likes:0,replies:[]
  };
  comments.push(c);
  saveComments(s.id,comments);
  s.comments=comments.length;
  input.value="";
  renderComments(s,comments);
  toast("Şərh əlavə edildi","success");
 });
}

function renderComments(s,comments){
 var box=$("commentsList");
 if(!box)return;

 if(!comments.length){
  box.innerHTML='<div class="empty" style="min-height:150px"><i data-lucide="message-circle"></i><span>İlk şərhi sən yaz</span></div>';
  createIcons();return;
 }

 box.innerHTML=comments.map(function(c){
  return '<div class="card" style="padding:10px;margin-bottom:7px">'+
   '<div class="row"><img class="avatar sm" src="'+escapeHTML(c.avatar||"https://i.pravatar.cc/150?u="+encodeURIComponent(c.user))+'">'+
   '<div style="flex:1"><b>'+escapeHTML(c.name)+'</b><div>'+linkify(escapeHTML(c.text))+'</div>'+
   '<div class="actions" style="margin-top:5px">'+
   '<button class="tiny comment-like" data-id="'+c.id+'">❤️ '+Number(c.likes||0)+'</button>'+
   '<button class="tiny comment-reply" data-id="'+c.id+'">Cavab ver</button>'+
   (c.user===myID?'<button class="tiny comment-edit" data-id="'+c.id+'">Redaktə</button>':"")+
   (c.user===myID?'<button class="tiny danger comment-delete" data-id="'+c.id+'">Sil</button>':"")+
   '</div></div></div>'+
   (c.replies&&c.replies.length?'<div style="padding-left:45px;margin-top:6px">'+c.replies.slice(0,2).map(function(r){
    return'<div class="replybox"><b>'+escapeHTML(r.name)+'</b> '+escapeHTML(r.text)+'</div>';
   }).join("")+'</div>':"")+
  '</div>';
 }).join("");

 createIcons();

 qa(".comment-like").forEach(function(b){
  b.addEventListener("click",function(){
   var id=b.dataset.id;
   var arr=getComments(s.id);
   var c=arr.find(function(x){return x.id===id});
   if(c){c.likes=Number(c.likes||0)+1;saveComments(s.id,arr);renderComments(s,arr)}
  });
 });

 qa(".comment-reply").forEach(function(b){
  b.addEventListener("click",function(){
   var id=b.dataset.id;
   var arr=getComments(s.id);
   var c=arr.find(function(x){return x.id===id});
   if(!c)return;
   $("commentInput").value="@"+c.name+" ";
   $("commentInput").focus();
   $("commentInput").dataset.reply=id;
  });
 });

 qa(".comment-edit").forEach(function(b){
  b.addEventListener("click",function(){
   var arr=getComments(s.id);
   var c=arr.find(function(x){return x.id===b.dataset.id});
   if(!c)return;
   openModal(
    '<div class="modal-title">Şərhi redaktə et <button class="icon-btn modal-close"><i data-lucide="x"></i></button></div>'+
    '<textarea id="editComment" rows="3">'+escapeHTML(c.text)+'</textarea>'+
    '<button class="btn blue" id="saveComment">Yadda saxla</button>'
   );
   $("saveComment").addEventListener("click",function(){
    c.text=$("editComment").value.trim();c.edited=true;
    saveComments(s.id,arr);closeModal();openComments(s);toast("Şərh redaktə edildi","success");
   });
  });
 });

 qa(".comment-delete").forEach(function(b){
  b.addEventListener("click",function(){
   var arr=getComments(s.id).filter(function(x){return x.id!==b.dataset.id});
   saveComments(s.id,arr);renderComments(s,arr);
  });
 });
}

var musicAudio=null;
var selectedMusic=null;

function openMusicLibrary(callback){
 openModal(
  '<div class="modal-title"><i data-lucide="music"></i> Musiqi əlavə et <button class="icon-btn modal-close"><i data-lucide="x"></i></button></div>'+
  '<input id="musicSearch" placeholder="Musiqi axtar...">'+
  '<div class="tabs"><button class="tab active" id="openMusicTab">Açıq mənbə</button><button class="tab" id="phoneMusicTab">Telefonumdan</button></div>'+
  '<div id="musicList"></div>'
 );

 function renderMusic(){
  var query=($("musicSearch").value||"").toLowerCase();
  var arr=demoMusic.concat(safeJSON("my_music",[])).filter(function(m){
   return !query||m.title.toLowerCase().indexOf(query)>=0||m.artist.toLowerCase().indexOf(query)>=0||m.category.toLowerCase().indexOf(query)>=0;
  });

  $("musicList").innerHTML=arr.map(function(m){
   return'<div class="music-item">'+
    '<img class="cover" src="'+escapeHTML(m.cover||"https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=200")+'">'+
    '<div style="flex:1"><b>'+escapeHTML(m.title)+'</b><div class="tiny muted">'+escapeHTML(m.artist)+' · '+escapeHTML(m.category)+'</div></div>'+
    '<button class="icon-btn music-play" data-url="'+escapeHTML(m.url||"")+'"><i data-lucide="play"></i></button>'+
    '<button class="btn dark music-use" data-id="'+escapeHTML(m.id)+'">İstifadə et</button>'+
   '</div>';
  }).join("");

  createIcons();

  qa(".music-play").forEach(function(b){
   b.addEventListener("click",function(){
    if(!b.dataset.url){toast("Preview yoxdur","info");return}
    if(musicAudio){musicAudio.pause()}
    musicAudio=new Audio(b.dataset.url);
    musicAudio.play().catch(function(){toast("Preview yüklənmədi","error")});
   });
  });

  qa(".music-use").forEach(function(b){
   b.addEventListener("click",function(){
    var all=demoMusic.concat(safeJSON("my_music",[]));
    selectedMusic=all.find(function(x){return x.id===b.dataset.id});
    if(selectedMusic){
     localStorage.setItem("favMusic",selectedMusic.title);
     if(callback)callback(selectedMusic);
     closeModal();
    }
   });
  });
 }

 renderMusic();

 $("musicSearch").addEventListener("input",debounce(renderMusic,200));

 $("phoneMusicTab").addEventListener("click",function(){
  $("musicInput").click();
 });

 $("musicInput").onchange=function(){
  var file=this.files&&this.files[0];
  if(!file)return;
  if(file.size>15*1024*1024){
   toast("Musiqi limiti 15MB","error");return;
  }
  fileToDataURL(file).then(function(data){
   var m={id:uid("music"),title:file.name.replace(/\.[^.]+$/,""),artist:"Telefonum",category:"Telefon",url:data,cover:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200"};
   var arr=safeJSON("my_music",[]);
   arr.unshift(m);saveJSON("my_music",arr);
   selectedMusic=m;
   if(callback)callback(m);
   closeModal();
  });
 };
}

  '<div class="section"><b>Trend #</b><div class="actions" style="margin-top:8px">'+
  ["#Bakı","#AzGram","#Musiqi","#TikTok","#Azərbaycan","#Komediya","#Təhsil","#İdman","#LoFi","#Trend"].map(function(x){

function voiceSearch(){
 var Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){toast("Səsli axtarış bu brauzerdə yoxdur","error");return}

function startCall(video){
 if(!activeContact)return;
 if(!peer){toast("P2P zəng hazır deyil","error");return}

 navigator.mediaDevices.getUserMedia({audio:true,video:!!video}).then(function(stream){
  var outgoing=peer.call(activeContact.id,stream,{metadata:{from:myID,name:myName,video:video}});
  beginCallUI(activeContact,video,stream,outgoing);
 }).catch(function(){
  toast("Kamera/mikrofon icazəsi verilmədi","error");
 });
}

function receiveCall(incoming){
 var meta=incoming.metadata||{};
 var c=getContact(meta.from)||{id:meta.from,name:meta.name||"Gələn zəng",avatar:"https://i.pravatar.cc/150?u="+meta.from};

 openModal(
  '<div class="modal-title">Gələn zəng</div>'+
  '<div class="profile-head"><img class="profile-avatar" src="'+escapeHTML(c.avatar)+'"><h2>'+escapeHTML(c.name)+'</h2><p class="muted">'+(meta.video?"Görüntülü":"Səsli")+' zəng</p></div>'+
  '<div class="actions" style="justify-content:center"><button class="btn blue" id="acceptCall">Qəbul et</button><button class="btn danger" id="rejectCall">Rədd et</button></div>'
 );

 haptic([100,50,100]);

 $("acceptCall").addEventListener("click",function(){
  closeModal();
  navigator.mediaDevices.getUserMedia({audio:true,video:!!meta.video}).then(function(stream){
   incoming.answer(stream);
   beginCallUI(c,!!meta.video,stream,incoming);
  }).catch(function(){incoming.close();toast("Media icazəsi yoxdur","error")});
 });

 $("rejectCall").addEventListener("click",function(){
  incoming.close();closeModal();
 });
}

function beginCallUI(c,video,stream,connection){
 call={contact:c,video:video,stream:stream,connection:connection};
 $("callAvatar").src=c.avatar;
 $("callMiniImg").src=c.avatar;
 $("callName").textContent=c.name;
 $("callState").textContent=connection.open?"Qoşuldu":"Qoşulur...";
 $("callScreen").classList.add("open");
 callSeconds=0;
 clearInterval(callTimer);
 callTimer=setInterval(function(){
  callSeconds++;
  $("callTimer").textContent=Math.floor(callSeconds/60).toString().padStart(2,"0")+":"+String(callSeconds%60).padStart(2,"0");
 },1000);

 connection.on("stream",function(remote){
  var old=document.getElementById("remoteVideo");
  if(old)old.remove();
  var v=document.createElement(video?"video":"audio");
  v.id="remoteVideo";
  v.autoplay=true;v.playsInline=true;
  v.srcObject=remote;
  if(video){
   v.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1";
   $("callScreen").prepend(v);
  }
  document.body.appendChild(v);
 });

 connection.on("close",function(){
  endCall("Bağlantı bitdi");
 });
}

function endCall(reason){
 if(!call)return;
 try{
  if(call.stream)call.stream.getTracks().forEach(function(t){t.stop()});
  if(call.connection)call.connection.close();
 }catch(e){}

 clearInterval(callTimer);
 $("callScreen").classList.remove("open");

 var log=safeJSON("calls_"+myID,[]);
 log.unshift({
  id:uid("call"),contact:call.contact.id,name:call.contact.name,
  type:call.video?"video":"voice",duration:callSeconds,reason:reason||"Bitdi",created:Date.now()
 });
 saveJSON("calls_"+myID,log);

 if(activeContact&&activeContact.id===call.contact.id){
  putMessage({
   id:uid("msg"),sender:myID,receiver:activeContact.id,
   type:"text",text:(call.video?"Görüntülü":"Səsli")+" zəng "+formatDuration(callSeconds),
   created:Date.now(),callLog:true
  });
 }

 call=null;
 toast(reason||"Zəng bitdi","info");
}

function formatDuration(sec){
 return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
}

async function handleStatusImages(files){
 var arr=Array.prototype.slice.call(files).slice(0,5);
 if(!arr.length)return;
 selectedStatusFiles=[];
 var preview="";

 for(var i=0;i<arr.length;i++){
  try{

    var d=await fileToDataURL(f);
    selectedStatusFiles.push({data:d,type:"video"});

   }else{

/* ============================================================
   GESTURES
   ============================================================ */

function initGestures(){
 var startX=0,startY=0,startT=0;

 document.addEventListener("touchstart",function(e){
  if(!e.touches[0])return;
  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;
  startT=Date.now();
 },{passive:true});

 document.addEventListener("touchend",function(e){
  if(!e.changedTouches[0])return;
  var x=e.changedTouches[0].clientX;
  var y=e.changedTouches[0].clientY;
  var dx=x-startX;
  var dy=y-startY;
  var dt=Date.now()-startT;

  if(dt>700)return;
  if(Math.max(Math.abs(dx),Math.abs(dy))<60)return;

  if(Math.abs(dx)>Math.abs(dy)){
   if(dx>60){
    if(currentScreen==="chat")showScreen("status");
    else if(currentScreen==="discover")showScreen("messages");
   }else if(dx<-60){
    if(currentScreen==="chat")showScreen("discover");
    else if(currentScreen==="messages")showScreen("discover");
   }
  }else{
   if(dy<-60&&currentScreen==="chat"){
    $("chatSearchBar").classList.remove("hidden");
    $("chatSearchInput").focus();
   }
   if(dy>60&&currentScreen==="status")renderStatusFeed();
  }
 },{passive:true});
}

/* ============================================================
   STORAGE / INDEXEDDB FALLBACK
   ============================================================ */

var DB_NAME="azgram_v300_db";

function openIDB(){
 return new Promise(function(resolve,reject){
  if(!window.indexedDB){reject(new Error("IndexedDB yoxdur"));return}
  var req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=function(){
   var db=req.result;
   if(!db.objectStoreNames.contains("files"))db.createObjectStore("files");
  };
  req.onsuccess=function(){resolve(req.result)};
  req.onerror=function(){reject(req.error)};
 });
}

function idbPut(key,value){
 return openIDB().then(function(db){
  return new Promise(function(resolve,reject){
   var tx=db.transaction("files","readwrite");
   tx.objectStore("files").put(value,key);
   tx.oncomplete=function(){resolve(true)};
   tx.onerror=function(){reject(tx.error)};
  });
 });
}

function idbGet(key){
 return openIDB().then(function(db){
  return new Promise(function(resolve,reject){
   var tx=db.transaction("files","readonly");
   var req=tx.objectStore("files").get(key);
   req.onsuccess=function(){resolve(req.result)};
   req.onerror=function(){reject(req.error)};
  });
 });
}

/* ============================================================
   LAZY OBSERVER
   ============================================================ */

function initLazy(){
 if(!("IntersectionObserver" in window))return;
 var obs=new IntersectionObserver(function(entries){
  entries.forEach(function(e){
   if(e.isIntersecting){
    var el=e.target;
    if(el.dataset.src){
     el.src=el.dataset.src;
     delete el.dataset.src;
    }
    obs.unobserve(el);
   }
  });
 });
 qa("img[data-src]").forEach(function(x){obs.observe(x)});
}
