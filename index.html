<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzSearch AI - Ağıllı Axtarış & Discover</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Yuxarı Panel */
        header {
            background-color: #1e293b;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
            white-space: nowrap;
        }

        .logo span { color: #f43f5e; }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 650px;
        }

        .search-box {
            display: flex;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px 0 0 20px;
            border: 2px solid #334155;
            border-right: none;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input:focus { border-color: #38bdf8; }

        .search-box button {
            padding: 0 18px;
            border-radius: 0 20px 20px 0;
            border: 2px solid #38bdf8;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
            overflow: hidden;
            margin-top: 2px;
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            color: #cbd5e1;
            font-size: 0.9rem;
            border-bottom: 1px solid #334155;
        }

        .suggestion-item:hover { background-color: #334155; color: #38bdf8; }

        /* Əsas Konteyner */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Discover & Widget Sahəsi */
        .discover-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
        }

        /* Weather Vidcet Kartları */
        .widgets-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .widget-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 12px;
            white-space: nowrap;
            font-size: 0.85rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Feed Kartları (Google Discover Stili) */
        .feed-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.2s;
        }

        .feed-card:active { transform: scale(0.98); }

        .feed-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #0f172a;
        }

        .feed-content {
            padding: 12px 15px;
        }

        .feed-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .feed-meta {
            font-size: 0.78rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feed-tag {
            background: #f43f5e;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* AI Cavab Bloku */
        #aiSummaryCard {
            display: none;
            background: #1e293b;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            margin: 10px;
            padding: 12px 15px;
        }

        .ai-header { color: #38bdf8; font-weight: bold; font-size: 0.85rem; margin-bottom: 6px; }
        .ai-content { font-size: 0.9rem; line-height: 1.4; color: #e2e8f0; }

        .iframe-wrapper {
            display: none;
            flex: 1;
            width: 100%;
            height: 80vh;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: calc(100% + 145px);
            margin-top: -145px;
            border: none;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="resetPage()">Az<span>Search</span> AI</a>
        <div class="search-container">
            <form class="search-box" onsubmit="executeSearch(event)">
                <input type="text" id="searchInput" placeholder="Axtarın və ya soruşun..." autocomplete="off" oninput="fetchSuggestions(this.value)">
                <button type="submit">Axtar</button>
            </form>
            <div id="suggestionsBox" class="suggestions-box"></div>
        </div>
    </header>

    <main>
        <!-- AI Cavab Card -->
        <div id="aiSummaryCard">
            <div class="ai-header">🤖 AZSEARCH AI ANALİZİ</div>
            <div class="ai-content" id="aiContent">Yüklənir...</div>
        </div>

        <!-- Axtarış Nəticələri Frame -->
        <div class="iframe-wrapper" id="iframeWrapper">
            <iframe id="resultsFrame"></iframe>
        </div>

        <!-- Discover Lenti (Əsas Səhifə) -->
        <div class="discover-container" id="discoverView">
            
            <!-- Vidcetlər -->
            <div class="widgets-bar">
                <div class="widget-card">🌤️ Bakı: 24°C</div>
                <div class="widget-card">🌅 Günəş: 06:30</div>
                <div class="widget-card">🎁 Gündəlik Bonus: +10 Xal</div>
            </div>

            <!-- Avtomatik Doldurulan Xəbər / Elan Kartları -->
            <div id="feedList">
                <!-- Şəxsi / Sponsorlu Elan (Örnek) -->
                <a href="#" class="feed-card">
                    <div class="feed-content">
                        <span class="feed-tag">XÜSUSİ TƏKLİF</span>
                        <div class="feed-title" style="margin-top:5px;">AzSearch ilə hər gün axtarış et, pulsuz 500 MB İnternet paketi qazan!</div>
                        <div class="feed-meta">AzSearch Reward • İndi Qatıl</div>
                    </div>
                </a>

                <!-- JS ilə Avtomatik Xəbərlər Yüklənəcək -->
            </div>

        </div>
    </main>

    <script>
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');

        // Google Autocomplete
        function fetchSuggestions(query) {
            query = query.trim();
            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                return;
            }
            const script = document.createElement('script');
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=showSuggestions`;
            document.body.appendChild(script);
        }

        function showSuggestions(data) {
            const results = data[1];
            if (!results || results.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }
            suggestionsBox.innerHTML = '';
            results.slice(0, 5).forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerText = item;
                div.onclick = () => {
                    searchInput.value = item;
                    suggestionsBox.style.display = 'none';
                    runSearch(item);
                };
                suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
        }

        function executeSearch(event) {
            event.preventDefault();
            suggestionsBox.style.display = 'none';
            runSearch(searchInput.value.trim());
        }

        function runSearch(query) {
            if (!query) return;

            document.getElementById('discoverView').style.display = 'none';
            const aiCard = document.getElementById('aiSummaryCard');
            const aiContent = document.getElementById('aiContent');
            const iframeWrapper = document.getElementById('iframeWrapper');
            const resultsFrame = document.getElementById('resultsFrame');

            aiCard.style.display = 'block';
            aiContent.innerHTML = '<i>Süni intellekt məlumatları analiz edir...</i>';

            fetch(`https://az.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.extract) {
                        aiContent.innerHTML = `<strong>Ağıllı Xülasə:</strong> ${data.extract}`;
                    } else {
                        aiContent.innerHTML = `<strong>AI Təhlili:</strong> "${query}" haqqında əsas nəticələr aşağıda təqdim olundu.`;
                    }
                })
                .catch(() => {
                    aiContent.innerHTML = `<strong>AI Təhlili:</strong> "${query}" sorğusu üzrə nəticələr hazırlandı.`;
                });

            iframeWrapper.style.display = 'block';
            resultsFrame.src = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
        }

        function resetPage() {
            document.getElementById('discoverView').style.display = 'block';
            document.getElementById('aiSummaryCard').style.display = 'none';
            document.getElementById('iframeWrapper').style.display = 'none';
            searchInput.value = '';
        }

        // Avtomatik Xəbərləri (RSS Feed) Yükləyən Funksiya
        function loadDiscoverFeed() {
            const feedList = document.getElementById('feedList');
            
            // Açıq xəbər API-si vasitəsilə son xəbərləri çəkirik
            fetch('https://api.rss2json.com/v1/api.json?rss_url=https://oxu.az/rss')
                .then(res => res.json())
                .then(data => {
                    if(data.items) {
                        data.items.slice(0, 10).forEach(item => {
                            const card = document.createElement('a');
                            card.className = 'feed-card';
                            card.href = item.link;
                            card.target = '_blank';

                            const imgUrl = item.enclosure.link || 'https://via.placeholder.com/600x300';

                            card.innerHTML = `
                                <img src="${imgUrl}" alt="xəbər">
                                <div class="feed-content">
                                    <div class="feed-title">${item.title}</div>
                                    <div class="feed-meta">📰 Oxu.az • ${item.pubDate.split(' ')[1]}</div>
                                </div>
                            `;
                            feedList.appendChild(card);
                        });
                    }
                }).catch(e => console.log('Feed xətası'));
        }

        // Səhifə açılanda xəbərləri yüklə
        loadDiscoverFeed();
    </script>
</body>
</html>
