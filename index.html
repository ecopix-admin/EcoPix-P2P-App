<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">Kamera Effekti</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        video, .overlay-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay-img {
            opacity: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Kamera görüntüsü -->
    <video id="video" autoplay playsinline></video>
    
    <!-- Üst qat şəkli (vizual örtük) -->
    <img id="overlay" class="overlay-img" src="https://via.placeholder.com/600x800?text=Geyim+Qati" alt="Örtük">

    <div class="controls">
        <button onclick="toggleEffect()">Effekti Dəyiş</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');

        // Kameranı işə salmaq
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Kameraya giriş icazəsi yoxdur: ", err);
            });

        // Düyməyə basdıqda üst qatın şəffaflığını dəyişən funksiya
        function toggleEffect() {
            if (overlay.style.opacity === '0') {
                overlay.style.opacity = '1';
            } else {
                overlay.style.opacity = '0';
            }
        }
    </script>

</body>
</html>
