<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sham-Cell | Yarasa Müdafiə Sistemi</title>
    <style>
        /* Enerji qənaəti və gecə göz yormaması üçün qara dizayn */
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            border: 2px solid #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            background: linear-gradient(145deg, #050505, #111);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
            width: 85%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #fbff00;
        }

        .sub-title {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .freq-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
            color: #fff;
        }

        .unit { font-size: 1rem; color: #00ff00; }

        input[type=range] {
            width: 100%;
            margin: 25px 0;
            cursor: pointer;
            accent-color: #fbff00;
        }

        button {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
        }

        button.active {
            border-color: #fbff00;
            color: #fbff00;
            box-shadow: 0 0 15px rgba(251, 255, 0, 0.4);
        }

        .status-box {
            margin-top: 25px;
            font-size: 0.8rem;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #fbff00;
            border-radius: 50%;
            margin-right: 10px;
            display: none;
            box-shadow: 0 0 10px #fbff00;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SHAM-CELL SYSTEM</h1>
    <div class="sub-title">Yarasa Exolokasiya Müdafiəsi</div>
    
    <div class="freq-display"><span id="freqVal">18000</span> <span class="unit">Hz</span></div>
    
    <input type="range" id="frequency" min="15000" max="22000" value="18000" step="100">
    
    <button id="startBtn">Sistemi Başlat</button>

    <div class="status-box">
        <div id="pulseDot" class="pulse-dot"></div>
        <span id="statusText">Sistem Gözləmədədir...</span>
    </div>
</div>

<script>
    let audioCtx;
    let oscillator;
    let gainNode;
    let isRunning = false;
    let pulseInterval;

    const startBtn = document.getElementById('startBtn');
    const freqInput = document.getElementById('frequency');
    const freqVal = document.getElementById('freqVal');
    const statusText = document.getElementById('statusText');
    const pulseDot = document.getElementById('pulseDot');

    // Tezlik dəyişəndə ekranı yenilə
    freqInput.oninput = function() {
        freqVal.innerText = this.value;
        if (oscillator) {
            oscillator.frequency.setValueAtTime(this.value, audioCtx.currentTime);
        }
    };

    function triggerBatPulse() {
        pulseInterval = setInterval(() => {
            if (audioCtx && gainNode) {
                const now = audioCtx.currentTime;
                // Yarasa "click" siqnalı simulyasiyası
                gainNode.gain.setValueAtTime(0.05, now); 
                gainNode.gain.exponentialRampToValueAtTime(1, now + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                
                // Vizual impuls effekti
                pulseDot.style.display = 'block';
                setTimeout(() => { pulseDot.style.display = 'none'; }, 100);
            }
        }, 250); // Hər 0.25 saniyədən bir zərbə
    }

    startBtn.onclick = function() {
        if (!isRunning) {
            // Audio başlat
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine'; 
            oscillator.frequency.setValueAtTime(freqInput.value, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            triggerBatPulse();
            
            // İnterfeys yeniləmə
            this.innerText = "Yarasa Modu Aktiv";
            this.classList.add('active');
            statusText.innerText = "Ultrasəs Dalğaları Yayılır";
            statusText.style.color = "#fbff00";
            isRunning = true;
        } else {
            // Sistemi dayandır
            clearInterval(pulseInterval);
            if(oscillator) oscillator.stop();
            if(audioCtx) audioCtx.close();
            
            this.innerText = "Sistemi Başlat";
            this.classList.remove('active');
            statusText.innerText = "Sistem Gözləmədədir...";
            statusText.style.color = "#555";
            pulseDot.style.display = 'none';
            isRunning = false;
        }
    };
</script>

</body>
</html>
