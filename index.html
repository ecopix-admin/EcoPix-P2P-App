<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Footballer AZ</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,sans-serif}
body{color:#fff}
#app{position:fixed;inset:0;background:
radial-gradient(circle at 50% 25%,rgba(30,90,160,.28),transparent 35%),
linear-gradient(#05080d,#020305)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

#top{
 position:absolute;top:0;left:0;right:0;padding:18px 18px 0;
 display:flex;justify-content:space-between;align-items:center;
 pointer-events:none;z-index:20
}
.brand{
 font-weight:900;letter-spacing:1.5px;font-size:15px;
 background:rgba(5,8,13,.55);backdrop-filter:blur(14px);
 padding:10px 14px;border:1px solid rgba(255,255,255,.1);
 border-radius:14px
}
.live{
 font-size:11px;font-weight:800;color:#7dffb2;
 background:rgba(20,80,45,.35);padding:9px 12px;border-radius:20px;
 border:1px solid rgba(100,255,170,.18)
}

#bubble{
 position:absolute;left:50%;top:13%;transform:translateX(-50%);
 width:min(88%,520px);min-height:48px;
 background:rgba(8,11,17,.88);border:1px solid rgba(255,255,255,.16);
 border-radius:18px;padding:13px 17px;text-align:center;
 font-size:15px;line-height:1.4;font-weight:600;
 box-shadow:0 15px 50px rgba(0,0,0,.35);
 backdrop-filter:blur(16px);z-index:15;display:none
}
#bubble:after{
 content:"";position:absolute;left:50%;bottom:-8px;
 width:14px;height:14px;background:#080b11;
 transform:translateX(-50%) rotate(45deg);
 border-right:1px solid rgba(255,255,255,.12);
 border-bottom:1px solid rgba(255,255,255,.12)
}

#controls{
 position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
 transform:translateX(-50%);width:min(94%,620px);
 z-index:30;display:flex;flex-direction:column;gap:10px
}
.panel{
 background:rgba(5,8,13,.78);backdrop-filter:blur(18px);
 border:1px solid rgba(255,255,255,.1);border-radius:22px;
 padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.35)
}
.row{display:flex;gap:8px}
input{
 flex:1;min-width:0;height:48px;border:1px solid rgba(255,255,255,.1);
 border-radius:15px;background:rgba(255,255,255,.055);
 color:#fff;padding:0 15px;font-size:15px;outline:none
}
button{
 border:0;color:#fff;background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.09);
 height:46px;border-radius:14px;padding:0 15px;
 font-weight:800;cursor:pointer
}
button:active{transform:scale(.96)}
.speak{background:linear-gradient(135deg,#087cff,#0050c9)}
.rec{background:linear-gradient(135deg,#ef3155,#a90b2b)}
.share{background:linear-gradient(135deg,#16c982,#087e52)}
.icon{width:46px;padding:0;font-size:19px}
.modes{display:flex;gap:7px;overflow:auto}
.modes button{flex:1;min-width:72px;font-size:11px}
.active{background:rgba(0,130,255,.35)!important;border-color:#188cff!important}

#hint{
 position:absolute;left:50%;bottom:165px;transform:translateX(-50%);
 z-index:10;color:rgba(255,255,255,.58);font-size:12px;
 text-align:center;pointer-events:none;white-space:nowrap
}

#status{
 position:absolute;left:50%;top:calc(13% + 80px);transform:translateX(-50%);
 z-index:20;color:rgba(255,255,255,.65);font-size:11px;
 display:none
}

#loader{
 position:absolute;inset:0;z-index:100;background:#040609;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;gap:16px
}
.loaderRing{
 width:50px;height:50px;border:3px solid rgba(255,255,255,.12);
 border-top-color:#188cff;border-radius:50%;
 animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:500px){
 #controls{width:96%}
 #hint{bottom:174px}
 .brand{font-size:12px}
 input{font-size:14px}
}
</style>
</head>

<body>
<div id="app">

<div id="loader">
 <div class="loaderRing"></div>
 <b>AI FOOTBALLER</b>
 <small style="opacity:.5">3D futbolçu hazırlanır...</small>
</div>

<canvas id="scene"></canvas>

<div id="top">
 <div class="brand">⚽ AI FOOTBALLER</div>
 <div class="live">● READY</div>
</div>

<div id="bubble"></div>
<div id="status"></div>

<div id="hint">Futbolçunun üzünə toxun və ya aşağıdan cümlə yaz</div>

<div id="controls">

 <div class="panel">
   <div class="row">
     <input id="text" type="text"
       placeholder="Məsələn: Salam, mən süni intellekt futbolçuyam!"
       autocomplete="off">
     <button class="speak" id="speak">▶</button>
   </div>
 </div>

 <div class="panel">
   <div class="modes">
     <button class="active" data-mode="idle">IDLE</button>
     <button data-mode="walk">GƏZİŞ</button>
     <button data-mode="run">QAÇIŞ</button>
     <button data-mode="warm">İSİNİŞ</button>
     <button data-mode="stretch">STRETCH</button>
     <button id="rec" class="rec">● REC</button>
     <button id="share" class="share">↗</button>
     <button id="full" class="icon">⛶</button>
   </div>
 </div>

</div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const canvas=document.getElementById("scene");
const loaderScreen=document.getElementById("loader");
const bubble=document.getElementById("bubble");
const status=document.getElementById("status");
const input=document.getElementById("text");

let scene,camera,renderer,clock;
let player=null,mixer=null;
let currentAction=null;
let recorder=null;
let chunks=[];
let lastVideo=null;
let speechTimer=null;
let speaking=false;
let speechRate=0.94;
let selectedMode="idle";

const MODEL_URL=
"https://cdn.jsdelivr.net/gh/MisterYI/deevid-mixamo-assets@main/char/Y_Bot.glb";

/* ---------------- SCENE ---------------- */

scene=new THREE.Scene();

camera=new THREE.PerspectiveCamera(
 35,
 innerWidth/innerHeight,
 .1,
 100
);
camera.position.set(0,1.55,4.7);

renderer=new THREE.WebGLRenderer({
 canvas,
 antialias:true,
 alpha:true,
 powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

/* lights */

scene.add(new THREE.HemisphereLight(0xaec9ff,0x10131a,2.2));

const key=new THREE.DirectionalLight(0xffffff,3.2);
key.position.set(3,6,4);
key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-3;
key.shadow.camera.right=3;
key.shadow.camera.top=5;
key.shadow.camera.bottom=-1;
scene.add(key);

const rim=new THREE.DirectionalLight(0x258cff,2.1);
rim.position.set(-4,3,-4);
scene.add(rim);

/* floor */

const floor=new THREE.Mesh(
 new THREE.CircleGeometry(2.1,96),
 new THREE.MeshStandardMaterial({
  color:0x071016,
  roughness:.86,
  metalness:.05,
  transparent:true,
  opacity:.92
 })
);
floor.rotation.x=-Math.PI/2;
floor.position.y=.015;
floor.receiveShadow=true;
scene.add(floor);

/* dynamic shadow */

const shadowCanvas=document.createElement("canvas");
shadowCanvas.width=256;
shadowCanvas.height=256;

const sctx=shadowCanvas.getContext("2d");
const grd=sctx.createRadialGradient(128,128,10,128,128,110);
grd.addColorStop(0,"rgba(0,0,0,.55)");
grd.addColorStop(1,"rgba(0,0,0,0)");
sctx.fillStyle=grd;
sctx.fillRect(0,0,256,256);

const shadowTex=new THREE.CanvasTexture(shadowCanvas);

const softShadow=new THREE.Mesh(
 new THREE.PlaneGeometry(1.65,.72),
 new THREE.MeshBasicMaterial({
  map:shadowTex,
  transparent:true,
  depthWrite:false
 })
);
softShadow.rotation.x=-Math.PI/2;
softShadow.position.y=.025;
scene.add(softShadow);

/* ---------------- PLAYER ---------------- */

const gltfLoader=new GLTFLoader();

function fitModel(root){

 const box=new THREE.Box3().setFromObject(root);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());

 root.position.x-=center.x;
 root.position.z-=center.z;
 root.position.y-=box.min.y;

 const h=size.y;

 if(h>0){
   const scale=2.55/h;
   root.scale.setScalar(scale);
 }

 root.traverse(o=>{
   if(o.isMesh){
     o.castShadow=true;
     o.receiveShadow=true;

     if(o.material){
       o.material.roughness=.65;
       o.material.metalness=.03;
     }
   }
 });
}

async function loadPlayer(){

 try{

   const gltf=await gltfLoader.loadAsync(MODEL_URL);

   player=gltf.scene;

   fitModel(player);

   player.position.set(0,0,0);

   scene.add(player);

   mixer=new THREE.AnimationMixer(player);

   if(gltf.animations && gltf.animations.length){

      gltf.animations.forEach((clip,i)=>{
        clip.name=clip.name || "Animation_"+i;
      });

      playBestAnimation("idle");
   }

   /* footballer kit enhancement */

   addFootballKit(player);

   loaderScreen.style.display="none";

 }catch(err){

   console.error(err);

   loaderScreen.innerHTML=
   `<b>3D model yüklənmədi</b>
    <small style="opacity:.55">İnternet bağlantısını yoxla</small>`;

 }
}

/* ---------------- KIT ---------------- */

function addFootballKit(root){

 let materials=[];

 root.traverse(o=>{
   if(o.isMesh && o.material){
     materials.push(o.material);
   }
 });

 /* slightly improve contrast */

 materials.forEach(m=>{
   if("roughness" in m) m.roughness=.55;
 });

}

/* ---------------- ANIMATION ---------------- */

function findClip(mode){

 if(!mixer || !player) return null;

 const clips=mixer._actions || [];

 let all=[];

 if(player.userData.animations)
   all=player.userData.animations;

 return null;
}

function playBestAnimation(mode){

 if(!mixer || !player) return;

 const rootActions=[];

 /* Search all animations stored by loader */
 const possible=[];

 mixer._actions.forEach(a=>{
   if(a.getClip) possible.push(a.getClip());
 });

 if(!possible.length){

   /* procedural mode */
   currentAction=null;
   selectedMode=mode;
   return;
 }

 let chosen=possible[0];

 const names=possible.map(c=>c.name.toLowerCase());

 const wanted={
  idle:["idle","standing","breathing"],
  walk:["walk"],
  run:["run","jog","sprint"],
  warm:["warm","stretch","exercise"],
  stretch:["stretch","warm"]
 }[mode]||["idle"];

 for(const w of wanted){
   const idx=names.findIndex(n=>n.includes(w));
   if(idx>=0){
     chosen=possible[idx];
     break;
   }
 }

 const next=mixer.clipAction(chosen);

 if(currentAction && currentAction!==next){
   currentAction.fadeOut(.25);
 }

 next.reset().fadeIn(.25).play();
 currentAction=next;
 selectedMode=mode;
}

/* ---------------- PROCEDURAL BODY ---------------- */

let t=0;

function proceduralMotion(dt){

 if(!player)return;

 t+=dt;

 const bones=[];

 player.traverse(o=>{
   if(o.isBone) bones.push(o);
 });

 const get=(words)=>{
   return bones.find(b=>{
     const n=b.name.toLowerCase();
     return words.some(w=>n.includes(w));
   });
 };

 const leftArm=get(["leftarm","left_arm"]);
 const rightArm=get(["rightarm","right_arm"]);
 const leftLeg=get(["leftleg","left_leg"]);
 const rightLeg=get(["rightleg","right_leg"]);
 const head=get(["head","neck"]);
 const spine=get(["spine","chest"]);

 if(selectedMode==="idle"){

   if(leftArm) leftArm.rotation.z+=Math.sin(t*1.3)*dt*.16;
   if(rightArm) rightArm.rotation.z-=Math.sin(t*1.3)*dt*.16;

   if(spine) spine.rotation.z=Math.sin(t*1.4)*.008;

 }else if(selectedMode==="walk"){

   const s=Math.sin(t*4.8);

   if(leftLeg) leftLeg.rotation.x=s*.28;
   if(rightLeg) rightLeg.rotation.x=-s*.28;

   if(leftArm) leftArm.rotation.x=-s*.22;
   if(rightArm) rightArm.rotation.x=s*.22;

 }else if(selectedMode==="run"){

   const s=Math.sin(t*7.5);

   if(leftLeg) leftLeg.rotation.x=s*.55;
   if(rightLeg) rightLeg.rotation.x=-s*.55;

   if(leftArm) leftArm.rotation.x=-s*.65;
   if(rightArm) rightArm.rotation.x=s*.65;

 }else if(selectedMode==="warm"){

   const s=Math.sin(t*2.2);

   if(leftLeg) leftLeg.rotation.x=s*.2;
   if(rightLeg) rightLeg.rotation.x=-s*.2;

   if(leftArm) leftArm.rotation.z=s*.35;
   if(rightArm) rightArm.rotation.z=-s*.35;

 }else if(selectedMode==="stretch"){

   const s=Math.sin(t*1.3);

   if(spine) spine.rotation.z=s*.08;
   if(leftArm) leftArm.rotation.x=s*.3;
   if(rightArm) rightArm.rotation.x=-s*.3;
 }

 /* breathing */

 if(spine){
   spine.scale.y=1+Math.sin(t*1.8)*.008;
 }

 /* head micro movement */

 if(head && !speaking){
   head.rotation.y=Math.sin(t*.7)*.025;
   head.rotation.z=Math.sin(t*.9)*.012;
 }

}

/* ---------------- SPEECH ---------------- */

function getAzerbaijaniVoice(){

 const voices=speechSynthesis.getVoices();

 if(!voices.length)return null;

 const az=voices.filter(v=>
   /^az(-|_)/i.test(v.lang)
 );

 if(az.length){

   const male=az.find(v=>
     /male|babək|babek|azərbaycan|azer/i.test(v.name)
   );

   return male || az[0];
 }

 /* Do NOT silently choose Turkish/English.
    Only exact Azerbaijani voice is accepted. */

 return null;
}

function showBubble(text){

 bubble.textContent=text;
 bubble.style.display="block";

 clearTimeout(speechTimer);

 speechTimer=setTimeout(()=>{
   if(!speaking)bubble.style.display="none";
 },9000);
}

function mouthAnimation(start=true){

 if(!player)return;

 speaking=start;

 player.traverse(o=>{

   if(!o.isMesh || !o.morphTargetDictionary)return;

   const dict=o.morphTargetDictionary;
   const inf=o.morphTargetInfluences;

   if(!inf)return;

   for(const name in dict){

     const n=name.toLowerCase();

     if(
       n.includes("mouthopen") ||
       n.includes("jawopen") ||
       n.includes("viseme") ||
       n.includes("mouth")
     ){

       const i=dict[name];

       if(start){

         inf[i]=.25+
           Math.abs(Math.sin(performance.now()/95))*0.7;

       }else{
         inf[i]=0;
       }
     }
   }
 });
}

function speakAZ(text){

 if(!text.trim())return;

 const voice=getAzerbaijaniVoice();

 if(!voice){

   alert(
    "Bu cihazda Azərbaycan dili üçün səs mühərriki tapılmadı.\n\n"+
    "Android-də:\n"+
    "Ayarlar → Dil və giriş → Mətn-səs çıxışı bölməsindən "+
    "Azərbaycan dilinin səsini quraşdır."
   );

   return;
 }

 speechSynthesis.cancel();

 const u=new SpeechSynthesisUtterance(text);

 u.lang=voice.lang;
 u.voice=voice;
 u.rate=speechRate;
 u.pitch=.82;
 u.volume=1;

 showBubble(text);

 u.onstart=()=>{
   speaking=true;
   status.textContent="AZƏRBAYCANCA DANIŞIR";
   status.style.display="block";
 };

 u.onend=()=>{
   speaking=false;
   mouthAnimation(false);
   status.style.display="none";
 };

 u.onerror=()=>{
   speaking=false;
   mouthAnimation(false);
   status.style.display="none";
 };

 speechSynthesis.speak(u);

 /* visual mouth timing */

 const mouthLoop=()=>{
   if(!speaking)return;
   mouthAnimation(true);
   requestAnimationFrame(mouthLoop);
 };

 mouthLoop();
}

/* ---------------- TAP FACE / BODY ---------------- */

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

canvas.addEventListener("pointerdown",e=>{

 pointer.x=(e.clientX/innerWidth)*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;

 raycaster.setFromCamera(pointer,camera);

 if(!player)return;

 const hits=raycaster.intersectObject(player,true);

 if(hits.length){

   const phrase=
    input.value.trim() ||
    "Salam! Mən Azərbaycan dilində danışan süni intellekt futbolçuyam.";

   speakAZ(phrase);
 }

});

/* ---------------- RECORDING ---------------- */

function startRecording(){

 if(recorder && recorder.state==="recording"){
   recorder.stop();
   return;
 }

 chunks=[];

 const videoStream=canvas.captureStream(30);

 let finalStream=videoStream;

 /*
   Browser SpeechSynthesis audio is NOT exposed as a
   MediaStream. Therefore we add a microphone only if
   available as an optional audio track.
 */

 navigator.mediaDevices?.getUserMedia({
   audio:true
 }).then(mic=>{

   finalStream=new MediaStream([
     ...videoStream.getVideoTracks(),
     ...mic.getAudioTracks()
   ]);

   beginRecorder(finalStream,mic);

 }).catch(()=>{

   beginRecorder(videoStream,null);

 });

}

function beginRecorder(stream,mic){

 let mime="video/webm;codecs=vp9,opus";

 if(!MediaRecorder.isTypeSupported(mime))
   mime="video/webm;codecs=vp8,opus";

 if(!MediaRecorder.isTypeSupported(mime))
   mime="video/webm";

 recorder=new MediaRecorder(stream,{
   mimeType:mime,
   videoBitsPerSecond:4500000
 });

 recorder.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
 };

 recorder.onstop=()=>{

   if(mic){
     mic.getTracks().forEach(t=>t.stop());
   }

   lastVideo=new Blob(chunks,{type:mime});

   document.getElementById("rec").textContent="● REC";

   downloadVideo();
 };

 recorder.start(250);

 document.getElementById("rec").textContent="■ STOP";

}

/* ---------------- DOWNLOAD ---------------- */

function downloadVideo(){

 if(!lastVideo)return;

 const url=URL.createObjectURL(lastVideo);

 const a=document.createElement("a");
 a.href=url;
 a.download="ai-footballer-az.webm";
 a.click();

 setTimeout(()=>URL.revokeObjectURL(url),3000);
}

/* ---------------- SHARE ---------------- */

async function shareVideo(){

 if(!lastVideo){

   alert("Əvvəlcə REC ilə video hazırla.");

   return;
 }

 const file=new File(
   [lastVideo],
   "AI-Footballer-AZ.webm",
   {type:"video/webm"}
 );

 try{

   if(
     navigator.share &&
     navigator.canShare &&
     navigator.canShare({files:[file]})
   ){

     await navigator.share({
       title:"AI Footballer AZ",
       text:"Azərbaycan dilində danışan AI futbolçu",
       files:[file]
     });

   }else{

     downloadVideo();

   }

 }catch(e){

   console.log(e);

 }

}

/* ---------------- BUTTONS ---------------- */

document.getElementById("speak").onclick=()=>{
 speakAZ(input.value);
};

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")speakAZ(input.value);
});

document.querySelectorAll("[data-mode]").forEach(btn=>{

 btn.onclick=()=>{

   document.querySelectorAll("[data-mode]")
    .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   playBestAnimation(btn.dataset.mode);

 };

});

document.getElementById("rec").onclick=startRecording;
document.getElementById("share").onclick=shareVideo;

document.getElementById("full").onclick=async()=>{

 try{

   if(!document.fullscreenElement)
     await document.documentElement.requestFullscreen();
   else
     await document.exitFullscreen();

 }catch(e){}

};

/* ---------------- RESIZE ---------------- */

addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));

});

/* ---------------- LOOP ---------------- */

clock=new THREE.Clock();

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);

 if(mixer)mixer.update(dt);

 proceduralMotion(dt);

 /* natural body floating / weight */

 if(player){

   const bob=
     selectedMode==="run" ? Math.abs(Math.sin(t*7.5))*.012 :
     selectedMode==="walk" ? Math.abs(Math.sin(t*4.8))*.006 :
     Math.sin(t*1.8)*.003;

   player.position.y=bob;

   softShadow.scale.x=
     1.0-bob*2.5;

   softShadow.scale.y=
     1.0-bob*1.8;
 }

 renderer.render(scene,camera);

}

loadPlayer();
animate();

/* Android voice list may arrive asynchronously */

speechSynthesis.onvoiceschanged=()=>{
 speechSynthesis.getVoices();
};

</script>
</body>
      </html>
