<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Səsli Şəbəkə - Görmə Əngəllilər Üçün Sosial Məkan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 4px solid #FFFF00;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            color: #FFFF00;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Görmə məhdudiyyətli şəxslər üçün kontrastlı və iri düymələr */
        .btn {
            background-color: #FFFF00;
            color: #000000;
            border: 4px solid #FFFFFF;
            padding: 25px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            text-align: center;
            user-select: none;
            width: 100%;
        }

        .btn:active, .btn:focus {
            background-color: #00FF00;
            color: #000000;
            outline: none;
        }

        .btn-record {
            background-color: #FF3333;
            color: #FFFFFF;
        }

        .btn-record.recording {
            background-color: #00FF00;
            color: #000000;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .feed-title {
            font-size: 24px;
            color: #FFFF00;
            margin-bottom: 15px;
            border-bottom: 2px solid #555;
            padding-bottom: 5px;
        }

        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post-card {
            background-color: #1A1A1A;
            border: 3px solid #FFFF00;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .post-time {
            font-size: 14px;
            color: #AAAAAA;
        }

        .post-text {
            font-size: 18px;
            color: #FFFFFF;
        }

        audio {
            width: 100%;
            margin-top: 10px;
            height: 45px;
        }
    </style>
</head>
<body>

    <header role="banner">
        <h1 id="appTitle" tabindex="0">Səsli Sosial Şəbəkə</h1>
    </header>

    <main class="controls">
        <!-- Səsli Post Yazma Düyməsi -->
        <button id="recordBtn" class="btn btn-record" aria-label="Səsli post yazmaq üçün toxunun">
            🎤 Səsli Post Yaz (Toxun)
        </button>

        <!-- Akışdakı Postları Oxutma Düyməsi -->
        <button id="readFeedBtn" class="btn" aria-label="Bütün paylaşımları səsli dinlə">
            🔊 Bütün Paylaşımları Dinlə
        </button>
    </main>

    <section aria-labelledby="feedTitle">
        <h2 id="feedTitle" class="feed-title">Son Paylaşımlar</h2>
        <div id="postsContainer" class="posts-list">
            <!-- Paylaşımlar buraya dinamik əlavə olunacaq -->
        </div>
    </section>

    <script>
        // Səs Sintezi (Brauzerin oxuma funksiyası)
        const synth = window.speechSynthesis;

        function speak(text) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'az-AZ'; // Azərbaycan dili dəstəyi
            utterance.rate = 0.9;     // Bir qədər aydın və anlaşılan sürət
            synth.speak(utterance);
        }

        // Tətbiq açıldıqda qarşılama səsli mesajı
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                speak("Səsli sosial şəbəkəyə xoş gəldiniz. Səsli post yazmaq üçün ekranın yuxarı hissəsindəki qırmızı düyməyə toxunun.");
            }, 500);
            loadPosts();
        });

        // Səs Yazma Məntiqi (MediaRecorder)
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const recordBtn = document.getElementById('recordBtn');

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            savePost(base64Audio);
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    recordBtn.innerText = "🛑 Səsi Saxla və Paylaş";
                    speak("Səs yazılır. Bitirmək üçün eyni düyməyə yenidən toxunun.");

                } catch (err) {
                    speak("Mikrofona icazə verilmədi və ya mikrofon tapılmadı.");
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerText = "🎤 Səsli Post Yaz (Toxun)";
                speak("Səsiniz saxlanıldı və sosial şəbəkədə paylaşıldı.");
            }
        });

        // LocalStorage-a Post Saxlamaq
        function savePost(audioData) {
            const posts = JSON.parse(localStorage.getItem('voice_posts') || '[]');
            const newPost = {
                id: Date.now(),
                audio: audioData,
                date: new Date().toLocaleTimeString('az-AZ', { hour: '2-digit', minute: '2-digit' })
            };
            posts.unshift(newPost);
            localStorage.setItem('voice_posts', JSON.stringify(posts));
            loadPosts();
        }

        // Postları Ekrana Yükləmək
        function loadPosts() {
            const postsContainer = document.getElementById('postsContainer');
            const posts = JSON.parse(localStorage.getItem('voice_posts') || '[]');

            postsContainer.innerHTML = '';

            if (posts.length === 0) {
                postsContainer.innerHTML = '<p class="post-text">Hələ heç bir səsli paylaşım yoxdur.</p>';
                return;
            }

            posts.forEach((post, index) => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.setAttribute('tabindex', '0');

                card.innerHTML = `
                    <div class="post-time">Paylaşıldı: Saat ${post.date}</div>
                    <audio controls src="${post.audio}"></audio>
                    <button class="btn" style="padding:10px; font-size:16px;" onclick="playPostAudio(${index})">
                        ▶ Bu Səsi Dinlə
                    </button>
                `;
                postsContainer.appendChild(card);
            });
        }

        function playPostAudio(index) {
            const posts = JSON.parse(localStorage.getItem('voice_posts') || '[]');
            if (posts[index]) {
                speak(`Post ${index + 1} oxunur`);
                const audio = new Audio(posts[index].audio);
                audio.play();
            }
        }

        // Bütün Paylaşımları Ardıcıl Səsli Dinləmə
        const readFeedBtn = document.getElementById('readFeedBtn');
        readFeedBtn.addEventListener('click', () => {
            const posts = JSON.parse(localStorage.getItem('voice_posts') || '[]');
            if (posts.length === 0) {
                speak("Hələ heç bir paylaşım yoxdur.");
                return;
            }

            speak(`Ümumilikdə ${posts.length} səsli paylaşım var. Birinci paylaşım səsləndirilir.`);
            
            let currentIndex = 0;
            function playNext() {
                if (currentIndex < posts.length) {
                    const audio = new Audio(posts[currentIndex].audio);
                    audio.play();
                    audio.onended = () => {
                        currentIndex++;
                        if (currentIndex < posts.length) {
                            setTimeout(playNext, 1000);
                        } else {
                            speak("Bütün paylaşımlar bitdi.");
                        }
                    };
                }
            }
            playNext();
        });
    </script>
</body>
</html>
