<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürətli AI Fon Təmizləyici & Kamera Studio</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        header { text-align: center; margin-bottom: 20px; }
        header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button, .btn-upload {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #334155;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        button:hover, .btn-upload:hover { background: #475569; }

        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }

        input[type="file"] { display: none; }

        /* Kamera Modalı */
        .camera-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        video {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            background: #000;
        }

        /* İş Sahəsi */
        .editor-area {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .canvas-container {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            max-height: 450px;
            position: relative;
        }

        canvas { max-width: 100%; max-height: 450px; object-fit: contain; }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
        }

        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 0.8rem; color: #94a3b8; font-weight: 600; }

        select, input[type="color"] {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            outline: none;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>AI Studio & Fon Təmizləyici</h1>
    </header>

    <div class="container">
        <!-- Seçim Düymələri -->
        <div class="btn-group" id="initialControls">
            <label class="btn-upload btn-primary">
                📁 Şəkil Seçin
                <input type="file" id="fileInput" accept="image/*">
            </label>
            <button type="button" id="openCamBtn">📷 Kamera ilə Çək</button>
        </div>

        <!-- Kamera Ekranı -->
        <div class="camera-modal" id="cameraModal">
            <video id="webcam" autoplay playsinline></video>
            <div class="btn-group" style="width: 100%; max-width: 500px; margin-top: 15px;">
                <button type="button" class="btn-primary" id="captureBtn">📸 Çək</button>
                <button type="button" id="closeCamBtn" style="background: #ef4444;">Ləğv et</button>
            </div>
        </div>

        <!-- Redaktə Sahəsi -->
        <div class="editor-area" id="editorArea">
            <div class="canvas-container">
                <canvas id="mainCanvas"></canvas>
                <div class="status-badge" id="statusBadge">
                    <div class="spinner" id="spinner"></div>
                    <span id="statusText">Şəkil yükləndi. AI hazırlanır...</span>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="bgType">Fon Növü</label>
                    <select id="bgType">
                        <option value="transparent">Şəffaf (PNG)</option>
                        <option value="white" selected>Təmiz Ağ (E-Ticarət)</option>
                        <option value="color">Rəng Seçin</option>
                        <option value="gradient">Gradient Studiya</option>
                    </select>
                </div>

                <div class="control-group" id="colorPickerGroup">
                    <label for="bgColor">Fon Rəngi</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>

                <div class="control-group">
                    <label for="aspectRatio">Ölçü (Format)</label>
                    <select id="aspectRatio">
                        <option value="original">Orijinal</option>
                        <option value="1:1">Kvadrat (1:1 - Tap.az)</option>
                        <option value="4:3">Məhsul (4:3)</option>
                        <option value="9:16">Story / TikTok (9:16)</option>
                    </select>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" id="resetBtn" style="background: #475569;">Yenidən Seç</button>
                <button type="button" class="btn-primary" id="downloadBtn">Yüklə (HD)</button>
            </div>
        </div>
    </div>

    <!-- AI Model Modulu -->
    <script type="module">
        import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm';

        const fileInput = document.getElementById('fileInput');
        const openCamBtn = document.getElementById('openCamBtn');
        const closeCamBtn = document.getElementById('closeCamBtn');
        const captureBtn = document.getElementById('captureBtn');
        const cameraModal = document.getElementById('cameraModal');
        const webcam = document.getElementById('webcam');
        const editorArea = document.getElementById('editorArea');
        const initialControls = document.getElementById('initialControls');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let cameraStream = null;
        let originalImage = null;
        let bgRemovedImage = null;

        // 1. Fayl seçildikdə DƏRHOL ekrana çıxar
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleImageInput(e.target.files[0]);
            }
        });

        // 2. Kameranı Aç
        openCamBtn.addEventListener('click', async () => {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                webcam.srcObject = cameraStream;
                cameraModal.style.display = 'flex';
            } catch (err) {
                alert("Kameraya daxil olmaq mümkün olmadı: " + err.message);
            }
        });

        // Kameranı Bağla
        closeCamBtn.addEventListener('click', stopCamera);

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            cameraModal.style.display = 'none';
        }

        // 3. Kameradan Şəkil Çək
        captureBtn.addEventListener('click', () => {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = webcam.videoWidth;
            tempCanvas.height = webcam.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(webcam, 0, 0);

            tempCanvas.toBlob((blob) => {
                stopCamera();
                handleImageInput(blob);
            }, 'image/jpeg');
        });

        // 4. Şəklin Emalı və Göstərilməsi
        async function handleImageInput(imageSource) {
            initialControls.style.display = 'none';
            editorArea.style.display = 'flex';
            statusBadge.style.display = 'flex';
            spinner.style.display = 'block';
            statusText.innerText = "Şəkil göstərilir...";

            const url = URL.createObjectURL(imageSource);
            originalImage = new Image();
            originalImage.src = url;

            await originalImage.decode();
            
            // Şəkil DƏRHOL canvas-da göstərilir (Gözləmədən!)
            renderCanvas(originalImage);

            // Fon silmə prosesi arxa fonda sürətli başladılır
            statusText.innerText = "Süni intellekt fonu silir...";
            
            try {
                const blob = await imglyRemoveBackground(imageSource, {
                    fetchArgs: { mode: 'cors' },
                    progress: (key, current, total) => {
                        const pct = Math.round((current / total) * 100);
                        if (!isNaN(pct)) statusText.innerText = `Süni İntellekt: ${pct}%`;
                    }
                });

                bgRemovedImage = new Image();
                bgRemovedImage.src = URL.createObjectURL(blob);
                await bgRemovedImage.decode();

                spinner.style.display = 'none';
                statusText.innerText = "Fon silindi!";
                setTimeout(() => { statusBadge.style.display = 'none'; }, 2000);

                renderCanvas(bgRemovedImage);
            } catch (err) {
                console.error(err);
                spinner.style.display = 'none';
                statusText.innerText = "Orijinal şəkil göstərilir (AI xətası)";
            }
        }

        // Canvas Çəkim Funksiyası
        function renderCanvas(imgToDraw) {
            if (!imgToDraw) return;

            const bgType = document.getElementById('bgType').value;
            const bgColor = document.getElementById('bgColor').value;
            const ratio = document.getElementById('aspectRatio').value;

            let w = imgToDraw.width;
            let h = imgToDraw.height;

            if (ratio === '1:1') {
                const max = Math.max(w, h);
                w = max; h = max;
            } else if (ratio === '4:3') {
                h = (w * 3) / 4;
            } else if (ratio === '9:16') {
                h = (w * 16) / 9;
            }

            canvas.width = w;
            canvas.height = h;

            ctx.clearRect(0, 0, w, h);

            // Fon rəngləri (yalnız fon silinibsə və ya istifadəçi seçibsə)
            if (bgType === 'white') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, w, h);
            } else if (bgType === 'color') {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, w, h);
            } else if (bgType === 'gradient') {
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(1, '#0369a1');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
            }

            const x = (w - imgToDraw.width) / 2;
            const y = (h - imgToDraw.height) / 2;
            ctx.drawImage(imgToDraw, x, y);
        }

        // Hadisələr (Events)
        document.getElementById('bgType').addEventListener('change', () => renderCanvas(bgRemovedImage || originalImage));
        document.getElementById('bgColor').addEventListener('input', () => renderCanvas(bgRemovedImage || originalImage));
        document.getElementById('aspectRatio').addEventListener('change', () => renderCanvas(bgRemovedImage || originalImage));

        document.getElementById('resetBtn').addEventListener('click', () => {
            fileInput.value = '';
            originalImage = null;
            bgRemovedImage = null;
            initialControls.style.display = 'flex';
            editorArea.style.display = 'none';
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const bgType = document.getElementById('bgType').value;
            const ext = bgType === 'transparent' ? 'png' : 'jpg';
            const link = document.createElement('a');
            link.download = `studio_${Date.now()}.${ext}`;
            link.href = canvas.toDataURL(bgType === 'transparent' ? 'image/png' : 'image/jpeg', 0.95);
            link.click();
        });
    </script>
</body>
</html>
