<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>SEEIT — AI Visual Search</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050608;
  color:#fff;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button{
  font:inherit;
}

#app{
  position:fixed;
  inset:0;
  background:#050608;
}

/* ================= CAMERA ================= */

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#050608;
}

.cameraShade{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.62) 0%,
      transparent 27%,
      transparent 62%,
      rgba(0,0,0,.76) 100%
    );
}

/* ================= HEADER ================= */

.header{
  position:absolute;
  z-index:20;
  top:0;
  left:0;
  right:0;
  padding:
    calc(15px + env(safe-area-inset-top))
    18px
    14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:25px;
  font-weight:950;
  letter-spacing:-1.4px;
}

.brand i{
  font-style:normal;
  color:#67f3a5;
}

.cameraStatus{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border-radius:30px;
  background:rgba(8,9,12,.48);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(18px);
  font-size:12px;
  color:#dce0e7;
}

.statusDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#888;
}

.statusDot.live{
  background:#67f3a5;
  box-shadow:0 0 13px #67f3a5;
}

/* ================= SCAN FRAME ================= */

.scanFrame{
  position:absolute;
  z-index:5;
  left:50%;
  top:46%;
  transform:translate(-50%,-50%);
  width:min(82vw,390px);
  aspect-ratio:1/1;
  pointer-events:none;
}

.scanCorner{
  position:absolute;
  width:42px;
  height:42px;
  border-color:#fff;
  border-style:solid;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.3));
}

.tl{
  left:0;
  top:0;
  border-width:3px 0 0 3px;
  border-radius:18px 0 0 0;
}

.tr{
  right:0;
  top:0;
  border-width:3px 3px 0 0;
  border-radius:0 18px 0 0;
}

.bl{
  left:0;
  bottom:0;
  border-width:0 0 3px 3px;
  border-radius:0 0 0 18px;
}

.br{
  right:0;
  bottom:0;
  border-width:0 3px 3px 0;
  border-radius:0 0 18px 0;
}

.scanHint{
  position:absolute;
  top:calc(100% + 18px);
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:13px;
  color:rgba(255,255,255,.8);
  text-shadow:0 2px 8px #000;
}

/* ================= BOTTOM ================= */

.bottom{
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  bottom:0;
  padding:
    16px
    18px
    calc(18px + env(safe-area-inset-bottom));
}

.scanButton{
  width:100%;
  height:64px;
  border:0;
  border-radius:21px;
  background:#fff;
  color:#050608;
  font-size:18px;
  font-weight:900;
  letter-spacing:-.3px;
  box-shadow:
    0 12px 45px rgba(0,0,0,.35),
    0 0 0 1px rgba(255,255,255,.2);
  cursor:pointer;
  transition:.18s transform;
}

.scanButton:active{
  transform:scale(.97);
}

.scanButton.loading{
  background:#67f3a5;
}

.secondaryControls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:12px;
}

.circleButton{
  width:51px;
  height:51px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.52);
  color:#fff;
  backdrop-filter:blur(18px);
  cursor:pointer;
  font-size:20px;
}

/* ================= RESULT SCREEN ================= */

.resultScreen{
  position:fixed;
  z-index:100;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(103,243,165,.09),
      transparent 40%
    ),
    #08090c;

  transform:translateY(100%);
  transition:transform .34s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto;
  overscroll-behavior:contain;
}

.resultScreen.open{
  transform:translateY(0);
}

.resultHeader{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:
    calc(14px + env(safe-area-inset-top))
    16px
    13px;
  background:rgba(8,9,12,.82);
  backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.resultHeaderTitle{
  font-size:18px;
  font-weight:900;
}

.closeResult{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

.resultContent{
  padding:16px 16px 40px;
  max-width:650px;
  margin:auto;
}

/* ================= RESULT IMAGE ================= */

.resultImageBox{
  position:relative;
  width:100%;
  height:min(54vh,480px);
  border-radius:25px;
  overflow:hidden;
  background:#111318;
  border:1px solid rgba(255,255,255,.08);
}

#resultImage{
  width:100%;
  height:100%;
  object-fit:cover;
}

.imageBadge{
  position:absolute;
  left:12px;
  top:12px;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(14px);
  font-size:11px;
  color:#dfe4ea;
}

/* ================= AI RESULT ================= */

.resultMain{
  margin-top:17px;
}

.resultLabel{
  font-size:29px;
  line-height:1.05;
  font-weight:950;
  letter-spacing:-1.1px;
}

.resultDescription{
  margin-top:8px;
  color:#a8adb7;
  font-size:13px;
  line-height:1.5;
}

.confidenceRow{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:15px;
}

.confidenceBar{
  flex:1;
  height:7px;
  background:#1c1f25;
  border-radius:20px;
  overflow:hidden;
}

.confidenceFill{
  height:100%;
  width:0%;
  background:#67f3a5;
  border-radius:20px;
  transition:width .5s;
}

.confidenceText{
  color:#67f3a5;
  font-size:12px;
  font-weight:800;
}

/* ================= TAGS ================= */

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:15px;
}

.tag{
  padding:8px 11px;
  border-radius:13px;
  background:#14171c;
  border:1px solid rgba(255,255,255,.07);
  color:#dce0e5;
  font-size:11px;
}

/* ================= STORES ================= */

.storeTitle{
  margin-top:25px;
  font-size:17px;
  font-weight:900;
}

.storeSub{
  margin-top:5px;
  color:#858b96;
  font-size:12px;
}

.stores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.store{
  min-height:67px;
  padding:11px;
  border-radius:17px;
  background:#111419;
  border:1px solid rgba(255,255,255,.08);
  color:#fff;
  text-align:left;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  transition:.15s;
}

.store:active{
  transform:scale(.97);
}

.storeIcon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:#1b1f26;
  font-size:19px;
  flex:none;
}

.storeInfo{
  min-width:0;
}

.storeName{
  font-size:13px;
  font-weight:850;
}

.storeAction{
  margin-top:3px;
  color:#7f8793;
  font-size:10px;
}

/* ================= SEARCH ================= */

.searchQuery{
  margin-top:24px;
  padding:14px;
  border-radius:17px;
  background:#111419;
  border:1px solid rgba(255,255,255,.08);
}

.searchLabel{
  color:#7f8793;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.searchText{
  margin-top:7px;
  font-size:13px;
  color:#e9edf1;
  word-break:break-word;
}

/* ================= RESCAN ================= */

.rescan{
  width:100%;
  margin-top:14px;
  height:58px;
  border:0;
  border-radius:18px;
  background:#67f3a5;
  color:#07100b;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:105px;
  transform:translate(-50%,20px);
  width:max-content;
  max-width:calc(100vw - 35px);
  padding:11px 15px;
  border-radius:15px;
  background:rgba(12,14,18,.9);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(18px);
  color:#e8ebef;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= LOADING ================= */

.aiLoading{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(4,5,7,.78);
  backdrop-filter:blur(18px);
}

.aiLoading.show{
  display:flex;
}

.loadingCard{
  width:min(88vw,360px);
  padding:25px;
  border-radius:25px;
  background:#101217;
  border:1px solid rgba(255,255,255,.1);
  text-align:center;
}

.spinner{
  width:42px;
  height:42px;
  margin:auto;
  border-radius:50%;
  border:3px solid #242831;
  border-top-color:#67f3a5;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loadingTitle{
  margin-top:17px;
  font-size:18px;
  font-weight:900;
}

.loadingText{
  margin-top:7px;
  color:#858b96;
  font-size:12px;
  line-height:1.5;
}

/* ================= ERROR ================= */

.errorBox{
  margin-top:15px;
  padding:13px;
  border-radius:15px;
  background:#171419;
  color:#ffb6bd;
  font-size:12px;
  line-height:1.5;
}

@media(min-width:700px){

  .bottom{
    max-width:650px;
    margin:auto;
  }

  .scanFrame{
    width:390px;
  }

}
</style>
</head>

<body>

<div id="app">

  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>

  <div class="cameraShade"></div>

  <header class="header">

    <div class="brand">
      SEE<i>IT</i>
    </div>

    <div class="cameraStatus">

      <span
        class="statusDot"
        id="statusDot"
      ></span>

      <span id="statusText">
        Kamera hazırlanır
      </span>

    </div>

  </header>

  <div class="scanFrame">

    <div class="scanCorner tl"></div>
    <div class="scanCorner tr"></div>
    <div class="scanCorner bl"></div>
    <div class="scanCorner br"></div>

    <div class="scanHint">
      Məhsulu çərçivəyə gətir
    </div>

  </div>

  <div class="bottom">

    <button
      class="scanButton"
      id="scanButton"
    >
      📷 Məhsulu Skan Et
    </button>

    <div class="secondaryControls">

      <button
        class="circleButton"
        id="galleryButton"
        aria-label="Qalereya"
      >
        🖼️
      </button>

      <button
        class="circleButton"
        id="flipButton"
        aria-label="Kameranı dəyiş"
      >
        🔄
      </button>

    </div>

  </div>

</div>

<input
  type="file"
  id="fileInput"
  accept="image/*"
/>


<!-- ================= RESULT ================= -->

<section
  class="resultScreen"
  id="resultScreen"
>

  <div class="resultHeader">

    <div class="resultHeaderTitle">
      AI nəticəsi
    </div>

    <button
      class="closeResult"
      id="closeResult"
      aria-label="Bağla"
    >
      ×
    </button>

  </div>

  <div class="resultContent">

    <div class="resultImageBox">

      <img
        id="resultImage"
        alt="Skan edilmiş məhsul"
      >

      <div class="imageBadge">
        SEEIT AI
      </div>

    </div>

    <div class="resultMain">

      <div
        class="resultLabel"
        id="resultLabel"
      >
        Analiz edilir
      </div>

      <div
        class="resultDescription"
        id="resultDescription"
      >
        -
      </div>

      <div class="confidenceRow">

        <div class="confidenceBar">
          <div
            class="confidenceFill"
            id="confidenceFill"
          ></div>
        </div>

        <div
          class="confidenceText"
          id="confidenceText"
        >
          --
        </div>

      </div>

      <div
        class="tags"
        id="resultTags"
      ></div>

    </div>

    <div class="storeTitle">
      Harada axtarmaq istəyirsən?
    </div>

    <div class="storeSub">
      Nəticəyə əsaslanan real mağaza axtarışlarını aç.
    </div>

    <div
      class="stores"
      id="stores"
    ></div>

    <div class="searchQuery">

      <div class="searchLabel">
        AI axtarış sorğusu
      </div>

      <div
        class="searchText"
        id="searchText"
      >
        -
      </div>

    </div>

    <button
      class="rescan"
      id="rescanButton"
    >
      🔄 Yenidən Skan Et
    </button>

  </div>

</section>


<!-- ================= AI LOADING ================= -->

<div
  class="aiLoading"
  id="aiLoading"
>

  <div class="loadingCard">

    <div class="spinner"></div>

    <div class="loadingTitle">
      AI görüntünü analiz edir
    </div>

    <div
      class="loadingText"
      id="loadingText"
    >
      İlk skanda model hazırlanır. Sonrakı skanlar daha sürətli olacaq.
    </div>

  </div>

</div>

<div
  class="toast"
  id="toast"
></div>


<script type="module">

import {
  pipeline,
  env
}
from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";


/* =====================================================
   SEEIT CONFIG
===================================================== */

env.allowLocalModels = false;
env.useBrowserCache = true;

const MODEL =
  "Xenova/clip-vit-base-patch32";


/*
  Modelə verilən kateqoriyalar.

  Bunlar saxta məhsul deyil.
  AI şəkli bu anlayışlarla müqayisə edir.
*/

const LABELS = [

  "running sneakers",
  "basketball sneakers",
  "football shoes",
  "hiking shoes",
  "casual sneakers",
  "formal dress shoes",
  "leather shoes",
  "boots",
  "sandals",
  "slippers",

  "Nike sneakers",
  "Adidas sneakers",
  "Puma sneakers",
  "New Balance sneakers",
  "Jordan sneakers",
  "Converse sneakers",
  "Vans sneakers",
  "Reebok sneakers",

  "black sneakers",
  "white sneakers",
  "red sneakers",
  "blue sneakers",
  "green sneakers",

  "modern sneakers",
  "luxury sneakers",
  "sports sneakers"

];


/* =====================================================
   DOM
===================================================== */

const camera =
  document.getElementById("camera");

const statusDot =
  document.getElementById("statusDot");

const statusText =
  document.getElementById("statusText");

const scanButton =
  document.getElementById("scanButton");

const galleryButton =
  document.getElementById("galleryButton");

const flipButton =
  document.getElementById("flipButton");

const fileInput =
  document.getElementById("fileInput");

const resultScreen =
  document.getElementById("resultScreen");

const closeResult =
  document.getElementById("closeResult");

const rescanButton =
  document.getElementById("rescanButton");

const resultImage =
  document.getElementById("resultImage");

const resultLabel =
  document.getElementById("resultLabel");

const resultDescription =
  document.getElementById("resultDescription");

const confidenceFill =
  document.getElementById("confidenceFill");

const confidenceText =
  document.getElementById("confidenceText");

const resultTags =
  document.getElementById("resultTags");

const stores =
  document.getElementById("stores");

const searchText =
  document.getElementById("searchText");

const aiLoading =
  document.getElementById("aiLoading");

const loadingText =
  document.getElementById("loadingText");

const toast =
  document.getElementById("toast");


/* =====================================================
   STATE
===================================================== */

let stream = null;

let facingMode = "environment";

let classifier = null;

let loadingAI = false;

let scanning = false;

let lastSearchQuery = "";

let currentImageURL = null;


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{

    toast.classList.remove("show");

  },2600);

}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

  try{

    if(stream){

      stream
        .getTracks()
        .forEach(track => track.stop());

    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio:false,

        video:{

          facingMode:{
            ideal:facingMode
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }

        }

      });


    camera.srcObject = stream;


    await camera.play();


    statusDot.classList.add("live");

    statusText.textContent =
      "Kamera hazır";


  }catch(error){

    console.error(error);

    statusText.textContent =
      "Kamera icazəsi lazımdır";

    showToast(
      "Brauzerdə kamera icazəsini aktivləşdir."
    );

  }

}


/* =====================================================
   OPEN CAMERA IMMEDIATELY
===================================================== */

/*
  ƏN VACİB SÜRƏT DƏYİŞİKLİYİ:

  Kamera açılarkən AI modeli yüklənmir.

  Ona görə istifadəçi kamera görüntüsünü
  dərhal görür.
*/

startCamera();


/* =====================================================
   LOAD AI ONLY WHEN NEEDED
===================================================== */

async function loadAI(){

  if(classifier){

    return true;

  }

  if(loadingAI){

    return false;

  }

  loadingAI = true;

  aiLoading.classList.add("show");

  loadingText.textContent =
    "Açıq mənbəli görmə modeli hazırlanır...";


  try{

    let device = "wasm";


    if(
      "gpu" in navigator
    ){

      device = "webgpu";

    }


    classifier =
      await pipeline(

        "zero-shot-image-classification",

        MODEL,

        {

          device,

          dtype:
            device === "webgpu"
              ? "q4"
              : "q8"

        }

      );


    loadingAI.classList.remove("show");

    loadingAI = false;

    return true;


  }catch(error){

    console.error(error);

    loadingAI = false;

    aiLoading.classList.remove("show");

    showToast(
      "AI modeli yüklənmədi. İnterneti yoxla."
    );

    return false;

  }

}


/* =====================================================
   CAPTURE
===================================================== */

function captureCamera(){

  const canvas =
    document.createElement("canvas");


  /*
    Böyük 4K şəkil göndərmirik.

    Daha kiçik şəkil =
    daha az hesablama =
    daha sürətli AI.
  */

  const targetWidth = 640;

  const ratio =
    camera.videoHeight /
    camera.videoWidth;


  canvas.width =
    targetWidth;

  canvas.height =
    Math.round(
      targetWidth * ratio
    );


  const ctx =
    canvas.getContext("2d",{
      alpha:false
    });


  ctx.drawImage(

    camera,

    0,
    0,

    canvas.width,
    canvas.height

  );


  return canvas;

}


/* =====================================================
   IMAGE FILE
===================================================== */

function fileToImage(file){

  return new Promise((resolve,reject)=>{

    const img =
      new Image();

    const url =
      URL.createObjectURL(file);


    img.onload = ()=>{

      URL.revokeObjectURL(url);

      resolve(img);

    };


    img.onerror = reject;

    img.src = url;

  });

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function showResultImage(source){

  if(currentImageURL){

    URL.revokeObjectURL(
      currentImageURL
    );

    currentImageURL = null;

  }


  if(source instanceof HTMLCanvasElement){

    resultImage.src =
      source.toDataURL(
        "image/jpeg",
        .82
      );

  }else{

    currentImageURL =
      URL.createObjectURL(source);

    resultImage.src =
      currentImageURL;

  }

}


/* =====================================================
   CLEAN LABEL
===================================================== */

function cleanLabel(label){

  return label

    .replace(
      /^a pair of /i,
      ""
    )

    .replace(
      /^a pair of /i,
      ""
    )

    .replace(
      /^a /i,
      ""
    )

    .trim();

}


/* =====================================================
   SEARCH QUERY
===================================================== */

function buildSearchQuery(label){

  let q =
    cleanLabel(label);


  /*
    Mağaza axtarışında daha faydalı
    sorğu yaratmağa çalışırıq.
  */

  if(
    q.toLowerCase()
      .includes("sneaker")
  ){

    return q;

  }


  return q + " shoes";

}

  /*

  */

  return [

    {

      url:
        "https://www.google.com/search?tbm=isch&q="+q
    },

    {

      url:

    },

      url:

    },

    {

/* =====================================================
   RENDER STORES
===================================================== */

function renderStores(query){

  stores.innerHTML = "";


  const list =
    createStoreLinks(query);


  list.forEach(store=>{

    const button =
      document.createElement("button");

    button.className =
      "store";


    button.innerHTML = `

      <div class="storeIcon">
        ${store.icon}
      </div>

      <div class="storeInfo">

        <div class="storeName">
          ${store.name}
        </div>

        <div class="storeAction">
          Axtarışı aç →
        </div>

      </div>

    `;


    button.onclick = ()=>{

      window.open(
        store.url,
        "_blank",
        "noopener,noreferrer"
      );

    };


    stores.appendChild(button);

  });

}


/* =====================================================
   DISPLAY RESULT
===================================================== */

function displayResult(output, source){

  if(
    !output ||
    !output.length
  ){

    showToast(
      "AI uyğun nəticə tapa bilmədi."
    );

    return;

  }


  const best =
    output[0];


  const label =
    cleanLabel(best.label);


  const percent =
    Math.round(
      best.score * 100
    );


  lastSearchQuery =
    buildSearchQuery(label);


  showResultImage(source);


  resultLabel.textContent =
    label
      .charAt(0)
      .toUpperCase()
      +
    label.slice(1);


  resultDescription.textContent =
    "AI görüntünü bu məhsul kateqoriyasına ən yaxın olaraq qiymətləndirdi. Konkret model/qiymət üçün mağaza axtarışlarından istifadə edə bilərsən.";


  confidenceText.textContent =
    percent + "%";


  confidenceFill.style.width =
    Math.min(percent,100) + "%";


  resultTags.innerHTML = "";


  output
    .slice(0,5)
    .forEach(item=>{

      const tag =
        document.createElement("div");

      tag.className =
        "tag";

      tag.textContent =
        cleanLabel(item.label)
        +
        " · "
        +
        Math.round(item.score*100)
        +
        "%";


      resultTags.appendChild(tag);

    });


  searchText.textContent =
    lastSearchQuery;


  renderStores(
    lastSearchQuery
  );


  resultScreen.classList.add("open");


  setTimeout(()=>{

    resultScreen.scrollTop = 0;

  },50);

}


/* =====================================================
   REAL AI SCAN
===================================================== */

async function scanSource(source){

  if(scanning){

    return;

  }

  scanning = true;


  scanButton.classList.add(
    "loading"
  );

  scanButton.textContent =
    "🧠 AI analiz edir...";


  const ready =
    await loadAI();


  if(!ready){

    scanning = false;

    scanButton.classList.remove(
      "loading"
    );

    scanButton.textContent =
      "📷 Məhsulu Skan Et";

    return;

  }


  try{

    statusText.textContent =
      "AI analiz edir";


    /*
      Real zero-shot image classification.
    */

    const output =
      await classifier(

        source,

        LABELS,

        {
          topk:5
        }

      );


    displayResult(
      output,
      source
    );


  }catch(error){

    console.error(error);

    showToast(
      "Şəkil analiz edilərkən xəta baş verdi."
    );

  }finally{

    scanning = false;

    scanButton.classList.remove(
      "loading"
    );

    scanButton.textContent =
      "📷 Məhsulu Skan Et";

    statusText.textContent =
      "Kamera hazır";

  }

}


/* =====================================================
   CAMERA SCAN BUTTON
===================================================== */

scanButton.onclick = async ()=>{

  if(
    !camera.videoWidth ||
    !camera.videoHeight
  ){

    showToast(
      "Kamera görüntüsü hələ hazır deyil."
    );

    return;

  }


  /*
    Bir dəfə çəkilir.
    Davamlı skan YOXDUR.
  */

  const frame =
    captureCamera();


  await scanSource(
    frame
  );

};


/* =====================================================
   GALLERY
===================================================== */

galleryButton.onclick = ()=>{

  fileInput.click();

};


fileInput.onchange = async ()=>{

  const file =
    fileInput.files[0];


  if(!file){

    return;

  }


  try{

    const img =
      await fileToImage(file);


    await scanSource(
      img
    );


  }catch(error){

    console.error(error);

    showToast(
      "Şəkil açıla bilmədi."
    );

  }


  fileInput.value = "";

};


/* =====================================================
   CAMERA FLIP
===================================================== */

flipButton.onclick = async ()=>{

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";


  statusText.textContent =
    "Kamera dəyişdirilir...";


  await startCamera();

};


/* =====================================================
   CLOSE RESULT
===================================================== */

closeResult.onclick = ()=>{

  resultScreen.classList.remove(
    "open"
  );

};


/* =====================================================
   RESCAN
===================================================== */

rescanButton.onclick = ()=>{

  resultScreen.classList.remove(
    "open"
  );


  /*
    Kamera əvvəlcədən açıqdır.
    Buna görə yenidən kamera gözləməyə
    ehtiyac yoxdur.
  */

  setTimeout(()=>{

    showToast(
      "Hazırdır. Yeni məhsulu çərçivəyə gətir."
    );

  },250);

};


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "pagehide",
  ()=>{

    if(stream){

      stream
        .getTracks()
        .forEach(track=>{
          track.stop();
        });

    }

  }
);

</script>
