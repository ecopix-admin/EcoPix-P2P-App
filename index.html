<script>
(function(){

"use strict";

/* ============================================================
   AZGRAM ULTRA PRO
   ============================================================ */

var APP_VERSION = "v250";
var STORAGE_KEY = "azgram_ultra_profile_v250";
var SETTINGS_KEY = "azgram_ultra_settings_v250";
var MSG_KEY = "azgram_ultra_messages_v250";
var STATUS_KEY = "azgram_ultra_status_v250";

var db = null;
var peer = null;
var currentPage = "contacts";
var currentChat = null;
var selectedAvatar = "";
var selectedMedia = [];
var selectedAudio = null;
var toastTimer = null;

var app = document.getElementById("app");

var defaultSettings = {
    lastSeen:true,
    avatar:true,
    status:true,
    readReceipt:true,
    groupAdd:true,
    vibration:true,
    sound:true
};

function esc(value){
    return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function uid(){
    return "az_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2,10);
}

function getProfile(){
    try{
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    }catch(e){
        return null;
    }
}

function saveProfile(profile){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(profile));
}

function getSettings(){
    try{
        var x = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
        return x || defaultSettings;
    }catch(e){
        return defaultSettings;
    }
}

function saveSettings(s){
    localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));
}

function toast(message){
    var t = document.getElementById("toast");
    if(!t) return;
    t.textContent = message;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
        t.classList.remove("show");
    },2000);
}

function icons(){
    if(window.lucide && lucide.createIcons){
        try{
            lucide.createIcons({
                attrs:{
                    "stroke-width":1.5
                }
            });
        }catch(e){}
    }
}

function nowTime(){
    try{
        return new Intl.DateTimeFormat("az-AZ",{
            hour:"2-digit",
            minute:"2-digit",
            hour12:false,
            timeZone:"Asia/Baku"
        }).format(new Date());
    }catch(e){
        return new Date().toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });
    }
}

function avatarHTML(profile,small){
    var cls = small ? "small-avatar" : "avatar";

    if(profile && profile.avatar){
        return '<div class="'+cls+'"><img src="'+profile.avatar+'" alt=""></div>';
    }

    return '<div class="'+cls+'"><i data-lucide="user-round"></i></div>';
}

function makeDefaultName(){
    return "AzGram istifadəçisi";
}

/* ============================================================
   GUN
   ============================================================ */

function initGun(){
    try{
        if(typeof Gun !== "undefined"){
            db = Gun({
                peers:[
                    "https://gun-manhattan.herokuapp.com/gun",
                    "https://gun-us.herokuapp.com/gun"
                ],
                localStorage:true
            });
        }
    }catch(e){
        db = null;
    }
}

function publishProfile(profile){
    if(!db) return;

    try{
        db.get("azgram_ultra_users_v250")
          .get(profile.id)
          .put({
              id:profile.id,
              name:profile.name,
              avatar:profile.avatar || "",
              bio:profile.bio || "",
              link:profile.link || "",
              online:true,
              lastSeen:Date.now(),
              musicFav:"",
              verified:false
          });
    }catch(e){}
}

function goOffline(){
    var p = getProfile();
    if(!p || !db) return;

    try{
        db.get("azgram_ultra_users_v250")
          .get(p.id)
          .put({
              online:false,
              lastSeen:Date.now()
          });
    }catch(e){}
}

/* ============================================================
   ONBOARDING
   ============================================================ */

function renderOnboarding(){
    app.innerHTML = `
    <section class="screen onboarding">
        <div class="onboard-inner">

            <div class="logo">
                AzGram <span>ULTRA</span>
            </div>

            <div class="subtitle">
                WhatsApp + TikTok + Spotify
            </div>

            <div class="field">
                <label class="label">
                    Ad
                    <span class="optional">istəyə bağlı</span>
                </label>
                <input
                    id="nameInput"
                    class="input"
                    maxlength="50"
                    autocomplete="off"
                    autocorrect="off"
                    placeholder="Adınızı yazın">
            </div>

            <div class="field">
                <label class="label">

/* ============================================================
   IMAGE COMPRESSION
   ============================================================ */

function compressImage(file,maxSize,quality,callback){
    var reader = new FileReader();

    reader.onload = function(){
        var img = new Image();

        img.onload = function(){
            var w = img.width;
            var h = img.height;

            if(w > maxSize || h > maxSize){
                if(w > h){
                    h = Math.round(h * maxSize / w);
                    w = maxSize;
                }else{
                    w = Math.round(w * maxSize / h);
                    h = maxSize;
                }
            }

            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;

            var ctx = canvas.getContext("2d");
            ctx.drawImage(img,0,0,w,h);

            callback(canvas.toDataURL("image/jpeg",quality));
        };

        img.onerror = function(){
            callback(reader.result);
        };

        img.src = reader.result;
    };

    reader.readAsDataURL(file);
}

function loadUsers(){
    var list = document.getElementById("contactList");

    if(!list) return;

    var me = getProfile();

    var localUsers = [];

    try{
        var all = JSON.parse(
            localStorage.getItem("azgram_demo_users") || "[]"
        );

        localUsers = all.filter(function(u){
            return !me || u.id !== me.id;
        });
    }catch(e){}

    renderUserList(localUsers);

    if(!db) return;

    try{
        db.get("azgram_ultra_users_v250").map().on(
            function(user){
                if(!user || !user.id) return;
                if(me && user.id === me.id) return;

                var exists = localUsers.some(function(x){
                    return x.id === user.id;
                });

                if(!exists){
                    localUsers.push(user);
                }else{
                    localUsers = localUsers.map(function(x){
                        return x.id === user.id ? user : x;
                    });
                }

                renderUserList(localUsers);
            }
        );
    }catch(e){}
}

function formatLastSeen(time){
    if(!time) return "naməlum";

    var diff = Date.now() - Number(time);

    if(diff < 60000) return "indi";
    if(diff < 3600000) return Math.floor(diff/60000)+" dəq";
    if(diff < 86400000) return Math.floor(diff/3600000)+" saat";

    return Math.floor(diff/86400000)+" gün";
}

function chatKey(a,b){
    return [a,b].sort().join("_");
}

function loadMessages(){
    var box = document.getElementById("messages");
    if(!box || !currentChat) return;

    var me = getProfile();
    var key = chatKey(me.id,currentChat.id);

    var messages = [];

    try{
        messages = JSON.parse(
            localStorage.getItem(MSG_KEY+"_"+key) || "[]"
        );
    }catch(e){}

    renderMessages(messages);

    if(db){
        try{
            db.get("ultra_msg_"+key).map().on(function(m){
                if(!m || !m.id) return;

                var exists = messages.some(function(x){
                    return x.id === m.id;
                });

                if(!exists){
                    messages.push(m);
                    messages.sort(function(a,b){
                        return a.time-b.time;
                    });

                    localStorage.setItem(
                        MSG_KEY+"_"+key,
                        JSON.stringify(messages.slice(-500))
                    );

                    renderMessages(messages);
                }
            });
        }catch(e){}
    }
}

function renderMessages(messages){
    var box = document.getElementById("messages");
    if(!box) return;

    if(!messages.length){
        box.innerHTML = `
            <div class="empty" style="min-height:200px">
                <i data-lucide="message-circle"></i>
                <div>Mesaj yoxdur</div>
                <div style="font-size:12px;margin-top:5px">
                    İlk mesajı göndərin.
                </div>
            </div>
        `;
        icons();
        return;
    }

    box.innerHTML = messages.map(function(m){
        return `
            <div class="message ${m.mine ? "mine" : ""}">
                ${esc(m.text)}
                <span class="message-time">
                    ${esc(m.clock)}
                    ${m.mine ? " ✓✓" : ""}
                </span>
            </div>
        `;
    }).join("");

    box.scrollTop = box.scrollHeight;
}

function sendMessage(){
    if(!currentChat) return;

    var input = document.getElementById("messageText");
    if(!input) return;

    var text = input.value.trim();

    if(!text) return;

    var me = getProfile();

    var msg = {
        id:uid(),
        from:me.id,
        to:currentChat.id,
        text:text,
        time:Date.now(),
        clock:nowTime(),
        mine:true
    };

    var key = chatKey(me.id,currentChat.id);

    var arr = [];

    try{
        arr = JSON.parse(
            localStorage.getItem(MSG_KEY+"_"+key) || "[]"
        );
    }catch(e){}

    arr.push(msg);

    localStorage.setItem(
        MSG_KEY+"_"+key,
        JSON.stringify(arr.slice(-500))
    );

    if(db){
        try{
            db.get("ultra_msg_"+key)
              .get(msg.id)
              .put(msg);
        }catch(e){}
    }

    input.value = "";
    renderMessages(arr);
}

function showMediaPreview(files){
    var html = `
        <div class="modal-head">

                <i data-lucide="x"></i>

        </button>
    `;

    showModal(html);

    var box = document.getElementById("mediaPreviewList");

    files.forEach(function(file){
        if(file.type.indexOf("image/") === 0){
            var url = URL.createObjectURL(file);

            box.innerHTML +=
                '<img class="preview-image" src="'+url+'" alt="">';
        }else if(file.type.indexOf("video/") === 0){
            var v = document.createElement("video");
            v.controls = true;
            v.className = "preview-image";
            v.src = URL.createObjectURL(file);
            box.appendChild(v);
        }
    });

    icons();

    document.getElementById("sendMediaBtn")
        .addEventListener("click",function(){
            toast("Media P2P göndərilməsi növbəyə əlavə edildi");
            selectedMedia = [];
            closeModal();

function saveStatus(status){
    var arr = [];

    try{
        arr = JSON.parse(
            localStorage.getItem(STATUS_KEY) || "[]"
        );
    }catch(e){}

    arr.unshift(status);

    localStorage.setItem(
        STATUS_KEY,
        JSON.stringify(arr.slice(0,100))
    );

    if(db){
        var p = getProfile();

        try{
            db.get("azgram_ultra_status_v250")
              .get(p.id)
              .get(status.id)
              .put(status);
        }catch(e){}
    }
}

        return `
            <article class="status-card">

                ${
                    s.type === "image"
                    ?
                    '<img class="status-media" src="'+s.media+'" alt="">'
                    :
                    ''

                    s.type === "video"
                    ?

                    </div>
                </div>

                <div class="status-actions">

                    <button

                        data-id="${s.id}">
                        <i data-lucide="heart"></i>

                    <button
                        class="status-action comment-status"

                        <i data-lucide="message-circle"></i>
                        <span>0</span>
                    </button>

                    <button
                        class="status-action share-status"
                        data-id="${s.id}">
                        <i data-lucide="share-2"></i>
                        <span>0</span>
                    </button>

                    <button
                        class="status-action"

                        <i data-lucide="music-2"></i>

        document.querySelectorAll(".share-status"),
        function(btn){
            btn.addEventListener("click",function(){
                shareText("AzGram status");

        document.querySelectorAll("[data-music-action]"),
        function(btn){
            btn.addEventListener("click",function(){
                openMusicLibrary();
            });
        }
    );
}

function likeStatus(id){
    var arr = [];

    try{
        arr = JSON.parse(
            localStorage.getItem(STATUS_KEY) || "[]"
        );
    }catch(e){}

    arr = arr.map(function(s){
        if(s.id === id){
            s.likes = Number(s.likes || 0) + 1;
        }
        return s;
    });

    localStorage.setItem(STATUS_KEY,JSON.stringify(arr));
    renderStatuses();
    toast("Bəyənildi");
}

                    style="background:#222">

                    '<button id="cameraCall" class="icon-btn" style="background:#222"><i data-lucide="video"></i></button>'
                    :
                    ''
                }

                    id="endCall"
                    class="icon-btn"
                    style="background:#d93025">
                    <i data-lucide="phone-off"></i>
                </button>

            </div>

        .addEventListener("click",function(){
            closeModal();
            toast("Zəng bitdi");
        });

    if(video){
        requestCamera();
    }
}

function requestCamera(){
    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){
        toast("Kamera bu brauzerdə dəstəklənmir");
        return;
    }

    navigator.mediaDevices.getUserMedia({
        video:true,
        audio:true
    }).then(function(stream){

        var v = document.getElementById("localVideo");

        if(v){
            v.srcObject = stream;
        }

    }).catch(function(){
        toast("Kamera icazəsi verilmədi");
    });
}

function bindHomeEvents(){

            });
        }
    );

    if(search){
        search.addEventListener("input",function(){
            var q = search.value.toLowerCase();

            Array.prototype.forEach.call(
                document.querySelectorAll(".user-card"),
                function(card){
                    card.style.display =
                        card.textContent.toLowerCase().indexOf(q) >= 0
                        ? "flex"
                        : "none";
                }
            );
        });
    }

    var add = document.getElementById("addContactBtn");

    if(add){
        add.addEventListener("click",function(){
            addContact();
        });
    }

    var create = document.getElementById("createStatusBtn");

    if(create){
        create.addEventListener("click",function(){
            createStatus();
        });
    }

    var edit = document.getElementById("editProfileBtn");

    if(edit){
        edit.addEventListener("click",function(){
            editProfile();
        });
    }

    Array.prototype.forEach.call(
        document.querySelectorAll("[data-toggle]"),
        function(toggle){
            toggle.addEventListener("click",function(){
                var key = toggle.dataset.toggle;
                var s = getSettings();

                s[key] = !s[key];

                saveSettings(s);

                toggle.classList.toggle("on",s[key]);

                toast(s[key] ? "Aktiv edildi" : "Deaktiv edildi");
            });
        }
    );

    var qr = document.getElementById("qrBtn");

    if(qr){
        qr.addEventListener("click",showQR);
    }

    var share = document.getElementById("shareProfileBtn");

    if(share){
        share.addEventListener("click",function(){
            var p = getProfile();

            shareText(
                "AzGram profilim\n"+
                p.name+
                "\nID: "+
                p.id
            );
        });
    }

    var logout = document.getElementById("logoutBtn");

    if(logout){
        logout.addEventListener("click",function(){
            goOffline();
            localStorage.removeItem(STORAGE_KEY);
            selectedAvatar = "";
            renderOnboarding();
            toast("Çıxış edildi");
        });
    }

    var del = document.getElementById("deleteAccountBtn");

    if(del){
        del.addEventListener("click",function(){
            showModal(`
                <div class="modal-head">
                    <div class="modal-title">Hesabı sil</div>
                    <button class="close" data-close>
                        <i data-lucide="x"></i>
                    </button>
                </div>

                <div style="color:#aaa;line-height:1.6">
                    Bu cihazdakı AzGram profil məlumatları silinəcək.
                </div>

                <button
                    id="confirmDelete"
                    class="btn"
                    style="width:100%;margin-top:20px;color:#ff5555">
                    Hesabı sil
                </button>
            `);

            icons();

            document.getElementById("confirmDelete")
                .addEventListener("click",function(){
                    localStorage.removeItem(STORAGE_KEY);
                    localStorage.removeItem(SETTINGS_KEY);
                    closeModal();
                    renderOnboarding();
                    toast("Hesab silindi");
                });
        });
    }

    var globalSearch = document.getElementById("globalSearchBtn");

    if(globalSearch){
        globalSearch.addEventListener("click",globalSearchModal);
    }

    var newChat = document.getElementById("newChatBtn");

    if(newChat){
        newChat.addEventListener("click",addContact);
    }

    var more = document.getElementById("moreBtn");

    if(more){
        more.addEventListener("click",function(){
            showMoreMenu();
        });
    }

    renderStatuses();
}

function switchPage(page){
    currentPage = page;

    Array.prototype.forEach.call(
        document.querySelectorAll(".page"),
        function(p){
            p.classList.remove("active");
        }
    );

    var target = document.getElementById(page+"Page");

    if(target){
        target.classList.add("active");
    }

    Array.prototype.forEach.call(
        document.querySelectorAll(".nav-btn"),
        function(btn){
            btn.classList.toggle(
                "active",
                btn.dataset.page === page
            );
        }
    );

    if(page === "status"){
        renderStatuses();
    }
}

function handleEditAvatar(e){

    if(!file) return;

    compressImage(file,1080,.75,function(result){
        selectedAvatar = result;

        var box = document.getElementById("editAvatarPreview");

        if(box){
            box.innerHTML =
                '<div class="avatar"><img src="'+result+'" alt=""></div>';
        }

        toast("Yeni avatar seçildi");
    });
}

/* ============================================================

function showModal(content){
    closeModal(false);

    var modal = document.createElement("div");

    modal.id = "activeModal";
    modal.className = "modal";

    modal.innerHTML =
        '<div class="modal-card">'+
        content+
        '</div>';

    document.body.appendChild(modal);

    var closeButtons =
        modal.querySelectorAll("[data-close]");

    Array.prototype.forEach.call(
        closeButtons,
        function(btn){
            btn.addEventListener("click",function(){
                closeModal();
            });
        }
    );

    modal.addEventListener("click",function(e){
        if(e.target === modal){
            closeModal();
        }
    });

    icons();
}

function closeModal(silent){
    var modal = document.getElementById("activeModal");

    if(modal){
        modal.remove();
    }

    if(silent !== false){
        selectedMedia = [];
    }
}

/* ============================================================
   SHARE / COPY
   ============================================================ */

function copyText(text){
    if(navigator.clipboard){
        navigator.clipboard.writeText(text)
            .then(function(){
                toast("Kopyalandı");
            })
            .catch(function(){
                fallbackCopy(text);
            });
    }else{
        fallbackCopy(text);
    }
}

function fallbackCopy(text){
    var ta = document.createElement("textarea");

    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";

    document.body.appendChild(ta);

    ta.select();

    try{
        document.execCommand("copy");
        toast("Kopyalandı");
    }catch(e){
        toast("Kopyalama mümkün olmadı");
    }

    ta.remove();
}

function shareText(text){
    if(navigator.share){
        navigator.share({
            title:"AzGram",
            text:text
        }).then(function(){
            toast("Paylaşıldı");
        }).catch(function(){});
    }else{
        copyText(text);
    }
}

/* ============================================================
   SWIPE
   ============================================================ */

var touchStartX = 0;
var touchStartY = 0;

document.addEventListener("touchstart",function(e){
    if(!e.touches || !e.touches[0]) return;

    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchend",function(e){
    if(!e.changedTouches || !e.changedTouches[0]) return;

    var x = e.changedTouches[0].clientX;
    var y = e.changedTouches[0].clientY;

    var dx = x - touchStartX;
    var dy = y - touchStartY;

    if(Math.abs(dx) < 60 && Math.abs(dy) < 60){
        return;
    }

    if(Math.abs(dx) > Math.abs(dy)){

        if(dx < 0){
            if(currentPage === "contacts"){
                openDiscovery();
            }
        }else{
            if(currentPage === "status"){
                switchPage("contacts");
            }
        }

    }else{

        if(dy < 0){
            globalSearchModal();
        }else{
            if(currentPage === "contacts"){
                loadUsers();
                toast("Yeniləndi");
            }
        }
    }

},{passive:true});

function setupPWA(){
    try{

            name:"AzGram ULTRA PRO",
            short_name:"AzGram",
            start_url:".",
            display:"standalone",
            background_color:"#000000",
            theme_color:"#000000",
            description:"AzGram P2P messenger"
        };

        var blob = new Blob(
            [JSON.stringify(manifest)],
            {type:"application/manifest+json"}
        );

        var url = URL.createObjectURL(blob);

        var link = document.createElement("link");

        link.rel = "manifest";
        link.href = url;

        document.head.appendChild(link);
    }catch(e){}
}

/* ============================================================
   PEERJS
   ============================================================ */

function initPeer(){
    if(typeof Peer === "undefined"){
        return;
    }

    var p = getProfile();

    if(!p) return;

    try{
        peer = new Peer(p.id,{
            config:{
                iceServers:[
                    {
                        urls:"stun:stun.l.google.com:19302"
                    },
                    {
                        urls:"stun:stun1.l.google.com:19302"
                    }
                ]
            }
        });

        peer.on("open",function(){
            try{
                db && db.get("azgram_ultra_users_v250")
                    .get(p.id)
                    .put({
                        online:true,
                        lastSeen:Date.now()
                    });
            }catch(e){}
        });

        peer.on("call",function(call){
            handleIncomingCall(call);
        });

    }catch(e){}
}

function handleIncomingCall(call){
    showModal(`
        <div class="modal-head">
            <div class="modal-title">Gələn zəng</div>
        </div>

        <div style="text-align:center;padding:20px">
            <div style="font-size:18px">
                Gələn zəng var
            </div>

            <div style="display:flex;gap:10px;margin-top:25px">

                <button
                    id="acceptCall"
                    class="btn btn-green"
                    style="flex:1">
                    <i data-lucide="phone"></i>
                    Qəbul et
                </button>

                <button
                    id="rejectCall"
                    class="btn"
                    style="flex:1">
                    <i data-lucide="phone-off"></i>
                    Rədd et
                </button>

            </div>
        </div>
    `);

    icons();

    document.getElementById("rejectCall")
        .addEventListener("click",function(){
            try{
                call.close();
            }catch(e){}
            closeModal();
        });

    document.getElementById("acceptCall")
        .addEventListener("click",function(){
            navigator.mediaDevices.getUserMedia({
                audio:true,
                video:false
            }).then(function(stream){
                call.answer(stream);
                closeModal();
            }).catch(function(){
                toast("Mikrofon icazəsi verilmədi");
            });
        });
}

   ============================================================ */

function saveLocalDemoUser(){
    var p = getProfile();

    if(!p) return;

    try{
        var arr = JSON.parse(
            localStorage.getItem("azgram_demo_users") || "[]"
        );

        var found = false;

        arr = arr.map(function(x){
            if(x.id === p.id){
                found = true;

                return {
                    id:p.id,
                    name:p.name,
                    avatar:p.avatar,
                    bio:p.bio,
                    link:p.link,
                    online:true,
                    lastSeen:Date.now()
                };
            }

            return x;
        });

        if(!found){
            arr.push({
                id:p.id,
                name:p.name,
                avatar:p.avatar,
                bio:p.bio,
                link:p.link,
                online:true,
                lastSeen:Date.now()
            });
        }

        localStorage.setItem(
            "azgram_demo_users",
            JSON.stringify(arr)
        );

    }catch(e){}
}
