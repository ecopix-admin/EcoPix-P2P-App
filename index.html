<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Pro - 3.5 Dəqiqəlik Musiqi Generatoru</title>
    <!-- Tone.js professional musiqi sintezi kitabxanası -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-grad-1: #0b0f19;
            --bg-grad-2: #111827;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, var(--bg-grad-1)),
                        radial-gradient(circle at bottom right, #0f172a, var(--bg-grad-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .studio-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 36px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            max-width: 540px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #60a5fa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .grid-params {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-sub);
            font-weight: 700;
        }

        select, input[type="number"] {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        select:focus, input[type="number"]:focus {
            border-color: var(--accent-purple);
        }

        .progress-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 24px;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .structure-tags {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tag {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .tag.active {
            background: rgba(139, 92, 246, 0.2);
            color: #c084fc;
            border-color: rgba(139, 92, 246, 0.5);
            font-weight: bold;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4);
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -4px rgba(139, 92, 246, 0.6);
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Visualizer Animation */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 5px;
            height: 30px;
            margin-top: 18px;
        }

        .v-bar {
            width: 5px;
            height: 6px;
            background: var(--accent-blue);
            border-radius: 3px;
        }

        .playing .v-bar {
            animation: pulse 0.6s infinite alternate ease-in-out;
        }

        @keyframes pulse {
            0% { height: 6px; background: var(--accent-blue); }
            100% { height: 28px; background: var(--accent-pink); }
        }

        .v-bar:nth-child(1) { animation-delay: 0.0s; }
        .v-bar:nth-child(2) { animation-delay: 0.1s; }
        .v-bar:nth-child(3) { animation-delay: 0.2s; }
        .v-bar:nth-child(4) { animation-delay: 0.3s; }
        .v-bar:nth-child(5) { animation-delay: 0.4s; }
        .v-bar:nth-child(6) { animation-delay: 0.2s; }
        .v-bar:nth-child(7) { animation-delay: 0.1s; }
    </style>
</head>
<body>

<div class="studio-card">
    <div class="header">
        <h1>AI Studio Pro</h1>
        <p>Tam uzunluqda (3.5 dəqiqə) professional musiqi generatoru</p>
    </div>

    <div class="grid-params">
        <div class="input-group full-width">
            <label for="genre">Musiqi Janrı</label>
            <select id="genre" onchange="updateGenreDefaults()">
                <option value="synthwave">Synthwave / Retrowave (80-lər Elektron)</option>
                <option value="lofi">Lo-Fi Hip-Hop (Sakit & Relaks)</option>
                <option value="pop">Modern Dance / Pop</option>
                <option value="ambient">Cinematic Ambient (Dərin & Rahatlandırıcı)</option>
                <option value="rock">Cyber Rock / Industrial</option>
            </select>
        </div>

        <div class="input-group">
            <label for="bpm">Temp (BPM)</label>
            <input type="number" id="bpm" value="120" min="60" max="180">
        </div>

        <div class="input-group">
            <label for="duration">Müddət (Dəqiqə)</label>
            <select id="duration">
                <option value="210" selected>3.5 Dəqiqə (210s)</option>
                <option value="180">3.0 Dəqiqə (180s)</option>
                <option value="120">2.0 Dəqiqə (120s)</option>
                <option value="60">1.0 Dəqiqə (60s)</option>
            </select>
        </div>
    </div>

    <div class="progress-box">
        <div class="time-display">
            <span id="statusText">Hazırdır</span>
            <span id="timeVal">00:00 / 03:30</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="structure-tags" id="structureTags">
            <span class="tag" id="tag-intro">Intro</span>
            <span class="tag" id="tag-verse1">Verse 1</span>
            <span class="tag" id="tag-chorus1">Chorus</span>
            <span class="tag" id="tag-verse2">Verse 2</span>
            <span class="tag" id="tag-chorus2">Chorus</span>
            <span class="tag" id="tag-bridge">Bridge / Solo</span>
            <span class="tag" id="tag-chorus3">Final Chorus</span>
            <span class="tag" id="tag-outro">Outro</span>
        </div>
    </div>

    <div class="btn-stack">
        <button id="mainBtn" class="btn-generate" onclick="handleMainAction()">
            <span>▶ Musiqini Bəstələ və Oynat</span>
        </button>
    </div>

    <div class="visualizer" id="visualizer">
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
        <div class="v-bar"></div>
    </div>
</div>

<script>
    // --- JANR ALQORİTMALARI VƏ NOT BAZASI ---
    const GENRE_PRESETS = {
        synthwave: {
            bpm: 120,
            chords: [
                ['A3', 'C4', 'E4', 'G4'], // Am7
                ['F3', 'A3', 'C4', 'E4'], // Fmaj7
                ['C3', 'E3', 'G3', 'B3'], // Cmaj7
                ['G3', 'B3', 'D4', 'F4']  // G7
            ],
            bassNotes: ['A1', 'F1', 'C2', 'G1'],
            leadScale: ['A4', 'C5', 'D5', 'E5', 'G5', 'A5'],
            synthType: 'sawtooth',
            hasDrums: true
        },
        lofi: {
            bpm: 85,
            chords: [
                ['D3', 'F3', 'A3', 'C4'], // Dm7
                ['G3', 'B3', 'D4', 'F4'], // G7
                ['C3', 'E3', 'G3', 'B3'], // Cmaj7
                ['A3', 'C4', 'E4', 'G4']  // Am7
            ],
            bassNotes: ['D2', 'G1', 'C2', 'A1'],
            leadScale: ['D4', 'E4', 'F4', 'A4', 'C5'],
            synthType: 'sine',
            hasDrums: true
        },
        pop: {
            bpm: 124,
            chords: [
                ['C3', 'E3', 'G3'], // C
                ['G3', 'B3', 'D4'], // G
                ['A3', 'C4', 'E4'], // Am
                ['F3', 'A3', 'C4']  // F
            ],
            bassNotes: ['C2', 'G1', 'A1', 'F1'],
            leadScale: ['C4', 'D4', 'E4', 'G4', 'A4', 'C5'],
            synthType: 'triangle',
            hasDrums: true
        },
        ambient: {
            bpm: 65,
            chords: [
                ['F3', 'A3', 'C4', 'E4'],
                ['A3', 'C4', 'E4', 'G4'],
                ['D3', 'F3', 'A3', 'C4'],
                ['G3', 'B3', 'D4', 'F4']
            ],
            bassNotes: ['F1', 'A1', 'D1', 'G1'],
            leadScale: ['C4', 'E4', 'G4', 'B4', 'D5'],
            synthType: 'sine',
            hasDrums: false
        },
        rock: {
            bpm: 135,
            chords: [
                ['E3', 'B3'], // E5
                ['G3', 'D4'], // G5
                ['A3', 'E4'], // A5
                ['C4', 'G4']  // C5
            ],
            bassNotes: ['E1', 'G1', 'A1', 'C2'],
            leadScale: ['E4', 'G4', 'A4', 'A#4', 'B4', 'D5'],
            synthType: 'square',
            hasDrums: true
        }
    };

    let isPlaying = false;
    let timerInterval = null;
    let totalSeconds = 210;
    let currentSecond = 0;

    // Tone.js Audio komponentləri
    let polySynth, bassSynth, leadSynth, kick, snare, hihat;
    let chordLoop, bassLoop, leadLoop, drumLoop;

    function updateGenreDefaults() {
        const genre = document.getElementById('genre').value;
        document.getElementById('bpm').value = GENRE_PRESETS[genre].bpm;
    }

    async function initAudioEngine() {
        await Tone.start();

        const genreKey = document.getElementById('genre').value;
        const preset = GENRE_PRESETS[genreKey];

        // FX Chain
        const reverb = new Tone.Reverb({ decay: 4, wet: 0.3 }).toDestination();
        const delay = new Tone.FeedbackDelay("8n.", 0.2).connect(reverb);
        const filter = new Tone.Filter(2000, "lowpass").connect(delay);

        // Sintezatorlar
        polySynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: preset.synthType },
            envelope: { attack: 0.2, decay: 0.5, sustain: 0.6, release: 1.2 }
        }).connect(filter);
        polySynth.volume.value = -12;

        bassSynth = new Tone.MonoSynth({
            oscillator: { type: "square" },
            envelope: { attack: 0.05, decay: 0.2, sustain: 0.4, release: 0.8 }
        }).connect(filter);
        bassSynth.volume.value = -8;

        leadSynth = new Tone.Synth({
            oscillator: { type: "triangle" },
            envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 0.5 }
        }).connect(delay);
        leadSynth.volume.value = -10;

        // Nağara (Drums) Sintezi
        kick = new Tone.MembraneSynth().toDestination();
        kick.volume.value = -4;

        snare = new Tone.NoiseSynth({
            noise: { type: 'white' },
            envelope: { attack: 0.001, decay: 0.2, sustain: 0 }
        }).connect(reverb);
        snare.volume.value = -14;

        hihat = new Tone.MetalSynth({
            frequency: 200,
            envelope: { attack: 0.001, decay: 0.05, release: 0.05 },
            harmonicity: 5.1,
            modulationIndex: 32,
            resonance: 4000,
            octaves: 1.5
        }).toDestination();
        hihat.volume.value = -22;

        // SEQUNSER DÖVRİLƏRİ (Loops)
        let step = 0;
        chordLoop = new Tone.Loop(time => {
            const chordIndex = Math.floor(step / 4) % preset.chords.length;
            
            // Struktur dinamikası (Arrangement)
            const stage = getCurrentStage();
            if (stage !== 'intro' && stage !== 'outro') {
                polySynth.triggerAttackRelease(preset.chords[chordIndex], "2n", time);
            } else if (step % 8 === 0) {
                polySynth.triggerAttackRelease(preset.chords[chordIndex], "1n", time);
            }

            // Bassline
            const bassNote = preset.bassNotes[chordIndex];
            if (stage !== 'intro') {
                bassSynth.triggerAttackRelease(bassNote, "8n", time);
            }

            step++;
        }, "4n");

        // Melodiya Generatoru (Süni intellekt not seçimi)
        leadLoop = new Tone.Loop(time => {
            const stage = getCurrentStage();
            // Melodiya yalnız əsas hissələrdə (Verse, Chorus, Solo) oxunur
            if (['verse1', 'chorus1', 'verse2', 'chorus2', 'bridge', 'chorus3'].includes(stage)) {
                if (Math.random() > 0.3) {
                    const scale = preset.leadScale;
                    const randomNote = scale[Math.floor(Math.random() * scale.length)];
                    leadSynth.triggerAttackRelease(randomNote, "8n", time);
                }
            }
        }, "8n");

        // Nağara Ritim Generatoru
        drumLoop = new Tone.Loop(time => {
            if (!preset.hasDrums) return;
            const stage = getCurrentStage();
            if (stage === 'intro' || stage === 'outro') return; // Intro və Outro-da nağara olmur

            const beat = Math.floor(Tone.Transport.ticks / Tone.Time("4n").toTicks()) % 4;

            // Kick (1 və 3-cü zərbədə)
            kick.triggerAttackRelease("C1", "8n", time);

            // Snare (2 və 4-cü zərbədə)
            if (beat === 1 || beat === 3) {
                snare.triggerAttackRelease("8n", time);
            }

            // Hi-Hat (Hər 8-lik notda)
            hihat.triggerAttackRelease("16n", time);
        }, "4n");
    }

    function getCurrentStage() {
        const progress = currentSecond / totalSeconds;
        
        // 3.5 Dəqiqəlik Mahnı Strukturu (Arrangement)
        if (progress < 0.08) return 'intro';        // 0 - 16s
        if (progress < 0.25) return 'verse1';       // 16s - 52s
        if (progress < 0.42) return 'chorus1';      // 52s - 88s
        if (progress < 0.58) return 'verse2';       // 88s - 122s
        if (progress < 0.75) return 'chorus2';      // 122s - 157s
        if (progress < 0.88) return 'bridge';       // 157s - 184s
        if (progress < 0.96) return 'chorus3';      // 184s - 201s
        return 'outro';                             // 201s - 210s
    }

    function updateActiveTag(stage) {
        document.querySelectorAll('.tag').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById(`tag-${stage}`);
        if (activeEl) activeEl.classList.add('active');
    }

    async function handleMainAction() {
        if (isPlaying) {
            stopMusic();
        } else {
            await startMusic();
        }
    }

    async function startMusic() {
        totalSeconds = parseInt(document.getElementById('duration').value);
        currentSecond = 0;
        
        Tone.Transport.bpm.value = parseInt(document.getElementById('bpm').value);

        document.getElementById('statusText').innerText = "Audio Motor Yüklənir...";
        await initAudioEngine();

        Tone.Transport.start();
        chordLoop.start(0);
        leadLoop.start(0);
        drumLoop.start(0);

        isPlaying = true;
        document.getElementById('mainBtn').innerHTML = "<span>⏹ Musiqini Saxla</span>";
        document.getElementById('mainBtn').className = "btn-stop";
        document.getElementById('visualizer').classList.add('playing');

        // Taymer və Tərəqqi Paneli
        timerInterval = setInterval(() => {
            currentSecond++;
            
            const pct = (currentSecond / totalSeconds) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;

            const curM = String(Math.floor(currentSecond / 60)).padStart(2, '0');
            const curS = String(currentSecond % 60).padStart(2, '0');
            const totM = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const totS = String(totalSeconds % 60).padStart(2, '0');
            
            document.getElementById('timeVal').innerText = `${curM}:${curS} / ${totM}:${totS}`;

            const stage = getCurrentStage();
            document.getElementById('statusText').innerText = `Oynanılır: ${stage.toUpperCase()}`;
            updateActiveTag(stage);

            if (currentSecond >= totalSeconds) {
                stopMusic();
            }
        }, 1000);
    }

    function stopMusic() {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        
        if (chordLoop) chordLoop.stop();
        if (leadLoop) leadLoop.stop();
        if (drumLoop) drumLoop.stop();

        clearInterval(timerInterval);
        isPlaying = false;

        document.getElementById('mainBtn').innerHTML = "<span>▶ Musiqini Bəstələ və Oynat</span>";
        document.getElementById('mainBtn').className = "btn-generate";
        document.getElementById('visualizer').classList.remove('playing');
        document.getElementById('statusText').innerText = "Dayandırıldı";
        document.getElementById('progressBar').style.width = "0%";
    }
</script>

</body>
     </html>
