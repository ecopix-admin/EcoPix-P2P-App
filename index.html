<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sham-Cell | Pro Müdafiə Qalxanı</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            border: 2px solid #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            background: linear-gradient(145deg, #050505, #111);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.15);
            width: 85%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.4rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #00ffff;
        }

        .sub-title {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .status-box {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: #0a0a0a;
            border: 1px solid #222;
        }

        .mode-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .freq-display {
            font-size: 1.8rem;
            color: #fbff00;
            margin-top: 5px;
        }

        button {
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 15px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.1);
        }

        button.active {
            border-color: #ff3333;
            color: #ff3333;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
        }

        .bg-note {
            font-size: 0.7rem;
            color: #555;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SHAM-CELL BACKGROUND PRO</h1>
    <div class="sub-title">Arxa Fon və Adaptasiya Əleyhinə Sistem</div>
    
    <div class="status-box">
        <div class="mode-text" id="modeStatus">SİSTEM DAYANDIRILIB</div>
        <div class="freq-display"><span id="liveFreq">0</span> Hz</div>
    </div>
    
    <button id="mainBtn">Qalxanı Aktiv Et</button>
    
    <div class="bg-note">
        * Bu rejim tətbiq arxa fona keçəndə və ya ekran qapananda səs dalğasını kəsmir.
    </div>
</div>

<script>
    let audioCtx;
    let oscillator;
    let gainNode;
    let isRunning = false;
    let modulationInterval;
    let wakeLock = null;

    const mainBtn = document.getElementById('mainBtn');
    const modeStatus = document.getElementById('modeStatus');
    const liveFreq = document.getElementById('liveFreq');

    // Ekranın kilidlənməsini əngəlləyən funksiya (Wake Lock)
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.log(`${err.name}, ${err.message}`);
        }
    }

    function startAntiAdaptationEngine() {
        let baseFreq = 18000;
        let direction = 1;

        // Yarasa exolokasiyasını təqlid edən dinamik tezlik modulyasiyası
        modulationInterval = setInterval(() => {
            if (audioCtx && oscillator && gainNode) {
                const now = audioCtx.currentTime;

                // Tezliyi davamlı olaraq dəyişirik ki, ağcaqanadlar otağa girə bilməsin
                baseFreq += (200 * direction);
                if (baseFreq >= 21500) direction = -1;
                if (baseFreq <= 17500) direction = 1;

                oscillator.frequency.setValueAtTime(baseFreq, now);
                liveFreq.innerText = baseFreq;

                // Arxa fonda aktiv qalması üçün Gain (Səs gücü) impulsları
                gainNode.gain.setValueAtTime(0.02, now);
                gainNode.gain.exponentialRampToValueAtTime(0.8, now + 0.03);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            }
        }, 220); // Hər 220ms-dən bir dəyişir
    }

    mainBtn.onclick = async function() {
        if (!isRunning) {
            // Audio kontexti başladırıq
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(18000, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            
            // Funksiyaları aktivləşdiririk
            startAntiAdaptationEngine();
            await requestWakeLock();
            
            // İnterfeys vizual dəyişiklik
            this.innerText = "Qalxanı Söndür";
            this.classList.add('active');
            modeStatus.innerText = "MÜDAFİƏ AKTİVDİR (ARXA FON)";
            modeStatus.style.color = "#00ff00";
            isRunning = true;
        } else {
            // Sistemi tamamilə dayandırırıq
            clearInterval(modulationInterval);
            if (oscillator) oscillator.stop();
            if (audioCtx) audioCtx.close();
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
            
            this.innerText = "Qalxanı Aktiv Et";
            this.classList.remove('active');
            modeStatus.innerText = "SİSTEM DAYANDIRILIB";
            modeStatus.style.color = "#fff";
            liveFreq.innerText = "0";
            isRunning = false;
        }
    };

    // Brauzer arxa fona keçib yenidən qayıdanda kilidi bərpa etmək üçün
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });
</script>

</body>
</html>
