<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>ARWORLD — Spatial Social</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#050a12;
  --panel:#0b1422;
  --panel2:#101d2e;
  --line:#243750;
  --text:#f4f7fb;
  --muted:#9aaac0;
  --cyan:#42d9ff;
  --blue:#328dff;
  --purple:#7057ff;
  --green:#3ee28b;
  --danger:#ff526b;
  --navH:76px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  color:var(--text);
  cursor:pointer;
  touch-action:manipulation;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#050a12;
}

/* HEADER */

.header{
  position:absolute;
  z-index:100;
  top:0;
  left:0;
  right:0;
  height:78px;
  padding:
    max(10px,env(safe-area-inset-top))
    18px
    10px
    22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(4,9,17,.94);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(16px);
}

.logo{
  font-size:29px;
  font-weight:900;
  letter-spacing:.5px;
}

.logo span{
  color:var(--cyan);
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:52px;
  height:52px;
  border-radius:18px;
  background:#0c1828;
  border:1px solid #243650;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

/* CAMERA */

#cameraView{
  position:absolute;
  inset:0;
  background:#000;
  overflow:hidden;
}

#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.cameraShade{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.45) 0%,
      transparent 25%,
      transparent 70%,
      rgba(0,0,0,.5) 100%
    );
}

/* STATUS */

.statusRow{
  position:absolute;
  z-index:20;
  top:92px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.status{
  padding:13px 17px;
  border-radius:25px;
  background:rgba(8,20,35,.82);
  border:1px solid #263d5b;
  backdrop-filter:blur(12px);
  font-size:15px;
}

/* AR OBJECTS */

#arObjects{
  position:absolute;
  inset:78px 0 var(--navH) 0;
  z-index:10;
  pointer-events:none;
}

.ar-card{
  position:absolute;
  min-width:190px;
  max-width:250px;
  padding:12px;
  border-radius:17px;
  background:rgba(7,16,28,.90);
  border:1px solid rgba(66,217,255,.5);
  box-shadow:0 10px 35px rgba(0,0,0,.4);
  backdrop-filter:blur(14px);
  pointer-events:auto;
  transform:translate(-50%,-50%);
  animation:pop .2s ease;
}

@keyframes pop{
  from{
    opacity:0;
    transform:translate(-50%,-50%) scale(.85);
  }
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

.ar-title{
  font-weight:800;
  font-size:16px;
  margin-bottom:5px;
}

.ar-meta{
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}

.ar-desc{
  color:#d9e2ee;
  font-size:13px;
  line-height:1.35;
}

.ar-distance{
  color:var(--cyan);
  font-size:12px;
  margin-top:8px;
}

.ar-open{
  margin-top:9px;
  width:100%;
  padding:9px;
  border-radius:11px;
  background:#13263c;
  border:1px solid #29425f;
}

/* BOTTOM NAV */

.bottomNav{
  position:absolute;
  z-index:200;
  left:0;
  right:0;
  bottom:0;
  height:var(--navH);
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(4,9,17,.97);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.navBtn{
  position:relative;
  width:20%;
  height:68px;
  background:transparent;
  color:#7889a3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.navBtn .ico{
  font-size:23px;
}

.navBtn span:last-child{
  font-size:10px;
}

.navBtn.active{
  color:var(--cyan);
}

.addBtn{
  width:66px;
  height:54px;
  margin-top:-14px;
  border-radius:23px;
  background:linear-gradient(135deg,#1cb8ed,#7358ff);
  font-size:34px;
  color:white;
  box-shadow:0 8px 25px rgba(61,150,255,.35);
}

/* VIEWS */

.view{
  position:absolute;
  inset:0;
  display:none;
  z-index:50;
  background:var(--bg);
}

.view.active{
  display:block;
}

/* MAP */

#map{
  position:absolute;
  inset:78px 0 var(--navH) 0;
}

.leaflet-control-attribution{
  font-size:8px!important;
}

/* GENERAL PAGE */

.page{
  position:absolute;
  inset:78px 0 var(--navH) 0;
  overflow-y:auto;
  padding:20px 16px 35px;
  -webkit-overflow-scrolling:touch;
}

.pageTitle{
  font-size:25px;
  font-weight:900;
  margin-bottom:16px;
}

/* FEED CARD */

.feedCard{
  background:#0c1726;
  border:1px solid #223650;
  border-radius:20px;
  margin-bottom:14px;
  overflow:hidden;
}

.feedMedia{
  width:100%;
  max-height:260px;
  object-fit:cover;
  display:block;
}

.feedBody{
  padding:15px;
}

.feedTitle{
  font-size:18px;
  font-weight:800;
}

.feedMeta{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.feedDesc{
  margin-top:9px;
  color:#c9d3e0;
  line-height:1.4;
}

/* PROFILE */

.profileBox{
  background:#0c1726;
  border:1px solid #223650;
  border-radius:22px;
  padding:20px;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:linear-gradient(135deg,#24c9ef,#7657ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
  margin-bottom:14px;
}

.profileName{
  font-size:24px;
  font-weight:900;
}

.profileBio{
  color:var(--muted);
  margin-top:7px;
}

/* MODAL BACKDROP */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(4px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  pointer-events:none;
}

.modal.show{
  display:flex;
  pointer-events:auto;
}

/* CREATE SHEET */

.sheet{
  position:relative;
  width:min(100%,680px);
  max-height:78dvh;
  min-height:0;
  background:
    linear-gradient(
      180deg,
      #0d1828 0%,
      #09121f 100%
    );
  border:1px solid #243b59;
  border-bottom:0;
  border-radius:28px 28px 0 0;
  box-shadow:0 -20px 70px rgba(0,0,0,.6);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}

.sheetHeader{
  flex:0 0 auto;
  position:relative;
  padding:15px 54px 12px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.handle{
  width:42px;
  height:5px;
  border-radius:10px;
  background:#4a5b70;
  margin:0 auto 12px;
}

.sheetTitle{
  font-size:20px;
  font-weight:900;
}

.closeBtn{
  position:absolute;
  right:14px;
  top:14px;
  width:44px;
  height:44px;
  border-radius:15px;
  background:#162438;
  border:1px solid #2b415e;
  font-size:23px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.sheetBody{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:16px 18px 16px;
  -webkit-overflow-scrolling:touch;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  margin-bottom:13px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  color:#a5b5ca;
  font-size:14px;
  margin:0 0 8px;
}

.input,
.select,
.textarea{
  width:100%;
  min-height:54px;
  border-radius:17px;
  border:1px solid #29415f;
  background:#07111e;
  color:white;
  outline:none;
  padding:0 16px;
  font-size:16px;
}

.textarea{
  min-height:90px;
  padding:13px 16px;
  resize:none;
}

.input:focus,
.select:focus,
.textarea:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(66,217,255,.08);
}

.select{
  appearance:auto;
}

.fileBox{
  position:relative;
  border:1px solid #29415f;
  border-radius:17px;
  background:#07111e;
  padding:11px;
}

.fileBox input{
  width:100%;
  color:#cdd7e4;
}

.mediaPreview{
  display:none;
  margin-top:10px;
  width:100%;
  max-height:150px;
  object-fit:contain;
  border-radius:13px;
  background:#000;
}

.gpsRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:3px;
}

.actionBtn{
  min-height:55px;
  border-radius:17px;
  background:#14253a;
  border:1px solid #2b4462;
  font-weight:700;
  font-size:16px;
}

.actionBtn:active{
  transform:scale(.98);
}

.placeBtn{
  width:100%;
  min-height:60px;
  border-radius:18px;
  background:linear-gradient(100deg,#19b9eb,#7059ff);
  font-size:18px;
  font-weight:900;
  box-shadow:0 9px 25px rgba(70,120,255,.25);
}

.placeBtn:disabled{
  opacity:.5;
  filter:grayscale(.4);
}

.bottomActions{
  flex:0 0 auto;
  padding:10px 18px 14px;
  background:#091321;
  border-top:1px solid rgba(255,255,255,.08);
}

/* DETAIL */

.detailSheet{
  max-height:82dvh;
}

.detailBody{
  overflow-y:auto;
  padding:18px;
}

.detailMedia{
  width:100%;
  max-height:300px;
  border-radius:17px;
  object-fit:cover;
  background:#000;
  display:block;
  margin-bottom:15px;
}

.detailTitle{
  font-size:24px;
  font-weight:900;
}

.detailText{
  margin-top:10px;
  color:#c4cfdd;
  line-height:1.5;
}

.detailActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.detailBtn{
  min-height:55px;
  border-radius:16px;
  background:#14253a;
  border:1px solid #2c4564;
  font-weight:800;
}

.primary{
  background:linear-gradient(100deg,#16bde9,#6e5cff);
}

/* TOAST */

#toast{
  position:fixed;
  z-index:3000;
  left:50%;
  bottom:calc(var(--navH) + 16px);
  transform:translateX(-50%) translateY(20px);
  max-width:90%;
  padding:13px 18px;
  border-radius:15px;
  background:#101f32;
  border:1px solid #304964;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  color:white;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(3,8,14,.8);
  display:none;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(5px);
}

.loading.show{
  display:flex;
}

.loaderBox{
  background:#0d1b2c;
  border:1px solid #29405d;
  padding:22px;
  border-radius:20px;
  text-align:center;
}

.spinner{
  width:38px;
  height:38px;
  border-radius:50%;
  border:4px solid #243a54;
  border-top-color:var(--cyan);
  animation:spin .8s linear infinite;
  margin:auto auto 12px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* SEARCH */

.searchBox{
  position:absolute;
  z-index:300;
  top:88px;
  left:15px;
  right:15px;
  display:none;
}

.searchBox.show{
  display:block;
}

.searchInput{
  width:100%;
  height:54px;
  border-radius:17px;
  background:rgba(8,17,29,.95);
  border:1px solid #2a4564;
  color:white;
  padding:0 17px;
  outline:none;
}

/* MOBILE */

@media(max-width:500px){
  .header{
    height:76px;
  }

  .logo{
    font-size:27px;
  }

  .icon-btn{
    width:50px;
    height:50px;
  }

  .formGrid{
    grid-template-columns:1fr 1fr;
  }

  .sheet{
    max-height:76dvh;
  }

  .input,
  .select{
    min-height:52px;
  }
}

@media(max-height:700px){
  .sheet{
    max-height:72dvh;
  }

  .sheetBody{
    padding-top:10px;
  }

  .field{
    margin-bottom:9px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- CAMERA -->
  <section id="cameraView">

    <video id="camera"
           autoplay
           playsinline
           muted></video>

    <div class="cameraShade"></div>

    <div class="statusRow">
      <div class="status" id="gpsStatus">GPS gözlənilir...</div>
      <div class="status" id="compassStatus">Kompas --°</div>
    </div>

    <div id="arObjects"></div>

    <div class="searchBox" id="searchBox">
      <input id="searchInput"
             class="searchInput"
             placeholder="ARWORLD-də axtar...">
    </div>

  </section>

  <!-- MAP -->
  <section id="mapView" class="view">
    <div id="map"></div>
  </section>

  <!-- FEED -->
  <section id="feedView" class="view">
    <div class="page">
      <div class="pageTitle">Yaxınlıqdakı obyektlər</div>
      <div id="feedList"></div>
    </div>
  </section>

  <!-- PROFILE -->
  <section id="profileView" class="view">
    <div class="page">
      <div class="pageTitle">Profil</div>

      <div class="profileBox">
        <div class="avatar" id="avatarLetter">A</div>
        <div class="profileName" id="profileName">ARWORLD istifadəçisi</div>
        <div class="profileBio" id="profileBio">
          Fiziki dünyada rəqəmsal iz burax.
        </div>

        <button class="actionBtn"
                style="width:100%;margin-top:18px"
                id="editProfileBtn">
          ✏️ Profili redaktə et
        </button>
      </div>
    </div>
  </section>

  <!-- HEADER -->
  <header class="header">

    <div class="logo">
      AR<span>WORLD</span>
    </div>

    <div class="header-actions">

      <button class="icon-btn"
              id="searchBtn"
              aria-label="Axtar">
        ⌕
      </button>

      <button class="icon-btn"
              id="refreshBtn"
              aria-label="Yenilə">
        ◎
      </button>

    </div>

  </header>

  <!-- CREATE MODAL -->
  <div class="modal" id="createModal">

    <div class="sheet">

      <div class="sheetHeader">

        <div class="handle"></div>

        <div class="sheetTitle">
          🌍 Dünyaya obyekt yerləşdir
        </div>

        <button class="closeBtn"
                id="closeCreate">
          ×
        </button>

      </div>

      <div class="sheetBody">

        <div class="formGrid">

          <div class="field full">
            <label>Başlıq</label>
            <input id="postTitle"
                   class="input"
                   placeholder="Məsələn: Satılır — Mercedes">
          </div>

          <div class="field">
            <label>Kateqoriya</label>

            <select id="postType"
                    class="select">

              <option value="general">📍 Ümumi</option>
              <option value="car">🚗 Avtomobil</option>
              <option value="business">🏪 Mağaza / Biznes</option>
              <option value="service">🛠️ Xidmət</option>
              <option value="tourism">🏔️ Turizm</option>
              <option value="warning">⚠️ Xəbərdarlıq</option>
              <option value="person">👤 İnsan</option>

            </select>
          </div>

          <div class="field">
            <label>Radius, metr</label>

            <input id="postRadius"
                   class="input"
                   type="number"
                   min="1"
                   max="10000"
                   value="300">
          </div>

          <div class="field full">
            <label>Açıqlama</label>

            <textarea id="postDesc"
                      class="textarea"
                      placeholder="Bu obyekt haqqında məlumat..."></textarea>
          </div>

          <div class="field full">
            <label>Telefon</label>

            <input id="postPhone"
                   class="input"
                   type="tel"
                   placeholder="+994 50 000 00 00">
          </div>

          <div class="field">
            <label>Enlik (Latitude)</label>

            <input id="postLat"
                   class="input"
                   type="number"
                   step="any"
                   placeholder="40.4093">
          </div>

          <div class="field">
            <label>Uzunluq (Longitude)</label>

            <input id="postLng"
                   class="input"
                   type="number"
                   step="any"
                   placeholder="49.8671">
          </div>

          <div class="field full">

            <label>
              📍 Yerləşmə
            </label>

            <div class="gpsRow">

              <button type="button"
                      class="actionBtn"
                      id="currentGps">
                📍 Cari GPS
              </button>

              <button type="button"
                      class="actionBtn"
                      id="mapPick">
                🗺️ Xəritədə seç
              </button>

            </div>

          </div>

          <div class="field full">

            <label>
              Şəkil / video
            </label>

            <div class="fileBox">

              <input id="mediaFile"
                     type="file"
                     accept="image/*,video/*">

              <img id="imagePreview"
                   class="mediaPreview">

              <video id="videoPreview"
                     class="mediaPreview"
                     controls
                     playsinline></video>

            </div>

          </div>

          <div class="field">

            <label>Müddət</label>

            <select id="postExpiry"
                    class="select">

              <option value="0">
                Müddətsiz
              </option>

              <option value="1">
                1 saat
              </option>

              <option value="24">
                24 saat
              </option>

              <option value="72">
                3 gün
              </option>

              <option value="168">
                7 gün
              </option>

            </select>

          </div>

        </div>

      </div>

      <div class="bottomActions">

        <button type="button"
                class="placeBtn"
                id="placeBtn">
          📍 YERLƏŞDİR
        </button>

      </div>

    </div>

  </div>

  <!-- DETAIL MODAL -->
  <div class="modal" id="detailModal">

    <div class="sheet detailSheet">

      <div class="sheetHeader">

        <div class="handle"></div>

        <div class="sheetTitle">
          Obyekt
        </div>

        <button class="closeBtn"
                id="closeDetail">
          ×
        </button>

      </div>

      <div class="detailBody"
           id="detailBody">
      </div>

    </div>

  </div>

  <!-- PROFILE MODAL -->
  <div class="modal" id="profileModal">

    <div class="sheet">

      <div class="sheetHeader">

        <div class="handle"></div>

        <div class="sheetTitle">
          Profil
        </div>

        <button class="closeBtn"
                id="closeProfile">
          ×
        </button>

      </div>

      <div class="sheetBody">

        <div class="field">

          <label>Ad</label>

          <input id="profileNameInput"
                 class="input"
                 placeholder="Adınız">

        </div>

        <div class="field">

          <label>Bio</label>

          <textarea id="profileBioInput"
                    class="textarea"
                    placeholder="Haqqınızda..."></textarea>

        </div>

      </div>

      <div class="bottomActions">

        <button class="placeBtn"
                id="saveProfile">
          PROFİLİ SAXLA
        </button>

      </div>

    </div>

  </div>

  <!-- LOADING -->

  <div class="loading"
       id="loading">

    <div class="loaderBox">

      <div class="spinner"></div>

      <div id="loadingText">
        Gözləyin...
      </div>

    </div>

  </div>

  <!-- TOAST -->

  <div id="toast"></div>

  <!-- BOTTOM NAV -->

  <nav class="bottomNav">

    <button class="navBtn active"
            data-view="ar">
      <div class="ico">◎</div>
      <span>Scan</span>
    </button>

    <button class="navBtn"
            data-view="map">
      <div class="ico">⌖</div>
      <span>Xəritə</span>
    </button>

            id="addButton">

    </button>

            data-view="feed">

      <span>Lent</span>
    </button>

    <button class="navBtn"
            data-view="profile">

      <span>Profil</span>
    </button>

  </nav>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   ARWORLD
   SINGLE FILE MOBILE SPATIAL SOCIAL PROTOTYPE
========================================================= */

const $ = id => document.getElementById(id);

let db = null;
let posts = [];
let profile = {
  name:"ARWORLD istifadəçisi",
  bio:"Fiziki dünyada rəqəmsal iz burax."
};

let userLat = null;
let userLng = null;
let userAccuracy = null;

let heading = 0;
let cameraStream = null;
let map = null;
let mapMarkers = [];

let selectedMedia = null;
let selectedMediaType = null;

let activeView = "ar";

/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2800);
}


/* =========================================================
   LOADING
========================================================= */

function loading(show,text="Gözləyin..."){

  $("loadingText").textContent = text;

  if(show)
    $("loading").classList.add("show");
  else
    $("loading").classList.remove("show");
}


/* =========================================================
   INDEXED DB
========================================================= */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open("ARWORLD_DATABASE_V2",1);

    request.onupgradeneeded = event => {

      const database = event.target.result;

      if(!database.objectStoreNames.contains("posts")){

        database.createObjectStore(
          "posts",
          {keyPath:"id"}
        );

      }

      if(!database.objectStoreNames.contains("profile")){

        database.createObjectStore(
          "profile",
          {keyPath:"id"}
        );

      }

    };

    request.onsuccess = event => {

      db = event.target.result;

      resolve();

    };

    request.onerror = () => reject(request.error);

  });

}


function savePost(post){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction("posts","readwrite");

    tx.objectStore("posts").put(post);

    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);

  });

}


function getPosts(){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction("posts","readonly");

    const request =
      tx.objectStore("posts").getAll();

    request.onsuccess =
      () => resolve(request.result || []);

    request.onerror =
      () => reject(request.error);

  });

}


function saveProfile(){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction("profile","readwrite");

    tx.objectStore("profile").put({
      id:"me",
      ...profile
    });

    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);

  });

}


function getProfile(){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction("profile","readonly");

    const request =
      tx.objectStore("profile").get("me");

    request.onsuccess =
      () => resolve(request.result || null);

    request.onerror =
      () => reject(request.error);

  });

}


/* =========================================================
   INITIALIZATION
========================================================= */

async function init(){

  try{

    await openDB();

    const savedProfile =
      await getProfile();

    if(savedProfile){

      profile = savedProfile;

    }

    posts = await getPosts();

    cleanExpired();

    updateProfileUI();

    startGPS();

    startCompass();

    startCamera();

    renderFeed();

  }catch(error){

    console.error(error);

    toast("Sistem başladılarkən xəta baş verdi.");

  }

}


function cleanExpired(){

  const now = Date.now();

  posts = posts.filter(post=>{

    if(!post.expiresAt)
      return true;

    return post.expiresAt > now;

  });

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    toast("Bu brauzer kamera girişini dəstəkləmir.");

    return;

  }

  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            ideal:"environment"
          }
        },
        audio:false
      });

    $("camera").srcObject =
      cameraStream;

  }catch(error){

    console.error(error);

    toast(
      "Kamera açılmadı. HTTPS və kamera icazəsini yoxlayın."
    );

  }

}


/* =========================================================
   GPS
========================================================= */

function startGPS(){

  if(!navigator.geolocation){

    $("gpsStatus").textContent =
      "GPS yoxdur";

    return;

  }

  navigator.geolocation.watchPosition(

    position=>{

      userLat =
        position.coords.latitude;

      userLng =
        position.coords.longitude;

      userAccuracy =
        position.coords.accuracy;

      $("gpsStatus").textContent =
        "GPS ±" +
        Math.round(userAccuracy) +
        "m";

      updateAR();

      updateMapUser();

    },

    error=>{

      console.warn(error);

      $("gpsStatus").textContent =
        "GPS icazəsi lazımdır";

    },

    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:15000
    }

  );

}


/* =========================================================
   COMPASS
========================================================= */

function startCompass(){

  window.addEventListener(
    "deviceorientationabsolute",
    handleOrientation,
    true
  );

  window.addEventListener(
    "deviceorientation",
    handleOrientation,
    true
  );

}


function handleOrientation(event){

  let h = null;

  if(
    typeof event.webkitCompassHeading ===
    "number"
  ){

    h = event.webkitCompassHeading;

  }else if(
    typeof event.alpha === "number"
  ){

    h = 360 - event.alpha;

  }

  if(h === null)
    return;

  heading =
    (h + 360) % 360;

  $("compassStatus").textContent =
    "Kompas " +
    Math.round(heading) +
    "°";

  updateAR();

}


/* =========================================================
   GEO MATH
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dp =
    (lat2-lat1) *
    Math.PI / 180;

  const dl =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dp/2) ** 2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl/2) ** 2;

  return 2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


function bearingTo(
  lat1,
  lon1,
  lat2,
  lon2
){

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dl =
    (lon2-lon1) *
    Math.PI / 180;

  const y =
    Math.sin(dl) * Math.cos(p2);

  const x =
    Math.cos(p1) *
    Math.sin(p2) -
    Math.sin(p1) *
    Math.cos(p2) *
    Math.cos(dl);

  return (
    Math.atan2(y,x) *
    180 / Math.PI +
    360
  ) % 360;

}


function angleDifference(a,b){

  return (
    (a-b+540)%360
  ) - 180;

}


/* =========================================================
   AR RENDER
========================================================= */

function updateAR(){

  const container =
    $("arObjects");

  if(!container)
    return;

  container.innerHTML = "";

  if(userLat === null ||
     userLng === null)
    return;

  cleanExpired();

  posts.forEach(post=>{

    const distance =
      distanceMeters(
        userLat,
        userLng,
        post.lat,
        post.lng
      );

    const radius =
      Number(post.radius || 300);

    if(distance > radius)
      return;

    const bearing =
      bearingTo(
        userLat,
        userLng,
        post.lat,
        post.lng
      );

    const diff =
      angleDifference(
        bearing,
        heading
      );

    /*
      Web AR approximation:
      - horizontal position from compass
      - vertical position from distance
    */

    if(Math.abs(diff) > 75)
      return;

    const x =
      50 +
      (diff / 75) * 43;

    const y =
      Math.min(
        72,
        Math.max(
          25,
          34 + distance / Math.max(radius,1) * 34
        )
      );

    const card =
      document.createElement("div");

    card.className =
      "ar-card";

    card.style.left =
      x + "%";

    card.style.top =
      y + "%";

    card.innerHTML = `

      <div class="ar-title">
        ${escapeHTML(post.title)}
      </div>

      <div class="ar-meta">
        ${typeName(post.type)}
        · ${Math.round(distance)} m
      </div>

      <div class="ar-desc">
        ${escapeHTML(
          (post.desc || "").slice(0,100)
        )}
      </div>

      <div class="ar-distance">
        ${Math.round(bearing)}°
        · ${formatDistance(distance)}
      </div>

      <button class="ar-open">
        Aç
      </button>

    `;

    card.querySelector(".ar-open")
      .addEventListener("click",()=>{

        openDetail(post);

      });

    container.appendChild(card);

  });

}


/* =========================================================
   CREATE OBJECT
========================================================= */

function openCreate(){

  resetCreateForm();

  $("createModal")
    .classList.add("show");

}


function closeCreate(){

  $("createModal")
    .classList.remove("show");

}


function resetCreateForm(){

  $("postTitle").value = "";
  $("postDesc").value = "";
  $("postPhone").value = "";
  $("postLat").value =
    userLat !== null ? userLat.toFixed(6) : "";
  $("postLng").value =
    userLng !== null ? userLng.toFixed(6) : "";
  $("postRadius").value = 300;
  $("postType").value = "general";
  $("postExpiry").value = "0";

  selectedMedia = null;
  selectedMediaType = null;

  $("imagePreview").style.display =
    "none";

  $("videoPreview").style.display =
    "none";

  $("imagePreview").src = "";
  $("videoPreview").src = "";

}


$("currentGps").addEventListener(
  "click",
  getCurrentGPS
);


function getCurrentGPS(){

  if(!navigator.geolocation){

    toast("Bu cihaz GPS-i dəstəkləmir.");

    return;

  }

  toast("GPS koordinatı alınır...");

  navigator.geolocation.getCurrentPosition(

    position=>{

      userLat =
        position.coords.latitude;

      userLng =
        position.coords.longitude;

      userAccuracy =
        position.coords.accuracy;

      $("postLat").value =
        userLat.toFixed(7);

      $("postLng").value =
        userLng.toFixed(7);

      $("gpsStatus").textContent =
        "GPS ±" +
        Math.round(userAccuracy) +
        "m";

      toast(
        "📍 Cari GPS koordinatı götürüldü"
      );

    },

    error=>{

      console.error(error);

      toast(
        "GPS alınmadı. Telefonun məkan icazəsini açın."
      );

    },

    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:15000
    }

  );

}


/* =========================================================
   MEDIA
========================================================= */

$("mediaFile").addEventListener(
  "change",
  handleMedia
);


function handleMedia(event){

  const file =
    event.target.files[0];

  if(!file)
    return;

  if(file.size > 20 * 1024 * 1024){

    toast(
      "Fayl maksimum 20 MB ola bilər."
    );

    event.target.value = "";

    return;

  }

  const reader =
    new FileReader();

  reader.onload = ()=>{

    selectedMedia =
      reader.result;

    selectedMediaType =
      file.type.startsWith("video")
        ? "video"
        : "image";

    if(selectedMediaType === "image"){

      $("imagePreview").src =
        selectedMedia;

      $("imagePreview").style.display =
        "block";

      $("videoPreview").style.display =
        "none";

    }else{

      $("videoPreview").src =
        selectedMedia;

      $("videoPreview").style.display =
        "block";

      $("imagePreview").style.display =
        "none";

    }

  };

  reader.readAsDataURL(file);

}


/* =========================================================
   PLACE
========================================================= */

$("placeBtn").addEventListener(
  "click",
  placeObject
);


async function placeObject(){

  const title =
    $("postTitle").value.trim();

  const desc =
    $("postDesc").value.trim();

  const lat =
    parseFloat($("postLat").value);

  const lng =
    parseFloat($("postLng").value);

  const radius =
    parseInt($("postRadius").value) || 300;

  const type =
    $("postType").value;

  const phone =
    $("postPhone").value.trim();

  const expiryHours =
    parseInt($("postExpiry").value) || 0;


  /* VALIDATION */

  if(!title){

    toast(
      "Əvvəlcə obyektə başlıq yazın."
    );

    $("postTitle").focus();

    return;

  }

  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng) ||
    lat < -90 ||
    lat > 90 ||
    lng < -180 ||
    lng > 180
  ){

    toast(
      "📍 Düzgün GPS koordinatı seçilməyib."
    );

    return;

  }


  if(radius < 1){

    toast(
      "Radius minimum 1 metr olmalıdır."
    );

    return;

  }


  loading(
    true,
    "Obyekt yerləşdirilir..."
  );


  try{

    let expiresAt = 0;

    if(expiryHours > 0){

      expiresAt =
        Date.now() +
        expiryHours * 60 * 60 * 1000;

    }


    const post = {

      id:
        "post_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2),

      title,

      type,

      desc,

      phone,

      lat,

      lng,

      radius,

      expiresAt,

      media:
        selectedMedia || null,

      mediaType:
        selectedMediaType || null,

      author:
        profile.name,

      createdAt:
        Date.now()

    };


    await savePost(post);


    posts.push(post);


    /* UPDATE EVERYTHING */

    updateAR();

    renderFeed();

    renderMapMarkers();


    /* CLOSE PANEL */

    $("createModal")
      .classList.remove("show");


    loading(false);


    toast(
      "✅ Obyekt real olaraq yerləşdirildi!"
    );


    /*
      If user is currently looking at
      the location, AR will update.
    */

    setTimeout(()=>{
      updateAR();
    },300);


  }catch(error){

    console.error(error);

    loading(false);

    toast(
      "Obyekti yadda saxlamaq mümkün olmadı."
    );

  }

}


/* =========================================================
   DETAIL
========================================================= */

function openDetail(post){

  const body =
    $("detailBody");

  let mediaHTML = "";

  if(post.media){

    if(post.mediaType === "video"){

      mediaHTML = `
        <video
          class="detailMedia"
          controls
          playsinline
          src="${post.media}">
        </video>
      `;

    }else{

      mediaHTML = `
        <img
          class="detailMedia"
          src="${post.media}">
      `;

    }

  }


  let callButton = "";

  if(post.phone){

    callButton = `
      <button
        class="detailBtn primary"
        onclick="callNumber('${escapeAttribute(post.phone)}')">
        ☎️ Zəng et
      </button>
    `;

  }else{

    callButton = `
      <button
        class="detailBtn"
        disabled>
        Telefon yoxdur
      </button>
    `;

  }


  body.innerHTML = `

    ${mediaHTML}

    <div class="detailTitle">
      ${escapeHTML(post.title)}
    </div>

    <div class="feedMeta">
      ${typeName(post.type)}
      · ${formatCoordinates(post.lat,post.lng)}
    </div>

    <div class="detailText">
      ${escapeHTML(post.desc || "Açıqlama yoxdur.")}
    </div>

    <div class="detailActions">

      ${callButton}

      <button
        class="detailBtn primary"
        onclick="openRoute(${post.lat},${post.lng})">
        🧭 Marşrut
      </button>

    </div>

  `;

  $("detailModal")
    .classList.add("show");

}


function closeDetail(){

  $("detailModal")
    .classList.remove("show");

}


window.callNumber =
function(phone){

  window.location.href =
    "tel:" +
    phone.replace(/[^\d+]/g,"");

};


window.openRoute =
function(lat,lng){

  const url =
    "https://www.google.com/maps/dir/?api=1&destination=" +
    encodeURIComponent(lat + "," + lng);

  window.open(url,"_blank");

};


/* =========================================================
   FEED
========================================================= */

function renderFeed(){

  const list =
    $("feedList");

  list.innerHTML = "";

  cleanExpired();

  if(posts.length === 0){

    list.innerHTML = `

      <div class="profileBox">

        <div style="font-size:42px">
          🌍
        </div>

        <h3>
          Hələ obyekt yoxdur
        </h3>

        <div class="profileBio">
          ＋ düyməsinə basaraq fiziki dünyaya
          ilk rəqəmsal obyektini yerləşdir.
        </div>

      </div>

    `;

    return;

  }


  const sorted =
    [...posts]
      .sort(
        (a,b)=>
          b.createdAt -
          a.createdAt
      );


  sorted.forEach(post=>{

    let media = "";

    if(post.media &&
       post.mediaType === "image"){

      media = `
        <img
          class="feedMedia"
          src="${post.media}">
      `;

    }

    if(post.media &&
       post.mediaType === "video"){

      media = `
        <video
          class="feedMedia"
          controls
          playsinline
          src="${post.media}">
        </video>
      `;

    }


    const card =
      document.createElement("div");

    card.className =
      "feedCard";

    card.innerHTML = `

      ${media}

      <div class="feedBody">

        <div class="feedTitle">
          ${escapeHTML(post.title)}
        </div>

        <div class="feedMeta">
          ${typeName(post.type)}
        </div>

        <div class="feedDesc">
          ${escapeHTML(
            post.desc || ""
          )}
        </div>

        <button
          class="actionBtn"
          style="width:100%;margin-top:12px">
          📍 AR-da aç
        </button>

      </div>

    `;

    card.querySelector("button")
      .addEventListener(
        "click",
        ()=>{
          switchView("ar");
          openDetail(post);
        }
      );

    list.appendChild(card);

  });

}


/* =========================================================
   MAP
========================================================= */

function initMap(){

  if(map)
    return;

  map =
    L.map("map")
      .setView(
        [
          userLat || 40.4093,
          userLng || 49.8671
        ],
        15
      );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);

  renderMapMarkers();

}


function updateMapUser(){

  if(!map)
    return;

  map.setView(
    [userLat,userLng],
    map.getZoom()
  );

}


function renderMapMarkers(){

  if(!map)
    return;

  mapMarkers.forEach(
    marker=>marker.remove()
  );

  mapMarkers = [];


  posts.forEach(post=>{

    const marker =
      L.marker([
        post.lat,
        post.lng
      ]).addTo(map);

    marker.bindPopup(`

      <b>
        ${escapeHTML(post.title)}
      </b>

      <br>

      ${typeName(post.type)}

      <br><br>

      <button
        onclick='window.openPostFromMap("${post.id}")'>
        Aç
      </button>

    `);

    mapMarkers.push(marker);

  });


  if(
    userLat !== null &&
    userLng !== null
  ){

    const userMarker =
      L.circleMarker(
        [userLat,userLng],
        {
          radius:8,
          color:"#42d9ff",
          fillColor:"#42d9ff",
          fillOpacity:.8
        }
      ).addTo(map);

    userMarker.bindPopup(
      "📍 Sizin mövqeyiniz"
    );

    mapMarkers.push(userMarker);

  }

}


window.openPostFromMap =
function(id){

  const post =
    posts.find(p=>p.id===id);

  if(post)
    openDetail(post);

};


/* =========================================================
   VIEW NAVIGATION
========================================================= */

function switchView(view){

  activeView = view;


  document.querySelectorAll(
    ".view"
  ).forEach(v=>{
    v.classList.remove("active");
  });


  if(view === "ar"){

    $("cameraView").style.display =
      "block";

  }else{

    $("cameraView").style.display =
      "none";

    if(view === "map"){

      $("mapView")
        .classList.add("active");

      setTimeout(()=>{

        initMap();

        if(map)
          map.invalidateSize();

      },100);

    }

    if(view === "feed"){

      $("feedView")
        .classList.add("active");

      renderFeed();

    }

    if(view === "profile"){

      $("profileView")
        .classList.add("active");

    }

  }


  document.querySelectorAll(
    ".navBtn[data-view]"
  ).forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.view === view
    );

  });


  if(view === "ar"){

    updateAR();

  }

}


/* =========================================================
   NAV BUTTONS
========================================================= */

document.querySelectorAll(
  ".navBtn[data-view]"
).forEach(btn=>{

  btn.addEventListener(
    "click",
    ()=>{
      switchView(btn.dataset.view);
    }
  );

});


$("addButton")
  .addEventListener(
    "click",
    openCreate
  );


$("closeCreate")
  .addEventListener(
    "click",
    closeCreate
  );


$("closeDetail")
  .addEventListener(
    "click",
    closeDetail
  );


$("closeProfile")
  .addEventListener(
    "click",
    ()=>{
      $("profileModal")
        .classList.remove("show");
    }
  );


/* Clicking backdrop closes modal */

$("createModal")
  .addEventListener(
    "click",
    e=>{
      if(e.target === $("createModal"))
        closeCreate();
    }
  );


$("detailModal")
  .addEventListener(
    "click",
    e=>{
      if(e.target === $("detailModal"))
        closeDetail();
    }
  );


$("profileModal")
  .addEventListener(
    "click",
    e=>{
      if(e.target === $("profileModal"))
        $("profileModal")
          .classList.remove("show");
    }
  );


/* =========================================================
   PROFILE
========================================================= */

function updateProfileUI(){

  $("profileName").textContent =
    profile.name;

  $("profileBio").textContent =
    profile.bio;

  $("avatarLetter").textContent =
    (profile.name || "A")
      .charAt(0)
      .toUpperCase();

}


$("editProfileBtn")
  .addEventListener(
    "click",
    ()=>{

      $("profileNameInput").value =
        profile.name;

      $("profileBioInput").value =
        profile.bio;

      $("profileModal")
        .classList.add("show");

    }
  );


$("saveProfile")
  .addEventListener(
    "click",
    async ()=>{

      const name =
        $("profileNameInput")
          .value
          .trim();

      const bio =
        $("profileBioInput")
          .value
          .trim();

      if(!name){

        toast(
          "Ad boş ola bilməz."
        );

        return;

      }

      profile.name =
        name;

      profile.bio =
        bio;

      await saveProfile();

      updateProfileUI();

      $("profileModal")
        .classList.remove("show");

      toast(
        "✅ Profil yadda saxlanıldı."
      );

    }
  );


/* =========================================================
   SEARCH
========================================================= */

$("searchBtn")
  .addEventListener(
    "click",
    ()=>{

      const box =
        $("searchBox");

      box.classList.toggle("show");

      if(box.classList.contains("show")){

        $("searchInput").focus();

      }else{

        $("searchInput").value = "";

      }

    }
  );


$("searchInput")
  .addEventListener(
    "input",
    ()=>{
      updateSearch(
        $("searchInput").value
      );
    }
  );


function updateSearch(query){

  query =
    query
      .trim()
      .toLowerCase();

  const container =
    $("arObjects");

  container.innerHTML = "";

  if(userLat === null ||
     userLng === null)
    return;


  posts
    .filter(post=>{

      if(!query)
        return true;

      return (
        post.title
          .toLowerCase()
          .includes(query) ||

        (post.desc || "")
          .toLowerCase()
          .includes(query) ||

        typeName(post.type)
          .toLowerCase()
          .includes(query)
      );

    })
    .forEach(post=>{

      const distance =
        distanceMeters(
          userLat,
          userLng,
          post.lat,
          post.lng
        );

      if(
        distance >
        Number(post.radius || 300)
      )
        return;

      const bearing =
        bearingTo(
          userLat,
          userLng,
          post.lat,
          post.lng
        );

      const diff =
        angleDifference(
          bearing,
          heading
        );

      if(Math.abs(diff)>85)
        return;


      const x =
        50 + diff / 85 * 43;

      const card =
        document.createElement("div");

      card.className =
        "ar-card";

      card.style.left =
        x + "%";

      card.style.top =
        "45%";

      card.innerHTML = `

        <div class="ar-title">
          ${escapeHTML(post.title)}
        </div>

        <div class="ar-meta">
          ${typeName(post.type)}
          · ${formatDistance(distance)}
        </div>

        <button class="ar-open">
          Aç
        </button>

      `;

      card.querySelector(".ar-open")
        .onclick =
        ()=>openDetail(post);

      container.appendChild(card);

    });

}

/* =========================================================
   HELPERS
========================================================= */

function typeName(type){

  const names = {

    general:"📍 Ümumi",

    car:"🚗 Avtomobil",

    business:"🏪 Biznes",

    service:"🛠️ Xidmət",

    tourism:"🏔️ Turizm",

    warning:"⚠️ Xəbərdarlıq",

    person:"👤 İnsan"

  };

  return names[type] || "📍 Obyekt";

}


function formatDistance(m){

  if(m < 1000)
    return Math.round(m) + " m";

  return (
    m / 1000
  ).toFixed(1) + " km";

}


function formatCoordinates(lat,lng){

  return (
    Number(lat).toFixed(5) +
    ", " +
    Number(lng).toFixed(5)
  );

}


function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return String(value || "")
    .replaceAll("'","%27")
    .replaceAll('"',"%22");

}
