<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>AZAvatar AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050507;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:540px;
  height:100dvh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% -10%,#49307c 0,transparent 35%),
    linear-gradient(180deg,#09090e,#050507);
}

/* HEADER */

.header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:50;
  height:65px;
  padding:14px 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(#050507cc,transparent);
}

.logo{
  font-size:22px;
  font-weight:950;
  letter-spacing:-1px;
}

.logo b{
  color:#9d7cff;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:10px;
  color:#aaa;
  background:#ffffff09;
  border:1px solid #ffffff12;
  padding:7px 10px;
  border-radius:20px;
  backdrop-filter:blur(15px);
}

.dot{
  width:6px;
  height:6px;
  background:#69ffae;
  border-radius:50%;
  box-shadow:0 0 10px #69ffae;
}

/* STAGE */

.stage{
  position:absolute;
  left:10px;
  right:10px;
  top:63px;
  bottom:205px;
  overflow:hidden;
  border-radius:30px;
  border:1px solid #ffffff14;
  background:#0b0b10;
  box-shadow:
    0 25px 70px #000b,
    inset 0 0 50px #ffffff05;
}

#canvas{
  width:100%;
  height:100%;
  display:block;
}

.stageTop{
  position:absolute;
  left:15px;
  right:15px;
  top:14px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.badge{
  padding:7px 10px;
  border-radius:20px;
  background:#0008;
  border:1px solid #ffffff14;
  backdrop-filter:blur(10px);
  color:#ddd;
  font-size:9px;
  font-weight:800;
  letter-spacing:.5px;
}

.scan{
  display:none;
  padding:7px 10px;
  border-radius:20px;
  background:#8d6cff22;
  border:1px solid #9b80ff;
  font-size:9px;
  color:#d9ceff;
}

.scan.show{
  display:block;
}

/* EMPTY */

.empty{
  position:absolute;
  inset:0;
  z-index:15;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:25px;
  background:
    radial-gradient(circle at center,#21184466,transparent 50%);
}

.emptyIcon{
  width:80px;
  height:80px;
  display:grid;
  place-items:center;
  border-radius:26px;
  background:#ffffff0c;
  border:1px solid #ffffff15;
  font-size:34px;
  margin-bottom:17px;
}

.empty h2{
  margin:0 0 7px;
  font-size:20px;
}

.empty p{
  margin:0;
  color:#888;
  font-size:12px;
}

.uploadButtons{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.uploadBtn{
  border:1px solid #ffffff16;
  color:white;
  background:#ffffff0b;
  border-radius:15px;
  padding:11px 15px;
  font-size:12px;
  font-weight:700;
}

.uploadBtn.primary{
  background:linear-gradient(135deg,#9575ff,#6746dc);
  border:0;
}

/* CONTROLS */

.controls{
  position:absolute;
  left:10px;
  right:10px;
  bottom:0;
  height:197px;
  z-index:40;
  padding:6px 4px 12px;
}

.messageBox{
  height:49px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px;
  border-radius:17px;
  border:1px solid #ffffff13;
  background:#ffffff08;
  backdrop-filter:blur(20px);
}

#message{
  flex:1;
  min-width:0;
  height:38px;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  resize:none;
  padding:10px;
  font-size:13px;
}

#message::placeholder{
  color:#777;
}

.play{
  width:42px;
  height:39px;
  border:0;
  border-radius:13px;
  background:#8c6bff;
  color:#fff;
  font-size:17px;
}

.horizontal{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:7px 0;
}

.horizontal::-webkit-scrollbar{
  display:none;
}

.chip{
  flex:0 0 auto;
  color:#aaa;
  background:#ffffff07;
  border:1px solid #ffffff10;
  padding:8px 12px;
  border-radius:18px;
  font-size:10px;
  white-space:nowrap;
}

.chip.active{
  color:white;
  background:#8c6bff22;
  border-color:#8c6bff;
}

/* ACTIONS */

.actions{
  display:flex;
  gap:7px;
}

.generate{
  flex:1;
  height:45px;
  border:0;
  border-radius:15px;
  color:#fff;
  font-weight:900;
  font-size:12px;
  background:linear-gradient(135deg,#9575ff,#6645dd);
  box-shadow:0 10px 30px #7959ff30;
}

.rec{
  width:48px;
  height:45px;
  border-radius:15px;
  border:1px solid #ffffff13;
  background:#ffffff08;
  color:white;
  font-size:18px;
}

.rec.active{
  background:#ff315022;
  border-color:#ff3150;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    box-shadow:0 0 0 7px #ff315018;
  }
}

/* SHARE */

.share{
  position:absolute;
  left:15px;
  right:15px;
  bottom:15px;
  z-index:100;
  padding:16px;
  border-radius:23px;
  background:#15151eee;
  border:1px solid #ffffff17;
  backdrop-filter:blur(25px);
  box-shadow:0 20px 70px #000c;
  display:none;
}

.share.show{
  display:block;
}

.shareTitle{
  font-size:15px;
  font-weight:900;
  margin-bottom:11px;
}

.shareButtons{
  display:flex;
  gap:7px;
}

.shareBtn{
  flex:1;
  height:43px;
  border:0;
  border-radius:14px;
  background:#ffffff0c;
  color:white;
  font-size:12px;
  font-weight:700;
}

.shareBtn.main{
  background:#8b69ff;
}

.close{
  width:100%;
  height:34px;
  margin-top:8px;
  border:0;
  background:#ffffff06;
  border-radius:12px;
  color:#888;
  font-size:11px;
}

/* LOADER */

.loader{
  position:absolute;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#050507e8;
  backdrop-filter:blur(15px);
}

.loader.show{
  display:flex;
}

.spinner{
  width:43px;
  height:43px;
  border:3px solid #ffffff15;
  border-top-color:#9a7cff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loaderText{
  margin-top:14px;
  font-size:13px;
  color:#aaa;
}

/* TOAST */

.toast{
  position:absolute;
  z-index:300;
  left:50%;
  bottom:210px;
  transform:translate(-50%,20px);
  background:#17171d;
  border:1px solid #ffffff15;
  padding:10px 15px;
  border-radius:20px;
  font-size:11px;
  color:white;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* HIDDEN */

#file{
  display:none;
}

#camera{
  display:none;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">AZ<b>Avatar</b></div>

  <div class="status">
    <span class="dot"></span>
    AI AVATAR
  </div>
</header>


<section class="stage">

  <canvas id="canvas"></canvas>

  <div class="stageTop">
    <div class="badge">✨ AI AVATAR STUDIO</div>
    <div id="scan" class="scan">FACE SCAN</div>
  </div>


  <div id="empty" class="empty">

    <div class="emptyIcon">✦</div>

    <h2>Avatarını yarat</h2>

    <p>Şəkil seç və onu danışan avatara çevir</p>

    <div class="uploadButtons">

      <button class="uploadBtn primary" onclick="openFile()">
        📷 Şəkil seç
      </button>

      <button class="uploadBtn" onclick="openCamera()">
        🤳 Selfie
      </button>

    </div>

  </div>

</section>


<section class="controls">

  <div class="messageBox">

    <textarea
      id="message"
      maxlength="140"
      placeholder="Avatarın nə desin?"
    ></textarea>

    <button class="play" onclick="speak()">▶</button>

  </div>


  <div class="horizontal">

    <button class="chip" onclick="template('Salam! Səni görməyə çox şadam ❤️')">
      ❤️ Salam
    </button>

    <button class="chip" onclick="template('Ad günün mübarək! 🎂🎉')">
      🎂 Ad günü
    </button>

    <button class="chip" onclick="template('Səni gözləyirəm! 😎')">
      😎 Gözləyirəm
    </button>

    <button class="chip" onclick="template('Bu gün əla gün olacaq! 🔥')">
      🔥 Motivasiya
    </button>

    <button class="chip" onclick="template('Mənə bax! 😂')">
      😂 Gülməli
    </button>

  </div>


  <div class="horizontal">

    <button class="chip active" data-style="cinema">
      🎬 Cinema
    </button>

    <button class="chip" data-style="football">
      ⚽ Football
    </button>

    <button class="chip" data-style="king">
      👑 King
    </button>

    <button class="chip" data-style="hero">
      🦸 Hero
    </button>

    <button class="chip" data-style="robot">
      🤖 Robot
    </button>

  </div>


  <div class="actions">

    <button class="generate" onclick="speak()">
      ✨ AVATARI DANIŞDIR
    </button>

    <button
      id="record"
      class="rec"
      onclick="recordVideo()"
    >●</button>

  </div>

</section>


<div id="share" class="share">

  <div class="shareTitle">
    🎉 Avatar videon hazırdır
  </div>

  <div class="shareButtons">

    <button class="shareBtn main" onclick="shareVideo()">
      📤 Paylaş
    </button>

    <button class="shareBtn" onclick="downloadVideo()">
      ⬇️ Yadda saxla
    </button>

  </div>

  <button class="close" onclick="closeShare()">
    Bağla
  </button>

</div>


<div id="loader" class="loader">

  <div class="spinner"></div>

  <div id="loaderText" class="loaderText">
    Üz analiz edilir...
  </div>

</div>


<div id="toast" class="toast"></div>


<input
  id="file"
  type="file"
  accept="image/*"
>

<video
  id="camera"
  playsinline
  muted
></video>

</div>


<script type="module">

/* =========================================================
   MEDIAPIPE
========================================================= */

import {
  FilesetResolver,
  FaceLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm";


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const file =
  document.getElementById("file");

const camera =
  document.getElementById("camera");

const empty =
  document.getElementById("empty");

const scan =
  document.getElementById("scan");

const loader =
  document.getElementById("loader");

const loaderText =
  document.getElementById("loaderText");

const message =
  document.getElementById("message");

const toast =
  document.getElementById("toast");

const share =
  document.getElementById("share");

const recordButton =
  document.getElementById("record");


/* =========================================================
   STATE
========================================================= */

canvas.width=720;
canvas.height=1280;

let img=null;

let currentStyle="cinema";

let faceLandmarker=null;

let face=null;

let faceReady=false;

let speaking=false;

let words=[];

let wordIndex=0;

let wordStart=0;

let lastVideo=null;

let recorder=null;

let chunks=[];

let animationFrame=0;

let cameraStream=null;


/* =========================================================
   FILE
========================================================= */

window.openFile=()=>{
  file.click();
};


file.addEventListener("change",async e=>{

  const f=e.target.files[0];

  if(!f) return;

  const reader=new FileReader();

  reader.onload=async()=>{

    img=new Image();

    img.onload=async()=>{

      empty.style.display="none";

      await analyzeFace();

      draw();

    };

    img.src=reader.result;

  };

  reader.readAsDataURL(f);

});


/* =========================================================
   CAMERA
========================================================= */

window.openCamera=async()=>{

  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:720},
          height:{ideal:1280}
        },
        audio:false
      });

    camera.srcObject=cameraStream;

    await camera.play();

    const temp=
      document.createElement("canvas");

    temp.width=camera.videoWidth;
    temp.height=camera.videoHeight;

    const tctx=temp.getContext("2d");

    tctx.drawImage(
      camera,
      0,
      0,
      temp.width,
      temp.height
    );

    const data=temp.toDataURL("image/jpeg",.92);

    img=new Image();

    img.onload=async()=>{

      empty.style.display="none";

      await analyzeFace();

      draw();

      stopCamera();

    };

    img.src=data;

  }catch(e){

    showToast("Kameraya icazə verilmədi");

  }

};


function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(t=>t.stop());

    cameraStream=null;

  }

}


/* =========================================================
   FACE LANDMARKER
========================================================= */

async function initFace(){

  if(faceLandmarker)
    return;

  try{

    loader.classList.add("show");

    loaderText.textContent=
      "AI üz sistemi yüklənir...";

    const vision =
      await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"
      );

    faceLandmarker =
      await FaceLandmarker.createFromOptions(
        vision,
        {
          baseOptions:{
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
          },

          runningMode:"IMAGE",

          numFaces:1,

          minFaceDetectionConfidence:.45,

          minFacePresenceConfidence:.45,

          minTrackingConfidence:.45,

          outputFaceBlendshapes:true,

          outputFacialTransformationMatrixes:true
        }
      );

    loader.classList.remove("show");

  }catch(e){

    console.error(e);

    loader.classList.remove("show");

    showToast(
      "AI üz sistemi yüklənmədi — sadə rejim işləyəcək"
    );

  }

}


/* =========================================================
   ANALYZE
========================================================= */

async function analyzeFace(){

  scan.classList.add("show");

  scan.textContent="FACE SCAN...";

  try{

    await initFace();

    if(!faceLandmarker){

      scan.textContent="SMART MODE";

      return;

    }

    const result =
      faceLandmarker.detect(img);

    if(
      result &&
      result.faceLandmarks &&
      result.faceLandmarks.length
    ){

      face=result.faceLandmarks[0];

      faceReady=true;

      scan.textContent="FACE LOCK ✓";

      setTimeout(
        ()=>scan.classList.remove("show"),
        1500
      );

    }else{

      face=null;

      faceReady=false;

      scan.textContent="FACE NOT FOUND";

      setTimeout(
        ()=>scan.classList.remove("show"),
        1800
      );

    }

  }catch(e){

    console.log(e);

    face=null;

    faceReady=false;

    scan.classList.remove("show");

  }

}


/* =========================================================
   TEMPLATES
========================================================= */

window.template=(text)=>{

  message.value=text;

  speak();

};


/* =========================================================
   STYLE BUTTONS
========================================================= */

document
.querySelectorAll("[data-style]")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    document
    .querySelectorAll("[data-style]")
    .forEach(x=>{
      x.classList.remove("active");
    });

    btn.classList.add("active");

    currentStyle=
      btn.dataset.style;

    draw();

  });

});


/* =========================================================
   SPEAK
========================================================= */

window.speak=()=>{

  if(!img){

    showToast(
      "Əvvəlcə şəkil və ya selfie əlavə et"
    );

    return;

  }

  const text=
    message.value.trim();

  if(!text){

    showToast(
      "Avatarın deyəcəyi mətni yaz"
    );

    return;

  }

  words=
    text
    .replace(/[.,!?;:()[\]{}]/g," ")
    .split(/\s+/)
    .filter(Boolean);

  wordIndex=0;

  wordStart=performance.now();

  speaking=true;

  cancelAnimationFrame(animationFrame);

  animationFrame=
    requestAnimationFrame(loop);

};


/* =========================================================
   ANIMATION LOOP
========================================================= */

function loop(now){

  draw(now);

  if(!speaking)
    return;

  if(
    now-wordStart >
    Math.max(
      380,
      Math.min(
        800,
        words[wordIndex].length*65
      )
    )
  ){

    wordIndex++;

    wordStart=now;

    if(wordIndex>=words.length){

      speaking=false;

      draw();

      return;

    }

  }

  animationFrame=
    requestAnimationFrame(loop);

}


/* =========================================================
   IMAGE COVER
========================================================= */

function drawCover(source){

  const w=canvas.width;
  const h=canvas.height;

  const iw=
    source.naturalWidth ||
    source.videoWidth ||
    source.width;

  const ih=
    source.naturalHeight ||
    source.videoHeight ||
    source.height;

  const scale=
    Math.max(w/iw,h/ih);

  const dw=iw*scale;
  const dh=ih*scale;

  const dx=(w-dw)/2;
  const dy=(h-dh)/2;

  ctx.drawImage(
    source,
    dx,
    dy,
    dw,
    dh
  );

}


/* =========================================================
   DRAW MAIN
========================================================= */

function draw(now=performance.now()){

  const w=canvas.width;
  const h=canvas.height;

  /* BACKGROUND */

  let bg=
    ctx.createLinearGradient(
      0,0,w,h
    );

  if(currentStyle==="football"){

    bg.addColorStop(0,"#03180e");
    bg.addColorStop(.45,"#07512e");
    bg.addColorStop(1,"#010604");

  }else if(currentStyle==="king"){

    bg.addColorStop(0,"#241300");
    bg.addColorStop(.45,"#8a5500");
    bg.addColorStop(1,"#080400");

  }else if(currentStyle==="hero"){

    bg.addColorStop(0,"#071633");
    bg.addColorStop(.5,"#164b91");
    bg.addColorStop(1,"#02050c");

  }else if(currentStyle==="robot"){

    bg.addColorStop(0,"#111820");
    bg.addColorStop(.5,"#334550");
    bg.addColorStop(1,"#030507");

  }else{

    bg.addColorStop(0,"#25164d");
    bg.addColorStop(.5,"#111225");
    bg.addColorStop(1,"#030306");

  }

  ctx.fillStyle=bg;

  ctx.fillRect(0,0,w,h);


  /* LIGHT */

  const glow=
    ctx.createRadialGradient(
      w/2,
      300,
      20,
      w/2,
      350,
      620
    );

  glow.addColorStop(
    0,
    "rgba(158,117,255,.35)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(0,0,w,h);


  if(img){

    /*
      subtle cinematic movement
    */

    const time=now/800;

    const bob=
      speaking
      ? Math.sin(time)*4
      : 0;

    const scaleBoost=
      speaking
      ? 1+Math.sin(time*.7)*.006
      : 1;

    ctx.save();

    ctx.translate(
      w/2,
      h/2+bob
    );

    ctx.scale(
      scaleBoost,
      scaleBoost
    );

    ctx.translate(
      -w/2,
      -h/2
    );

    drawCover(img);

    ctx.restore();


    /* DARK CINEMATIC */

    const shade=
      ctx.createLinearGradient(
        0,0,0,h
      );

    shade.addColorStop(
      0,
      "rgba(0,0,0,.10)"
    );

    shade.addColorStop(
      .55,
      "rgba(0,0,0,0)"
    );

    shade.addColorStop(
      1,
      "rgba(0,0,0,.78)"
    );

    ctx.fillStyle=shade;

    ctx.fillRect(0,0,w,h);


    /* FACE EFFECTS */

    drawFaceEffect(now);


    /* SPEAKING MOUTH */

    drawMouth(now);


    /* WORD */

    drawWord(now);

  }


  /* BRAND */

  ctx.save();

  ctx.textAlign="center";

  ctx.font="900 29px Arial";

  ctx.fillStyle="#ffffffee";

  ctx.fillText(
    "AZAvatar",
    w/2,
    h-75
  );

  ctx.font="500 16px Arial";

  ctx.fillStyle="#ffffff80";

  ctx.fillText(
    "Sənin avatarın. Sənin mesajın.",
    w/2,
    h-47
  );

  ctx.restore();


  /* WATERMARK */

  ctx.save();

  ctx.textAlign="right";

  ctx.font="600 15px Arial";

  ctx.fillStyle="#ffffff66";

  ctx.fillText(
    "Made with AZAvatar",
    w-40,
    58
  );

  ctx.restore();

}


/* =========================================================
   GET FACE POINT
========================================================= */

function point(index){

  if(
    !face ||
    !face[index]
  )
    return null;

  return {
    x:face[index].x*canvas.width,
    y:face[index].y*canvas.height
  };

}


/* =========================================================
   MOUTH
========================================================= */

function drawMouth(now){

  let mouth=null;

  /*
    MediaPipe lips:
    13 / 14 are upper/lower inner lip area
  */

  if(faceReady){

    const upper=point(13);
    const lower=point(14);

    if(upper && lower){

      mouth={
        x:(upper.x+lower.x)/2,
        y:(upper.y+lower.y)/2,
        height:Math.abs(lower.y-upper.y)
      };

    }

  }


  /*
    fallback
  */

  if(!mouth){

    mouth={
      x:canvas.width/2,
      y:canvas.height*.60,
      height:0
    };

  }


  if(!speaking)
    return;


  const wave=
    Math.abs(
      Math.sin(
        now/65
      )
    );


  const open=
    Math.max(
      8,
      mouth.height*1.5+
      wave*23
    );


  const width=
    Math.max(
      25,
      mouth.height*5+35
    );


  ctx.save();

  ctx.globalAlpha=.62;

  ctx.fillStyle="#020204";

  ctx.beginPath();

  ctx.ellipse(
    mouth.x,
    mouth.y,
    width/2,
    open/2,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* highlight */

  ctx.globalAlpha=.18;

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.ellipse(
    mouth.x,
    mouth.y-open*.2,
    width*.25,
    3,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =========================================================
   WORD ANIMATION
========================================================= */

function drawWord(now){

  if(!speaking || !words.length)
    return;

  const word=
    words[
      Math.min(
        wordIndex,
        words.length-1
      )
    ];


  const elapsed=
    now-wordStart;

  const duration=
    700;

  const p=
    Math.min(
      elapsed/duration,
      1
    );


  let mouthX=
    canvas.width/2;

  let mouthY=
    canvas.height*.60;


  if(faceReady){

    const upper=point(13);
    const lower=point(14);

    if(upper && lower){

      mouthX=
        (upper.x+lower.x)/2;

      mouthY=
        (upper.y+lower.y)/2;

    }

  }


  const y=
    mouthY-
    25-
    p*135;


  const scale=
    1+
    Math.sin(
      p*Math.PI
    )*.15;


  ctx.save();

  ctx.translate(
    mouthX,
    y
  );

  ctx.scale(
    scale,
    scale
  );

  ctx.textAlign="center";

  ctx.font=
    "900 45px Arial";

  ctx.lineWidth=10;

  ctx.strokeStyle=
    "rgba(0,0,0,.58)";

  ctx.strokeText(
    word,
    0,
    0
  );

  ctx.fillStyle="#ffffff";

  ctx.fillText(
    word,
    0,
    0
  );

  ctx.restore();

}


/* =========================================================
   FACE EFFECT
========================================================= */

function drawFaceEffect(now){

  const w=canvas.width;
  const h=canvas.height;

  ctx.save();

  if(currentStyle==="football"){

    ctx.strokeStyle=
      "rgba(75,255,160,.65)";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      w/2,
      h*.86,
      140,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.font="55px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "⚽",
      w/2,
      h*.90
    );

  }


  if(currentStyle==="king"){

    ctx.font="74px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "👑",
      w/2,
      120
    );

  }


  if(currentStyle==="hero"){

    ctx.strokeStyle=
      "rgba(100,180,255,.42)";

    ctx.lineWidth=3;

    for(
      let i=0;
      i<8;
      i++
    ){

      const y=
        170+i*105;

      ctx.beginPath();

      ctx.moveTo(
        0,
        y
      );

      ctx.lineTo(
        w,
        y-90
      );

      ctx.stroke();

    }

  }


  if(currentStyle==="robot"){

    ctx.strokeStyle=
      "rgba(80,220,255,.38)";

    ctx.lineWidth=3;

    ctx.strokeRect(
      65,
      110,
      w-130,
      h-220
    );

    ctx.fillStyle=
      "rgba(80,220,255,.12)";

    ctx.fillRect(
      65,
      110,
      w-130,
      60
    );

  }


  /* CINEMA LIGHT */

  if(currentStyle==="cinema"){

    const g=
      ctx.createLinearGradient(
        0,0,w,0
      );

    g.addColorStop(
      0,
      "rgba(130,90,255,.18)"
    );

    g.addColorStop(
      .5,
      "rgba(255,255,255,0)"
    );

    g.addColorStop(
      1,
      "rgba(255,80,170,.14)"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
      0,
      0,
      w,
      h
    );

  }

  ctx.restore();

}


/* =========================================================
   RECORD VIDEO
========================================================= */

window.recordVideo=()=>{

  if(!img){

    showToast(
      "Əvvəlcə şəkil əlavə et"
    );

    return;

  }


  if(
    recorder &&
    recorder.state==="recording"
  ){

    recorder.stop();

    return;

  }


  chunks=[];

  const stream=
    canvas.captureStream(30);


  let mime=
    "video/webm";


  if(
    MediaRecorder.isTypeSupported(
      "video/webm;codecs=vp9"
    )
  ){

    mime=
      "video/webm;codecs=vp9";

  }else if(
    MediaRecorder.isTypeSupported(
      "video/webm;codecs=vp8"
    )
  ){

    mime=
      "video/webm;codecs=vp8";

  }


  recorder=
    new MediaRecorder(
      stream,
      {mimeType:mime}
    );


  recorder.ondataavailable=e=>{

    if(e.data.size>0)
      chunks.push(e.data);

  };


  recorder.onstop=()=>{

    lastVideo=
      new Blob(
        chunks,
        {type:mime}
      );


    recordButton
      .classList.remove("active");


    share.classList.add("show");


    showToast(
      "8 saniyəlik video hazırdır ✓"
    );

  };


  recorder.start();

  recordButton.classList.add("active");


  /*
    automatically speak
  */

  speak();


  /*
    8 seconds
  */

  setTimeout(()=>{

    if(
      recorder &&
      recorder.state==="recording"
    ){

      recorder.stop();

    }

  },8000);

};


/* =========================================================
   DOWNLOAD
========================================================= */

window.downloadVideo=()=>{

  if(!lastVideo){

    showToast(
      "Əvvəlcə video yarat"
    );

    return;

  }


  const url=
    URL.createObjectURL(
      lastVideo
    );


  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "AZAvatar-"+Date.now()+".webm";

  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1500
  );

};


/* =========================================================
   SHARE
========================================================= */

window.shareVideo=async()=>{

  if(!lastVideo){

    showToast(
      "Video yoxdur"
    );

    return;

  }


  const file=
    new File(
      [lastVideo],
      "AZAvatar.webm",
      {
        type:lastVideo.type
      }
    );


  try{

    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({
        files:[file]
      })
    ){

      await navigator.share({

        title:
          "Mənim AZAvatar mesajım",

        text:
          "Mənim avatar mesajıma bax 👀",

        files:[file]

      });

    }else{

      downloadVideo();

      showToast(
        "Video yadda saxlanıldı"
      );

    }

  }catch(e){

    console.log(e);

  }

};


/* =========================================================
   CLOSE
========================================================= */

window.closeShare=()=>{

  share.classList.remove("show");

};


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  toast.textContent=text;

  toast.classList.add("show");

  setTimeout(
    ()=>toast.classList.remove("show"),
    2400
  );

}
