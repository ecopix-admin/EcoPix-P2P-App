<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeyimDəyis P2P Pro</title>
    <!-- 
      // FIXED BLACK SCREEN BUG: blob URL for local, compressed dataURL for Gun, IDB fallback, publishBtn bound, i18n auto-detect, TikTok-first, Explore grid, P2P persistent.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-2: #1e1e1e;
            --surface-3: #2a2a2a;
            --text: #ffffff;
            --text-sub: #aaaaaa;
            --primary: #fe2c55;
            --primary-hover: #e02649;
            --whatsapp: #25D366;
            --nav-h: 68px;
            --header-h: 60px;
            --border: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        /* App Container & Header */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            pointer-events: none;
        }

        header * { pointer-events: auto; }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .p2p-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .p2p-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4d4d;
        }

        .p2p-dot.online { background-color: #25D366; }

        /* Main Content Views */
        main {
            flex: 1;
            position: relative;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .view-section {
            position: absolute;
            inset: 0;
            display: none;
            width: 100%;
            height: 100%;
        }

        .view-section.active { display: block; }

        /* Feed TikTok Style */
        #feedContainer {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        #feedContainer::-webkit-scrollbar { display: none; }

        .feed-item {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Carousel inside feed item */
        .media-slider {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .media-slider::-webkit-scrollbar { display: none; }

        .media-slide {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .media-slide img, .media-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
        }

        /* Dots overlay */
        .slider-dots {
            position: absolute;
            top: calc(var(--header-h) + 10px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transition: all 0.2s;
        }

        .dot.active {
            background: #fff;
            width: 14px;
            border-radius: 4px;
        }

        /* Sound Button */
        .sound-btn {
            position: absolute;
            top: calc(var(--header-h) + 10px);
            right: 16px;
            z-index: 10;
        }

        /* Overlay Text & Controls */
        .item-overlay-bottom {
            position: absolute;
            bottom: var(--nav-h);
            left: 0;
            right: 0;
            padding: 40px 80px 16px 16px;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0) 100%);
            z-index: 15;
            pointer-events: none;
        }

        .item-overlay-bottom * { pointer-events: auto; }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .author-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #fff;
        }

        .author-name {
            font-weight: 700;
            font-size: 1rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .trade-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(254, 44, 85, 0.2);
            border: 1px solid var(--primary);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .item-desc {
            font-size: 0.9rem;
            line-height: 1.3;
            color: #eee;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.75rem;
            color: #ccc;
        }

        .meta-tag {
            background: rgba(255,255,255,0.15);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Right Actions Bar */
        .actions-bar {
            position: absolute;
            bottom: calc(var(--nav-h) + 10px);
            right: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 20;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        .action-btn-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .action-btn.liked .action-btn-circle {
            background: rgba(254, 44, 85, 0.3);
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-btn span {
            font-size: 0.75rem;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .whatsapp-float-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--whatsapp);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            cursor: pointer;
        }

        /* Bottom Navigation */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-h);
            background: #000;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.68rem;
            font-weight: 500;
            cursor: pointer;
            width: 20%;
        }

        .nav-item.active { color: #fff; }

        .nav-item-add {
            width: 44px;
            height: 32px;
            background: #fff;
            color: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Explore View */
        .explore-container {
            padding: calc(var(--header-h) + 10px) 10px calc(var(--nav-h) + 10px) 10px;
            height: 100%;
            overflow-y: auto;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        .grid-item {
            aspect-ratio: 1;
            position: relative;
            background: var(--surface-2);
            cursor: pointer;
            overflow: hidden;
        }

        .grid-item img, .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-type-icon {
            position: absolute;
            top: 6px;
            right: 6px;
            color: #fff;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
        }

        /* Profile View */
        .profile-container {
            padding: calc(var(--header-h) + 10px) 16px calc(var(--nav-h) + 10px) 16px;
            height: 100%;
            overflow-y: auto;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-avatar-large {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            margin-bottom: 10px;
        }

        /* Modal Sheets */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            display: none;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active { display: block; }

        .modal-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85vh;
            background: var(--surface);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
        }

        .modal-sheet.active { transform: translateY(0); }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .form-control {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        textarea.form-control { resize: none; min-height: 70px; }

        .media-picker-btns {
            display: flex;
            gap: 10px;
        }

        .picker-btn {
            flex: 1;
            padding: 12px;
            background: var(--surface-3);
            border: 1px dashed #555;
            border-radius: 10px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .selected-media-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .selected-media-item {
            height: 80px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .selected-media-item img, .selected-media-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        /* Drawer Left */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: var(--surface);
            z-index: 300;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .drawer.active { transform: translateX(0); }

        .drawer-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .drawer-menu {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .drawer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .drawer-item:hover { background: var(--surface-2); }

        .lang-switch {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            background: var(--surface-2);
            padding: 4px;
            border-radius: 8px;
        }

        .lang-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-sub);
            padding: 6px 0;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* Comments List */
        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            font-size: 0.85rem;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .comment-content { flex: 1; }
        .comment-user { font-weight: 700; margin-bottom: 2px; }
        .comment-text { color: #ddd; margin-bottom: 4px; }
        .comment-meta { font-size: 0.7rem; color: var(--text-sub); display: flex; gap: 10px; }

        .reply-box {
            margin-left: 40px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-left: 2px solid var(--surface-3);
            padding-left: 8px;
        }

        .legal-text {
            font-size: 0.8rem;
            color: var(--text-sub);
            line-height: 1.5;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Header -->
        <header>
            <div class="logo">
                <i data-lucide="repeat"></i>
                <span>GeyimDəyis</span>
            </div>
            <div class="header-actions">
                <div class="p2p-status">
                    <div id="p2pDot" class="p2p-dot"></div>
                    <span id="p2pStatusText">P2P</span>
                </div>
                <button class="icon-btn" onclick="toggleDrawer()">
                    <i data-lucide="menu"></i>
                </button>
            </div>
        </header>

        <!-- Main View Area -->
        <main>
            <!-- 1. Home TikTok Feed -->
            <section id="viewHome" class="view-section active">
                <div id="feedContainer"></div>
            </section>

            <!-- 2. Explore Grid View -->
            <section id="viewExplore" class="view-section">
                <div class="explore-container">
                    <div class="search-bar">
                        <input type="text" id="searchInput" class="search-input" placeholder="Search...">
                        <button class="icon-btn" onclick="executeSearch()"><i data-lucide="search"></i></button>
                    </div>
                    <div id="exploreGrid" class="explore-grid"></div>
                </div>
            </section>

            <!-- 3. Favorites View -->
            <section id="viewFavorites" class="view-section">
                <div class="explore-container">
                    <h3 style="margin-bottom:12px;" data-i18n="favorites">Favorites</h3>
                    <div id="favoritesGrid" class="explore-grid"></div>
                </div>
            </section>

            <!-- 4. Profile View -->
            <section id="viewProfile" class="view-section">
                <div class="profile-container">
                    <div id="profileHeader" class="profile-header"></div>
                    <div id="profileGrid" class="explore-grid"></div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home')">
                <i data-lucide="house"></i>
                <span data-i18n="home">Home</span>
            </button>
            <button class="nav-item" onclick="switchTab('explore')">
                <i data-lucide="layout-grid"></i>
                <span data-i18n="explore">Explore</span>
            </button>
            <button class="nav-item" onclick="openPublishModal()">
                <div class="nav-item-add"><i data-lucide="plus"></i></div>
            </button>
            <button class="nav-item" onclick="switchTab('favorites')">
                <i data-lucide="star"></i>
                <span data-i18n="favorites">Favorites</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <i data-lucide="user-round"></i>
                <span data-i18n="profile">Profile</span>
            </button>
        </nav>
    </div>

    <!-- Drawer Left Side Menu -->
    <div id="drawerOverlay" class="modal-overlay" onclick="toggleDrawer(false)"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header" data-i18n="brand">GeyimDəyis P2P</div>
        <div class="drawer-menu">
            <div class="form-group">
                <label data-i18n="language">Language</label>
                <div class="lang-switch">
                    <button class="lang-btn" onclick="setLanguage('az')">AZ</button>
                    <button class="lang-btn" onclick="setLanguage('en')">EN</button>
                    <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
                    <button class="lang-btn" onclick="setLanguage('tr')">TR</button>
                    <button class="lang-btn" onclick="setLanguage('ka')">GE</button>
                </div>
            </div>
            <button class="drawer-item" onclick="openLegalModal('about')">
                <i data-lucide="info"></i> <span data-i18n="about">About</span>
            </button>
            <button class="drawer-item" onclick="openLegalModal('how')">
                <i data-lucide="help-circle"></i> <span data-i18n="how_to_use">How to Use</span>
            </button>
            <button class="drawer-item" onclick="openLegalModal('privacy')">
                <i data-lucide="shield-check"></i> <span data-i18n="privacy">Privacy Policy</span>
            </button>
            <button class="drawer-item" onclick="openLegalModal('terms')">
                <i data-lucide="file-text"></i> <span data-i18n="terms">Terms of Service</span>
            </button>
        </div>
    </div>

    <!-- Modal: Upload / Publish Item -->
    <div id="uploadModalOverlay" class="modal-overlay" onclick="closeModal('uploadModal')"></div>
    <div id="uploadModal" class="modal-sheet">
        <div class="modal-header">
            <span data-i18n="publish">Publish Listing</span>
            <i data-lucide="x" style="cursor:pointer;" onclick="closeModal('uploadModal')"></i>
        </div>
        <div class="modal-body">
            <!-- Profile Info Setup (If not exists) -->
            <div id="profileSetupFields" class="form-group" style="display:none; border-bottom:1px solid var(--border); padding-bottom:12px;">
                <label data-i18n="enter_name">Your Name</label>
                <input type="text" id="upAuthorName" class="form-control" placeholder="Name">
                <label style="margin-top:8px;">Avatar</label>
                <input type="file" id="upAvatarFile" accept="image/*" class="form-control">
            </div>

            <div class="form-group">
                <label data-i18n="what_changing">What are you offering?</label>
                <input type="text" id="upItem" class="form-control" placeholder="e.g. Leather Jacket">
            </div>
            <div class="form-group">
                <label data-i18n="what_want">What do you want in exchange?</label>
                <input type="text" id="upWant" class="form-control" placeholder="e.g. Denim Jacket / Sneakers">
            </div>

        /* --- 2. INDEXEDDB FOR DURABLE MEDIA STORAGE --- */
        const DB_NAME = 'geyimdeyis-p2p';
        const DB_VERSION = 1;
        let dbInstance = null;

        function initIDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('medias')) {
                        db.createObjectStore('medias', { keyPath: 'id' });
                    }
                };
                request.onsuccess = e => {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = e => reject(e);
            });
        }

        function saveMediaBlob(id, blob, type, name) {
            return new Promise((resolve, reject) => {
                if (!dbInstance) return resolve(null);
                const tx = dbInstance.transaction('medias', 'readwrite');
                const store = tx.objectStore('medias');
                store.put({ id, blob, type, name });
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => reject(tx.error);
            });
        }

        function getMediaBlob(id) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(null);
                const tx = dbInstance.transaction('medias', 'readonly');
                const store = tx.objectStore('medias');
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                req.onerror = () => resolve(null);
            });
        }

        /* --- 3. STATE & DATA MANAGEMENT --- */
        let feedData = [];

        let currentCommentItemId = null;

        let activeProfileUserId = null;

        function uid(prefix = 'id') {
            return prefix + '_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        }

        function timeAgo(ts) {
            const diff = Math.floor((Date.now() - ts) / 1000);
            if (diff < 60) return t('now');
            if (diff < 3600) return `${Math.floor(diff / 60)} ${t('minutes')}`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} ${t('hours')}`;
            return `${Math.floor(diff / 86400)} ${t('days')}`;
        }

        /* Compression Helper for Gun P2P */
        function compressImageFile(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    let w = img.width;
                    let h = img.height;
                    if (w > maxWidth) {
                        h = Math.round((h * maxWidth) / w);
                        w = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    resolve(null);
                };
                img.src = url;
            });
        }

        async function ensureMediaSrc(item) {
            if (!item.media || !Array.isArray(item.media)) return;
            for (let m of item.media) {
                if (m.src && m.src.startsWith('blob:')) {
                    // Test if Blob URL is still active by attempting to fetch or keeping it
                    continue;
                }
                if (!m.src || m.src === "") {
                    // Try loading original Blob from IDB
                    const blob = await getMediaBlob(m.id);
                    if (blob) {
                        m.src = URL.createObjectURL(blob);
                    } else if (m.dataUrl) {
                        m.src = m.dataUrl;
                    }
                }
            }
        }

        function saveLocal() {
            try {
                // Strip heavy transient fields if needed, but preserve structure
                const cleanFeed = feedData.map(item => ({
                    ...item,
                    media: item.media.map(m => ({
                        id: m.id,
                        type: m.type,
                        mime: m.mime,
                        name: m.name,
                        src: (m.src && m.src.length < 500000) ? m.src : "", // Don't persist large raw strings to localStorage
                        dataUrl: m.dataUrl || ""
                    }))
                }));
                localStorage.setItem('p2p-feed-v4', JSON.stringify(cleanFeed));
            } catch (e) {
                console.warn("localStorage quota reached, trimming feed cache", e);
            }
        }

        /* --- 4. GUN P2P SETUP --- */
        let gun = null;
        function initGun() {
            try {
                gun = Gun({
                    peers: [
                        'https://gun-manhattan.herokuapp.com/gun',
                        'https://gun-us.herokuapp.com/gun'
                    ],
                    localStorage: false
                });

                document.getElementById('p2pDot').classList.add('online');
                document.getElementById('p2pStatusText').innerText = "P2P Online";

                // Listen for incoming P2P listings
                gun.get('geyimdeyis').get('feed').map().on(async (data) => {
                    if (!data || !data.id) return;
                    
                    let existing = feedData.find(x => x.id === data.id);
                    let parsedMedia = [];
                    try {
                        parsedMedia = typeof data.media === 'string' ? JSON.parse(data.media) : (data.media || []);
                    } catch(e) { parsedMedia = []; }

                    const formattedItem = {
                        id: data.id,
                        u: data.u,
                        av: data.av,
                        name: data.name,
                        item: data.item,
                        want: data.want,
                        wa: data.wa,
                        brand: data.brand || '',
                        size: data.size || '',
                        desc: data.desc || '',
                        tags: Array.isArray(data.tags) ? data.tags : (typeof data.tags === 'string' ? data.tags.split(',') : []),
                        media: parsedMedia,
                        ts: data.ts || Date.now(),
                        likes: data.likes || 0
                    };

                    if (!existing) {
                        feedData.unshift(formattedItem);
                        feedData.sort((a,b) => b.ts - a.ts);
                        await ensureMediaSrc(formattedItem);
                        saveLocal();
                        if (activeTab === 'home') renderFeed();
                    }
                });
            } catch(e) {
                console.error("Gun init failed", e);
                document.getElementById('p2pDot').classList.remove('online');
                document.getElementById('p2pStatusText').innerText = "P2P Offline";
            }
        }

        function persistItem(item) {
            saveLocal();
            if (gun) {
                const payload = {
                    id: item.id,
                    u: item.u,
                    av: item.av,
                    name: item.name,
                    item: item.item,
                    want: item.want,
                    wa: item.wa,
                    brand: item.brand,
                    size: item.size,
                    desc: item.desc,
                    tags: JSON.stringify(item.tags),
                    media: JSON.stringify(item.media.map(m => ({
                        id: m.id,
                        type: m.type,
                        mime: m.mime,
                        name: m.name,
                        src: m.dataUrl || m.src
                    }))),
                    ts: item.ts,
                    likes: item.likes
                };
                gun.get('geyimdeyis').get('feed').get(item.id).put(payload);
            }
        }

        // Periodic Seeder Task
        setInterval(() => {
            if (gun && feedData.length > 0) {
                const newest = feedData.slice(0, 20);
                newest.forEach(item => persistItem(item));
            }
        }, 30000);

        /* --- 5. RENDER FUNCTIONS --- */
        async function renderFeed() {
            const container = document.getElementById('feedContainer');
            if (!container) return;

            let displayItems = feedData;
            if (currentFilter) {
                const q = currentFilter.toLowerCase();
                displayItems = feedData.filter(i => 
                    (i.item && i.item.toLowerCase().includes(q)) ||
                    (i.want && i.want.toLowerCase().includes(q)) ||
                    (i.brand && i.brand.toLowerCase().includes(q)) ||
                    (i.desc && i.desc.toLowerCase().includes(q)) ||
                    (i.tags && i.tags.some(t => t.toLowerCase().includes(q)))
                );
            }

            if (displayItems.length === 0) {
                container.innerHTML = `
                    <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;">
                        <i data-lucide="package-open" style="width:64px; height:64px; color:#555; margin-bottom:12px;"></i>
                        <p style="color:#aaa;">${t('no_results')}</p>
                        <p style="color:#666; font-size:0.85rem; margin-top:4px;">${t('first_ad')}</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let html = '';
            for (let item of displayItems) {
                await ensureMediaSrc(item);
                const isLiked = favs.includes(item.id);

                let mediaSlidesHtml = '';
                let dotsHtml = '';

                if (item.media && item.media.length > 0) {
                    item.media.forEach((m, idx) => {
                        dotsHtml += `<div class="dot ${idx === 0 ? 'active' : ''}"></div>`;
                        const src = m.src || m.dataUrl || '';
                        
                        if (!src) {
                            mediaSlidesHtml += `
                                <div class="media-slide">
                                    <div class="media-placeholder">
                                        <i data-lucide="image-off" style="width:48px; height:48px;"></i>
                                        <span>Media Unavailable</span>
                                    </div>
                                </div>
                            `;
                        } else if (m.type === 'video') {
                            mediaSlidesHtml += `
                                <div class="media-slide">
                                    <video src="${src}" autoplay muted loop playsinline preload="metadata" controlslist="nodownload"></video>
                                </div>
                            `;
                        } else {
                            mediaSlidesHtml += `
                                <div class="media-slide">
                                    <img src="${src}" alt="Media">
                                </div>
                            `;
                        }
                    });
                } else {
                    mediaSlidesHtml = `
                        <div class="media-slide">
                            <div class="media-placeholder">
                                <i data-lucide="image-off" style="width:48px; height:48px;"></i>
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="feed-item" id="feed-item-${item.id}" data-id="${item.id}">
                        <div class="media-slider" onscroll="handleSliderScroll(event)">
                            ${mediaSlidesHtml}
                        </div>

                        ${item.media && item.media.length > 1 ? `<div class="slider-dots">${dotsHtml}</div>` : ''}

                        <button class="icon-btn sound-btn" onclick="toggleAudioMute(this)">
                            <i data-lucide="volume-x"></i>
                        </button>

                        <div class="item-overlay-bottom">
                            <div class="author-info" onclick="openProfile('${item.u}')">
                                <img src="${item.av || 'https://via.placeholder.com/40'}" class="author-avatar" alt="Author">
                                <span class="author-name">${item.name || t('user')}</span>
                            </div>

                            <div class="trade-badge">
                                <span>${item.item}</span>
                                <i data-lucide="arrow-right-left" style="width:14px; height:14px;"></i>
                                <span>${item.want}</span>
                            </div>

                            ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}

                            <div class="item-meta">
                                ${item.brand ? `<span class="meta-tag">🏷️ ${item.brand}</span>` : ''}
                                ${item.size ? `<span class="meta-tag">📏 ${item.size}</span>` : ''}
                                <span>• ${timeAgo(item.ts)}</span>
                            </div>
                        </div>

                        <div class="actions-bar">
                            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleFavorite('${item.id}')">
                                <div class="action-btn-circle">
                                    <i data-lucide="star" ${isLiked ? 'fill="#fe2c55"' : ''}></i>
                                </div>
                                <span>${item.likes || 0}</span>
                            </button>

                            <button class="action-btn" onclick="openComments('${item.id}')">
                                <div class="action-btn-circle">
                                    <i data-lucide="message-circle"></i>
                                </div>
                                <span>${(commentsData[item.id] || []).length}</span>
                            </button>

                            <button class="action-btn" onclick="shareItem('${item.id}')">
                                <div class="action-btn-circle">
                                    <i data-lucide="share-2"></i>
                                </div>
                                <span>${t('share')}</span>
                            </button>

                            <a href="https://wa.me/${(item.wa || '').replace(/[^0-9]/g, '')}" target="_blank" class="whatsapp-float-btn">
                                <i data-lucide="phone" style="width:24px; height:24px;"></i>
                            </a>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
            setupIntersectionObserver();
        }

        function handleSliderScroll(e) {
            const slider = e.target;
            const index = Math.round(slider.scrollLeft / slider.clientWidth);
            const dots = slider.parentElement.querySelectorAll('.slider-dots .dot');
            dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
        }

        function toggleAudioMute(btn) {
            const item = btn.closest('.feed-item');
            const videos = item.querySelectorAll('video');
            let isMuted = true;
            videos.forEach(v => {
                v.muted = !v.muted;
                isMuted = v.muted;
            });
            btn.innerHTML = `<i data-lucide="${isMuted ? 'volume-x' : 'volume-2'}"></i>`;
            lucide.createIcons();
        }

        /* Intersection Observer for Auto-Seeding & Active Media Handling */
        let observer = null;
        function setupIntersectionObserver() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const videos = entry.target.querySelectorAll('video');
                    if (entry.isIntersecting) {
                        videos.forEach(v => v.play().catch(()=>{}));
                        const id = entry.target.getAttribute('data-id');
                        const item = feedData.find(x => x.id === id);
                        if (item) persistItem(item);
                    } else {
                        videos.forEach(v => v.pause());
                    }
                });
            }, { threshold: 0.65 });

            document.querySelectorAll('.feed-item').forEach(el => observer.observe(el));
        }

        /* Grid View Renders */
        async function renderExploreGrid() {
            const grid = document.getElementById('exploreGrid');
            if (!grid) return;
            let html = '';
            for (let item of feedData) {
                await ensureMediaSrc(item);
                const firstMedia = item.media && item.media[0];
                const src = firstMedia ? (firstMedia.src || firstMedia.dataUrl) : '';
                const isVideo = firstMedia && firstMedia.type === 'video';

                html += `
                    <div class="grid-item" onclick="openItemInFeed('${item.id}')">
                        ${src ? (isVideo ? `<video src="${src}#t=0.1" preload="metadata"></video>` : `<img src="${src}">`) : `<div class="media-placeholder"><i data-lucide="image-off"></i></div>`}
                        ${isVideo ? `<div class="grid-type-icon"><i data-lucide="video" style="width:16px;"></i></div>` : ''}
                    </div>
                `;
            }
            grid.innerHTML = html || `<p style="grid-column:span 3; color:#aaa;">${t('no_results')}</p>`;
            lucide.createIcons();
        }

        async function renderFavoritesGrid() {
            const grid = document.getElementById('favoritesGrid');
            if (!grid) return;
            const favItems = feedData.filter(i => favs.includes(i.id));
            let html = '';
            for (let item of favItems) {
                await ensureMediaSrc(item);
                const firstMedia = item.media && item.media[0];
                const src = firstMedia ? (firstMedia.src || firstMedia.dataUrl) : '';
                const isVideo = firstMedia && firstMedia.type === 'video';

                html += `
                    <div class="grid-item" onclick="openItemInFeed('${item.id}')">
                        ${src ? (isVideo ? `<video src="${src}#t=0.1" preload="metadata"></video>` : `<img src="${src}">`) : `<div class="media-placeholder"><i data-lucide="image-off"></i></div>`}
                    </div>
                `;
            }
            grid.innerHTML = html || `<p style="grid-column:span 3; color:#aaa;">${t('no_results')}</p>`;
            lucide.createIcons();
        }

        /* --- 6. NAVIGATION & TABS --- */
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tab === 'home') {
                document.getElementById('viewHome').classList.add('active');
                renderFeed();
            } else if (tab === 'explore') {
                document.getElementById('viewExplore').classList.add('active');
                renderExploreGrid();
            } else if (tab === 'favorites') {
                document.getElementById('viewFavorites').classList.add('active');
                renderFavoritesGrid();
            } else if (tab === 'profile') {
                document.getElementById('viewProfile').classList.add('active');
                openProfile(myProfile ? myProfile.u : null);
            }

            // Update active nav item icon
            const navs = document.querySelectorAll('.nav-item');
            if (tab === 'home') navs[0].classList.add('active');
            if (tab === 'explore') navs[1].classList.add('active');
            if (tab === 'favorites') navs[3].classList.add('active');
            if (tab === 'profile') navs[4].classList.add('active');
        }

        function openItemInFeed(id) {
            currentFilter = '';
            switchTab('home');
            setTimeout(() => {
                const target = document.getElementById(`feed-item-${id}`);
                if (target) target.scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        function toggleDrawer(show) {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawerOverlay');
            const isActive = show !== undefined ? show : !drawer.classList.contains('active');
            drawer.classList.toggle('active', isActive);
            overlay.classList.toggle('active', isActive);
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
            document.getElementById(`${id}Overlay`).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            document.getElementById(`${id}Overlay`).classList.remove('active');
        }

        /* --- 7. UPLOAD & PUBLISH LOGIC --- */
        function openPublishModal() {
            if (!myProfile) {
                document.getElementById('profileSetupFields').style.display = 'flex';
            } else {
                document.getElementById('profileSetupFields').style.display = 'none';
            }
            openModal('uploadModal');
        }

        function handleFileSelect(e, type) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.size > 25 * 1024 * 1024) {
                    alert(t('file_too_large'));
                    return;
                }
                const previewUrl = URL.createObjectURL(file);
                selectedMediaFiles.push({
                    id: uid('media'),
                    file,
                    previewUrl,
                    type,
                    mime: file.type,
                    name: file.name
                });
            });
            renderSelectedMediaGrid();
        }

        function renderSelectedMediaGrid() {
            const container = document.getElementById('selectedMediaGrid');
            let html = '';
            selectedMediaFiles.forEach((m, idx) => {
                html += `
                    <div class="selected-media-item">
                        ${m.type === 'video' ? `<video src="${m.previewUrl}"></video>` : `<img src="${m.previewUrl}">`}
                        <button class="media-remove-btn" onclick="removeSelectedMedia(${idx})">×</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function removeSelectedMedia(index) {
            const removed = selectedMediaFiles.splice(index, 1)[0];
            if (removed && removed.previewUrl) URL.revokeObjectURL(removed.previewUrl);
            renderSelectedMediaGrid();
        }

        async function publishItem() {
            let authorName = myProfile ? myProfile.name : document.getElementById('upAuthorName').value.trim();
            let authorAv = myProfile ? myProfile.av : 'https://via.placeholder.com/80';

            // If setup profile for the first time
            if (!myProfile) {
                if (!authorName) { alert(t('enter_name')); return; }
                const avFileInput = document.getElementById('upAvatarFile');
                if (avFileInput.files && avFileInput.files[0]) {
                    authorAv = await compressImageFile(avFileInput.files[0], 200, 0.7);
                }
                myProfile = { u: uid('user'), name: authorName, av: authorAv };
                localStorage.setItem('myProfile', JSON.stringify(myProfile));
            }

            const item = document.getElementById('upItem').value.trim();
            const want = document.getElementById('upWant').value.trim();
            const wa = document.getElementById('upWa').value.trim();
            const brand = document.getElementById('upBrand').value.trim();
            const size = document.getElementById('upSize').value.trim();
            const desc = document.getElementById('upDesc').value.trim();
            const tags = document.getElementById('upTags').value.split(',').map(s=>s.trim()).filter(Boolean);

            if (!item) { alert(t('enter_item')); return; }
            if (!wa) { alert(t('enter_wa')); return; }
            if (selectedMediaFiles.length === 0) { alert(t('add_at_least_one_media')); return; }

            // Process & Store Medias
            const processedMedias = [];
            for (let m of selectedMediaFiles) {
                // Save original to IndexedDB
                await saveMediaBlob(m.id, m.file, m.type, m.name);

                let compressedDataUrl = "";
                if (m.type === 'image') {
                    compressedDataUrl = await compressImageFile(m.file, 800, 0.7);
                }

                processedMedias.push({
                    id: m.id,
                    type: m.type,
                    mime: m.mime,
                    name: m.name,
                    src: m.previewUrl, // Object URL for immediate local rendering
                    dataUrl: compressedDataUrl
                });
            }

            const newItem = {
                id: uid('item'),
                u: myProfile.u,
                av: myProfile.av,
                name: myProfile.name,
                item,
                want,
                wa,
                brand,
                size,
                desc,
                tags,
                media: processedMedias,
                ts: Date.now(),
                likes: 0
            };

            feedData.unshift(newItem);
            persistItem(newItem);

            // Cleanup Form
            selectedMediaFiles = [];
            renderSelectedMediaGrid();
            document.getElementById('upItem').value = '';
            document.getElementById('upWant').value = '';
            document.getElementById('upWa').value = '';
            document.getElementById('upBrand').value = '';
            document.getElementById('upSize').value = '';
            document.getElementById('upDesc').value = '';
            document.getElementById('upTags').value = '';

            closeModal('uploadModal');
            switchTab('home');
            window.scrollTo(0,0);
        }

        /* --- 8. ACTIONS: FAVORITES, COMMENTS, SHARE, SEARCH --- */
        function toggleFavorite(id) {
            const idx = favs.indexOf(id);
            const item = feedData.find(x => x.id === id);
            if (idx > -1) {
                favs.splice(idx, 1);
                if (item && item.likes > 0) item.likes--;
            } else {
                favs.push(id);
                if (item) item.likes = (item.likes || 0) + 1;
            }
            localStorage.setItem('favs', JSON.stringify(favs));
            if (item) persistItem(item);
            renderFeed();
        }

        function openComments(itemId) {
            currentCommentItemId = itemId;
            renderComments();
            openModal('commentsModal');
        }

        function renderComments() {
            const container = document.getElementById('commentsList');
            const list = commentsData[currentCommentItemId] || [];
            let html = '';
            list.forEach((c, idx) => {
                html += `
                    <div class="comment-item">
                        <img src="${c.av || 'https://via.placeholder.com/32'}" class="comment-avatar">
                        <div class="comment-content">
                            <div class="comment-user">${c.name || t('user')}</div>
                            <div class="comment-text">${c.text}</div>
                            <div class="comment-meta">
                                <span>${timeAgo(c.ts)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html || `<p style="color:#666; font-size:0.85rem;">No comments yet</p>`;
        }

        function submitComment() {
            if (!currentCommentItemId) return;
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            if (!myProfile) {
                const name = prompt(t('enter_name'));
                if (!name) return;
                myProfile = { u: uid('user'), name, av: 'https://via.placeholder.com/80' };
                localStorage.setItem('myProfile', JSON.stringify(myProfile));
            }

            if (!commentsData[currentCommentItemId]) commentsData[currentCommentItemId] = [];
            commentsData[currentCommentItemId].push({
                u: myProfile.u,
                name: myProfile.name,
                av: myProfile.av,
                text,
                ts: Date.now()
            });

            localStorage.setItem('comments-v4', JSON.stringify(commentsData));
            input.value = '';
            renderComments();
            renderFeed();
        }

        function shareItem(id) {
            const url = `${window.location.origin}${window.location.pathname}#item=${id}`;
            if (navigator.share) {
                navigator.share({ title: 'GeyimDəyis P2P', url });
            } else {
                navigator.clipboard.writeText(url);
                alert(t('copied'));
            }
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            currentFilter = query;
            switchTab('home');
        }

        /* --- 9. PROFILE VIEW --- */
        async function openProfile(userId) {
            activeProfileUserId = userId || (myProfile ? myProfile.u : null);
            const userItems = feedData.filter(i => i.u === activeProfileUserId);
            const header = document.getElementById('profileHeader');
            const grid = document.getElementById('profileGrid');

            const profileUser = userItems[0] || (myProfile && myProfile.u === activeProfileUserId ? myProfile : null) || { name: t('user'), av: 'https://via.placeholder.com/96' };

            header.innerHTML = `
                <img src="${profileUser.av}" class="profile-avatar-large">
                <h2>${profileUser.name}</h2>
                <p style="color:#aaa; font-size:0.85rem; margin-top:4px;">${userItems.length} Listings</p>
            `;

            let html = '';
            for (let item of userItems) {
                await ensureMediaSrc(item);
                const firstMedia = item.media && item.media[0];
                const src = firstMedia ? (firstMedia.src || firstMedia.dataUrl) : '';
                html += `
                    <div class="grid-item" onclick="openItemInFeed('${item.id}')">
                        ${src ? `<img src="${src}">` : `<div class="media-placeholder"><i data-lucide="image-off"></i></div>`}
                    </div>
                `;
            }
            grid.innerHTML = html || `<p style="grid-column:span 3; color:#aaa; margin-top:20px;">No listings published yet.</p>`;
            lucide.createIcons();
        }

        /* --- 10. LEGAL & POLICY MODALS --- */

            const titleEl = document.getElementById('legalModalTitle');
            const contentEl = document.getElementById('legalModalContent');

            } else if (type === 'terms') {
                titleEl.innerText = t('terms');
                contentEl.innerText = `TERMS OF SERVICE

                contentEl.innerText = `HOW TO USE

            } else {
                titleEl.innerText = t('about');
                contentEl.innerText = `ABOUT GEYİMDƏYİŞ P2P
A serverless, lightweight, peer-to-peer clothing barter ecosystem. Built for zero-cost, high-speed, durable local exchanges without central database overhead.`;
            }

            openModal('legalModal');
        }

        /* --- 11. INITIALIZATION & EVENT BINDING --- */
        window.addEventListener('DOMContentLoaded', async () => {
            // Bind Critical Publish Button Listener
            const pubBtn = document.getElementById('publishBtn');
            if (pubBtn) {
                pubBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    publishItem();
                });
            }

            // Search listener
            document.getElementById('searchInput')?.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') executeSearch();
            });

            // Visibility listener to pause videos when page is hidden
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    document.querySelectorAll('video').forEach(v => v.pause());
                }
            });

            // Handle Deep Link Hash
            const hash = window.location.hash;

            await initIDB();

            // Load initial cached feed
            const cached = localStorage.getItem('p2p-feed-v4');
            if (cached) {
                try { feedData = JSON.parse(cached); } catch(e) {}
            }

            updateUIStrings();
            renderFeed();
            initGun();

            if (hash.startsWith('#item=')) {
                const targetId = hash.replace('#item=', '');
                setTimeout(() => openItemInFeed(targetId), 300);
            }
        });
    </script>
