<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Futbolçu Mesajı</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020409;color:#fff;font-family:Arial}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%}

#top{
 position:absolute;z-index:20;top:14px;left:14px;right:14px;
 display:flex;justify-content:space-between;pointer-events:none
}
.logo{font-weight:900;font-size:17px;text-shadow:0 3px 15px #000}
.state{
 background:#0009;border:1px solid #ffffff20;border-radius:20px;
 padding:7px 12px;font-size:11px;backdrop-filter:blur(12px)
}

#words{
 position:absolute;z-index:15;top:10%;left:4%;right:4%;
 height:42%;display:flex;align-items:flex-end;
 justify-content:center;flex-direction:column;
 pointer-events:none;overflow:hidden
}
.word{
 align-self:center;
 font-size:clamp(20px,6vw,34px);
 font-weight:900;
 margin:3px;
 padding:5px 13px;
 border-radius:14px;
 background:#07101ddf;
 border:1px solid #ffffff20;
 box-shadow:0 5px 25px #0009;
 animation:appear .45s ease forwards
}
@keyframes appear{
 from{opacity:0;transform:translateY(45px) scale(.5)}
 to{opacity:1;transform:translateY(0) scale(1)}
}

#mouthText{
 position:absolute;z-index:16;
 left:50%;top:49%;
 transform:translate(-50%,-50%);
 font-size:18px;font-weight:900;
 opacity:0;pointer-events:none;
 text-shadow:0 3px 12px #000
}
#mouthText.fly{
 animation:fly .8s ease forwards
}
@keyframes fly{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
 15%{opacity:1;transform:translate(-50%,-65%) scale(1)}
 100%{opacity:0;transform:translate(-50%,-360%) scale(.8)}
}

#panel{
 position:absolute;z-index:30;
 left:10px;right:10px;bottom:10px;
 padding:11px;border-radius:22px;
 background:#060d16e8;
 border:1px solid #ffffff18;
 backdrop-filter:blur(20px);
 box-shadow:0 15px 60px #000b
}
textarea{
 width:100%;height:65px;resize:none;outline:0;
 border:1px solid #ffffff18;border-radius:14px;
 background:#02050a;color:#fff;padding:11px;
 font-size:16px
}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
button{
 height:45px;border:0;border-radius:13px;
 color:#fff;font-weight:900;font-size:12px
}
#play{background:linear-gradient(135deg,#126bff,#5735ff)}
#rec{background:linear-gradient(135deg,#dc1745,#ff4264)}
#share{background:linear-gradient(135deg,#00a85a,#16d078)}
#status{text-align:center;color:#9da9b9;font-size:11px;padding-top:8px}

#loading{
 position:absolute;z-index:100;inset:0;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 background:#020409;gap:14px
}
.loader{
 width:45px;height:45px;border-radius:50%;
 border:3px solid #ffffff18;
 border-top-color:#3c82ff;
 animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div id="app">

<div id="loading">
 <div class="loader"></div>
 <b>Futbolçu hazırlanır...</b>
</div>

<div id="top">
 <div class="logo">⚽ AI FUTBOLÇU</div>
 <div class="state" id="state">HAZIR</div>
</div>

<div id="words"></div>
<div id="mouthText"></div>

<div id="panel">

<textarea id="text"
placeholder="Futbolçunun deyəcəyi cümləni yaz...">Salam! Necəsən? Sənə gözəl bir gün arzulayıram!</textarea>

<div class="buttons">
 <button id="play">▶ ANİMASİYA</button>
 <button id="rec">● REC</button>
 <button id="share">↗ WHATSAPP</button>
</div>

<div id="status">Mesajı yaz və ANİMASİYA düyməsinə bas.</div>

</div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

/*
=========================================================
 FUTBOLÇU MODELİ
=========================================================

BURAYA REALİSTİK GLB MODELİN URL-sini qoyuruq.

Modeldə bunlar varsa avtomatik istifadə olunur:
- Idle
- Walk
- Run
- Talk
- Gesture
- Wave
- Football animations

Model URL-ni dəyişmək kifayətdir.
*/

const PLAYER_MODEL =
"https://cdn.jsdelivr.net/gh/MisterYI/deevid-mixamo-assets@main/char/Y_Bot.glb";


/* SCENE */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x020409);

scene.fog=new THREE.Fog(
 0x020409,
 4,
 11
);


/* CAMERA */

const camera=new THREE.PerspectiveCamera(
 36,
 innerWidth/innerHeight,
 .01,
 100
);

camera.position.set(
 0,1.5,4
);

camera.lookAt(
 0,1.15,0
);


/* RENDERER */

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 preserveDrawingBuffer:true
});

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
THREE.SRGBColorSpace;

document
.getElementById("app")
.appendChild(renderer.domElement);


/* LIGHTING */

scene.add(
 new THREE.HemisphereLight(
  0xbdd5ff,
  0x111111,
  2.2
 )
);

const key=
new THREE.DirectionalLight(
 0xffffff,
 4
);

key.position.set(
 -3,5,4
);

key.castShadow=true;

key.shadow.mapSize.set(
 1024,1024
);

scene.add(key);

const blue=
new THREE.PointLight(
 0x237dff,
 30,
 8
);

blue.position.set(
 3,2.5,-2
);

scene.add(blue);

const red=
new THREE.PointLight(
 0xff164e,
 20,
 7
);

red.position.set(
 -3,1.5,-1
);

scene.add(red);


/* FIELD */

const field=
new THREE.Mesh(
 new THREE.CircleGeometry(
  2.4,96
 ),
 new THREE.MeshStandardMaterial({
  color:0x07100b,
  roughness:.95
 })
);

field.rotation.x=-Math.PI/2;
field.receiveShadow=true;

scene.add(field);


/* FIELD RING */

const ring=
new THREE.Mesh(
 new THREE.RingGeometry(
  1.1,1.8,96
 ),
 new THREE.MeshBasicMaterial({
  color:0x21659b,
  transparent:true,
  opacity:.25,
  side:THREE.DoubleSide
 })
);

ring.rotation.x=-Math.PI/2;
ring.position.y=.005;

scene.add(ring);


/* FOOTBALL */

const ball=
new THREE.Mesh(
 new THREE.SphereGeometry(
  .13,32,32
 ),
 new THREE.MeshStandardMaterial({
  color:0xffffff,
  roughness:.55
 })
);

ball.position.set(
 .55,.13,.15
);

ball.castShadow=true;

scene.add(ball);


/* PLAYER */

let player=null;
let mixer=null;
let actions={};
let currentAction=null;

const loader=new GLTFLoader();

loader.load(
 PLAYER_MODEL,

 gltf=>{

  player=gltf.scene;

  player.scale.setScalar(1.55);

  player.traverse(
   object=>{

    if(object.isMesh){

     object.castShadow=true;
     object.receiveShadow=true;

     if(object.material){

      object.material.roughness=.68;
      object.material.metalness=.02;

     }
    }

   }
  );

  scene.add(player);

  mixer=
  new THREE.AnimationMixer(
   player
  );

  gltf.animations.forEach(
   clip=>{

    actions[clip.name]=
    mixer.clipAction(clip);

   }
  );

  console.log(
   "Model animations:",
   Object.keys(actions)
  );

  const idle=findAnimation([
   "idle",
   "breath",
   "standing"
  ]);

  if(idle)
   playAnimation(idle);
  else{

   const first=
   Object.keys(actions)[0];

   if(first)
    playAnimation(first);

  }

  document
   .getElementById("loading")
   .style.display="none";

  status(
   "Futbolçu hazırdır."
  );

 },

 error=>{

  console.error(error);

  document
   .getElementById("loading")
   .innerHTML=
   `
   <div style="font-size:40px">⚠️</div>
   <b>3D model yüklənmədi</b>
   <small style="color:#999">
   İnternet bağlantısını yoxla.
   </small>
   `;

 }
);


/* ANIMATION SEARCH */

function findAnimation(patterns){

 const names=
 Object.keys(actions);

 for(const pattern of patterns){

  const found=
  names.find(
   name=>
   new RegExp(
    pattern,
    "i"
   ).test(name)
  );

  if(found)
   return found;
 }

 return null;
}


/* PLAY ANIMATION */

function playAnimation(name){

 if(!actions[name])
  return;

 const next=
 actions[name];

 if(currentAction===next)
  return;

 if(currentAction)
  currentAction.fadeOut(.25);

 next.reset();

 next.fadeIn(.3);

 next.play();

 currentAction=next;
}


/* GESTURE */

function gesture(){

 const anim=
 findAnimation([
  "talk",
  "talking",
  "gesture",
  "wave",
  "waving",
  "hello",
  "hand",
  "standing"
 ]);

 if(anim){

  playAnimation(anim);

  setTimeout(()=>{

   const idle=
   findAnimation([
    "idle",
    "breath",
    "standing"
   ]);

   if(idle)
    playAnimation(idle);

  },2200);

 }

}


/* WORD MESSAGE */

let timer=null;

function animateMessage(){

 const text=
 document
 .getElementById("text")
 .value
 .trim();

 if(!text){

  status("Mesaj yaz.");

  return;
 }

 clearTimeout(timer);

 const container=
 document.getElementById("words");

 container.innerHTML="";

 const words=
 text
 .replace(/\s+/g," ")
 .split(" ")
 .filter(Boolean);

 gesture();

 let index=0;

 function nextWord(){

  if(index>=words.length){

   status(
    "Mesaj tamamlandı."
   );

   return;
  }

  const word=
  words[index++];

  /* söz ağızdan çıxır */

  const mouth=
  document.getElementById(
   "mouthText"
  );

  mouth.classList.remove("fly");

  void mouth.offsetWidth;

  mouth.textContent=word;

  mouth.classList.add("fly");


  /* baş üzərində söz */

  const el=
  document.createElement(
   "div"
  );

  el.className="word";

  el.textContent=word;

  container.appendChild(el);


  /* əvvəlki sözlər yuxarı qalxır */

  const children=
  [...container.children];

  children.forEach(
   (item,i)=>{

    const y=
    (children.length-1-i)*40;

    item.style.transform=
    `translateY(-${y}px) scale(${Math.max(.75,1-y/500)})`;

    item.style.opacity=
    Math.max(
     .25,
     1-y/350
    );

   }
  );


  if(children.length>7)
   container.removeChild(
    children[0]
   );


  timer=
  setTimeout(
   nextWord,
   260+
   Math.min(
    word.length*20,
    300
   )
  );

 }

 nextWord();

 status(
  "Futbolçu danışır..."
 );

}


/* PLAY */

document
.getElementById("play")
.onclick=
animateMessage;


/* TOUCH PLAYER */

const raycaster=
new THREE.Raycaster();

const pointer=
new THREE.Vector2();

renderer.domElement
.addEventListener(
 "pointerdown",
 event=>{

  if(!player)
   return;

  pointer.x=
   event.clientX/
   innerWidth*2-1;

  pointer.y=
   -(event.clientY/
     innerHeight)*2+1;

  raycaster.setFromCamera(
   pointer,
   camera
  );

  const hits=
  raycaster.intersectObject(
   player,
   true
  );

  if(hits.length)
   animateMessage();

 }
);


/* RECORD */

let recorder=null;
let chunks=[];
let videoBlob=null;

document
.getElementById("rec")
.onclick=
()=>{

 if(
  recorder &&
  recorder.state==="recording"
 ){

  recorder.stop();

  return;
 }

 chunks=[];

 const stream=
 renderer.domElement
 .captureStream(30);

 let options={};

 if(
  MediaRecorder
  .isTypeSupported(
   "video/webm;codecs=vp9"
  )
 ){

  options={
   mimeType:
   "video/webm;codecs=vp9"
  };

 }

 recorder=
 new MediaRecorder(
  stream,
  options
 );

 recorder.ondataavailable=
 e=>{

  if(e.data.size)
   chunks.push(e.data);

 };

 recorder.onstop=()=>{

  videoBlob=
  new Blob(
   chunks,
   {
    type:"video/webm"
   }
  );

  document
   .getElementById("rec")
   .textContent="● REC";

  document
   .getElementById("state")
   .textContent="HAZIR";

  status(
   "Video hazırdır."
  );

 };

 recorder.start();

 document
  .getElementById("rec")
  .textContent="■ STOP";

 document
  .getElementById("state")
  .textContent="● REC";

 status(
  "10 saniyəlik video yazılır..."
 );

 setTimeout(()=>{

  if(
   recorder &&
   recorder.state==="recording"
  )
   recorder.stop();

 },10000);

};


/* SHARE WHATSAPP / TELEGRAM */

document
.getElementById("share")
.onclick=
async()=>{

 if(!videoBlob){

  status(
   "Əvvəlcə REC ilə video yarat."
  );

  return;
 }

 const file=
 new File(
  [videoBlob],
  "AI-Futbolcu.webm",
  {
   type:"video/webm"
  }
 );

 try{

  if(
   navigator.share &&
   navigator.canShare &&
   navigator.canShare({
    files:[file]
   })
  ){

   await navigator.share({

    title:
    "AI Futbolçu",

    text:
    "AI futbolçu animasiya mesajı",

    files:[file]

   });

   status(
    "WhatsApp / Telegram seçə bilərsən."
   );

  }else{

   download();

  }

 }catch(error){

  if(
   error.name!=="AbortError"
  )
   download();

 }

};


/* DOWNLOAD */

function download(){

 const url=
 URL.createObjectURL(
  videoBlob
 );

 const a=
 document.createElement("a");

 a.href=url;

 a.download=
 "AI-Futbolcu.webm";

 a.click();

 setTimeout(
  ()=>{
   URL.revokeObjectURL(url);
  },
  2000
 );

 status(
  "Video telefona endirildi."
 );

}


/* STATUS */

function status(text){

 document
  .getElementById("status")
  .textContent=text;

}


/* RESIZE */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/
   innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);


/* LOOP */

const clock=
new THREE.Clock();

function loop(){

 requestAnimationFrame(loop);

 const delta=
 clock.getDelta();

 if(mixer)
  mixer.update(delta);

 if(player){

  const t=
   performance.now()*.0003;

  player.rotation.y=
   Math.sin(t)*.025;

 }

 ring.rotation.z+=.0007;

 renderer.render(
  scene,
  camera
 );

}

loop();

</script>

</body>
</html>
