
<script>
(()=> {
"use strict";

const $ = id => document.getElementById(id);
const DB_NAME = "ARWORLD_SPATIAL_V4";
const STORE = "posts";
const PROFILE_KEY = "ARWORLD_PROFILE_V4";
const PRIVACY_KEY = "ARWORLD_PRIVACY";

let db = null;
let posts = [];
let selectedFile = null;
let editingId = null;
let gps = null;
let heading = null;
let watchId = null;
let stream = null;
let map = null;
let markerLayer = null;
let activeLayer = "street";
let selectedPlace = null;
let pickMode = false;
let filterCategory = "";
let filterRadius = 5000;
let filterText = "";
let noticeTimer = null;
let orientationStarted = false;
let mapTiles = {};
const objectURLs = new Map();
const rad = Math.PI / 180;

let profile = {name:"", bio:""};
let privacy = {saveLocation:true, publicDefault:true};

try {
  profile = {...profile, ...JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}")};
} catch {}

try {
  privacy = {...privacy, ...JSON.parse(localStorage.getItem(PRIVACY_KEY) || "{}")};
} catch {}

function toast(message) {
  const n = $("notice");
  if (!n) return;
  n.textContent = message;
  n.classList.add("show");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => n.classList.remove("show"), 3000);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function show(id) {
  $(id)?.classList.add("show");
}

function hide(id) {
  $(id)?.classList.remove("show");
}

function closeAll() {
  document.querySelectorAll(".overlay.show")
    .forEach(el => el.classList.remove("show"));
}

function validCoords(lat, lng) {
  return Number.isFinite(lat) && Number.isFinite(lng) &&
    lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
}

function coordinatesOf(p) {
  const lat = Number(p.lat);
  const lng = Number(p.lng);
  return p.lat !== null && p.lng !== null &&
    p.lat !== undefined && p.lng !== undefined &&
    validCoords(lat, lng);
}

function distance(a, b) {
  const dLat = (b.lat - a.lat) * rad;
  const dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat/2)**2 +
    Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)**2;
  return 6371000 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(Math.max(0, 1-x)));
}

function bearing(a, b) {
  const p1 = a.lat * rad;
  const p2 = b.lat * rad;
  const dl = (b.lng - a.lng) * rad;
  return (Math.atan2(
    Math.sin(dl)*Math.cos(p2),
    Math.cos(p1)*Math.sin(p2) -
      Math.sin(p1)*Math.cos(p2)*Math.cos(dl)
  ) / rad + 360) % 360;
}

function directionDifference(angle) {
  if (heading === null) return null;
  return ((angle - heading + 540) % 360) - 180;
}

/* IndexedDB: elanlar və media birlikdə saxlanılır. */
function openDB() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) {
      reject(Error("Bu brauzer IndexedDB yaddaşını dəstəkləmir."));
      return;
    }

    const request = indexedDB.open(DB_NAME, 1);

    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(STORE)) {
        database.createObjectStore(STORE, {keyPath:"id"});
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => toast("Yaddaş yenilənməsi başqa açıq səhifə tərəfindən bloklanıb.");
  });
}

function dbRequest(mode, operation) {
  return new Promise((resolve, reject) => {
    if (!db) {
      reject(Error("Yaddaş hələ hazır deyil."));
      return;
    }

    let transaction;
    try {
      transaction = db.transaction(STORE, mode);
      const request = operation(transaction.objectStore(STORE));

      if (request) {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      } else {
        transaction.oncomplete = () => resolve(true);
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error || Error("Əməliyyat ləğv edildi."));
      }
    } catch (error) {
      reject(error);
    }
  });
}

function releaseURL(id) {
  if (!objectURLs.has(id)) return;
  URL.revokeObjectURL(objectURLs.get(id));
  objectURLs.delete(id);
}

function mediaURL(post) {
  if (!post.file) return "";
  if (!objectURLs.has(post.id)) {
    objectURLs.set(post.id, URL.createObjectURL(post.file));
  }
  return objectURLs.get(post.id);
}

function mediaHTML(post, className = "arimg") {
  if (!post.file) return "";

  const url = mediaURL(post);
  const safeClass = esc(className);

  if ((post.mime || post.file.type || "").startsWith("video/")) {
    return '<video class="' + safeClass + '" src="' + url +
      '" muted loop playsinline preload="metadata"></video>';
  }

  return '<img class="' + safeClass + '" src="' + url +
    '" alt="' + esc(post.title) + '" loading="lazy">';
}

function publicPosts() {
  return posts.filter(p =>
    p.privacy !== "private" && coordinatesOf(p)
  );
}

async function loadPosts() {
  posts = (await dbRequest("readonly", s => s.getAll()))
    .sort((a,b) => (b.created || 0) - (a.created || 0));

  renderMapMarkers();
  renderAR();
  renderMyPosts();
}

/* GPS: yalnız bir watchPosition dinləyicisi saxlanılır. */
function getGPS() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(Error("Bu brauzerdə GPS dəstəyi yoxdur."));
      return;
    }

    navigator.geolocation.getCurrentPosition(position => {
      gps = {
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        accuracy: position.coords.accuracy
      };

      renderAR();

      if (map && !selectedPlace) {
        map.setView([gps.lat, gps.lng], 16);
      }

      updateGPSStatus();
      resolve(gps);
    }, error => {
      const messages = {
        1:"Məkan icazəsi verilməyib. Brauzer ayarlarını yoxla.",
        2:"GPS mövqeyi müəyyən edilə bilmədi.",
        3:"GPS sorğusunun vaxtı bitdi."
      };
      reject(Error(messages[error.code] || "GPS əlçatan deyil."));
    }, {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:5000
    });
  });
}

function updateGPSStatus() {
  $("gpsBadge").textContent = gps
    ? "GPS ±" + Math.round(gps.accuracy || 0) + " m"
    : "GPS gözlənilir";

  $("coordText").textContent = gps
    ? gps.lat.toFixed(5) + ", " + gps.lng.toFixed(5)
    : "GPS tələb olunur";
}

async function startGPS() {
  try {
    await getGPS();

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
    }

    watchId = navigator.geolocation.watchPosition(position => {
      gps = {
        lat:position.coords.latitude,
        lng:position.coords.longitude,
        accuracy:position.coords.accuracy
      };
      updateGPSStatus();
      renderAR();
    }, error => {
      if (error.code === 1) toast("GPS icazəsi bağlanıb.");
    }, {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:20000
    });

    toast("GPS aktivdir.");
  } catch (error) {
    toast(error.message);
  }
}

/* Kompas dəstəklənən cihazlarda oxunur. */
function orientationHandler(event) {
  let value = null;

  if (typeof event.webkitCompassHeading === "number") {
    value = event.webkitCompassHeading;
  } else if (typeof event.alpha === "number") {
    value = 360 - event.alpha;
  }

  if (value !== null) {
    heading = (value + 360) % 360;
    renderAR();
  }
}

async function startCompass() {
  try {
    if (typeof DeviceOrientationEvent === "undefined") {
      toast("Bu cihazda kompas məlumatı mövcud deyil.");
      return;
    }

    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") {
        toast("Kompas icazəsi verilmədi.");
        return;
      }
    }

    if (!orientationStarted) {
      window.addEventListener("deviceorientation", orientationHandler);
      window.addEventListener("deviceorientationabsolute", orientationHandler);
      orientationStarted = true;
    }

    toast("Kompas aktivləşdirildi. Dəqiqlik cihazdan asılıdır.");
  } catch {
    toast("Kompası aktivləşdirmək mümkün olmadı.");
  }
}

/* Kamera yalnız istifadəçi düyməyə basdıqda açılır. */
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    toast("Kamera üçün HTTPS və uyğun brauzer lazımdır.");
    return;
  }

  try {
    stopCamera();

    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });

    $("camera").srcObject = stream;
    await $("camera").play();
    toast("Kamera aktivdir.");
  } catch (error) {
    toast(error.name === "NotAllowedError"
      ? "Kamera icazəsi verilməyib."
      : "Kamera açılmadı. Başqa tətbiqin kameradan istifadə etmədiyini yoxla.");
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  if ($("camera")) $("camera").srcObject = null;
}

/*
 * AR kartlarının mövqeyi GPS məsafəsi və kompas istiqaməti ilə
 * təxmini hesablanır. Bu, tam 3D dünya koordinatlı AR deyil.
 */
function renderAR() {
  const root = $("cards");
  if (!root) return;

  root.replaceChildren();

  const list = publicPosts().filter(post =>
    (!filterCategory || post.category === filterCategory) &&
    (!filterText ||
      (post.title + " " + post.desc + " " + post.category + " " + post.owner)
        .toLowerCase().includes(filterText)) &&
    (!filterRadius || !gps || distance(gps, post) <= filterRadius)
  );

  $("empty").style.display = list.length ? "none" : "block";
  updateGPSStatus();

  if (!gps) return;

  let candidates = list.map(post => {
    const d = distance(gps, post);
    const angle = bearing(gps, post);
    return {post, d, angle, diff:directionDifference(angle)};
  }).filter(item => item.d > 3 && item.d <= 10000);

  /*
   * Kompas məlumatı yoxdursa, kartların saxta istiqamətə
   * yerləşdirilməsi əvəzinə istifadəçiyə xəritədən baxmaq təklif edilir.
   */
  if (heading === null) {
    if (candidates.length) {
      $("empty").style.display = "block";
      $("empty").querySelector("b").textContent = "İstiqamət məlumatı yoxdur";
      $("empty").querySelector("p").textContent =
        "Kompası aktiv et və ya elanları xəritədə aç. Bəzi telefonlarda kompas dəstəyi olmaya bilər.";
    }
    return;
  }

  candidates = candidates.filter(item => Math.abs(item.diff) < 55)
    .sort((a,b) => a.d - b.d)
    .slice(0, 8);

  $("empty").style.display = candidates.length ? "none" : "block";
  if (!candidates.length) {
    $("empty").querySelector("b").textContent = "Yaxınlıqda elan yoxdur";
    $("empty").querySelector("p").textContent =
      "Başqa istiqamətə dön, axtarış radiusunu dəyiş və ya xəritədə elanlara bax.";
    return;
  }

  const slots = [
    [18,35],[70,35],[43,43],[8,53],
    [66,54],[26,63],[51,65],[78,44]
  ];

  candidates.forEach((item, index) => {
    const p = item.post;
    const slot = slots[index];
    const card = document.createElement("article");
    card.className = "arcard";
    card.style.left = slot[0] + "%";
    card.style.top = slot[1] + "%";

    const owner = p.owner || "İstifadəçi";
    const metres = item.d < 1000
      ? Math.round(item.d) + " m"
      : (item.d/1000).toFixed(1) + " km";

    card.innerHTML =
      '<div class="arhead">' +
        '<div class="avatar">' + esc(owner.slice(0,1).toUpperCase()) + '</div>' +
        '<div class="arname"><b>' + esc(p.title) + '</b>' +
        '<small>' + esc(owner) + ' · ' + esc(p.category) +
        ' · ' + metres + '</small></div>' +
      '</div>' +
      mediaHTML(p) +
      '<div class="artext">' + esc(p.desc || "") + '</div>' +
      '<div class="arfoot">' +
        '<button data-action="details">Ətraflı</button>' +
        '<button data-action="like">♡ ' + (p.likes || 0) + '</button>' +
        '<button data-action="map">Xəritə</button>' +
      '</div><i class="anchor"></i>';

    card.querySelector('[data-action="details"]').onclick = () => details(p.id);
    card.querySelector('[data-action="like"]').onclick = () => like(p.id);
    card.querySelector('[data-action="map"]').onclick = () => locatePost(p.id);

    root.appendChild(card);
  });

  root.querySelectorAll("video").forEach(video => {
    video.addEventListener("click", () => {
      if (video.paused) video.play().catch(()=>{});
      else video.pause();
    });
  });
}

/* Xəritə qatları. */
function initMap() {
  if (map) return;
  if (!window.L) {
    toast("Xəritə kitabxanası yüklənmədi. İnterneti yoxla.");
    return;
  }

  map = L.map("map", {zoomControl:true})
    .setView(gps ? [gps.lat,gps.lng] : [40.4093,49.8671], 13);

  mapTiles.street = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19, attribution:"© OpenStreetMap"}
  );

  mapTiles.satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {maxZoom:19, attribution:"Tiles © Esri"}
  );

  mapTiles.hybrid = L.layerGroup([
    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:19, attribution:"Tiles © Esri"}
    ),
    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png",
      {maxZoom:19, subdomains:"abcd", attribution:"© CARTO"}
    )
  ]);

  mapTiles.terrain = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {maxZoom:17, attribution:"© OpenStreetMap contributors"}
  );

  mapTiles[activeLayer].addTo(map);
  markerLayer = L.layerGroup().addTo(map);

  map.on("click", event => {
    const point = {
      lat:event.latlng.lat,
      lng:event.latlng.lng
    };

    if (pickMode) {
      $("latitude").value = point.lat.toFixed(7);
      $("longitude").value = point.lng.toFixed(7);
      selectedPlace = point;
      pickMode = false;
      setMode("ar");
      show("editor");
      toast("Koordinat seçildi.");
      return;
    }

    selectedPlace = point;
    showPlace(point);
  });

  renderMapMarkers();
}

function renderMapMarkers() {
  if (!map || !markerLayer || !window.L) return;

  markerLayer.clearLayers();

  publicPosts().forEach(post => {
    const marker = L.marker([Number(post.lat),Number(post.lng)])
      .addTo(markerLayer);

    marker.bindPopup(
      '<div id="placePopup"><h3>' + esc(post.title) + '</h3>' +
      '<p>' + esc(post.category) + '</p>' +
      '<p>' + esc(post.owner || "İstifadəçi") + '</p>' +
      '<button class="popupView" data-id="' + esc(post.id) +
      '">Elana bax</button></div>'
    );

    marker.on("popupopen", event => {
      const button = event.popup.getElement()?.querySelector(".popupView");
      if (button) {
        button.onclick = () => details(button.dataset.id);
      }
    });
  });
}

function setMode(mode) {
  const isMap = mode === "map";

  $("scene").style.display = isMap ? "none" : "block";
  $("mapScreen").style.display = isMap ? "block" : "none";
  $("arStatus").style.display = isMap ? "none" : "flex";
  $("arBottom").style.display = isMap ? "none" : "block";
  $("mapTop").style.display = isMap ? "block" : "none";
  $("mapBottom").style.display = isMap ? "flex" : "none";

  $("arTab").classList.toggle("on", !isMap);
  $("mapTab").classList.toggle("on", isMap);

  if (isMap) {
    initMap();
    if (map) {
      setTimeout(() => {
        map.invalidateSize();
        if (gps && !selectedPlace) map.setView([gps.lat,gps.lng],15);
      }, 150);
    }
  }
}

/* Elan redaktəsi və media önizləməsi. */
function resetEditor() {
  editingId = null;
  selectedFile = null;

  $("editorTitle").textContent = "✧ Məkan yerləşdir";
  $("savePost").textContent = "✦ Məkana yerləşdir";
  $("postTitle").value = "";
  $("description").value = "";
  $("category").value = "Fotoşəkil";
  $("media").value = "";
  $("preview").replaceChildren();
  $("preview").style.display = "none";

  const point = privacy.saveLocation ? (selectedPlace || gps) : null;
  $("latitude").value = point ? point.lat.toFixed(7) : "";
  $("longitude").value = point ? point.lng.toFixed(7) : "";
  $("privacy").value = privacy.publicDefault ? "public" : "private";
}

function previewFile(file) {
  const box = $("preview");
  box.replaceChildren();
  box.style.display = "block";

  const url = URL.createObjectURL(file);
  const element = document.createElement(file.type.startsWith("video/") ? "video" : "img");

  element.src = url;
  element.style.display = "block";
  element.style.width = "100%";
  element.style.maxHeight = "28dvh";
  element.style.objectFit = "contain";

  if (element.tagName === "VIDEO") {
    element.controls = true;
    element.muted = true;
    element.playsInline = true;
  }

  box.appendChild(element);
}

function openEditor(file = null, point = null) {
  resetEditor();

  if (point) {
    $("latitude").value = point.lat.toFixed(7);
    $("longitude").value = point.lng.toFixed(7);
  }

  selectedFile = file;

  if (file) {
    $("postTitle").value = file.name.replace(/\.[^.]+$/, "");
    $("category").value = file.type.startsWith("video/") ? "Video" : "Fotoşəkil";
    previewFile(file);
  }

  closeAll();
  show("editor");
}

$("media").onchange = event => {
  const file = event.target.files?.[0];
  if (!file) return;

  if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
    toast("Yalnız foto və video faylları seçilə bilər.");
    event.target.value = "";
    return;
  }

  selectedFile = file;
  previewFile(file);
};

$("savePost").onclick = async () => {
  const title = $("postTitle").value.trim();
  if (!title) return toast("Elanın başlığını yaz.");

  const old = editingId ? posts.find(p => p.id === editingId) : null;
  const file = selectedFile || old?.file;

  if (!file) return toast("Foto və ya video seç.");

  let lat = $("latitude").value.trim() === "" ? null : Number($("latitude").value);
  let lng = $("longitude").value.trim() === "" ? null : Number($("longitude").value);

  if ((lat === null) !== (lng === null) ||
      (lat !== null && !validCoords(lat,lng))) {
    return toast("Enlik və uzunluq koordinatlarını düzgün daxil et.");
  }

  const post = {
    id:editingId || (crypto.randomUUID ? crypto.randomUUID() : "p" + Date.now()),
    title,
    desc:$("description").value.trim(),
    category:$("category").value,
    lat,
    lng,
    file,
    mime:file.type,
    owner:old?.owner || profile.name || "İstifadəçi",
    created:old?.created || Date.now(),
    likes:old?.likes || 0,
    privacy:$("privacy").value
  };

  $("savePost").disabled = true;

  try {
    await dbRequest("readwrite", store => store.put(post));

    releaseURL(post.id);
    await loadPosts();

    closeAll();
    setMode("ar");
    toast("Elan cihazda saxlanıldı.");
  } catch (error) {
    toast("Yaddaş xətası. Fayl böyük ola bilər: " + (error.message || ""));
  } finally {
    $("savePost").disabled = false;
  }
};

function details(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return toast("Elan artıq mövcud deyil.");

  const overlay = document.createElement("div");
  overlay.className = "overlay show";

  overlay.innerHTML =
    '<section class="sheet"><div class="sh"><h2>' + esc(post.title) +
    '</h2><button class="close">×</button></div>' +
    '<p class="help">' + esc(post.category) + ' · ' + esc(post.owner) + '</p>' +
    mediaHTML(post) +
    '<p style="white-space:pre-wrap;line-height:1.7">' + esc(post.desc) + '</p>' +
    '<p class="help">' + (coordinatesOf(post) ? post.lat + ", " + post.lng : "Koordinat yoxdur") + '</p>' +
    '<button class="primary" style="width:100%" data-action="map">Xəritədə göstər</button>' +
    '<div class="row"><button class="secondary" data-action="edit">Redaktə et</button>' +
    '<button class="secondary" data-action="delete">Elanı sil</button></div></section>';

  document.body.appendChild(overlay);
  overlay.querySelector(".close").onclick = () => overlay.remove();

  overlay.addEventListener("click", event => {
    if (event.target === overlay) overlay.remove();
  });

  overlay.querySelector('[data-action="map"]').onclick = () => {
    overlay.remove();
    locatePost(id);
  };

  overlay.querySelector('[data-action="edit"]').onclick = () => {
    overlay.remove();
    editPost(id);
  };

  overlay.querySelector('[data-action="delete"]').onclick = async () => {
    if (!confirm("Elan bu cihazdan silinsin?")) return;

    try {
      await dbRequest("readwrite", store => store.delete(id));
      releaseURL(id);
      overlay.remove();
      await loadPosts();
      toast("Elan silindi.");
    } catch {
      toast("Elanı silmək mümkün olmadı.");
    }
  };
}

async function like(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;

  post.likes = (post.likes || 0) + 1;

  try {
    await dbRequest("readwrite", store => store.put(post));
    await loadPosts();
  } catch {
    toast("Bəyənmə saxlanmadı.");
  }
}

function editPost(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;

  resetEditor();
  editingId = post.id;

  $("editorTitle").textContent = "Elanı redaktə et";
  $("savePost").textContent = "Dəyişiklikləri saxla";
  $("postTitle").value = post.title;
  $("description").value = post.desc || "";
  $("category").value = post.category;
  $("latitude").value = post.lat ?? "";
  $("longitude").value = post.lng ?? "";
  $("privacy").value = post.privacy || "public";

  selectedFile = null;
  if (post.file) previewFile(post.file);

  closeAll();
  show("editor");
}

function locatePost(id) {
  const post = posts.find(p => p.id === id);
  if (!post || !coordinatesOf(post)) {
    toast("Elanın koordinatı yoxdur.");
    return;
  }

  selectedPlace = {lat:Number(post.lat), lng:Number(post.lng)};
  setMode("map");

  if (!map) return;

  map.setView([post.lat,post.lng],18);

  setTimeout(() => {
    markerLayer?.eachLayer(marker => {
      const pos = marker.getLatLng();
      if (Math.abs(pos.lat - post.lat) < 0.0000001 &&
          Math.abs(pos.lng - post.lng) < 0.0000001) {
        marker.openPopup();
      }
    });
  }, 250);
}

/* Məkan adı, saat və hava məlumatı. */
async function reverseGeocode(lat,lng) {
  try {
    const response = await fetch(
      "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
      lat + "&lon=" + lng + "&zoom=10&accept-language=az"
    );
    if (!response.ok) throw Error();

    const data = await response.json();
    const address = data.address || {};

    return {
      name:data.name || address.city || address.town ||
        address.village || address.country || "Seçilmiş məkan",
      address:data.display_name || "Ünvan müəyyən edilmədi"
    };
  } catch {
    return {name:"Seçilmiş məkan",address:"Ünvan xidməti əlçatan deyil."};
  }
}

async function getWeather(lat,lng) {
  try {
    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
      "&longitude=" + lng +
      "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto"
    );
    if (!response.ok) throw Error();
    return await response.json();
  } catch {
    return null;
  }
}

function weatherDescription(code) {
  const descriptions = {
    0:"Açıq",1:"Əsasən açıq",2:"Qismən buludlu",3:"Buludlu",
    45:"Duman",48:"Sıx duman",51:"Zəif çiskin",53:"Çiskin",
    55:"Güclü çiskin",61:"Zəif yağış",63:"Yağış",65:"Güclü yağış",
    71:"Zəif qar",73:"Qar",75:"Güclü qar",80:"Leysan",
    81:"Güclü leysan",82:"Çox güclü leysan",95:"Tufan",
    96:"Dolu ehtimallı tufan",99:"Güclü tufan"
  };
  return descriptions[code] || "Hava məlumatı";
}

async function showPlace(point) {
  selectedPlace = {lat:point.lat,lng:point.lng};

  $("placeTitle").textContent = "Məkan məlumatı";
  $("placeAddress").textContent = "Ünvan müəyyən edilir…";
  $("placeCoordinates").textContent =
    point.lat.toFixed(6) + ", " + point.lng.toFixed(6);
  $("placeTime").textContent = "Yüklənir…";
  $("placeWeather").textContent = "Yüklənir…";
  show("placeInfo");

  const [place, weather] = await Promise.all([
    reverseGeocode(point.lat,point.lng),
    getWeather(point.lat,point.lng)
  ]);

  $("placeTitle").textContent = place.name;
  $("placeAddress").textContent = place.address;

  if (weather?.current) {
    const current = weather.current;
    $("placeWeather").textContent =
      current.temperature_2m + "°C · " +
      weatherDescription(current.weather_code) +
      " · külək " + current.wind_speed_10m + " km/saat";

    try {
      $("placeTime").textContent = new Intl.DateTimeFormat("az-AZ", {
        timeZone:weather.timezone,
        hour:"2-digit",
        minute:"2-digit",
        dateStyle:"short"
      }).format(new Date());
    } catch {
      $("placeTime").textContent = current.time || "—";
    }
  } else {
    $("placeWeather").textContent = "Hava məlumatı yoxdur";
    $("placeTime").textContent = "Saat müəyyən edilmədi";
  }
}

/* Axtarış və yaxınlıq. */
function renderResults(root,list,showDistance = false) {
  root.replaceChildren();

  if (!list.length) {
    root.innerHTML = '<p class="help">Uyğun elan tapılmadı.</p>';
    return;
  }

  list.slice(0,50).forEach(post => {
    const row = document.createElement("div");
    row.className = "result";

    row.innerHTML = mediaHTML(post,"") +
      '<div class="arname"><b>' + esc(post.title) + '</b><small>' +
      esc(post.category) + ' · ' + esc(post.owner) +
      (showDistance && gps && coordinatesOf(post)
        ? ' · ' + Math.round(distance(gps,post)) + ' m' : '') +
      '</small></div><button class="secondary">Bax</button>';

    row.querySelector("button").onclick = () => {
      if (root.id === "nearResults") locatePost(post.id);
      else details(post.id);
    };

    root.appendChild(row);
  });
}

function renderNearby() {
  const category = $("nearCategory").value;
  const radius = Number($("radius").value);
  const query = $("nearQuery").value.trim().toLowerCase();

  const list = publicPosts().filter(post =>
    (!category || post.category === category) &&
    (!query || (post.title + " " + post.desc + " " +
      post.category + " " + post.owner).toLowerCase().includes(query)) &&
    (!radius || !gps || distance(gps,post) <= radius)
  ).sort((a,b) => gps
    ? distance(gps,a) - distance(gps,b)
    : (b.created || 0) - (a.created || 0));

  renderResults($("nearResults"),list,true);
}

function runSearch() {
  const query = $("searchQuery").value.trim().toLowerCase();
  const list = publicPosts().filter(post =>
    (post.title + " " + post.desc + " " +
      post.category + " " + post.owner).toLowerCase().includes(query)
  );

  renderResults($("searchResults"),list);
}

function renderMyPosts() {
  const root = $("myPosts");
  if (!root) return;

  root.replaceChildren();

  posts.filter(post => post.owner === (profile.name || "İstifadəçi"))
    .forEach(post => {
      const row = document.createElement("div");
      row.className = "result";
      row.innerHTML =
        '<div class="arname"><b>' + esc(post.title) + '</b><small>' +
        esc(post.category) + '</small></div>' +
        '<button class="secondary">Redaktə</button>';

      row.querySelector("button").onclick = () => editPost(post.id);
      root.appendChild(row);
    });
}

/* Xəritədə axtarış. */
$("mapSearchBtn").onclick = async () => {
  const query = $("mapQuery").value.trim();
  if (!query) return toast("Məkan adı daxil et.");

  try {
    const response = await fetch(
      "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=az&q=" +
      encodeURIComponent(query)
    );
    if (!response.ok) throw Error();

    const results = await response.json();
    if (!results.length) return toast("Məkan tapılmadı.");

    const point = {
      lat:Number(results[0].lat),
      lng:Number(results[0].lon)
    };

    selectedPlace = point;
    map.setView([point.lat,point.lng],15);
    showPlace(point);
  } catch {
    toast("Məkan axtarışı hazırda əlçatan deyil.");
  }
};

$("mapQuery").addEventListener("keydown", event => {
  if (event.key === "Enter") $("mapSearchBtn").click();
});

document.querySelectorAll("[data-layer]").forEach(button => {
  button.onclick = () => {
    if (!map) return;

    const name = button.dataset.layer;
    if (!mapTiles[name]) return;

    if (map.hasLayer(mapTiles[activeLayer])) {
      map.removeLayer(mapTiles[activeLayer]);
    }

    activeLayer = name;
    mapTiles[name].addTo(map);

    document.querySelectorAll("[data-layer]").forEach(item => {
      item.classList.toggle("on",item === button);
    });
  };
});

$("exportData").onclick = () => {
  const data = posts.map(post => ({
    id:post.id,
    title:post.title,
    desc:post.desc,
    category:post.category,
    lat:post.lat,
    lng:post.lng,
    owner:post.owner,
    privacy:post.privacy,
    created:post.created,
    mediaName:post.file?.name || ""
  }));

  const url = URL.createObjectURL(new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  ));

  const link = document.createElement("a");
  link.href = url;
  link.download = "arworld-export.json";
  link.click();

  setTimeout(() => URL.revokeObjectURL(url),3000);
};

window.addEventListener("pagehide",() => {
  stopCamera();

  if (watchId !== null && navigator.geolocation) {
    navigator.geolocation.clearWatch(watchId);
  }

  objectURLs.forEach(url => URL.revokeObjectURL(url));
  objectURLs.clear();
});

async function boot() {
  try {
    db = await openDB();
    await loadPosts();

    if (navigator.storage?.persist) {
      navigator.storage.persist().catch(() => {});
    }

    updateGPSStatus();
  } catch (error) {
    toast("Yaddaş başlatılmadı: " + (error.message || ""));
  }
}

boot();
