<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GeyimDəyis - TikTok Barter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#000;color:#fff;overflow:hidden}
#feed{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.item{height:100vh;width:100vw;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.item video{height:100%;width:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:80px 15px 20px;background:linear-gradient(transparent,rgba(0,0,0,0.9));display:flex;justify-content:space-between;align-items:flex-end}
.left{max-width:70%}
.user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.user img{width:44px;height:44px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.user b{font-size:15px}
.desc{font-size:14px;line-height:1.4;margin-bottom:8px}
.tags{font-size:12px;color:#ffdb4d}
.right{display:flex;flex-direction:column;gap:22px;align-items:center;padding-bottom:20px}
.icon-btn{width:48px;height:48px;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:none;color:#fff;cursor:pointer}
.icon-btn.active{background:#fe2c55;color:#fff}
.count{font-size:11px;margin-top:4px;font-weight:600}
.wa-btn{background:#25D366;color:#fff;padding:10px 18px;border-radius:25px;font-weight:700;font-size:14px;border:none;display:flex;align-items:center;gap:6px;margin-top:10px}
.header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;padding:15px;pointer-events:none}
.logo{font-weight:800;font-size:20px;letter-spacing:-0.5px}
.logo span{color:#fe2c55}
.badge{background:rgba(255,255,255,0.2);padding:5px 10px;border-radius:15px;font-size:11px;backdrop-filter:blur(10px)}
.add-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:#fff;color:#000;padding:14px 28px;border-radius:30px;font-weight:800;border:none;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#uploadModal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#111;width:100%;max-width:380px;border-radius:20px;padding:25px}
.modal-box h3{margin-bottom:15px}
.modal-box input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;margin-bottom:12px}
</style>
</head>
<body>
<div class="header">
<div class="logo">Geyim<span>Dəyis</span></div>
<div class="badge">🔴 127 online • Server-siz P2P</div>
</div>
<div id="feed"></div>
<button class="add-btn" onclick="document.getElementById('uploadModal').style.display='flex'">+ Elan əlavə et</button>
<div id="uploadModal" onclick="if(event.target==this)this.style.display='none'">
<div class="modal-box">
<h3>Video ilə elan əlavə et</h3>
<input type="text" id="uName" placeholder="Adın (məs: Aysel)">
<input type="text" id="uItem" placeholder="Nəyi dəyişirsən? (məs: Toy paltarı)">
<input type="text" id="uWant" placeholder="Nə istəyirsən? (məs: Çanta)">
<input type="text" id="uWa" placeholder="WhatsApp nömrə (99450...)">
<input type="file" id="uVideo" accept="video/*">
<button onclick="addNew()" style="width:100%;padding:12px;background:#fe2c55;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:10px">Paylaş - P2P şəbəkəyə göndər</button>
</div>
</div>
<script>
const sampleVideos = [
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"
];
const mockData = [
{u:"Aysel H.",av:"https://i.pravatar.cc/150?img=1",item:"Zara qırmızı toy paltarı - 1 dəfə geyinilib",want:"Bej rəng çanta istəyirəm",tags:"#toy #zara #S ölçü",likes:124,wa:"994501234567"},
{u:"Nərmin",av:"https://i.pravatar.cc/150?img=5",item:"Mango dəri gödəkçə M ölçü",want:"Qara uzunboğaz çəkmə 38",tags:"#gödəkçə #mango #payız",likes:89,wa:"994502345678"},
{u:"Leyla",av:"https://i.pravatar.cc/150?img=9",item:"Bershka cins şalvar 2 ədəd - heç geyinilməyib",want:"Köynək və ya crop top",tags:"#cins #bershka #yenidir",likes:203,wa:"994503456789"},
{u:"Günel",av:"https://i.pravatar.cc/150?img=10",item:"H&M yay donu - S",want:"Ağ idman ayaqqabısı 37",tags:"#yay #don #hm",likes:156,wa:"994504567890"},
{u:"Fidan",av:"https://i.pravatar.cc/150?img=16",item:"Stradivarius palto - demək olar yenidir",want:"Qış çəkməsi",tags:"#palto #qış #stradivarius",likes:98,wa:"994505678901"},
{u:"Aydan",av:"https://i.pravatar.cc/150?img=23",item:"LC Waikiki uşaq paltarları - 2 yaş",want:"Oğlan uşaq paltarı",tags:"#usaq #lcwaikiki #2yas",likes:67,wa:"994506789012"},
{u:"Samirə",av:"https://i.pravatar.cc/150?img=26",item:"Koton ziyafət paltarı L",want:"Qara klassik şalvar",tags:"#ziyafət #koton #L",likes:112,wa:"994507890123"},
{u:"Ləman",av:"https://i.pravatar.cc/150?img=32",item:"Nike idman dəsti - M",want:"Adidas idman çantası",tags:"#idman #nike #original",likes:234,wa:"994508901234"},
{u:"Sevinc",av:"https://i.pravatar.cc/150?img=33",item:"İpək yaylıq - Versace stil",want:"Eynək və ya saat",tags:"#yayliq #ipek #brend",likes:76,wa:"994509012345"},
{u:"Nigar",av:"https://i.pravatar.cc/150?img=45",item:"Zara ayaqqabı 38 - 1 dəfə geyinilib",want:"Çanta - qara",tags:"#ayaqqabi #zara #38",likes:145,wa:"994501111111"},
{u:"Xədicə",av:"https://i.pravatar.cc/150?img=47",item:"Qara toy üçün uzun don - XL",want:"M ölçü don",tags:"#toy #xl #uzun",likes:88,wa:"994502222222"},
{u:"Rəna",av:"https://i.pravatar.cc/150?img=48",item:"Pull&Bear kofta - S",want:"Yubka",tags:"#kofta #pullbear #s",likes:54,wa:"994503333333"},
{u:"Mədinə",av:"https://i.pravatar.cc/150?img=29",item:"Uşaq arabası - az işlənib",want:"Uşaq velosipedi",tags:"#usaq #araba #barter",likes:201,wa:"994504444444"},
{u:"Zeynəb",av:"https://i.pravatar.cc/150?img=15",item:"Çanta Michael Kors - original",want:"İphone üçün qulaqlıq",tags:"#canta #mk #original",likes:321,wa:"994505555555"},
{u:"Ülviyyə",av:"https://i.pravatar.cc/150?img=18",item:"Paltar 3 ədəd - hamısı S",want:"1 ədəd qış paltarı",tags:"#3eded #qis #barter",likes:92,wa:"994506666666"},
{u:"Səma",av:"https://i.pravatar.cc/150?img=20",item:"Gəlinlik - 1 dəfə geyinilib, təmizlənib",want:"500 AZN dəyərində əşya",tags:"#gelinlik #toy #təmiz",likes:412,wa:"994507777777"},
{u:"Aytac",av:"https://i.pravatar.cc/150?img=21",item:"H&M uşaq dəsti 5 yaş",want:"Qız üçün ayaqqabı",tags:"#usaq #5yas #hm",likes:73,wa:"994508888888"},
{u:"Könül",av:"https://i.pravatar.cc/150?img=22",item:"Dəri çanta - əl işi",want:"Qızıl sırğa",tags:"#deri #elisI #canta",likes:167,wa:"994509999999"},
{u:"İlahə",av:"https://i.pravatar.cc/150?img=24",item:"Zara blazer - M",want:"Qara şalvar",tags:"#blazer #zara #ofis",likes:101,wa:"994500000001"},
{u:"Turanə",av:"https://i.pravatar.cc/150?img=25",item:"Qış paltosu - demək olar yeni",want:"Yay donları 2 ədəd",tags:"#qis #palto #yeni",likes:134,wa:"994500000002"}
];
const feed = document.getElementById('feed');
function render(){
 feed.innerHTML='';
 mockData.forEach((d,i)=>{
   const vid = d.customVideo || sampleVideos[i % sampleVideos.length];
   const el = document.createElement('div');
   el.className='item';
   el.innerHTML = `<video loop playsinline muted src="${vid}" poster="${d.av}"></video>
     <div class="overlay"><div class="left"><div class="user"><img src="${d.av}"><b>@${d.u}</b></div><div class="desc"><b>${d.item}</b><br>↳ ${d.want}</div><div class="tags">${d.tags}</div><button class="wa-btn" onclick="window.open('https://wa.me/${d.wa}?text=Salam, ${d.item} elanını gördüm')">💬 WhatsApp</button></div><div class="right"><div style="text-align:center"><button class="icon-btn" onclick="this.classList.toggle('active');this.innerText=this.classList.contains('active')?'❤️':'🤍'">🤍</button><div class="count">${d.likes}</div></div><div style="text-align:center"><button class="icon-btn">↗️</button><div class="count">Paylaş</div></div><img src="${d.av}" style="width:48px;height:48px;border-radius:50%;border:2px solid #fff;margin-top:10px"></div></div>`;
   feed.appendChild(el);
 });
 const obs = new IntersectionObserver((entries)=>{entries.forEach(e=>{const v=e.target.querySelector('video'); if(e.isIntersecting){v.play().catch(()=>{});} else {v.pause();}});},{threshold:0.7});
 document.querySelectorAll('.item').forEach(it=>obs.observe(it));
}
function addNew(){
 const name=document.getElementById('uName').value||'Anonim';
 const item=document.getElementById('uItem').value||'Paltar';
 const want=document.getElementById('uWant').value||'Dəyişmək';
 const wa=document.getElementById('uWa').value||'994501234567';
 const file=document.getElementById('uVideo');
 let videoUrl=sampleVideos[Math.floor(Math.random()*sampleVideos.length)];
 if(file.files[0]){videoUrl=URL.createObjectURL(file.files[0]);}
 mockData.unshift({u:name,av:`https://i.pravatar.cc/150?u=${Date.now()}`,item:item,want:want,tags:'#yeni #p2p',likes:1,wa:wa,customVideo:videoUrl});
 document.getElementById('uploadModal').style.display='none';
 localStorage.setItem('geyimdeyis', JSON.stringify(mockData.slice(0,30)));
 render(); feed.scrollTo({top:0,behavior:'smooth'});
 alert('Elan P2P şəbəkəyə göndərildi!');
}
const saved=localStorage.getItem('geyimdeyis'); if(saved){try{const p=JSON.parse(saved); if(p.length>0){mockData.length=0; p.forEach(x=>mockData.push(x));}}catch(e){}}
render();
</script>
</body>
</html>
