<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dəniz Kalkulyatoru</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Arial,sans-serif;overflow:hidden;background:#06283d;color:#fff}
    .sea{position:fixed;inset:0;z-index:-2;overflow:hidden;
      background:linear-gradient(#087ea4 0 32%,#075b78 55%,#021f32 100%)}
    .sea:before{content:"";position:absolute;inset:0;opacity:.5;
      background:radial-gradient(ellipse at 20% 20%,#d9fbff 0 1%,transparent 3%),
      radial-gradient(ellipse at 80% 12%,#b8f5ff 0 1%,transparent 3%),
      linear-gradient(155deg,transparent 42%,#102e3b 43% 58%,transparent 59%),
      linear-gradient(25deg,transparent 54%,#0b3545 55% 73%,transparent 74%)}
    .wave{position:absolute;left:-10%;width:120%;height:100px;border-radius:50%;
      background:rgba(99,224,239,.2);filter:blur(7px);animation:drift 8s ease-in-out infinite}
    .w1{top:38%}.w2{top:58%;animation-delay:-3s;opacity:.5}.w3{top:76%;animation-delay:-5s}
    @keyframes drift{50%{transform:translateX(5%) rotate(2deg)}}
    .app{width:min(390px,92vw);padding:18px;border:1px solid #7de7f1aa;border-radius:28px;
      background:#082b3dcc;backdrop-filter:blur(14px);box-shadow:0 20px 60px #00131dcc}
    h1{text-align:center;margin:0 0 14px;font-size:24px;text-shadow:0 3px 8px #001}
    #display{width:100%;height:70px;border:0;border-radius:16px;padding:12px 16px;text-align:right;
      font-size:31px;color:#dffcff;background:#031a2bd9;box-shadow:inset 0 3px 10px #0008}
    .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
    button{height:58px;border:0;border-radius:16px;color:#efffff;font-size:20px;font-weight:bold;
      cursor:pointer;background:linear-gradient(145deg,#1597b6,#064c6e);
      box-shadow:0 6px 0 #022d45,0 10px 17px #00141d88;transition:.12s;position:relative;overflow:hidden}
    button:active{transform:translateY(5px);box-shadow:0 1px 0 #022d45,0 3px 8px #00141d88}
    button:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;
      background:#b9faff;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);
      opacity:.8;pointer-events:none}
    button.ripple:after{animation:ripple .55s ease-out}
    @keyframes ripple{to{transform:translate(-50%,-50%) scale(18);opacity:0}}
    .op{background:linear-gradient(145deg,#19b9bd,#087074)}.danger{background:linear-gradient(145deg,#d15b67,#742536)}
    .equal{grid-column:span 2;background:linear-gradient(145deg,#25d7b0,#087d75)}
    .ad{height:58px;margin-top:16px;border:1px dashed #8feff5aa;border-radius:14px;display:grid;
      place-items:center;color:#b9faff;font-size:12px;background:#001a2a66}
    @media(max-height:650px){button{height:48px}.ad{height:42px}#display{height:58px}}
  </style>
</head>
<body>
  <div class="sea"><i class="wave w1"></i><i class="wave w2"></i><i class="wave w3"></i></div>
  <main class="app">
    <h1>🌊 Dəniz Kalkulyatoru</h1>
    <input id="display" value="0" readonly aria-label="Nəticə">
    <section class="keys">
      <button class="danger" data-v="C">C</button><button data-v="⌫">⌫</button>
      <button class="op" data-v="%">%</button><button class="op" data-v="÷">÷</button>
      <button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button class="op" data-v="×">×</button>
      <button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button class="op" data-v="-">−</button>
      <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button class="op" data-v="+">+</button>
      <button data-v="0">0</button><button data-v=".">.</button><button class="equal" data-v="=">=</button>
    </section>
    <div class="ad">REKLAM BANNER YERİ</div>
  </main>
  <script>
    const display=document.querySelector('#display');let exp='';
    function calculate(){try{let e=exp.replaceAll('×','*').replaceAll('÷','/').replaceAll('%','/100');exp=String(Function('return '+e)());display.value=exp}catch{display.value='Xəta';exp=''}}
    document.querySelectorAll('button').forEach(b=>b.onclick=()=>{b.classList.remove('ripple');void b.offsetWidth;b.classList.add('ripple');
      const v=b.dataset.v;if(v==='C'){exp='';display.value='0'}else if(v==='⌫'){exp=exp.slice(0,-1);display.value=exp||'0'}
      else if(v==='='){calculate()}else{if(display.value==='Xəta')exp='';exp+=v;display.value=exp}});
    document.addEventListener('keydown',e=>{if(/[0-9.+\-*/%]/.test(e.key)){exp+=e.key;display.value=exp}
      if(e.key==='Enter')calculate();if(e.key==='Backspace'){exp=exp.slice(0,-1);display.value=exp||'0'}});
  </script>
</body>
</html>
