<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050509">

<title>AZAvatar — Talking Avatar</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#050507;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.app{
 width:100%;
 max-width:540px;
 height:100dvh;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:
 radial-gradient(circle at 50% -10%,#4a2b82 0,transparent 35%),
 linear-gradient(180deg,#09090e,#040407);
}

/* HEADER */

.header{
 position:absolute;
 top:0;
 left:0;
 right:0;
 height:64px;
 z-index:50;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px 17px;
 background:linear-gradient(#050507dd,transparent);
}

.logo{
 font-size:22px;
 font-weight:900;
 letter-spacing:-1px;
}

.logo span{
 color:#9b7cff;
}

.status{
 font-size:9px;
 padding:7px 10px;
 border-radius:20px;
 border:1px solid #ffffff16;
 background:#0008;
 backdrop-filter:blur(12px);
 color:#ccc;
}

.status i{
 display:inline-block;
 width:6px;
 height:6px;
 border-radius:50%;
 background:#5cffaa;
 margin-right:5px;
 box-shadow:0 0 9px #5cffaa;
}

/* STAGE */

.stage{
 position:absolute;
 top:63px;
 left:10px;
 right:10px;
 bottom:210px;
 overflow:hidden;
 border-radius:29px;
 background:#09090d;
 border:1px solid #ffffff14;
 box-shadow:0 25px 70px #000b;
}

#canvas{
 display:block;
 width:100%;
 height:100%;
}

.topbar{
 position:absolute;
 top:13px;
 left:14px;
 right:14px;
 display:flex;
 justify-content:space-between;
 z-index:20;
 pointer-events:none;
}

.badge{
 padding:7px 10px;
 border-radius:20px;
 background:#0008;
 border:1px solid #ffffff14;
 font-size:9px;
 color:#ddd;
 backdrop-filter:blur(12px);
}

.faceStatus{
 padding:7px 10px;
 border-radius:20px;
 background:#0008;
 border:1px solid #ffffff14;
 font-size:9px;
 color:#aaa;
}

/* EMPTY */

.empty{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
 z-index:30;
 background:
 radial-gradient(circle at 50% 45%,#26174b55,transparent 45%);
}

.emptyIcon{
 width:78px;
 height:78px;
 display:grid;
 place-items:center;
 border-radius:25px;
 background:#ffffff0b;
 border:1px solid #ffffff16;
 font-size:34px;
 margin-bottom:15px;
}

.empty h2{
 margin:0 0 7px;
 font-size:20px;
}

.empty p{
 margin:0;
 color:#888;
 font-size:12px;
}

.uploads{
 display:flex;
 gap:8px;
 margin-top:18px;
}

.uploadBtn{
 height:43px;
 padding:0 15px;
 border:1px solid #ffffff15;
 border-radius:14px;
 background:#ffffff09;
 color:#fff;
 font-size:12px;
 font-weight:700;
}

.uploadBtn.main{
 background:linear-gradient(135deg,#9878ff,#6847dc);
 border:0;
}

/* CONTROLS */

.controls{
 position:absolute;
 left:10px;
 right:10px;
 bottom:0;
 height:204px;
 z-index:40;
 padding:6px 4px 11px;
}

.message{
 height:48px;
 display:flex;
 align-items:center;
 padding:5px;
 gap:5px;
 background:#ffffff08;
 border:1px solid #ffffff13;
 border-radius:17px;
 backdrop-filter:blur(18px);
}

textarea{
 flex:1;
 min-width:0;
 height:37px;
 padding:9px;
 border:0;
 outline:0;
 resize:none;
 background:transparent;
 color:white;
 font-size:13px;
}

textarea::placeholder{
 color:#777;
}

.play{
 width:43px;
 height:38px;
 border:0;
 border-radius:12px;
 background:#8e6cff;
 color:white;
 font-size:17px;
}

.scroll{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:7px 0;
 scrollbar-width:none;
}

.scroll::-webkit-scrollbar{
 display:none;
}

.chip{
 flex:0 0 auto;
 padding:8px 12px;
 border-radius:18px;
 border:1px solid #ffffff10;
 background:#ffffff07;
 color:#aaa;
 font-size:10px;
 white-space:nowrap;
}

.chip.active{
 color:#fff;
 border-color:#9274ff;
 background:#9274ff20;
}

.actions{
 display:flex;
 gap:7px;
}

.generate{
 flex:1;
 height:45px;
 border:0;
 border-radius:15px;
 color:white;
 font-weight:900;
 font-size:12px;
 background:linear-gradient(135deg,#9877ff,#6745dc);
 box-shadow:0 12px 30px #7655ff33;
}

.record{
 width:49px;
 height:45px;
 border-radius:15px;
 border:1px solid #ffffff14;
 background:#ffffff08;
 color:white;
 font-size:18px;
}

.record.active{
 background:#ff315022;
 border-color:#ff3150;
 animation:pulse 1s infinite;
}

@keyframes pulse{
 50%{
  box-shadow:0 0 0 7px #ff315018;
 }
}

/* SHARE PANEL */

.share{
 position:absolute;
 left:14px;
 right:14px;
 bottom:14px;
 z-index:200;
 padding:16px;
 border-radius:23px;
 background:#14141deb;
 border:1px solid #ffffff18;
 backdrop-filter:blur(25px);
 box-shadow:0 25px 80px #000d;
 display:none;
}

.share.show{
 display:block;
}

.shareTitle{
 font-size:15px;
 font-weight:900;
 margin-bottom:5px;
}

.shareSub{
 color:#888;
 font-size:10px;
 margin-bottom:12px;
}

.shareMain{
 width:100%;
 height:48px;
 border:0;
 border-radius:15px;
 background:linear-gradient(135deg,#9b79ff,#6744df);
 color:white;
 font-size:13px;
 font-weight:900;
 margin-bottom:8px;
}

.shareGrid{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:7px;
}

.shareBtn{
 height:40px;
 border:1px solid #ffffff12;
 border-radius:13px;
 background:#ffffff09;
 color:#fff;
 font-size:10px;
 font-weight:700;
}

.close{
 width:100%;
 height:32px;
 margin-top:8px;
 border:0;
 border-radius:11px;
 background:#ffffff06;
 color:#888;
 font-size:10px;
}

/* LOADER */

.loader{
 position:absolute;
 inset:0;
 z-index:500;
 display:none;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 background:#050507ee;
 backdrop-filter:blur(18px);
}

.loader.show{
 display:flex;
}

.spinner{
 width:43px;
 height:43px;
 border:3px solid #ffffff14;
 border-top-color:#9a79ff;
 border-radius:50%;
 animation:spin .8s linear infinite;
}

@keyframes spin{
 to{
  transform:rotate(360deg);
 }
}

.loaderText{
 margin-top:13px;
 color:#aaa;
 font-size:12px;
}

/* TOAST */

.toast{
 position:absolute;
 z-index:600;
 left:50%;
 bottom:215px;
 transform:translate(-50%,20px);
 padding:10px 15px;
 border-radius:20px;
 background:#17171d;
 border:1px solid #ffffff15;
 color:#fff;
 font-size:11px;
 opacity:0;
 transition:.25s;
 white-space:nowrap;
 pointer-events:none;
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

#file{
 display:none;
}

#camera{
 display:none;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

 <div class="logo">
   AZ<span>Avatar</span>
 </div>

 <div class="status">
   <i></i> AI AVATAR
 </div>

</header>


<section class="stage">

 <canvas id="canvas"></canvas>

 <div class="topbar">

   <div class="badge">
     ✨ TALKING AVATAR
   </div>

   <div id="faceStatus" class="faceStatus">
     Hazırdır
   </div>

 </div>


 <div id="empty" class="empty">

   <div class="emptyIcon">
     ✦
   </div>

   <h2>Danışan avatarını yarat</h2>

   <p>
     Şəkil əlavə et, mesaj yaz və videonu paylaş
   </p>

   <div class="uploads">

     <button
       class="uploadBtn main"
       onclick="openFile()">
       📷 Şəkil seç
     </button>

     <button

       onclick="openCamera()">

 </div>

<section class="controls">

 <div class="message">

     id="message"
     maxlength="140"
     placeholder="Avatarın nə desin?"

   <button

     onclick="startTalking()">

   </button>

 </div>


 <div class="scroll">

   <button
     class="chip"
     onclick="setText('Salam! Səni görməyə çox şadam ❤️')">
     ❤️ Salam
   </button>

   <button
     class="chip"
     onclick="setText('Ad günün mübarək! 🎂🎉')">
     🎂 Ad günü
   </button>

   <button
     class="chip"
     onclick="setText('Səni gözləyirəm! 😎')">
     😎 Gözləyirəm
   </button>

   <button
     class="chip"
     onclick="setText('Bu gün əla gün olacaq! 🔥')">
     🔥 Motivasiya
   </button>

   <button
     class="chip"
     onclick="setText('Mənə bax! 😂')">
     😂 Gülməli
   </button>

 </div>


 <div class="scroll">

   <button
     class="chip active"
     data-style="cinema">
     🎬 Cinema
   </button>

   <button

     data-style="football">
     ⚽ Football
   </button>

   <button

     data-style="king">
     👑 King
   </button>

   <button

   <button

   </button>

 </div>


 <div class="actions">

   <button

     onclick="startTalking()">
     ✨ AVATARI DANIŞDIR

   <button

     ●
   </button>

 </div>

</section>


<!-- SHARE -->

<div id="share" class="share">

 <div class="shareTitle">
   🎉 Video hazırdır
 </div>

 <div class="shareSub">
   Videonu WhatsApp, Telegram, Instagram və digər tətbiqlərə göndər
 </div>

 <button
   class="shareMain"
   onclick="shareVideo()">
   📤 WHATSAPP / TELEGRAM / DİGƏRİ — PAYLAŞ
 </button>

 <div class="shareGrid">

   <button
     class="shareBtn"
     onclick="shareVideo()">
     🟢 WhatsApp
   </button>

   <button
     class="shareBtn"
     onclick="shareVideo()">
     ✈️ Telegram
   </button>

   <button
     class="shareBtn"
     onclick="shareVideo()">
     📸 Instagram
   </button>

 </div>

 <button
   class="close"
   onclick="closeShare()">
   Bağla
 </button>

</div>


<div id="loader" class="loader">

 <div class="spinner"></div>

 <div id="loaderText" class="loaderText">
   Üz analiz edilir...
 </div>

</div>


<div id="toast" class="toast"></div>


<input
 id="file"
 type="file"
 accept="image/*"
>

<video
 id="camera"
 playsinline
 muted>
</video>

</div>


<script type="module">

/* =========================================================
   MEDIAPIPE
========================================================= */

import {
 FilesetResolver,
 FaceLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm";


/* =========================================================
   ELEMENTS
========================================================= */

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

const file=
document.getElementById("file");

const camera=
document.getElementById("camera");

const empty=
document.getElementById("empty");

const faceStatus=
document.getElementById("faceStatus");

const loader=
document.getElementById("loader");

const loaderText=
document.getElementById("loaderText");

const message=
document.getElementById("message");

const share=
document.getElementById("share");

const recordButton=
document.getElementById("record");

const toast=
document.getElementById("toast");


/* =========================================================
   CANVAS
========================================================= */

canvas.width=720;
canvas.height=1280;


/* =========================================================
   VARIABLES
========================================================= */

let img=null;

let faceLandmarker=null;

let landmarks=null;

let currentStyle="cinema";

let speaking=false;

let words=[];

let wordIndex=0;

let wordStart=0;

let recorder=null;

let chunks=[];

let lastVideo=null;

let cameraStream=null;

let animationFrame=0;


/* =========================================================
   FILE
========================================================= */

window.openFile=()=>{
 file.click();
};


file.addEventListener("change",e=>{

 const selected=e.target.files[0];

 if(!selected)return;

 const reader=
 new FileReader();

 reader.onload=()=>{

   img=new Image();

   img.onload=async()=>{

     empty.style.display="none";

     faceStatus.textContent=
       "Üz analiz olunur...";

     await analyzeFace();

     draw();

   };

   img.src=reader.result;

 };

 reader.readAsDataURL(selected);

});


/* =========================================================
   CAMERA
========================================================= */

window.openCamera=async()=>{

 try{

   cameraStream=
   await navigator.mediaDevices.getUserMedia({

     video:{
       facingMode:"user",
       width:{ideal:720},
       height:{ideal:1280}
     },

     audio:false

   });

   camera.srcObject=
   cameraStream;

   await camera.play();

   const temp=
   document.createElement("canvas");

   temp.width=
   camera.videoWidth;

   temp.height=
   camera.videoHeight;

   const tc=
   temp.getContext("2d");

   tc.drawImage(
     camera,
     0,
     0,
     temp.width,
     temp.height
   );

   const data=
   temp.toDataURL(
     "image/jpeg",
     .94
   );

   img=new Image();

   img.onload=async()=>{

     empty.style.display="none";

     await analyzeFace();

     draw();

     stopCamera();

   };

   img.src=data;

 }catch(e){

   showToast(
     "Kamera icazəsi verilmədi"
   );

 }

};


function stopCamera(){

 if(!cameraStream)return;

 cameraStream
 .getTracks()
 .forEach(track=>track.stop());

 cameraStream=null;

}


/* =========================================================
   FACE MODEL
========================================================= */

async function loadFaceModel(){

 if(faceLandmarker)
   return;

 try{

   loader.classList.add("show");

   loaderText.textContent=
     "AI üz modeli yüklənir...";

   const vision=
   await FilesetResolver.forVisionTasks(
     "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"
   );

   faceLandmarker=
   await FaceLandmarker.createFromOptions(
     vision,
     {

       baseOptions:{
         modelAssetPath:
         "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
       },

       runningMode:"IMAGE",

       numFaces:1,

       minFaceDetectionConfidence:.4,

       minFacePresenceConfidence:.4,

       minTrackingConfidence:.4

     }
   );

   loader.classList.remove("show");

 }catch(error){

   console.log(error);

   loader.classList.remove("show");

   showToast(
     "AI modeli yüklənmədi"
   );

 }

}


/* =========================================================
   ANALYZE FACE
========================================================= */

async function analyzeFace(){

 await loadFaceModel();

 if(!faceLandmarker){

   faceStatus.textContent=
     "Smart rejim";

   return;

 }

 try{

   const result=
   faceLandmarker.detect(img);

   if(
     result &&
     result.faceLandmarks &&
     result.faceLandmarks.length
   ){

     landmarks=
     result.faceLandmarks[0];

     faceStatus.textContent=
       "Üz tapıldı ✓";

   }else{

     landmarks=null;

     faceStatus.textContent=
       "Üz tapılmadı";

   }

 }catch(e){

   landmarks=null;

   faceStatus.textContent=
     "Smart rejim";

 }

}


/* =========================================================
   GET LANDMARK
========================================================= */

function lm(index){

 if(!landmarks)
   return null;

 const p=
 landmarks[index];

 if(!p)
   return null;

 return {

   x:p.x*canvas.width,

   y:p.y*canvas.height

 };

}


/* =========================================================
   MOUTH CENTER
========================================================= */

function mouthPosition(){

 /*
   Upper/lower inner lip.
 */

 const upper=lm(13);
 const lower=lm(14);

 if(upper && lower){

   return {

     x:(upper.x+lower.x)/2,

     y:(upper.y+lower.y)/2

   };

 }

 /*
   fallback
 */

 return {

   x:canvas.width/2,

   y:canvas.height*.61

 };

}


/* =========================================================
   DRAW COVER
========================================================= */

function drawImageCover(){

 const w=canvas.width;
 const h=canvas.height;

 const iw=img.naturalWidth;
 const ih=img.naturalHeight;

 const scale=
 Math.max(
   w/iw,
   h/ih
 );

 const dw=iw*scale;
 const dh=ih*scale;

 const dx=(w-dw)/2;
 const dy=(h-dh)/2;

 ctx.drawImage(
   img,
   dx,
   dy,
   dw,
   dh
 );

}


/* =========================================================
   DRAW
========================================================= */

function draw(now=performance.now()){

 const w=canvas.width;
 const h=canvas.height;


 /* BACKGROUND */

 let bg=
 ctx.createLinearGradient(
   0,
   0,
   w,
   h
 );


 if(currentStyle==="football"){

   bg.addColorStop(0,"#031b10");
   bg.addColorStop(.5,"#075b31");
   bg.addColorStop(1,"#010503");

 }else if(currentStyle==="king"){

   bg.addColorStop(0,"#291700");
   bg.addColorStop(.5,"#925c00");
   bg.addColorStop(1,"#080400");

 }else if(currentStyle==="hero"){

   bg.addColorStop(0,"#061737");
   bg.addColorStop(.5,"#17539c");
   bg.addColorStop(1,"#02050c");

 }else if(currentStyle==="robot"){

   bg.addColorStop(0,"#101920");
   bg.addColorStop(.5,"#3a4a54");
   bg.addColorStop(1,"#020405");

 }else{

   bg.addColorStop(0,"#281650");
   bg.addColorStop(.5,"#111225");
   bg.addColorStop(1,"#030306");

 }

 ctx.fillStyle=bg;

 ctx.fillRect(
   0,
   0,
   w,
   h
 );


 if(img){

   /*
      Very small cinematic movement.
      The photo remains the actual face.
   */

   const movement=
   speaking
   ?
   Math.sin(now/700)*3
   :
   0;

   ctx.save();

   ctx.translate(
     0,
     movement
   );

   drawImageCover();

   ctx.restore();


   /* CINEMATIC SHADE */

   const shade=
   ctx.createLinearGradient(
     0,
     0,
     0,
     h
   );

   shade.addColorStop(
     0,
     "rgba(0,0,0,.08)"
   );

   shade.addColorStop(
     .55,
     "rgba(0,0,0,0)"
   );

   shade.addColorStop(
     1,
     "rgba(0,0,0,.76)"
   );

   ctx.fillStyle=shade;

   ctx.fillRect(
     0,
     0,
     w,
     h
   );


   drawStyle();


   /*
      IMPORTANT:
      NO CIRCLE OVER THE MOUTH.
      We only calculate the real mouth
      position for word animation.
   */

   drawTalkingEffect(now);

   drawCurrentWord(now);

 }


 /* BRAND */

 ctx.save();

 ctx.textAlign="center";

 ctx.font=
 "900 29px Arial";

 ctx.fillStyle=
 "#ffffffee";

 ctx.fillText(
   "AZAvatar",
   w/2,
   h-75
 );

 ctx.font=
 "500 15px Arial";

 ctx.fillStyle=
 "#ffffff80";

 ctx.fillText(
   "Sənin avatarın. Sənin mesajın.",
   w/2,
   h-47
 );

 ctx.restore();


 /* WATERMARK */

 ctx.save();

 ctx.textAlign="right";

 ctx.font=
 "600 15px Arial";

 ctx.fillStyle=
 "#ffffff66";

 ctx.fillText(
   "Made with AZAvatar",
   w-38,
   57
 );

 ctx.restore();

}


/* =========================================================
   TALKING EFFECT
========================================================= */

function drawTalkingEffect(now){

 /*
    No artificial black circle.

    Instead we create a very subtle
    highlight/shadow around the actual
    lip position.

    This keeps the user's face visible.
 */

 if(!speaking)
   return;

 const m=
 mouthPosition();

 const wave=
 Math.abs(
   Math.sin(now/75)
 );

 /*
    extremely subtle lip animation
 */

 ctx.save();

 ctx.globalAlpha=
   .08+wave*.06;

 const gradient=
 ctx.createRadialGradient(
   m.x,
   m.y,
   1,
   m.x,
   m.y,
   55
 );

 gradient.addColorStop(
   0,
   "#ffffff"
 );

 gradient.addColorStop(
   1,
   "transparent"
 );

 ctx.fillStyle=gradient;

 ctx.beginPath();

 ctx.arc(
   m.x,
   m.y,
   55,
   0,
   Math.PI*2
 );

 ctx.fill();

 ctx.restore();

}


/* =========================================================
   WORD
========================================================= */

function drawCurrentWord(now){

 if(
   !speaking ||
   !words.length
 )
 return;


 const current=
 words[
   Math.min(
     wordIndex,
     words.length-1
   )
 ];


 const elapsed=
 now-wordStart;

 const progress=
 Math.min(
   elapsed/700,
   1
 );


 const m=
 mouthPosition();


 /*
   Word starts EXACTLY from mouth.
 */

 const startX=m.x;
 const startY=m.y-5;


 /*
   It moves upward and slightly forward.
 */

 const x=
 startX+
 Math.sin(progress*Math.PI)*8;

 const y=
 startY-
 progress*135;


 const scale=
 1+
 Math.sin(progress*Math.PI)*.16;


 ctx.save();

 ctx.translate(
   x,
   y
 );

 ctx.scale(
   scale,
   scale
 );

 ctx.textAlign="center";

 ctx.font=
 "900 43px Arial";

 /*
   shadow only
 */

 ctx.shadowColor=
 "rgba(0,0,0,.8)";

 ctx.shadowBlur=14;

 ctx.lineWidth=7;

 ctx.strokeStyle=
 "rgba(0,0,0,.65)";

 ctx.strokeText(
   current,
   0,
   0
 );

 ctx.shadowBlur=0;

 ctx.fillStyle=
 "#ffffff";

 ctx.fillText(
   current,
   0,
   0
 );

 ctx.restore();

}


/* =========================================================
   STYLE
========================================================= */

function drawStyle(){

 const w=canvas.width;
 const h=canvas.height;

 ctx.save();


 if(currentStyle==="football"){

   ctx.strokeStyle=
     "rgba(70,255,160,.55)";

   ctx.lineWidth=4;

   ctx.beginPath();

   ctx.arc(
     w/2,
     h*.86,
     135,
     0,
     Math.PI*2
   );

   ctx.stroke();

   ctx.font="55px Arial";

   ctx.textAlign="center";

   ctx.fillText(
     "⚽",
     w/2,
     h*.90
   );

 }


 if(currentStyle==="king"){

   ctx.font="72px Arial";

   ctx.textAlign="center";

   ctx.fillText(
     "👑",
     w/2,
     115
   );

 }


 if(currentStyle==="hero"){

   ctx.strokeStyle=
     "rgba(90,170,255,.34)";

   ctx.lineWidth=3;

   for(
     let i=0;
     i<8;
     i++
   ){

     const y=
       170+i*105;

     ctx.beginPath();

     ctx.moveTo(
       0,
       y
     );

     ctx.lineTo(
       w,
       y-90
     );

     ctx.stroke();

   }

 }


 if(currentStyle==="robot"){

   ctx.strokeStyle=
     "rgba(75,220,255,.35)";

   ctx.lineWidth=3;

   ctx.strokeRect(
     60,
     105,
     w-120,
     h-210
   );

 }


 ctx.restore();

}


/* =========================================================
   START TALKING
========================================================= */

window.startTalking=()=>{

 if(!img){

   showToast(
     "Əvvəlcə şəkil əlavə et"
   );

   return;

 }

 const text=
 message.value.trim();

 if(!text){

   showToast(
     "Avatarın deyəcəyi mətni yaz"
   );

   return;

 }

 words=
 text
 .replace(
   /[.,!?;:()[\]{}]/g,
   " "
 )
 .split(/\s+/)
 .filter(Boolean);

 wordIndex=0;

 wordStart=
 performance.now();

 speaking=true;

 cancelAnimationFrame(
   animationFrame
 );

 animationFrame=
 requestAnimationFrame(
   talkLoop
 );

};


/* =========================================================
   TALK LOOP
========================================================= */

function talkLoop(now){

 draw(now);

 if(!speaking)
   return;

 const current=
 words[
   Math.min(
     wordIndex,
     words.length-1
   )
 ];

 const duration=
 Math.max(
   390,
   Math.min(
     850,
     current.length*65
   )
 );

 if(
   now-wordStart >
   duration
 ){

   wordIndex++;

   wordStart=now;

   if(
     wordIndex>=words.length
   ){

     speaking=false;

     draw();

     return;

   }

 }

 animationFrame=
 requestAnimationFrame(
   talkLoop
 );

}


/* =========================================================
   STYLE BUTTONS
========================================================= */

document
.querySelectorAll("[data-style]")
.forEach(button=>{

 button.addEventListener(
   "click",
   ()=>{

     document
     .querySelectorAll(
       "[data-style]"
     )
     .forEach(x=>{
       x.classList.remove(
         "active"
       );
     });

     button.classList.add(
       "active"
     );

     currentStyle=
       button.dataset.style;

     draw();

   }
 );

});


/* =========================================================
   TEXT
========================================================= */

window.setText=text=>{

 message.value=text;

 startTalking();

};


/* =========================================================
   RECORD
========================================================= */

window.recordVideo=()=>{

 if(!img){

   showToast(
     "Əvvəlcə şəkil əlavə et"
   );

   return;

 }


 if(
   recorder &&
   recorder.state==="recording"
 ){

   recorder.stop();

   return;

 }


 chunks=[];


 const stream=
 canvas.captureStream(30);


 let mime=
 "video/webm";


 if(
   MediaRecorder.isTypeSupported(
     "video/webm;codecs=vp9"
   )
 ){

   mime=
   "video/webm;codecs=vp9";

 }else if(
   MediaRecorder.isTypeSupported(
     "video/webm;codecs=vp8"
   )
 ){

   mime=
   "video/webm;codecs=vp8";

 }


 recorder=
 new MediaRecorder(
   stream,
   {
     mimeType:mime,
     videoBitsPerSecond:6000000
   }
 );


 recorder.ondataavailable=
 e=>{

   if(e.data.size>0)
     chunks.push(e.data);

 };


 recorder.onstop=()=>{

   lastVideo=
   new Blob(
     chunks,
     {
       type:mime
     }
   );


   recordButton
   .classList.remove(
     "active"
   );


   share
   .classList.add(
     "show"
   );


   showToast(
     "Video hazırdır ✓"
   );

 };


 recorder.start();


 recordButton
 .classList.add(
   "active"
 );


 /*
    Make the avatar speak
 */

 startTalking();


 /*
    10 seconds
 */

 setTimeout(()=>{

   if(
     recorder &&
     recorder.state==="recording"
   ){

     recorder.stop();

   }

 },10000);

};


/* =========================================================
   SHARE
========================================================= */

window.shareVideo=async()=>{

 if(!lastVideo){

   showToast(
     "Əvvəlcə video yarat"
   );

   return;

 }


 const videoFile=
 new File(
   [lastVideo],
   "AZAvatar.webm",
   {
     type:lastVideo.type
   }
 );


 /*
   Android Chrome / compatible browsers
   open native share sheet.
 */

 if(
   navigator.share
 ){

   try{

     /*
       Check file sharing support
     */

     if(
       navigator.canShare &&
       navigator.canShare({
         files:[videoFile]
       })
     ){

       await navigator.share({

         title:
         "Mənim AZAvatar videom",

         text:
         "Mənim danışan avatarıma bax 👀",

         files:[
           videoFile
         ]

       });

       return;

     }


     /*
       If file sharing isn't supported,
       share text + site URL.
     */

     await navigator.share({

       title:
       "AZAvatar",

       text:
       "Mənim AZAvatar mesajıma bax 👀",

       url:
       location.href

     });

     return;

   }catch(error){

     /*
       User cancelled share:
       don't show error.
     */

     if(
       error.name==="AbortError"
     )
       return;

   }

 }


 /*
   Fallback
 */

 downloadVideo();

 showToast(
   "Video telefona yadda saxlanıldı"
 );

};


/* =========================================================
   DOWNLOAD
========================================================= */

window.downloadVideo=()=>{

 if(!lastVideo){

   showToast(
     "Video yoxdur"
   );

   return;

 }


 const url=
 URL.createObjectURL(
   lastVideo
 );


 const a=
 document.createElement("a");

 a.href=url;

 a.download=
 "AZAvatar-"+Date.now()+".webm";

 document.body.appendChild(a);

 a.click();

 a.remove();


 setTimeout(
   ()=>{
     URL.revokeObjectURL(
       url
     );
   },
   1500
 );

};


/* =========================================================
   CLOSE SHARE
========================================================= */

window.closeShare=()=>{

 share.classList.remove(
   "show"
 );

};

   TOAST
========================================================= */

function showToast(text){

 toast.textContent=text;

 toast.classList.add(
   "show"

 setTimeout(
   ()=>{

       "show"
     );

 );

}
