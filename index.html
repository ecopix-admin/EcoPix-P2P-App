<!-- AzGram v100 - Full -->
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="AzGram — P2P mesajlaşma və status platforması">
<title>AzGram</title>

<link rel="manifest" id="manifest">

<style>
:root{
 --black:#000;
 --panel:#111;
 --panel2:#151515;
 --input:#222;
 --line:#292929;
 --text:#fff;
 --muted:#999;
 --green:#20d66b;
 --blue:#1687ff;
 --red:#ff3b5c;
 --yellow:#ffc107;
 --radius:16px;
 --ease:.2s ease;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
overflow:hidden}
button,input,textarea{font:inherit}
button{border:0;color:#fff;cursor:pointer}
button:active{transform:scale(.96)}
img,video{max-width:100%}
.hidden{display:none!important}
.app{height:100dvh;width:100%;position:relative;background:#000}
.loading{position:fixed;inset:0;background:#000;z-index:9999;display:flex;
align-items:center;justify-content:center;flex-direction:column;gap:15px}
.logo{font-size:35px;font-weight:900;letter-spacing:-2px}
.logo span{color:var(--green)}
.spinner{width:30px;height:30px;border:3px solid #333;border-top-color:#fff;
border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.screen{position:absolute;inset:0;display:none;overflow:hidden;background:#000}
.screen.active{display:block}

.topbar{height:62px;background:#000;border-bottom:1px solid #181818;
display:flex;align-items:center;padding:0 12px;gap:10px;position:relative;z-index:20}
.topbar .logo{font-size:24px}
.top-actions{margin-left:auto;display:flex;gap:5px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:transparent;
display:flex;align-items:center;justify-content:center;font-size:20px;transition:var(--ease)}
.icon-btn:hover{background:#191919}
.search-mini{flex:1;background:var(--input);border-radius:22px;height:42px;
border:1px solid #292929;color:#fff;padding:0 15px;outline:none}
.search-mini:focus{border-color:#444}

.content{height:calc(100% - 62px);overflow:auto;padding-bottom:80px}
.content::-webkit-scrollbar,.feed::-webkit-scrollbar,.chat-messages::-webkit-scrollbar{display:none}

.bottom-nav{position:absolute;z-index:100;bottom:0;left:0;right:0;height:70px;
background:rgba(0,0,0,.94);backdrop-filter:blur(18px);
border-top:1px solid #202020;display:flex;justify-content:space-around;
padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;background:none;color:#777;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:4px;font-size:11px;transition:var(--ease)}
.nav-item .ni{font-size:22px}
.nav-item.active{color:#fff}
.nav-item.active .ni{transform:scale(1.08)}

.btn{background:#222;padding:11px 16px;border-radius:12px;transition:var(--ease)}
.btn.primary{background:#fff;color:#000;font-weight:700}
.btn.green{background:var(--green);color:#000;font-weight:700}
.btn.danger{background:#3b1117;color:#ff5b75}
.btn.small{padding:7px 10px;font-size:12px}
input,textarea{background:#222;color:#fff;border:1px solid #292929;outline:none;
border-radius:12px;padding:12px}
textarea{resize:none}

.onboard{position:fixed;inset:0;background:#000;z-index:10000;display:flex;
align-items:center;justify-content:center;padding:25px}
.onboard-card{width:min(430px,100%);text-align:center}
.onboard-card h1{font-size:38px;margin:0 0 8px}
.onboard-card p{color:#888}
.onboard-card input{width:100%;margin:20px 0 10px}

.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#222;
border:1px solid #333}
.avatar.big{width:85px;height:85px}
.avatar.xl{width:110px;height:110px}
.avatar-wrap{position:relative;display:inline-block}
.online-dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;
border-radius:50%;background:#555;border:2px solid #000}
.online-dot.online{background:#20d66b}

.chat-list{padding:5px 0}
.chat-row{display:flex;align-items:center;gap:12px;padding:12px 15px;
transition:var(--ease);border-bottom:1px solid #111;position:relative}
.chat-row:hover{background:#0e0e0e}
.chat-info{min-width:0;flex:1}
.chat-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-preview{font-size:13px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:#666}
.pin{color:#aaa;margin-right:5px}
.empty{text-align:center;color:#666;padding:70px 20px}
.empty-icon{font-size:60px;margin-bottom:15px}

.contact-header{padding:18px 15px 8px;display:flex;justify-content:space-between;
align-items:center}
.contact-header h2{margin:0}
.contact-search{margin:5px 15px 10px;width:calc(100% - 30px)}
.contact-actions{display:flex;gap:7px}

.status-screen{height:100%;position:relative;background:#000}
.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;
scroll-behavior:smooth}
.status-slide{height:100%;min-height:100dvh;position:relative;scroll-snap-align:start;
scroll-snap-stop:always;background:#090909;overflow:hidden}
.status-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.status-bg{position:absolute;inset:0;background:linear-gradient(180deg,
rgba(0,0,0,.35),transparent 35%,transparent 65%,rgba(0,0,0,.8))}
.status-top{position:absolute;top:18px;left:15px;right:15px;z-index:4;
display:flex;align-items:center;gap:10px}
.status-user{font-weight:700}
.status-age{font-size:11px;color:#ddd}
.status-body{position:absolute;left:15px;right:90px;bottom:92px;z-index:4}
.status-text{font-size:19px;line-height:1.35;text-shadow:0 2px 5px #000}
.status-tags{color:#72a9ff;margin-top:8px}
.status-music{margin-top:8px;font-size:13px}
.status-side{position:absolute;right:12px;bottom:90px;z-index:5;
display:flex;flex-direction:column;gap:18px;align-items:center}
.side-action{background:transparent;display:flex;flex-direction:column;align-items:center;
gap:3px;text-shadow:0 2px 5px #000}
.side-action .si{font-size:30px}
.side-action small{font-size:11px}
.liked{animation:heart .35s ease}
@keyframes heart{50%{transform:scale(1.45)}}
.double-heart{position:absolute;font-size:100px;z-index:8;left:50%;top:50%;
transform:translate(-50%,-50%);animation:dh .8s ease forwards;pointer-events:none}
@keyframes dh{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.ad-badge{position:absolute;right:15px;top:18px;background:#fff;color:#000;
font-size:10px;padding:5px 8px;border-radius:6px;font-weight:800}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;
display:none;align-items:flex-end}
.modal.show{display:flex}
.modal-card{width:100%;max-height:92dvh;background:#111;border-radius:22px 22px 0 0;
padding:18px;overflow:auto;border-top:1px solid #333}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-head h3{margin:0}
.form{display:flex;flex-direction:column;gap:10px}
.form input,.form textarea,.form select{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}

.chat-screen{position:absolute;inset:0;background:#000;z-index:200;display:none}
.chat-screen.open{display:flex;flex-direction:column}
.chat-header{height:62px;flex:none;border-bottom:1px solid #202020;
display:flex;align-items:center;gap:9px;padding:0 8px}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:700}
.chat-header-status{font-size:11px;color:#777}
.chat-messages{flex:1;overflow-y:auto;padding:12px 10px;display:flex;
flex-direction:column;gap:4px}
.message-wrap{display:flex;max-width:85%;position:relative}
.message-wrap.mine{align-self:flex-end}
.message-wrap.theirs{align-self:flex-start}
.bubble{background:#191919;border-radius:17px 17px 17px 4px;padding:8px 10px;
word-break:break-word;min-width:55px;position:relative}
.mine .bubble{background:#123d27;border-radius:17px 17px 4px 17px}
.message-text{white-space:pre-wrap}
.message-meta{font-size:9px;color:#888;text-align:right;margin-top:3px}
.mine .message-meta{color:#9adbb7}
.tick.read{color:#39a8ff}
.reply-box{border-left:3px solid var(--green);background:#101010;padding:5px;
margin-bottom:5px;font-size:11px;color:#aaa}
.msg-image,.msg-video{display:block;border-radius:12px;max-height:300px;margin-bottom:5px}
.audio-msg{width:210px}
.typing{height:22px;color:#777;font-size:11px;padding-left:12px;flex:none}
.composer{padding:7px;display:flex;gap:6px;background:#0b0b0b;border-top:1px solid #222;
padding-bottom:calc(7px + env(safe-area-inset-bottom))}
.composer-input{flex:1;min-width:0;max-height:100px;border-radius:22px}
.send-btn{width:44px;height:44px;border-radius:50%;background:var(--green);color:#000}
.attach-btn{width:40px;height:40px;border-radius:50%;background:#222}
.recording{background:#8e1022!important}

.context-menu{position:fixed;z-index:1000;background:#191919;border:1px solid #333;
border-radius:12px;overflow:hidden;min-width:180px;box-shadow:0 10px 40px #000}
.context-menu button{display:block;width:100%;background:none;text-align:left;padding:12px}
.context-menu button:hover{background:#252525}

.search-screen{padding-bottom:80px}
.global-search{position:sticky;top:0;z-index:10;background:#000;padding:10px}
.global-search input{width:100%;border-radius:25px}
.tabs{display:flex;border-bottom:1px solid #222;overflow:auto}
.tab{background:none;padding:12px 17px;color:#777;white-space:nowrap}
.tab.active{color:#fff;border-bottom:2px solid #fff}
.result{padding:12px 15px;border-bottom:1px solid #151515}
.result-title{font-weight:700}
.result-text{font-size:13px;color:#888;margin-top:3px}
.history{padding:15px}
.history-item{display:flex;justify-content:space-between;padding:9px 0;color:#aaa}

.profile{padding-bottom:100px}
.profile-head{text-align:center;padding:30px 15px 20px}
.profile-name{font-size:23px;font-weight:800;margin-top:10px}
.profile-bio{color:#888;margin:7px 0 15px}
.profile-stats{display:flex;justify-content:center;gap:30px}
.stat{text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#777}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.profile-grid img,.profile-grid video{width:100%;aspect-ratio:1;object-fit:cover;background:#111}

.menu-list button{display:block;width:100%;background:none;text-align:left;padding:15px;
border-bottom:1px solid #222}

.toast{position:fixed;z-index:5000;left:50%;bottom:85px;transform:translateX(-50%);
background:#eee;color:#000;padding:10px 15px;border-radius:20px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
.toast.show{opacity:1}

.viewer{position:fixed;inset:0;background:#000;z-index:2000;display:none;
align-items:center;justify-content:center}
.viewer.show{display:flex}
.viewer img{max-width:95%;max-height:90%}
.viewer .close{position:absolute;top:15px;right:15px}

.reaction{font-size:22px}
.long-text{white-space:pre-wrap}
.more-link{color:#7bb7ff;font-size:12px;cursor:pointer}

@media(min-width:700px){
 .app{max-width:650px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}
 .modal-card{max-width:650px;margin:auto}
}
</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="logo">Az<span>Gram</span></div>
  <div class="spinner"></div>
</div>

<div id="onboard" class="onboard hidden">
  <div class="onboard-card">
    <div class="logo">Az<span>Gram</span></div>
    <h1>Xoş gəlmisən</h1>
    <p>AzGram istifadəçi adını daxil et.</p>
    <input id="firstName" maxlength="40" placeholder="Adınız">
    <button class="btn primary" style="width:100%" onclick="finishOnboard()">Davam et</button>
  </div>
</div>

<div class="app" id="app">

  <!-- MESAJLAR -->
  <section id="messagesScreen" class="screen active">
    <header class="topbar">
      <div class="logo">Az<span>Gram</span></div>
      <input class="search-mini" id="miniSearch" placeholder="Axtar..." oninput="filterContacts(this.value)">
      <div class="top-actions">
        <button class="icon-btn" onclick="showMenu()">⋮</button>
      </div>
    </header>
    <div class="content">
      <div class="contact-header">
        <h2>Mesajlar <small id="contactCount" style="color:#666;font-size:12px"></small></h2>
        <div class="contact-actions">
          <button class="btn small" onclick="openAddContact()">＋ Kontakt</button>
          <button class="icon-btn" onclick="openGroup()">👥</button>
        </div>
      </div>
      <div id="contactList" class="chat-list"></div>
    </div>
  </section>

  <!-- STATUS -->
  <section id="statusScreen" class="screen">
    <div class="status-screen">
      <div class="feed" id="statusFeed"></div>
      <div class="topbar" style="position:absolute;top:0;left:0;right:0;background:linear-gradient(#000,transparent);border:0;z-index:20">
        <div class="logo">Status</div>
        <div class="top-actions">
          <button class="icon-btn" onclick="openStatusCreator()">＋</button>
          <button class="icon-btn" onclick="refreshFeed()">↻</button>
        </div>
      </div>
    </div>
  </section>

  <!-- SEARCH -->
  <section id="searchScreen" class="screen search-screen">
    <div class="global-search">
      <div class="row">
        <input id="globalSearch" placeholder="🔍 İnsan, #hashtag, mətn axtar..."
               oninput="globalSearch(this.value)" style="flex:1">
        <button class="icon-btn" onclick="voiceSearch()">🎙</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="all" onclick="setSearchTab('all',this)">Hamısı</button>
      <button class="tab" data-tab="users" onclick="setSearchTab('users',this)">İstifadəçilər</button>
      <button class="tab" data-tab="statuses" onclick="setSearchTab('statuses',this)">Statuslar</button>
      <button class="tab" data-tab="messages" onclick="setSearchTab('messages',this)">Mesajlar</button>
    </div>
    <div id="searchResults"></div>
    <div id="searchHistory" class="history"></div>
  </section>

  <!-- PROFİL -->
  <section id="profileScreen" class="screen">
    <header class="topbar">
      <div class="logo">Profil</div>
      <div class="top-actions">
        <button class="icon-btn" onclick="editProfile()">⚙</button>
        <button class="icon-btn" onclick="showMenu()">⋮</button>
      </div>
    </header>
    <div class="content profile" id="profileContent"></div>
  </section>

  <!-- BOTTOM -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="messagesScreen" onclick="goScreen('messagesScreen',this)">
      <span class="ni">💬</span><span>Mesajlar</span>
    </button>
    <button class="nav-item" data-screen="statusScreen" onclick="goScreen('statusScreen',this)">
      <span class="ni">▶</span><span>Status</span>
    </button>
    <button class="nav-item" data-screen="searchScreen" onclick="goScreen('searchScreen',this)">
      <span class="ni">🔍</span><span>Axtar</span>
    </button>
    <button class="nav-item" data-screen="profileScreen" onclick="goScreen('profileScreen',this)">
      <span class="ni">👤</span><span>Profil</span>
    </button>
  </nav>

  <!-- CHAT -->
  <section id="chatScreen" class="chat-screen">
    <header class="chat-header">
      <button class="icon-btn" onclick="closeChat()">‹</button>
      <div id="chatAvatar"></div>
      <div class="chat-header-info">
        <div id="chatName" class="chat-header-name"></div>
        <div id="chatStatus" class="chat-header-status"></div>
      </div>
      <button class="icon-btn" onclick="chatSearch()">🔍</button>
      <button class="icon-btn" onclick="chatMenu()">⋮</button>
    </header>
    <div id="chatMessages" class="chat-messages"></div>
    <div id="typing" class="typing"></div>
    <div class="composer">
      <input type="file" id="mediaInput" accept="image/*,video/*" hidden onchange="sendMedia(this)">
      <button class="attach-btn" onclick="document.getElementById('mediaInput').click()">＋</button>
      <button class="attach-btn" id="recordBtn" onclick="toggleRecording()">🎙</button>
      <textarea id="messageInput" class="composer-input" rows="1" maxlength="10000"
        placeholder="Mesaj..." oninput="typingNow()" onkeydown="messageKey(event)"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </section>

</div>

<div id="modal" class="modal" onclick="modalOuter(event)">
  <div class="modal-card" id="modalCard"></div>
</div>

<div id="toast" class="toast"></div>

<div id="viewer" class="viewer" onclick="closeViewer()">
  <button class="icon-btn close">✕</button>
  <img id="viewerImg" src="">
</div>

<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/lib/radisk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/lib/store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/lib/rindexed.js"></script>

<script>
/* ============================================================
   AzGram v100
   Single-file P2P application
   ============================================================ */

const RELAY = 'https://gun-manhattan.herokuapp.com/gun';

let gun;
try{
  gun = Gun({
    peers:[RELAY],
    localStorage:true,
    radisk:true
  });
}catch(e){
  console.warn('Gun offline',e);
}

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
}[m]));

const now = () => Date.now();

let me = JSON.parse(localStorage.getItem('azgram_me') || 'null');
let contacts = JSON.parse(localStorage.getItem('azgram_contacts') || '{}');
let statuses = JSON.parse(localStorage.getItem('azgram_status_cache') || '{}');
let searchHistory = JSON.parse(localStorage.getItem('azgram_search_history') || '[]');

let currentChat = null;
let currentChatID = null;
let chatMessages = {};
let chatUnsub = null;
let currentReply = null;
let searchTab = 'all';
let mediaRecorder = null;
let recordingChunks = [];
let recordingTimer = null;
let recordingStart = 0;
let typingTimer = null;
let expandedMessages = {};
let globalUsers = {};
let lastFeedBuild = 0;

function userKey(name){
  return btoa(unescape(encodeURIComponent(String(name).trim().toLowerCase())))
    .replace(/=/g,'').replace(/\//g,'_').replace(/\+/g,'-').slice(0,80);
}

function chatID(a,b){
  return [userKey(a),userKey(b)].sort().join('_');
}

function avatarFor(name){
  return 'https://i.pravatar.cc/150?u='+
    encodeURIComponent(String(name).trim().toLowerCase());
}

function bakuDate(ts){
  return new Intl.DateTimeFormat('az-AZ',{
    timeZone:'Asia/Baku',
    hour:'2-digit',minute:'2-digit'
  }).format(new Date(ts));
}

function relativeTime(ts){
  if(!ts)return '';
  const d=Date.now()-Number(ts);
  if(d<60000)return 'indi';
  if(d<3600000)return Math.floor(d/60000)+' dəq əvvəl';
  if(d<86400000)return Math.floor(d/3600000)+' saat əvvəl';
  if(d<172800000)return 'dünən';
  return Math.floor(d/86400000)+' gün əvvəl';
}

function toast(t){
  const el=$('toast');
  el.textContent=t;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.classList.remove('show'),2200);
}

function saveMe(){
  localStorage.setItem('azgram_me',JSON.stringify(me));
}

function saveContacts(){
  localStorage.setItem('azgram_contacts',JSON.stringify(contacts));
}

function saveStatuses(){
  localStorage.setItem('azgram_status_cache',JSON.stringify(statuses));
}

function finishOnboard(){
  const name=$('firstName').value.trim();
  if(!name)return toast('Adınızı yazın');
  me={
    id:userKey(name),
    name,
    avatar:avatarFor(name),
    online:true,
    lastSeen:now(),
    bio:'',
    statusText:'',
    statusTime:0,
    joined:now()
  };
  saveMe();
  $('onboard').classList.add('hidden');
  registerMe();
  boot();
}

function registerMe(){
  if(!me||!gun)return;
  try{
    gun.get('azgram_users_v100').get(me.id).put({
      id:me.id,
      name:me.name,
      avatar:me.avatar,
      online:true,
      lastSeen:now(),
      bio:me.bio||''
    });
  }catch(e){console.warn(e)}
}

function setOffline(){
  if(!me||!gun)return;
  try{
    gun.get('azgram_users_v100').get(me.id).put({
      online:false,
      lastSeen:now()
    });
  }catch(e){}
}

window.addEventListener('beforeunload',setOffline);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)setOffline();
  else registerMe();
});

function boot(){
  $('loading').classList.add('hidden');
  renderProfile();
  loadUsers();
  loadStatuses();
  setInterval(registerMe,30000);
  setInterval(cleanExpiredStatuses,60000);
  setTimeout(()=>showInitialScreen(),500);
}

function showInitialScreen(){
  goScreen('messagesScreen',
    document.querySelector('.nav-item[data-screen="messagesScreen"]'));
}

if(!me){
  $('loading').classList.add('hidden');
  $('onboard').classList.remove('hidden');
}else{
  registerMe();
  boot();
}

/* ============================================================
   1-20 KONTAKTLAR
   ============================================================ */

function loadUsers(){
  if(!gun){
    renderContacts();
    return;
  }

  try{
    gun.get('azgram_users_v100').map().on((u,id)=>{
      if(!u||!u.name)return;
      globalUsers[id]={
        ...globalUsers[id],
        ...u
      };
      if(id!==me.id && !contacts[id]){
        contacts[id]={
          id,
          name:u.name,
          avatar:u.avatar||avatarFor(u.name),
          online:!!u.online,
          lastSeen:u.lastSeen||0,
          pinned:false,
          blocked:false
        };
      }else if(contacts[id]){
        contacts[id].name=u.name||contacts[id].name;
        contacts[id].avatar=u.avatar||contacts[id].avatar;
        contacts[id].online=!!u.online;
        contacts[id].lastSeen=u.lastSeen||contacts[id].lastSeen;
      }
      saveContacts();
      renderContacts();
      renderProfile();
    });
  }catch(e){
    toast('İnternet yoxdur — lokal rejim');
    renderContacts();
  }
}

function renderContacts(filter=''){
  const list=$('contactList');
  if(!list)return;

  let arr=Object.values(contacts)
    .filter(c=>!c.blocked)
    .filter(c=>(c.name||'').toLowerCase().includes(filter.toLowerCase()))
    .sort((a,b)=>
      Number(b.pinned)-Number(a.pinned) ||
      Number(b.online)-Number(a.online) ||
      String(a.name).localeCompare(String(b.name),'az')
    );

  $('contactCount').textContent=`(${arr.length})`;

  if(!arr.length){
    list.innerHTML=`
      <div class="empty">
        <div class="empty-icon">👥</div>
        <b>Hələ kontakt yoxdur</b>
        <p>AzGram istifadəçiləri burada avtomatik görünəcək.</p>
        <button class="btn primary" onclick="openAddContact()">＋ Kontakt əlavə et</button>
      </div>`;
    return;
  }

  list.innerHTML=arr.map(c=>{
    const safe=esc(c.name);
    return `
    <div class="chat-row" onclick="openChat('${esc(c.id)}')"
         oncontextmenu="contactContext(event,'${esc(c.id)}')">
      <div class="avatar-wrap">
        <img class="avatar" src="${esc(c.avatar||avatarFor(c.name))}"
             loading="lazy" onclick="event.stopPropagation();viewAvatar('${esc(c.avatar)}')">
        <span class="online-dot ${c.online?'online':''}"></span>
      </div>
      <div class="chat-info">
        <div class="chat-name">
          ${c.pinned?'📌 ':''}${safe}
        </div>
        <div class="chat-preview">
          ${c.online?'online':'son görülmə '+relativeTime(c.lastSeen)}
        </div>
      </div>
      <div class="chat-time">›</div>
    </div>`;
  }).join('');
}

function openChat(id){
  const c=contacts[id]||globalUsers[id];
  if(!c)return;

  currentChat=c;
  currentChatID=chatID(me.name,c.name);
  $('chatScreen').classList.add('open');
  $('chatName').textContent=c.name;
  $('chatStatus').textContent=c.online?'online':'son görülmə '+relativeTime(c.lastSeen);
  $('chatAvatar').innerHTML=`
    <img class="avatar" src="${esc(c.avatar||avatarFor(c.name))}"
         onclick="showContactProfile('${esc(c.id)}')">`;

  loadChatMessages();
}

function closeChat(){
  $('chatScreen').classList.remove('open');
  currentChat=null;
  currentChatID=null;
  currentReply=null;
  if(chatUnsub)chatUnsub.off?.();
}

function loadChatMessages(){
  const box=$('chatMessages');
  box.innerHTML='';
  chatMessages={};

  if(!gun){
    const local=JSON.parse(localStorage.getItem('chat_'+currentChatID)||'[]');
    local.forEach(renderMessage);
    return;
  }

  try{
    gun.get('azgram_msg_'+currentChatID).map().on((m,id)=>{
      if(!m||!m.id||m.deleted)return;
      if(m.expires&&m.expires<Date.now())return;
      chatMessages[id]=m;
      renderChat();
    });
  }catch(e){
    toast('İnternet yoxdur');
  }
}

function renderChat(){
  const arr=Object.values(chatMessages)
    .sort((a,b)=>Number(a.created)-Number(b.created));

  $('chatMessages').innerHTML='';
  let previousDay='';

  arr.forEach(m=>{
    const day=new Date(m.created).toDateString();
    if(day!==previousDay){
      const label=new Date(m.created).toLocaleDateString('az-AZ',{
        day:'numeric',month:'long',year:'numeric'
      });
      const sep=document.createElement('div');
      sep.style.cssText='text-align:center;color:#666;font-size:11px;padding:10px';
      sep.textContent=label;
      $('chatMessages').appendChild(sep);
      previousDay=day;
    }
    renderMessage(m);
  });

  requestAnimationFrame(()=>{
    $('chatMessages').scrollTop=$('chatMessages').scrollHeight;
  });
}

function renderMessage(m){
  const box=$('chatMessages');
  if(!box)return;

  const mine=m.from===me.id;
  const wrap=document.createElement('div');
  wrap.className='message-wrap '+(mine?'mine':'theirs');
  wrap.dataset.id=m.id;

  let body='';

  if(m.reply){
    body+=`<div class="reply-box">${esc(m.reply.text||'Mesaj')}</div>`;
  }

  if(m.type==='image'){
    body+=`<img class="msg-image" src="${esc(m.data)}" loading="lazy"
      onclick="viewAvatar('${esc(m.data)}')">`;
  }else if(m.type==='video'){
    body+=`<video class="msg-video" controls preload="metadata" src="${esc(m.data)}"></video>`;
  }else if(m.type==='audio'){
    body+=`<audio class="audio-msg" controls src="${esc(m.data)}"></audio>`;
  }else{
    let text=esc(m.text||'');
    if(text.length>600 && !expandedMessages[m.id]){
      text=text.slice(0,600)+`... <span class="more-link" onclick="expandMessage('${esc(m.id)}')">daha çox</span>`;
    }
    body+=`<div class="message-text">${linkify(text)}</div>`;
  }

  body+=`
    <div class="message-meta">
      ${bakuDate(m.created)}
      ${mine?`<span class="tick ${m.read?'read':''}">${m.read?'✓✓':'✓'}</span>`:''}
    </div>`;

  wrap.innerHTML=`
    <div class="bubble" oncontextmenu="messageContext(event,'${esc(m.id)}')">
      ${body}
    </div>`;

  box.appendChild(wrap);

  if(!mine&&!m.read)markRead(m);
}

function expandMessage(id){
  expandedMessages[id]=true;
  renderChat();
}

function linkify(s){
  return s.replace(
    /(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" style="color:#69aaff">$1</a>'
  );
}

function messageKey(e){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function sendMessage(){
  const input=$('messageInput');
  const text=input.value.trim();
  if(!text)return;

  const m={
    id:crypto.randomUUID?.()||String(Date.now()+Math.random()),
    from:me.id,
    fromName:me.name,
    to:currentChat.id,
    type:'text',
    text,
    created:now(),
    delivered:false,
    read:false,
    reply:currentReply?{
      id:currentReply.id,
      text:currentReply.text||'[media]'
    }:null
  };

  putMessage(m);
  input.value='';
  currentReply=null;
  $('typing').textContent='';
  updateChatPreview(m);
}

function putMessage(m){
  chatMessages[m.id]=m;

  const localKey='chat_'+currentChatID;
  const local=JSON.parse(localStorage.getItem(localKey)||'[]');
  local.push(m);
  localStorage.setItem(localKey,JSON.stringify(local.slice(-500)));

  if(gun){
    try{
      gun.get('azgram_msg_'+currentChatID).get(m.id).put(m);
    }catch(e){}
  }

  renderChat();
  playNotification();
}

function markRead(m){
  if(m.from===me.id)return;
  m.read=true;
  if(gun){
    try{
      gun.get('azgram_msg_'+currentChatID).get(m.id).put({read:true});
    }catch(e){}
  }
}

function updateChatPreview(m){
  contacts[currentChat.id]=contacts[currentChat.id]||currentChat;
  contacts[currentChat.id].lastMessage=
    m.type==='text'?m.text:'📎 Media';
  contacts[currentChat.id].lastMessageTime=m.created;
  saveContacts();
  renderContacts();
}

function typingNow(){
  if(!currentChat||!gun)return;

  try{
    gun.get('azgram_typing_'+currentChatID).get(me.id).put({
      name:me.name,
      time:now(),
      typing:true
    });

    clearTimeout(typingTimer);
    typingTimer=setTimeout(()=>{
      gun.get('azgram_typing_'+currentChatID).get(me.id).put({
        typing:false,time:now()
      });
    },1800);
  }catch(e){}
}

function listenTyping(){
  if(!gun||!currentChatID)return;
  gun.get('azgram_typing_'+currentChatID).map().on((x,id)=>{
    if(id===me.id||!x)return;
    if(x.typing&&Date.now()-x.time<2500)

    else
      $('typing').textContent='';
  });
}

function sendMedia(input){
  const file=input.files[0];
  if(!file||!currentChat)return;

  if(file.size>8*1024*1024){
    toast('Fayl maksimum 8 MB olmalıdır');
    input.value='';
    return;
  }

  const reader=new FileReader();
  reader.onload=()=>{
    const type=file.type.startsWith('video')?'video':'image';

    const m={
      id:crypto.randomUUID?.()||String(Date.now()+Math.random()),
      from:me.id,
      fromName:me.name,
      to:currentChat.id,
      type,
      data:reader.result,
      text:'',
      name:file.name,
      created:now(),
      delivered:false,
      read:false
    };

    putMessage(m);
    input.value='';
  };
  reader.readAsDataURL(file);
}

async function toggleRecording(){
  if(mediaRecorder?.state==='recording'){
    mediaRecorder.stop();
    return;
  }

  if(!navigator.mediaDevices?.getUserMedia){
    return toast('Səs yazma dəstəklənmir');
  }

  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);
    recordingChunks=[];
    recordingStart=Date.now();

    mediaRecorder.ondataavailable=e=>recordingChunks.push(e.data);
    mediaRecorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());

      const duration=(Date.now()-recordingStart)/1000;
      if(duration>60){
        toast('Səsli mesaj maksimum 60 saniyədir');
        return;
      }

      const blob=new Blob(recordingChunks,{type:'audio/webm'});
      const reader=new FileReader();
      reader.onload=()=>{
        putMessage({
          id:crypto.randomUUID?.()||String(Date.now()),
          from:me.id,
          fromName:me.name,
          to:currentChat.id,
          type:'audio',
          data:reader.result,
          created:now(),
          duration
        });
      };
      reader.readAsDataURL(blob);
      $('recordBtn').classList.remove('recording');
    };

    mediaRecorder.start();
    $('recordBtn').classList.add('recording');
    toast('Səs yazılır... maksimum 60 san');
    recordingTimer=setTimeout(()=>{
      if(mediaRecorder?.state==='recording')mediaRecorder.stop();
    },60000);

  }catch(e){
    toast('Mikrofona icazə verilmədi');
  }
}

function messageContext(e,id){
  e.preventDefault();
  const m=chatMessages[id];
  if(!m)return;

  const items=[
    ['↩ Cavabla',()=>replyMessage(id)],
    ['⤴ Forward',()=>forwardMessage(id)],
    ['📋 Kopyala',()=>copyMessage(id)]
  ];

  if(m.from===me.id){
    items.push(['✏ Redaktə et',()=>editMessage(id)]);
    items.push(['🗑 Sil',()=>deleteMessage(id)]);
  }

  openContext(e.clientX,e.clientY,items);
}

function replyMessage(id){

  $('messageInput').focus();

}

function forwardMessage(id){

function muteChat(){

  localStorage.setItem(key,String(now()+86400000));

function playNotification(){
  const muted=Number(localStorage.getItem('azgram_mute_'+currentChatID)||0)>Date.now();
  if(muted)return;

  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    const ctx=new AudioContext();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.frequency.value=720;
    g.gain.value=.035;
    o.connect(g);g.connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+.08);
  }catch(e){}
}

function updateDelivered(m){
  m.delivered=true;
}

function openStatusCreator(){
  openModal(`
    <div class="modal-head"><h3>Status paylaş</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="form">

      <select id="statusFilter">
        <option value="normal">Normal</option>
        <option value="grayscale(1)">Grayscale</option>
        <option value="sepia(1)">Sepia</option>
        <option value="contrast(1.3)">Contrast</option>
        <option value="brightness(1.2)">Bright</option>
        <option value="saturate(1.8)">Saturated</option>
      </select>
      <button class="btn primary" onclick="publishStatus()">Paylaş</button>
    </div>
  `);
}

function publishStatus(){
  const text=$('statusTextInput').value.trim();
  const file=$('statusFile').files[0];
  const music=$('statusMusic').value.trim();
  const filter=$('statusFilter').value;

  if(!text&&!file)return toast('Mətn və ya fayl əlavə edin');

  const make=(data,type)=>{
    const s={
      id:crypto.randomUUID?.()||String(Date.now()+Math.random()),
      userId:me.id,
      userName:me.name,
      avatar:me.avatar,
      text,
      hashtags:extractTags(text),
      type:type||'text',
      data:data||'',
      music,
      filter,
      created:now(),
      expires:now()+86400000,
      likes:0,
      views:0,
      comments:0
    };

    statuses[s.id]=s;
    saveStatuses();

    if(gun){
      try{
        gun.get('azgram_status_v100').get(s.id).put(s);
      }catch(e){}
    }

    closeModal();
    loadStatuses();
    toast('Status paylaşıldı');
  };

  if(file){
    if(file.size>10*1024*1024)return toast('Status faylı maksimum 10 MB');
    const r=new FileReader();
    r.onload=()=>make(r.result,file.type.startsWith('video')?'video':'image');
    r.readAsDataURL(file);
  }else make('','text');
}

function extractTags(text){
  return (text.match(/#[\p{L}\p{N}_]+/gu)||[]).map(x=>x.toLowerCase());
}

function loadStatuses(){
  if(gun){
    try{
      gun.get('azgram_status_v100').map().on((s,id)=>{
        if(!s||!s.id)return;
        if(s.expires&&s.expires<Date.now())return;
        statuses[id]={
          ...statuses[id],
          ...s
        };
        saveStatuses();
        if(document.getElementById('statusScreen')?.classList.contains('active'))
          buildFeed();
      });
    }catch(e){}
  }

  buildFeed();
}

function cleanExpiredStatuses(){
  let changed=false;
  Object.keys(statuses).forEach(id=>{
    if(statuses[id].expires<Date.now()){
      delete statuses[id];
      changed=true;
    }
  });
  if(changed){
    saveStatuses();
    buildFeed();
  }
}

function statusScore(s){
  const hours=Math.max(.1,(Date.now()-Number(s.created||Date.now()))/3600000);
  return ((Number(s.likes)||0)*10+
          (Number(s.views)||0)*2+
          (Number(s.comments)||0)*5) /
         Math.pow(hours+2,1.5);
}

function buildFeed(){
  const feed=$('statusFeed');
  if(!feed)return;

  const arr=Object.values(statuses)
    .filter(s=>!s.expires||s.expires>Date.now())
    .sort((a,b)=>statusScore(b)-statusScore(a));

  if(!arr.length){
    feed.innerHTML=`
      <div class="status-slide" style="display:flex;align-items:center;justify-content:center">
        <div class="empty"><div class="empty-icon">◉</div>
        <b>Hələ status yoxdur</b><p>İlk statusu sən paylaş.</p>
        <button class="btn primary" onclick="openStatusCreator()">Status paylaş</button></div>
      </div>`;
    return;
  }

  feed.innerHTML=arr.map((s,i)=>statusHTML(s,i)).join('');

  [...feed.querySelectorAll('video')].forEach(v=>{
    v.muted=true;
    v.loop=true;
    v.autoplay=true;
    v.play().catch(()=>{});
  });

  setupStatusObserver();
}

function statusHTML(s,i){
  const isMine=s.userId===me.id;
  const tags=(s.hashtags||[]).map(t=>
    `<span onclick="event.stopPropagation();searchTag('${esc(t)}')">${esc(t)}</span>`
  ).join(' ');

  let media='';

  if(s.type==='image'){
    media=`<img class="status-media" src="${esc(s.data)}" loading="lazy"
      style="filter:${esc(s.filter||'none')}">`;
  }else if(s.type==='video'){
    media=`<video class="status-media" src="${esc(s.data)}"
      style="filter:${esc(s.filter||'none')}" autoplay muted loop playsinline></video>`;
  }else{
    media=`<div class="status-media" style="display:flex;align-items:center;
      justify-content:center;padding:35px;background:linear-gradient(145deg,#111,#222)">
      <div style="font-size:27px;font-weight:800;text-align:center">${esc(s.text)}</div>
    </div>`;
  }

  const ad=((i+1)%4===0&&i>0);

  return `
  <article class="status-slide" data-id="${esc(s.id)}"
    ondblclick="doubleLike('${esc(s.id)}')">
    ${media}
    <div class="status-bg"></div>
    ${ad?`<div class="ad-badge" onclick="event.stopPropagation();adClick()">REKLAM</div>`:''}

    <div class="status-top">
      <img class="avatar" src="${esc(s.avatar||avatarFor(s.userName))}"
        onclick="event.stopPropagation();profileFromStatus('${esc(s.userId)}')">
      <div>
        <div class="status-user" onclick="event.stopPropagation();profileFromStatus('${esc(s.userId)}')">
          ${esc(s.userName)}
        </div>
        <div class="status-age">${relativeTime(s.created)}</div>
      </div>
    </div>

    <div class="status-body">
      ${s.type!=='text'?`<div class="status-text">${formatLongStatus(s.text)}</div>`:''}
      ${tags?`<div class="status-tags">${tags}</div>`:''}
      ${s.music?`<div class="status-music">♫ ${esc(s.music)}</div>`:''}
    </div>

    <div class="status-side">
      <button class="side-action" onclick="event.stopPropagation();likeStatus('${esc(s.id)}',this)">
        <span class="si reaction">❤️</span><small>${Number(s.likes)||0}</small>
      </button>
      <button class="side-action" onclick="event.stopPropagation();commentStatus('${esc(s.id)}')">
        <span class="si">💬</span><small>${Number(s.comments)||0}</small>
      </button>
      <button class="side-action" onclick="event.stopPropagation();shareStatus('${esc(s.id)}')">
        <span class="si">↗</span><small>Paylaş</small>
      </button>
      <button class="side-action" onclick="event.stopPropagation();downloadStatus('${esc(s.id)}')">
        <span class="si">⇩</span><small>Endir</small>
      </button>
      ${isMine?
      `<button class="side-action" onclick="event.stopPropagation();deleteStatus('${esc(s.id)}')">
        <span class="si">🗑</span><small>Sil</small>
      </button>`:
      `<button class="side-action" onclick="event.stopPropagation();reportStatus('${esc(s.id)}')">
        <span class="si">⚑</span><small>Şikayət</small>
      </button>`}
    </div>
  </article>`;
}

function formatLongStatus(text){
  if(!text)return '';
  if(text.length<=350)return esc(text);
  return esc(text.slice(0,350))+
    `... <span class="more-link" onclick="event.stopPropagation()">daha çox</span>`;
}

function setupStatusObserver(){
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting&&entry.intersectionRatio>.6){
        const id=entry.target.dataset.id;
        const s=statuses[id];
        if(s){
          s.views=(Number(s.views)||0)+1;
          statuses[id]=s;
          saveStatuses();

          if(gun){
            gun.get('azgram_status_v100').get(id).put({views:s.views});
          }
        }
      }
    });
  },{threshold:.6});

  document.querySelectorAll('.status-slide[data-id]').forEach(x=>observer.observe(x));
}

function likeStatus(id,button){
  const s=statuses[id];
  if(!s)return;

  const key='azgram_liked_'+id;
  const liked=localStorage.getItem(key)==='1';

  s.likes=Math.max(0,(Number(s.likes)||0)+(liked?-1:1));
  statuses[id]=s;

  if(liked)localStorage.removeItem(key);
  else localStorage.setItem(key,'1');

  if(gun)gun.get('azgram_status_v100').get(id).put({likes:s.likes});
  button.classList.add('liked');
  setTimeout(()=>button.classList.remove('liked'),350);
  buildFeed();
}

function doubleLike(id){
  const s=statuses[id];
  if(!s)return;

  const key='azgram_liked_'+id;
  if(localStorage.getItem(key)==='1')return;

  s.likes=(Number(s.likes)||0)+1;
  statuses[id]=s;
  localStorage.setItem(key,'1');

  if(gun)gun.get('azgram_status_v100').get(id).put({likes:s.likes});

  const slide=document.querySelector(`.status-slide[data-id="${CSS.escape(id)}"]`);
  if(slide){
    const h=document.createElement('div');
    h.className='double-heart';
    h.textContent='❤️';
    slide.appendChild(h);
    setTimeout(()=>h.remove(),800);
  }

  buildFeed();
}

function commentStatus(id){
  const text=prompt('Şərhiniz:');
  if(!text?.trim())return;

  const c={
    id:crypto.randomUUID?.()||String(Date.now()),
    statusId:id,
    userId:me.id,
    userName:me.name,
    text:text.trim(),
    created:now()
  };

  if(gun)gun.get('comments_'+id).get(c.id).put(c);

  statuses[id].comments=(Number(statuses[id].comments)||0)+1;
  if(gun)gun.get('azgram_status_v100').get(id).put({comments:statuses[id].comments});
  saveStatuses();

  toast('Şərh əlavə edildi');
}

async function shareStatus(id){
  const s=statuses[id];
  if(!s)return;

  const url=location.href.split('#')[0]+'#status='+id;

  if(navigator.share){
    try{
      await navigator.share({
        title:'AzGram status',
        text:s.text||('Status — '+s.userName),
        url
      });
    }catch(e){}
  }else{
    await navigator.clipboard?.writeText(url);
    toast('Status linki kopyalandı');
  }
}

function downloadStatus(id){
  const s=statuses[id];
  if(!s?.data)return toast('Yüklənəcək media yoxdur');

  const a=document.createElement('a');
  a.href=s.data;
  a.download='azgram-status-'+id;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function deleteStatus(id){
  const s=statuses[id];
  if(!s||s.userId!==me.id)return;
  if(!confirm('Status silinsin?'))return;

  delete statuses[id];
  saveStatuses();

  if(gun)gun.get('azgram_status_v100').get(id).put({expires:1});
  buildFeed();
}

function reportStatus(id){
  if(gun){
    gun.get('azgram_reports_v100').set({
      type:'status',
      reporter:me.id,
      target:id,
      created:now()
    });
  }
  toast('Status şikayət edildi');
}

  const u=globalUsers[id]||contacts[id];

function globalSearch(q){
  q=q.trim();

  if(q){
    searchHistory=[q,...searchHistory.filter(x=>x!==q)].slice(0,15);
    localStorage.setItem('azgram_search_history',JSON.stringify(searchHistory));
  }

  renderSearch(q);
}

function setSearchTab(tab,el){
  searchTab=tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  renderSearch($('globalSearch').value);
}

function renderSearch(q){
  const results=$('searchResults');
  const history=$('searchHistory');

  if(!q){
    history.innerHTML=searchHistory.length?`
      <div class="row" style="justify-content:space-between">
        <b>Axtarış tarixçəsi</b>
        <button class="btn small" onclick="clearSearchHistory()">Təmizlə</button>
      </div>
      ${searchHistory.map(x=>`
        <div class="history-item">
          <span onclick="useHistory('${esc(x)}')">🕘 ${esc(x)}</span>
          <span onclick="removeHistory('${esc(x)}')">✕</span>
        </div>`).join('')}`:'';

    results.innerHTML='';
    return;
  }

  history.innerHTML='';

  const lq=q.toLowerCase();
  const users=Object.values(globalUsers)
    .filter(u=>String(u.name||'').toLowerCase().includes(lq));

  const sts=Object.values(statuses)
    .filter(s=>
      String(s.text||'').toLowerCase().includes(lq) ||
      (s.hashtags||[]).some(t=>t.toLowerCase().includes(lq))
    );

  let out=[];

  if(searchTab==='all'||searchTab==='users'){
    out.push(...users.map(u=>`
      <div class="result" onclick="profileFromStatus('${esc(u.id)}')">
        <div class="row">
          <img class="avatar" src="${esc(u.avatar||avatarFor(u.name))}">
          <div><div class="result-title">${esc(u.name)}</div>
          <div class="result-text">İstifadəçi</div></div>
        </div>
      </div>`));
  }

  if(searchTab==='all'||searchTab==='statuses'){
    out.push(...sts.map(s=>`
      <div class="result" onclick="goStatus('${esc(s.id)}')">
        <div class="result-title">${esc(s.userName)}</div>
        <div class="result-text">${esc(s.text||'[media]')}</div>
      </div>`));
  }

  if(searchTab==='all'||searchTab==='messages'){
    const msgs=[];
    Object.keys(localStorage).forEach(k=>{
      if(!k.startsWith('chat_'))return;
      try{
        JSON.parse(localStorage.getItem(k)||'[]').forEach(m=>{
          if(String(m.text||'').toLowerCase().includes(lq))msgs.push(m);
        });
      }catch(e){}
    });

    out.push(...msgs.slice(0,50).map(m=>`
      <div class="result">
        <div class="result-title">${esc(m.text||'[media]')}</div>
        <div class="result-text">${bakuDate(m.created)}</div>
      </div>`));
  }

  results.innerHTML=`
    <div style="padding:10px 15px;color:#777;font-size:12px">
      ${out.length} nəticə
    </div>
    ${out.length?out.join(''):'<div class="empty">Nəticə tapılmadı</div>'}`;
}

function searchTag(tag){
  goScreen('searchScreen',document.querySelector('[data-screen="searchScreen"]'));
  $('globalSearch').value=tag;
  searchTab='statuses';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='statuses'));
  renderSearch(tag);
}

function goStatus(id){
  goScreen('statusScreen',document.querySelector('[data-screen="statusScreen"]'));
  setTimeout(()=>{
    const el=document.querySelector(`.status-slide[data-id="${CSS.escape(id)}"]`);
    el?.scrollIntoView({behavior:'smooth'});
  },100);
}

function voiceSearch(){
  const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Speech)return toast('Səsli axtarış dəstəklənmir');

  const r=new Speech();
  r.lang='az-AZ';
  r.interimResults=false;
  r.onresult=e=>{
    const q=e.results[0][0].transcript;
    $('globalSearch').value=q;
    globalSearch(q);
  };
  r.onerror=()=>toast('Səs tanınmadı');
  r.start();
}

function clearSearchHistory(){
  searchHistory=[];
  localStorage.removeItem('azgram_search_history');
  renderSearch('');
}

function removeHistory(q){
  searchHistory=searchHistory.filter(x=>x!==q);
  localStorage.setItem('azgram_search_history',JSON.stringify(searchHistory));
  renderSearch('');
}

function useHistory(q){
  $('globalSearch').value=q;
  globalSearch(q);
}

/* Qlobal error-safe helper */
function safeJSON(value,fallback){
  try{return JSON.parse(value)}catch(e){return fallback}
}

/* Status hashtag trendləri */
function getTrendingTags(){
  const count={};
  Object.values(statuses).forEach(s=>{
    (s.hashtags||[]).forEach(t=>count[t]=(count[t]||0)+1);
  });
  return Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10);
}

/* Trend UI search nəticələrində istifadə edilə bilər */
function showTrends(){
  const trends=getTrendingTags();
  openModal(`
    <div class="modal-head"><h3>Trend hashtaglar</h3>
    <button class="icon-btn" onclick="closeModal()">✕</button></div>
    ${trends.length?trends.map(t=>`
      <button class="btn" style="width:100%;margin:4px 0;text-align:left"
        onclick="closeModal();searchTag('${esc(t[0])}')">
        ${esc(t[0])} <span style="float:right;color:#777">${t[1]}</span>
      </button>`).join(''):'<div class="empty">Trend yoxdur</div>'}
  `);
}

/* Kontakt statusu */
function viewContactStatus(id){
  const s=Object.values(statuses)
    .filter(x=>x.userId===id)
    .sort((a,b)=>b.created-a.created)[0];

  if(s)goStatus(s.id);
  else toast('Bu istifadəçinin aktiv statusu yoxdur');
}
