<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barter.az - Al Sat yox, Sadəcə Dəyiş!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f5f7}
.header{position:sticky;top:0;background:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.header h1{color:#0f5132;font-size:26px;font-weight:900}
.banner{margin:12px;background:#d1e7dd;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.banner b{color:#0f5132;font-size:17px}
.banner p{font-size:12px;color:#333}
.btn-green{background:#198754;color:white;border:none;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.card img{width:100%;height:140px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:14px}
.card-body p{font-size:11px;color:#198754;margin:4px 0;font-weight:600}
.tag{display:inline-block;background:#198754;color:white;font-size:10px;padding:3px 8px;border-radius:10px}
.tabs{padding:0 12px;margin-top:12px;display:flex;justify-content:space-between}
.tabs h2{font-size:20px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:8px 0 18px;border-top:1px solid #eee;max-width:500px;margin:0 auto}
.bottom div{text-align:center;font-size:11px;color:#666}
.bottom .active{color:#198754;font-weight:700}
.add{width:48px;height:48px;background:#198754;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:28px;margin-top:-10px}
</style>
</head>
<body>
<div style="max-width:500px;margin:0 auto;background:white;min-height:100vh;padding-bottom:80px">
<div class="header"><span>☰</span><h1>Barter.az</h1><div>🔍 🔔</div></div>

<div class="banner">
<div><b>Al - Sat yox, Sadəcə Dəyiş!</b><p>Ehtiyacın olanı tap, lazımsızını dəyiş</p></div>
<button class="btn-green" onclick="addItem()">Yeni Elan +</button>
</div>

<div class="tabs"><h2>♻️ Dəyişilir</h2></div>
<div class="grid" id="grid1"></div>

<div class="tabs"><h2>Dəyişmək istəyirəm</h2><span>🔍</span></div>
<div class="grid" id="grid2"></div>
</div>

<div class="bottom">
<div class="active">🏠<br>Ana səhifə</div>
<div>☰<br>Elanlar</div>
<div><div class="add">+</div>Əlavə et</div>
<div>💬<br>Mesajlar</div>
<div>👤<br>Profil</div>
</div>

<script>
let items1=[
 {name:"iPhone 13", want:"PlayStation 5 ilə dəyişilir", tag:"Elektronika", img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=300"},
 {name:"Zara paltar", want:"Çanta ilə dəyişilir", tag:"Geyim", img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=300"},
];
let items2=[
 {name:"Nike Air Max", want:"iPad mini ilə dəyişmək istəyirəm", tag:"Ayaqqabı", img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"},
 {name:"Uşaq velosipedi", want:"Oyuncaq dəsti ilə dəyişmək istəyirəm", tag:"Uşaq", img:"https://images.unsplash.com/photo-1571068316344-75bc76f77890?w=300"},
 {name:"MacBook Air M1", want:"iPhone 14 Pro ilə dəyişilir", tag:"Elektronika", img:"https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?w=300"},
 {name:"Özəl əl çantası", want:"Qızıl sırğa ilə dəyişirəm", tag:"Aksessuar", img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=300"},
];

function render(){
 document.getElementById('grid1').innerHTML=items1.map(i=>`
  <div class="card" onclick="offer('${i.name}')">
   <img src="${i.img}">
   <div class="card-body"><h3>${i.name}</h3><p>${i.want}</p><span class="tag">${i.tag}</span></div>
  </div>`).join('');
 document.getElementById('grid2').innerHTML=items2.map(i=>`
  <div class="card" onclick="offer('${i.name}')">
   <img src="${i.img}">
   <div class="card-body"><h3>${i.name}</h3><p>${i.want}</p><span class="tag">${i.tag}</span></div>
  </div>`).join('');
}
function offer(name){
 let what=prompt(`"${name}" üçün nə təklif edirsən? Məs: Köhnə telefonum, velosipedim`);
 if(what){ alert(`Təklifin göndərildi! "${name}" sahibinə bildiriş getdi. Qarşı tərəf qəbul etsə, çat açılacaq.`); }
}
function addItem(){
 let ad=prompt("Nəyi dəyişirsən? Məs: iPhone 12");
 let istey=prompt("Nə istəyirsən əvəzində? Məs: Samsung və ya başqa şey");
 if(ad && istey){
  items1.unshift({name:ad, want:istey+" ilə dəyişilir", tag:"Yeni", img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300"});
  render();
  alert("Elan əlavə olundu! Ana səhifədə göründü.");
 }
}
render();
</script>
</body>
</html>
