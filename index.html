<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeyimDəyis P2P Pro</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Gun.js for P2P Sync -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        :root {
            --nav: 68px;
            --header: 60px;
            --bg: #09090b;
            --surface: #18181b;
            --surface-hover: #27272a;
            --border: #27272a;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --wa-green: #25D366;
            --wa-green-hover: #1eae53;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: fixed;
        }

        /* Top Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 50;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        header * {
            pointer-events: auto;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .p2p-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
        }

        .p2p-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }

        .p2p-dot.online {
            background: var(--wa-green);
            box-shadow: 0 0 8px var(--wa-green);
        }

        /* Fullscreen TikTok Feed */
        #feed {
            height: 100dvh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        #feed::-webkit-scrollbar {
            display: none;
        }

        .feed-item {
            height: 100dvh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        /* Horizontal Media Carousel inside Item */
        .media-carousel {
            height: 100%;
            width: 100%;
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .media-carousel::-webkit-scrollbar {
            display: none;
        }

        .media-slide {
            min-width: 100vw;
            height: 100dvh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .media-slide img, .media-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-dots {
            position: absolute;
            top: calc(var(--header) + 10px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 25;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transition: all 0.3s;
        }

        .dot.active {
            background: #fff;
            width: 16px;
            border-radius: 4px;
        }

        /* Overlay & Info */
        .item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 80px 16px calc(var(--nav) + 16px) 16px;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0) 100%);
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-overlay * {
            pointer-events: auto;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            background: var(--surface);
        }

        .author-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .time-ago {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .item-title {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.4;
        }

        .item-want {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 4px;
        }

        .item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .tag {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
        }

        .item-meta-pills {
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }

        .pill {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.15);
            padding: 2px 8px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        /* Right Floating Actions */
        .right-actions {
            position: absolute;
            right: 12px;
            bottom: calc(var(--nav) + 120px);
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 25;
            align-items: center;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .action-btn .btn-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:active .btn-circle {
            transform: scale(0.88);
        }

        .action-btn.liked .btn-circle {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* WhatsApp Fixed Floating Direct Button */
        .wa-floating-btn {
            position: absolute;
            right: 12px;
            bottom: calc(var(--nav) + 30px);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--wa-green);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 25;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            cursor: pointer;
            border: none;
            text-decoration: none;
        }

        /* Sound Control Overlay */
        .sound-toggle-btn {
            position: absolute;
            top: calc(var(--header) + 12px);
            right: 16px;
            z-index: 25;
        }

        /* Explore / Grid View */
        #exploreGrid {
            display: none;
            height: 100dvh;
            width: 100vw;
            padding-top: var(--header);
            padding-bottom: var(--nav);
            overflow-y: auto;
            background: var(--bg);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
        }

        .grid-item {
            aspect-ratio: 1;
            position: relative;
            background: var(--surface);
            overflow: hidden;
            cursor: pointer;
        }

        .grid-item img, .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-item-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            color: #fff;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
        }

        /* Bottom Navigation */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav);
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            width: 20%;
            height: 100%;
            opacity: 0.6;
            transition: all 0.2s;
        }

        .nav-tab.active {
            opacity: 1;
            color: #fff;
        }

        .nav-tab.active i {
            color: var(--accent);
        }

        .nav-tab-publish {
            opacity: 1;
        }

        .publish-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            margin-top: -12px;
        }

        /* Modals & Drawers */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 20px 20px 0 0;
            max-height: 85dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 1px solid var(--border);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 320px;
            height: 100dvh;
            background: var(--surface);
            z-index: 120;
            transition: left 0.3s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border);
        }

        .drawer.active {
            left: 0;
        }

        .drawer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 110;
            display: none;
        }

        .drawer-backdrop.active {
            display: block;
        }

        .drawer-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s;
        }

        .drawer-menu-item:hover, .drawer-menu-item.active {
            background: var(--surface-hover);
        }

        .lang-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-left: 12px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .lang-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(245, 158, 11, 0.1);
        }

        /* Form Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-field {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        textarea.input-field {
            min-height: 80px;
            resize: vertical;
        }

        .media-picker-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .upload-btn-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: var(--surface-hover);
            border: 1px dashed var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .media-previews {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
        }

        .preview-thumb {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            position: relative;
            flex-shrink: 0;
            background: #000;
        }

        .preview-thumb img, .preview-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .remove-thumb {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }

        .submit-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
        }

        /* Comments Modal Sheet */
        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            font-size: 0.9rem;
        }

        .comment-body {
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: var(--bg);
            padding: 8px 12px;
            border-radius: 10px;
            flex-grow: 1;
        }

        .comment-author {
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .comment-text {
            font-size: 0.9rem;
            word-break: break-word;
        }

        .comment-actions {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .comment-reply-btn {
            cursor: pointer;
            color: var(--accent);
        }

        .comment-input-area {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        /* Search Overlay Modal */
        .search-header {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        /* Profile View */
        #profileView {
            display: none;
            height: 100dvh;
            width: 100vw;
            padding-top: var(--header);
            padding-bottom: var(--nav);
            overflow-y: auto;
            background: var(--bg);
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .profile-avatar-big {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            gap: 12px;
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }

        /* Hidden File Inputs */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-title">GeyimDəyis P2P</div>
        <div class="header-actions">
            <div class="p2p-badge">
                <div id="p2pDot" class="p2p-dot"></div>
                <span id="p2pStatusText">P2P</span>
            </div>
            <button class="icon-btn" id="searchBtn"><i data-lucide="search"></i></button>
            <button class="icon-btn" id="menuBtn"><i data-lucide="menu"></i></button>
        </div>
    </header>

    <!-- Home TikTok Fullscreen Feed -->
    <main id="feed"></main>

    <!-- Explore Grid View -->
    <div id="exploreGrid">
        <div class="grid-container" id="gridContainer"></div>
    </div>

    <!-- Profile View View -->
    <div id="profileView">
        <div class="profile-header" id="profileHeaderContent"></div>
        <div class="grid-container" id="profileGridContainer"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav>
        <button class="nav-tab active" id="navHome"><i data-lucide="house"></i><span id="labelHome">Ana səhifə</span></button>
        <button class="nav-tab" id="navExplore"><i data-lucide="layout-grid"></i><span id="labelExplore">Kəşf et</span></button>
        <button class="nav-tab nav-tab-publish" id="navPublish">
            <div class="publish-circle"><i data-lucide="plus"></i></div>
        </button>
        <button class="nav-tab" id="navFavs"><i data-lucide="star"></i><span id="labelFavs">Bəyəndiklərim</span></button>
        <button class="nav-tab" id="navProfile"><i data-lucide="user"></i><span id="labelProfile">Profil</span></button>
    </nav>

    <!-- Side Drawer -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer" id="drawer">
        <h2 style="margin-bottom: 10px;" id="menuTitle">Menyu</h2>
        <div class="drawer-menu-item" id="btnAbout"><i data-lucide="info"></i><span id="labelAbout">Haqqımızda</span></div>
        <div class="drawer-menu-item" id="btnHowTo"><i data-lucide="help-circle"></i><span id="labelHowTo">Necə istifadə etməli?</span></div>
        <div class="drawer-menu-item" id="btnPrivacy"><i data-lucide="shield-check"></i><span id="labelPrivacy">Məxfilik Siyasəti</span></div>
        <div class="drawer-menu-item" id="btnTerms"><i data-lucide="file-text"></i><span id="labelTerms">İstifadə Şərtləri</span></div>
        
        <div style="margin-top: 10px; font-weight: bold; font-size: 0.9rem;" id="labelLang">Dil seçimi</div>
        <div class="lang-options">
            <button class="lang-btn" data-lang="az">🇦🇿 Azərbaycan</button>
            <button class="lang-btn" data-lang="en">🇬🇧 English</button>
            <button class="lang-btn" data-lang="ru">🇷🇺 Русский</button>
            <button class="lang-btn" data-lang="tr">🇹🇷 Türkçe</button>
            <button class="lang-btn" data-lang="ka">🇬🇪 ქართული</button>
            <button class="lang-btn" data-lang="fa">🇮🇷 فارسی</button>
        </div>
    </div>

    <!-- Upload/Publish Modal -->
    <div class="modal" id="publishModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalPublishTitle">Elan Yerləşdir</div>
                <button class="icon-btn" id="closePublishModal"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <form id="publishForm" onsubmit="return false;">
                    <div class="form-group">
                        <label id="lblMyName">Adınız</label>
                        <input type="text" id="inAuthorName" class="input-field" required>
                    </div>
                    <div class="form-group">
                        <label id="lblMyWA">WhatsApp Nömrəsi (məs: 994501234567)</label>
                        <input type="tel" id="inAuthorWA" class="input-field" placeholder="994..." required>
                    </div>
                    <div class="form-group">
                        <label id="lblWhatChanging">Nəyi dəyişirsiniz? (Geyim ad/təsviri)</label>
                        <input type="text" id="inTitle" class="input-field" placeholder="məs: Zara Qara Kurtka" required>
                    </div>

        let db = null;
        dbReq.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("medias")) db.createObjectStore("medias");
        };
        dbReq.onsuccess = (e) => { db = e.target.result; };

        function saveMediaBlob(id, blob) {
            if (!db) return;
            const tx = db.transaction("medias", "readwrite");
            tx.objectStore("medias").put(blob, id);
        }

        function getMediaBlob(id) {
            return new Promise((resolve) => {
                if (!db) return resolve(null);
                const tx = db.transaction("medias", "readonly");
                const req = tx.objectStore("medias").get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        // --- 3. Gun.js & P2P State Management ---
        const gun = Gun([
            'https://gun-manhattan.herokuapp.com/gun',
            'https://gun-us.herokuapp.com/gun'
        ]);

        let feedData = JSON.parse(localStorage.getItem("p2p-feed-v4") || "[]");
        let favs = JSON.parse(localStorage.getItem("favs-v4") || "[]");
        let myProfile = JSON.parse(localStorage.getItem("my-profile-v4") || '{"name":"","wa":"","avatar":""}');

        function saveLocalFeed() {
            try {
                localStorage.setItem("p2p-feed-v4", JSON.stringify(feedData.map(item => ({
                    ...item,
                    media: item.media.map(m => m.length > 50000 ? "" : m) // strip massive base64 if quota near
                }))));
            } catch (e) {
                console.warn("localStorage quota hit, keeping lightweight feed index");
            }
        }

        // Initial Sample Data if totally empty
        if (feedData.length === 0) {
            feedData = [
                {
                    id: "demo_1",
                    author: "Aysel M.",
                    wa: "994501234567",
                    avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80",
                    title: "Zara Bej Paltar (S ölçü)",
                    want: "M ölçü Qara Gödəkçə",
                    brand: "Zara",
                    size: "S",
                    desc: "Cəmi 1 dəfə toyda geyinilib, yenidən seçilmir.",

                    media: ["https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80"],
                    likes: 12,
                    ts: Date.now() - 3600000
                }
            ];
            saveLocalFeed();
        }

        // Gun Sync Listener
        function initGunSync() {
            gun.get("geyimdeyis").get("feed").map().on((item) => {
                if (!item || !item.id) return;
                const idx = feedData.findIndex(x => x.id === item.id);
                const parsedItem = {
                    ...item,
                    tags: typeof item.tags === "string" ? JSON.parse(item.tags) : (item.tags || []),
                    media: typeof item.media === "string" ? JSON.parse(item.media) : (item.media || [])
                };
                if (idx === -1) {
                    feedData.unshift(parsedItem);
                } else {
                    feedData[idx] = { ...feedData[idx], ...parsedItem };
                }
                feedData.sort((a, b) => b.ts - a.ts);
                saveLocalFeed();
                if ($("feed").style.display !== "none") renderFeed();
            });
        }

        // Periodic P2P Seeder - Sync local top items back to Gun Relays
        setInterval(() => {
            feedData.slice(0, 20).forEach(item => {
                gun.get("geyimdeyis").get("feed").get(item.id).put({
                    ...item,
                    tags: JSON.stringify(item.tags || []),
                    media: JSON.stringify(item.media || [])
                });
            });
        }, 30000);

        function handleCarouselScroll(carouselEl) {
            const scrollLeft = carouselEl.scrollLeft;
            const width = carouselEl.offsetWidth;
            const activeIndex = Math.round(scrollLeft / width);
            const dots = carouselEl.parentElement.querySelectorAll(".dot");
            dots.forEach((d, i) => d.classList.toggle("active", i === activeIndex));
        }

        function toggleMute(btn) {
            const feedItem = btn.closest(".feed-item");
            const videos = feedItem.querySelectorAll("video");
            let isMuted = true;
            videos.forEach(v => {
                v.muted = !v.muted;
                isMuted = v.muted;
            });
            btn.innerHTML = isMuted ? `<i data-lucide="volume-x"></i>` : `<i data-lucide="volume-2"></i>`;
            renderIcons();
        }

        // Seeder & Autoplay Intersection Observer
        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const videos = entry.target.querySelectorAll("video");
                    if (entry.isIntersecting) {
                        videos.forEach(v => v.play().catch(() => {}));
                        // Lazy load IDB blobs if needed
                        const itemId = entry.target.id.replace("item-", "");
                        getMediaBlob(itemId).then(blob => {
                            if (blob) {
                                const url = URL.createObjectURL(blob);
                                const img = entry.target.querySelector("img");
                                if (img && !img.src) img.src = url;
                            }
                        });
                    } else {
                        videos.forEach(v => v.pause());
                    }
                });
            }, { threshold: 0.65 });

            document.querySelectorAll(".feed-item").forEach(el => observer.observe(el));
        }

        // --- 5. Navigation Tab Switcher ---
        function setActiveTab(tab) {
            currentFeedView = tab;
            document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
            $("feed").style.display = "none";

            } else if (tab === "explore") {

                renderExploreGrid(feedData);
            } else if (tab === "favs") {
                $("navFavs").classList.add("active");

                renderFeed(favItems);

                $("profileView").style.display = "block";

        // --- 6. Publish / Upload Logic ---
        let selectedMediaFiles = [];

        function handleMediaFiles(files) {
            for (let file of files) {
                if (file.size > 20 * 1024 * 1024) {
                    alert(t("file_too_large"));
                    continue;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedMediaFiles.push(e.target.result);
                    renderMediaPreviews();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderMediaPreviews() {
            const container = $("mediaPreviews");
            if (!container) return;
            container.innerHTML = "";
            selectedMediaFiles.forEach((src, idx) => {
                const isVideo = src.startsWith("data:video");
                const div = document.createElement("div");
                div.className = "preview-thumb";
                div.innerHTML = `
                    ${isVideo ? `<video src="${src}"></video>` : `<img src="${src}" />`}
                    <div class="remove-thumb" onclick="removeMedia(${idx})">✕</div>
                `;
                container.appendChild(div);
            });
        }

        function removeMedia(idx) {
            selectedMediaFiles.splice(idx, 1);
            renderMediaPreviews();
        }

        function publishItem() {
            const author = $("inAuthorName").value.trim();
            const wa = $("inAuthorWA").value.trim();
            const title = $("inTitle").value.trim();
            const want = $("inWant").value.trim();
            const brand = $("inBrand").value.trim();
            const size = $("inSize").value.trim();
            const desc = $("inDesc").value.trim();
            const tags = $("inTags").value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);

            if (!author || !wa || !title || !want) {
                alert(t("fill_required"));
                return;
            }

            // Save user profile locally for future posts
            myProfile = { name: author, wa: wa, avatar: myProfile.avatar || "" };
            localStorage.setItem("my-profile-v4", JSON.stringify(myProfile));

            const newItem = {
                id: "item_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                author,
                wa,
                avatar: myProfile.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80",
                title,
                want,
                brand,
                size,
                desc,
                tags,
                media: selectedMediaFiles.length > 0 ? selectedMediaFiles : ["https://via.placeholder.com/600x800?text=GeyimDəyis"],
                likes: 0,
                ts: Date.now()
            };

            // Push to local state and Gun P2P Network
            feedData.unshift(newItem);
            saveLocalFeed();

            gun.get("geyimdeyis").get("feed").get(newItem.id).put({
                ...newItem,
                tags: JSON.stringify(newItem.tags),
                media: JSON.stringify(newItem.media)
            });

            // Save first heavy media to IndexedDB
            if (selectedMediaFiles[0]) {
                saveMediaBlob(newItem.id, selectedMediaFiles[0]);
            }

            // Reset Form & Close Modal
            selectedMediaFiles = [];
            renderMediaPreviews();
            $("publishForm").reset();
            $("publishModal").classList.remove("active");

            setActiveTab("home");
        }

        function sendComment() {
            const txt = $("inCommentText").value.trim();

            if (!myProfile.name) {
                const name = prompt(t("enter_name_prompt"));
                if (!name) return;

                localStorage.setItem("my-profile-v4", JSON.stringify(myProfile));

            const comments = JSON.parse(localStorage.getItem(`comments-v4-${activeCommentItemId}`) || "[]");
            comments.push({

            renderFeed(currentFeedView === "favs" ? feedData.filter(x => favs.includes(x.id)) : feedData);

        function shareItem(id) {
            const item = feedData.find(x => x.id === id);
            if (!item) return;
            const text = `${t("share_text")} ${item.title}`;
            const url = window.location.href.split('#')[0] + `#item=${id}`;

            if (navigator.share) {
                navigator.share({ title: item.title, text: text, url: url }).catch(() => {});
            } else {
                navigator.clipboard.writeText(`${text} ${url}`);
                alert("Link kopyalandı!");

            const query = $("searchInput").value.trim().toLowerCase();
            if (!query) return;
            const results = feedData.filter(item => {
                const norm = (s) => (s || "").toLowerCase();
                return norm(item.title).includes(query) ||
                       norm(item.want).includes(query) ||
                       norm(item.brand).includes(query) ||
                       norm(item.size).includes(query) ||
                       norm(item.desc).includes(query) ||
                       (item.tags || []).some(t => norm(t).includes(query));
            });

            const container = $("searchResultsGrid");
            container.innerHTML = "";
            if (results.length === 0) {
                container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:20px; color:var(--text-muted);">${t("no_results")}</div>`;

            $("navHome").addEventListener("click", () => setActiveTab("home"));
            $("navExplore").addEventListener("click", () => setActiveTab("explore"));
            $("navFavs").addEventListener("click", () => setActiveTab("favs"));
            $("navProfile").addEventListener("click", () => setActiveTab("profile"));
            $("navPublish").addEventListener("click", () => {
                if (myProfile.name) $("inAuthorName").value = myProfile.name;
                if (myProfile.wa) $("inAuthorWA").value = myProfile.wa;
                $("publishModal").classList.add("active");
            });

            // Publish Form & File Inputs
            $("publishBtn").addEventListener("click", (e) => {
                e.preventDefault();
                publishItem();
            });

            $("imgInput").addEventListener("change", (e) => handleMediaFiles(e.target.files));
            $("vidInput").addEventListener("change", (e) => handleMediaFiles(e.target.files));

            // Modal Closes
            $("closePublishModal").addEventListener("click", () => $("publishModal").classList.remove("active"));
            $("closeSearchModal").addEventListener("click", () => $("searchModal").classList.remove("active"));
            $("closeCommentsModal").addEventListener("click", () => $("commentsModal").classList.remove("active"));
            $("closeTextModal").addEventListener("click", () => $("textModal").classList.remove("active"));

            // Search
            $("searchBtn").addEventListener("click", () => $("searchModal").classList.add("active"));
            $("doSearchBtn").addEventListener("click", doSearch);
            $("searchInput").addEventListener("keypress", (e) => { if (e.key === "Enter") doSearch(); });

            // Comment
            $("sendCommentBtn").addEventListener("click", sendComment);
            $("inCommentText").addEventListener("keypress", (e) => { if (e.key === "Enter") sendComment(); });

            // Drawer
            $("menuBtn").addEventListener("click", () => {
                $("drawer").classList.add("active");
                $("drawerBackdrop").classList.add("active");
            });
            $("drawerBackdrop").addEventListener("click", () => {
                $("drawer").classList.remove("active");
                $("drawerBackdrop").classList.remove("active");
            });

            // Drawer Items
            $("btnAbout").addEventListener("click", () => showTextModal("about", "about_text"));
            $("btnHowTo").addEventListener("click", () => showTextModal("how_to_use", "how_to_text"));
            $("btnPrivacy").addEventListener("click", () => showTextModal("privacy", "privacy_text"));
            $("btnTerms").addEventListener("click", () => showTextModal("terms", "terms_text"));

            // Lang Buttons
            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.addEventListener("click", () => setLang(btn.dataset.lang));
            });

            // Auto Hash Deep Linking (#item=ID)
            if (window.location.hash.includes("#item=")) {
                const targetId = window.location.hash.replace("#item=", "");
                setTimeout(() => openItemInFeed(targetId), 300);
            }
        });
    </script>
</body>
</html>
