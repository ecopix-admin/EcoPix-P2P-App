<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>ARWORLD — Real-World Search</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#070a10;--p:#101722ee;--line:#263244;--txt:#f5f7fb;--muted:#9aa8bb;--a:#55e6a5;--b:#62a8ff}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{border:0;color:inherit;cursor:pointer}.screen{position:absolute;inset:0;display:none}.screen.on{display:block}.top{position:absolute;z-index:20;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;background:linear-gradient(#070a10dd,transparent)}.logo{font-size:18px;font-weight:900;margin-right:auto}.logo b{color:var(--a)}.ico{width:42px;height:42px;border-radius:13px;background:#111927dd;border:1px solid var(--line);display:grid;place-items:center}.search{position:absolute;z-index:21;top:72px;left:14px;right:14px;display:flex;gap:8px}.search input{flex:1;min-width:0;height:48px;border-radius:15px;border:1px solid var(--line);background:#0d141eee;color:#fff;padding:0 14px;outline:0}.search button,.primary{background:var(--a);color:#06130c;font-weight:900}.search button{border-radius:15px;padding:0 15px}.map{position:absolute;inset:0}.loc{position:absolute;z-index:20;right:15px;bottom:122px}.bottom{position:absolute;z-index:30;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;background:#0c121ddd;border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px)}.nav{background:transparent;border-radius:14px;padding:8px 3px;color:var(--muted);font-size:11px}.nav b{display:block;font-size:19px}.nav.active{background:#1a2533;color:var(--a)}.sheet{position:absolute;z-index:60;left:10px;right:10px;bottom:10px;max-height:80dvh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:24px;padding:14px;display:none;box-shadow:0 18px 50px #0009;backdrop-filter:blur(20px)}.sheet.on{display:block}.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.head h2{font-size:18px;margin:0;flex:1}.close{width:38px;height:38px;border-radius:12px;background:#182231}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0a1019;color:#fff;border-radius:13px;padding:11px;outline:0}.field textarea{min-height:80px}.row{display:flex;gap:8px}.row .field{flex:1}.primary,.secondary{width:100%;padding:13px;border-radius:14px;margin-top:7px}.secondary{background:#182231;border:1px solid var(--line)}.results{display:grid;gap:8px}.result{padding:11px;border:1px solid var(--line);background:#111a26;border-radius:15px}.result small{display:block;color:var(--muted);margin-top:3px}.result button{margin-top:8px;background:#1d2a3b;padding:7px 10px;border-radius:9px}.chips{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.chip{white-space:nowrap;padding:8px 10px;background:#182231;border:1px solid var(--line);border-radius:12px;font-size:12px}.chip.on{border-color:var(--a);color:var(--a)}.toast{position:absolute;z-index:100;left:50%;bottom:102px;transform:translate(-50%,20px);opacity:0;background:#f5f7fb;color:#071019;padding:10px 15px;border-radius:13px;font-size:13px;font-weight:800;transition:.2s;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
#ar{background:#05080c}.camera{position:absolute;inset:0}.camera video{width:100%;height:100%;object-fit:cover;opacity:.72}.shade{position:absolute;inset:0;background:linear-gradient(#0005,transparent 35%,#0009)}.arhead{position:absolute;z-index:5;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px;display:flex;gap:9px;align-items:center;background:linear-gradient(#05080cdd,transparent)}.arhead strong{flex:1}.arstatus{color:var(--a);font-size:11px}.cross{position:absolute;z-index:3;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);opacity:.65}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{width:34px;height:1px;top:17px}.cross:after{height:34px;width:1px;left:17px}.arobjects{position:absolute;inset:0;z-index:4}.card{position:absolute;width:172px;transform:translate(-50%,-50%);padding:10px;border:1px solid #fff3;background:#101823e8;border-radius:16px;box-shadow:0 12px 30px #0008;backdrop-filter:blur(10px)}.card strong{display:block;font-size:13px}.card small{display:block;color:#aab6c6;margin-top:3px}.card em{display:block;color:var(--a);font-size:11px;margin-top:5px;font-style:normal}.card button{margin-top:7px;background:#1d2a3b;padding:6px 8px;border-radius:9px;font-size:11px}.arbottom{position:absolute;z-index:6;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}.arbottom button{flex:1;padding:13px;border-radius:15px;background:#111a27dd;border:1px solid var(--line)}.arbottom .accent{background:var(--a);color:#06130c;font-weight:900}.empty{text-align:center;color:var(--muted);padding:25px 10px}.profile{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--a));display:grid;place-items:center;color:#06100b;font-weight:900}.leaflet-control-zoom a{background:#111a27!important;color:#fff!important;border-color:#263244!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#101722;color:#fff}.leaflet-container{font:12px system-ui}@media(min-width:800px){.bottom{left:50%;right:auto;width:520px;transform:translateX(-50%)}.sheet{left:auto;width:430px;right:18px}}
</style></head><body><div id="app">
<section id="home" class="screen on"><div class="top"><div class="logo">AR<b>WORLD</b></div><button class="ico" id="profile">◎</button></div><div class="search"><input id="q" placeholder="Real dünyada nə axtarırsan?"><button id="go">Axtar</button></div><div id="map" class="map"></div><button id="myloc" class="ico loc">⌖</button><div class="bottom"><button class="nav active"><b>⌂</b>Xəritə</button><button class="nav" id="arOpen"><b>◉</b>AR Scan</button><button class="nav" id="addOpen"><b>＋</b>Yerləşdir</button><button class="nav" id="discover"><b>◇</b>Kəşf</button></div><div id="toast" class="toast"></div><div id="searchSheet" class="sheet"><div class="head"><h2>Real-World Search</h2><button class="close" data-close="searchSheet">×</button></div><div class="chips" id="chips"><button class="chip on" data-t="">Hamısı</button><button class="chip" data-t="service">Usta</button><button class="chip" data-t="vehicle">Maşın</button><button class="chip" data-t="business">Biznes</button><button class="chip" data-t="building">Obyekt</button><button class="chip" data-t="tourism">Turizm</button></div><div id="results" class="results"></div></div></section>
<section id="ar" class="screen"><div class="camera"><video id="video" playsinline muted></video><div class="shade"></div><div class="cross"></div><div id="arobjects" class="arobjects"></div></div><div class="arhead"><button class="ico" id="arBack">‹</button><strong>ARWORLD · Ətrafımda</strong><span id="arstatus" class="arstatus">GPS...</span></div><div class="arbottom"><button id="arRefresh">↻ Yenilə</button><button id="arAdd" class="accent">＋ Obyekt</button><button id="arMap">Xəritə</button></div></section>
<div id="addSheet" class="sheet"><div class="head"><h2>Fiziki dünyaya əlavə et</h2><button class="close" data-close="addSheet">×</button></div><div class="field"><label>Tip</label><select id="type"><option value="person">Profil</option><option value="business">Biznes</option><option value="service">Xidmət / Usta</option><option value="vehicle">Maşın</option><option value="building">Bina / Obyekt</option><option value="tourism">Turizm / Məkan</option><option value="media">Foto / Video</option><option value="info">Məlumat</option></select></div><div class="field"><label>Başlıq</label><input id="title" placeholder="Məsələn: Peşəkar alçıpan ustası"></div><div class="field"><label>Məlumat</label><textarea id="desc" placeholder="İnsanların görəcəyi məlumat..."></textarea></div><div class="row"><div class="field"><label>Enlik</label><input id="lat" inputmode="decimal"></div><div class="field"><label>Uzunluq</label><input id="lng" inputmode="decimal"></div></div><div class="field"><label>Əlaqə / link</label><input id="contact" placeholder="Telefon və ya sayt"></div><button id="save" class="primary">Bu koordinata yerləşdir</button><button id="pick" class="secondary">Xəritədən koordinat seç</button></div>
<div id="detail" class="sheet"><div class="head"><h2 id="dt">Obyekt</h2><button class="close" data-close="detail">×</button></div><div class="profile"><div class="avatar">AR</div><div><strong id="dtype">Obyekt</strong><small id="ddist"></small></div></div><div class="field"><label>Məlumat</label><div id="ddesc"></div></div><div class="field"><label>Koordinat</label><div id="dcoord" style="font-family:monospace;color:var(--muted)"></div></div><button id="navigate" class="primary">Naviqasiya</button></div>
<div id="profileSheet" class="sheet"><div class="head"><h2>Profilim</h2><button class="close" data-close="profileSheet">×</button></div><div class="profile"><div class="avatar">AR</div><div><strong>ARWORLD istifadəçisi</strong><small>Real dünyadakı rəqəmsal profil</small></div></div><button id="clear" class="secondary">Demo məlumatlarını sil</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let map,markers,LAYER,objects=JSON.parse(localStorage.getItem('arworld_v2')||'[]'),pos=null,selected=null,stream=null;const typeNames={person:'Profil',business:'Biznes',service:'Xidmət / Usta',vehicle:'Maşın',building:'Bina / Obyekt',tourism:'Turizm / Məkan',media:'Media',info:'Məlumat'};const esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const toast=s=>{let e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('on'),2300)};function save(){localStorage.setItem('arworld_v2',JSON.stringify(objects))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function distance(a,b,c,d){let R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,h=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function fd(m){return m<1000?Math.round(m)+' m':'≈ '+(m/1000).toFixed(1)+' km'}function init(){map=L.map('map',{zoomControl:false}).setView([40.4093,49.8671],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);LAYER=L.layerGroup().addTo(map);render();map.on('click',e=>{if($('#addSheet').classList.contains('on'))coords(e.latlng.lat,e.latlng.lng)})}function render(){LAYER.clearLayers();objects.forEach(o=>{let m=L.marker([o.lat,o.lng]).addTo(LAYER);m.bindPopup('<b>'+esc(o.title)+'</b><br>'+esc(typeNames[o.type])+'<br><button onclick="window.openObj(\''+o.id+'\')">Ətraflı</button>')})}window.openObj=id=>{let o=objects.find(x=>x.id===id);if(o)detail(o)}function coords(a,b){$('#lat').value=a.toFixed(6);$('#lng').value=b.toFixed(6);map.setView([a,b],17)}function myloc(){if(!navigator.geolocation)return toast('GPS dəstəklənmir');navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};coords(pos.lat,pos.lng);toast('Mövqeniz seçildi')},()=>toast('GPS icazəsi verilmədi'),{enableHighAccuracy:true,timeout:9000})}function openAdd(){ $('#addSheet').classList.add('on');if(pos)coords(pos.lat,pos.lng);else{let c=map.getCenter();coords(c.lat,c.lng)}}function detail(o){selected=o;$('#dt').textContent=o.title;$('#dtype').textContent=typeNames[o.type]||'Obyekt';$('#ddesc').textContent=o.desc||'Əlavə məlumat yoxdur.';$('#dcoord').textContent=o.lat.toFixed(6)+', '+o.lng.toFixed(6);$('#ddist').textContent=pos?fd(distance(pos.lat,pos.lng,o.lat,o.lng)):'';$('#detail').classList.add('on')}async function search(q){q=q.trim();if(!q)return;$('#searchSheet').classList.add('on');$('#results').innerHTML='<div class="empty">Axtarılır…</div>';let cs=q.split(',').map(Number);if(cs.length===2&&cs.every(Number.isFinite)){coords(cs[0],cs[1]);show([{title:'Koordinat',desc:q,lat:cs[0],lng:cs[1]}]);return}try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&q='+encodeURIComponent(q));let d=await r.json();show(d.map(x=>({title:x.display_name.split(',').slice(0,2).join(','),desc:x.display_name,lat:+x.lat,lng:+x.lon})))}catch(e){$('#results').innerHTML='<div class="empty">Axtarış alınmadı.</div>'}}function show(items){let box=$('#results');box.innerHTML='';if(!items.length){box.innerHTML='<div class="empty">Nəticə yoxdur.</div>';return}items.forEach(x=>{let d=document.createElement('div');d.className='result';d.innerHTML='<b>'+esc(x.title)+'</b><small>'+esc(x.desc)+'</small><button>Bu məkanı seç</button>';d.querySelector('button').onclick=()=>{coords(x.lat,x.lng);$('#searchSheet').classList.remove('on');toast('Məkan seçildi — Yerləşdir düyməsinə basın')};box.appendChild(d)});let local=objects.filter(o=>(o.title+' '+o.desc).toLowerCase().includes($('#q').value.toLowerCase()));local.forEach(o=>{let d=document.createElement('div');d.className='result';d.innerHTML='<b>'+esc(o.title)+'</b><small>'+esc(typeNames[o.type])+'</small><button>Obyekti aç</button>';d.querySelector('button').onclick=()=>detail(o);box.appendChild(d)})}function add(){let title=$('#title').value.trim(),lat=+$('#lat').value,lng=+$('#lng').value;if(!title||!Number.isFinite(lat)||!Number.isFinite(lng))return toast('Başlıq və düzgün koordinat lazımdır');objects.push({id:uid(),type:$('#type').value,title,desc:$('#desc').value.trim(),contact:$('#contact').value.trim(),lat,lng});save();render();$('#addSheet').classList.remove('on');toast('Obyekt yaradıldı');map.setView([lat,lng],17)}async function openAR(){switchScreen('ar');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('#video').srcObject=stream;await $('#video').play()}catch(e){toast('Kamera icazəsi yoxdur — AR görünüşü xəritə obyektləri ilə işləyir')}renderAR()}function renderAR(){let box=$('#arobjects');box.innerHTML='';if(!pos){$('#arstatus').textContent='GPS yoxdur';return}$('#arstatus').textContent='GPS aktiv · '+objects.length+' obyekt';let a=objects.map(o=>({...o,d:distance(pos.lat,pos.lng,o.lat,o.lng)})).filter(o=>o.d<5000).sort((a,b)=>a.d-b.d).slice(0,18);if(!a.length){box.innerHTML='<div class="empty" style="position:absolute;top:58%;left:50%;transform:translateX(-50%);width:90%">Yaxınlıqda obyekt yoxdur.<br> xəritədən obyekt əlavə edin.</div>';return}a.forEach((o,i)=>{let ang=i*137.5*Math.PI/180,r=30+Math.min(i,7),x=50+Math.cos(ang)*r,y=45+Math.sin(ang)*r*.65,e=document.createElement('div');e.className='card';e.style.left=x+'%';e.style.top=y+'%';e.innerHTML='<strong>'+esc(o.title)+'</strong><small>'+esc(typeNames[o.type])+'</small><em>'+fd(o.d)+'</em><button>Ətraflı</button>';e.querySelector('button').onclick=()=>detail(o);box.appendChild(e)})}function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}function switchScreen(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}$('#go').onclick=()=>search($('#q').value);$('#q').onkeydown=e=>{if(e.key==='Enter')search($('#q').value)};$('#myloc').onclick=myloc;$('#addOpen').onclick=openAdd;$('#arOpen').onclick=openAR;$('#arAdd').onclick=openAdd;$('#arRefresh').onclick=()=>pos?renderAR():myloc();$('#arBack').onclick=()=>{stop();switchScreen('home')};$('#arMap').onclick=()=>{stop();switchScreen('home')};$('#save').onclick=add;$('#pick').onclick=()=>{$('#addSheet').classList.remove('on');toast('İndi xəritədə nöqtəyə toxunun')};$('#profile').onclick=()=>$('#profileSheet').classList.add('on');$('#clear').onclick=()=>{objects=[];save();render();$('#profileSheet').classList.remove('on');toast('Demo məlumatları silindi')};$('#discover').onclick=()=>{show(objects.map(o=>({title:o.title,desc:typeNames[o.type],lat:o.lat,lng:o.lng})));$('#searchSheet').classList.add('on')};$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('on'));$('#navigate').onclick=()=>{if(selected)location.href='https://www.google.com/maps/dir/?api=1&destination='+selected.lat+','+selected.lng};$('#chips').onclick=e=>{let b=e.target.closest('.chip');if(!b)return;$$('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');let t=b.dataset.t;let a=t?objects.filter(o=>o.type===t):objects;show(a.map(o=>({title:o.title,desc:typeNames[o.type],lat:o.lat,lng:o.lng})))};init();navigator.geolocation?.watchPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};if($('#ar').classList.contains('on'))renderAR()})})();
</script></body></html>
