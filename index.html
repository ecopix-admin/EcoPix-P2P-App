<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canlı Sözlər — demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f7f8ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}
.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111522;position:sticky;top:0;z-index:5;border-bottom:1px solid #252b3c}
.logo{font-size:23px;font-weight:900;letter-spacing:-1px}.logo b{color:#63e6ff}.hint{color:#aeb7cc;font-size:12px}
.feed{width:min(560px,100%);margin:18px auto;padding:0 10px}.post{height:690px;position:relative;overflow:hidden;border-radius:22px;margin:18px 0;border:1px solid #2a3043;background:#171b2a}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:92px;overflow:hidden}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#080a12e8 0%,transparent 45%,#080a1255 100%)}
.one{background:radial-gradient(circle at 70% 22%,#ffd66b,transparent 12%),linear-gradient(145deg,#5b213e,#101b4c)}
.two{background:radial-gradient(circle at 30% 28%,#8df1ff,transparent 10%),linear-gradient(145deg,#073a4b,#16163d)}
.three{background:radial-gradient(circle at 70% 35%,#ff9e83,transparent 13%),linear-gradient(145deg,#321c3e,#c55e48)}
.four{background:linear-gradient(145deg,#204f46,#102b3d)}
.five{background:radial-gradient(circle at 55% 27%,#fff0ab,transparent 9%),linear-gradient(145deg,#394d7c,#17192f)}
.six{background:linear-gradient(145deg,#1b243a,#74324e)}.seven{background:linear-gradient(145deg,#614d2f,#0e2831)}
.eight{background:linear-gradient(145deg,#2e205b,#9d4e8d)}.nine{background:linear-gradient(145deg,#182f28,#6d8e6e)}
.ten{background:linear-gradient(145deg,#3d1f24,#c46e42)}.eleven{background:linear-gradient(145deg,#282d55,#3d8a9a)}.twelve{background:linear-gradient(145deg,#29202f,#bd5272)}
.scene small{position:relative;z-index:1;font-size:12px;letter-spacing:3px;color:#ffffff99;margin-top:180px}
.topinfo,.meta,.tools{position:absolute;left:18px;right:18px;z-index:2}.topinfo{top:18px;display:flex;justify-content:space-between;color:#dce5ff}.live{color:#8affbf}.meta{bottom:68px}.meta strong{font-size:16px}.meta p{color:#d3d8e5;margin:8px 0 0;max-width:410px}.tools{bottom:15px;display:flex;gap:8px;align-items:center}
button{border:0;border-radius:12px;padding:10px 13px;color:#fff;background:#ffffff1c;cursor:pointer}button:hover{background:#63e6ff33}.heart.active{background:#ff53834d;color:#ff7c9d}
.open{margin-left:auto;background:#63e6ff22;color:#8eecff}.count{color:#aeb7cc;font-size:12px}.badge{font-size:11px;border:1px solid #ffffff33;border-radius:9px;padding:6px 8px;color:#d6dcf0}
.words{position:absolute;z-index:3;left:16px;right:16px;top:90px;display:flex;flex-direction:column;gap:8px;pointer-events:none}.word{align-self:flex-start;max-width:90%;background:#050711c9;border:1px solid #ffffff36;border-radius:13px;padding:9px 12px;box-shadow:0 6px 20px #0005;animation:in .25s ease}.word b{color:#83ebff;font-size:11px}.word em{font-style:normal;color:#bdc5d8;font-size:11px;margin-left:8px}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.sheet{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:flex-end}.sheet.show{display:flex}.panel{width:min(560px,100%);margin:auto;background:#151a29;border:1px solid #31384d;border-radius:22px 22px 0 0;padding:20px}.panel h2{margin:0 0 14px}.panel textarea{width:100%;height:80px;resize:none;background:#0b0e17;color:#fff;border:1px solid #384158;border-radius:12px;padding:12px;font:inherit}.row{display:flex;gap:8px;align-items:center;margin-top:12px}.row label{color:#aeb7cc}.row button{border:1px solid #384158;background:#20283b}.row button.sel{border-color:#63e6ff;color:#63e6ff}.send{margin-left:auto;background:#65e7ff;color:#061018;font-weight:800}.close{background:transparent;color:#aeb7cc}.note{text-align:center;color:#8d98b2;font-size:12px;margin:14px}
</style>
</head>
<body>
<header class="top"><div class="logo">canlı<b>·</b>sözlər</div><div class="hint">Videonun üstünə öz sözünü yaz</div></header>
<main class="feed" id="feed"></main>
<div class="sheet" id="sheet"><div class="panel">
<h2>Videoya ürək sözün</h2><textarea id="txt" maxlength="90" placeholder="Məsələn: Bu bizim mahnımızdır..."></textarea>
<div class="row"><label>Görünmə müddəti:</label><button data-sec="30" class="sel">30 san</button><button data-sec="60">60 san</button><button data-sec="90">90 san</button></div>
<div class="row"><button class="close" id="cancel">Ləğv et</button><button class="send" id="send">Videonun üstünə əlavə et</button></div>
</div></div>
<script>
const posts=[
["one","🌅","Lalə","Günəş batanda şəhər başqa cür görünür.","Bakı sahili"],["two","🌊","Murad","Bu səs mənə uşaqlığımı xatırladır.","Dəniz səsi"],["three","🌹","Aysel","Bəzi xatirələr heç vaxt silinmir.","Romantik an"],["four","🌲","Nihat","Sakitlik də bəzən cavabdır.","Meşədə səhər"],["five","🏔️","Kamal","Bu mənzərəni birlikdə görəcəyik.","Dağ yolu"],["six","🎧","Zəhra","Bu mahnını kim tanıyır?","Gecə musiqisi"],["seven","🚗","Elvin","Yolun özü də hekayədir.","Uzun yol"],["eight","🌃","Sevinc","Şəhərin işıqları altında bir arzu.","Gecə şəhəri"],["nine","☕","Rauf","Səhər qəhvəsi və yeni başlanğıc.","Sakit səhər"],["ten","🔥","Nərgiz","Bu gecə unudulmaz olacaq.","Dostlarla gecə"],["eleven","🌧️","Tural","Yağışlı havanın öz romantikası var.","Yağış sonrası"],["twelve","🎈","Günel","Bu anı saxlayın, sonra darıxacağıq.","Xatirə günü"]
];
const feed=document.getElementById("feed");let active=null, duration=30;
posts.forEach((p,i)=>{const el=document.createElement("article");el.className="post";el.dataset.id=i;el.innerHTML=`
<div class="scene ${p[0]}"><span>${p[1]}</span><small>${p[4].toUpperCase()}</small></div>
<div class="topinfo"><span class="live">● CANLI</span><span>${i+1} / ${posts.length}</span></div>
<div class="words"></div><div class="meta"><strong>@${p[2]}</strong><p>${p[3]}</p></div>
<div class="tools"><button class="heart">♡ <span>0</span></button><span class="count">bəyənmə</span><button class="open">✍ Videonun üstünə yaz</button></div>`;feed.appendChild(el)});
document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{duration=+b.dataset.sec;document.querySelectorAll("[data-sec]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
document.querySelectorAll(".open").forEach(b=>b.onclick=()=>{active=b.closest(".post");document.getElementById("txt").value="";document.getElementById("sheet").classList.add("show");document.getElementById("txt").focus()});
document.getElementById("cancel").onclick=()=>document.getElementById("sheet").classList.remove("show");
document.getElementById("send").onclick=()=>{const t=document.getElementById("txt").value.trim();if(!t)return alert("Əvvəlcə qısa söz yazın.");const w=document.createElement("div");w.className="word";w.innerHTML=`<b>SƏN</b> <em>${duration} saniyə</em><br>${esc(t)}<br><button class="mini">♡ <span>0</span></button>`;active.querySelector(".words").appendChild(w);document.getElementById("sheet").classList.remove("show");w.querySelector(".mini").onclick=()=>{const n=w.querySelector("span");n.textContent=+n.textContent+1;const h=active.querySelector(".heart"),c=h.querySelector("span");c.textContent=+c.textContent+1;w.querySelector("em").textContent=(duration+Math.min(+n.textContent*5,120))+" saniyə"}};
document.querySelectorAll(".heart").forEach(b=>b.onclick=()=>{b.classList.toggle("active");const n=b.querySelector("span");n.textContent=+n.textContent+(b.classList.contains("active")?1:-1)});
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script>
</body>
</html>
